name = "ekodi-community"
main = "community-worker.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "community.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[assets]
directory = "./community"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
