# EKODI-QTIN-GROUP-ORDER-001 — 큐티인 월간 공동구매(에코디교회·에코디선교회 공용)
name = "ekodi-qtin-order"
main = "qtin-order-entry.js"
compatibility_date = "2026-10-14"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ekodi.kr/qtin*"
zone_name = "ekodi.kr"

# 00:00 KST(15:00 UTC) and 12:00 KST(03:00 UTC): prepare next issue on the 14th–25th,
# sync QTM prices/covers, expire unpaid applications, anonymize old personal data.
[triggers]
# Every 30 min (:15/:45): paid-order and final-order-approval phone notices only.
crons = ["0 15 * * *", "0 3 * * *", "15,45 * * * *"]

[vars]
ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://ekodi.kr/qtin"
OPERATOR_EMAILS = "topmaster.joseph@gmail.com,joseph@ekodibiz.kr"
QTM_SEED_ITEM_IDS = "1719304225,1719305039,1719304141"
# EKODI(MID q_ekodib62hb) Toss Payments — TEST key: only signed-in operators/staff can pay
# (labelled test orders, excluded from totals). Public checkout opens only with a live_ key.
# TOSS_SECRET_KEY is a Worker secret only (never in this file, the repo or D1);
# readiness stays closed until that secret is registered.
PAYMENTS_ENABLED = "true"
# Verified live paid orders only; test transactions remain silent.
QTIN_OPERATOR_NOTIFY_ENABLED = "true"
# 결제위젯 결제 UI variantKey: "qtin" UI → 큐티인 MID q_ekodib62hb (EKODIPAY는 단일 MID q_ekodib62hb만 사용)
TOSS_WIDGET_VARIANT = "qtin"
TOSS_CLIENT_KEY = "test_ck_oEjb0gm23P450e7wmE6o3pGwBJn5"

# Private Control API RPC; not an internet-facing notification endpoint.
[[services]]
binding = "OPERATOR_NOTIFY"
service = "ekodi-auth-api"
entrypoint = "OperatorNotifier"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
