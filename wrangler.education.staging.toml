name = "ekodi-education-staging"
main = "education-worker.js"
compatibility_date = "2026-08-22"
workers_dev = true
preview_urls = false

[vars]
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=edu"

[assets]
directory = "./education"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
