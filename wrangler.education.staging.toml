name = "ekodi-education-staging"
main = "education-worker.js"
compatibility_date = "2026-08-22"
workers_dev = true
preview_urls = false

[vars]
# Instructor studio/presenter access: "open" (no password, instructor decision 2026-10-22) or "locked".
EDU_INSTRUCTOR_GATE_MODE = "open"
# Instructor gate verifier (PBKDF2, random ~79-bit password; see education-instructor-gate.js). Not a secret.
EDU_INSTRUCTOR_GATE = "pbkdf2-sha256$100000$EIuDPHsCJbnpyAo0yx7INg$MXcuZEwBcx8KyAurTvhEYvRe6lOSN4WmwuzAwriyrQk"
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
EDU_SCREEN_SHARE_ENABLED = "false"
AUTH_URL = "https://ekodi.kr/auth/?site=edu"

# One-time classroom QR rooms; SQLite DO is supported on Workers Free.
[[durable_objects.bindings]]
name = "EDU_SCREEN_ROOMS"
class_name = "EducationScreenRoom"

[[migrations]]
tag = "education-screen-room-v1"
new_sqlite_classes = ["EducationScreenRoom"]

[assets]
directory = "./education"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
