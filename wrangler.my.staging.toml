name = "ekodi-my-staging"
main = "my-worker.js"
compatibility_date = "2026-08-16"
workers_dev = true
preview_urls = false

[vars]
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=my"

[assets]
directory = "./my"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
