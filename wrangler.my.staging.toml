name = "ekodi-my-staging"
main = "my-worker.js"
compatibility_date = "2026-08-16"
workers_dev = true
preview_urls = false

[vars]
# Isolated staging reads the DEVELOPMENT Supabase project only (#6739).
# The publishable key is public by design; data access is enforced by RLS and
# authenticated RPCs. Production project values never appear in this file.
DATA_ENABLED = "true"
POINTS_ENABLED = "true"
SUPABASE_URL = "https://lxcxwbdwwojjkgybbqii.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SyaM4rBxa1JdE9arZrhULg_z1BIQRXL"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://ekodi.kr/auth/?site=my"

[[ratelimits]]
name = "CARD_EXCHANGE_RATE_LIMITER"
namespace_id = "3905"
[ratelimits.simple]
limit = 8
period = 60

[assets]
directory = "./my"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
