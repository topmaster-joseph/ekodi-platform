name = "ekodi-local-commerce"
main = "local-commerce-worker.js"
compatibility_date = "2026-09-04"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "ekodi.kr/local-commerce*"
zone_name = "ekodi.kr"

[vars]
DATA_MODE = "production"
AUTH_URL = "https://ekodi.kr/auth/?site=local-commerce"
API_BASE = "https://ekodi.kr/api/local-commerce"
SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"

[assets]
directory = "./local-commerce"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
