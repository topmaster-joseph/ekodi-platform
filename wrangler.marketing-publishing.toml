name = "ekodi-marketing-publishing-api"
main = "marketing-publishing-worker.js"
compatibility_date = "2026-08-18"
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
ALLOW_MUTATIONS = "true"
ALLOWED_ORIGINS = "https://ekodi.kr"
[observability.logs]
enabled = true
invocation_logs = true

[[services]]
binding = "MARKETING_GROWTH"
service = "ekodi-marketing-growth"
entrypoint = "MarketingGrowthPublisher"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
