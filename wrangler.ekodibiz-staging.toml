name = "ekodibiz-revenue-os-staging"
main = "ekodibiz-worker.js"
compatibility_date = "2026-08-28"
workers_dev = true
preview_urls = false

[vars]
EKODIBIZ_MODE = "isolated-staging"
PAYMENT_SERVICE_URL = "https://pay.ekodi.kr"
HIGH_IMPACT_APPROVAL = "required"

[assets]
directory = "./ekodibiz"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
