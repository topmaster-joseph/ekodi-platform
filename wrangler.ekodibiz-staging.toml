name = "ekodibiz-revenue-os-staging"
main = "ekodibiz-payment-architecture.js"
compatibility_date = "2026-08-28"
workers_dev = true
preview_urls = false

[vars]
EKODIBIZ_MODE = "isolated-staging"
PAYMENT_CORE_URL = "https://pay.ekodi.kr"
PAYMENT_GATEWAY_URL = "https://ekodi.kr/ekodibiz/pay"
HIGH_IMPACT_APPROVAL = "required"
AI_OPERATIONS_MODE = "rules-first"

[assets]
directory = "./ekodibiz"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "REVENUE_STORE"
class_name = "RevenueStore"

[exports.RevenueStore]
type = "durable-object"
storage = "sqlite"

[observability.logs]
enabled = true
