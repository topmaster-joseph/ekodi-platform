name = "ekodi-insurance"
main = "worker.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "ins.ekodi.kr"
custom_domain = true

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/", "/health", "/advisor", "/advisor/", "/admin", "/admin/" ]

[observability.logs]
enabled = true
invocation_logs = true
