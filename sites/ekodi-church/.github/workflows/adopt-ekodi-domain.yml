name: Adopt EKODI Canonical Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adopt-ekodi-domain.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Update canonical metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          canonical = '  <link rel="canonical" href="https://ekodi.kr/ekodichurch/">\n'
          og = '  <meta property="og:url" content="https://ekodi.kr/ekodichurch/">\n'
          anchor = '  <title>EKODI교회 | 에클레시아 · 코이노니아 · 디아스포라</title>\n'
          if canonical not in text:
              text = text.replace(anchor, anchor + canonical + og, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical domain
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use ekodi.kr/ekodichurch as canonical domain'
          git push
