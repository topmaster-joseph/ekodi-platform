name: Validate EKODI Church Community Identity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - '.github/workflows/normalize-community-brand.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'script.js'
      - '.github/workflows/normalize-community-brand.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Normalize only obsolete spelling without changing ministry identity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # 에코디선교회 and 에코디커뮤니티 are distinct current identities.
          # Only normalize the obsolete mixed-script spelling.
          text = text.replace('EKODI선교회', '에코디선교회')

          # Keep the public header compact; social discovery belongs in the
          # online/social area rather than a permanent top-level header item.
          social = '<a data-ekodi-social="true" href="https://social.ekodi.kr/?org=church">Social</a>'
          text = text.replace(social, '')

          required = [
              '<h3>에코디선교회</h3>',
              '에코디선교회 · 선교헌금',
              '에코디커뮤니티 채널 ↗',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Current Church community identity contract missing: {missing}')
          if 'EKODI선교회' in text:
              raise SystemExit('Obsolete mixed-script mission name remains')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify current Church and Community link contract
        run: |
          grep -Fq "에코디선교회" index.html
          grep -Fq "에코디커뮤니티 채널 ↗" index.html
          grep -Fq "https://www.youtube.com/@ekodicommunity" index.html
          grep -Fq "https://community.ekodi.kr" script.js
      - name: Commit normalized source on main only
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'EKODI Automation'
          git config user.email 'automation@ekodi.kr'
          git add index.html
          git commit -m 'Normalize Church community identity safely'
          git push
