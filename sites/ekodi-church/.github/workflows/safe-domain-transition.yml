name: Enforce Church Canonical Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-domain-transition.yml'

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Enforce canonical path metadata
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          canonical='  <link rel="canonical" href="https://ekodi.kr/ekodichurch/">\n'
          if 'rel="canonical"' in text:
              text=re.sub(r'\s*<link rel="canonical" href="[^"]+">\s*','\n'+canonical,text,count=1)
          else:
              text=text.replace('</title>\n','</title>\n'+canonical,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use ekodi.kr/ekodichurch as canonical path'
          git push
