<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공지 · 서남권 국립의대 소통센터</title>
<meta name="description" content="서남권 국립의대 소통센터 공지 게시판">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}button,input,textarea{font:inherit;color:inherit}button{border:1px solid #111;background:#111;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.secondary{background:#fff;color:#111}.site-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd}.inner,main,footer{width:min(960px,calc(100% - 24px));margin:0 auto}.head{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;color:#111;text-decoration:none}.site-nav{display:flex;gap:14px;overflow-x:auto;white-space:nowrap;padding:8px 0;border-top:1px solid #eee}.site-nav a{color:#111;text-decoration:none;font-size:14px}.site-nav a.active{font-weight:800}main{flex:1;padding-bottom:30px}.page-head{display:flex;justify-content:space-between;gap:14px;padding:17px 0 12px;border-bottom:1px solid #ddd}.eyebrow{margin:0 0 3px;font-size:11px;font-weight:800;letter-spacing:.08em}.page-head h1{margin:0;font-size:25px}.note,.muted{color:#626262;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}.panel{margin:10px 0;padding:12px;border:1px solid #ddd;border-radius:10px}.panel[hidden]{display:none}.panel label{display:grid;gap:5px;margin:8px 0;font-weight:700;font-size:13px}.panel input,.panel textarea{width:100%;border:1px solid #bbb;border-radius:7px;padding:9px;background:#fff}.form-actions{display:flex;gap:7px;align-items:center}.toolbar{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #ddd}.toolbar input{flex:1;border:1px solid #bbb;border-radius:8px;padding:9px}.notice{padding:13px 0;border-bottom:1px solid #e5e5e5}.notice>a{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;color:#111;text-decoration:none}.thumb{width:90px;height:62px;border:1px solid #ddd;border-radius:8px;object-fit:cover}.placeholder{display:grid;place-items:center;background:#f6f6f6;color:#666}.notice h2{margin:0 0 5px;font-size:17px}.notice p{margin:0;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice time{font-size:12px;color:#666}.pin{font-size:11px;border:1px solid #aaa;border-radius:999px;padding:2px 6px;margin-left:6px}.row-actions{display:flex;gap:6px;margin:8px 0 0 102px}.row-actions button{padding:5px 8px;font-size:12px}.detail{padding:16px 0}.detail h1{font-size:24px}.detail-body{white-space:pre-wrap;line-height:1.6}.images{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.images img{width:100%;border-radius:8px}.detail-actions{display:flex;gap:7px;margin-top:14px}.preview{display:flex;gap:8px;flex-wrap:wrap}.preview img{width:110px;height:80px;object-fit:cover;border-radius:7px}.empty{padding:30px 0;color:#666}footer{margin-top:auto;padding:20px 0 max(28px,env(safe-area-inset-bottom));border-top:1px solid #ddd;color:#666;font-size:13px;display:flex;justify-content:space-between;gap:12px}footer a{color:#111}
@media(max-width:680px){.page-head{display:block}.actions{margin-top:9px}.notice>a{grid-template-columns:72px 1fr}.thumb{width:72px;height:54px}.notice time{grid-column:2}.row-actions{margin-left:84px}.images{grid-template-columns:1fr}.toolbar{flex-direction:column}footer{flex-direction:column}}
</style></head><body>
<header class="site-header"><div class="inner"><div class="head"><a class="brand" href="/">서남권 국립의대 소통센터</a><a href="/" style="color:#111;text-decoration:none;font-size:13px">본 사이트로</a></div>
<nav class="site-nav"><a href="/#timeline">활동이력</a><a href="/#channels">소통채널</a><a href="/board">시민의견</a><a href="/finance/">회계</a><a class="active" href="/notices/" aria-current="page">공지</a><a href="/#organization">조직</a></nav></div></header>
<main>
<section class="page-head"><div><p class="eyebrow">NOTICE BOARD</p><h1>공지</h1><p class="note">중요 소식과 공식 안내를 목록·상세 링크로 확인하고 공유할 수 있습니다.</p></div><div class="actions"><button id="writeToggle">게시글 작성</button><button id="adminLogin" class="secondary">로그인</button></div></section>
<form id="writeForm" class="panel" hidden><input type="hidden" name="id"><label>제목<input name="title" maxlength="180" required></label><label>사진 최대 5장 · 장당 5MB<input name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><div id="preview" class="preview"></div><label>내용<textarea name="body" rows="7" maxlength="10000"></textarea></label><div class="form-actions"><button type="submit">저장</button><button id="cancel" class="secondary" type="button">취소</button><span id="formStatus" class="muted"></span></div></form>
<div class="toolbar"><input id="search" placeholder="공지 검색"><span id="status" class="muted" role="status"></span></div>
<section id="detail" class="detail" hidden></section><section id="list"><p class="empty">공지를 불러오는 중입니다.</p></section>
</main><footer><span>서남권 국립의대 소통센터 공지</span><a href="/admin/">관리</a></footer>
<script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])),date=v=>v?new Date(v).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}):'';let items=[],editing=null,files=[];
const token=()=>{try{const p=sessionStorage.getItem('ekodi-auth-token')||'';if(p)return p;const raw=localStorage.getItem('sb-renzehysxirjilvdxacv-auth-token')||'';if(!raw)return'';const x=JSON.parse(raw),s=x?.currentSession||x?.session||x;return String(s?.access_token||'')}catch{return''}};
const authUrl=()=>{const u=new URL('https://ekodi.kr/auth/');u.searchParams.set('site','portal');u.searchParams.set('direct','1');u.searchParams.set('return_to',location.origin+'/notices/?compose=1');return u.href};
async function exchange(){const p=new URLSearchParams(location.hash.replace(/^#/,'')),h=p.get('ekodi_token');if(!h)return;const r=await fetch('/api/seonammedi/admin/auth/exchange',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token_hash:h,type:p.get('ekodi_type')||'email'})}),d=await r.json();if(r.ok&&d.access_token)localStorage.setItem('sb-renzehysxirjilvdxacv-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:d.expires_at||0,user:d.user||null}));history.replaceState(null,'',location.pathname+location.search)}
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'요청을 처리하지 못했습니다.');return d}
function card(x){const img=x.imageUrl?'<img class="thumb" src="'+esc(x.imageUrl)+'" alt="" loading="lazy">':'<span class="thumb placeholder">공지</span>';return '<article class="notice"><a href="/notices/'+x.id+'">'+img+'<div><h2>'+esc(x.title||'공지')+(x.pinned?'<span class="pin">중요</span>':'')+'</h2><p>'+esc(x.body||'')+'</p></div><time>'+esc(date(x.publishedAt||x.updatedAt))+'</time></a>'+(x.canManage?'<div class="row-actions"><button data-edit="'+x.id+'">수정</button><button class="secondary" data-delete="'+x.id+'">삭제</button></div>':'')+'</article>'}
function render(q=''){const needle=q.trim().toLowerCase(),list=needle?items.filter(x=>((x.title||'')+' '+(x.body||'')).toLowerCase().includes(needle)):items;$('list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">등록된 공지가 없습니다.</p>'}
function detail(x){if(!x)return;$('list').hidden=true;$('detail').hidden=false;$('detail').innerHTML='<button id="back" class="secondary">← 목록</button><h1>'+esc(x.title||'공지')+'</h1><small>'+esc(date(x.publishedAt||x.updatedAt))+'</small><div class="detail-body">'+esc(x.body||'')+'</div>'+((x.imageUrls||[]).length?'<div class="images">'+x.imageUrls.map(u=>'<img src="'+esc(u)+'" alt="">').join('')+'</div>':'')+'<div class="detail-actions"><button id="share">공유</button>'+(x.canManage?'<button id="editDetail">수정</button><button id="deleteDetail" class="secondary">삭제</button>':'')+'</div>';$('back').onclick=()=>{history.pushState(null,'','/notices/');$('detail').hidden=true;$('list').hidden=false};$('share').onclick=async()=>{const u=location.origin+'/notices/'+x.id;try{if(navigator.share)await navigator.share({title:x.title||'공지',text:x.body||'',url:u});else{await navigator.clipboard.writeText(u);alert('링크를 복사했습니다.')}}catch{}};if(x.canManage){$('editDetail').onclick=()=>edit(x);$('deleteDetail').onclick=()=>remove(x)}}
async function load(){try{const t=token(),d=await api('/api/seonammedi/notices',{headers:t?{authorization:'Bearer '+t}:{}});items=d.items||[];render($('search').value);const m=location.pathname.match(/^\/notices\/(\d+)\/?$/),x=items.find(v=>Number(v.id)===Number(m?.[1]||0));if(x)detail(x);else{$('detail').hidden=true;$('list').hidden=false}$('adminLogin').hidden=Boolean(t);$('status').textContent=''}catch(e){$('status').textContent=e.message}}
function edit(x){editing=x||null;files=[];const f=$('writeForm');f.reset();f.elements.id.value=x?.id||'';f.elements.title.value=x?.title||'';f.elements.body.value=x?.body||'';$('preview').innerHTML=(x?.imageUrls||[]).map(u=>'<img src="'+esc(u)+'" alt="">').join('');f.hidden=false;$('detail').hidden=true;f.scrollIntoView({block:'start'})}
async function remove(x){if(!confirm('이 공지를 삭제할까요?'))return;await api('/api/seonammedi/notices/'+x.id,{method:'DELETE',headers:{authorization:'Bearer '+token()}});history.replaceState(null,'','/notices/');$('detail').hidden=true;$('list').hidden=false;await load()}
$('writeToggle').onclick=()=>{if(!token()){location.assign(authUrl());return}edit(null)};$('adminLogin').onclick=()=>location.assign(authUrl());$('cancel').onclick=()=>{$('writeForm').reset();$('writeForm').hidden=true;editing=null;files=[]};$('search').oninput=e=>render(e.target.value);
$('writeForm').elements.images.onchange=e=>{files=[...e.target.files].slice(0,5);if([...e.target.files].some(f=>f.size>5*1024*1024)){alert('사진은 장당 5MB 이하만 등록할 수 있습니다.');files=files.filter(f=>f.size<=5*1024*1024)}$('preview').innerHTML=files.map(f=>'<span class="muted">'+esc(f.name)+'</span>').join('')};
$('list').onclick=e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');if(eb){e.preventDefault();edit(items.find(x=>Number(x.id)===Number(eb.dataset.edit)))}if(db){e.preventDefault();const x=items.find(v=>Number(v.id)===Number(db.dataset.delete));if(x)remove(x)}};
$('writeForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value,form=new FormData();form.set('title',f.elements.title.value);form.set('body',f.elements.body.value);for(const file of files)form.append('images',file,file.name);if(id&&!files.length)form.set('keepImageIndexes',JSON.stringify((editing?.imageUrls||[]).map((_,i)=>i)));try{$('formStatus').textContent='저장 중…';const d=await api(id?'/api/seonammedi/notices/'+id:'/api/seonammedi/notices',{method:id?'PUT':'POST',headers:{authorization:'Bearer '+token()},body:form});f.reset();f.hidden=true;editing=null;files=[];$('formStatus').textContent='';await load();const x=items.find(v=>Number(v.id)===Number(d.id));if(x){history.pushState(null,'','/notices/'+x.id);detail(x)}}catch(err){$('formStatus').textContent=err.message}};
window.onpopstate=()=>load();(async()=>{try{await exchange()}catch{}await load();if(new URLSearchParams(location.search).get('compose')==='1'&&token())edit(null)})()})();
</script></body></html>
