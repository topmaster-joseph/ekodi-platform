<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회계 · 서남권 국립의대 소통센터</title>
<meta name="description" content="서남권 국립의대 소통센터 공개 회계내역">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid #111;background:#111;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.secondary{background:#fff;color:#111}.site-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd}.inner,main,footer{width:min(960px,calc(100% - 24px));margin:0 auto}.head{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;color:#111;text-decoration:none}.site-nav{display:flex;gap:14px;overflow-x:auto;white-space:nowrap;padding:8px 0;border-top:1px solid #eee}.site-nav a{color:#111;text-decoration:none;font-size:14px}.site-nav a.active{font-weight:800}main{flex:1;padding-bottom:30px}.page-head{display:flex;justify-content:space-between;gap:14px;padding:17px 0 12px;border-bottom:1px solid #ddd}.eyebrow{margin:0 0 3px;font-size:11px;font-weight:800;letter-spacing:.08em}.page-head h1{margin:0;font-size:25px}.note,.muted{color:#626262;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.summary article{border:1px solid #ddd;border-radius:10px;padding:12px}.summary span{display:block;font-size:12px;color:#666}.summary strong{display:block;margin-top:4px;font-size:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #ddd}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{background:#fff;color:#111;border-color:#bbb;padding:6px 9px;font-size:12px}.filters button.active{background:#111;color:#fff;border-color:#111}.panel{margin:10px 0;padding:12px;border:1px solid #ddd;border-radius:10px}.panel[hidden]{display:none}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.panel label{display:grid;gap:5px;font-weight:700;font-size:13px}.panel input,.panel select,.panel textarea{width:100%;border:1px solid #bbb;border-radius:7px;padding:9px;background:#fff}.wide{grid-column:1/-1}.form-actions{display:flex;gap:7px;align-items:center;margin-top:9px}.ledger{display:grid}.row{display:grid;grid-template-columns:95px 70px 110px 1fr 105px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e5e5e5}.row strong{font-size:14px}.amount{text-align:right;font-weight:800}.income .amount{color:#174f2d}.expense .amount{color:#8a1f1f}.badge{display:inline-flex;border:1px solid #bbb;border-radius:999px;padding:2px 7px;font-size:11px}.row-actions{display:flex;gap:5px;margin-top:7px}.row-actions button{padding:5px 8px;font-size:12px}.empty{padding:30px 0;color:#666}footer{margin-top:auto;padding:20px 0 max(28px,env(safe-area-inset-bottom));border-top:1px solid #ddd;color:#666;font-size:13px;display:flex;justify-content:space-between;gap:12px}footer a{color:#111}
@media(max-width:680px){.page-head{display:block}.actions{margin-top:9px}.summary{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.row{grid-template-columns:78px 58px 1fr;gap:6px}.row .detail{grid-column:1/-1}.row .evidence{grid-column:1/3}.amount{grid-column:3;text-align:right}.toolbar{align-items:flex-start;flex-direction:column}footer{flex-direction:column}}
</style></head><body>
<header class="site-header"><div class="inner"><div class="head"><a class="brand" href="/">서남권 국립의대 소통센터</a><a href="/" style="color:#111;text-decoration:none;font-size:13px">본 사이트로</a></div>
<nav class="site-nav"><a href="/#timeline">활동이력</a><a href="/#channels">소통채널</a><a href="/board">시민의견</a><a class="active" href="/finance/" aria-current="page">회계</a><a href="/notices/">공지</a><a href="/#organization">조직</a></nav></div></header>
<main>
<section class="page-head"><div><p class="eyebrow">TRANSPARENCY</p><h1>회계</h1><p class="note">수입·지출과 증빙 상태를 공개합니다. 개인 후원자의 개인정보는 공개하지 않습니다.</p></div><div class="actions"><button id="manageToggle" hidden>회계내역 등록</button><button id="adminLogin" class="secondary">관리자 로그인</button></div></section>
<section class="summary"><article><span>누적 모금</span><strong id="raised">-</strong></article><article><span>누적 지출</span><strong id="spent">-</strong></article><article><span>현재 잔액</span><strong id="balance">-</strong></article></section>
<div class="toolbar"><div class="filters"><button class="active" data-filter="all">전체</button><button data-filter="income">수입</button><button data-filter="expense">지출</button></div><span id="status" class="muted" role="status"></span></div>
<form id="manageForm" class="panel" hidden><input type="hidden" name="id"><div class="form-grid"><label>일자<input name="date" type="date" required></label><label>구분<select name="type"><option value="income">수입</option><option value="expense">지출</option></select></label><label>금액<input name="amount" type="number" min="0" step="1" required></label><label class="wide">목적·내용<input name="purpose" maxlength="500" required></label><label class="wide">관련 행사<input name="event" maxlength="300"></label><label>증빙<select name="evidenceStatus"><option value="none">없음</option><option value="available">확인 가능</option><option value="verified">확인 완료</option></select></label><label>공개<label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:6px;font-weight:400"><input name="visible" type="checkbox" checked style="width:auto">사이트에 표시</label></label><label class="wide">공개 메모<textarea name="note" rows="3" maxlength="1000"></textarea></label></div><div class="form-actions"><button type="submit">저장</button><button id="cancel" type="button" class="secondary">취소</button><span id="formStatus" class="muted"></span></div></form>
<section id="ledger" class="ledger"><p class="empty">회계내역을 불러오는 중입니다.</p></section>
</main><footer><span>서남권 국립의대 소통센터 공개 회계</span><a href="/admin/">관리</a></footer>
<script>
(()=>{const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ko-KR').format(Number(n||0))+'원',esc=v=>String(v??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));let rows=[],filter='all',admin=false;
const token=()=>{try{const p=sessionStorage.getItem('ekodi-auth-token')||'';if(p)return p;const raw=localStorage.getItem('sb-renzehysxirjilvdxacv-auth-token')||'';if(!raw)return'';const x=JSON.parse(raw),s=x?.currentSession||x?.session||x;return String(s?.access_token||'')}catch{return''}};
const authUrl=()=>{const u=new URL('https://ekodi.kr/auth/');u.searchParams.set('site','portal');u.searchParams.set('direct','1');u.searchParams.set('return_to',location.origin+'/finance/');return u.href};
async function exchange(){const p=new URLSearchParams(location.hash.replace(/^#/,'')),h=p.get('ekodi_token');if(!h)return;const r=await fetch('/api/seonammedi/admin/auth/exchange',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token_hash:h,type:p.get('ekodi_type')||'email'})}),d=await r.json();if(r.ok&&d.access_token)localStorage.setItem('sb-renzehysxirjilvdxacv-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:d.expires_at||0,user:d.user||null}));history.replaceState(null,'',location.pathname)}
async function json(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'요청을 처리하지 못했습니다.');return d}
function summary(publicOnly=true){const list=publicOnly?rows.filter(x=>x.visible!==false):rows;let i=0,e=0;for(const x of list)(x.type==='income'?i+=Number(x.amount||0):e+=Number(x.amount||0));$('raised').textContent=fmt(i);$('spent').textContent=fmt(e);$('balance').textContent=fmt(i-e)}
function render(){const list=rows.filter(x=>filter==='all'||x.type===filter);$('ledger').innerHTML=list.length?list.map(x=>'<article class="row '+esc(x.type)+'"><time>'+esc(x.date)+'</time><span class="badge">'+(x.type==='income'?'수입':'지출')+'</span><div class="detail"><strong>'+esc(x.purpose)+'</strong>'+(x.event?'<div class="muted">'+esc(x.event)+'</div>':'')+(x.note?'<div class="muted">'+esc(x.note)+'</div>':'')+(admin?'<div class="row-actions"><button data-edit="'+x.id+'">수정</button><button class="secondary" data-delete="'+x.id+'">삭제</button>'+(x.visible===false?'<span class="badge">비공개</span>':'')+'</div>':'')+'</div><span class="evidence muted">'+esc(x.evidenceStatus||'none')+'</span><span class="amount">'+(x.type==='expense'?'-':'+')+fmt(x.amount)+'</span></article>').join(''):'<p class="empty">등록된 회계내역이 없습니다.</p>';summary(!admin)}
async function load(){try{const t=token();if(t){try{const me=await json('/api/seonammedi/admin/me',{headers:{authorization:'Bearer '+t}});admin=Boolean(me.permissions?.finance)}catch{admin=false}}if(admin){const d=await json('/api/seonammedi/admin/finance',{headers:{authorization:'Bearer '+t}});rows=d.items||[];$('manageToggle').hidden=false;$('adminLogin').hidden=true}else{const d=await json('/api/seonammedi/page-data');rows=(d.finance?.entries||[]).map(x=>({...x,visible:true}));$('adminLogin').hidden=Boolean(t)}render();$('status').textContent=''}catch(e){$('status').textContent=e.message}}
function edit(x){const f=$('manageForm');f.reset();f.elements.id.value=x?.id||'';for(const k of ['date','type','amount','purpose','event','evidenceStatus','note'])if(x&&k in x)f.elements[k].value=x[k]??'';f.elements.visible.checked=x?.visible!==false;f.hidden=false;$('manageToggle').setAttribute('aria-expanded','true');f.scrollIntoView({block:'start'})}
$('manageToggle').onclick=()=>$('manageForm').hidden?edit(null):($('manageForm').hidden=true);$('cancel').onclick=()=>{$('manageForm').reset();$('manageForm').hidden=true};$('adminLogin').onclick=()=>location.assign(authUrl());
document.querySelector('.filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};
$('ledger').onclick=async e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');if(eb){edit(rows.find(x=>Number(x.id)===Number(eb.dataset.edit)));return}if(db&&confirm('이 회계내역을 삭제할까요?')){await json('/api/seonammedi/admin/finance/'+db.dataset.delete,{method:'DELETE',headers:{authorization:'Bearer '+token()}});await load()}};
$('manageForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value,p={date:f.elements.date.value,type:f.elements.type.value,amount:Number(f.elements.amount.value),purpose:f.elements.purpose.value,event:f.elements.event.value,evidenceStatus:f.elements.evidenceStatus.value,note:f.elements.note.value,visible:f.elements.visible.checked};try{$('formStatus').textContent='저장 중…';await json(id?'/api/seonammedi/admin/finance/'+id:'/api/seonammedi/admin/finance',{method:id?'PUT':'POST',headers:{authorization:'Bearer '+token(),'content-type':'application/json'},body:JSON.stringify(p)});f.reset();f.hidden=true;$('formStatus').textContent='';await load()}catch(err){$('formStatus').textContent=err.message}};
(async()=>{try{await exchange()}catch{}await load()})()})();
</script></body></html>
