<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>서남권 국립의대 소통센터 관리자</title>
  <style>
    :root{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#172033;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 18px;border-bottom:1px solid #dfe5ee}
    h1{font-size:24px;margin:0}.sub{color:#66768a;font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}
    a,button{font:inherit}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border-radius:9px;border:1px solid #d7dfeb;background:#fff;color:#26384d;text-decoration:none;font-weight:700;cursor:pointer}.btn.primary{background:#315eea;border-color:#315eea;color:#fff}
    .status{margin:16px 0;padding:11px 13px;border:1px solid #dce3ec;border-radius:10px;background:#fff;color:#52647a}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.card{display:grid;gap:6px;padding:15px;border:1px solid #dfe5ee;border-radius:12px;background:#fff;text-decoration:none;color:inherit}.card small{color:#718096;font-weight:700}.card strong{font-size:16px}.card p{margin:0;color:#66768a;font-size:12px;line-height:1.5}
    .panel{margin-top:14px;padding:16px;border:1px solid #dfe5ee;border-radius:12px;background:#fff}.panel h2{margin:0 0 10px;font-size:18px}.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{min-width:150px;padding:10px 12px;border:1px solid #e3e8ef;border-radius:10px}.kpi b{display:block;font-size:20px}.kpi small{color:#738298}
    .items{display:grid;gap:8px;margin-top:12px}.item{padding:10px 0;border-top:1px solid #edf0f4}.item:first-child{border-top:0}.item a{color:#244fc3;text-decoration:none;font-weight:700}.item small{display:block;margin-top:4px;color:#768499}
    [hidden]{display:none!important}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}header{align-items:flex-start}.actions{justify-content:flex-end}}@media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr}header{display:block}.actions{margin-top:12px;justify-content:flex-start}h1{font-size:21px}}
  </style>
</head>
<body>
  <main class="wrap" id="app" hidden>
    <header>
      <div>
        <h1>서남권 국립의대 소통센터 관리자</h1>
        <div class="sub" id="identity">관리자 권한 확인 중</div>
      </div>
      <div class="actions">
        <a class="btn" href="/seonammedi/" target="_blank" rel="noopener">공개 사이트 보기</a>
        <button class="btn" id="relogin" type="button">다른 계정으로 로그인</button>
      </div>
    </header>
    <div class="status" id="status" role="status">관리자 정보를 불러오는 중입니다.</div>

    <section class="grid" aria-label="관리 메뉴">
      <a class="card" href="/admin/sites/sites-all?source=seonammedi"><small>SITE</small><strong>사이트·브랜드 관리</strong><p>공개 상태, 사이트 구성, 도메인과 기본 설정</p></a>
      <a class="card" href="/admin/people/users-access?source=seonammedi"><small>ACCESS</small><strong>관리자·권한</strong><p>사전등록 Google 계정과 역할·접근권한 관리</p></a>
      <a class="card" href="/admin/content/community?source=seonammedi"><small>CONTENT</small><strong>공지·소통·콘텐츠</strong><p>공지, 시민의견, 관련보도와 게시 콘텐츠 관리</p></a>
      <a class="card" href="/admin/settings-records/public-site-controls?source=seonammedi"><small>SETTINGS</small><strong>설정·보안·감사</strong><p>공개 설정, 기록, 보안·감사 항목 확인</p></a>
    </section>

    <section class="panel">
      <h2>사이트 일일점검</h2>
      <div class="kpis">
        <div class="kpi"><small>최근 상태</small><b id="monitorState">-</b></div>
        <div class="kpi"><small>최근 확인 항목</small><b id="monitorSeen">-</b></div>
        <div class="kpi"><small>새 항목</small><b id="monitorNew">-</b></div>
        <div class="kpi"><small>미디어 후보</small><b id="monitorMedia">-</b></div>
      </div>
      <div class="items" id="monitorItems"></div>
    </section>
  </main>
  <noscript>관리자 화면을 사용하려면 JavaScript가 필요합니다.</noscript>
  <script>
    (() => {
      const TOKEN_KEY='ekodi-auth-token';
      const app=document.getElementById('app'),status=document.getElementById('status'),identity=document.getElementById('identity');
      function authUrl(){
        const auth=new URL('/auth/',location.origin);
        auth.searchParams.set('site','admin');
        auth.searchParams.set('direct','1');
        auth.searchParams.set('return_to',location.origin+'/seonammedi/admin/');
        return auth.href;
      }
      function readToken(){
        const hash=new URLSearchParams(location.hash.replace(/^#/,''));
        const fresh=hash.get('ekodi_admin_token')||'';
        if(fresh){
          sessionStorage.setItem(TOKEN_KEY,fresh);
          history.replaceState({},document.title,location.pathname+location.search);
          return fresh;
        }
        return sessionStorage.getItem(TOKEN_KEY)||'';
      }
      async function adminSession(token){
        const response=await fetch('/api/session',{headers:{authorization:'Bearer '+token},cache:'no-store'});
        if(!response.ok)throw new Error('admin_session_invalid');
        return response.json();
      }
      async function monitor(){
        const response=await fetch('/api/seonammedi/monitor',{cache:'no-store'});
        if(!response.ok)throw new Error('monitor_unavailable');
        return response.json();
      }
      function renderMonitor(data){
        const run=data?.lastRun||{};
        document.getElementById('monitorState').textContent=run.status||'대기';
        document.getElementById('monitorSeen').textContent=String(run.items_seen??'-');
        document.getElementById('monitorNew').textContent=String(run.new_items??'-');
        document.getElementById('monitorMedia').textContent=String(data?.mediaCandidateCount??0);
        const list=document.getElementById('monitorItems');list.replaceChildren();
        for(const row of (data?.items||[]).slice(0,6)){
          const item=document.createElement('article');item.className='item';
          const a=document.createElement('a');a.href=row.resolved_url||row.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=row.title||'제목 없음';
          const meta=document.createElement('small');meta.textContent=[row.publisher,row.published_at?new Date(row.published_at).toLocaleString('ko-KR'):''].filter(Boolean).join(' · ');
          item.append(a,meta);list.append(item);
        }
        if(!list.children.length){const empty=document.createElement('div');empty.className='item';empty.textContent='최근 점검 항목이 없습니다.';list.append(empty)}
      }
      async function boot(){
        const token=readToken();
        if(!token){location.replace(authUrl());return}
        try{
          const session=await adminSession(token);
          identity.textContent=(session.email||session.user?.email||'등록된 관리자')+' · '+(session.role||'admin');
          app.hidden=false;
          status.textContent='소통센터 관리자 권한이 확인되었습니다.';
          monitor().then(renderMonitor).catch(()=>{document.getElementById('monitorState').textContent='확인 필요'});
        }catch{
          sessionStorage.removeItem(TOKEN_KEY);
          location.replace(authUrl());
        }
      }
      document.getElementById('relogin').addEventListener('click',()=>{sessionStorage.removeItem(TOKEN_KEY);location.assign(authUrl())});
      boot();
    })();
  </script>
</body>
</html>
