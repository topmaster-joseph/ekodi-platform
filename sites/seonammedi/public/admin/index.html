<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>서남권 국립의대 소통센터 관리자 로그인</title>
</head>
<body>
  <p>관리자 Google 로그인을 여는 중입니다.</p>
  <p><a id="loginLink" href="/auth/?site=admin&direct=1">Google 로그인으로 계속하기</a></p>
  <script>
    (() => {
      const returnTo = new URL('/admin/sites/sites-all', location.origin);
      returnTo.searchParams.set('source', 'seonammedi');
      const auth = new URL('/auth/', location.origin);
      auth.searchParams.set('site', 'admin');
      auth.searchParams.set('direct', '1');
      auth.searchParams.set('return_to', returnTo.href);
      document.getElementById('loginLink').href = auth.href;
      location.replace(auth.href);
    })();
  </script>
</body>
</html>
