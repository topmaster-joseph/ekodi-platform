<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>서남권 국립의대 내부 회의록</title>
<link rel="stylesheet" href="/seonammedi/minutes/minutes.css">
</head>
<body>
<main class="wrap">
<section id="gate" class="card">
<p class="eyebrow">INTERNAL MINUTES</p><h1>내부 회의록 확인</h1>
<p>공유 링크를 받은 분만 열람할 수 있습니다. 성명을 입력하면 열람 기록으로 저장되며, 회의록 하단의 확인자 목록에 표시될 수 있습니다.</p>
<form id="viewerForm"><label>확인자 성명<input name="name" maxlength="80" autocomplete="name" required></label><button type="submit">성명 입력 후 확인</button><p id="msg" role="status"></p></form>
</section>
<article id="minutes" class="card" hidden>
<p class="eyebrow">서남권 국립의대 관련 내부 회의록</p><h1 id="title"></h1><p id="meta" class="meta"></p>
<section><h2>참석자</h2><p id="attendees"></p></section>
<section><h2>회의 내용</h2><div id="body" class="body"></div></section>
<footer><h2>확인자</h2><p id="viewers"></p></footer>
</article>
</main><script src="/seonammedi/minutes/minutes.js" defer></script>
</body></html>
