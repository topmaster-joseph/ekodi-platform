name = "ekodi-mall-api"
main = "entry.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "mall-api.ekodi.kr"
custom_domain = true

[vars]
ENVIRONMENT = "production"
MALL_BASE_URL = "https://ekodi.kr/ekodimall"
ALLOWED_ORIGINS = "https://ekodi.kr,https://ekodi-mall.pages.dev"
SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"
MALL_OPERATIONS_EMAILS = "topmaster.joseph@gmail.com,joseph@ekodi.kr"
PAYMENTS_ENABLED = "true"
PAYMENT_PROVIDER = "toss"
# EKODIPAY 공통 결제 모듈 상점: 에코디몰 MID q_ekodib62hb (큐티인과 같은 단일 상점).
# 키: 변수 TOSS_CLIENT_KEY__MALL, Worker secret TOSS_SECRET_KEY__MALL (기존 TOSS_* 이름은 무시됨)
EKODIPAY_PROFILE = "mall"
MALL_LEGAL_READINESS_REF = "https://ekodi.kr/ekodimall/pages/terms/"
MALL_PRIVACY_READINESS_REF = "https://ekodi.kr/ekodimall/pages/privacy/"
MALL_REFUND_READINESS_REF = "https://ekodi.kr/ekodimall/pages/returns/"
MALL_PAYOUT_READINESS_REF = "https://ekodi.kr/ekodimall/pages/payout/"
TRANSACTION_REHEARSAL_ENABLED = "false"
SOURCING_AUTO_ORDER_ENABLED = "false"
BUYER_PII_RELEASE_ENABLED = "false"
SUPPLIER_FORWARD_ENABLED = "false"
DOMEMAE_LOOKUP_ENABLED = "false"

# DOMEMAE_API_KEY, DOMEMAE_USER_ID, DOMEMAE_SESSION_ID are Worker secrets only.
# Do not put provider credentials in this file, browser assets or D1.

# Non-destructive compatibility declaration for the short-lived SQLite Durable
# Object Mall API. The namespace remains provisioned, but current Mall traffic
# is served by the D1 API in entry.js -> worker.js. Do not remove this live
# export without an explicit, separately reviewed Durable Object lifecycle plan.
[exports.MallCatalog]
type = "durable-object"
storage = "sqlite"

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-MALL-PAY-RECON-001: 결제 대사·만료 주문 정리(entry.js scheduled)
[triggers]
crons = ["*/10 * * * *"]

# EKODI-MALL-PRODUCT-PHOTOS-001: seller product photos (prefix ekodimall/products/).
# Keep this block above [[d1_databases]]: the deploy workflow appends database_id to the end of this file.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ekodi-storage"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-mall"
migrations_dir = "migrations"
