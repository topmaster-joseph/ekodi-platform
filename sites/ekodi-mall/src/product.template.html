<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="{{PRODUCT_DESCRIPTION}}">
  <meta property="og:title" content="{{PRODUCT_NAME}} | EKODI MALL">
  <meta property="og:description" content="{{PRODUCT_DESCRIPTION}}">
  <meta property="og:type" content="product">
  <meta property="og:url" content="{{PRODUCT_URL}}">
  <link rel="canonical" href="{{PRODUCT_URL}}">
  <link rel="stylesheet" href="/assets/styles.css">
  <title>{{PRODUCT_NAME}} | EKODI MALL</title>
</head>
<body>
  <div class="notice">{{NOTICE}}</div>
  <header class="header"><a class="brand" href="/"><span class="mark">E</span><span>EKODI<small>MALL</small></span></a><nav><a href="/#shop">SHOP</a><a href="/#local">LOCAL</a><a href="/#story">OUR STORY</a><a href="/#journal">JOURNAL</a></nav></header>
  <main class="detail-main">
    <a class="back" href="/#shop">← 전체 상품</a>
    <section class="product-detail">
      <div class="detail-art {{PRODUCT_CATEGORY}}"><span>{{PRODUCT_BADGE}}</span></div>
      <div class="detail-copy"><p class="eyebrow">{{PRODUCT_BADGE}}</p><h1>{{PRODUCT_NAME}}</h1><p class="detail-desc">{{PRODUCT_DESCRIPTION}}</p><dl><div><dt>현재 상태</dt><dd>{{PRODUCT_STATUS}}</dd></div><div><dt>판매 방식</dt><dd>{{SALE_TYPE_LABEL}}</dd></div><div><dt>가격</dt><dd>{{PRICE_LABEL}}</dd></div></dl><p class="detail-note">판매처와 가격이 확정되기 전에는 구매 가능한 상품처럼 표시하지 않습니다.</p><a class="btn primary" href="{{ACTION_URL}}" target="_blank" rel="noopener">{{ACTION_LABEL}}</a></div>
    </section>
  </main>
  <footer class="footer compact"><div class="bottom"><span>© 2026 EKODI MALL</span><a href="/">에코디몰 홈</a></div></footer>
</body>
</html>
