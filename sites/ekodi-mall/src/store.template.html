<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="{{STORE_DESCRIPTION}}">
  <meta property="og:title" content="{{STORE_NAME}} | EKODI MALL">
  <meta property="og:description" content="{{STORE_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{STORE_URL}}">
  <link rel="canonical" href="{{STORE_URL}}">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/platform.css">
  <title>{{STORE_NAME}} | EKODI MALL</title>
</head>
<body>
  <div class="notice">{{NOTICE}}</div>
  <header class="header">
    <a class="brand" href="/"><span class="mark">E</span><span>EKODI<small>MALL</small></span></a>
    <nav><a href="/#shop">MARKET</a><a href="/#stores">STORES</a><a href="/seller/">SELLER</a><a href="/checkout/">BAG <span class="nav-count" data-basket-count hidden>0</span></a></nav>
  </header>
  <main class="store-main">
    <a class="back" href="/#stores">← 전체 스토어</a>
    <section class="store-hero">
      <div class="store-identity"><span class="store-hero-mark">{{STORE_NAME}}</span></div>
      <div class="store-hero-copy">
        <p class="eyebrow">{{STORE_BADGE}}</p>
        <h1>{{STORE_NAME}}</h1>
        <p class="detail-desc">{{STORE_DESCRIPTION}}</p>
        <dl class="store-facts">
          <div><dt>운영</dt><dd>{{STORE_OPERATOR}}</dd></div>
          <div><dt>상태</dt><dd>{{STORE_STATUS}}</dd></div>
          <div><dt>공개 상품</dt><dd>{{STORE_PRODUCT_COUNT}}개</dd></div>
        </dl>
        <a class="btn ghost" href="{{STORE_CONTACT_URL}}" target="_blank" rel="noopener">스토어 문의</a>
      </div>
    </section>
    <section class="store-products">
      <div class="heading"><div><p class="eyebrow">STORE COLLECTION</p><h2>이 스토어의 상품</h2></div></div>
      <div class="grid">{{STORE_PRODUCTS}}</div>
    </section>
  </main>
  <footer class="footer compact"><div class="bottom"><span>© 2026 EKODI MALL · Commerce Platform</span><a href="/">에코디몰 홈</a></div></footer>
  <script src="/assets/commerce.js" defer></script>
</body>
</html>
