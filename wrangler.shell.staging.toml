name = "ekodi-shell-staging"
main = "ekodi-shell-worker.js"
compatibility_date = "2026-08-18"
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "staging"

[ai]
binding = "AI"

[assets]
directory = "./shell"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true

[[ratelimits]]
name = "TRANSLATION_RATE_LIMITER"
namespace_id = "2301"
  [ratelimits.simple]
  limit = 120
  period = 60
