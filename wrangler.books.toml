name = "ekodi-books"
main = "books-worker.js"
compatibility_date = "2026-08-10"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "books.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[assets]
directory = "./books"
binding = "ASSETS"
run_worker_first = true

# BOOKS-DIRECT-COMMERCE-001 — 에코디서점 자체 판매
# TOSS_SECRET_KEY / TOSS_CLIENT_KEY(live) are Worker secrets only (never in this file).
# PAYMENTS_ENABLED approved by the owner 2026-10-27. Keys are never stored here:
# payments go through the central EKODI Pay gateway (ekodi-mall-api · EkodiPayGateway RPC,
# MID q_ekodib62hb live keys already installed on the mall worker).
[vars]
ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://ekodi.kr/books"
OPERATOR_EMAILS = "topmaster.joseph@gmail.com,joseph@ekodibiz.kr,joseph@ekodi.kr"
# TOSS-MALL-UNDERWRITING-002 (2026-11-09 운영자 결정): MID q_ekodib62hb 는 실물 몰 전용으로 심사한다.
# 전자책(무형)은 무형 전용 상점아이디가 발급될 때까지 결제를 닫는다(fail closed, 열람·무료 안내는 유지).
PAYMENTS_ENABLED = "false"
EKODIPAY_PROFILE = "mall"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"

[[r2_buckets]]
binding = "BOOK_FILES"
bucket_name = "ekodi-book-files"

# BOOKS-AI-RELEASES-001: 출판 워커(최종 검수 확인 출간 목록) — 서버 간 읽기 전용.
[[services]]
binding = "PUBLISHING"
service = "ekodi-publishing"

[[services]]
binding = "EKODIPAY"
service = "ekodi-mall-api"
entrypoint = "EkodiPayGateway"
