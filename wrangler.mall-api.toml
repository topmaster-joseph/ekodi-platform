name = "ekodi-mall-api"
main = "mall-api-worker.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "mall-api.ekodi.kr"
custom_domain = true

[observability.logs]
enabled = true
invocation_logs = true

[[durable_objects.bindings]]
name = "MALL_CATALOG"
class_name = "MallCatalog"

[exports.MallCatalog]
type = "durable-object"
storage = "sqlite"
