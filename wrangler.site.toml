[[services]]
binding = "FINANCE"
service = "ekodi-finance-api"

[[services]]
binding = "STORAGE"
service = "ekodi-storage-control"

[assets]
directory = "./dist"
binding = "ASSETS"
# Asset-first quota guard stays the default. Only user-facing HTML entry routes,
# dynamic shells/APIs, central-auth security-critical JavaScript, and the Admin
# startup graph run Worker-first. Static CSS/JS/images remain asset-first except
# fingerprinted shared Admin menu modules, which require Worker cache/security headers.
# Public legal/history/mall paths use glob matching so extensionless HTML routing
# cannot bypass the common User UI Shell contract.
run_worker_first = ["/", "/privacy*", "/terms*", "/history*", "/mall*", "/admin", "/control-center", "/control-center/", "/control-center.html", "/api/*", "/auth.js", "/auth-router.js", "/marketing-auth-hotfix.js", "/auth-workspace-target.js", "/admin-auth.js", "/client-auth.js", "/author-auth.js", "/business-auth.js", "/marketing-onboarding.js", "/membership-ui.js", "/control-center.css", "/admin-central-handoff.js", "/admin-authenticated-shell.js", "/compact-control-center.js", "/compact-control-center.css", "/admin-menu-layout.js", "/admin-menu-registry.js", "/admin-sidebar.js", "/admin-menu-runtime.js", "/admin-demand-loader.js", "/admin-perf-diagnostics.js", "/device-browser-diagnostics.js", "/device-browser-diagnostics.css", "/admin-lazy-features.js", "/ai-ops-admin.css", "/system-health-admin.js", "/system-health-admin.css"]