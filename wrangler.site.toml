# Admin site rollout: password recovery interface
# Tax release trigger: serialize Shared Site deployment for NTS business registry
# Mall canonical release: publish ekodi.kr/ekodimall disclosures and centered footer
# CGMA public domain remains externally DNS-managed until the approved cutover stage; ekodi.kr/cgma stays canonical inside EKODI.
# Canonical domain contract: only ekodi.kr is a Shared Site custom domain; all EKODI user/admin surfaces use apex paths.
name = "shy-thunder-39a4"
main = "platform-router-entry-worker.js"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false


[vars]
ENVIRONMENT = "production"
TURNSTILE_PUBLIC_WRITE_ESCALATION = "enabled"
# TURNSTILE_SECRET_KEY remains a Worker secret. TURNSTILE_SITE_KEY is optional public metadata and is not set until a widget is provisioned.

[[routes]]
pattern = "ekodi.kr"
custom_domain = true


# Canonical Mail contact and send API must reach the Shared Site Worker before asset fallback.
[[routes]]
pattern = "ekodi.kr/mail*"
zone_name = "ekodi.kr"

# Canonical private EKODIBIZ trade workspace must outrank public/static trade assets.
[[routes]]
pattern = "ekodi.kr/ekodibiz/trade*"
zone_name = "ekodi.kr"

# Only the no-slash Church member entry is owned by Shared Site so it can
# canonicalize to /ekodichurch/my/. All slash-terminated member pages and
# descendants stay with the Church Pages gateway.
[[routes]]
pattern = "ekodi.kr/ekodichurch/my"
zone_name = "ekodi.kr"

# Canonical Church admin must outrank the public /ekodichurch* path gateway.
[[routes]]
pattern = "ekodi.kr/ekodichurch/admin*"
zone_name = "ekodi.kr"

# Canonical Church board must outrank the public /ekodichurch/* path gateway.
[[routes]]
pattern = "ekodi.kr/ekodichurch/board*"
zone_name = "ekodi.kr"



















[[services]]
binding = "FINANCE"
service = "ekodi-finance-api"

[[services]]
binding = "STORAGE"
service = "ekodi-storage-control"

[[services]]
binding = "SPACE"
service = "ekodi-space"

[[services]]
binding = "EKODIBIZ"
service = "ekodibiz-revenue-os"

[[services]]
binding = "MY"
service = "ekodi-my"

[[services]]
binding = "SHELL"
service = "ekodi-shell"

[[services]]
binding = "BIBLE"
service = "ekodi-bible-conversation"

[[services]]
binding = "CONTROL_API"
service = "ekodi-auth-api"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"

[[ratelimits]]
name = "MAIL_CONTACT_RATE_LIMITER"
namespace_id = "3901"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60


[[queues.producers]]
binding = "EKODI_WRITE_QUEUE"
queue = "ekodi-write-ingress"

[[queues.consumers]]
queue = "ekodi-write-ingress"
max_batch_size = 50
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "ekodi-write-ingress-dlq"

[assets]
directory = "./dist"
binding = "ASSETS"
# Asset-first quota guard stays the default. Only dynamic shells/APIs and
# central-auth security-critical JavaScript run Worker-first. Canonical Admin
# entry routes stay Worker-first so URL/security policy is enforced before assets;
# Admin static module assets remain explicitly asset-first.
# Public legal/history/mall paths use glob matching so extensionless HTML routing
# cannot bypass the common User UI Shell contract.
run_worker_first = ["/sitemap.xml", "/llms.txt", "/public-registry.json", "/ai", "/ai/*", "/", "/shell*", "/bible*", "/preview*", "/learn*", "/privacy*", "/terms*", "/history*", "/insurance*", "/mall*", "/ekodimall*", "/cmpmyi*", "/org/ekodibiz*", "/ekodibiz*", "/ekodi-church*", "/ekodichurch*", "/cheonggye*", "/mail*", "/messenger*", "/invest*", "/deployment-probe", "/_ekodi/space/*", "/_ekodi/ekodibiz/*", "/auth", "/auth/*", "/my", "/my/*", "/work", "/work/*", "/workspace-admin.css", "/workspace-admin.js", "/workspace-trade-admin.js", "/church-pastor-admin.js", "/workspace-trade-portal.css", "/workspace-trade-portal.js", "/admin", "/admin/*", "!/admin/*.js", "/control*", "!/admin/*.css", "!/admin/*.cmd", "!/admin/*.json", "!/admin/*.map", "!/admin/*.svg", "!/admin/*.png", "!/admin/*.webp", "/api", "/api/*", "/mcp", "/webhooks/*", "/health", "/.well-known/oauth-protected-resource", "/auth.js", "/auth-bootstrap.js", "/auth-entry.js", "/auth-router.js", "/marketing-auth-hotfix.js", "/auth-workspace-target.js", "/admin-auth.js", "/google-origin-bridge", "/google-origin-bridge.js", "/client-auth.js", "/author-auth.js", "/business-auth.js", "/marketing-onboarding.js", "/membership-ui.js", "/admin-shell.css", "/admin-central-handoff.js", "/admin-authenticated-shell.js", "/compact-control-center.js", "/compact-control-center.css", "/admin-compact.js", "/admin-compact.css", "/admin-menu-layout.js", "/admin-menu-registry.js", "/admin-sidebar.js", "/admin-menu-runtime.js", "/admin-demand-loader.js", "/admin-public-site-controls.js", "/admin-perf-diagnostics.js", "/tapo-device-admin.js", "/tapo-device-admin.css", "/device-browser-diagnostics.js", "/device-browser-diagnostics.css", "/admin-lazy-features.js", "/system-health-admin.js", "/system-health-admin.css", "/jadam*", "/pizzamaru*", "/yogurt*", "/cgma*", "/seonammedi*"]

