# Admin site rollout: password recovery interface
# Tax release trigger: serialize Shared Site deployment for NTS business registry
# Mall canonical release: publish ekodi.kr/ekodimall disclosures and centered footer
# CGMA public domain remains externally DNS-managed until the approved cutover stage; ekodi.kr/cgma stays canonical inside EKODI.
# Canonical domain contract: only ekodi.kr is a Shared Site custom domain; all EKODI user/admin surfaces use apex paths.
name = "shy-thunder-39a4"
main = "platform-router-entry-worker.js"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

[[routes]]
pattern = "ekodi.kr"
custom_domain = true


# Canonical Mail contact and send API must reach the Shared Site Worker before asset fallback.
[[routes]]
pattern = "ekodi.kr/mail*"
zone_name = "ekodi.kr"

# Canonical private EKODIBIZ trade workspace must outrank public/static trade assets.
[[routes]]
pattern = "ekodi.kr/ekodibiz/trade*"
zone_name = "ekodi.kr"

# Canonical Church admin must outrank the public /ekodichurch* path gateway.
[[routes]]
pattern = "ekodi.kr/ekodichurch/admin*"
zone_name = "ekodi.kr"




















[triggers]
# 23:00 UTC = 08:00 KST. Site-owned daily monitoring; no ChatGPT task.
crons = ["0 23 * * *"]

[[routes]]
pattern = "ekodi.kr"
custom_domain = true


# Canonical Mail contact and send API must reach the Shared Site Worker before asset fallback.
[[routes]]
pattern = "ekodi.kr/mail*"
zone_name = "ekodi.kr"

# Canonical private EKODIBIZ trade workspace must outrank public/static trade assets.
[[routes]]
pattern = "ekodi.kr/ekodibiz/trade*"
zone_name = "ekodi.kr"

# Canonical Church admin must outrank the public /ekodichurch* path gateway.
[[routes]]
pattern = "ekodi.kr/ekodichurch/admin*"
zone_name = "ekodi.kr"

[[services]]
binding = "FINANCE"
service = "ekodi-finance-api"

[[services]]
binding = "STORAGE"
service = "ekodi-storage-control"

[[services]]
binding = "SPACE"
service = "ekodi-space"

[[services]]
binding = "EKODIBIZ"
service = "ekodibiz-revenue-os"

[[services]]
binding = "MY"
service = "ekodi-my"

[[services]]
binding = "SHELL"
service = "ekodi-shell"

[[services]]
binding = "BIBLE"
service = "ekodi-bible-conversation"

[[services]]
binding = "CONTROL_API"
service = "ekodi-auth-api"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"

[[ratelimits]]
name = "MAIL_CONTACT_RATE_LIMITER"
namespace_id = "3901"
[ratelimits.simple]
limit = 5
period = 60

[assets]
directory = "./dist"
binding = "ASSETS"
# Asset-first quota guard stays the default. Only dynamic shells/APIs and
# central-auth security-critical JavaScript run Worker-first. Canonical Admin
# entry/static assets are explicitly excluded from Worker execution; deep Admin
# routes and APIs remain Worker-first for routing/auth boundaries.
# Public legal/history/mall paths use glob matching so extensionless HTML routing
# cannot bypass the common User UI Shell contract.
run_worker_first = ["/ai", "/ai/*", "/", "/shell*", "/bible*", "/preview*", "/learn*", "/privacy*", "/terms*", "/history*", "/insurance*", "/mall*", "/ekodimall*", "/cmpmyi*", "/jadam/admin*", "/pizzamaru/admin*", "/yogurt/admin*", "/org/ekodibiz*", "/ekodibiz*", "/ekodi-church*", "/ekodichurch*", "/jadam/marketing*", "/pizzamaru/marketing*", "/pizzamaru/mokpodae*", "/yogurt/marketing*", "/cheonggye*", "/cgma/marketing*", "/mail*", "/messenger*", "/invest*", "/deployment-probe", "/_ekodi/space/*", "/_ekodi/ekodibiz/*", "/auth", "/auth/*", "/my", "/my/*", "/workspace-admin.css", "/workspace-admin.js", "/workspace-trade-admin.js", "/church-pastor-admin.js", "/workspace-trade-portal.css", "/workspace-trade-portal.js", "/admin", "/admin/*", "!/admin", "!/admin/", "!/admin/*.js", "!/admin/*.css", "!/admin/*.cmd", "!/admin/*.json", "!/admin/*.map", "!/admin/*.svg", "!/admin/*.png", "!/admin/*.webp", "/control-center", "/control-center/", "/control-center.html", "/api", "/api/*", "/mcp", "/webhooks/*", "/health", "/.well-known/oauth-protected-resource", "/auth.js", "/auth-bootstrap.js", "/auth-entry.js", "/auth-router.js", "/marketing-auth-hotfix.js", "/auth-workspace-target.js", "/admin-auth.js", "/google-origin-bridge", "/google-origin-bridge.js", "/client-auth.js", "/author-auth.js", "/business-auth.js", "/marketing-onboarding.js", "/membership-ui.js", "/control-center.css", "/admin-shell.css", "/admin-central-handoff.js", "/admin-authenticated-shell.js", "/compact-control-center.js", "/compact-control-center.css", "/admin-compact.js", "/admin-compact.css", "/admin-menu-layout.js", "/admin-menu-registry.js", "/admin-sidebar.js", "/admin-menu-runtime.js", "/admin-demand-loader.js", "/admin-public-site-controls.js", "/admin-perf-diagnostics.js", "/tapo-device-admin.js", "/tapo-device-admin.css", "/device-browser-diagnostics.js", "/device-browser-diagnostics.css", "/admin-lazy-features.js", "/system-health-admin.js", "/system-health-admin.css"]

