# Admin site rollout: password recovery interface
name = "shy-thunder-39a4"
main = "platform-router-entry-worker.js"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

[[routes]]
pattern = "ekodi.kr"
custom_domain = true

[[routes]]
pattern = "www.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "trade.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "trade.biz.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "pay.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "pay.biz.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "messenger.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "invest.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "ai.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "admin.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "admin.biz.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "admin.church.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "admin.lab.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "admin.trade.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "mail.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "mail.biz.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "mail.church.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "live.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "live.biz.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "live.church.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "live.lab.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "cloud.ekodi.kr"
custom_domain = true

[[routes]]
pattern = "auth.ekodi.kr"
custom_domain = true

[[services]]
binding = "STORAGE"
service = "ekodi-storage-control"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve existing static assets without invoking the Worker. Keep dynamic root shells
# and API traffic Worker-first so host-specific routing and authenticated APIs remain intact.
run_worker_first = ["/", "/api/*"]
