name = "ekodi-marketing-growth"
main = "marketing-growth-entry.js"
compatibility_date = "2026-08-29"
workers_dev = false
route = { pattern = "marketing-connect-api.ekodi.kr", custom_domain = true }

[vars]
ALLOWED_ORIGINS = "https://admin.ekodi.kr,https://marketing.ekodi.kr,https://my.ekodi.kr"
PUBLIC_BASE_URL = "https://marketing-connect-api.ekodi.kr"
GOOGLE_CLIENT_ID = "483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com"
META_GRAPH_VERSION = "v25.0"
MAX_DAILY_AD_BUDGET_KRW = "100000"
MAX_TOTAL_AD_BUDGET_KRW = "1000000"

[[services]]
binding = "GOOGLE_OAUTH_BROKER"
service = "ekodi-storage-control"
entrypoint = "GoogleOAuthBroker"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
