<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="EKODI 생태계의 사업·교회·선교·연구·교육·출판·커뮤니티 서비스를 하나의 연결망으로 여는 통합 포털">
  <meta name="theme-color" content="#050b12">
  <title>EKODI | 에코디 생태계</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-center" aria-labelledby="portalTitle">
      <header class="portal-intro">
        <div class="brand-lockup" aria-label="EKODI">
          <span class="brand-mark" aria-hidden="true">E</span>
          <strong>EKODI</strong>
        </div>
        <span class="portal-kicker">CONNECTED ECOSYSTEM</span>
        <h1 class="portal-title" id="portalTitle">하나의 뿌리에서,<br>여러 사역과 사업으로</h1>
        <p class="portal-copy">EKODI의 교회·선교·연구·교육·출판·비즈니스 서비스를 작은 연결 노드로 모았습니다. 필요한 곳으로 바로 이동하세요.</p>
      </header>

      <div class="network-stage" aria-label="EKODI 서비스 연결망">
        <svg class="network-lines" viewBox="0 0 1000 520" preserveAspectRatio="none" aria-hidden="true">
          <line x1="500" y1="260" x2="115" y2="82"></line>
          <line x1="500" y1="260" x2="330" y2="56"></line>
          <line x1="500" y1="260" x2="670" y2="56"></line>
          <line x1="500" y1="260" x2="885" y2="82"></line>
          <line x1="500" y1="260" x2="76" y2="244"></line>
          <line x1="500" y1="260" x2="924" y2="244"></line>
          <line x1="500" y1="260" x2="128" y2="414"></line>
          <line x1="500" y1="260" x2="350" y2="466"></line>
          <line x1="500" y1="260" x2="650" y2="466"></line>
          <line x1="500" y1="260" x2="872" y2="414"></line>
          <line x1="500" y1="260" x2="500" y2="92"></line>
        </svg>

        <div class="network-hub" aria-hidden="true">
          <span class="hub-orbit"></span>
          <strong>EKODI</strong>
          <small>ROOT</small>
        </div>

        <nav class="service-grid" id="serviceGrid" aria-label="EKODI 서비스">
          <div class="service-node loading" aria-disabled="true">
            <span class="node-icon">·</span>
            <span class="node-text"><strong>서비스 연결 중</strong><small>registry loading</small></span>
            <span class="node-status"></span>
          </div>
        </nav>
      </div>

      <p class="portal-note" id="portalNote" aria-live="polite">서비스 목록을 불러오고 있습니다.</p>
    </section>

    <aside class="admin-dock" id="adminDock" aria-label="관리자 진입">
      <span class="admin-link disabled" aria-disabled="true"><span class="dot" aria-hidden="true"></span>관리자</span>
    </aside>
  </main>

  <noscript>이 사이트의 서비스 연결을 위해 JavaScript가 필요합니다.</noscript>
  <script src="portal.js" defer></script>
</body>
</html>
