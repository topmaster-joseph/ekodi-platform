<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="사람과 말씀, 공동체와 사역을 가깝게 잇는 EKODI 연결 생태계 플랫폼">
<meta name="theme-color" content="#06142a">
<link rel="canonical" href="https://ekodi.kr/">
<title>EKODI | 연결의 생태계</title>
<style>
:root{color-scheme:dark;--bg:#06142a;--bg2:#031024;--panel:#0b1a34cc;--line:#5ba8ff44;--line-strong:#66b8ff;--text:#f4f8ff;--muted:#aabbd0;--blue:#5caeff;--blue2:#278cff;--border:#8fbdf02e;--glow:0 0 30px #278cff2b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 52% 26%,#123c7426 0,transparent 28%),radial-gradient(circle at 18% 70%,#0c5cb016 0,transparent 30%),linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:hidden}
a{color:inherit}
.shell{width:min(1280px,calc(100% - 48px));margin:auto}
.site-header{height:86px;display:flex;align-items:center;border-bottom:1px solid #ffffff0b}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:28px}
.brand{display:inline-flex;flex-direction:column;text-decoration:none;line-height:1}.brand strong{font-size:25px;letter-spacing:.04em}.brand small{margin-top:7px;color:#8297b2;font-size:11px;letter-spacing:.2em}
.nav{display:flex;align-items:center;gap:38px}.nav a{text-decoration:none;color:#dce8f7;font-size:14px;font-weight:650}.nav a:hover,.nav a:focus-visible{color:#7fc0ff;outline:0}.login{display:inline-flex!important;align-items:center;gap:8px;padding:10px 18px;border:1px solid #b9d6f664;border-radius:999px;color:#f6faff!important}.login svg{width:16px;height:16px}
main{padding:64px 0 72px}
.hero{text-align:center;margin-bottom:52px}.eyebrow{margin:0 0 14px;color:#58aaff;font-size:14px;font-weight:800;letter-spacing:.34em}.hero h1{margin:0;font-size:clamp(38px,5vw,68px);line-height:1.06;letter-spacing:-.055em}.lead{margin:18px auto 0;color:#c4d1e1;font-size:clamp(15px,1.7vw,21px);line-height:1.6}
.ecosystem{display:grid;grid-template-columns:minmax(360px,.92fr) minmax(520px,1.08fr);align-items:center;gap:72px}
.diagram-wrap{display:flex;justify-content:center;min-width:0}.diagram{position:relative;width:min(100%,430px);aspect-ratio:1;border-radius:50%;isolation:isolate;background:radial-gradient(circle at 50% 50%,#168dff20 0 8%,transparent 35%),radial-gradient(circle at 50% 50%,#0c66c91c 0,transparent 67%)}
.diagram:before{content:"";position:absolute;inset:9%;border-radius:50%;background-image:radial-gradient(#4f9eff3d 1px,transparent 1.5px);background-size:13px 13px;mask-image:radial-gradient(circle,#000 0 48%,transparent 73%);opacity:.42;z-index:-2}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}.lines path,.lines line{stroke:#62b1ff80;stroke-width:1.15;fill:none}.lines .orbit{stroke:#62b1ff4a}.lines circle{fill:#8bc8ff;filter:drop-shadow(0 0 7px #47a6ff)}
.orbit-node{--size:72px;position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:var(--size);height:var(--size);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #83c4ffb3;border-radius:50%;background:linear-gradient(180deg,#1251a1dd,#0a2e65e8);box-shadow:0 0 0 6px #3b9eff0b,0 0 26px #2c9bff74;text-decoration:none;transition:.22s ease}.orbit-node:hover,.orbit-node:focus-visible{transform:translate(-50%,-50%) scale(1.08);border-color:#d8efff;box-shadow:0 0 0 8px #3b9eff10,0 0 34px #38a2ff9c;outline:0}.orbit-node svg{width:30px;height:30px;stroke:#f0f7ff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.orbit-node span{font-size:9px;color:#cfe6ff;font-weight:700}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:#dff6ff;box-shadow:0 0 20px #2f9cff,0 0 42px #2f9cff}
.services{min-width:0}.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.service-card{min-height:126px;display:grid;grid-template-columns:58px minmax(0,1fr) 26px;align-items:center;gap:16px;padding:22px 24px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#0d203dcc,#091932d9);box-shadow:inset 0 1px 0 #ffffff08;text-decoration:none;transition:.22s ease}.service-card:hover,.service-card:focus-visible{transform:translateY(-3px);border-color:#70b9ff78;background:linear-gradient(145deg,#102a4d,#0b203c);box-shadow:var(--glow);outline:0}.service-icon{width:52px;height:52px;display:grid;place-items:center;color:#cfe8ff}.service-icon svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.service-card strong{display:block;font-size:17px;letter-spacing:-.02em}.service-card small{display:block;margin-top:7px;color:#8ea5be;font-size:12px}.arrow{color:#cfe7ff;font-size:24px;font-weight:300;transition:transform .2s}.service-card:hover .arrow{transform:translateX(4px)}
.footer-note{margin:48px 0 0;text-align:center;color:#6f87a2;font-size:11px;letter-spacing:.08em}
@media(max-width:940px){.shell{width:min(100% - 36px,760px)}.site-header{height:76px}.nav{gap:20px}.nav a:not(.login){font-size:13px}.ecosystem{grid-template-columns:1fr;gap:34px}.diagram{width:min(100%,420px)}.services{width:100%}.service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-top:48px}.hero{margin-bottom:36px}}
@media(max-width:640px){.shell{width:min(100% - 28px,520px)}.site-header{height:auto;padding:17px 0}.navbar{align-items:flex-start}.brand strong{font-size:20px}.brand small{font-size:9px;margin-top:5px}.nav{gap:11px;flex-wrap:wrap;justify-content:flex-end}.nav a:not(.login){display:none}.login{padding:8px 13px;font-size:12px!important}main{padding:38px 0 50px}.hero{margin-bottom:28px}.eyebrow{font-size:10px;letter-spacing:.28em}.hero h1{font-size:clamp(34px,11vw,48px)}.lead{font-size:15px;margin-top:14px}.ecosystem{display:flex;flex-direction:column;gap:28px}.diagram-wrap{width:100%;order:1}.diagram{width:min(90vw,380px)}.services{order:2;width:100%}.service-grid{grid-template-columns:1fr;gap:10px}.service-card{min-height:92px;grid-template-columns:46px minmax(0,1fr) 22px;padding:15px 17px;border-radius:14px}.service-icon{width:42px;height:42px}.service-icon svg{width:31px;height:31px}.service-card strong{font-size:15px}.service-card small{font-size:11px;margin-top:4px}.arrow{font-size:20px}.orbit-node{--size:64px}.orbit-node svg{width:27px;height:27px}.footer-note{margin-top:32px}}
@media(max-width:390px){.orbit-node{--size:58px}.orbit-node span{font-size:8px}.diagram{width:min(94vw,340px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
