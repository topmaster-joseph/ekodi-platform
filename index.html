<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="EKODI 생태계의 사업·교회·선교·연구·교육·출판·커뮤니티 서비스를 연결하는 통합 포털">
  <meta name="theme-color" content="#071019">
  <title>EKODI | 에코디 생태계</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-center" aria-labelledby="portalTitle">
      <div class="brand-lockup" aria-label="EKODI">
        <span class="brand-mark" aria-hidden="true">E</span>
        <strong>EKODI</strong>
      </div>
      <span class="portal-kicker">EKODI ECOSYSTEM</span>
      <h1 class="portal-title" id="portalTitle">연결하고, 배우고,<br>함께 살아가는 생태계</h1>
      <p class="portal-copy">사업과 사역, 연구와 교육, 출판과 커뮤니티를 하나의 EKODI 생태계로 연결합니다. 검수가 완료된 서비스만 안전하게 열립니다.</p>

      <nav class="service-grid" id="serviceGrid" aria-label="EKODI 서비스">
        <div class="service-card disabled" aria-disabled="true">
          <div><strong>서비스 확인 중</strong><small>배포·상태 검증 정보를 불러오고 있습니다.</small></div>
        </div>
      </nav>
      <p class="portal-note" id="portalNote" aria-live="polite">서비스 연결 상태를 확인하고 있습니다.</p>
    </section>

    <aside class="admin-dock" id="adminDock" aria-label="관리자 진입">
      <span class="admin-link disabled" aria-disabled="true"><span class="dot" aria-hidden="true"></span>관리자</span>
    </aside>
  </main>

  <noscript>이 사이트는 안전한 서비스 연결 상태 확인을 위해 JavaScript가 필요합니다.</noscript>
  <script src="portal.js" defer></script>
</body>
</html>
