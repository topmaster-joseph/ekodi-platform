name = "ekodi-work-staging"
main = "work-shell-worker.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = true

[vars]
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=work"

[assets]
directory = "./work"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
