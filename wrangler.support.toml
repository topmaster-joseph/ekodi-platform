name = "ekodi-support-opportunity"
main = "support-worker.js"
compatibility_date = "2026-08-23"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "ekodi.kr/support*"
zone_name = "ekodi.kr"


[vars]
DATA_MODE = "production"
AUTH_URL = "https://ekodi.kr/auth/?site=support"
SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"
BIZINFO_API_URL = "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do"
BIZINFO_PUBLIC_URL = "https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/list.do"

[assets]
directory = "./support"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
