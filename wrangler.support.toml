name = "ekodi-support-opportunity"
main = "support-worker.js"
compatibility_date = "2026-08-23"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "support.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[vars]
DATA_MODE = "production"
AUTH_URL = "https://auth.ekodi.kr/?site=support"

[assets]
directory = "./support"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
