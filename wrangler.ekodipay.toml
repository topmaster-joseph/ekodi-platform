name = "ekodi-pay-entry"
main = "ekodipay-worker.js"
compatibility_date = "2026-10-14"
workers_dev = false
preview_urls = false

# Canonical customer-facing path. No pay.* subdomain route is created.
[[routes]]
pattern = "ekodi.kr/ekodipay*"
zone_name = "ekodi.kr"

[vars]
PAYMENT_EXECUTION_MODE = "disabled-until-approved"
EKODIPAY_WEB_ENABLED = "false"
EKODIPAY_BRANDPAY_APPROVED = "false"
EKODIPAY_DELEGATED_APPROVED = "false"
EKODIPAY_MALL_REPORTS_ENABLED = "true"
# No new production DB/service binding or financial activation in this release.
# See docs/operations/ekodipay-web-wallet-20261127.md for guarded activation.

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
