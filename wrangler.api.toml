# Control API rollout: administrator password recovery + customer tenant authentication
name = "ekodi-auth-api"
main = "customer-entry-worker.js"
compatibility_date = "2026-08-12"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "api.ekodi.kr"
custom_domain = true

[triggers]
crons = ["*/10 * * * *"]

[vars]
ENVIRONMENT = "production"
ADMIN_EMAIL = "topmaster.joseph@gmail.com"
ALLOWED_ORIGINS = "https://ekodi.kr,https://www.ekodi.kr,https://admin.ekodi.kr,https://admin.biz.ekodi.kr,https://admin.church.ekodi.kr,https://admin.lab.ekodi.kr,https://admin.trade.ekodi.kr,https://marketing.ekodi.kr,https://auth.ekodi.kr,https://cgma.ekodi.kr,https://jadam.ekodi.kr,https://pizzamaru.ekodi.kr,https://yogurt.ekodi.kr,https://yogurtpurple.ekodi.kr,https://shy-thunder-39a4.topmaster-joseph.workers.dev,https://ekodi-platform.pages.dev"

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
