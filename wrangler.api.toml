# Control API rollout: Google allowlist admin auth + customer tenant authentication + Social registry + Books operations/publishing network + membership billing + Author billing + AI Mission Control
# 2026-08-26: EKODI Storage Gateway + External AI Module Gateway are integrated inside canonical Mission Control.
name = "ekodi-auth-api"
main = "mission-control-entry-worker.js"
compatibility_date = "2026-08-12"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "api.ekodi.kr"
custom_domain = true

[triggers]
crons = ["*/10 * * * *"]

[vars]
ENVIRONMENT = "production"
ADMIN_EMAIL = "topmaster.joseph@gmail.com"
ADMIN_GOOGLE_BOOTSTRAP_EMAILS = "topmaster.joseph@gmail.com"
ADMIN_WORKSPACE_DOMAIN = "ekodi.kr"
GOOGLE_CLIENT_ID = "483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com"
OPENAI_MODEL = "gpt-5.6-terra"
# Storage policy: Google Workspace Shared Drive EKODI is the canonical durable store.
# Google Drive OAuth credentials stay isolated in the drive.ekodi.kr Storage Worker.
# API-side server secrets/config required only when the corresponding gateway is activated:
#   EKODI_STORAGE_GATEWAY_KEY          shared service-to-service key for drive.ekodi.kr
#   EKODI_AI_MODULE_GATEWAY_KEY        privileged AI module gateway key
#   EKODI_AI_MODULE_CALLERS            comma-separated registered EKODI internal caller ids
#   EKODI_AI_MODULE_REGISTRY_JSON      module manifests without actual provider secrets
# Each external AI module manifest references its own secretBinding, which must exist as an API Worker secret.
# User AI is intentionally seamless: a user does not need to know or configure an AI provider.
# Personal API remains preferred when connected; otherwise EKODI sponsors a small bounded allowance.
USER_AI_FREE_MONTHLY_REQUESTS = "20"
USER_AI_FLEX_MONTHLY_REQUESTS = "20"
ALLOWED_ORIGINS = "https://api.ekodi.kr,https://ekodi.kr,https://www.ekodi.kr,https://my.ekodi.kr,https://admin.ekodi.kr,https://admin.biz.ekodi.kr,https://admin.church.ekodi.kr,https://admin.lab.ekodi.kr,https://admin.trade.ekodi.kr,https://auth.ekodi.kr,https://mail.ekodi.kr,https://author.ekodi.kr,https://marketing.ekodi.kr,https://biz.ekodi.kr,https://trade.ekodi.kr,https://mall.ekodi.kr,https://pay.ekodi.kr,https://books.ekodi.kr,https://church.ekodi.kr,https://lab.ekodi.kr,https://community.ekodi.kr,https://edu.ekodi.kr,https://media.ekodi.kr,https://cgma.ekodi.kr,https://jadam.ekodi.kr,https://pizzamaru.ekodi.kr,https://yogurt.ekodi.kr,https://shy-thunder-39a4.topmaster-joseph.workers.dev,https://ekodi-platform.pages.dev"

[ai]
binding = "AI"

[observability.logs]
enabled = true
invocation_logs = true

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2101"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "SENSITIVE_RATE_LIMITER"
namespace_id = "2102"
  [ratelimits.simple]
  limit = 120
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
