<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f6f8f5;padding:28px 12px;font-family:Arial,'Noto Sans KR',sans-serif;color:#1c2f26">
  <main style="max-width:520px;margin:0 auto;background:#fff;border:1px solid #e0e8e1;border-radius:14px;padding:28px;box-sizing:border-box">
    <p style="font-size:12px;letter-spacing:.06em;color:#346447;margin:0 0 8px;font-weight:700">EKODI · 이메일 인증</p>
    <h1 style="font-size:24px;line-height:1.4;margin:0 0 16px">EKODI 회원가입 확인</h1>
    <p style="line-height:1.7;font-size:15px;margin:0 0 18px">EKODI에 가입하려면 로그인 화면에 아래 인증코드를 입력해 주세요.</p>
    <div style="background:#edf3ee;border-radius:10px;padding:20px;text-align:center;letter-spacing:.18em;font-size:32px;font-weight:800;color:#1a4930" aria-label="이메일 인증코드">{{ .Token }}</div>
    <p style="font-size:13px;line-height:1.7;color:#4e5b51;margin:18px 0 0">이 코드는 한 번만 사용할 수 있으며, 설정된 유효시간이 지나면 만료됩니다. 인증코드와 비밀번호를 다른 사람에게 알려주지 마세요.</p>
    <p style="font-size:13px;line-height:1.7;color:#4e5b51;margin:10px 0 0">가입을 요청한 적이 없다면 이 메일을 무시하시면 됩니다. 인증하지 않은 상태에서는 EKODI 계정이 활성화되지 않습니다.</p>
    <p style="font-size:12px;color:#6b756d;border-top:1px solid #e5ebe5;padding-top:18px;margin:22px 0 0">EKODI 인증 · https://ekodi.kr/auth/</p>
  </main>
</body>
</html>
