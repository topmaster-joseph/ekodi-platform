name = "ekodibiz-revenue-os"
main = "ekodibiz-payment-architecture.js"
compatibility_date = "2026-08-28"
workers_dev = true
preview_urls = false

[vars]
EKODIBIZ_MODE = "operational-mvp"
PAYMENT_CORE_URL = "https://ekodi.kr/pay"
PAYMENT_GATEWAY_URL = "https://ekodi.kr/ekodibiz/pay"
HIGH_IMPACT_APPROVAL = "required"
AI_OPERATIONS_MODE = "rules-first-event-driven"

[assets]
directory = "./ekodibiz"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "REVENUE_STORE"
class_name = "RevenueStore"

[exports.RevenueStore]
type = "durable-object"
storage = "sqlite"

[observability.logs]
enabled = true
invocation_logs = true
