name = "ekodi-ai-control"
main = ".release/ai-control/worker.js"
no_bundle = true
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# User traffic enters through ekodi.kr/ai via the shared-site service binding.
# The release worker has no public EKODI subdomain route.

[vars]
ENVIRONMENT = "production"
AI_CONTROL_MODE = "free-first"
AI_TASK_EXECUTION_ENABLED = "true"
AI_GITHUB_ORCHESTRATION_ENABLED = "true"
AI_CONTROL_CALLER_REGISTRY_JSON = '[{"id":"ekodi-mall","secretBinding":"MALL_INGRESS_KEY"}]'
GITHUB_REPOSITORY = "topmaster-joseph/ekodi-platform"
AUTH_URL = "https://ekodi.kr/auth/?site=ai&return_to=https%3A%2F%2Fekodi.kr%2Fai%2F"
SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"
GEMINI_MODEL = "gemini-3.7-flash"
OPENAI_MODEL = "gpt-5.6-luna"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
EKODI_PROVIDER_GEMINI_ENABLED = "true"
EKODI_PROVIDER_GEMINI_PRIORITY = "10"
EKODI_PROVIDER_OPENAI_ENABLED = "true"
EKODI_PROVIDER_OPENAI_PRIORITY = "60"
EKODI_PROVIDER_ANTHROPIC_ENABLED = "true"
EKODI_PROVIDER_ANTHROPIC_PRIORITY = "70"
AI_WORKER_PROVIDERS = ""
EKODI_PROVIDER_WORKERS_AI_ENABLED = "true"
EKODI_WORKERS_AI_MODELS = "@cf/zai-org/glm-4.7-flash,@cf/google/gemma-4-26b-a4b-it,@cf/nvidia/nemotron-3-120b-a12b"
EKODI_WORKERS_AI_DAILY_CALL_LIMIT = "8"
EKODI_PROVIDER_OPENROUTER_FREE_ENABLED = "true"
EKODI_OPENROUTER_FREE_DAILY_CALL_LIMIT = "45"
EKODI_PROVIDER_GROQ_FREE_ENABLED = "true"
EKODI_GROQ_FREE_DAILY_CALL_LIMIT = "900"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"

[assets]
directory = "./.release/ai-control/assets"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
