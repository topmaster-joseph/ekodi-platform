<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에코디 공통본문</title><meta name="description" content="EKODI 공통본문 공식 확인 페이지"><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:32px 18px;line-height:1.6}h1{font-size:1.7rem}select{padding:8px 12px}ol{padding-left:2.4rem}li{padding:6px 4px;border-bottom:1px solid #eee}.today{font-weight:700}small{color:#666}</style></head><body><main><h1>에코디 공통본문</h1><p>EKODI Orchestrator가 사용하는 공식 공통본문 확인 페이지입니다.</p><label>월 <select id="month"><option value="2026-10">2026년 10월</option></select></label><p id="status"><small>불러오는 중…</small></p><ol id="list"></ol></main><script>const month=document.querySelector('#month'),list=document.querySelector('#list'),status=document.querySelector('#status');async function load(){const r=await fetch('/api/public/scripture/common?month='+month.value);const d=await r.json();status.innerHTML='<small>원본: '+(d.nameKo||'에코디 공통본문')+' · '+(d.status||'')+'</small>';const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});list.innerHTML=(d.readings||[]).map(x=>'<li class="'+(x.date===today?'today':'')+'"><time>'+x.date+'</time> · '+x.passage+'</li>').join('')}month.addEventListener('change',load);load().catch(()=>status.textContent='공통본문을 불러오지 못했습니다.');</script></body></html>
