name = "ekodi-energy"
main = "energy-shell-worker.js"
compatibility_date = "2026-08-16"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "energy.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[vars]
TELEMETRY_ENABLED = "false"
TELEMETRY_MODE = "production-readonly-mvp"
CONTROL_ENABLED = "false"
AUTH_URL = "https://auth.ekodi.kr/?site=energy"

[assets]
directory = "./energy"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
