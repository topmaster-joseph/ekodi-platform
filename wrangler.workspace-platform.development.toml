# EKODI Development account only. No production custom domain routes.
name = "ekodi-workspace-platform-api-development"
main = "workspace-platform-entry-worker.js"
compatibility_date = "2026-08-18"
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "development"
ALLOW_MUTATIONS = "false"
ALLOWED_ORIGINS = "https://ekodi-my-staging.ekodi-development.workers.dev,https://ekodi-platform-development.ekodi-development.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth-development"
database_id = "790a8551-cdb2-4dbf-bfcc-a46d61b62766"
migrations_dir = "migrations"
