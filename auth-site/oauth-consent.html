<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>EKODI AI 연결 승인</title>
  <link rel="stylesheet" href="/auth.css?v=20260906-personal-ai-bridge-1" />
  <style>
    body{min-height:100vh;min-height:100dvh;background:#f7f8f4;display:grid;place-items:center;margin:0;padding:20px}
    .oauth-card{width:min(100%,520px);background:#fff;border:1px solid rgba(30,45,35,.12);border-radius:24px;padding:28px;box-shadow:0 16px 48px rgba(30,45,35,.08)}
    .oauth-card h1{margin:8px 0 10px;font-size:1.7rem;line-height:1.2}.oauth-card p{line-height:1.65;color:#526057}
    .oauth-meta{display:grid;gap:10px;margin:20px 0;padding:16px;border-radius:16px;background:#f7f8f4}
    .oauth-meta div{display:grid;gap:3px}.oauth-meta small{color:#6d766f}.oauth-meta strong{overflow-wrap:anywhere}
    .scope-list{margin:14px 0 0;padding-left:20px}.actions{display:flex;gap:10px;margin-top:24px}.actions button{flex:1}
    .quiet{background:#f2f3ef!important;color:#28372d!important}.status{margin-top:16px;min-height:24px;color:#526057}
  </style>
</head>
<body>
  <main class="oauth-card" aria-live="polite">
    <small>PERSONAL AI BRIDGE · EKODI IDENTITY</small>
    <h1 id="title">AI 연결 요청을 확인합니다</h1>
    <p id="summary">EKODI ID를 기준으로 요청된 권한만 연결합니다. 로그인 수단이 바뀌어도 같은 EKODI 사람과 권한이 유지됩니다.</p>
    <section id="details" class="oauth-meta" hidden>
      <div><small>연결 앱</small><strong id="clientName"></strong></div>
      <div><small>돌아갈 주소</small><strong id="redirectUri"></strong></div>
      <div><small>요청 권한</small><ul id="scopes" class="scope-list"></ul></div>
    </section>
    <div id="actions" class="actions" hidden>
      <button id="deny" class="quiet" type="button">연결하지 않기</button>
      <button id="approve" type="button">허용하고 연결</button>
    </div>
    <div id="status" class="status">로그인과 연결 요청을 확인하고 있습니다.</div>
    <p><small>승인 후에도 EKODI가 정체성·권한의 기준입니다. 외부 AI는 허용된 범위 안에서만 EKODI 기능을 호출할 수 있습니다.</small></p>
  </main>
  <script type="module" src="/oauth-consent.js?v=20260906-personal-ai-bridge-1"></script>
</body>
</html>
