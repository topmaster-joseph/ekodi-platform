<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>EKODI Google 인증</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f9fc;color:#142033}
    body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(20,32,51,.12);text-align:center}
    h1{font-size:18px;margin:0 0 10px} p{font-size:13px;line-height:1.6;color:#5e6c80;margin:0 0 20px}
    #googleButton{display:flex;justify-content:center;min-height:44px}.status{margin-top:16px;font-size:12px;color:#7a4650}
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>EKODI 관리자 Google 인증</h1>
    <p>등록된 관리자 Google 계정을 선택해 주세요.</p>
    <div id="googleButton"></div>
    <div id="status" class="status">Google 인증을 준비하고 있습니다.</div>
  </main>
  <script src="/google-origin-bridge.js" defer></script>
</body>
</html>
