name = "ekodi-shell"
main = "ekodi-shell-worker.js"
compatibility_date = "2026-08-18"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "shell.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[vars]
ENVIRONMENT = "production"

[[services]]
binding = "STORAGE"
service = "ekodi-storage-control"

[assets]
directory = "./shell"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
