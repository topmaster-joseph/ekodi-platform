name = "ekodi-support-opportunity-staging"
main = "support-worker.js"
compatibility_date = "2026-08-23"
workers_dev = true
preview_urls = false

[vars]
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=support"
BIZINFO_API_URL = "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do"

[assets]
directory = "./support"
binding = "ASSETS"
