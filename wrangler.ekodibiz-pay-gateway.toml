name = "ekodibiz-payment-gateway"
main = "ekodibiz-pay-gateway-worker.js"
compatibility_date = "2026-08-28"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ekodi.kr/ekodibiz/pay*"
zone_name = "ekodi.kr"

[vars]
REVENUE_OS_URL = "https://biz.ekodi.kr"
PAYMENT_CORE_URL = "https://ekodi.kr/ekodipay"
CANONICAL_GATEWAY_URL = "https://ekodi.kr/ekodibiz/pay"

[observability.logs]
enabled = true
invocation_logs = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
