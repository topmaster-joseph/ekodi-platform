name = "ekodibiz-payment-gateway"
main = "ekodibiz-pay-gateway-worker.js"
compatibility_date = "2026-08-28"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ekodi.kr/ekodibiz/pay*"
zone_name = "ekodi.kr"

[vars]
REVENUE_OS_URL = "https://biz.ekodi.kr"
PAYMENT_CORE_URL = "https://pay.ekodi.kr"
CANONICAL_GATEWAY_URL = "https://ekodi.kr/ekodibiz/pay"

[observability.logs]
enabled = true
invocation_logs = true
