<!doctype html>
<html lang="ko" data-ekodi-user-ui="v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>EKODI Workspace Admin</title>
  <link rel="stylesheet" href="/workspace-admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">EKODI</a>
    <div class="context"><strong id="workspaceName">운영공간</strong><span id="serviceName">관리</span></div>
    <a class="public-link" id="publicLink" href="/">사용자 화면</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="운영 메뉴">
      <div class="scope"><span>고객 운영공간</span><strong id="scopeLabel">에코디비즈</strong></div>
      <nav id="adminNav"></nav>
      <p class="boundary">플랫폼 전체 관리는 <a href="https://admin.ekodi.kr/">admin.ekodi.kr</a>에서 별도로 수행합니다.</p>
    </aside>
    <main>
      <section class="heading">
        <div><p class="eyebrow" id="breadcrumb">WORKSPACE ADMIN</p><h1 id="pageTitle">대시보드</h1><p id="pageCopy">이 운영공간에 속한 서비스와 데이터를 관리합니다.</p></div>
        <span class="state" id="pageState">확인 중</span>
      </section>
      <section class="cards" id="summaryCards" aria-label="요약"></section>
      <section class="panel" id="mainPanel"><p class="loading">운영 데이터를 불러오고 있습니다.</p></section>
    </main>
  </div>
  <script src="/workspace-admin.js" defer></script>
</body>
</html>
