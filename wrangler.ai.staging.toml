name = "ekodi-ai-control-staging"
main = "ai-control-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "development"
AI_CONTROL_MODE = "free-first-staging"
AI_TASK_EXECUTION_ENABLED = "false"
AI_GITHUB_ORCHESTRATION_ENABLED = "false"
AUTH_URL = "https://auth.ekodi.kr/?site=ai&return_to=https%3A%2F%2Fai.ekodi.kr%2F"
GEMINI_MODEL = "gemini-3.7-flash"
OPENAI_MODEL = "gpt-5.6-luna"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
AI_WORKER_PROVIDERS = ""

[assets]
directory = "./ai-control"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
