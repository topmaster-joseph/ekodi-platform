name = "ekodi-education"
main = "education-worker.js"
compatibility_date = "2026-08-22"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "edu.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[vars]
# Instructor studio/presenter access: "open" (no password, instructor decision 2026-10-22) or "locked".
EDU_INSTRUCTOR_GATE_MODE = "open"
# Instructor gate verifier (PBKDF2, random ~79-bit password; see education-instructor-gate.js). Not a secret.
EDU_INSTRUCTOR_GATE = "pbkdf2-sha256$100000$EIuDPHsCJbnpyAo0yx7INg$MXcuZEwBcx8KyAurTvhEYvRe6lOSN4WmwuzAwriyrQk"
DATA_ENABLED = "true"
DATA_MODE = "production"
EDU_SCREEN_SHARE_ENABLED = "true"
SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"
AUTH_URL = "https://ekodi.kr/auth/?site=edu"

# Instructor document share (강사 서류 공유): the instructor's own ID/bank-book copies behind expiring links,
# stored in the existing ekodi-storage bucket under edu/instructor-docs/ (see education-instructor-docs.js).
[[r2_buckets]]
binding = "EDU_DOCS"
bucket_name = "ekodi-storage"

# One-time classroom QR rooms; SQLite DO is supported on Workers Free.
[[durable_objects.bindings]]
name = "EDU_SCREEN_ROOMS"
class_name = "EducationScreenRoom"

[[migrations]]
tag = "education-screen-room-v1"
new_sqlite_classes = ["EducationScreenRoom"]

[assets]
directory = "./education"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
