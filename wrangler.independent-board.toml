name = "ekodi-independent-board"
main = "services/independent-board/worker.js"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false

[vars]
BOARD_ID = "seonammedi.citizen_voice"

[[routes]]
pattern = "board.seonammedi.kr"
zone_name = "seonammedi.kr"
custom_domain = true

[[d1_databases]]
binding = "BOARD_DB"
database_name = "ekodi-independent-board"
database_id = "REPLACE_WITH_INDEPENDENT_BOARD_D1_ID"
migrations_dir = "services/independent-board/migrations"

[[r2_buckets]]
binding = "BOARD_FILES"
bucket_name = "ekodi-independent-board-files"
