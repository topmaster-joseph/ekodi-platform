name = "ekodi-energy-staging"
main = "energy-shell-worker.js"
compatibility_date = "2026-08-16"
workers_dev = true
preview_urls = true

[vars]
TELEMETRY_ENABLED = "false"
TELEMETRY_MODE = "isolated-staging"
CONTROL_ENABLED = "false"
AUTH_URL = "https://auth.ekodi.kr/?site=energy"

[assets]
directory = "./energy"
binding = "ASSETS"

[observability.logs]
enabled = true
invocation_logs = true
