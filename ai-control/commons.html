<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="필요한 AI는 바로 쓰고, 없으면 함께 만드는 EKODI 모두의 AI">
  <title>EKODI 모두의 AI</title>
  <link rel="stylesheet" href="./api/commons/style?v=20260923-ai-commons-discovery-1">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">EKODI 모두의 AI</p>
        <h1><span>필요한 AI는 바로 쓰고,</span><span>없으면 함께 만듭니다.</span></h1>
        <p class="principle">AI로 더 연결된, 더 나은 일상을 만드는 EKODI</p>
      </div>
      <div class="session-bar">
        <span id="sessionState">서비스를 확인하는 중입니다.</span>
        <a id="loginLink" class="login" href="../auth/?site=ai">로그인</a>
      </div>
    </header>

    <section class="services section" aria-labelledby="serviceTitle">
      <div class="section-title-row">
        <div>
          <p class="kicker">바로 사용</p>
          <h2 id="serviceTitle">실행 서비스</h2>
        </div>
        <span class="section-badge">분야별 3개</span>
      </div>
      <div id="serviceTabs" class="service-tabs" role="tablist" aria-label="실행 서비스 분류"></div>
      <div id="servicePanel" class="service-panel" aria-live="polite"></div>
    </section>

    <section class="want section" aria-labelledby="wantTitle">
      <p class="kicker">서비스 찾기</p>
      <h2 id="wantTitle">무엇을 하고 싶으세요?</h2>
      <form id="wantForm" class="want-form">
        <input id="wantInput" name="request" maxlength="1200" required autocomplete="off" placeholder="예) 영어로 바로 통역해줘 · 사진으로 홍보물 만들어줘">
        <button type="submit">찾기</button>
      </form>
      <p id="wantResult" class="want-result" aria-live="polite"></p>
      <div id="matches" class="match-list"></div>
    </section>

    <section class="request section" aria-labelledby="requestTitle">
      <div class="request-top">
        <div>
          <p class="kicker">함께 만들기</p>
          <h2 id="requestTitle">개발 요청</h2>
          <p>필요한 AI가 없으면 요청하세요.</p>
        </div>
        <div class="status-chips" aria-label="개발 상태">
          <span>접수</span><span>검토중</span><span>개발중</span>
        </div>
      </div>
      <form id="requestForm" class="request-form">
        <input id="requestInput" maxlength="1200" autocomplete="off" placeholder="어떤 AI 서비스가 필요하신가요?">
        <button type="submit">요청하기</button>
      </form>
      <div class="request-summary">
        <details>
          <summary>진행 중인 요청 보기</summary>
          <div class="request-columns">
            <div><h3>추천</h3><div id="recommendedRequests" class="request-list"></div></div>
            <div><h3>개발중</h3><div id="developingRequests" class="request-list"></div></div>
            <div><h3>요청중</h3><div id="pendingRequests" class="request-list"></div></div>
          </div>
          <div class="released-block">
            <h3>최근 공개</h3>
            <div id="releasedRequests" class="request-list released-list"></div>
          </div>
        </details>
        <details class="mine"><summary>내 요청 보기</summary><div id="ideaHistory" class="request-list"></div></details>
      </div>
    </section>

    <footer><span>EKODI 모두의 AI</span><a href="../">ekodi.kr</a></footer>
  </main>
  <script type="module" src="./api/commons/client?v=20260922-ai-commons-tabs-1"></script>
</body>
</html>
