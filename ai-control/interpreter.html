<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="말하면 바로 번역하고 상대 언어로 읽어주는 EKODI 모두의 통역">
<title>모두의 통역 | EKODI 모두의 AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f8fc;color:#17171b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}button,select,textarea{font:inherit}.interpreter-shell{max-width:720px;margin:auto;min-height:100dvh;padding:18px 16px 36px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}.back{color:#6541a5;text-decoration:none;font-weight:700}.brand{margin-left:auto;display:flex;gap:5px;align-items:center;font-size:14px}.brand strong{font-weight:800}.hero{text-align:center;margin:0 auto 22px}.hero h1{font-size:clamp(30px,8vw,46px);line-height:1.12;margin:0 0 8px;letter-spacing:-1.8px}.hero p{margin:0;color:#666;font-size:15px}.translator{background:#fff;border:1px solid #e7e5ee;border-radius:24px;padding:16px;box-shadow:0 10px 35px rgba(33,20,55,.07)}.language-row{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:end}.language-row label{font-size:12px;color:#777;font-weight:700}.language-row select{display:block;width:100%;margin-top:5px;height:48px;border:1px solid #ddd8e8;border-radius:13px;background:#fff;padding:0 10px;font-weight:750;color:#17171b}.swap{width:44px;height:44px;border:0;border-radius:50%;background:#f0ebfa;color:#5d3999;font-size:22px}.presets{display:flex;gap:7px;overflow-x:auto;padding:12px 0 3px;scrollbar-width:none}.presets button{flex:0 0 auto;border:0;border-radius:999px;background:#f3f1f7;padding:8px 11px;font-size:13px;font-weight:700}.speech-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.speech-card{min-height:140px;border-radius:18px;padding:14px;background:#f7f7f9}.target-card{background:#f3eefc}.card-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#6b6671}.speech-text{font-size:19px;line-height:1.5;font-weight:700;margin:17px 0 0}.muted{color:#777;font-weight:600}.interim{color:#777;margin:8px 0 0}.primary-actions{display:flex;justify-content:center;gap:9px;margin-top:16px}.mic{border:0;border-radius:999px;background:#5e3a98;color:#fff;min-height:58px;padding:0 25px;font-weight:850;font-size:17px;box-shadow:0 8px 22px rgba(94,58,152,.25)}.mic-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#fff;margin-right:8px}.secondary{border:0;border-radius:999px;background:#eeeaf5;padding:0 18px;font-weight:800}.minor-actions{display:flex;justify-content:center;gap:5px;margin-top:8px}.minor-actions button{border:0;background:transparent;color:#68636e;padding:8px}.text-fallback{margin-top:8px;border-top:1px solid #eee;padding-top:10px;color:#666}.text-fallback summary{text-align:center;font-size:13px;cursor:pointer}.text-fallback textarea{width:100%;margin-top:10px;border:1px solid #ddd;border-radius:12px;padding:10px}.text-fallback form button{width:100%;border:0;border-radius:12px;background:#222;color:#fff;padding:11px}.notice{text-align:center;font-size:13px;margin-top:8px}.login-link{display:block;text-align:center;margin-top:8px}.guide{margin:14px 6px;color:#777;font-size:12px;line-height:1.55}.guide summary{cursor:pointer;text-align:center;font-weight:700}.guide p{margin:8px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:520px){.interpreter-shell{padding:14px 12px 24px}.topbar{margin-bottom:20px}.brand{font-size:13px}.hero{margin-bottom:16px}.hero h1{font-size:34px}.hero p{font-size:14px}.translator{padding:13px;border-radius:20px}.language-row{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr)}.language-row select{height:44px;padding:0 7px;font-size:14px}.swap{width:38px;height:38px}.speech-grid{grid-template-columns:1fr}.speech-card{min-height:112px}.target-card .speech-text{font-size:22px}.primary-actions{position:sticky;bottom:10px;z-index:3}.mic{min-height:60px;flex:1}.secondary{padding:0 14px}.guide{margin-top:10px}}
</style>
</head>
<body><main class="interpreter-shell">
<header class="topbar"><a class="back" href="../">← 모두의 AI</a><div class="brand"><span>EKODI</span><strong>모두의 통역</strong></div><span id="sessionState" class="sr-only">준비 중</span></header>
<section class="hero"><h1>말하면 바로 통역합니다.</h1><p>언어를 고르고 마이크를 누르세요.</p></section>
<section class="translator" aria-labelledby="translatorTitle"><h2 id="translatorTitle" class="sr-only">실시간 통역</h2>
<div class="language-row"><label>말하는 언어<select id="sourceLanguage"></select></label><button id="swapLanguages" class="swap" type="button" aria-label="언어 바꾸기">⇄</button><label>통역 언어<select id="targetLanguage"></select></label></div>
<div class="presets" aria-label="빠른 언어 선택"><button type="button" data-preset="ko:ja">한국어 → 日本語</button><button type="button" data-preset="ko:en">한국어 → English</button><button type="button" data-preset="ko:zh">한국어 → 中文</button></div>
<div class="speech-grid"><article class="speech-card source-card"><div class="card-head"><span>내 말</span><small id="listeningState">대기</small></div><p id="sourceText" class="speech-text muted">마이크를 누르고 말해 주세요.</p><p id="interimText" class="interim" aria-live="polite"></p></article><article class="speech-card target-card"><div class="card-head"><span>통역</span><small id="engineState">준비</small></div><p id="targetText" class="speech-text" aria-live="polite">통역 결과</p></article></div>
<div class="primary-actions"><button id="micButton" class="mic" type="button"><span class="mic-dot"></span><span id="micLabel">말하기</span></button><button id="turnButton" class="secondary" type="button">상대방 차례</button></div>
<div class="minor-actions"><button id="speakAgain" type="button">다시 듣기</button><button id="clearButton" type="button">지우기</button></div>
<details class="text-fallback"><summary>직접 입력</summary><form id="textForm"><textarea id="textInput" maxlength="4000" rows="3" placeholder="통역할 내용을 입력하세요"></textarea><button type="submit">통역하기</button></form></details>
<div id="notice" class="notice" role="status"></div><a id="loginLink" class="login-link" hidden>로그인하고 계속하기</a></section>
<details class="guide"><summary>사용법 · 개인정보 안내</summary><p>언어 선택 → 말하기. 상대가 답할 때는 <b>상대방 차례</b>를 누르세요.</p><p>통역 기록은 기본적으로 저장하지 않습니다. 음성 인식은 브라우저·기기 정책이 적용될 수 있습니다.</p></details>
</main><script type="module" src="../api/interpreter/client?v=20260922-interpreter-1"></script></body></html>
