<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>누구나 라면 부스 전체 근무표 · 청계면 도시재생 주민협의체</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14302c;--muted:#556b67;--line:#d5e0dd;--teal:#0f5c55;--teal-soft:#dcefec;--gold:#9a6f1e;--gold-soft:#f6ecd6;--warn:#a4372a;--warn-soft:#f8e3df}
@media (prefers-color-scheme:dark){:root{--bg:#0e1716;--card:#152321;--ink:#e4eeec;--muted:#9fb5b1;--line:#2a3d3a;--teal:#5fc0b5;--teal-soft:#173a36;--gold:#e0b25a;--gold-soft:#2d2616;--warn:#ff8a78;--warn-soft:#3a1f1a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:20px}
.eyebrow{font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.06em}
h1{margin:4px 0 6px;font-size:28px;line-height:1.3;color:var(--teal);word-break:keep-all;text-wrap:balance}
h2{margin:0 0 8px;font-size:21px;color:var(--teal)}
p{margin:0}.muted{color:var(--muted);font-size:16px}
.msg{padding:14px 16px;border-radius:12px;background:var(--gold-soft);font-size:17px}
.msg.err{background:var(--warn-soft);color:var(--warn);font-weight:600}
.board{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:14px;color:var(--muted);background:var(--bg)}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;width:1%}
td.t small{display:block;color:var(--gold);font-size:14px}
tr.edge td{background:var(--gold-soft)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{display:inline-flex;gap:6px;align-items:baseline;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.name b{color:var(--teal);font-variant-numeric:tabular-nums}
.empty{color:var(--warn);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--teal);background:var(--card);color:var(--teal);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ul{margin:0;padding-left:22px}
</style></head>
<body><main>
<header>
  <div class="eyebrow">청계면 도시재생 주민협의체 · 2026. 10. 28.(수)</div>
  <h1>누구나 라면 부스 전체 근무표</h1>
  <p class="muted">목포대학교 후문 상권 일원 · 11:00~17:00 (준비 10시, 마감 18시) · 이름 앞 숫자는 회원 연번입니다.</p>
</header>
<p id="status" class="msg" role="status" aria-live="polite">근무표를 불러오는 중입니다.</p>
<section>
  <div class="row"><h2>시간대별 담당</h2><button id="refresh" type="button">새로 고침</button></div>
  <div class="board"><table><thead><tr><th>시간</th><th>담당</th></tr></thead><tbody id="board"></tbody></table></div>
  <p id="updated" class="muted" style="margin-top:8px"></p>
</section>
<section>
  <h2>안내</h2>
  <ul class="muted">
    <li>교대 10분 전에 도착해 재료·판매수량·대기 인원·특이사항을 인수인계합니다.</li>
    <li>조리는 전문 조리 인력이 맡고, 회원은 접수·배식·정리를 나눠 맡습니다.</li>
    <li>내 시간을 바꾸고 싶으면 사무국에서 받은 <b>본인 전용 링크</b>에서 요청해 주세요.</li>
  </ul>
</section>
</main>
<script type="module" src="/cgmurrc/booth/board/app.js"></script>
</body></html>
