<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상인 AI 교육 수요조사 | 청계면상인회</title><style>
:root{font-family:system-ui,sans-serif;color:#111;background:#fff}body{max-width:780px;margin:auto;padding:16px;line-height:1.5}h1{font-size:1.65rem}fieldset{border:1px solid #ddd;border-radius:8px;margin:12px 0;padding:14px}legend{font-weight:700}label{display:block;padding:8px 2px}input[type=checkbox],input[type=radio]{width:20px;height:20px;vertical-align:middle}button{padding:13px 20px;border-radius:8px;border:1px solid #111;background:#111;color:white;font-size:1rem;cursor:pointer}button.secondary{background:white;color:#111}textarea{width:100%;min-height:75px}#result{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:8px}small{color:#555}</style></head>
<body><header><p>청계면상인회 · 교육 수요조사 시제품</p><h1>우리 가게에 필요한 AI 교육을 찾아보세요</h1><p><a href="/cgma/">청계면상인회 홈으로</a></p><p>응답 시간 약 3~5분 · 익명 설문 · 스마트폰 참여 가능</p></header>
