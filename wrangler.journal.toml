name = "ekodi-journal"
main = "journal-worker.js"
compatibility_date = "2026-09-02"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "journal.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[assets]
directory = "./journal"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
