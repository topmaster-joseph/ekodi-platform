name = "ekodi-journal"
main = "journal-worker.js"
compatibility_date = "2026-09-02"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "journal.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[assets]
directory = "./journal"
binding = "ASSETS"
run_worker_first = true

# JOURNAL-BOOKS-001: 출판된 도서 글을 읽는 서버 간 읽기 전용 연결.
[[services]]
binding = "PUBLISHING"
service = "ekodi-publishing"

[observability.logs]
enabled = true
invocation_logs = true
