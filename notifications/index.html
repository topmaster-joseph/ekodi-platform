<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14243b"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="에코디 통합 소식 알림: 관심 분야를 선택하고 언제든 해지할 수 있습니다.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>에코디 | 구독·알림</title>
<link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script>
</head><body><header><a href="/">EKODI</a><strong>통합 알림</strong></header>
<main>
<nav><a href="/">에코디</a> / 알림 구독</nav>
<h1>필요한 소식만, 제때 받으세요.</h1>
<p class="lead">교회, 선교회, 지역, 교육, 출판 등 관심 분야의 새 소식만 무료로 구독합니다.</p>
<section><h2>관심 분야 선택</h2><p>알림을 허용할 기기에서 직접 구독해 주세요.</p>
<fieldset id="topics" disabled><legend class="sr">알림 분야</legend></fieldset>
<label class="consent"><input type="checkbox" id="consent"> 위에서 선택한 분야의 알림 수신에 동의합니다. (광고성 알림 미포함)</label>
<div class="actions"><button id="subscribe" disabled>무료 알림 구독</button><button id="unsubscribe" class="secondary" disabled>구독 해지</button></div>
<p class="status" id="status" role="status">연결을 확인하고 있습니다.</p></section>
<section><div class="heading"><h2>내 알림함</h2><button id="refresh" class="secondary">새로고침</button></div><ul id="inbox"><li>새 소식이 없습니다.</li></ul></section>
<p class="tip">아이폰에서는 Safari의 공유 메뉴에서 '홈 화면에 추가'한 뒤 홈 화면의 웹앱에서 알림 권한을 허용해야 합니다. 구독은 언제든 해지할 수 있습니다.</p>
</main></body></html>
