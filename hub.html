<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>EKODI Service</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf4ff;background:#07101d;color-scheme:dark;--line:#263b58;--muted:#9fb1c8;--accent:#8fc2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#17345c 0,transparent 34rem),linear-gradient(180deg,#07101d,#0b1220);padding:88px 24px 36px}a{color:inherit;text-decoration:none}.shell{max-width:1080px;margin:auto}.top{position:fixed;top:0;left:0;right:0;z-index:60;min-height:64px;padding:max(10px,env(safe-area-inset-top)) 24px 10px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(7,16,29,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{font-weight:850;letter-spacing:.07em}.topnav{display:flex;gap:9px;flex-wrap:wrap}.pill{font-size:12px;color:#c7d7ea;border:1px solid var(--line);border-radius:999px;padding:8px 11px}.eyebrow{color:var(--accent);font-weight:850;letter-spacing:.16em;font-size:12px}.hero{padding:58px 0 20px}.hero h1{font-size:clamp(38px,7vw,72px);line-height:1;margin:10px 0 18px;letter-spacing:-.05em}.hero p{max-width:760px;color:#b3c2d5;font-size:17px;line-height:1.75}.context{display:inline-flex;margin-top:16px;padding:7px 10px;border-radius:999px;background:#13233a;color:#d5e8ff;font-size:12px}.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.statusline span{font-size:11px;border:1px solid #315073;border-radius:999px;padding:6px 9px;color:#b9d9ff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}.card{min-height:170px;padding:20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(22,38,61,.9),rgba(11,18,32,.9));display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#638dcc;transform:translateY(-2px)}.card strong{font-size:18px}.card small{display:block;color:var(--muted);margin-top:7px;line-height:1.55}.icon{font-size:26px;margin-bottom:18px}.note{margin-top:20px;padding:16px 18px;border-left:3px solid #568ee8;background:#101d30;color:#a9bad0;border-radius:0 14px 14px 0;font-size:13px;line-height:1.65}.domain-panel{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(11,24,42,.72)}.domain-row{display:grid;grid-template-columns:140px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07);align-items:center}.domain-row:first-child{border-top:0}.domain-row small{color:var(--muted)}.live{font-size:10px;color:#bff5d2;background:#153827;border-radius:999px;padding:6px 8px}.footer{margin-top:38px;color:#7287a4;font-size:12px}@media(max-width:760px){body{padding:96px 18px 28px}.top{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.hero{padding-top:36px}.domain-row{grid-template-columns:1fr auto}.domain-row small{grid-column:1/-1}}
  </style>
</head>
<body data-ekodi-surface="workspace">
  <header class="top" data-ekodi-fixed-header><a class="brand" href="https://my.ekodi.kr/">EKODI</a><nav class="topnav"><a class="pill" href="https://my.ekodi.kr/">My EKODI</a><a class="pill" href="https://ekodi.kr/">전체 서비스</a></nav></header>
  <main class="shell">
    <section class="hero"><div class="eyebrow" id="eyebrow">EKODI SERVICE</div><h1 id="title">EKODI</h1><p id="description"></p><span class="context" id="context"></span><div class="statusline"><span>EKODI Core</span><span>Universal FREE</span><span>AI 선택 기능</span><span>관리자 권한 분리</span></div></section>
    <section class="grid" id="cards" aria-label="서비스 바로가기"></section>
    <section class="domain-panel" id="domainPanel" hidden></section>
    <div class="note" id="note"></div>
    <footer class="footer">Person + Space + Role + Capability · Core service continues without an external AI provider.</footer>
  </main>
  <script>
    (()=>{
      const host=location.hostname.toLowerCase();
      const card=(icon,title,detail,href)=>({icon,title,detail,href});
      const common={my:card('◎','My EKODI','내 공간·서비스·멤버십으로 돌아가기','https://my.ekodi.kr/'),admin:card('⌘','EKODI Admin','운영자 전용 통합 관리 콘솔','https://admin.ekodi.kr/'),root:card('E','EKODI','전체 서비스 정문','https://ekodi.kr/')};
      const models={
        pay:{eyebrow:'PAYMENT & SETTLEMENT',title:'EKODI Pay',description:'결제와 정산의 진입점을 단순하게 연결합니다. 실제 결제·계약·회계 귀속은 해당 서비스와 조직의 권한·승인 경계를 따릅니다.',note:'결제는 자동 관리자 권한을 만들지 않습니다. 유료 멤버십은 서비스별로 분리되고, 실제 결제 실행은 명시적 사용자 동의와 서버측 결제 계약을 통과해야 합니다.',cards:[card('₩','결제 서비스','해당 EKODI 서비스에서 결제 흐름 시작','https://biz.ekodi.kr/'),card('▦','결제·정산 현황','관리자만 운영 상태 확인','https://admin.ekodi.kr/#finance'),common.my]},
        mail:{eyebrow:'COMMUNICATION',title:'EKODI Mail',description:'EKODI의 사람과 조직을 기존 Google Workspace 메일 환경으로 안전하게 연결합니다.',note:'Google Workspace는 ekodibiz.kr을 기본 도메인으로 운영하고 ekodi.kr을 별칭 도메인으로 함께 사용합니다. 메일 데이터는 EKODI 다른 서비스가 직접 읽지 않으며, 필요한 연동은 명시적 권한을 통해서만 이뤄집니다.',cards:[card('✉','메일 열기','Google Workspace Gmail · ekodibiz.kr','https://mail.google.com/a/ekodibiz.kr'),card('◎','내 EKODI 계정','통합계정과 Workspace 확인','https://my.ekodi.kr/'),common.admin],domains:[['ekodibiz.kr','Google Workspace 기본 메일 도메인'],['ekodi.kr','사용자 별칭 도메인']]},
        live:{eyebrow:'LIVE & BROADCAST',title:'EKODI Live',description:'교회·선교·사업·연구의 실시간 방송 입구를 한곳에서 연결합니다.',note:'방송 공급자가 일시적으로 중단되어도 EKODI의 계정·일정·기록 같은 Core 기능은 유지됩니다. 실제 송출 권한은 각 채널 소유자에게 남습니다.',cards:[card('▶','에코디교회 라이브','YouTube 교회 채널','https://www.youtube.com/@ekodichurch/live'),card('◉','에코디선교회 라이브','YouTube 커뮤니티 채널','https://www.youtube.com/@ekodicommunity/live'),common.my]},
        cloud:{eyebrow:'FILES & COLLABORATION',title:'EKODI Cloud',description:'파일과 협업 자산을 한 주소에서 연결하되, 원본 권한과 저장소 소유권은 그대로 유지합니다.',note:'현재 기본 연결은 Google Drive/Docs입니다. EKODI는 다른 서비스의 비공개 파일을 직접 복제하거나 우회 접근하지 않습니다.',cards:[card('▣','Google Drive','문서·자료 원본 저장소','https://drive.google.com/'),card('▤','Google Docs','문서 작성과 협업','https://docs.google.com/'),common.my]},
        insurance:{eyebrow:'INSURANCE ASSIST',title:'EKODI Insurance',description:'보험 정보를 정리하고 보장·청구 준비를 돕는 개인·조직용 허브입니다.',note:'현재 Beta는 정보 정리·서류 체크·청구 준비를 돕는 범위입니다. 가입 권유, 보험상품 최종 추천, 보장 확정, 청구 승인 판단 또는 자동 제출을 대신하지 않습니다.',cards:[card('▤','내 보험 여정','My EKODI에서 개인 맥락 확인','https://my.ekodi.kr/'),card('✓','청구 준비','필요 자료와 다음 행동을 정리하는 Beta 흐름','https://my.ekodi.kr/'),common.root]},
        media:{eyebrow:'MEDIA & CREATION',title:'EKODI Media',description:'영상·라이브·콘텐츠 자산을 EKODI의 창작과 배포 흐름에 연결합니다.',note:'Media Beta는 콘텐츠 진입·연결 허브입니다. 외부 AI나 미디어 공급자가 없어도 저장된 정보·링크·Core 서비스는 유지되며, 게시·삭제 같은 외부 실행은 사용자 권한과 확인을 거칩니다.',cards:[card('◫','Creator AI','콘텐츠 기획과 제작 지원','https://author.ekodi.kr/'),card('▶','EKODI Live','실시간 방송 연결','https://live.ekodi.kr/'),common.my]}
      };
      let key=host.startsWith('mail.')?'mail':host.startsWith('live.')?'live':host==='cloud.ekodi.kr'?'cloud':host==='ins.ekodi.kr'?'insurance':host==='media.ekodi.kr'?'media':'pay';
      const m=models[key];
      document.title=`${m.title} · EKODI`;
      document.querySelector('#eyebrow').textContent=m.eyebrow;
      document.querySelector('#title').textContent=m.title;
      document.querySelector('#description').textContent=m.description;
      document.querySelector('#context').textContent=host;
      document.querySelector('#note').textContent=m.note;
      const cards=document.querySelector('#cards');
      m.cards.forEach(item=>{const a=document.createElement('a');a.className='card';a.href=item.href;a.target='_blank';a.rel='noopener';const top=document.createElement('div');const icon=document.createElement('div');icon.className='icon';icon.textContent=item.icon;const strong=document.createElement('strong');strong.textContent=item.title;const small=document.createElement('small');small.textContent=item.detail;top.append(icon,strong,small);const arrow=document.createElement('span');arrow.textContent='↗';a.append(top,arrow);cards.append(a)});
      if(m.domains){const panel=document.querySelector('#domainPanel');panel.hidden=false;m.domains.forEach(([name,detail])=>{const row=document.createElement('div');row.className='domain-row';const n=document.createElement('strong');n.textContent=name;const d=document.createElement('small');d.textContent=detail;const s=document.createElement('span');s.className='live';s.textContent='운영 중';row.append(n,d,s);panel.append(row)})}
    })();
  </script>
</body>
</html>
