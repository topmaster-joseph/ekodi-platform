name: Verify EKODI Mall Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ekodi-mall-production.yml'
  workflow_run:
    workflows: ['EKODI Mall · Stage and Deploy', 'Deploy EKODI Shared Site Core', 'Deploy Marketing Publishing', 'Deploy Marketing Growth Connector']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-ekodi-mall-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout committed Mall payment configuration
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            sites/ekodi-mall/api/wrangler.toml
          sparse-checkout-cone-mode: false

      - name: Verify storefront, transaction safety and live catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 -D /tmp/mall.headers 'https://ekodi.kr/ekodimall' -o /tmp/mall.html
          for header in \
            'x-ekodi-route: public-ekodi-mall' \
            'x-ekodi-edge: mall-path-gateway' \
            'x-ekodi-service: mall' \
            'x-ekodi-surface: public'; do
            grep -Fiq "$header" /tmp/mall.headers || { echo "Missing Mall route header: $header"; exit 1; }
          done
          for marker in \
            'data-ekodi-service="mall"' \
            'data-ekodi-user-surface="public"' \
            'rel="canonical" href="https://ekodi.kr/ekodimall"' \
            '/ekodimall/assets/app.js' \
            '/ekodimall/assets/marketplace-live.js'; do
            grep -Fq "$marker" /tmp/mall.html || { echo "Missing Mall structural marker: $marker"; exit 1; }
          done
          if grep -Fq '추천링크 클릭 후 검색하세요' /tmp/mall.html || grep -Fq 'COUPANG AFFILIATE CURATION' /tmp/mall.html || grep -Fq 'cwWXWm' /tmp/mall.html; then
            echo 'Legacy affiliate storefront wording or fallback link is still exposed.'
            exit 1
          fi
          echo 'storefront=verified'

          amazon_admin_code=$(curl -sS -o /tmp/mall-amazon-admin.html -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodimall/admin/amazon' || true)
          if [ "$amazon_admin_code" != "200" ]; then
            echo "Canonical Amazon admin must return 200: HTTP $amazon_admin_code"
            exit 1
          fi
          grep -Fq 'workspace-admin.js' /tmp/mall-amazon-admin.html || { echo 'Amazon admin is missing workspace-admin.js'; exit 1; }
          echo 'amazonAdminRoute=verified'

          amazon_cost_code=$(curl -sS -o /tmp/mall-amazon-cost.json -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodimall/api/amazon/cost-policy' || true)
          if [ "$amazon_cost_code" != "200" ]; then
            echo "Canonical Amazon cost API must return 200: HTTP $amazon_cost_code"
            cat /tmp/mall-amazon-cost.json || true
            exit 1
          fi
          grep -Fq '"freeFirstEnabled":true' /tmp/mall-amazon-cost.json || { echo 'Amazon free-first default missing'; exit 1; }
          grep -Fq '"monthlyBudgetUsd":0' /tmp/mall-amazon-cost.json || { echo 'Amazon zero paid budget default missing'; exit 1; }
          echo 'amazonCostApex=verified'

          verification_entry_code=$(curl -sS -D /tmp/mall-verification-entry.headers -o /tmp/mall-verification-entry.body -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodimall/verification-ops' || true)
          if [[ ! "$verification_entry_code" =~ ^[23] ]] || ! grep -Fiq 'cache-control: no-store' /tmp/mall-verification-entry.headers; then
            echo "Verification Ops canonical entry is not fail-closed for caching: HTTP $verification_entry_code"
            cat /tmp/mall-verification-entry.headers || true
            exit 1
          fi
          verification_ready=false
          verification_final_code=000
          for attempt in $(seq 1 12); do
            verification_final_code=$(curl -sS -D /tmp/mall-verification-final.headers -o /tmp/mall-verification-final.html -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodimall/assets/verification-ops' || true)
            if [ "$verification_final_code" = "200" ] \
              && grep -Fiq 'cache-control: no-store' /tmp/mall-verification-final.headers \
              && grep -Fiq 'x-robots-tag: noindex, nofollow, noarchive' /tmp/mall-verification-final.headers \
              && grep -Fq '/ekodimall/assets/verification-ops.js' /tmp/mall-verification-final.html \
              && grep -Fq 'COMMERCE OS COCKPIT' /tmp/mall-verification-final.html; then
              verification_ready=true
              break
            fi
            echo "Verification Ops final HTML pending (attempt $attempt/12, HTTP $verification_final_code)."
            sleep 3
          done
          if [ "$verification_ready" != true ]; then
            echo "Verification Ops final HTML security contract failed after propagation wait: HTTP $verification_final_code"
            cat /tmp/mall-verification-final.headers || true
            exit 1
          fi
          verification_js_code=$(curl -sS -o /tmp/mall-verification-ops.js -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodimall/assets/verification-ops.js' || true)
          if [ "$verification_js_code" != "200" ] || ! grep -Fq '/api/internal/operations/cockpit' /tmp/mall-verification-ops.js; then
            echo "Commerce OS Cockpit client contract failed: HTTP $verification_js_code"
            exit 1
          fi
          echo 'verificationOpsCacheBoundary=verified'

          launch_readiness_code=$(curl -sS -o /tmp/mall-launch-readiness-unauth.json -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://mall-api.ekodi.kr/api/internal/verification/launch-readiness' || true)
          if [ "$launch_readiness_code" != "401" ]; then
            echo "Production Launch Gate must require operator auth; HTTP $launch_readiness_code"
            cat /tmp/mall-launch-readiness-unauth.json || true
            exit 1
          fi
          echo 'launchReadinessAuthBoundary=verified'

          cockpit_code=$(curl -sS -o /tmp/mall-cockpit-unauth.json -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://mall-api.ekodi.kr/api/internal/operations/cockpit' || true)
          if [ "$cockpit_code" != "401" ]; then
            echo "Commerce OS Cockpit must require operator auth; HTTP $cockpit_code"
            cat /tmp/mall-cockpit-unauth.json || true
            exit 1
          fi
          echo 'commerceCockpitAuthBoundary=verified'

          rehearsal_code=$(curl -sS -o /tmp/mall-production-rehearsal.json -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 -X POST 'https://mall-api.ekodi.kr/api/internal/rehearsal/transaction' || true)
          if [ "$rehearsal_code" != "404" ]; then
            echo "Production transaction rehearsal surface must be closed; HTTP $rehearsal_code"
            cat /tmp/mall-production-rehearsal.json || true
            exit 1
          fi
          echo 'productionRehearsalSurface=closed'

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://mall-api.ekodi.kr/health' -o /tmp/mall-health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/mall-health.json', 'utf8'));
          if (!health.ok || health.service !== 'ekodi-mall-api') throw new Error('Mall API health is not ready');
          if (health.environment && health.environment !== 'production') throw new Error(`unexpected Mall API environment: ${health.environment}`);
          for (const key of ['schemaReady', 'orderSchemaReady', 'verificationSchemaReady', 'commerceEventSchemaReady']) {
            if (health[key] !== true) throw new Error(`${key} is not ready`);
          }
          if (health.commerceOsVersion !== 1) throw new Error('Commerce OS version is not ready');
          if (health.paymentProvider?.id !== 'toss' || health.paymentProvider?.adapterImplemented !== true) throw new Error('payment provider registry is not explicit or adapter contract regressed');
          if (health.operationsReviewConfigured !== true) throw new Error('operations review is not configured');
          if (health.operationsEmailAllowlistConfigured !== true) throw new Error('operations email allowlist is not configured');
          if (health.transactionRehearsalEnabled !== false) throw new Error('production transaction rehearsal must be disabled');
          // Payments follow the committed, owner-approved PAYMENTS_ENABLED flag (same rule as the deploy and build checks).
          const wrangler = fs.readFileSync('sites/ekodi-mall/api/wrangler.toml', 'utf8');
          const expectedPayments = /^PAYMENTS_ENABLED = "true"$/m.test(wrangler);
          if (health.paymentsEnabled !== expectedPayments) throw new Error(`paymentsEnabled=${health.paymentsEnabled} does not match committed PAYMENTS_ENABLED=${expectedPayments}`);
          if (expectedPayments) {
            if (health.inventorySchemaReady !== true) throw new Error('payments enabled but inventory schema is not ready');
            if (health.paymentWebhookPath !== '/api/public/payments/webhook') throw new Error('payments enabled but Toss webhook path is not served');
          }
          for (const key of ['payoutExecutionEnabled', 'buyerPiiReleaseEnabled', 'supplierForwardEnabled', 'refundExecutionEnabled']) {
            if (health[key] !== false) throw new Error(`high-impact transaction gate unexpectedly enabled: ${key}`);
          }
          console.log(`mallApiVersion=${health.version}`);
          console.log(`operationsReviewConfigured=${Boolean(health.operationsReviewConfigured)}`);
          console.log('transactionSafety=verified');
          NODE

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 30 'https://ekodi.kr/api/affiliate/public/products?storefront=ekodi-mall&limit=100' -o /tmp/products.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          console.log(`automationStatus=${payload.automationStatus || 'missing'}`);
          console.log(`catalogMode=${payload.catalogMode || 'missing'}`);
          console.log(`productCount=${Array.isArray(payload.products) ? payload.products.length : 'not-array'}`);
          console.log(`identityCount=${Array.isArray(payload.productIdentities) ? payload.productIdentities.length : 'not-array'}`);
          if (payload.storefront !== 'ekodi-mall') throw new Error(`unexpected storefront: ${payload.storefront}`);
          if (!payload.automationStatus) throw new Error('automationStatus is missing');
          if (payload.catalogMode !== 'product_identity_v1') throw new Error(`unexpected catalogMode: ${payload.catalogMode}`);
          if (!Array.isArray(payload.providers) || payload.providers.length < 1) throw new Error('providers are missing');
          if (!Array.isArray(payload.productIdentities) || payload.productIdentities.length < 1) throw new Error('product identities are missing');
          if (!Array.isArray(payload.products) || payload.products.length < 1) throw new Error('EKODI Mall has no live products');
          for (const identity of payload.productIdentities.slice(0, 5)) {
            if (!String(identity.name || '').trim()) throw new Error('product identity name missing');
            if (!Array.isArray(identity.offers) || identity.offers.length < 1) throw new Error(`offers missing for ${identity.name}`);
          }
          for (const product of payload.products.slice(0, 5)) {
            if (!String(product.productName || '').trim()) throw new Error('productName missing');
            if (!(Number(product.priceKrw) > 0)) throw new Error(`invalid price for ${product.productName}`);
            if (!/^https:\/\//.test(String(product.imageUrl || ''))) throw new Error(`imageUrl missing for ${product.productName}`);
            if (!String(product.providerKey || '').trim()) throw new Error(`providerKey missing for ${product.productName}`);
            const click = new URL(String(product.clickUrl || ''));
            if (click.origin !== 'https://ekodi.kr' || !click.pathname.startsWith('/api/affiliate/public/click/')) {
              throw new Error(`invalid tracked click URL for ${product.productName}`);
            }
          }
          console.log('EKODI Mall live product catalog verified.');
          NODE

      - name: Verify multi-account channel admin flow
        shell: bash
        run: |
          set -euo pipefail
          channel_admin_url='https://ekodi.kr/ekodimall/admin/channel-settings'
          channel_admin_code=$(curl -sS -D /tmp/mall-channels.headers -o /tmp/mall-channels.html -w '%{http_code}' --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 "$channel_admin_url" || true)
          if [ "$channel_admin_code" != "200" ]; then
            echo "Canonical Mall channel admin must return 200: $channel_admin_url -> HTTP $channel_admin_code"
            cat /tmp/mall-channels.headers || true
            exit 1
          fi
          grep -Fq 'workspace-admin.js' /tmp/mall-channels.html || { echo 'Canonical Mall channel admin is missing workspace-admin.js'; exit 1; }
          asset=$(node -e "const s=require('fs').readFileSync('/tmp/mall-channels.html','utf8');const m=s.match(/<script src=\"([^\"]*workspace-admin\.js[^\"]*)\"/);if(!m)process.exit(1);process.stdout.write(m[1]);")
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 "https://ekodi.kr${asset}" -o /tmp/workspace-admin.js
          grep -Fq 'channelAccountForm' /tmp/workspace-admin.js
          grep -Fq 'data-account-auth' /tmp/workspace-admin.js
          grep -Fq 'registryConnectionId' /tmp/workspace-admin.js
          grep -Fq 'externalAccountApi' /tmp/workspace-admin.js
          grep -Fq '/v1/policy' /tmp/workspace-admin.js
          grep -Fq 'channelPolicyForm' /tmp/workspace-admin.js
          grep -Fq 'channelAiForm' /tmp/workspace-admin.js
          grep -Fq 'data-channel-control' /tmp/workspace-admin.js
          grep -Fq 'data-job-action' /tmp/workspace-admin.js
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/cgma/admin/publishing' | grep -Fq 'workspace-admin.js'
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodibiz/trade/admin/publishing' | grep -Fq 'workspace-admin.js'
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/jadam/admin/publishing' | grep -Fq 'store-admin.js'
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/marketing-publish-api/health' -o /tmp/marketing-publish-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/marketing-publish-health.json','utf8'));if(!h.ok||h.service!=='ekodi-marketing-publishing'||!h.scheduler||!h.channelAutomationCore||h.mutations!==true)throw new Error('Marketing publishing engine is not production-ready');console.log('channel publishing runtime=verified');"
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/marketing-connect-api/health' -o /tmp/marketing-connect-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/marketing-connect-health.json','utf8'));if(!h.ok||!h.oauthBroker||!h.encryptedVault||!h.platform?.youtubeConfigured||h.paidActivation!==false)throw new Error('YouTube channel broker is not production-ready');console.log('channel-first admin flow=verified');"
      - name: Verify revenue funnel guardrails (discovery, disclosure, privacy, promo redirect)
        shell: bash
        run: |
          set -euo pipefail
          c() { curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 "$@"; }
          # Search discovery: root robots.txt must declare the Mall service sitemap, and that sitemap must serve Mall URLs.
          c 'https://ekodi.kr/robots.txt' -o /tmp/root-robots.txt
          grep -Fxq 'Sitemap: https://ekodi.kr/sitemap.xml' /tmp/root-robots.txt || { echo 'Root sitemap line missing'; exit 1; }
          grep -Fxq 'Sitemap: https://ekodi.kr/ekodimall/sitemap.xml' /tmp/root-robots.txt || { echo 'Mall sitemap is not declared in root robots.txt'; exit 1; }
          c 'https://ekodi.kr/ekodimall/sitemap.xml' -o /tmp/mall-sitemap.xml
          grep -Fq '<urlset' /tmp/mall-sitemap.xml || { echo 'Mall sitemap is not XML'; exit 1; }
          grep -Fq '<loc>https://ekodi.kr/ekodimall/' /tmp/mall-sitemap.xml || { echo 'Mall sitemap has no canonical Mall URLs'; exit 1; }
          # Affiliate disclosure must be visible without JavaScript on the storefront and the Coupang hub.
          grep -Fq '쿠팡 파트너스 활동의 일환으로' /tmp/mall.html || { echo 'Storefront static Coupang disclosure missing'; exit 1; }
          c 'https://ekodi.kr/ekodimall/coupang/' -o /tmp/mall-coupang.html
          grep -Fq '쿠팡 파트너스 활동의 일환으로' /tmp/mall-coupang.html || { echo 'Coupang hub disclosure missing'; exit 1; }
          # Privacy notice must describe what the code actually stores.
          c 'https://ekodi.kr/ekodimall/pages/privacy/' -o /tmp/mall-privacy.html
          grep -Fq '무작위 방문자 식별값' /tmp/mall-privacy.html || { echo 'Mall privacy notice does not match implemented processing'; exit 1; }
          if grep -Fq '서버로 전송하지 않습니다' /tmp/mall-privacy.html; then echo 'Stale privacy claim is live'; exit 1; fi
          # SNS promotion redirect must be reachable on the apex host (unknown key => 404, never 5xx/530).
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 'https://ekodi.kr/marketing-connect-api/r/mall/mall-00000000-verify-0' || true)
          [[ "$code" == "404" ]] || { echo "Promotion redirect route returned $code (expected 404 for unknown key)"; exit 1; }
          # 전자상거래법 사업자 표시: 공통 푸터·약관에 통신판매업신고번호가 노출돼야 한다.
          c 'https://ekodi.kr/terms' | grep -Fq '2023-전남무안-0153' || { echo 'Terms missing 통신판매업신고번호'; exit 1; }
          # Server-rendered weekly picks: crawlable, disclosed, sponsored links through the apex click endpoint.
          c 'https://ekodi.kr/ekodimall/picks' -o /tmp/mall-picks.html
          # All three canonical Mall buyer surfaces must have the same navigation,
          # search and shared legal footer after HTMLRewriter/Shell injection.
          c 'https://ekodi.kr/ekodimall/travel/stay/' -o /tmp/mall-travel.html
          for page in /tmp/mall.html /tmp/mall-travel.html /tmp/mall-picks.html; do
            for marker in \
              'class="header buyer-header mall-header"' \
              'id="mallGlobalSearch"' \
              'aria-label="쇼핑 카테고리"' \
              '여행·레저' \
              '이번 주 추천' \
              '판매하기' \
              'ekodi-user-ui-footer' \
              '2023-전남무안-0153'; do
              grep -Fq "$marker" "$page" || { echo "Mall shared buyer chrome missing [$marker] in $page"; exit 1; }
            done
          done
          grep -Fq 'pexels-photo-6347572.jpeg' /tmp/mall.html || { echo 'Sourced editorial portrait missing on Mall home'; exit 1; }
          grep -Fq 'data-ekodi-character="off"' /tmp/mall.html || { echo 'Cartoon suppression absent from Mall landing'; exit 1; }
          grep -Fq '이 페이지에는 숙박 제휴링크가 포함될 수 있으며' /tmp/mall-travel.html || { echo 'Travel affiliate disclosure missing'; exit 1; }
          echo 'Mall buyer header, footer and portrait=verified'
          grep -Fq '<link rel="canonical" href="https://ekodi.kr/ekodimall/picks">' /tmp/mall-picks.html || { echo 'Picks canonical missing'; exit 1; }
          grep -Fq '쿠팡 파트너스 활동의 일환으로' /tmp/mall-picks.html || { echo 'Picks disclosure missing'; exit 1; }
          if grep -Fq 'class="pick-cta"' /tmp/mall-picks.html; then grep -Fq 'rel="sponsored nofollow noopener"' /tmp/mall-picks.html || { echo 'Picks links not marked sponsored'; exit 1; }; fi
          grep -Fq 'https://ekodi.kr/ekodimall/picks' /tmp/mall-sitemap.xml || { echo 'Picks missing from Mall sitemap'; exit 1; }
          echo 'revenue funnel guardrails=verified'
