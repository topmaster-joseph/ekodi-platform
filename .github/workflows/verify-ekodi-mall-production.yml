name: Verify EKODI Mall Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy EKODI Shared Site Core']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-ekodi-mall-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify storefront and live product feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodibiz/mall' -o /tmp/mall.html
          grep -Fq 'EKODI MALL' /tmp/mall.html
          grep -Fq 'SMART SHOPPING' /tmp/mall.html
          grep -Fq '오늘 필요한 것,' /tmp/mall.html
          grep -Fq '에코디몰에서.' /tmp/mall.html
          grep -Fq '오늘의 상품' /tmp/mall.html
          grep -Fq '상품 둘러보기' /tmp/mall.html
          grep -Fq '쿠팡 파트너스 활동의 일환으로' /tmp/mall.html
          if grep -Fq '추천링크 클릭 후 검색하세요' /tmp/mall.html || grep -Fq 'COUPANG AFFILIATE CURATION' /tmp/mall.html || grep -Fq 'cwWXWm' /tmp/mall.html; then
            echo 'Legacy affiliate storefront wording or fallback link is still exposed.'
            exit 1
          fi
          echo 'storefront=verified'

          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 30 'https://api.ekodi.kr/api/affiliate/public/products?storefront=ekodi-mall&limit=100' -o /tmp/products.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          console.log(`automationStatus=${payload.automationStatus || 'missing'}`);
          console.log(`productCount=${Array.isArray(payload.products) ? payload.products.length : 'not-array'}`);
          if (payload.storefront !== 'ekodi-mall') throw new Error(`unexpected storefront: ${payload.storefront}`);
          if (payload.providerKey !== 'coupang_partners') throw new Error(`unexpected provider: ${payload.providerKey}`);
          if (!payload.automationStatus) throw new Error('automationStatus is missing');
          if (!Array.isArray(payload.products)) throw new Error('products is not an array');
          const count = payload.products.length;
          if (count < 1) throw new Error(`EKODI Mall has no live products; automationStatus=${payload.automationStatus}`);
          for (const product of payload.products.slice(0, 5)) {
            if (!String(product.productName || '').trim()) throw new Error('productName missing');
            if (!(Number(product.priceKrw) > 0)) throw new Error(`invalid price for ${product.productName}`);
            if (!/^https:\/\//.test(String(product.imageUrl || ''))) throw new Error(`imageUrl missing for ${product.productName}`);
            const click = new URL(String(product.clickUrl || ''));
            if (click.origin !== 'https://api.ekodi.kr' || !click.pathname.startsWith('/api/affiliate/public/click/')) {
              throw new Error(`invalid tracked click URL for ${product.productName}`);
            }
          }
          console.log('EKODI Mall live product feed verified.');
          NODE

      - name: Verify channel-first admin connection flow
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://ekodi.kr/ekodibiz/mall/admin/channels' -o /tmp/mall-channels.html
          grep -Fq 'workspace-admin.js' /tmp/mall-channels.html
          asset=$(node -e "const s=require('fs').readFileSync('/tmp/mall-channels.html','utf8');const m=s.match(/<script src=\"([^\"]*workspace-admin\.js[^\"]*)\"/);if(!m)process.exit(1);process.stdout.write(m[1]);")
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 "https://ekodi.kr${asset}" -o /tmp/workspace-admin.js
          grep -Fq 'data-channel-preauth' /tmp/workspace-admin.js
          grep -Fq 'channelPreAuth' /tmp/workspace-admin.js
          grep -Fq 'pendingChannelIntent' /tmp/workspace-admin.js
          curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 20 'https://marketing-connect-api.ekodi.kr/health' -o /tmp/marketing-connect-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/marketing-connect-health.json','utf8'));if(!h.ok||!h.oauthBroker||!h.encryptedVault||!h.platform?.youtubeConfigured)throw new Error('YouTube channel broker is not production-ready');console.log('channel-first admin flow=verified');"
