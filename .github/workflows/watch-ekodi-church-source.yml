name: Watch EKODI Church Source

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'EKODI Orchestrator-issued ai/<agent>/orch_<task> release branch'
        required: false
        type: string
      release_task_id:
        description: 'Matching EKODI Orchestrator release task ID'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/watch-ekodi-church-source.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: ekodi-church-source-watch
  cancel-in-progress: true

# Release reconciliation marker: church-live-current-9d78aff-20260920
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical EKODI orchestrator source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare Church source with production release
        env:
          GH_TOKEN: ${{ github.token }}
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
          EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git ls-remote https://github.com/topmaster-joseph/ekodi-church.git refs/heads/main | awk '{print $1}')"
          production_sha="$(curl -L -fsS --connect-timeout 5 --max-time 20 "https://ekodi.kr/ekodichurch/church-release.json?watch=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | jq -r '.sourceSha // empty' || true)"
          echo "Church source SHA: ${source_sha}"
          echo "Church production SHA: ${production_sha:-missing}"
          test -n "$source_sha"
          if [[ "$source_sha" == "$production_sha" ]]; then
            echo 'Church production is already current.'
            exit 0
          fi
          node scripts/dispatch-guarded-church-release.mjs
