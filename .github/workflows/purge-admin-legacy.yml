name: Purge Retired Admin Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-admin-legacy.yml'
      - 'scripts/purge-retired-admin.mjs'
      - 'control-center.html'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-menu-layout.js'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'site-worker.js'
      - 'admin.html'
      - 'control-center.js'
      - 'control-center-features.js'
      - 'control-center-ops.css'
      - 'compact-control-center.js'

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  purge-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Purge retired admin source and bootstrap markup
        run: |
          set -euo pipefail
          node scripts/purge-retired-admin.mjs
          test ! -e admin.html
          test ! -e control-center.js
          test ! -e control-center-features.js
          test ! -e control-center-ops.css
          test ! -e compact-control-center.js
          ! grep -Fq 'EKODI Platform Operations' scripts/admin-thin-postbuild.mjs
          ! grep -Fq 'OPERATIONS OVERVIEW' scripts/admin-thin-postbuild.mjs
          ! grep -Fq 'data-panel="overview"' control-center.html
          ! grep -Fq 'control-center-ops.css' control-center.html

      - name: Verify source, tests and production build
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -f dist/control-center.html
          test -f dist/compact-control-center.js
          ! grep -Fq 'EKODI Platform Operations' dist/control-center.html
          ! grep -Fq 'EKODI Platform Operations' dist/compact-control-center.js
          ! grep -Fq 'OPERATIONS OVERVIEW' dist/compact-control-center.js
          ! grep -Fq 'control-center-ops.css' dist/control-center.html
          ! grep -Fq 'control-center.js' dist/control-center.html
          ! grep -Fq 'control-center-features.js' dist/control-center.html
          test ! -e dist/admin.html
          test ! -e dist/control-center-ops.css
          test ! -e dist/control-center.js
          test ! -e dist/control-center-features.js

      - name: Commit retired-source purge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source purge changes required.'
          else
            git commit -m 'refactor(admin): remove retired control-center implementation'
            git push origin HEAD:main
          fi

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Guarded shared-site release
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify retired source is absent in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?purge=${GITHUB_RUN_ID}" || true)
            compact_code=$(curl -sS -o /tmp/compact -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.js?purge=${GITHUB_RUN_ID}" || true)
            old_runtime=$(curl -sS -o /tmp/old-runtime -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.js?purge=${GITHUB_RUN_ID}" || true)
            old_features=$(curl -sS -o /tmp/old-features -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-features.js?purge=${GITHUB_RUN_ID}" || true)
            old_css=$(curl -sS -o /tmp/old-css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-ops.css?purge=${GITHUB_RUN_ID}" || true)
            markers=no
            if grep -Fq 'EKODI Platform Operations' /tmp/root || grep -Fq 'OPERATIONS OVERVIEW' /tmp/root || grep -Fq 'EKODI Platform Operations' /tmp/compact || grep -Fq 'OPERATIONS OVERVIEW' /tmp/compact; then markers=yes; fi
            echo "admin purge verify -> root=$root_code compact=$compact_code old=$old_runtime/$old_features/$old_css markers=$markers"
            if [ "$root_code" = '200' ] && [ "$compact_code" = '200' ] && [ "$old_runtime" = '404' ] && [ "$old_features" = '404' ] && [ "$old_css" = '404' ] && [ "$markers" = no ]; then
              echo 'Retired admin source is absent from production.'
              exit 0
            fi
            sleep 4
          done
          exit 1
