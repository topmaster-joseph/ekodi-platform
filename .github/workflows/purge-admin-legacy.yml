name: Purge Retired Admin Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/purge-retired-admin.mjs
      - .github/workflows/purge-admin-legacy.yml

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  purge-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Purge retired admin implementation
        run: |
          set -euo pipefail
          node scripts/purge-retired-admin.mjs
          test ! -e admin.html
          test ! -e control-center.js
          test ! -e control-center-features.js
          test ! -e control-center-ops.css
          test ! -e compact-control-center.js
          ! grep -Fq 'EKODI Platform Operations' control-center.html
          ! grep -Fq 'OPERATIONS OVERVIEW' scripts/admin-thin-postbuild.mjs
          ! grep -Fq 'data-panel="overview"' control-center.html
          ! grep -Fq 'control-center-ops.css' control-center.html

      - name: Check and build
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -f dist/control-center.html
          test ! -e dist/admin.html
          test ! -e dist/control-center.js
          test ! -e dist/control-center-features.js
          test ! -e dist/control-center-ops.css
          ! grep -Fq 'EKODI Platform Operations' dist/control-center.html
          ! grep -Fq 'OPERATIONS OVERVIEW' dist/compact-control-center.js
          ! grep -Fq 'control-center.js' dist/control-center.html
          ! grep -Fq 'control-center-features.js' dist/control-center.html

      - name: Commit physical source purge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'refactor(admin): physically remove retired admin sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy shared site
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify production purge
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?purge=${GITHUB_RUN_ID}" || true)
            old_runtime=$(curl -sS -o /tmp/old-runtime -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.js?purge=${GITHUB_RUN_ID}" || true)
            old_features=$(curl -sS -o /tmp/old-features -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-features.js?purge=${GITHUB_RUN_ID}" || true)
            old_css=$(curl -sS -o /tmp/old-css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-ops.css?purge=${GITHUB_RUN_ID}" || true)
            markers=no
            if grep -Fq 'EKODI Platform Operations' /tmp/root || grep -Fq 'OPERATIONS OVERVIEW' /tmp/root; then markers=yes; fi
            echo "admin purge verify -> root=$root_code old=$old_runtime/$old_features/$old_css markers=$markers"
            if [ "$root_code" = '200' ] && [ "$old_runtime" = '404' ] && [ "$old_features" = '404' ] && [ "$old_css" = '404' ] && [ "$markers" = no ]; then
              echo 'Retired admin implementation is absent from production.'
              exit 0
            fi
            sleep 4
          done
          exit 1
