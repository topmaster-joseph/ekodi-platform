name: Direct Cloudflare DNS Permission Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-grant-ekodi-dns.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: 6986fd633f4e33bf804c921697b2d797
      CF_TOKEN_ID: 70e86092b1fa0d0a191afe31b83cca56
      CF_ZONE_ID: e39707f426b195d12c67a86f62b52ba7
    steps:
      - uses: actions/checkout@v7

      - name: Verify DNS permission is active
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          code=$(curl -sS -o /tmp/records.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$api/zones/$CF_ZONE_ID/dns_records?per_page=5")
          echo "DNS records API HTTP $code"
          test "$code" = '200'

      - name: Proxy root DNS records
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          proxy_name() {
            name="$1"
            curl -fsS "${auth[@]}" "$api/zones/$CF_ZONE_ID/dns_records?name=$name&per_page=100" > /tmp/records.json
            mapfile -t ids < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/records.json'))
          for r in d.get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
            )
            if [ "${#ids[@]}" -eq 0 ]; then
              payload=$(python -c "import json; print(json.dumps({'type':'A','name':'$name','content':'192.0.2.0','ttl':1,'proxied':True}))")
              curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$CF_ZONE_ID/dns_records" >/dev/null
              echo "Created proxied DNS record: $name"
            else
              for id in "${ids[@]}"; do
                curl -fsS -X PATCH "${auth[@]}" --data '{"proxied":true,"ttl":1}' "$api/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
              done
              echo "Proxied existing DNS record(s): $name"
            fi
          }
          proxy_name 'ekodi.kr'
          proxy_name 'www.ekodi.kr'

      - name: Ensure Worker routes by Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$api/zones/$CF_ZONE_ID/workers/routes" > /tmp/routes.json
          ensure_route() {
            pattern="$1"
            route_id=$(PATTERN="$pattern" python - <<'PY'
          import json, os
          d=json.load(open('/tmp/routes.json'))
          p=os.environ['PATTERN']
          for r in d.get('result') or []:
              if r.get('pattern') == p:
                  print(r.get('id',''))
                  break
          PY
            )
            payload=$(PATTERN="$pattern" python -c "import json,os; print(json.dumps({'pattern':os.environ['PATTERN'],'script':'shy-thunder-39a4'}))")
            if [ -n "$route_id" ]; then
              curl -fsS -X PUT "${auth[@]}" --data "$payload" "$api/zones/$CF_ZONE_ID/workers/routes/$route_id" >/dev/null
              echo "Updated Worker route: $pattern"
            else
              curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$CF_ZONE_ID/workers/routes" >/dev/null
              echo "Created Worker route: $pattern"
            fi
          }
          ensure_route 'ekodi.kr/*'
          ensure_route 'www.ekodi.kr/*'

      - name: Verify end-to-end
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true)
            www=$(curl -L -sS -o /tmp/www.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://www.ekodi.kr/' || true)
            books=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
            echo "attempt=$attempt root=$root www=$www books=$books"
            if [[ "$root" =~ ^[23] ]] && [[ "$www" =~ ^[23] ]] && [[ "$books" =~ ^[23] ]] && grep -q 'href="https://ekodi.kr/"' /tmp/books.html; then
              echo 'EKODI root, www, and Books navigation are healthy.'
              exit 0
            fi
            sleep 5
          done
          echo 'End-to-end verification did not become healthy in time.'
          exit 1
