name: EKODI Print Production Readonly Canary

on:
  pull_request:
    paths:
      - '.github/workflows/ekodi-print-readonly.yml'
      - 'scripts/verify-print-production.mjs'
      - 'test/verify-print-production.test.mjs'
  workflow_run:
    workflows: ['Deploy EKODI Shared Site Core']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-print-readonly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout approved repository source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source canary contract
        run: |
          node --check scripts/verify-print-production.mjs
          node --test test/verify-print-production.test.mjs
      - name: Check live public paths from EKODI cloud runner (GET only)
        run: node scripts/verify-print-production.mjs
      - name: Record source release revision
        if: always()
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo 'Read-only site check. No private sessions or order requests.'
          echo "Release source SHA: ${DEPLOYED_SHA:-pull-request-or-manual}"
