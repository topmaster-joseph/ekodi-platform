name: Cloudflare Edge Baseline

on:
  pull_request:
    paths:
      - 'scripts/enforce-cloudflare-edge-baseline.mjs'
      - 'test/cloudflare-edge-baseline.test.mjs'
      - '.github/workflows/cloudflare-edge-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-cloudflare-edge-baseline.mjs'
      - 'test/cloudflare-edge-baseline.test.mjs'
      - '.github/workflows/cloudflare-edge-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-baseline-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate edge baseline contract
        run: |
          set -euo pipefail
          node --check scripts/enforce-cloudflare-edge-baseline.mjs
          node scripts/enforce-cloudflare-edge-baseline.mjs --validate-only
          node --test test/cloudflare-edge-baseline.test.mjs

  enforce-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EKODI_ALLOW_CLOUDFLARE_EDGE_MUTATION: MAIN_APPROVED
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Enforce reversible low-risk Cloudflare zone baseline
        run: node scripts/enforce-cloudflare-edge-baseline.mjs
      - name: Verify production HTTPS and core surfaces
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --connect-timeout 5 --max-time 20 http://ekodi.kr/)
          echo "HTTP apex redirect status: $code"
          case "$code" in
            301|302|307|308) ;;
            *) echo "::error::Expected an HTTP redirect to HTTPS, got $code"; cat "$headers"; exit 1 ;;
          esac
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\\r$/, ""); print; exit}' "$headers")
          case "$location" in
            https://ekodi.kr|https://ekodi.kr/*) ;;
            *) echo "::error::Unexpected HTTPS redirect target: $location"; cat "$headers"; exit 1 ;;
          esac

          curl -fsSL --retry 3 --retry-delay 1 --connect-timeout 5 --max-time 20 https://ekodi.kr/ >/dev/null
          health=$(curl -fsS --retry 3 --retry-delay 1 --connect-timeout 5 --max-time 20 https://ekodi.kr/api/health)
          printf '%s' "$health" | grep -Fq '"ok":true'

          admin_code=$(curl --http2 -sS -L -o /tmp/ekodi-admin.html -D /tmp/ekodi-admin.headers -w '%{http_code}' --connect-timeout 5 --max-time 20 https://ekodi.kr/admin)
          echo "Admin final status: $admin_code"
          test "$admin_code" = "200"
          if ! grep -Eiq '<title>[^<]*(EKODI|에코디)[^<]*</title>' /tmp/ekodi-admin.html; then
            echo "::error::Admin surface did not render an EKODI document title."
            head -c 800 /tmp/ekodi-admin.html || true
            exit 1
          fi
          echo 'Cloudflare Edge Baseline live verification: PASS'
