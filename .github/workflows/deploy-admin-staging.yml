name: Deploy Admin PR Staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-staging.yml'
      - 'package.json'
      - 'admin-staging-worker.js'
      - 'wrangler.admin.staging.toml'
      - 'site-worker.js'
      - 'control-center.html'
      - 'control-center.css'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-lazy-features.js'
      - 'admin-readable-command.js'
      - 'admin-readable-command.css'
      - 'admin-menu-layout.js'
      - 'finance-monitor.js'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'mission-control-admin.js'
      - 'mission-control-admin.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-timeline-admin.js'
      - 'system-timeline-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'test/mission-control-admin.test.mjs'
      - 'test/admin-readable-command.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/admin-preauth-shell.test.mjs'
      - 'test/admin-performance-hardening.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-admin-staging.topmaster-joseph.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate flat AI Ops, orchestration and admin routing
        run: |
          set -euo pipefail
          node --check admin-staging-worker.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-readable-command.js
          node --check admin-menu-layout.js
          node --check device-control-admin.js
          node --check scripts/admin-thin-postbuild.mjs
          node --check scripts/admin-performance-postbuild.mjs
          node --check scripts/admin-readable-command-postbuild.mjs
          node --test test/admin-true-lazy.test.mjs
          node --test test/admin-thin-shell.test.mjs
          node --test test/admin-preauth-shell.test.mjs
          node --test test/admin-performance-hardening.test.mjs
          node --test test/admin-readable-command.test.mjs
          node --test test/mission-control-admin.test.mjs
          npm run build
          test -f dist/admin-central-handoff.js
          test -f dist/admin-demand-loader.js
          test -f dist/admin-lazy-features.js
          test -f dist/device-control-admin.js
          test -f dist/device-control-admin.css
          test -f dist/compact-control-center.css
          grep -Fq '20260819-e2e-perf-1' dist/control-center.html
          grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' dist/control-center.html
          ! grep -Fq '<script src="control-center.js"' dist/control-center.html
          ! grep -Fq 'ai-ops-admin.js" defer' dist/control-center.html
          ! grep -Fq 'setInterval(' dist/finance-monitor.js
          grep -Fq "scripts: ['ai-ops-admin.js']" dist/admin-demand-loader.js
          grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" dist/admin-demand-loader.js
          ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq "scripts: ['release-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-lazy-features.js
          grep -Fq '재구성' dist/admin-lazy-features.js
          grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' dist/admin-lazy-features.js
          grep -Fq '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' dist/compact-control-center.css
          grep -Fq '#aiOpsPanel .ai-ops-side' dist/compact-control-center.css

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy isolated admin staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.admin.staging.toml

      - name: Verify staging flat AI Ops and zero production traffic
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -D /tmp/admin-stage-headers -o /tmp/admin-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -D /tmp/admin-stage-health-headers -o /tmp/admin-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            demand_code=$(curl -sS -D /tmp/admin-stage-demand-headers -o /tmp/admin-stage-demand.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-demand-loader.js" || true)
            lazy_code=$(curl -sS -D /tmp/admin-stage-lazy-headers -o /tmp/admin-stage-lazy.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-lazy-features.js" || true)
            css_code=$(curl -sS -D /tmp/admin-stage-css-headers -o /tmp/admin-stage.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/compact-control-center.css" || true)

            if [[ "$root_code" == '200' && "$health_code" == '200' && "$demand_code" == '200' && "$lazy_code" == '200' && "$css_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-stage-headers \
              && grep -Fiq 'x-ekodi-staging: ekodi-admin-staging' /tmp/admin-stage-headers \
              && grep -Fq '"productionTraffic":false' /tmp/admin-stage-health.json \
              && grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" /tmp/admin-stage-demand.js \
              && ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" /tmp/admin-stage-demand.js \
              && grep -Fq "actionType:'ui.change_request'" /tmp/admin-stage-lazy.js \
              && grep -Fq '재구성' /tmp/admin-stage-lazy.js \
              && grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' /tmp/admin-stage-lazy.js \
              && grep -Fq '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' /tmp/admin-stage.css \
              && grep -Fq '#aiOpsPanel .ai-ops-side' /tmp/admin-stage.css; then
              echo 'Admin PR staging verified: flat AI Ops, internal specialist routing, action-first Chief AI and zero production traffic.'
              exit 0
            fi
            echo "Admin flat staging verification pending (attempt $attempt/18)."
            sleep 4
          done
          echo 'Admin flat staging verification failed.'
          exit 1
