name: Deploy Admin PR Staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-staging.yml'
      - 'admin-staging-worker.js'
      - 'wrangler.admin.staging.toml'
      - 'site-worker.js'
      - 'control-center.html'
      - 'control-center.js'
      - 'control-center-features.js'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'campus-actions.js'
      - 'campus-actions.css'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-lazy-features.js'
      - 'admin-menu-layout.js'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'mission-control-admin.js'
      - 'mission-control-admin.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-timeline-admin.js'
      - 'system-timeline-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'config/ekodi-entrypoints.json'
      - 'docs/architecture/ekodi-entrypoint-standard.md'
      - 'test/mission-control-admin.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/ekodi-entrypoint-standard.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-admin-staging.topmaster-joseph.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Governance Cockpit, thin lazy startup, ekodi.index policy and admin routing
        run: |
          set -euo pipefail
          node --check admin-staging-worker.js
          node --check site-worker.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check device-control-admin.js
          node --check scripts/admin-thin-postbuild.mjs
          node --check mission-control-admin.js
          node --check system-health-admin.js
          node --check system-timeline-admin.js
          node --test test/admin-true-lazy.test.mjs
          node --test test/admin-thin-shell.test.mjs
          node --test test/mission-control-admin.test.mjs
          node --test test/ekodi-entrypoint-standard.test.mjs
          npm run build
          test -f dist/admin-demand-loader.js
          test -f dist/device-control-admin.js
          test -f dist/device-control-admin.css
          test -f dist/mission-control-admin.js
          test -f dist/mission-control-admin.css
          test -f dist/system-health-admin.js
          grep -Fq 'admin-demand-loader.js' dist/control-center.html
          grep -Fq '20260819-thin-shell-2' dist/control-center.html
          grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' dist/control-center.html
          ! grep -Fq 'ai-ops-admin.js" defer' dist/control-center.html
          ! grep -Fq 'WINDOWS_AGENT_URL' dist/compact-control-center.js
          ! grep -Fq 'CAMPUS_SERVICES' dist/compact-control-center.js
          grep -Fq 'WINDOWS_AGENT_URL' dist/device-control-admin.js
          grep -Fq '.ekodi-device-panel' dist/device-control-admin.css
          grep -Fq "scripts: ['ai-ops-admin.js']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['device-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "secondaryScripts: ['mission-control-admin.js', 'release-control-admin.js', 'admin-lazy-features.js', 'system-health-admin.js']" dist/admin-demand-loader.js
          grep -Fq 'CHIEF AI BRIEF' dist/mission-control-admin.js
          grep -Fq 'DECISION QUEUE' dist/mission-control-admin.js
          grep -Fq 'AI COUNCIL' dist/mission-control-admin.js
          grep -Fq 'governanceCommandBar' dist/mission-control-admin.js
          grep -Fq 'governanceSystemHub' dist/release-control-admin.js
          grep -Fq 'System Timeline' dist/release-control-admin.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy isolated admin staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.admin.staging.toml

      - name: Verify staging shell, Device demand assets, security route and on-demand Governance assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -D /tmp/admin-stage-headers -o /tmp/admin-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -D /tmp/admin-stage-health-headers -o /tmp/admin-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            demand_code=$(curl -sS -D /tmp/admin-stage-demand-headers -o /tmp/admin-stage-demand.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-demand-loader.js" || true)
            device_js_code=$(curl -sS -D /tmp/admin-stage-device-js-headers -o /tmp/admin-stage-device.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/device-control-admin.js" || true)
            device_css_code=$(curl -sS -D /tmp/admin-stage-device-css-headers -o /tmp/admin-stage-device.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/device-control-admin.css" || true)
            js_code=$(curl -sS -D /tmp/admin-stage-js-headers -o /tmp/admin-stage.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/mission-control-admin.js" || true)
            css_code=$(curl -sS -D /tmp/admin-stage-css-headers -o /tmp/admin-stage.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/mission-control-admin.css" || true)

            if [[ "$root_code" == '200' && "$health_code" == '200' && "$demand_code" == '200' && "$device_js_code" == '200' && "$device_css_code" == '200' && "$js_code" == '200' && "$css_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-stage-headers \
              && grep -Fiq 'x-ekodi-staging: ekodi-admin-staging' /tmp/admin-stage-headers \
              && grep -Fq '20260819-thin-shell-2' /tmp/admin-stage.html \
              && grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' /tmp/admin-stage.html \
              && ! grep -Fq 'ai-ops-admin.js" defer' /tmp/admin-stage.html \
              && grep -Fq '"productionTraffic":false' /tmp/admin-stage-health.json \
              && grep -Fiq 'x-ekodi-route: admin-asset' /tmp/admin-stage-demand-headers \
              && grep -Fq "scripts: ['ai-ops-admin.js']" /tmp/admin-stage-demand.js \
              && grep -Fq "scripts: ['device-control-admin.js']" /tmp/admin-stage-demand.js \
              && grep -Fq 'WINDOWS_AGENT_URL' /tmp/admin-stage-device.js \
              && grep -Fq '.ekodi-device-panel' /tmp/admin-stage-device.css \
              && grep -Fiq 'x-ekodi-route: admin-asset' /tmp/admin-stage-js-headers \
              && grep -Fiq 'x-ekodi-route: admin-asset' /tmp/admin-stage-css-headers \
              && grep -Fq 'CHIEF AI BRIEF' /tmp/admin-stage.js \
              && grep -Fq 'DECISION QUEUE' /tmp/admin-stage.js \
              && grep -Fq 'AI COUNCIL' /tmp/admin-stage.js \
              && grep -Fq '.mission-dashboard' /tmp/admin-stage.css; then
              echo 'Admin PR staging verified: thin authenticated shell, standalone Device demand assets, on-demand Governance assets, isolated hostname and zero production traffic.'
              exit 0
            fi
            echo "Admin PR staging verification pending (attempt $attempt/18)."
            sleep 4
          done
          echo 'Admin PR staging verification failed.'
          exit 1
