name: Deploy Admin PR Staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-staging.yml'
      - 'package.json'
      - 'admin-staging-worker.js'
      - 'wrangler.admin.staging.toml'
      - 'site-worker.js'
      - 'admin-shell.html'
      - 'admin-shell.css'
      - 'admin-compact.js'
      - 'admin-compact.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-menu-layout.js'
      - 'admin-menu-registry.js'
      - 'admin-sidebar.js'
      - 'admin-menu-runtime.js'
      - 'marketing-funnel-admin.js'
      - 'marketing-funnel-admin.css'
      - 'mall.html'
      - 'mall.js'
      - 'mall.css'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'test/admin-readable-command.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/admin-health-menu.test.mjs'
      - 'test/admin-preauth-shell.test.mjs'
      - 'test/admin-performance-hardening.test.mjs'
      - 'test/admin-readable-command.test.mjs'
      - 'test/mission-control-admin.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-admin-staging.ekodi-development.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate current Admin thin shell and mall AI sales surface
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-staging-worker.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-menu-layout.js
          node --check marketing-funnel-admin.js
          node --test test/admin-true-lazy.test.mjs test/admin-thin-shell.test.mjs test/admin-health-menu.test.mjs test/admin-preauth-shell.test.mjs test/admin-performance-hardening.test.mjs test/admin-readable-command.test.mjs test/mission-control-admin.test.mjs
          npm run build

          for asset in admin-shell.html admin-shell.css admin-compact.js admin-compact.css admin-central-handoff.js admin-authenticated-shell.js admin-demand-loader.js admin-menu-layout.js admin-menu-registry.js marketing-funnel-admin.js marketing-funnel-admin.css mall.html mall.js mall.css; do
            test -f "dist/$asset"
          done

          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/admin-shell.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          grep -Fq "admin-shell.css?v=$version" dist/admin-shell.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/admin-shell.html
          grep -Fq 'data-ekodi-postauth="admin-compact.js admin-menu-layout.js admin-demand-loader.js"' dist/admin-shell.html
          grep -Fq '#mall-ai-sales:affiliates' dist/admin-menu-layout.js
          grep -Fq 'affiliates:#mall-ai-sales' dist/admin-menu-layout.js
          grep -Fq '에코디몰 AI 영업' dist/admin-menu-registry.js
          grep -Fq 'mall_sales_events' dist/marketing-funnel-admin.js
          grep -Fq "test: 'eq.false'" dist/marketing-funnel-admin.js
          grep -Fq 'https://ekodi.kr/mall' dist/marketing-funnel-admin.js
          grep -Fq 'mall_sales_events' dist/mall.html
          grep -Fq "const test=params.get('ekodi_test')==='1'" dist/mall.html
          echo "Admin staging build contract verified: version=$version"

      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f' || {
            echo '::error::Admin staging must use EKODI Development.'
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo '::error::Missing CLOUDFLARE_DEVELOPMENT_API_TOKEN.'
            exit 1
          }

      - name: Deploy isolated admin staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.admin.staging.toml

      - name: Verify protected staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -D /tmp/admin-stage.headers -o /tmp/admin-stage.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$code" == '302' ]] && grep -iq '^Www-Authenticate: Cloudflare-Access' /tmp/admin-stage.headers; then
              echo "Admin staging deployed and protected by Cloudflare Access: $STAGING_URL"
              exit 0
            fi
            if [[ "$code" == '200' ]] && grep -Fq '"productionTraffic":false' /tmp/admin-stage.body && grep -Fiq 'x-ekodi-staging: ekodi-admin-staging' /tmp/admin-stage.headers; then
              root_code=$(curl -sS -D /tmp/admin-root.headers -o /tmp/admin-root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/#mall-ai-sales" || true)
              if [[ "$root_code" == '200' ]] && grep -Fq 'admin-authenticated-shell.js?v=' /tmp/admin-root.html; then
                echo "Admin staging deployed and verified with zero production traffic: $STAGING_URL"
                exit 0
              fi
            fi
            echo "Admin staging pending ($attempt/18, health=$code)"
            sleep 4
          done
          echo 'Admin PR staging verification failed.'
          exit 1
