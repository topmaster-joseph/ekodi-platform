name: Deploy Admin PR Staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-staging.yml'
      - 'package.json'
      - 'admin-staging-worker.js'
      - 'wrangler.admin.staging.toml'
      - 'wrangler.site.toml'
      - 'site-worker.js'
      - 'admin-shell.html'
      - 'admin-shell.css'
      - 'admin-finance.css'
      - 'admin-compact.js'
      - 'admin-compact.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-perf-diagnostics.js'
      - 'admin-lazy-features.js'
      - 'admin-readable-command.js'
      - 'admin-readable-command.css'
      - 'admin-menu-layout.js'
      - 'admin-menu-registry.js'
      - 'admin-sidebar.js'
      - 'admin-menu-runtime.js'
      - 'campus-actions.js'
      - 'campus-actions.css'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'remote-power-admin.js'
      - 'remote-power-admin.css'
      - 'finance-monitor.js'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'mission-control-admin.js'
      - 'mission-control-admin.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-timeline-admin.js'
      - 'system-timeline-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'test/admin-menu-links.test.mjs'
      - 'test/admin-readable-command.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/admin-health-menu.test.mjs'
      - 'test/admin-preauth-shell.test.mjs'
      - 'test/admin-performance-hardening.test.mjs'
      - 'test/mission-control-admin.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-admin-staging.ekodi-development.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate fingerprinted flat AI Ops, standalone Health and full-path performance
        run: |
          set -euo pipefail
          node --check admin-staging-worker.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-perf-diagnostics.js
          node --check admin-readable-command.js
          node --check admin-menu-layout.js
          node --check admin-menu-runtime.js
          node --check device-control-admin.js
          node --check remote-power-admin.js
          node --check system-health-admin.js
          node --check scripts/admin-thin-postbuild.mjs
          node --check scripts/admin-readable-command-postbuild.mjs
          node --check scripts/admin-performance-postbuild.mjs
          node --test test/admin-menu-links.test.mjs test/admin-true-lazy.test.mjs test/admin-thin-shell.test.mjs test/admin-health-menu.test.mjs test/admin-preauth-shell.test.mjs test/admin-performance-hardening.test.mjs test/admin-readable-command.test.mjs test/mission-control-admin.test.mjs
          npm run build

          for asset in admin-central-handoff.js admin-authenticated-shell.js admin-demand-loader.js admin-perf-diagnostics.js admin-menu-layout.js admin-menu-registry.js admin-sidebar.js admin-menu-runtime.js admin-compact.js admin-compact.css device-control-admin.js device-control-admin.css remote-power-admin.js remote-power-admin.css ai-ops-admin.css admin-readable-command.js release-control-admin.js system-health-admin.js system-health-admin.css; do
            test -f "dist/$asset"
          done

          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/admin-shell.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          grep -Fq "admin-shell.css?v=$version" dist/admin-shell.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/admin-shell.html
          grep -Fq 'data-ekodi-postauth="admin-compact.js admin-menu-layout.js admin-demand-loader.js"' dist/admin-shell.html
          ! grep -Fq '<script src="control-center.js"' dist/admin-shell.html
          ! grep -Fq 'control-center-ops.css' dist/admin-shell.html
          ! grep -Fq 'admin-finance.css' dist/admin-shell.html
          ! grep -Fq 'ai-ops-admin.js" defer' dist/admin-shell.html
          ! grep -Fq 'WINDOWS_AGENT_URL' dist/admin-compact.js
          ! grep -Fq 'CAMPUS_SERVICES' dist/admin-compact.js
          ! grep -Fq 'installPolicies' dist/admin-compact.js
          ! grep -Fq 'setTimeout(' dist/admin-compact.js
          ! grep -Fq 'setInterval(' dist/finance-monitor.js
          grep -Fq 'WINDOWS_AGENT_URL' dist/device-control-admin.js
          grep -Fq '.ekodi-device-panel' dist/device-control-admin.css
          grep -Fq "scripts: ['ai-ops-admin.js']" dist/admin-demand-loader.js
          grep -Fq "secondaryScripts: ['admin-lazy-features.js']" dist/admin-demand-loader.js
          grep -Fq 'health:' dist/admin-demand-loader.js
          grep -Fq "styles: ['system-health-admin.css']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['system-health-admin.js']" dist/admin-demand-loader.js
          grep -Fq "hashes: ['#health']" dist/admin-demand-loader.js
          ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq "scripts: ['release-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "device-control-admin.js" dist/admin-demand-loader.js
          grep -Fq "remote-power-admin.js" dist/admin-demand-loader.js
          grep -Fq 'isInputPending' dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-readable-command.js
          grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' dist/admin-readable-command.js
          grep -Fq 'admin-readable-command.css' dist/ai-ops-admin.css
          ! grep -Fq 'admin-readable-command.css' dist/admin-compact.css
          grep -Fq "navLabel.textContent = '시스템 건강'" dist/system-health-admin.js
          grep -Fq "pageTitle.textContent = '시스템 건강'" dist/system-health-admin.js
          ! grep -Fq 'setInterval(' dist/system-health-admin.js

          compact_bytes=$(wc -c < dist/admin-compact.js)
          first_js=$(( $(wc -c < dist/admin-central-handoff.js) + $(wc -c < dist/admin-authenticated-shell.js) + compact_bytes + $(wc -c < dist/admin-menu-layout.js) + $(wc -c < dist/admin-demand-loader.js) ))
          first_css=$(( $(wc -c < dist/admin-shell.css) + $(wc -c < dist/admin-compact.css) ))
          test "$compact_bytes" -le 5000
          test "$first_js" -le 43000
          test "$first_css" -le 40000
          echo "Build contract verified: version=$version compact=${compact_bytes}B first-js=${first_js}B first-css=${first_css}B"

      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f' || {
            echo '::error::Admin staging must use EKODI Development.'
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo '::error::Missing CLOUDFLARE_DEVELOPMENT_API_TOKEN.'
            exit 1
          }

      - name: Deploy isolated admin staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.admin.staging.toml

      - name: Verify protected staging and latest flat AI Ops
        shell: bash
        run: |
          set -euo pipefail
          access_code=$(curl -sS -D /tmp/admin-access.headers -o /tmp/admin-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
          if [[ "$access_code" == '302' ]] && grep -iq '^Www-Authenticate: Cloudflare-Access' /tmp/admin-access.headers; then
            echo "Admin staging deployed and is correctly protected by Cloudflare Access at $STAGING_URL"
            exit 0
          fi
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -D /tmp/admin-stage-headers -o /tmp/admin-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -D /tmp/admin-stage-health-headers -o /tmp/admin-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' /tmp/admin-stage.html 2>/dev/null | head -1 | sed 's/.*?v=//' || true)
            if [[ "$root_code" != '200' || "$health_code" != '200' || -z "$version" ]]; then
              echo "Admin PR staging fingerprint pending (attempt $attempt/18)."
              sleep 4
              continue
            fi

            q="?v=$version"
            handoff_code=$(curl -sS -D /tmp/admin-stage-handoff-headers -o /tmp/admin-stage-handoff.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-central-handoff.js$q" || true)
            demand_code=$(curl -sS -D /tmp/admin-stage-demand-headers -o /tmp/admin-stage-demand.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-demand-loader.js$q" || true)
            compact_code=$(curl -sS -D /tmp/admin-stage-compact-headers -o /tmp/admin-stage-compact.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-compact.js$q" || true)
            perf_code=$(curl -sS -o /tmp/admin-stage-perf.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-perf-diagnostics.js$q" || true)
            device_code=$(curl -sS -o /tmp/admin-stage-device.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/device-control-admin.js$q" || true)
            ai_css_code=$(curl -sS -o /tmp/admin-stage-ai.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/ai-ops-admin.css$q" || true)
            readable_code=$(curl -sS -o /tmp/admin-stage-readable.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-readable-command.js$q" || true)
            health_js_code=$(curl -sS -D /tmp/admin-stage-health-js-headers -o /tmp/admin-stage-health.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/system-health-admin.js$q" || true)
            health_css_code=$(curl -sS -D /tmp/admin-stage-health-css-headers -o /tmp/admin-stage-health.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/system-health-admin.css$q" || true)

            if [[ "$handoff_code" == '200' && "$demand_code" == '200' && "$compact_code" == '200' && "$perf_code" == '200' && "$device_code" == '200' && "$ai_css_code" == '200' && "$readable_code" == '200' && "$health_js_code" == '200' && "$health_css_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: admin-shell' /tmp/admin-stage-headers \
              && grep -Fiq 'x-ekodi-staging: ekodi-admin-staging' /tmp/admin-stage-headers \
              && grep -Fq '"productionTraffic":false' /tmp/admin-stage-health.json \
              && grep -Fq "admin-shell.css?v=$version" /tmp/admin-stage.html \
              && grep -Fq "admin-central-handoff.js?v=$version" /tmp/admin-stage.html \
              && ! grep -Fq '<script src="control-center.js"' /tmp/admin-stage.html \
              && ! grep -Fq 'control-center-ops.css' /tmp/admin-stage.html \
              && ! grep -Fq 'admin-finance.css' /tmp/admin-stage.html \
              && grep -Fq 'AbortController' /tmp/admin-stage-handoff.js \
              && ! grep -Fq 'PerformanceObserver' /tmp/admin-stage-handoff.js \
              && grep -Fq 'PerformanceObserver' /tmp/admin-stage-perf.js \
              && grep -Fq "secondaryScripts: ['admin-lazy-features.js']" /tmp/admin-stage-demand.js \
              && grep -Fq 'health:' /tmp/admin-stage-demand.js \
              && grep -Fq "scripts: ['system-health-admin.js']" /tmp/admin-stage-demand.js \
              && ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" /tmp/admin-stage-demand.js \
              && grep -Fq 'deployments:' /tmp/admin-stage-demand.js \
              && grep -Fq 'isInputPending' /tmp/admin-stage-demand.js \
              && ! grep -Fq 'WINDOWS_AGENT_URL' /tmp/admin-stage-compact.js \
              && ! grep -Fq 'installPolicies' /tmp/admin-stage-compact.js \
              && ! grep -Fq 'setTimeout(' /tmp/admin-stage-compact.js \
              && [[ $(wc -c < /tmp/admin-stage-compact.js) -le 5000 ]] \
              && grep -Fq 'WINDOWS_AGENT_URL' /tmp/admin-stage-device.js \
              && grep -Fq 'admin-readable-command.css' /tmp/admin-stage-ai.css \
              && grep -Fq "actionType:'ui.change_request'" /tmp/admin-stage-readable.js \
              && grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' /tmp/admin-stage-readable.js \
              && grep -Fq "navLabel.textContent = '시스템 건강'" /tmp/admin-stage-health.js \
              && grep -Fq "pageTitle.textContent = '시스템 건강'" /tmp/admin-stage-health.js \
              && grep -Fq '.system-health-overall' /tmp/admin-stage-health.css; then
              echo "Admin PR staging verified: version=$version, standalone Health, fingerprinted thin shell, demand-only features, latest flat AI Ops, zero production traffic."
              exit 0
            fi
            echo "Admin PR staging verification pending (attempt $attempt/18, version=$version)."
            sleep 4
          done
          echo 'Admin PR staging verification failed.'
          exit 1
