name: Deploy Admin PR Staging

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-staging.yml'
      - 'package.json'
      - 'admin-staging-worker.js'
      - 'wrangler.admin.staging.toml'
      - 'site-worker.js'
      - 'control-center.html'
      - 'control-center.js'
      - 'control-center.css'
      - 'control-center-ops.css'
      - 'control-center-finance.css'
      - 'control-center-features.js'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'campus-actions.js'
      - 'campus-actions.css'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-perf-diagnostics.js'
      - 'admin-lazy-features.js'
      - 'admin-menu-layout.js'
      - 'admin-readable-command.css'
      - 'admin-readable-command.js'
      - 'finance-monitor.js'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'mission-control-admin.js'
      - 'mission-control-admin.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-timeline-admin.js'
      - 'system-timeline-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'config/ekodi-entrypoints.json'
      - 'docs/architecture/ekodi-entrypoint-standard.md'
      - 'test/mission-control-admin.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/admin-preauth-shell.test.mjs'
      - 'test/admin-performance-hardening.test.mjs'
      - 'test/ekodi-entrypoint-standard.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-admin-staging.topmaster-joseph.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate end-to-end performance, governance and admin routing
        run: |
          set -euo pipefail
          node --check admin-staging-worker.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-perf-diagnostics.js
          node --check admin-menu-layout.js
          node --check device-control-admin.js
          node --check scripts/admin-thin-postbuild.mjs
          node --check scripts/admin-readable-command-postbuild.mjs
          node --check scripts/admin-performance-postbuild.mjs
          node --check mission-control-admin.js
          node --check system-health-admin.js
          node --check system-timeline-admin.js
          node --test test/admin-true-lazy.test.mjs test/admin-thin-shell.test.mjs test/admin-preauth-shell.test.mjs test/admin-performance-hardening.test.mjs test/mission-control-admin.test.mjs test/ekodi-entrypoint-standard.test.mjs
          npm run build
          for asset in admin-central-handoff.js admin-authenticated-shell.js admin-demand-loader.js admin-perf-diagnostics.js device-control-admin.js device-control-admin.css mission-control-admin.js mission-control-admin.css system-health-admin.js; do test -f "dist/$asset"; done
          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/control-center.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          grep -Fq "control-center.css?v=$version" dist/control-center.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/control-center.html
          grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' dist/control-center.html
          ! grep -Fq '<script src="control-center.js"' dist/control-center.html
          ! grep -Fq 'control-center-ops.css' dist/control-center.html
          ! grep -Fq 'control-center-finance.css' dist/control-center.html
          ! grep -Fq 'ai-ops-admin.js" defer' dist/control-center.html
          ! grep -Fq 'WINDOWS_AGENT_URL' dist/compact-control-center.js
          ! grep -Fq 'CAMPUS_SERVICES' dist/compact-control-center.js
          ! grep -Fq 'installPolicies' dist/compact-control-center.js
          ! grep -Fq 'setTimeout(' dist/compact-control-center.js
          ! grep -Fq 'setInterval(' dist/finance-monitor.js
          grep -Fq 'WINDOWS_AGENT_URL' dist/device-control-admin.js
          grep -Fq '.ekodi-device-panel' dist/device-control-admin.css
          grep -Fq "scripts: ['ai-ops-admin.js']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['device-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "loadScript('finance-monitor.js')" dist/admin-demand-loader.js
          grep -Fq 'isInputPending' dist/admin-demand-loader.js
          grep -Fq 'admin-readable-command.css' dist/ai-ops-admin.css
          ! grep -Fq 'admin-readable-command.css' dist/compact-control-center.css
          grep -Fq 'CHIEF AI BRIEF' dist/mission-control-admin.js
          grep -Fq 'DECISION QUEUE' dist/mission-control-admin.js
          grep -Fq 'AI COUNCIL' dist/mission-control-admin.js
          grep -Fq 'governanceCommandBar' dist/mission-control-admin.js
          grep -Fq 'governanceSystemHub' dist/release-control-admin.js
          grep -Fq 'System Timeline' dist/release-control-admin.js
          compact_bytes=$(wc -c < dist/compact-control-center.js)
          first_js=$(( $(wc -c < dist/admin-central-handoff.js) + $(wc -c < dist/admin-authenticated-shell.js) + compact_bytes + $(wc -c < dist/admin-menu-layout.js) + $(wc -c < dist/admin-demand-loader.js) ))
          test "$compact_bytes" -le 5000
          test "$first_js" -le 43000

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy isolated admin staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.admin.staging.toml

      - name: Verify staging fingerprinted performance shell, Device demand assets and Governance
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -D /tmp/admin-stage-headers -o /tmp/admin-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -D /tmp/admin-stage-health-headers -o /tmp/admin-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' /tmp/admin-stage.html 2>/dev/null | head -1 | sed 's/.*?v=//' || true)
            if [[ "$root_code" != '200' || "$health_code" != '200' || -z "$version" ]]; then echo "Admin PR staging fingerprint pending (attempt $attempt/18)."; sleep 4; continue; fi
            q="?v=$version"
            handoff_code=$(curl -sS -D /tmp/admin-stage-handoff-headers -o /tmp/admin-stage-handoff.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-central-handoff.js$q" || true)
            demand_code=$(curl -sS -D /tmp/admin-stage-demand-headers -o /tmp/admin-stage-demand.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-demand-loader.js$q" || true)
            compact_code=$(curl -sS -D /tmp/admin-stage-compact-headers -o /tmp/admin-stage-compact.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/compact-control-center.js$q" || true)
            perf_code=$(curl -sS -o /tmp/admin-stage-perf.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admin-perf-diagnostics.js$q" || true)
            device_js_code=$(curl -sS -D /tmp/admin-stage-device-js-headers -o /tmp/admin-stage-device.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/device-control-admin.js$q" || true)
            device_css_code=$(curl -sS -D /tmp/admin-stage-device-css-headers -o /tmp/admin-stage-device.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/device-control-admin.css$q" || true)
            js_code=$(curl -sS -D /tmp/admin-stage-js-headers -o /tmp/admin-stage.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/mission-control-admin.js$q" || true)
            css_code=$(curl -sS -D /tmp/admin-stage-css-headers -o /tmp/admin-stage.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/mission-control-admin.css$q" || true)

            if [[ "$handoff_code" == '200' && "$demand_code" == '200' && "$compact_code" == '200' && "$perf_code" == '200' && "$device_js_code" == '200' && "$device_css_code" == '200' && "$js_code" == '200' && "$css_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-stage-headers \
              && grep -Fiq 'x-ekodi-staging: ekodi-admin-staging' /tmp/admin-stage-headers \
              && grep -Fq "control-center.css?v=$version" /tmp/admin-stage.html \
              && grep -Fq "admin-central-handoff.js?v=$version" /tmp/admin-stage.html \
              && grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' /tmp/admin-stage.html \
              && ! grep -Fq '<script src="control-center.js"' /tmp/admin-stage.html \
              && ! grep -Fq 'control-center-ops.css' /tmp/admin-stage.html \
              && ! grep -Fq 'control-center-finance.css' /tmp/admin-stage.html \
              && ! grep -Fq 'ai-ops-admin.js" defer' /tmp/admin-stage.html \
              && grep -Fq '"productionTraffic":false' /tmp/admin-stage-health.json \
              && grep -Fq 'AbortController' /tmp/admin-stage-handoff.js \
              && ! grep -Fq 'PerformanceObserver' /tmp/admin-stage-handoff.js \
              && grep -Fq 'PerformanceObserver' /tmp/admin-stage-perf.js \
              && grep -Fq "scripts: ['ai-ops-admin.js']" /tmp/admin-stage-demand.js \
              && grep -Fq "scripts: ['device-control-admin.js']" /tmp/admin-stage-demand.js \
              && grep -Fq 'isInputPending' /tmp/admin-stage-demand.js \
              && ! grep -Fq 'WINDOWS_AGENT_URL' /tmp/admin-stage-compact.js \
              && ! grep -Fq 'installPolicies' /tmp/admin-stage-compact.js \
              && ! grep -Fq 'setTimeout(' /tmp/admin-stage-compact.js \
              && [[ $(wc -c < /tmp/admin-stage-compact.js) -le 5000 ]] \
              && grep -Fq 'WINDOWS_AGENT_URL' /tmp/admin-stage-device.js \
              && grep -Fq '.ekodi-device-panel' /tmp/admin-stage-device.css \
              && grep -Fiq 'x-ekodi-route: admin-asset' /tmp/admin-stage-js-headers \
              && grep -Fiq 'x-ekodi-route: admin-asset' /tmp/admin-stage-css-headers \
              && grep -Fq 'CHIEF AI BRIEF' /tmp/admin-stage.js \
              && grep -Fq 'DECISION QUEUE' /tmp/admin-stage.js \
              && grep -Fq 'AI COUNCIL' /tmp/admin-stage.js \
              && grep -Fq '.mission-dashboard' /tmp/admin-stage.css; then
              echo "Admin PR staging verified: version=$version fingerprinted performance shell, demand-only operations and zero production traffic. handoff=$(wc -c < /tmp/admin-stage-handoff.js) compact=$(wc -c < /tmp/admin-stage-compact.js) demand=$(wc -c < /tmp/admin-stage-demand.js)"
              exit 0
            fi
            echo "Admin PR staging verification pending (attempt $attempt/18, version=$version)."
            sleep 4
          done
          echo 'Admin PR staging verification failed.'
          exit 1
