# registrar-confirmation-recheck: 2026-09-30T20:47:00+09:00
name: SeonamMedi Native Domain Verification

on:
  push:
    branches:
      - ai/chatgpt/seonammedi-native-verify-20260930
    paths:
      - '.github/workflows/seonammedi-native-domain-verify.yml'

permissions:
  contents: read
  actions: write

jobs:
  native-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce EKODI native virtualization contract
        run: |
          set -euo pipefail
          node --check virtualization-router.js
          node scripts/validate-virtualization-routing.mjs
          node scripts/validate-background-browser-worker.mjs

      - name: Install isolated Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build SeonamMedi browser verification task
        run: |
          mkdir -p artifacts
          cat > artifacts/browser-task.json <<'JSON'
          {
            "taskId": "seonammedi-native-verify",
            "path": "/seonammedi/",
            "deviceProfile": "desktop",
            "allowMutation": false,
            "timeoutMs": 120000,
            "actions": [
              {"type":"snapshot"},
              {"type":"screenshot","name":"seonammedi-public","fullPage":true},
              {"type":"goto","path":"/seonammedi/admin/"},
              {"type":"snapshot"},
              {"type":"screenshot","name":"seonammedi-admin","fullPage":true}
            ]
          }
          JSON

      - name: Run EKODI-owned isolated browser
        env:
          EKODI_BROWSER_TASK_FILE: artifacts/browser-task.json
          EKODI_BROWSER_ARTIFACT_DIR: artifacts/native-browser
        run: node scripts/ekodi-background-browser-worker.mjs

      - name: Validate native browser evidence
        shell: bash
        run: |
          set -euo pipefail
          result=$(find artifacts/native-browser -name result.json -print -quit)
          test -n "$result"
          jq -e '.ok == true and .mode == "ekodi-owned-background-browser" and .canonicalOrigin == "https://ekodi.kr" and .headless == true and .ephemeralContext == true and .activeUserProfileReused == false and .hostInputInjection == false and .allowMutation == false' "$result" >/dev/null
          jq -e '.pageErrors | length == 0' "$result" >/dev/null
          jq -e '.screenshots | length >= 2' "$result" >/dev/null

      - name: Inspect authoritative nameservers
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          {
            echo "seonammedi.kr"
            dig +short NS seonammedi.kr | sort
            echo "xn--3e0b8b58jw4co4mnpll3k.kr"
            dig +short NS xn--3e0b8b58jw4co4mnpll3k.kr | sort
          } | tee artifacts/ns-status.txt

      - name: Trigger Cloudflare activation recheck for pending IDN zone
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          zone='xn--3e0b8b58jw4co4mnpll3k.kr'
          raw=$(curl -fsS "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          id=$(echo "$raw" | jq -r '.result[0].id // empty')
          status=$(echo "$raw" | jq -r '.result[0].status // "missing"')
          echo "before_status=$status" | tee artifacts/activation-check.txt
          if [ "$status" = "pending" ] && [ -n "$id" ]; then
            code=$(curl -sS -o /tmp/activation.json -w '%{http_code}' -X PUT \
              "$api/zones/$id/activation_check" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "activation_http=$code" | tee -a artifacts/activation-check.txt
            jq -c '{success,errors,messages,result}' /tmp/activation.json | tee -a artifacts/activation-check.txt
          else
            echo "activation_skipped=true" | tee -a artifacts/activation-check.txt
          fi

      - name: Inspect public HTTPS behavior
        shell: bash
        run: |
          set -u
          : > artifacts/http-status.txt
          for url in 'https://seonammedi.kr/' 'https://xn--3e0b8b58jw4co4mnpll3k.kr/'; do
            echo "URL=$url" >> artifacts/http-status.txt
            code=$(curl -sS -o /dev/null -D /tmp/headers -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || echo 000)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
            echo "HTTP=$code" >> artifacts/http-status.txt
            echo "LOCATION=$location" >> artifacts/http-status.txt
          done
          cat artifacts/http-status.txt

      - name: Inspect Cloudflare zone status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api='https://api.cloudflare.com/client/v4'
          for zone in seonammedi.kr xn--3e0b8b58jw4co4mnpll3k.kr; do
            raw=$(curl -fsS --retry 2 --retry-delay 1 \
              "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "$raw" | jq -e '.success == true' >/dev/null
            echo "$raw" | jq -c --arg z "$zone" '{
              zone:$z,
              found:(.result|length>0),
              status:(.result[0].status // "missing"),
              nameservers:(.result[0].name_servers // []),
              originalNameservers:(.result[0].original_name_servers // [])
            }' >> artifacts/cloudflare-zones.jsonl
          done

      - name: Dispatch guarded legacy redirect topology workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='kai.ns.cloudflare.com. meadow.ns.cloudflare.com.'
          for zone in seonammedi.kr xn--3e0b8b58jw4co4mnpll3k.kr; do
            actual=$(dig +short NS "$zone" | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            test "$actual" = "$expected" || { echo "NS preflight failed for $zone: $actual"; exit 1; }
            raw=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            status=$(echo "$raw" | jq -r '.result[0].status // "missing"')
            test "$status" = "active" || { echo "Cloudflare zone not active: $zone status=$status"; exit 1; }
          done
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-seonammedi-domains.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "topology_dispatch_http=$code"
          test "$code" = "204" || { cat /tmp/dispatch.json || true; exit 1; }

      - name: Post-deploy root, admin, DNS and TLS verification
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/postdeploy.txt
          check_redirect() {
            url="$1"; expected="$2"
            meta=$(curl -sS -o /dev/null -w '%{http_code}\t%{redirect_url}' --connect-timeout 10 --max-time 20 "$url")
            code=$(printf '%s' "$meta" | cut -f1)
            location=$(printf '%s' "$meta" | cut -f2-)
            echo "URL=$url HTTP=$code LOCATION=$location" | tee -a artifacts/postdeploy.txt
            test "$code" = "301"
            test "$location" = "$expected"
          }

          check_redirect "https://seonammedi.kr/" "https://ekodi.kr/seonammedi/"
          check_redirect "https://seonammedi.kr/admin/" "https://ekodi.kr/seonammedi/admin/"
          check_redirect "https://seonammedi.kr/notice?id=7" "https://ekodi.kr/seonammedi/notice?id=7"
          check_redirect "https://xn--3e0b8b58jw4co4mnpll3k.kr/" "https://ekodi.kr/seonammedi/"
          check_redirect "https://xn--3e0b8b58jw4co4mnpll3k.kr/admin/" "https://ekodi.kr/seonammedi/admin/"

          for host in seonammedi.kr xn--3e0b8b58jw4co4mnpll3k.kr; do
            echo "HOST=$host" | tee -a artifacts/postdeploy.txt
            echo "A=$(dig +short A "$host" | paste -sd, -)" | tee -a artifacts/postdeploy.txt
            echo "AAAA=$(dig +short AAAA "$host" | paste -sd, -)" | tee -a artifacts/postdeploy.txt
            cert=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates)
            printf '%s\n' "$cert" | tee -a artifacts/postdeploy.txt
          done

          api='https://api.cloudflare.com/client/v4'
          for zone in seonammedi.kr xn--3e0b8b58jw4co4mnpll3k.kr; do
            zid=$(curl -fsS "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
            test -n "$zid"
            curl -fsS "$api/zones/$zid/dns_records?name=$zone&per_page=100"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" |
              jq -c --arg z "$zone" '{zone:$z,records:[.result[]|{type,name,content,proxied}]}' |
              tee -a artifacts/postdeploy.txt
          done

      - name: Publish sanitized summary
        shell: bash
        run: |
          {
            echo '## SeonamMedi EKODI-native verification'
            echo
            echo '### Native browser'
            result=$(find artifacts/native-browser -name result.json -print -quit)
            jq -r '"- OK: \(.ok)\n- Mode: \(.mode)\n- Final URL: \(.finalUrl)\n- Headless: \(.headless)\n- Ephemeral: \(.ephemeralContext)\n- Page errors: \(.pageErrors|length)\n- Screenshots: \(.screenshots|length)"' "$result"
            echo
            echo '### Public authoritative NS'
            sed 's/^/- /' artifacts/ns-status.txt
            echo
            echo '### Cloudflare zones'
            jq -r '"- \(.zone): status=\(.status), assignedNS=\(.nameservers|join(",")), originalNS=\(.originalNameservers|join(","))"' artifacts/cloudflare-zones.jsonl
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seonammedi-native-domain-verify-${{ github.run_id }}
          path: artifacts
          retention-days: 3
