name: System Health Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
  pull_request:
    paths:
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-health-control.js'
      - 'scripts/collect-system-health.mjs'
      - 'scripts/apply-health-simple-diagrams.py'
      - 'migrations/0028_system_usage_daily.sql'
      - 'test/system-health-lightweight.test.mjs'
      - 'test/admin-health-menu.test.mjs'
      - '.github/workflows/system-health-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'system-health-control.js'
      - 'scripts/collect-system-health.mjs'
      - 'migrations/0028_system_usage_daily.sql'
      - '.github/workflows/system-health-analytics.yml'

permissions:
  contents: write

concurrency:
  group: ekodi-system-health-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagram_patch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply lightweight Health diagrams
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-health-simple-diagrams.py
          node --check system-health-admin.js
          node --test test/admin-health-menu.test.mjs test/system-health-lightweight.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system-health-admin.js system-health-admin.css test/admin-health-menu.test.mjs
          git commit -m 'feat: add lightweight Health system diagrams'
          git push origin HEAD:${{ github.head_ref }}

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate lightweight System Health contract
        run: |
          node --check system-health-control.js
          node --check system-health-admin.js
          node --check scripts/collect-system-health.mjs
          node --test test/system-health-lightweight.test.mjs test/admin-health-menu.test.mjs

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Collect 30-day Cloudflare aggregate only
        shell: bash
        run: |
          set -uo pipefail
          sql_file="$RUNNER_TEMP/ekodi-system-health.sql"
          set +e
          node scripts/collect-system-health.mjs "$sql_file"
          collector_status=$?
          set -e

          test -s "$sql_file" || { echo 'System Health SQL was not generated.'; exit 1; }
          npx --yes wrangler@4.119.0 d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --file "$sql_file"

          if [ "$collector_status" -ne 0 ]; then
            echo 'Cloudflare Analytics collection failed. Error state was recorded without affecting site traffic.'
            exit "$collector_status"
          fi

      - name: Confirm no raw request logs are persisted
        shell: bash
        run: |
          grep -Fq 'system_usage_daily' migrations/0028_system_usage_daily.sql
          ! grep -Eqi '(client_ip|request_path|user_agent|raw_log)' migrations/0028_system_usage_daily.sql
          echo 'Verified aggregate-only System Health storage.'
