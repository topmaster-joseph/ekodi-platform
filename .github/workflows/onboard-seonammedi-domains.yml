name: Grant Cloudflare Zone Create Permission

on:
  push:
    branches:
      - ops/onboard-seonammedi-domains-20260930
    paths:
      - .github/workflows/onboard-seonammedi-domains.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-cloudflare-zone-create-grant
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN_ID: 70e86092b1fa0d0a191afe31b83cca56
      ZONE_WRITE_GROUP_ID: e6d2666161e84845a636613608cee8d5
    steps:
      - name: Grant persistent Zone Write permission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          API='https://api.cloudflare.com/client/v4'
          ACCOUNT=os.environ['CF_ACCOUNT_ID']
          TOKEN_ID=os.environ['CF_TOKEN_ID']
          BEARER=os.environ['CF_API_TOKEN']
          ZONE_WRITE=os.environ['ZONE_WRITE_GROUP_ID']

          def request(path, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode('utf-8')
              req=urllib.request.Request(API+path, data=data, method=method)
              req.add_header('Authorization','Bearer '+BEARER)
              req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw=r.read().decode('utf-8')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:
                      payload=json.loads(raw) if raw else {}
                  except Exception:
                      payload={'errors':[{'message':raw[:500]}]}
                  return e.code,payload

          def require(code,payload,label):
              if code != 200:
                  print(label+'_http='+str(code))
                  print(label+'_errors='+json.dumps(payload.get('errors') or [],ensure_ascii=False))
                  raise SystemExit(1)

          code,payload=request(f'/accounts/{ACCOUNT}/tokens/{TOKEN_ID}')
          require(code,payload,'token_read')
          token=payload.get('result') or {}
          policies=token.get('policies') or []

          already=any(
              ZONE_WRITE == str(pg.get('id') or '')
              for p in policies
              for pg in (p.get('permission_groups') or [])
          )

          if already:
              print('zone_write_already_present=true')
          else:
              policies.append({
                  'effect':'allow',
                  'permission_groups':[{'id':ZONE_WRITE}],
                  'resources':{
                      f'com.cloudflare.api.account.{ACCOUNT}':{
                          'com.cloudflare.api.account.zone.*':'*'
                      }
                  }
              })

              update={
                  'name':token.get('name') or 'EKODI GitHub Deploy',
                  'policies':policies,
                  'status':token.get('status') or 'active'
              }
              for key in ('condition','expires_on','not_before'):
                  if token.get(key) is not None:
                      update[key]=token[key]

              code,payload=request(f'/accounts/{ACCOUNT}/tokens/{TOKEN_ID}','PUT',update)
              require(code,payload,'token_update')
              print('zone_write_added=true')

          code,payload=request(f'/accounts/{ACCOUNT}/tokens/{TOKEN_ID}')
          require(code,payload,'token_verify')
          verified=any(
              ZONE_WRITE == str(pg.get('id') or '')
              for p in ((payload.get('result') or {}).get('policies') or [])
              for pg in (p.get('permission_groups') or [])
          )
          print('zone_write_verified='+str(verified).lower())
          if not verified:
              raise SystemExit('Zone Write permission verification failed')

          code,zones=request('/zones?account.id='+ACCOUNT+'&per_page=5')
          require(code,zones,'zone_list_verify')
          print('zone_list_verify_http=200')
          print('zone_count_visible='+str(len(zones.get('result') or [])))
          PY
