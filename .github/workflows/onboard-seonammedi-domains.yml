name: Inspect Cloudflare Zone Permission Groups

on:
  push:
    branches:
      - ops/onboard-seonammedi-domains-20260930
    paths:
      - .github/workflows/onboard-seonammedi-domains.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN_ID: 70e86092b1fa0d0a191afe31b83cca56
    steps:
      - name: Inspect relevant permission groups
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          code=$(curl -sS -o /tmp/groups.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/tokens/permission_groups")
          echo "permission_groups_http=$code"
          [ "$code" = '200' ] || exit 1

          python - <<'PY'
          import json
          groups=json.load(open('/tmp/groups.json')).get('result') or []
          for g in groups:
              name=str(g.get('name') or '')
              scopes=g.get('scopes') or []
              if 'zone' in name.lower() or 'dns' in name.lower():
                  print('GROUP', name)
                  print(' id=', g.get('id',''))
                  print(' scopes=', ','.join(map(str,scopes)))
                  print(' selectable=', g.get('is_selectable'))
          PY
