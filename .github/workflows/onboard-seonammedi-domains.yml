name: Onboard SeonamMedi Domains to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - ops/onboard-seonammedi-domains-20260930
    paths:
      - .github/workflows/onboard-seonammedi-domains.yml

permissions:
  contents: read

concurrency:
  group: seonammedi-domain-onboarding
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Create or locate pending Cloudflare zones
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          : > /tmp/domain-summary.tsv

          python - <<'PY' > /tmp/domains.tsv
          domains=['seonammedi.kr','서남권국립의대.kr']
          for display in domains:
              ascii_name=display.encode('idna').decode('ascii')
              print(display+'\t'+ascii_name)
          PY

          while IFS=$'\t' read -r display domain; do
            [ -n "$domain" ] || continue
            echo "=== $display ($domain) ==="

            curl -fsS "${auth[@]}" "$api/zones?name=$domain&account.id=$CF_ACCOUNT_ID&per_page=50" > /tmp/zone-list.json
            zone_id=$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/zone-list.json')).get('result') or []
          print(rows[0]['id'] if rows else '')
          PY
            )

            if [ -z "$zone_id" ]; then
              payload=$(DOMAIN="$domain" python - <<'PY'
          import json,os
          print(json.dumps({
            'name': os.environ['DOMAIN'],
            'account': {'id': os.environ['CF_ACCOUNT_ID']},
            'type': 'full',
            'jump_start': True
          }))
          PY
              )
              code=$(curl -sS -o /tmp/zone-create.json -w '%{http_code}' -X POST "${auth[@]}" --data "$payload" "$api/zones")
              echo "zone_create_http=$code"
              case "$code" in
                200|201) ;;
                *) cat /tmp/zone-create.json; echo "Cloudflare zone creation failed for $display"; exit 1 ;;
              esac
              zone_id=$(python - <<'PY'
          import json
          print((json.load(open('/tmp/zone-create.json')).get('result') or {}).get('id',''))
          PY
              )
            fi

            test -n "$zone_id"
            curl -fsS "${auth[@]}" "$api/zones/$zone_id" > /tmp/zone.json
            DISPLAY="$display" DOMAIN="$domain" python - <<'PY' | tee /tmp/one-summary.tsv
          import json,os
          z=json.load(open('/tmp/zone.json')).get('result') or {}
          ns=z.get('name_servers') or []
          print('\t'.join([
            os.environ['DISPLAY'],
            os.environ['DOMAIN'],
            z.get('status') or '',
            z.get('id') or '',
            ns[0] if len(ns)>0 else '',
            ns[1] if len(ns)>1 else '',
            z.get('original_registrar') or ''
          ]))
          PY
            cat /tmp/one-summary.tsv >> /tmp/domain-summary.tsv
          done < /tmp/domains.tsv

      - name: Publish nameserver summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## SeonamMedi Cloudflare Zone Onboarding'
            echo
            echo '| Domain | Cloudflare name | Status | Nameserver 1 | Nameserver 2 | Detected registrar |'
            echo '|---|---|---|---|---|---|'
            while IFS=$'\t' read -r display ascii status zone_id ns1 ns2 registrar; do
              echo "| $display | $ascii | $status | $ns1 | $ns2 | $registrar |"
            done < /tmp/domain-summary.tsv
            echo
            echo 'No registrar nameserver was changed by this workflow.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
