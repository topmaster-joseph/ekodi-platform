name: Deploy Service Admin Entry Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - 'service-admin-entry-worker.js'
      - 'wrangler.service-admin-entry.toml'
      - 'wrangler.service-admin-entry.staging.toml'
      - 'deploy/manifests/service-admin-entry.worker.json'
      - 'test/service-admin-entry-gateway.test.mjs'
      - '.github/workflows/deploy-service-admin-entry.yml'
  push:
    branches: [main]
    paths:
      - 'service-admin-entry-worker.js'
      - 'wrangler.service-admin-entry.toml'
      - 'wrangler.service-admin-entry.staging.toml'
      - 'deploy/manifests/service-admin-entry.worker.json'
      - 'test/service-admin-entry-gateway.test.mjs'
      - '.github/workflows/deploy-service-admin-entry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-service-admin-entry-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate independent admin entry gateway
        run: |
          set -euo pipefail
          node --check service-admin-entry-worker.js
          node --test test/service-admin-entry-gateway.test.mjs
          node scripts/validate-admin-subdomain-routes.mjs
          node -e "JSON.parse(require('fs').readFileSync('deploy/manifests/service-admin-entry.worker.json','utf8'))"

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-service-admin-entry-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - name: Verify Development boundary
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
      - name: Deploy isolated staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.service-admin-entry.staging.toml
      - name: Verify deployed staging version and bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.service-admin-entry.staging.toml --json > /tmp/admin-entry-staging-deployments.json
          grep -Eq '[0-9a-f]{8}-[0-9a-f-]{27,}' /tmp/admin-entry-staging-deployments.json
          npx --yes wrangler@${WRANGLER_VERSION} dev --local --config wrangler.service-admin-entry.staging.toml --ip 127.0.0.1 --port 8794 > /tmp/admin-entry-local.log 2>&1 &
          runtime_pid=$!
          trap 'kill $runtime_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/admin-entry-body -w '%{http_code}' --connect-timeout 3 --max-time 8 'http://127.0.0.1:8794/__health' || true)
            if [ "$code" = '200' ] && grep -Fq '"service":"ekodi-service-admin-entry"' /tmp/admin-entry-body; then
              echo 'Service Admin Entry staging deployment and bundled runtime verified.'
              exit 0
            fi
            if ! kill -0 $runtime_pid 2>/dev/null; then cat /tmp/admin-entry-local.log; exit 1; fi
            sleep 2
          done
          cat /tmp/admin-entry-local.log
          exit 1

  production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Guarded first deploy or production promotion
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/service-admin-entry.worker.json
      - name: Verify all repaired admin entrypoints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const manifest=JSON.parse(fs.readFileSync('deploy/manifests/service-admin-entry.worker.json','utf8'));
          (async()=>{for(const item of manifest.worker.requests){const response=await fetch(item.url,{redirect:'manual',signal:AbortSignal.timeout(10000)});if(response.status!==307||!String(response.headers.get('location')||'').startsWith('https://admin.ekodi.kr/'))throw new Error(`${item.url}: ${response.status} ${response.headers.get('location')||''}`);console.log(`OK ${item.url}`)}})().catch(error=>{console.error(error);process.exit(1)});
          NODE
