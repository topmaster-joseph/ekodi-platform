name: Audit and Repair Admin Menu Services V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-fix-admin-menu-services-v3.yml

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  audit-fix-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Repair menu loaders, links, registry and audit contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);
          const patch=(p,fn)=>{const a=read(p);const b=fn(a);if(a!==b)write(p,b)};

          patch('admin-demand-loader.js', source => {
            let next=source;
            if (!/\n\s*clients\s*:\s*\{/.test(next)) {
              const block=`    clients: {\n      label: '고객 사이트', icon: 'C',\n      styles: ['client-access.css'],\n      scripts: ['client-access.js'],\n      real: '[data-section=\"clients\"]',\n      hashes: ['#clients'],\n    },\n    community: {\n      label: '커뮤니티', icon: '◎',\n      styles: ['community-reports-admin.css'],\n      scripts: ['community-reports-admin.js'],\n      real: '[data-section=\"community\"]',\n      hashes: ['#community'],\n    },\n    books: {\n      label: '출판 · 도서', icon: 'B',\n      styles: ['books-admin.css'],\n      scripts: ['books-admin.js'],\n      secondaryStyles: ['books-finance-admin.css'],\n      secondaryScripts: ['books-finance-admin.js'],\n      real: '[data-section=\"books\"]',\n      hashes: ['#books'],\n    },\n    social: {\n      label: '소셜', icon: 'S',\n      styles: ['social-admin.css'],\n      scripts: ['social-admin.js'],\n      real: '[data-section=\"social\"]',\n      hashes: ['#social'],\n    },\n    affiliates: {\n      label: '제휴', icon: 'A',\n      styles: ['marketing-funnel-admin.css'],\n      scripts: ['marketing-funnel-admin.js'],\n      real: '[data-section=\"affiliates\"]',\n      hashes: ['#affiliates'],\n    },\n`;
              if(!next.includes('    marketing: {')) throw new Error('marketing feature anchor missing');
              next=next.replace('    marketing: {', block+'    marketing: {');
            }
            return next;
          });

          patch('admin-shell.html', source => {
            let next=source.split(/\r?\n/).filter(line => !line.includes('accounts.google.com/AccountChooser') && !line.includes('accounts.google.com/AddSession') && !line.includes('<small>MAIL CENTER</small>')).join('\n');
            next=next
              .replace('href="https://mail.google.com/a/ekodi.kr"','href="https://mail.ekodi.kr/"')
              .replace('<small>PRIMARY WORKSPACE MAIL</small><strong>에코디 메일</strong><p>@ekodi.kr Google Workspace 받은편지함</p>','<small>MAIL HUB</small><strong>에코디 메일</strong><p>연결된 Workspace 메일을 확인·검색하고 원본 Gmail로 안전하게 이동</p>')
              .replaceAll('href="https://live.ekodi.kr"','href="https://live.ekodi.kr/"')
              .replaceAll('href="https://live.church.ekodi.kr"','href="https://live.church.ekodi.kr/"')
              .replaceAll('href="https://cloud.ekodi.kr"','href="https://cloud.ekodi.kr/"')
              .replaceAll('href="https://marketing.ekodi.kr"','href="https://marketing.ekodi.kr/"')
              .replaceAll('href="https://cgma.ekodi.kr"','href="https://cgma.ekodi.kr/"')
              .replaceAll('href="https://biz.ekodi.kr"','href="https://biz.ekodi.kr/"')
              .replaceAll('href="https://trade.ekodi.kr"','href="https://trade.biz.ekodi.kr/"')
              .replaceAll('href="https://pay.ekodi.kr"','href="https://pay.ekodi.kr/"')
              .replaceAll('href="https://church.ekodi.kr"','href="https://church.ekodi.kr/"')
              .replaceAll('href="https://lab.ekodi.kr"','href="https://lab.ekodi.kr/"')
              .replace(/admin-authenticated-shell\.js\?v=[^\"]+/,'admin-authenticated-shell.js?v=20260830-menu-service-audit-1');
            return next;
          });

          const registry=JSON.parse(read('config/ecosystem-services.json'));
          const trade=registry.services.find(item=>item.id==='trade');
          if(!trade) throw new Error('trade registry entry missing');
          trade.url='https://trade.biz.ekodi.kr';
          trade.label='trade.biz.ekodi.kr';
          write('config/ecosystem-services.json', JSON.stringify(registry,null,2)+'\n');
          NODE

          cat > scripts/audit-admin-menu-services.mjs <<'AUDIT'
          import fs from 'node:fs';
          const read=p=>fs.readFileSync(p,'utf8');
          const registrySource=read('admin-menu-registry.js');
          const loader=read('admin-demand-loader.js');
          const shell=read('admin-shell.html');
          const services=JSON.parse(read('config/ecosystem-services.json'));
          const esc=value=>String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          const requiredMenus=['campus','work','communication','workspace','organization','clients','admins','life-ai','community','books','social','aiops','marketing-ai','ai-module-spec','ai-membership','finance','tax','affiliates','storage','api-cost','health','security','devices','architecture'];
          for(const id of requiredMenus){if(!new RegExp("\\bid\\s*:\\s*['\"]"+esc(id)+"['\"]").test(registrySource))throw new Error('menu registry missing: '+id)}
          const lazy={campus:'campus',work:'work',clients:'clients','life-ai':'life-ai',community:'community',books:'books',social:'social',aiops:'aiops','marketing-ai':'marketing','ai-module-spec':'ai-module-spec','ai-membership':'aimembers',affiliates:'affiliates',storage:'storage','api-cost':'api-cost',health:'health',security:'security',devices:'devices'};
          for(const [menu,key] of Object.entries(lazy)){if(!new RegExp("(^|\\n)\\s*['\"]?"+esc(key)+"['\"]?\\s*:\\s*\\{",'m').test(loader))throw new Error('lazy loader missing for '+menu+' -> '+key)}
          const modules={
            'client-access.js':['data-section="clients"','/api/customers/'],
            'community-reports-admin.js':['data-section="community"','COMMUNITY'],
            'books-admin.js':['data-section="books"','PUBLICATIONS'],
            'books-finance-admin.js':['Sales & Costs','CHANNEL P&L'],
            'social-admin.js':['data-section="social"','SOCIAL'],
            'marketing-funnel-admin.js':["dataset.section = 'affiliates'",'/api/affiliate/overview'],
          };
          for(const [file,markers] of Object.entries(modules)){if(!fs.existsSync(file))throw new Error('menu module missing: '+file);const source=read(file);for(const marker of markers){if(!source.includes(marker))throw new Error(file+' content contract missing: '+marker)}}
          for(const file of ['client-access.css','community-reports-admin.css','books-admin.css','books-finance-admin.css','social-admin.css','marketing-funnel-admin.css'])if(!fs.existsSync(file))throw new Error('menu stylesheet missing: '+file);
          for(const panel of ['communication','workspace','organization','finance','architecture']){if(!shell.includes('data-panel="'+panel+'"'))throw new Error('static panel missing: '+panel)}
          for(const bad of ['https://mail.google.com/a/ekodi.kr','accounts.google.com/AccountChooser','accounts.google.com/AddSession','href="https://trade.ekodi.kr'])if(shell.includes(bad))throw new Error('legacy/raw provider link survived: '+bad);
          for(const good of ['https://mail.ekodi.kr/','https://trade.biz.ekodi.kr/','https://marketing.ekodi.kr/','https://cgma.ekodi.kr/','https://biz.ekodi.kr/','https://church.ekodi.kr/','https://lab.ekodi.kr/','https://tax.ekodi.kr/'])if(!shell.includes(good))throw new Error('canonical linked service missing: '+good);
          const trade=services.services.find(item=>item.id==='trade');
          if(trade?.url!=='https://trade.biz.ekodi.kr'||trade?.label!=='trade.biz.ekodi.kr')throw new Error('trade registry is not canonical');
          console.log('Admin menu/service audit passed: '+requiredMenus.length+' visible menus, '+Object.keys(lazy).length+' demand-loaded menus, module content contracts and canonical linked services OK.');
          AUDIT

      - name: Validate every menu and subservice module
        run: |
          set -euo pipefail
          node --check admin-demand-loader.js
          node --check scripts/audit-admin-menu-services.mjs
          node scripts/audit-admin-menu-services.mjs
          node scripts/validate-admin-source.mjs
          npm run build
          for f in client-access.js community-reports-admin.js books-admin.js books-finance-admin.js social-admin.js marketing-funnel-admin.js; do node --check "$f"; done
          grep -Fq "clients: {" dist/admin-demand-loader.js
          grep -Fq "community: {" dist/admin-demand-loader.js
          grep -Fq "books: {" dist/admin-demand-loader.js
          grep -Fq "social: {" dist/admin-demand-loader.js
          grep -Fq "affiliates: {" dist/admin-demand-loader.js
          grep -Fq 'https://mail.ekodi.kr/' dist/admin-shell.html
          grep -Fq 'https://trade.biz.ekodi.kr/' dist/admin-shell.html
          ! grep -Fq 'mail.google.com/a/ekodi.kr' dist/admin-shell.html
          ! grep -Fq 'accounts.google.com/AccountChooser' dist/admin-shell.html
          ! grep -Fq 'https://trade.ekodi.kr' dist/admin-shell.html

      - name: Commit repaired admin navigation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-demand-loader.js admin-shell.html config/ecosystem-services.json scripts/audit-admin-menu-services.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(admin): repair menu modules and linked services'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy shared admin site
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Audit production menu assets and linked services
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}"
          code=$(curl -sS -o /tmp/admin -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?audit=$nonce" || true)
          test "$code" = 200
          grep -Fq 'https://mail.ekodi.kr/' /tmp/admin
          grep -Fq 'https://trade.biz.ekodi.kr/' /tmp/admin
          ! grep -Fq 'mail.google.com/a/ekodi.kr' /tmp/admin
          loader_code=$(curl -sS -o /tmp/loader -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-demand-loader.js?v=$nonce" || true)
          test "$loader_code" = 200
          for marker in "clients: {" "community: {" "books: {" "social: {" "affiliates: {"; do grep -Fq "$marker" /tmp/loader; done

          printf '| service | http | final url | title |\n|---|---:|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for url in \
            https://mail.ekodi.kr/ \
            https://live.ekodi.kr/ \
            https://live.church.ekodi.kr/ \
            https://cloud.ekodi.kr/ \
            https://marketing.ekodi.kr/ \
            https://cgma.ekodi.kr/ \
            https://biz.ekodi.kr/ \
            https://trade.biz.ekodi.kr/ \
            https://pay.ekodi.kr/ \
            https://church.ekodi.kr/ \
            https://lab.ekodi.kr/ \
            https://tax.ekodi.kr/; do
            meta=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/service-body -w '%{http_code}|%{url_effective}' "$url" || true)
            status=${meta%%|*}; final=${meta#*|}
            title=$(grep -io '<title>[^<]*</title>' /tmp/service-body | head -1 | sed -E 's#</?title>##Ig' | tr '|' '/' || true)
            [ -n "$title" ] || title='(no title)'
            printf '| %s | %s | %s | %s |\n' "$url" "$status" "$final" "$title" >> "$GITHUB_STEP_SUMMARY"
            if ! [[ "$status" =~ ^[23] ]]; then failed=1; fi
          done
          exit "$failed"
