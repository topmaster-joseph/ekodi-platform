name: Stage Shared Site Shell

on:
  pull_request:
    paths:
      - 'site-worker.js'
      - 'site-shell-worker.js'
      - 'platform-router-worker.js'
      - 'platform-router-entry-worker.js'
      - 'professional-ai-entry-page.js'
      - 'space-entry-page.js'
      - 'config/domain-site-architecture.json'
      - 'config/ecosystem-services.json'
      - 'config/marketing-tenants.json'
      - 'ekodi-shell-injector.js'
      - 'trade.html'
      - 'hub.html'
      - 'wrangler.site.toml'
      - 'wrangler.site-staging.toml'
      - 'deploy/manifests/shared-site.worker.json'
      - 'scripts/build.mjs'
      - 'scripts/ecosystem-registry.mjs'
      - '.github/workflows/stage-shared-site-shell.yml'

permissions:
  contents: read

concurrency:
  group: shared-site-shell-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-shared-site-staging.topmaster-joseph.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate shared router and build
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --check site-shell-worker.js
          node --check platform-router-worker.js
          node --check platform-router-entry-worker.js
          node --check professional-ai-entry-page.js
          node --check space-entry-page.js
          node scripts/validate-domain-site-architecture.mjs
          node --test test/professional-ai-path-routing.test.mjs test/marketing-domain-policy.test.mjs test/public-space-domain.test.mjs
          npm run build
          test -f dist/trade.html
          test -f dist/hub.html
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy no-route staging Worker
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.site-staging.toml
      - name: Verify shared platform hosts, public spaces and canonical AI paths without touching production routes
        shell: bash
        run: |
          set -euo pipefail
          verify_shell() {
            host="$1"; needle="$2"
            code=$(curl -sS -D /tmp/shared-stage.headers -o /tmp/shared-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "x-ekodi-staging-host: $host" "$STAGING_URL/" || true)
            echo "$host -> $code"
            [[ "$code" == '200' ]]
            grep -Fq "$needle" /tmp/shared-stage.html
            grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/shared-stage.html
            grep -Fiq 'x-ekodi-shell: v2' /tmp/shared-stage.headers
          }
          verify_root_path() {
            path="$1"; needle="$2"; route="$3"
            code=$(curl -sS -D /tmp/root-path.headers -o /tmp/root-path.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -H 'x-ekodi-staging-host: ekodi.kr' "$STAGING_URL$path" || true)
            echo "ekodi.kr$path -> $code"
            [[ "$code" == '200' ]]
            grep -Fq "$needle" /tmp/root-path.html
            grep -Fiq "x-ekodi-route: $route" /tmp/root-path.headers
          }
          for attempt in $(seq 1 18); do
            if verify_shell 'trade.biz.ekodi.kr' 'EKODI GLOBAL TRADING' \
              && verify_shell 'pay.ekodi.kr' 'EKODI Pay' \
              && verify_shell 'pay.biz.ekodi.kr' 'EKODI Pay' \
              && verify_shell 'messenger.ekodi.kr' 'EKODI Messenger' \
              && verify_shell 'invest.ekodi.kr' 'EKODI Investment' \
              && verify_root_path '/ai/' '에코디 전문AI' 'professional-ai' \
              && verify_root_path '/ai/marketing/' '에코디 마케팅AI' 'professional-ai' \
              && verify_root_path '/ai/creator/' '에코디 크리에이터 AI' 'professional-ai' \
              && verify_root_path '/ai/life/' '오늘의 질문 · 인생AI' 'professional-ai' \
              && verify_root_path '/ai/energy/' '에코디 에너지 AI' 'professional-ai' \
              && verify_root_path '/ai/support/' '에코디 지원사업 AI' 'professional-ai' \
              && verify_root_path '/ai/marketing/church/' '에코디교회' 'professional-ai-space' \
              && verify_root_path '/ai/marketing/biz/' '에코디비즈' 'professional-ai-space' \
              && verify_root_path '/ai/marketing/jadam/' '자담치킨 목포대점' 'professional-ai-space' \
              && verify_root_path '/ai/marketing/pizzamaru/' '피자마루 목포대점' 'professional-ai-space' \
              && verify_root_path '/ai/marketing/yogurt/' '요거트퍼플 목포대점' 'professional-ai-space' \
              && verify_root_path '/ai/marketing/cgma/' '청계면상인회' 'professional-ai-space' \
              && verify_root_path '/church/' '에코디교회' 'public-space' \
              && verify_root_path '/biz/' '에코디비즈' 'public-space' \
              && verify_root_path '/lab/' '에코디연구소' 'public-space' \
              && verify_root_path '/jadam/' '자담치킨 목포대점' 'public-space' \
              && verify_root_path '/pizzamaru/' '피자마루 목포대점' 'public-space' \
              && verify_root_path '/yogurt/' '요거트퍼플 목포대점' 'public-space' \
              && verify_root_path '/cgma/' '청계면상인회' 'public-space'; then
              echo 'Shared-site staging verified for Domain & Site Architecture v2, including public spaces and all current professional AI paths.'
              exit 0
            fi
            sleep 4
          done
          exit 1
