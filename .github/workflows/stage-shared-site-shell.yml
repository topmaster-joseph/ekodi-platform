name: Stage Shared Site Shell

on:
  workflow_call:
  pull_request:
    paths:
      - 'site-worker.js'
      - 'site-shell-worker.js'
      - 'platform-router-worker.js'
      - 'platform-router-entry-worker.js'
      - 'store-gateway-page.js'
      - 'store-portfolio-admin-page.js'
      - 'test/store-public-gateway.test.mjs'
      - 'test/store-portfolio-admin.test.mjs'
      - 'insurance-public-route.js'
      - 'sites/ekodi-insurance/public/**'
      - 'workspace-route-policy.js'
      - 'ekodi-service-manifest.js'
      - 'config/ecosystem-services.json'
      - 'test/insurance-public-route.test.mjs'
      - 'marketing-canonical-projection.js'
      - 'deploy/manifests/shared-site.worker.json'
      - 'ekodi-shell-injector.js'
      - 'trade.html'
      - 'hub.html'
      - 'wrangler.site.toml'
      - 'wrangler.site-staging.toml'
      - 'discovery-layer.js'
      - 'scripts/discovery-build.mjs'
      - 'scripts/ccm-mr-postbuild.mjs'
      - 'test/discovery-layer.test.mjs'
      - 'scripts/build.mjs'
      - '.github/workflows/stage-shared-site-shell.yml'

permissions:
  contents: read

concurrency:
  group: shared-site-shell-staging-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-shared-site-staging.ekodi-development.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate shared router and build
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --check site-shell-worker.js
          node --check platform-router-worker.js
          node --check platform-router-entry-worker.js
          node --check store-gateway-page.js
          node --check store-portfolio-admin-page.js
          node --check insurance-public-route.js
          node --check sites/ekodi-insurance/public/advisor.js
          node --check sites/ekodi-insurance/public/server-bridge.js
          node --check marketing-canonical-projection.js
          node --check ekodi-shell-injector.js
          node --check discovery-layer.js
          node --check scripts/discovery-build.mjs
          node --test test/marketing-canonical-projection.test.mjs test/insurance-public-route.test.mjs test/public-workspace-gateway.test.mjs test/store-public-gateway.test.mjs test/store-portfolio-admin.test.mjs test/discovery-layer.test.mjs
          npm run build
          test -f dist/insurance/index.html
          test -f dist/insurance/advisor.html
          test -f dist/trade.html
          test -f dist/hub.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          grep -Fq 'OAI-SearchBot' dist/robots.txt
          grep -Fq 'User-agent: GPTBot' dist/robots.txt
          grep -Fq 'Disallow: /' dist/robots.txt
          grep -Fq '<loc>https://ekodi.kr/</loc>' dist/sitemap.xml
          grep -Fq 'Canonical site: https://ekodi.kr/' dist/llms.txt
          grep -Fq 'data-ekodi-discovery="v2"' dist/index.html
      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy no-route staging Worker
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.site-staging.toml
      - name: Verify protected shared-site staging
        shell: bash
        run: |
          set -euo pipefail
          access_code=$(curl -sS -D /tmp/shared-access.headers -o /tmp/shared-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
          if [[ "$access_code" == '302' ]] && grep -iq '^Www-Authenticate: Cloudflare-Access' /tmp/shared-access.headers; then
            echo "Shared-site staging deployed and is correctly protected by Cloudflare Access at $STAGING_URL"
            exit 0
          fi
          verify_public_path() {
            path="$1"; needle="$2"; header_needle="$3"
            code=$(curl -sS -D /tmp/shared-path.headers -o /tmp/shared-path.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "x-ekodi-staging-host: ekodi.kr" "$STAGING_URL$path" || true)
            echo "$path -> $code"
            [[ "$code" == '200' ]]
            grep -Fq "$needle" /tmp/shared-path.html
            grep -Fiq "$header_needle" /tmp/shared-path.headers
          }
          verify_discovery_path() {
            path="$1"; needle="$2"
            code=$(curl -sS -o /tmp/shared-discovery.body -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "x-ekodi-staging-host: ekodi.kr" "$STAGING_URL$path" || true)
            echo "$path -> $code"
            [[ "$code" == '200' ]]
            grep -Fq "$needle" /tmp/shared-discovery.body
          }
          verify_shell() {
            host="$1"; needle="$2"
            code=$(curl -sS -D /tmp/shared-stage.headers -o /tmp/shared-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "x-ekodi-staging-host: $host" "$STAGING_URL/" || true)
            echo "$host -> $code"
            [[ "$code" == '200' ]]
            grep -Fq "$needle" /tmp/shared-stage.html
            grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/shared-stage.html
            grep -Fiq 'x-ekodi-shell: v2' /tmp/shared-stage.headers
          }
          for attempt in $(seq 1 18); do
            if verify_shell 'trade.biz.ekodi.kr' 'EKODI GLOBAL TRADING' \
              && verify_shell 'pay.ekodi.kr' 'EKODI Pay' \
              && verify_shell 'pay.biz.ekodi.kr' 'EKODI Pay' \
              && verify_shell 'messenger.ekodi.kr' 'EKODI Messenger' \
              && verify_shell 'invest.ekodi.kr' 'EKODI Investment' \
              && verify_public_path '/cmpmyi' 'THREE STORES · ONE GATE' 'x-ekodi-route: store-gateway' \
              && verify_public_path '/deployment-probe' 'OPERATING SPACE' 'x-ekodi-workspace-gateway: space-service-binding' \
              && verify_public_path '/ekodibiz' 'EKODIBIZ' 'x-ekodi-workspace-gateway: ekodibiz-service-binding' \
              && verify_public_path '/insurance' '보험을 파는 AI가 아니라, 내 보험을 챙겨주는 AI' 'x-ekodi-route: public-insurance' \
              && verify_public_path '/insurance/advisor' 'PERSONAL INSURANCE CARE' 'x-ekodi-route: public-insurance' \
              && verify_public_path '/ekodibiz/invest' 'EKODIBIZ · INVESTMENT BUSINESS' 'x-ekodi-route: public-ekodibiz-invest' \
              && verify_public_path '/ekodibiz/invest/admin' 'WORKSPACE-LOCAL ADMIN' 'x-ekodi-route: public-ekodibiz-invest-admin' \
              && verify_discovery_path '/robots.txt' 'OAI-SearchBot' \
              && verify_discovery_path '/sitemap.xml' '<urlset' \
              && verify_discovery_path '/llms.txt' 'Canonical site: https://ekodi.kr/'; then
              echo 'Shared-site core, Discovery Layer, Insurance public path, Space binding, EKODIBIZ and Invest staging verified through the production entry contract.'
              exit 0
            fi
            sleep 4
          done
          exit 1
