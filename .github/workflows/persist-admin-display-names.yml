name: Persist canonical admin display names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-platform-ai-names.mjs'
      - '.github/workflows/persist-admin-display-names.yml'

permissions:
  contents: write

concurrency:
  group: persist-canonical-admin-display-names
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Normalize platform, specialist AI and admin service display names
        run: node scripts/normalize-platform-ai-names.mjs
      - name: Persist normalized admin source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Admin display names already match the canonical registry.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github'
          if git diff --cached --quiet; then
            echo 'No non-workflow source changes to persist.'
            exit 0
          fi
          git commit -m 'fix: align admin service display names'
          git pull --rebase origin main
          git push origin HEAD:main
