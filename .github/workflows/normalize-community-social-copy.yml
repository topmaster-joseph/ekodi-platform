name: Normalize Site Social Source

on:
  push:
    branches:
      - 'staging/social-links-sites-*'
    paths:
      - '.github/workflows/normalize-community-social-copy.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Normalize Community copy and install local Social renderers
        run: |
          python - <<'PY'
          from pathlib import Path
          targets=[Path('community/index.html'),Path('books/index.html')]
          for p in targets:
              s=p.read_text(encoding='utf-8')
              if p.as_posix()=='community/index.html':
                  s=s.replace('FLOWING COMMUNITY · EKODI MISSION','FLOWING COMMUNITY · EKODI COMMUNITY')
                  s=s.replace('EKODI Mission · community.ekodi.kr','EKODI Community · community.ekodi.kr')
              marker='<script src="/social-links.js" defer></script>'
              if marker not in s:
                  s=s.replace('</body>',f'  {marker}\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'FLOWING COMMUNITY · EKODI COMMUNITY' community/index.html
          grep -Fq 'EKODI Community · community.ekodi.kr' community/index.html
          if grep -Fq 'EKODI Mission' community/index.html; then exit 1; fi
          grep -Fq '<script src="/social-links.js" defer></script>' community/index.html
          grep -Fq '<script src="/social-links.js" defer></script>' books/index.html
      - name: Commit normalized site source
        run: |
          git config user.name 'EKODI Automation'
          git config user.email 'automation@ekodi.kr'
          git add community/index.html books/index.html
          git diff --cached --quiet || git commit -m 'feat: install central Social links on Community and Books pages'
          git push
