name: EKODI Growth Automation Diagnose

# 읽기 전용 진단: 노출(소셜 게시)·검색(IndexNow)·영업(상품 홍보) 자동화의 최근 7일 실행 상태를 보여준다.
on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: Orchestrator-issued release branch (ai/<agent>/orch_<task-id>)
        required: true
        type: string
      release_task_id:
        description: Orchestrator task id for that release branch
        required: true
        type: string

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.127.1'
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Read growth automation state (read-only)
        shell: bash
        run: |
          set -uo pipefail
          SINCE="strftime('%Y-%m-%dT%H:%M:%fZ','now','-7 days')"
          q() { echo "### $1"; echo '```'; npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "$2" 2>&1 | tail -c 5000; echo; echo '```'; }
          {
            q 'Social publication jobs (7d)' "SELECT channel_id,status,COUNT(*) AS n,MAX(scheduled_at) AS last FROM marketing_publication_jobs WHERE scheduled_at>=$SINCE GROUP BY 1,2 ORDER BY 1,2"
            q 'Latest non-published jobs' "SELECT * FROM marketing_publication_jobs WHERE status NOT IN ('published','succeeded','completed') ORDER BY scheduled_at DESC LIMIT 4"
            q 'Affiliate promotion runs (7d)' "SELECT run_date,provider,status,COUNT(*) AS n,MAX(substr(last_error,1,160)) AS err FROM affiliate_promotion_runs WHERE run_date>=date('now','-7 days') GROUP BY 1,2,3 ORDER BY 1 DESC"
            q 'Mall direct promotion runs (7d)' "SELECT run_date,provider,status,COUNT(*) AS n,MAX(substr(last_error,1,160)) AS err FROM mall_direct_promotion_runs WHERE run_date>=date('now','-7 days') GROUP BY 1,2,3 ORDER BY 1 DESC"
            q 'IndexNow submissions' "SELECT source,COUNT(*) AS urls,MAX(submitted_at) AS last,SUM(submitted_at>=$SINCE) AS last7d FROM marketing_indexnow_url_state GROUP BY 1"
            q 'Post metrics freshness' "SELECT channel,COUNT(*) AS rows,MAX(metric_date) AS last FROM marketing_post_metrics GROUP BY 1"
            q 'Metrics backoff' "SELECT * FROM marketing_metrics_backoff LIMIT 10"
          } | tee -a "$GITHUB_STEP_SUMMARY"
