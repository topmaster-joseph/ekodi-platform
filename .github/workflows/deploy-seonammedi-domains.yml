name: Deploy SeonamMedi Domain Redirects (Manual Topology Change)
# deployment-guardrail: topology-workflow-manual-only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-seonammedi-domain-redirect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Verify active Cloudflare zones and delegation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          expected='kai.ns.cloudflare.com. meadow.ns.cloudflare.com.'
          api='https://api.cloudflare.com/client/v4'
          for zone in seonammedi.kr xn--3e0b8b58jw4co4mnpll3k.kr; do
            actual=$(dig +short NS "$zone" | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            test "$actual" = "$expected" || { echo "Authoritative NS mismatch for $zone: $actual"; exit 1; }
            raw=$(curl -fsS "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            status=$(echo "$raw" | jq -r '.result[0].status // "missing"')
            test "$status" = "active" || { echo "Cloudflare zone not active: $zone status=$status"; exit 1; }
            echo "$zone active with expected Cloudflare delegation."
          done

      - name: Deploy dedicated redirect Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.seonammedi-redirect.toml

      - name: Verify external redirects
        shell: bash
        run: |
          set -u
          failed=0
          verify() {
            old="$1"; path="$2"; expected="$3"; code=000; location=""
            for attempt in $(seq 1 24); do
              rm -f /tmp/headers
              curl -sS -o /dev/null -D /tmp/headers --connect-timeout 10 --max-time 20 "https://$old$path" || true
              code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}' /tmp/headers 2>/dev/null || echo 0)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
              if [ "$code" = "301" ] && [ "$location" = "$expected" ]; then break; fi
              sleep 5
            done
            echo "$old$path http=$code location=$location"
            if [ "$code" != "301" ] || [ "$location" != "$expected" ]; then failed=1; fi
          }
          verify "seonammedi.kr" "/domain-check?source=ekodi" "https://ekodi.kr/seonammedi/domain-check?source=ekodi"
          verify "xn--3e0b8b58jw4co4mnpll3k.kr" "/admin/?source=ekodi" "https://ekodi.kr/seonammedi/admin/?source=ekodi"
          exit "$failed"
