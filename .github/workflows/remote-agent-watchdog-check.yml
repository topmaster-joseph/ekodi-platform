name: Remote Agent Watchdog Check

on:
  pull_request:
    paths:
      - 'tools/remote-agent-watchdog/**'
      - '.github/workflows/remote-agent-watchdog-check.yml'
  push:
    branches:
      - 'feat/remote-agent-watchdog'
    paths:
      - 'tools/remote-agent-watchdog/**'
      - '.github/workflows/remote-agent-watchdog-check.yml'

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem tools/remote-agent-watchdog -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $errors += $parseErrors }
          }
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'Remote Agent Watchdog PowerShell syntax: OK'
      - name: Guard hidden scheduled execution and Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $installer = Get-Content tools/remote-agent-watchdog/install-watchdog.ps1 -Raw
          $watchdog = Get-Content tools/remote-agent-watchdog/watchdog.ps1 -Raw
          if ($installer -notmatch "'-NonInteractive','-WindowStyle','Hidden'") {
            throw 'Scheduled PowerShell tasks must run non-interactively with a hidden window.'
          }
          if ($installer -notmatch "New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount") {
            throw 'Watchdog tasks must retain the isolated SYSTEM principal.'
          }
          if ($watchdog -match '\|\s*ConvertFrom-Json\s+-AsHashtable') {
            throw 'Windows PowerShell 5.1 does not support ConvertFrom-Json -AsHashtable.'
          }
          $errors = @()
          Get-ChildItem tools/remote-agent-watchdog -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $errors += $parseErrors }
          }
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Host 'Watchdog launch contracts and Windows PowerShell 5.1 syntax: OK'
