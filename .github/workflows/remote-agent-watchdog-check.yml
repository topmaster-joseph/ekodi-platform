name: Remote Agent Watchdog Check

on:
  pull_request:
    paths:
      - 'tools/remote-agent-watchdog/**'
      - '.github/workflows/remote-agent-watchdog-check.yml'
  push:
    branches:
      - 'feat/remote-agent-watchdog'
    paths:
      - 'tools/remote-agent-watchdog/**'
      - '.github/workflows/remote-agent-watchdog-check.yml'

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem tools/remote-agent-watchdog -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $errors += $parseErrors }
          }
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'Remote Agent Watchdog PowerShell syntax: OK'
