name: Deploy EKODI Author AI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'author/**'
      - 'author-worker.js'
      - 'wrangler.author.toml'
      - 'wrangler.author.staging.toml'
      - 'scripts/validate-author.mjs'
      - 'deploy/manifests/author.worker.json'
      - 'auth-site/author-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/functions/author-access-api/**'
      - 'supabase/migrations/*author_ai*'
      - '.github/workflows/deploy-author.yml'
  push:
    branches: [main]
    paths:
      - 'author/**'
      - 'author-worker.js'
      - 'wrangler.author.toml'
      - 'wrangler.author.staging.toml'
      - 'scripts/validate-author.mjs'
      - 'deploy/manifests/author.worker.json'
      - 'auth-site/author-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/functions/author-access-api/**'
      - 'supabase/migrations/*author_ai*'
      - '.github/workflows/deploy-author.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-author-ai-${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Author AI contracts
        run: |
          set -euo pipefail
          node --check author-worker.js
          node --check author/app.js
          node --check auth-site/author-auth.js
          node --check scripts/validate-author.mjs
          node scripts/validate-author.mjs
          test -f deploy/manifests/author.worker.json

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy isolated Author AI staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.author.staging.toml
      - name: Verify staging shell and health
        shell: bash
        run: |
          set -euo pipefail
          base='https://ekodi-author-ai-staging.topmaster-joseph.workers.dev'
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/author-staging.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/" || true)
            health_code=$(curl -sS -o /tmp/author-staging-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/health" || true)
            if [[ "$root_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'EKODI Author AI' /tmp/author-staging.html \
              && grep -Fq '저자AI가 책의 길을 만듭니다' /tmp/author-staging.html \
              && grep -Fq 'author-events-v1' /tmp/author-staging-health.json; then
              echo 'Author AI staging verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Candidate at 0%, verify, promote and auto-rollback on failure
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/author.worker.json
      - name: Deep verify Author AI production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/author.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://author.ekodi.kr/' || true)
            health_code=$(curl -sS -o /tmp/author-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://author.ekodi.kr/health' || true)
            if [[ "$root_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'EKODI Author AI' /tmp/author.html \
              && grep -Fq 'AUTHOR APPROVED' /tmp/author.html \
              && grep -Fq 'ekodi-author-ai' /tmp/author-health.json; then
              echo 'EKODI Author AI production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
