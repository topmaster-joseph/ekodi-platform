name: EKODI Release Provenance Auto Recovery

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: ekodi-release-provenance-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: >
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'ai/') &&
      !contains(github.event.pull_request.head.ref, '/orch_') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout trusted recovery runtime from default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Recover exact-SHA approved release provenance
        id: recover
        env:
          GITHUB_EVENT_NAME: pull_request
        run: node scripts/recover-release-provenance.mjs
      - name: Report recovery result
        if: always()
        run: |
          {
            echo '### EKODI Release Provenance Auto Recovery'
            echo "- action: ${{ steps.recover.outputs.action || 'unknown' }}"
            echo "- task: ${{ steps.recover.outputs.task_id || 'n/a' }}"
            echo "- branch: ${{ steps.recover.outputs.branch_ref || 'n/a' }}"
            echo "- recovery PR: ${{ steps.recover.outputs.recovery_pr || 'n/a' }}"
            echo "- merge: ${{ steps.recover.outputs.merge_disposition || 'n/a' }}"
            echo "- independent board dispatch: ${{ steps.recover.outputs.independent_board_dispatch || 'not-required' }}"
            echo "- shared Site Core dispatch: ${{ steps.recover.outputs.shared_site_dispatch || 'not-required' }}"
            echo "- Shell Worker dispatch: ${{ steps.recover.outputs.shell_dispatch || 'not-required-or-not-authorized' }}"
            echo "- CGMA apex edge dispatch: ${{ steps.recover.outputs.cgma_apex_dispatch || 'not-required-or-not-authorized' }}"
            echo "- authenticated Admin E2E: ${{ steps.recover.outputs.admin_e2e_dispatch || 'not-required-or-not-authorized' }}"
            echo "- protected merge condition: ${{ steps.recover.outputs.merge_condition || 'verified-or-normal-gate' }}"
          } >> "$GITHUB_STEP_SUMMARY"
