name: EKODI Release Provenance Auto Recovery

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ekodi-release-provenance-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: >
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'ai/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout trusted recovery runtime from default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Recover non-orchestrator release provenance
        id: recover
        run: node scripts/recover-release-provenance.mjs
      - name: Report recovery result
        if: always()
        run: |
          {
            echo '### EKODI Release Provenance Auto Recovery'
            echo "- action: ${{ steps.recover.outputs.action || 'unknown' }}"
            echo "- task: ${{ steps.recover.outputs.task_id || 'n/a' }}"
            echo "- branch: ${{ steps.recover.outputs.branch_ref || 'n/a' }}"
            echo "- recovery PR: ${{ steps.recover.outputs.recovery_pr || 'n/a' }}"
            echo "- merge: ${{ steps.recover.outputs.merge_disposition || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
