name: Deploy EKODI Church Homepage
# Release reconciliation marker: church-operating-space-20260924
# Reconcile Church public Pages to source commit 569cb1f7ff3daefb6d56321036dae606008f4675 (주보 바로 편집·찬양 곡명·이미지, ekodi-church#177·#178).

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Official EKODI Orchestrator release branch (receipt checked)'
        required: true
        type: string
      release_task_id:
        description: 'Matching EKODI Orchestrator task ID'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ekodi-church-homepage.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-church-homepage-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  deploy:
    # A main push cannot directly authorize release; official dispatch with receipt only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout independent Church source (legacy mode only)
        if: vars.CHURCH_CANONICAL_SOURCE_CUTOVER_APPROVED != 'true'
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: main
          path: church

      - name: Capture legacy Church revision
        if: vars.CHURCH_CANONICAL_SOURCE_CUTOVER_APPROVED != 'true'
        shell: bash
        run: |
          echo "CHURCH_SOURCE_SHA=$(git -C church rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CHURCH_RELEASE_SOURCE_MODE=legacy" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Checkout EKODI orchestration control at exact triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ekodi-control

      - name: EKODI AI Orchestration Gate
        env:
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
          EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
        run: node "$GITHUB_WORKSPACE/.ekodi-control/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Bind canonical Church source (only after explicit cutover flag and receipt)
        if: vars.CHURCH_CANONICAL_SOURCE_CUTOVER_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          platform_sha=$(git -C .ekodi-control rev-parse HEAD)
          test "$platform_sha" = "$GITHUB_SHA"
          test -f .ekodi-control/sites/ekodi-church/source-import-manifest.json
          test -f .ekodi-control/scripts/build-church-pages-candidate.mjs
          # A symlink preserves the module's relative test links into the central checkout.
          ln -s "$GITHUB_WORKSPACE/.ekodi-control/sites/ekodi-church" church
          echo "CHURCH_SOURCE_SHA=$platform_sha" >> "$GITHUB_ENV"
          echo "CHURCH_RELEASE_SOURCE_MODE=canonical" >> "$GITHUB_ENV"

      - name: Validate Church source, privacy boundary and canonical daily devotion
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for file in index.html script.js live/index.html live/live.js live/host-intent.js live/live.css church-character-identity.js church-i18n.js church-i18n-extended.js church-i18n-payment-patch.js church-shell-i18n.js church-header-controls.js church-header-tune.css church-online-status.js church-worship-admin.js church-weekly-worship.js church-weekly-worship.css church-homepage-layout.css worship/weekly.json worship/2026-10-18/materials.json church-live-entry.css giving.js church-footer.css community-visual.css church-life-hub-i18n.js my/index.html my/app.js my/styles.css my/giving/index.html my/giving/app.js my/giving/styles.css my/attendance/index.html my/attendance/app.js my/attendance/styles.css; do
            test -s "church/$file"
          done
          for file in script.js live/live.js live/host-intent.js church-character-identity.js church-i18n.js church-i18n-extended.js church-i18n-payment-patch.js church-shell-i18n.js church-header-controls.js church-online-status.js church-worship-admin.js church-weekly-worship.js giving.js church-life-hub-i18n.js my/app.js my/giving/app.js my/attendance/app.js; do
            node --check "church/$file"
          done
          # Church PR #148/#160: daily devotion is now a first-level menu link (user-approved 2026-11-08).
          grep -Eq '<strong>(오늘의 )?매일묵상</strong>|class="nav-devotion" href="/ekodichurch/devotion/">매일묵상</a>' church/index.html
          grep -Fq 'href="/ekodichurch/devotion/"' church/index.html
          # User decision 2026-11-08: the life hub returns with church PR #160 and its repository tests.
          # The platform keeps the sharper privacy boundary: personal records never leave the device.
          if grep -Fq 'data-ekodi-life-hub' church/index.html; then
            grep -Fq 'localStorage' church/church-life-hub.js
            if grep -Eq 'fetch\(|XMLHttpRequest|sendBeacon|supabase' church/church-life-hub.js; then
              echo 'Church life hub must keep personal records on-device only (no network writes).'
              exit 1
            fi
          fi
          grep -Fq 'data-church-worship-admin' church/index.html
          grep -Fq 'scope=worship-access' church/church-worship-admin.js
          grep -Fq 'data-church-weekly' church/index.html
          # Approved PR #114 public presentation only; preserve auth, giving, and worship.
          grep -Fq '<link rel="stylesheet" href="church-homepage-layout.css">' church/index.html
          # Keep the worship proof strict while recognizing the reviewed six-menu layout.
          # The verifier accepts only the original legacy header or the exact new
          # first-level menu with all contextual worship/Together routes preserved.
          node .ekodi-control/scripts/verify-church-header-navigation.mjs \
            --html church/index.html --subnav church/church-section-nav.js
          grep -Fq 'online-triad--broadcast' church/index.html
          grep -Fq 'href="/live/church/"' church/index.html
          grep -Fq 'body:has(main :target) .hero{display:none!important}' church/church-homepage-layout.css
          grep -Fq '.church-weekly-focus:target' church/church-homepage-layout.css
          if grep -Eiq 'meet\.jit\.si|EKODIChurchLive' church/index.html; then echo 'Legacy video-meeting links must not return.'; exit 1; fi
          grep -Fq 'church-weekly-worship.js' church/index.html
          grep -Fq 'church-weekly-worship.css' church/index.html
          grep -Fq 'scope=worship-access' church/church-weekly-worship.js
          jq -e '.schema=="ekodi.church.worship.index.v1" and (.services|any(.date=="2026-10-18"))' church/worship/weekly.json >/dev/null
          test -s church/_headers
          grep -Eq 'connect-src[^;]*https://renzehysxirjilvdxacv\.supabase\.co;' church/_headers
          grep -Fq 'church-life-hub-i18n.js' church/index.html
          grep -Fq 'church-i18n-extended.js' church/index.html
          grep -Fq 'church-online-status.js' church/index.html
          grep -Fq 'data-ekodi-church-live-entry' church/index.html
          grep -Fq "AUTH_ATTEMPT_KEY='ekodi-live-auth-attempt'" church/live/live.js
          grep -Fq 'refreshAuthToken' church/live/live.js
          grep -Fq "searchParams.set('mode','studio')" church/live/host-intent.js
          if grep -Fq 'location.replace(next.href)' church/live/host-intent.js; then echo 'LIVE host intent must not force a reload loop.'; exit 1; fi
          grep -Fq 'api/realtime/live?tenant=ekodichurch' church/church-online-status.js
          grep -Fq 'AbortController' church/church-online-status.js
          grep -Fq "dataset.liveStatus='stale'" church/church-online-status.js
          grep -Fq '에코디선교회' church/index.html
          grep -Fq '__EKODI_CHURCH_LIFE_HUB_I18N__' church/church-life-hub-i18n.js
          grep -Fq 'href="/ekodichurch/my/' church/index.html
          grep -Fq "href: '/ekodichurch/my/'" church/script.js
          grep -Fq 'data-ekodi-header-actions' church/my/index.html
          grep -Fq 'EKODI CHURCH · MY PAGE' church/my/index.html
          if grep -Fq 'https://ekodi.kr/my/' church/my/index.html || grep -Eq '내 EKODI|MY EKODI|다른 EKODI 활동' church/my/index.html; then
            echo 'Church member home must not hand off to My EKODI.'
            exit 1
          fi
          if grep -Fq 'https://ekodi.kr/ekodichurch/my' church/index.html || grep -Fq 'https://ekodi.kr/ekodichurch/my' church/script.js; then
            echo 'Church header member navigation must use a site-local path.'
            exit 1
          fi
          grep -Fq 'clearAuthReturnFragment' church/my/app.js
          grep -Fq '/ekodichurch/my/giving/' church/my/index.html
          grep -Fq 'MY GIVING' church/my/giving/index.html
          grep -Fq 'church-member-giving-api' church/my/giving/app.js
          grep -Fq '무기명 헌금과 다른 교인의 내역은 개인 화면에 표시되지 않습니다.' church/my/giving/index.html
          grep -Fq '/ekodichurch/my/attendance/' church/my/index.html
          grep -Fq 'MY ATTENDANCE' church/my/attendance/index.html
          grep -Fq '개인별 출결현황' church/my/attendance/index.html
          grep -Fq 'church-member-attendance-api' church/my/attendance/app.js
          grep -Fq '기록되지 않은 예배는 자동으로 결석 처리하지 않습니다.' church/my/attendance/index.html
          grep -Fq '현재 연속출석' church/my/attendance/index.html
          grep -Fq '월별 출결 흐름' church/my/attendance/index.html
          grep -Fq 'current_streak' church/my/attendance/app.js
          grep -Fq '<progress class="month-meter"' church/my/attendance/app.js
          if grep -Fq '운영자 기능은 별도 관리자 화면에서 처리합니다.' church/my/index.html; then echo 'Member home must not expose internal operator guidance.'; exit 1; fi
          test -s church/devotion/index.html
          grep -Eq '<h1>(에코디 )?오늘의 매일묵상</h1>' church/devotion/index.html
          grep -Fq 'data-ekodi-devotion data-base="/ekodichurch/devotion/"' church/devotion/index.html
          # All reviewed Church public subpages share one six-menu Shell.
          for page in devotion notices schedule; do
            node .ekodi-control/scripts/verify-church-header-navigation.mjs \
              --subpage "church/$page/index.html" --kind "$page"
          done
          grep -Fq '<script type="module" src="/bible/devotion.js"></script>' church/devotion/index.html
          grep -Fq 'href="/ekodichurch/devotion/">매일묵상</a>' church/index.html
          grep -Fq "{ href: '/ekodichurch/devotion/', label: '매일묵상', className: 'nav-devotion' }" church/script.js
          grep -Fq 'https://ekodi.kr/privacy' church/index.html
          grep -Fq 'https://ekodi.kr/terms' church/index.html
          grep -Fq 'data-ekodi-character-identity="founder-pastor"' church/index.html
          if grep -Fq 'data-ekodi-operating-space-label' church/index.html || grep -Fq '>운영공간<' church/index.html; then
            echo 'Public Church source must not expose EKODI internal operating-space wording.'
            exit 1
          fi
          grep -Fq "id:'founder-pastor'" church/church-character-identity.js
          grep -Fq 'subjectAuthorized:true' church/church-character-identity.js
          if grep -Eiq 'portraitUrl|face_embedding|biometric|data:image' church/church-character-identity.js; then
            echo 'Church identity bridge must not carry portrait or biometric payload.'
            exit 1
          fi
          (cd church && npm test)
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.anchors=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if 'id' in attrs:self.ids.append(attrs['id'])
                  href=attrs.get('href','')
                  if href.startswith('#') and len(href)>1:self.anchors.append(href[1:])
          source=Path('church/index.html').read_text(encoding='utf-8')
          parser=Audit(); parser.feed(source)
          duplicates=sorted({x for x in parser.ids if parser.ids.count(x)>1})
          missing=sorted(set(parser.anchors)-set(parser.ids))
          if duplicates: raise SystemExit(f'duplicate ids: {duplicates}')
          if missing: raise SystemExit(f'missing anchor targets: {missing}')
          print(f'anchor audit ok: {len(set(parser.anchors))} internal targets')
          PY

      - name: Prepare static Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ekodi-church-pages /tmp/ekodi-church-functions
          if [[ "${CHURCH_RELEASE_SOURCE_MODE:-legacy}" == 'canonical' ]]; then
            node .ekodi-control/scripts/build-church-pages-candidate.mjs \
              --source .ekodi-control/sites/ekodi-church \
              --output /tmp/ekodi-church-pages \
              --sha "$CHURCH_SOURCE_SHA"
            jq -e --arg sha "$CHURCH_SOURCE_SHA" '
              .contract == "ekodi.church-release.v2" and
              .sourceRepository == "topmaster-joseph/ekodi-platform" and
              .sourceModule == "sites/ekodi-church" and
              .sourceSha == $sha and
              (.payloadSha256 | test("^[0-9a-f]{64}$"))
            ' /tmp/ekodi-church-pages/church-release.json > /dev/null
            echo "CHURCH_PAYLOAD_SHA256=$(jq -r .payloadSha256 /tmp/ekodi-church-pages/church-release.json)" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/ekodi-church-pages
            rsync -a --exclude='.git' --exclude='.github' church/ /tmp/ekodi-church-pages/
            printf '{"contract":"ekodi.church-release.v1","sourceRepository":"topmaster-joseph/ekodi-church","sourceSha":"%s"}\n' "$CHURCH_SOURCE_SHA" > /tmp/ekodi-church-pages/church-release.json
          fi
          cd /tmp/ekodi-church-pages
          if [[ -d functions ]] && find functions -type f -print -quit | grep -q .; then
            npx --yes wrangler@${WRANGLER_VERSION} pages functions build functions --outdir=/tmp/ekodi-church-functions
            test -s /tmp/ekodi-church-functions/index.js
          fi

      - name: Deploy Church to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy . --project-name ekodi-church --branch main --commit-dirty=true

      - name: Verify production church devotion page and shared renderer
        shell: bash
        run: |
          set -euo pipefail
          release="$CHURCH_SOURCE_SHA"
          # The shared renderer ships in the Bible lane of the same release; allow it up to 10 minutes.
          for attempt in $(seq 1 60); do
            page=$(curl -L -sS -o /tmp/church-devotion.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/devotion/?release=${release}" || true)
            notices=$(curl -L -sS -o /tmp/church-verify-notices.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/notices/?release=${release}" || true)
            schedules=$(curl -L -sS -o /tmp/church-verify-schedule.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/schedule/?release=${release}" || true)
            renderer=$(curl -L -sS -o /tmp/devotion-renderer.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/bible/devotion.js' || true)
            api=$(curl -sS -o /tmp/devotion-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/bible/api/bible/devotion?date=2026-10-26' || true)
            if [[ "$page" == 200 && "$notices" == 200 && "$schedules" == 200 && "$renderer" == 200 && "$api" == 200 ]] \
              && grep -Eq '<h1>(에코디 )?오늘의 매일묵상</h1>' /tmp/church-devotion.html \
              && grep -Fq 'class="site-header church-devotion-header"' /tmp/church-devotion.html \
              && grep -Fq 'data-ekodi-devotion' /tmp/church-devotion.html \
              && node .ekodi-control/scripts/verify-church-header-navigation.mjs --subpage /tmp/church-devotion.html --kind devotion \
              && node .ekodi-control/scripts/verify-church-header-navigation.mjs --subpage /tmp/church-verify-notices.html --kind notices \
              && node .ekodi-control/scripts/verify-church-header-navigation.mjs --subpage /tmp/church-verify-schedule.html --kind schedule \
              && grep -Fq 'data-tab' /tmp/devotion-renderer.js \
              && grep -Fq '"activitySource":"curated"' /tmp/devotion-api.json; then
              echo 'Church devotion page verified.'
              exit 0
            fi
            sleep 10
          done
          echo "Church public subpage navigation / devotion verification failed: devotion=$page notices=$notices schedules=$schedules renderer=$renderer api=$api"
          exit 1

      - name: Verify six-menu Church public notices, schedules and preserved worship on live canonical release
        if: vars.CHURCH_CANONICAL_SOURCE_CUTOVER_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${CHURCH_RELEASE_SOURCE_MODE:-}" = canonical
          release="$CHURCH_SOURCE_SHA"
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -o /tmp/church-six-live-home.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/?release=${release}" || true)
            notice=$(curl -L -sS -o /tmp/church-six-live-notices.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/notices/?release=${release}" || true)
            schedule=$(curl -L -sS -o /tmp/church-six-live-schedule.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/schedule/?release=${release}" || true)
            selected=$(curl -L -sS -o /tmp/church-six-live-subnav.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/church-section-nav.js?release=${release}" || true)
            shared=$(curl -L -sS -o /tmp/church-six-live-shared.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/church-shared-schedules.js?release=${release}" || true)
            worship=$(curl -L -sS -o /tmp/church-six-live-worship.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/worship/2026-11-08/?release=${release}" || true)
            marker_code=$(curl -L -sS -o /tmp/church-six-live-release.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/church-release.json?release=${release}" || true)
            if [[ "$root" == 200 && "$notice" == 200 && "$schedule" == 200 && "$selected" == 200 && "$shared" == 200 && "$worship" == 200 && "$marker_code" == 200 ]] \
              && grep -Fq 'data-church-public-page="notices"' /tmp/church-six-live-notices.html \
              && grep -Fq 'data-church-notices' /tmp/church-six-live-notices.html \
              && grep -Fq 'data-church-public-page="schedule"' /tmp/church-six-live-schedule.html \
              && grep -Fq 'data-church-schedule' /tmp/church-six-live-schedule.html \
              && grep -Fq 'data-church-shared-schedules' /tmp/church-six-live-home.html \
              && grep -Fq 'shared-schedules' /tmp/church-six-live-shared.js \
              && grep -Fq '공동의회' /tmp/church-six-live-worship.html \
              && node .ekodi-control/scripts/verify-church-header-navigation.mjs \
                   --html /tmp/church-six-live-home.html --subnav /tmp/church-six-live-subnav.js \
              && jq -e --arg sha "$release" --arg digest "$CHURCH_PAYLOAD_SHA256" '
                 .contract == "ekodi.church-release.v2" and
                 .sourceRepository == "topmaster-joseph/ekodi-platform" and
                 .sourceSha == $sha and .payloadSha256 == $digest and
                 .preservedPublicWorship.mergedPR == 150 and
                 .preservedPublicWorship.preservationPR == 151 and
                 .preservedPublicWorship.preservationHeadSha == "9ca89ef9190a61e101bfe0c6129cdc6a668a6a4b"
              ' /tmp/church-six-live-release.json >/dev/null; then
              echo 'Canonical Church six menus, public notices, federated schedules, preserved worship and live source SHA verified.'
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "Church canonical public route verification failed: root=$root notice=$notice schedule=$schedule selected=$selected shared=$shared worship=$worship marker=$marker_code"
              exit 1
            fi
            sleep 5
          done

      - name: Verify production church together (partnership) page
        shell: bash
        run: |
          set -euo pipefail
          release="$CHURCH_SOURCE_SHA"
          if [[ ! -f church/together/index.html ]]; then
            echo 'Church source has no together page; skipping.'
            exit 0
          fi
          for attempt in $(seq 1 30); do
            page=$(curl -L -sS -o /tmp/church-together.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/together/?release=${release}" || true)
            js=$(curl -L -sS -o /tmp/church-together.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/together/together.js?release=${release}" || true)
            css=$(curl -L -sS -o /tmp/church-together.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/together/together.css?release=${release}" || true)
            if [[ "$page" == 200 && "$js" == 200 && "$css" == 200 ]] \
              && grep -Fq 'data-ekodi-church-together' /tmp/church-together.html \
              && grep -Fq '기부금영수증 발급 가능' /tmp/church-together.html \
              && grep -Fq '261028-together-partners' /tmp/church-together.js \
              && grep -Fq '.together-hero' /tmp/church-together.css; then
              echo 'Church together page verified.'
              exit 0
            fi
            sleep 10
          done
          echo "Church together verification failed: page=$page js=$js css=$css"
          exit 1

      - name: Verify production Church home, canonical devotion and exact release
        shell: bash
        run: |
          set -euo pipefail
          release="$CHURCH_SOURCE_SHA"
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/church-csp-headers -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/?release=${release}" || true)
            member=$(curl -L -sS -o /tmp/church-my.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/my/?release=${release}" || true)
            giving_member=$(curl -L -sS -o /tmp/church-my-giving.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/my/giving/?release=${release}" || true)
            giving_member_js=$(curl -L -sS -o /tmp/church-my-giving.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/my/giving/app.js?release=${release}" || true)
            attendance_member=$(curl -L -sS -o /tmp/church-my-attendance.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/my/attendance/?release=${release}" || true)
            attendance_member_js=$(curl -L -sS -o /tmp/church-my-attendance.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://ekodi.kr/ekodichurch/my/attendance/app.js?release=${release}" || true)
