name: Deploy EKODI Church Homepage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: EKODI Church source ref
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ekodi-church-homepage.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-church-homepage-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  CHURCH_CANONICAL_BASE: https://ekodi.kr/ekodichurch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Church source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: church
      - name: Capture Church source revision
        shell: bash
        run: echo "CHURCH_SOURCE_SHA=$(git -C church rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Checkout EKODI orchestration control
        uses: actions/checkout@v7
        with:
          path: .ekodi-control
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/.ekodi-control/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate Church source and worship operations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for file in index.html script.js church-life-hub-i18n-state.js church-i18n.js church-i18n-extended.js church-life-hub.js church-life-hub-i18n.js mypage/index.html mypage/app.js mypage/styles.css live/index.html live/live.js live/live.css; do
            test -s "church/$file"
          done
          for file in script.js church-life-hub-i18n-state.js church-i18n.js church-i18n-extended.js church-life-hub.js church-life-hub-i18n.js mypage/app.js live/live.js; do
            node --check "church/$file"
          done
          (cd church && npm test)
          grep -Fq 'https://ekodi.kr/my/' church/index.html
          grep -Fq 'church_worship_materials' church/mypage/app.js
          grep -Fq 'current_site_access' church/mypage/app.js
          grep -Fq "metadata:{service:" church/live/live.js
          grep -Fq 'syncPublishedWorship' church/script.js
          if grep -RniF 'https://church.ekodi.kr' -- church/index.html church/script.js church/live church/mypage; then
            echo 'Deprecated Church subdomain must not appear in runtime assets.'
            exit 1
          fi
      - name: Prepare static Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ekodi-church-pages /tmp/ekodi-church-functions
          mkdir -p /tmp/ekodi-church-pages
          rsync -a --exclude='.git' --exclude='.github' church/ /tmp/ekodi-church-pages/
          printf '{"contract":"ekodi.church-release.v1","sourceRepository":"topmaster-joseph/ekodi-church","sourceSha":"%s"}\n' "$CHURCH_SOURCE_SHA" > /tmp/ekodi-church-pages/church-release.json
          cd /tmp/ekodi-church-pages
          if [[ -d functions ]] && find functions -type f -print -quit | grep -q .; then
            npx --yes wrangler@${WRANGLER_VERSION} pages functions build functions --outdir=/tmp/ekodi-church-functions
            test -s /tmp/ekodi-church-functions/index.js
          fi
      - name: Deploy Church to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy . --project-name ekodi-church --branch main --commit-dirty=true
      - name: Verify exact release on canonical Church path
        shell: bash
        run: |
          set -euo pipefail
          release="$CHURCH_SOURCE_SHA"
          for attempt in $(seq 1 20); do
            root=$(curl -L -sS -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$CHURCH_CANONICAL_BASE/?release=${release}" || true)
            marker=$(curl -L -sS -o /tmp/church-release.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$CHURCH_CANONICAL_BASE/church-release.json?release=${release}" || true)
            mypage=$(curl -L -sS -o /tmp/church-mypage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$CHURCH_CANONICAL_BASE/mypage/?release=${release}" || true)
            myapp=$(curl -L -sS -o /tmp/church-mypage.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$CHURCH_CANONICAL_BASE/mypage/app.js?release=${release}" || true)
            live=$(curl -L -sS -o /tmp/church-live.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$CHURCH_CANONICAL_BASE/live/live.js?release=${release}" || true)
            if [[ "$root" == 200 && "$marker" == 200 && "$mypage" == 200 && "$myapp" == 200 && "$live" == 200 ]] \
              && grep -Fq 'data-ekodi-life-hub' /tmp/church.html \
              && grep -Fq '예배 운영 콘솔' /tmp/church-mypage.html \
              && grep -Fq 'church_worship_materials' /tmp/church-mypage.js \
              && grep -Fq "metadata:{service:" /tmp/church-live.js \
              && jq -e --arg sha "$CHURCH_SOURCE_SHA" '.contract == "ekodi.church-release.v1" and .sourceSha == $sha' /tmp/church-release.json >/dev/null; then
              echo 'Canonical Church release, My Page and Live Studio verified.'
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "Canonical Church release did not converge: root=$root marker=$marker mypage=$mypage myapp=$myapp live=$live"
              exit 1
            fi
            sleep 5
          done
      - name: Verify rendered nine-language Church surface
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          CHROME_BIN="$CHROME_BIN" CHURCH_CANONICAL_BASE="$CHURCH_CANONICAL_BASE" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const locales=['ko-KR','en','zh-CN','ja','my','kac','vi','mn','id'];
          const extended=new Set(['my','kac','vi','mn','id']);
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100});
            for(const locale of locales){
              await page.goto(`${process.env.CHURCH_CANONICAL_BASE}/?lang=${encodeURIComponent(locale)}&release=${process.env.CHURCH_SOURCE_SHA}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(expected=>document.documentElement.lang===expected&&window.__EKODI_CHURCH_LIFE_HUB_I18N__===true&&document.querySelector('[data-ekodi-life-hub]')&&document.querySelector('[data-ekodi-church-live-entry]'),{timeout:25000},locale);
              if(extended.has(locale)) await page.waitForFunction(expected=>window.EKODIChurchExtendedI18n?.getLocale?.()===expected,{timeout:20000},locale);
              await new Promise(resolve=>setTimeout(resolve,300));
              const snapshot=await page.evaluate(()=>{
                const clone=document.body.cloneNode(true);
                clone.querySelectorAll('[data-ekodi-language-control],[data-ekodi-published-worship]').forEach(node=>node.remove());
                return {lang:document.documentElement.lang,body:clone.innerText,live:document.querySelector('[data-ekodi-church-live-entry]')?.innerText||''};
              });
              assert.equal(snapshot.lang,locale);
              assert.ok(snapshot.live.length>40,`${locale} live entry missing`);
              if(locale!=='ko-KR') assert.equal(/[가-힣]/.test(snapshot.body),false,`${locale} contains untranslated static Korean`);
            }
            console.log('Canonical Church rendered surface verified across all 9 locales.');
          }finally{await browser.close();}
          NODE
