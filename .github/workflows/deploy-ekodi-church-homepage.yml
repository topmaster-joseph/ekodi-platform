name: Deploy EKODI Church Homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ekodi-church-homepage.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-church-homepage-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Church source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: main
          path: church

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate redesigned Church source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f church/index.html
          test -f church/church-refresh.css
          test -f church/community-visual.css
          node --check church/script.js
          grep -Fq '에클레시아 · 코이노니아 · 디아스포라 · 희년' church/index.html
          grep -Fq 'class="online-triad"' church/index.html
          grep -Fq '>유튜브 예배<' church/index.html
          grep -Fq '>묵상<' church/index.html
          grep -Fq '>실시간 화상<' church/index.html
          grep -Fq 'class="community-visit"' church/index.html
          grep -Fq '함께 예배하고,' church/index.html
          grep -Fq '<strong>에코디교회</strong>' church/index.html
          grep -Fq 'class="shell-my"' church/index.html
          grep -Fq '서비스 전환' church/index.html
          grep -Fq 'linear-gradient(90deg,rgba(7,25,22,.98)' church/community-visual.css
          grep -Fq 'flex-direction:column' church/community-visual.css

      - name: Prepare static Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ekodi-church-pages
          mkdir -p /tmp/ekodi-church-pages
          rsync -a --exclude='.git' --exclude='.github' church/ /tmp/ekodi-church-pages/
          test -s /tmp/ekodi-church-pages/index.html
          test -s /tmp/ekodi-church-pages/church-refresh.css
          test -s /tmp/ekodi-church-pages/community-visual.css
          test -s /tmp/ekodi-church-pages/script.js

      - name: Deploy Church to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy /tmp/ekodi-church-pages \
            --project-name ekodi-church \
            --branch main \
            --commit-dirty=true

      - name: Verify production content and assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/?release=ui-shell-20260829' || true)
            refresh_code=$(curl -L -sS -o /tmp/church-refresh.css -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/church-refresh.css?release=ui-shell-20260829' || true)
            visual_code=$(curl -L -sS -o /tmp/community-visual.css -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/community-visual.css?release=ui-shell-20260829' || true)
            script_code=$(curl -L -sS -o /tmp/script.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/script.js?release=ui-shell-20260829' || true)
            if [[ "$root_code" == '200' && "$refresh_code" == '200' && "$visual_code" == '200' && "$script_code" == '200' ]] \
              && grep -Fq 'class="online-triad"' /tmp/church.html \
              && grep -Fq 'class="community-visit"' /tmp/church.html \
              && grep -Fq '<strong>에코디교회</strong>' /tmp/church.html \
              && grep -Fq 'class="shell-my"' /tmp/church.html \
              && grep -Fq '서비스 전환' /tmp/church.html \
              && grep -Fq 'linear-gradient(90deg,rgba(7,25,22,.98)' /tmp/community-visual.css \
              && grep -Fq 'flex-direction:column' /tmp/community-visual.css \
              && grep -Fq 'Public EKODI Shell' /tmp/script.js; then
              echo 'EKODI Church user-shell alignment verified in production.'
              exit 0
            fi
            echo "attempt=$attempt root=$root_code refresh=$refresh_code visual=$visual_code script=$script_code"
            sleep 5
          done
          echo 'Production did not converge to the expected Church UI-shell release.'
          exit 1
