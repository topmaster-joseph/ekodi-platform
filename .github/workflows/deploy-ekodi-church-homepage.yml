name: Deploy EKODI Church Homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ekodi-church-homepage.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-church-homepage-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Church source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: main
          path: church

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Church multilingual source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for file in index.html script.js church-i18n.js giving.js church-footer.css community-visual.css; do test -s "church/$file"; done
          node --check church/script.js
          node --check church/church-i18n.js
          node --check church/giving.js

          grep -Fq 'data-ekodi-footer-mode="service"' church/index.html
          grep -Fq 'data-ekodi-service-footer' church/index.html
          grep -Fq 'https://ekodi.kr/privacy' church/index.html
          grep -Fq 'https://ekodi.kr/terms' church/index.html
          grep -Fq 'mailto:ekodibiz@gmail.com' church/index.html
          grep -Fq 'church-footer-legal' church/index.html
          grep -Fq 'church-i18n.js' church/index.html
          grep -Fq 'class="daily-verse-ref"' church/index.html
          grep -Fq 'https://my.ekodi.kr/' church/index.html
          grep -Fq 'https://community.ekodi.kr' church/index.html
          grep -Fq 'https://www.youtube.com/@ekodichurch/videos' church/index.html
          ! grep -Fq 'images.unsplash.com' church/index.html
          ! grep -Fq 'community-visit-photo' church/index.html
          ! grep -Fq 'photo-credit' church/index.html

          grep -Fq "'ko-KR','en','zh-CN','ja'" church/church-i18n.js
          grep -Fq 'EKODIChurchI18n' church/church-i18n.js
          grep -Fq 'SCRIPTURES' church/church-i18n.js
          grep -Fq 'formatAmount' church/church-i18n.js
          grep -Fq 'ekodi:locale-change' church/church-i18n.js
          grep -Fq 'window.EKODIChurchI18n' church/church-i18n.js
          grep -Fq 'window.EKODIChurchI18n?.refresh?.()' church/script.js
          grep -Fq 'window.EKODIChurchI18n?.formatAmount?.' church/giving.js
          grep -Fq 'setNodeText' church/giving.js
          grep -Fq '.church-footer-legal{' church/church-footer.css
          grep -Fq '.site-header .daily-verse-ref{' church/church-footer.css

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.anchors=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if 'id' in attrs:self.ids.append(attrs['id'])
                  href=attrs.get('href','')
                  if href.startswith('#') and len(href)>1:self.anchors.append(href[1:])
          source=Path('church/index.html').read_text(encoding='utf-8')
          parser=Audit(); parser.feed(source)
          duplicates=sorted({x for x in parser.ids if parser.ids.count(x)>1})
          missing=sorted(set(parser.anchors)-set(parser.ids))
          if duplicates: raise SystemExit(f'duplicate ids: {duplicates}')
          if missing: raise SystemExit(f'missing anchor targets: {missing}')
          if source.count('백련동1길 17-4') != 2: raise SystemExit('church address placement changed unexpectedly')
          print(f'anchor audit ok: {len(set(parser.anchors))} internal targets')
          PY

      - name: Prepare static Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ekodi-church-pages /tmp/ekodi-church-functions
          mkdir -p /tmp/ekodi-church-pages
          rsync -a --exclude='.git' --exclude='.github' church/ /tmp/ekodi-church-pages/
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages functions build functions --outdir=/tmp/ekodi-church-functions
          test -s /tmp/ekodi-church-functions/index.js

      - name: Deploy Church to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy . --project-name ekodi-church --branch main --commit-dirty=true

      - name: Verify production multilingual footer release
        shell: bash
        run: |
          set -euo pipefail
          release='church-i18n-footer-20260830-2'
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/?release=${release}" || true)
            i18n=$(curl -L -sS -o /tmp/church-i18n.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/church-i18n.js?release=${release}" || true)
            script=$(curl -L -sS -o /tmp/script.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/script.js?release=${release}" || true)
            giving=$(curl -L -sS -o /tmp/giving.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/giving.js?release=${release}" || true)
            footer=$(curl -L -sS -o /tmp/church-footer.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/church-footer.css?release=${release}" || true)
            config=$(curl -L -sS -o /tmp/giving-config.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/api/giving/config?release=${release}" || true)
            if [[ "$root" == 200 && "$i18n" == 200 && "$script" == 200 && "$giving" == 200 && "$footer" == 200 && "$config" == 200 ]] \
              && grep -Fq 'https://ekodi.kr/privacy' /tmp/church.html \
              && grep -Fq 'https://ekodi.kr/terms' /tmp/church.html \
              && grep -Fq 'mailto:ekodibiz@gmail.com' /tmp/church.html \
              && grep -Fq 'church-i18n.js' /tmp/church.html \
              && grep -Fq 'data-ekodi-service-footer' /tmp/church.html \
              && ! grep -Fq 'community-visit-photo' /tmp/church.html \
              && grep -Fq 'EKODIChurchI18n' /tmp/church-i18n.js \
              && grep -Fq "'ko-KR','en','zh-CN','ja'" /tmp/church-i18n.js \
              && grep -Fq 'setNodeText' /tmp/giving.js \
              && grep -Fq '.church-footer-legal{' /tmp/church-footer.css; then
              echo 'Church multilingual page, legal footer and media removal verified in production.'
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "Production did not converge: root=$root i18n=$i18n script=$script giving=$giving footer=$footer config=$config"
              exit 1
            fi
            sleep 5
          done

      - name: Verify rendered locale switching and header placement
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = require('node:assert/strict');
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            await page.goto('https://church.ekodi.kr/?lang=en&release=church-i18n-footer-20260830-2', {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForFunction(() => window.EKODIChurchI18n && document.querySelector('[data-ekodi-language-control] select'), {timeout:20000});

            async function snapshot(){
              return page.evaluate(() => {
                const select=document.querySelector('[data-ekodi-language-control] select');
                const control=select?.closest('[data-ekodi-language-control]');
                const my=document.querySelector('#main-nav .shell-my, [data-ekodi-user-header-root] .shell-my, [data-ekodi-user-header-root] a[href*="my.ekodi.kr"]');
                const visible=(node)=>Boolean(node && node.getClientRects().length && getComputedStyle(node).visibility!=='hidden' && getComputedStyle(node).display!=='none');
                return {
                  lang:document.documentElement.lang,
                  selected:select?.value||'',
                  controlVisible:visible(control),
                  afterAccount:Boolean(my&&control&&my.parentElement===control.parentElement&&(my.compareDocumentPosition(control)&Node.DOCUMENT_POSITION_FOLLOWING)),
                  brand:document.querySelector('.site-header .brand strong')?.textContent?.trim()||'',
                  hero:document.querySelector('.hero h1')?.innerText?.trim()||'',
                  body:document.body.innerText,
                  privacy:document.querySelector('.church-footer-legal a[href="https://ekodi.kr/privacy"]')?.textContent?.trim()||'',
                  terms:document.querySelector('.church-footer-legal a[href="https://ekodi.kr/terms"]')?.textContent?.trim()||'',
                  contact:document.querySelector('.church-footer-legal a[href^="mailto:ekodibiz@gmail.com"]')?.textContent?.trim()||'',
                  verseRef:document.querySelector('.daily-verse-ref')?.textContent?.trim()||'',
                  photoCount:document.querySelectorAll('.community-visit-photo').length,
                  sharedFooterCount:document.querySelectorAll('.ekodi-user-ui-footer').length,
                };
              });
            }
            async function choose(locale){
              await page.select('[data-ekodi-language-control] select', locale);
              await page.waitForFunction(expected => document.documentElement.lang===expected && window.EKODIChurchI18n?.getLocale?.()===expected, {}, locale);
              await new Promise(resolve=>setTimeout(resolve,250));
              return snapshot();
            }

            const en=await snapshot();
            assert.equal(en.lang,'en');
            assert.equal(en.selected,'en');
            assert.equal(en.controlVisible,true);
            assert.equal(en.afterAccount,true);
            assert.equal(en.brand,'EKODI Church');
            assert.match(en.hero,/From calling to fellowship/);
            assert.equal(en.privacy,'Privacy Policy');
            assert.equal(en.terms,'Terms of Use');
            assert.equal(en.contact,'Contact');
            assert.ok(en.verseRef && !/[가-힣]/.test(en.verseRef));
            assert.equal(en.photoCount,0);
            assert.equal(en.sharedFooterCount,0);
            assert.equal(/[가-힣]/.test(en.body),false,'English page still contains visible Korean copy');

            const zh=await choose('zh-CN');
            assert.equal(zh.selected,'zh-CN');
            assert.equal(zh.brand,'EKODI教会');
            assert.match(zh.hero,/从呼召走向团契/);
            assert.equal(zh.privacy,'隐私政策');
            assert.equal(zh.terms,'使用条款');
            assert.equal(zh.contact,'联系');
            assert.equal(/[가-힣]/.test(zh.body),false,'Chinese page still contains visible Korean copy');

            const ja=await choose('ja');
            assert.equal(ja.selected,'ja');
            assert.equal(ja.brand,'EKODI教会');
            assert.match(ja.hero,/召しから交わりへ/);
            assert.equal(ja.privacy,'プライバシーポリシー');
            assert.equal(ja.terms,'利用規約');
            assert.equal(ja.contact,'お問い合わせ');
            assert.equal(/[가-힣]/.test(ja.body),false,'Japanese page still contains visible Korean copy');

            const ko=await choose('ko-KR');
            assert.equal(ko.selected,'ko-KR');
            assert.equal(ko.brand,'에코디교회');
            assert.match(ko.hero,/부르심에서 교제로/);
            assert.equal(ko.privacy,'개인정보처리방침');
            assert.equal(ko.terms,'이용약관');
            assert.equal(ko.contact,'문의');
            console.log('Rendered locale switch verified: KO ↔ EN ↔ 中文 ↔ 日本語; selector follows account link; one church footer; no real-life photo.');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify linked EKODI services
        shell: bash
        run: |
          set -euo pipefail
          for target in 'https://church.ekodi.kr/' 'https://my.ekodi.kr/' 'https://community.ekodi.kr' 'https://ekodi.kr/privacy' 'https://ekodi.kr/terms'; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "$target" || true)
            case "$code" in 2*|3*) echo "link ok: $code $target" ;; *) echo "link failed: $code $target"; exit 1 ;; esac
          done
