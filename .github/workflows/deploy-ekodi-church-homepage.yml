name: Deploy EKODI Church Homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ekodi-church-homepage.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-church-homepage-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Church source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: main
          path: church

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Church source, footer and navigation
        shell: bash
        run: |
          set -euo pipefail

          assert_absent() {
            local needle="$1"
            local file="$2"
            if grep -Fq "$needle" "$file"; then
              echo "Unexpected content found in $file: $needle"
              exit 1
            fi
          }

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f church/index.html
          test -f church/church-refresh.css
          test -f church/community-visual.css
          test -f church/church-footer.css
          test -f church/script.js
          test -f church/giving.js
          test -f church/functions/api/giving/config.js
          test -f church/functions/api/giving/order.js
          test -f church/functions/api/giving/confirm.js
          node --check church/script.js
          node --check church/giving.js

          grep -Fq '<title>에코디교회 |' church/index.html
          grep -Fq 'aria-label="에코디교회 홈"' church/index.html
          grep -Fq '<strong>에코디교회</strong>' church/index.html
          grep -Fq 'class="daily-verse"' church/index.html
          grep -Fq '오늘의 말씀' church/index.html
          grep -Fq 'class="shell-my"' church/index.html
          grep -Fq 'https://my.ekodi.kr/' church/index.html
          assert_absent 'EKODI교회' church/index.html
          assert_absent 'class="shell-switch"' church/index.html
          assert_absent 'data-ekodi-social="true"' church/index.html

          grep -Fq '에클레시아 · 코이노니아 · 디아스포라 · 희년' church/index.html
          grep -Fq 'class="online-triad"' church/index.html
          grep -Fq '>유튜브 예배<' church/index.html
          grep -Fq '>묵상<' church/index.html
          grep -Fq '>실시간 화상<' church/index.html
          grep -Fq 'class="community-visit"' church/index.html
          grep -Fq '함께 예배하고,' church/index.html
          grep -Fq 'id="giving"' church/index.html
          grep -Fq 'id="giving-dialog"' church/index.html
          grep -Fq '<footer class="site-footer church-footer">' church/index.html
          grep -Fq '<strong class="church-footer-brand">EKODI CHURCH</strong>' church/index.html
          grep -Fq '사업자 소재지 전남 무안군 청계면 백련동1길 17-4, 1층' church/index.html
          grep -Fq '운영주체 에코디교회' church/index.html
          grep -Fq '대표 정찬균' church/index.html
          grep -Fq '고유번호 213-13-01959' church/index.html
          grep -Fq 'mailto:ekodichurch@gmail.com' church/index.html
          grep -Fq '© 2026 EKODI CHURCH' church/index.html
          assert_absent '독립 운영주체 또는 개별 서비스에 별도 정책이 표시된 경우 해당 정책이 우선 적용됩니다.' church/index.html
          assert_absent 'class="brand footer-brand"' church/index.html
          grep -Fq 'https://community.ekodi.kr' church/index.html

          grep -Fq "headerBrandName.textContent = '에코디교회'" church/script.js
          grep -Fq 'dailyScriptures' church/script.js
          grep -Fq 'https://social.ekodi.kr/?org=church' church/script.js
          grep -Fq 'https://api.ekodi.kr/api/social/registry' church/script.js
          assert_absent "label: '서비스 전환'" church/script.js

          grep -Fq 'https://js.tosspayments.com/v2/standard' church/giving.js
          grep -Fq '/api/giving/order' church/giving.js
          grep -Fq '/api/giving/confirm' church/giving.js
          grep -Fq 'TOSS_CLIENT_KEY' church/functions/api/giving/config.js
          grep -Fq 'TOSS_SECRET_KEY' church/functions/api/giving/confirm.js
          grep -Fq 'api.tosspayments.com/v1/payments/confirm' church/functions/api/giving/confirm.js

          grep -Fq '.daily-verse{' church/community-visual.css
          grep -Fq 'grid-template-columns:auto minmax(220px,1fr) auto' church/community-visual.css
          grep -Fq 'background:rgba(244,240,229,.96);' church/community-visual.css
          grep -Fq '.giving-dialog{' church/community-visual.css
          grep -Fq '.site-footer.church-footer{' church/church-footer.css
          grep -Fq '.church-footer-inner{' church/church-footer.css
          grep -Fq 'justify-items:center' church/church-footer.css
          grep -Fq '.church-footer-info{' church/church-footer.css

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  href = attrs.get('href', '')
                  if href.startswith('#') and len(href) > 1:
                      self.anchors.append(href[1:])

          parser = Audit()
          source = Path('church/index.html').read_text(encoding='utf-8')
          parser.feed(source)
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          missing = sorted(set(parser.anchors) - set(parser.ids))
          if duplicates:
              raise SystemExit(f'duplicate ids: {duplicates}')
          if missing:
              raise SystemExit(f'missing anchor targets: {missing}')
          address_count = source.count('백련동1길 17-4')
          if address_count != 2:
              raise SystemExit(f'church address placement unexpected: address_count={address_count}')
          print(f'anchor audit ok: {len(set(parser.anchors))} internal targets; church footer audit ok')
          PY

      - name: Prepare static Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ekodi-church-pages /tmp/ekodi-church-functions
          mkdir -p /tmp/ekodi-church-pages
          rsync -a --exclude='.git' --exclude='.github' church/ /tmp/ekodi-church-pages/
          test -s /tmp/ekodi-church-pages/index.html
          test -s /tmp/ekodi-church-pages/church-refresh.css
          test -s /tmp/ekodi-church-pages/community-visual.css
          test -s /tmp/ekodi-church-pages/church-footer.css
          test -s /tmp/ekodi-church-pages/script.js
          test -s /tmp/ekodi-church-pages/giving.js
          test -s /tmp/ekodi-church-pages/functions/api/giving/config.js
          test -s /tmp/ekodi-church-pages/functions/api/giving/order.js
          test -s /tmp/ekodi-church-pages/functions/api/giving/confirm.js
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages functions build functions --outdir=/tmp/ekodi-church-functions
          test -s /tmp/ekodi-church-functions/index.js

      - name: Deploy Church to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ekodi-church-pages
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy . \
            --project-name ekodi-church \
            --branch main \
            --commit-dirty=true

      - name: Verify production church footer and giving runtime
        shell: bash
        run: |
          set -euo pipefail
          release='church-footer-20260830-1'
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/?release=${release}" || true)
            refresh_code=$(curl -L -sS -o /tmp/church-refresh.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/church-refresh.css?release=${release}" || true)
            visual_code=$(curl -L -sS -o /tmp/community-visual.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/community-visual.css?release=${release}" || true)
            footer_code=$(curl -L -sS -o /tmp/church-footer.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/church-footer.css?release=${release}" || true)
            script_code=$(curl -L -sS -o /tmp/script.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/script.js?release=${release}" || true)
            giving_code=$(curl -L -sS -o /tmp/giving.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/giving.js?release=${release}" || true)
            config_code=$(curl -L -sS -o /tmp/giving-config.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://church.ekodi.kr/api/giving/config?release=${release}" || true)

            legacy_name=0
            legacy_switch=0
            legacy_social=0
            legacy_footer=0
            legacy_policy=0
            grep -Fq 'EKODI교회' /tmp/church.html && legacy_name=1 || true
            grep -Fq 'class="shell-switch"' /tmp/church.html && legacy_switch=1 || true
            grep -Fq 'data-ekodi-social="true"' /tmp/church.html && legacy_social=1 || true
            grep -Fq 'class="brand footer-brand"' /tmp/church.html && legacy_footer=1 || true
            grep -Fq '독립 운영주체 또는 개별 서비스에 별도 정책이 표시된 경우 해당 정책이 우선 적용됩니다.' /tmp/church.html && legacy_policy=1 || true

            address_count=$(grep -Fo '백련동1길 17-4' /tmp/church.html | wc -l | tr -d ' ')
            config_valid=0
            if [[ "$config_code" == '200' ]]; then
              node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/giving-config.json','utf8')); if(x.provider==='toss' && typeof x.enabled==='boolean') process.exit(0); process.exit(1)" && config_valid=1 || true
            fi

            if [[ "$root_code" == '200' && "$refresh_code" == '200' && "$visual_code" == '200' && "$footer_code" == '200' && "$script_code" == '200' && "$giving_code" == '200' && "$config_code" == '200' ]] \
              && [[ "$legacy_name" == '0' && "$legacy_switch" == '0' && "$legacy_social" == '0' && "$legacy_footer" == '0' && "$legacy_policy" == '0' && "$address_count" == '2' && "$config_valid" == '1' ]] \
              && grep -Fq '<title>에코디교회 |' /tmp/church.html \
              && grep -Fq 'aria-label="에코디교회 홈"' /tmp/church.html \
              && grep -Fq '<strong>에코디교회</strong>' /tmp/church.html \
              && grep -Fq 'class="daily-verse"' /tmp/church.html \
              && grep -Fq 'class="online-triad"' /tmp/church.html \
              && grep -Fq 'class="community-visit"' /tmp/church.html \
              && grep -Fq 'id="giving-dialog"' /tmp/church.html \
              && grep -Fq '<footer class="site-footer church-footer">' /tmp/church.html \
              && grep -Fq '<strong class="church-footer-brand">EKODI CHURCH</strong>' /tmp/church.html \
              && grep -Fq '운영주체 에코디교회' /tmp/church.html \
              && grep -Fq '대표 정찬균' /tmp/church.html \
              && grep -Fq '고유번호 213-13-01959' /tmp/church.html \
              && grep -Fq 'mailto:ekodichurch@gmail.com' /tmp/church.html \
              && grep -Fq '© 2026 EKODI CHURCH' /tmp/church.html \
              && grep -Fq 'class="shell-my"' /tmp/church.html \
              && grep -Fq '.daily-verse{' /tmp/community-visual.css \
              && grep -Fq 'background:rgba(244,240,229,.96);' /tmp/community-visual.css \
              && grep -Fq '.site-footer.church-footer{' /tmp/church-footer.css \
              && grep -Fq '.church-footer-inner{' /tmp/church-footer.css \
              && grep -Fq 'justify-items:center' /tmp/church-footer.css \
              && grep -Fq 'https://js.tosspayments.com/v2/standard' /tmp/giving.js \
              && grep -Fq "headerBrandName.textContent = '에코디교회'" /tmp/script.js \
              && grep -Fq 'dailyScriptures' /tmp/script.js; then
              echo 'Church production source, dedicated footer and giving runtime verified.'
              node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/giving-config.json','utf8')); console.log('giving_payment_enabled=' + x.enabled)"
              break
            fi

            if [[ "$attempt" == '18' ]]; then
              echo "Production did not converge: root=$root_code refresh=$refresh_code visual=$visual_code footer=$footer_code script=$script_code giving=$giving_code config=$config_code legacy_name=$legacy_name legacy_switch=$legacy_switch legacy_social=$legacy_social legacy_footer=$legacy_footer legacy_policy=$legacy_policy address_count=$address_count config_valid=$config_valid"
              exit 1
            fi
            echo "attempt=$attempt root=$root_code refresh=$refresh_code visual=$visual_code footer=$footer_code script=$script_code giving=$giving_code config=$config_code legacy_footer=$legacy_footer legacy_policy=$legacy_policy address_count=$address_count config_valid=$config_valid"
            sleep 5
          done

      - name: Verify every linked first-party EKODI service
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ekodi-first-party-targets.txt
          import re
          from pathlib import Path

          source = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in ('church/index.html', 'church/script.js', 'church/giving.js')
          )
          pattern = re.compile(r'https://(?:[A-Za-z0-9-]+\.)?ekodi\.kr(?:/[^\s"\'<>]*)?')
          targets = sorted(set(match.rstrip('.,;)') for match in pattern.findall(source)))
          for target in targets:
              print(target)
          PY

          test -s /tmp/ekodi-first-party-targets.txt
          cat /tmp/ekodi-first-party-targets.txt

          while IFS= read -r target; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "$target" || true)
            case "$code" in
              2*|3*) echo "first-party link ok: $code $target" ;;
              *) echo "first-party link failed: $code $target"; exit 1 ;;
            esac
          done < /tmp/ekodi-first-party-targets.txt
