              && jq -e --arg sha "$CHURCH_SOURCE_SHA" --arg mode "${CHURCH_RELEASE_SOURCE_MODE:-legacy}" --arg digest "${CHURCH_PAYLOAD_SHA256:-}" '
                if $mode == "canonical" then
                  .contract == "ekodi.church-release.v2" and
