      - name: Verify Church live-state API contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            code=$(curl -L -sS -o /tmp/church-live-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/api/realtime/live?tenant=ekodichurch' || true)
            if [[ "$code" == 200 ]] && jq -e 'has("live") and (.live|type=="boolean") and ((.room // null) == null or (.room|type=="object"))' /tmp/church-live-api.json >/dev/null; then
              echo 'Church live-state API contract verified.'
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "Church live-state API verification failed: HTTP $code"
              cat /tmp/church-live-api.json || true
              exit 1
            fi
            sleep 3
          done

      - name: Verify rendered nine-language church homepage and canonical devotion entry
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          npm install --no-save --no-package-lock puppeteer-core@24.16.0
          CHROME_BIN="$CHROME_BIN" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const locales=['ko-KR','en','zh-CN','ja','my','kac','vi','mn','id'];
          const extended=new Set(['my','kac','vi','mn','id']);
          const release=process.env.CHURCH_SOURCE_SHA;
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100});
            for(const locale of locales){
              await page.goto(`https://ekodi.kr/ekodichurch/?lang=${encodeURIComponent(locale)}&release=${release}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(expected=>document.documentElement.lang===expected&&window.__EKODI_CHURCH_LIFE_HUB_I18N__===true&&document.querySelector('a[href="/ekodichurch/devotion/"]'),{timeout:25000},locale);
              if(extended.has(locale)) await page.waitForFunction(expected=>window.EKODIChurchExtendedI18n?.getLocale?.()===expected,{timeout:20000},locale);
              if(locale!=='ko-KR'){
                await page.waitForFunction(expected=>{
                  if(document.documentElement.lang!==expected)return false;
                  const clone=document.body.cloneNode(true);
                  clone.querySelectorAll('[data-ekodi-language-control],[data-ekodi-user-content]').forEach(node=>node.remove());
                  return !/[가-힣]/.test(clone.innerText);
                },{timeout:20000,polling:'raf'},locale);
                await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              }
              const snapshot=await page.evaluate(()=>{
                const clone=document.body.cloneNode(true);
                clone.querySelectorAll('[data-ekodi-language-control],[data-ekodi-user-content]').forEach(node=>node.remove());
                return {
                  lang:document.documentElement.lang,
                  hero:document.querySelector('.hero h1')?.innerText||'',
                  devotion:!!document.querySelector('a[href="/ekodichurch/devotion/"]'),
                  body:clone.innerText,
                  options:[...document.querySelectorAll('[data-ekodi-language-control] select option')].map(o=>o.value)
                };
              });
              assert.equal(snapshot.lang,locale);
              assert.deepEqual(snapshot.options,['ko-KR','en','zh-CN','ja','my','kac','vi','mn','id']);
              assert.equal(snapshot.devotion,true,`${locale} canonical devotion card missing`);
              if(locale==='ko-KR'){
                assert.match(snapshot.hero,/부르심에서 교제로/);
              }else{
                const match=snapshot.body.match(/.{0,25}[가-힣].{0,25}/);
                if(match) console.error(`${locale} residual Hangul: ${match[0]}`);
                assert.equal(Boolean(match),false,`${locale} still contains visible Korean outside language control`);
              }
            }
            await page.goto(`https://ekodi.kr/ekodichurch/my/?lang=ko-KR&release=${release}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('[data-ekodi-language-control]',{timeout:20000});
            const memberHeader=await page.evaluate(()=>({
              globalLinks:[...document.querySelectorAll('header a[href]')].map(a=>a.href).filter(href=>href==='https://ekodi.kr/'||href.startsWith('https://ekodi.kr/my')),
              myPanel:Boolean([...document.querySelectorAll('main *')].some(node=>/다른 활동도 한 번에 이어보세요|내 EKODI 열기/.test(node.textContent||''))),
              language:Boolean(document.querySelector('header [data-ekodi-language-control]'))
            }));
            assert.equal(memberHeader.language,true,'member header must show the shared rounded language selector');
            assert.deepEqual(memberHeader.globalLinks,[],'member header must not expose EKODI root/My EKODI links');
            assert.equal(memberHeader.myPanel,false,'member page must not render the My EKODI handoff panel');
            console.log('Nine-language canonical devotion and local-only member header verified.');
          }finally{
            await browser.close();
          }
          NODE

      - name: Verify approved homepage on native Chromium across nine languages and PC/mobile
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          mkdir -p /tmp/church-approved-layout-proof
          CHROME_BIN="$CHROME_BIN" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const release=process.env.CHURCH_SOURCE_SHA;
          const origin='https://ekodi.kr/ekodichurch/';
          const locales=['ko-KR','en','zh-CN','ja','my','kac','vi','mn','id'];
          const proof=[];
          try{
            const page=await browser.newPage();
            const failures=[];
            page.on('pageerror',e=>failures.push(String(e)));
            for(const device of [{name:'mobile-320',width:320,height:740},{name:'mobile-390',width:390,height:844},{name:'tablet-768',width:768,height:1000},{name:'desktop-1366',width:1366,height:900},{name:'desktop-1440',width:1440,height:900}]){
              await page.setViewport({width:device.width,height:device.height,deviceScaleFactor:1});
              for(const locale of locales){
                const url=origin+'?lang='+encodeURIComponent(locale)+'&release='+release;
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForFunction(lang=>document.documentElement.lang===lang&&window.__EKODI_CHURCH_LIFE_HUB_I18N__===true,{timeout:20000},locale);
                const initial=await page.evaluate(()=>{
                  const box=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width}};
                  return {
                    language:document.documentElement.lang,
                    header:box(document.querySelector('.site-header')),
                    heroVisible:getComputedStyle(document.querySelector('.hero')).display!=='none',
                    weeklyHidden:getComputedStyle(document.querySelector('[data-church-weekly]')).display==='none',
                    layoutCss:[...document.styleSheets].some(x=>x.href?.includes('church-homepage-layout.css')),
                    sharedLive:!!document.querySelector('a[href="/live/church/"]'),
                    giving:!!document.querySelector('.giving-strip'),
                    // The shared shell wraps My Page in the central login (/auth/?…return_to=…/ekodichurch/my/).
                    member:[...document.querySelectorAll('.site-header a')].some(a=>{const h=a.getAttribute('href')||'';try{const u=new URL(h,location.origin);return u.pathname==='/ekodichurch/my/'||(u.pathname.startsWith('/auth')&&new URL(u.searchParams.get('return_to')||'/',location.origin).pathname==='/ekodichurch/my/')}catch{return false}}),
                    qtin:!!document.querySelector('.site-header a[href="/qtin/church"]'),
                    canonicalDevotion:!!document.querySelector('a[href="/ekodichurch/devotion/"]'),
                    overflow:document.documentElement.scrollWidth>innerWidth+1,
                    mobileGreetingGap:(()=>{
                      const greeting=document.querySelector('.hero .eyebrow')?.getBoundingClientRect();
                      const header=document.querySelector('.site-header')?.getBoundingClientRect();
                      return greeting&&header?Math.round(greeting.top-header.bottom):null;
                    })()
                  };
                });
                assert.equal(initial.language,locale);
                assert.equal(initial.layoutCss,true,'approved CSS must load in '+locale+' '+device.name);
                assert.equal(initial.heroVisible,true,'hero should only show on home');
                assert.equal(initial.weeklyHidden,true,'weekly panel hidden until selected');
                assert.equal(initial.sharedLive,true,'shared EKODI Live link retained');
                assert.equal(initial.member,true,'site-local member navigation retained');
                // Old headers expose QTIN directly. Six-item headers keep it in Together.
                // Verify the actual rendered submenu in every viewport and locale.
                if(!initial.qtin){
                  await page.evaluate(()=>{location.hash='#together'});
                  await page.waitForFunction(()=>!!document.querySelector('.church-section-subnav:not([hidden]) a[href="/qtin/church"]'),{timeout:9000});
                  const contextual=await page.evaluate(()=>({
                    qtin:!!document.querySelector('.church-section-subnav:not([hidden]) a[href="/qtin/church"]'),
                    community:!!document.querySelector('.church-section-subnav a[href="#community"]'),
                    partner:!!document.querySelector('.church-section-subnav a[href="#partner-news"]')
                  }));
                  assert.equal(contextual.qtin,true,'Together must expose QTIN '+locale+' '+device.name);
                  assert.equal(contextual.community,true,'Together must expose community '+locale+' '+device.name);
                  assert.equal(contextual.partner,true,'Together must expose partner news '+locale+' '+device.name);
                  await page.evaluate(()=>{location.hash=''});
                  await page.waitForFunction(()=>document.body.dataset.churchSelectedSection==='home',{timeout:9000});
                }
                assert.equal(initial.canonicalDevotion,true,'canonical daily devotion card missing '+locale+' '+device.name);
                assert.equal(initial.overflow,false,'horizontal overflow '+locale+' '+device.name);
                if(device.width<=800) assert.ok(initial.mobileGreetingGap>=0&&initial.mobileGreetingGap<100,'mobile header-to-greeting gap too large '+locale+' '+device.name+' gap '+initial.mobileGreetingGap);
                assert.ok(initial.header.left>=-2&&initial.header.right<=device.width+2,'header clipped '+locale+' '+device.name);
                if(locale==='ko-KR'){
                  await page.screenshot({path:'/tmp/church-approved-layout-proof/'+device.name+'-home.png',fullPage:false});
                  await page.goto(url+'#weekly-worship',{waitUntil:'domcontentloaded',timeout:30000});
                  const worship=await page.evaluate(()=>({
                    hiddenHero:getComputedStyle(document.querySelector('.hero')).display==='none',
                    visibleWeekly:getComputedStyle(document.querySelector('[data-church-weekly]')).display!=='none',
                    bulletin:document.querySelector('[data-weekly-bulletin]')?.getAttribute('href'),
                    editorHidden:document.querySelector('[data-weekly-editor]')?.hidden===true
                  }));
                  assert.equal(worship.hiddenHero,true);
                  assert.equal(worship.visibleWeekly,true);
                  assert.match(worship.bulletin||'',/^\/ekodichurch\/worship\//);
                  assert.equal(worship.editorHidden,true,'guest admin editor must remain hidden');
                  await page.screenshot({path:'/tmp/church-approved-layout-proof/'+device.name+'-worship.png',fullPage:false});
                  await page.goto(url+'#online',{waitUntil:'domcontentloaded',timeout:30000});
                  const live=await page.evaluate(()=>({
                    hiddenHero:getComputedStyle(document.querySelector('.hero')).display==='none',
                    cards:document.querySelectorAll('#online .online-triad--broadcast .ministry-card').length,
                    // ekodi-church#123 plays shared EKODI Live inline, with a /live/church/ viewer fallback link.
                    liveLink:!!document.querySelector('#online a[href="/live/church/"]')||(!!document.querySelector('#online #churchInlineLiveFrame')&&!!document.querySelector('#online a[href="/live/church/?mode=viewer"]')),
                    oldVideo:!!document.querySelector('a[href*="meet.jit.si"]')
                  }));
                  assert.equal(live.hiddenHero,true);
                  assert.equal(live.cards,2);
                  assert.equal(live.liveLink,true);
                  assert.equal(live.oldVideo,false);
                  await page.screenshot({path:'/tmp/church-approved-layout-proof/'+device.name+'-online.png',fullPage:false});
                  proof.push({device:device.name,locale,initial,worship,live});
                } else {
                  proof.push({device:device.name,locale,initial});
                }
              }
            }
            assert.deepEqual(failures,[],'Chromium page script errors');
            console.log('EKODI_CHURCH_APPROVED_LAYOUT_PROOF='+JSON.stringify({release,results:proof,pageErrors:failures}));
          }finally{await browser.close()}
          NODE
      - name: Upload approved layout Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-church-approved-layout-native
          path: /tmp/church-approved-layout-proof/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Verify current-week worship page, live stage routes and homepage entry
        shell: bash
        run: |
          set -euo pipefail
          # The current week is whatever weekly.json marks as the newest prepared
          # Sunday, so a new week never requires editing this workflow.
          week=$(jq -r '[.services[]|select(.status=="prepared")]|sort_by(.date)|last|.date // empty' church/worship/weekly.json)
          test -n "$week"
          test -s "church/worship/$week/index.html"
          test -s "church/worship/$week/materials.json"
          test -s church/live/worship-materials.js
          grep -Fq "fetch('/ekodichurch/worship/weekly.json'" church/live/worship-materials.js
          grep -Fq 'resolveServiceDate()' church/live/worship-materials.js
          # Weeks published from the pastor's sermon manuscript carry /sermon/.
          sermon_page=false
          if [[ -s "church/worship/$week/sermon/index.html" ]]; then
            sermon_page=true
            ! grep -Fq '예배 전 확인' "church/worship/$week/sermon/index.html"
          fi
          scripture=$(WEEK="$week" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const week=process.env.WEEK;
          const packet=JSON.parse(fs.readFileSync(`church/worship/${week}/materials.json`,'utf8'));
          assert.equal(packet.date,week);
          assert.ok(packet.scripture&&packet.title);
          assert.ok(Array.isArray(packet.slides)&&packet.slides.length>=1&&packet.slides.length<=60,'slide count follows the weekly original deck');
          assert.equal(packet.youtube.status,'metadata-prepared-not-scheduled');
          assert.doesNotMatch(JSON.stringify(packet),/streamKey|stream_key/i);
          process.stdout.write(packet.scripture);
          NODE
          )
          release="$CHURCH_SOURCE_SHA"
          verified=false
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-week-home.html -w '%{http_code}' "https://ekodi.kr/ekodichurch/?release=$release" || true)
            worship=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-week-worship.html -w '%{http_code}' "https://ekodi.kr/ekodichurch/worship/$week/?release=$release" || true)
            live_materials=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-week-live-materials.js -w '%{http_code}' "https://ekodi.kr/ekodichurch/live/worship-materials.js?release=$release" || true)
            if [[ "$root" == 200 && "$worship" == 200 && "$live_materials" == 200 ]] &&
              grep -Fq "/ekodichurch/worship/$week/" /tmp/church-week-home.html &&
              grep -Fq "$scripture" /tmp/church-week-worship.html &&
              grep -Fq '?view=stage' /tmp/church-week-worship.html &&
              grep -Fq '?view=operator' /tmp/church-week-worship.html &&
              grep -Fq "fetch('/ekodichurch/worship/weekly.json'" /tmp/church-week-live-materials.js &&
              ! grep -Fq "query.get('date')||'2026-10-11'" /tmp/church-week-live-materials.js &&
              { [[ "$sermon_page" != true ]] || [[ "$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-week-sermon.html -w '%{http_code}' "https://ekodi.kr/ekodichurch/worship/$week/sermon/?release=$release" || true)" == 200 ]]; }; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Current-week ($week) worship release not reflected on real canonical host."
            exit 1
          fi
          echo "Verified $week worship ($scripture) on real production: $release"

      - name: Verify director QR cameras and resizable live program on real Church Pages
        shell: bash
        run: |
          set -euo pipefail
          test -s church/live/management-camera-qr.js
          node --check church/live/live.js
          node --check church/live/management-camera-qr.js
          grep -Fq 'id="openManagementCameraButton"' church/live/index.html
          grep -Fq 'id="managementCameraDialog"' church/live/index.html
          grep -Fq 'id="presenterResizeGrip"' church/live/index.html
          grep -Fq "source.sourceRole==='management_camera'" church/live/live.js
          grep -Fq 'function beginOverlayResize(' church/live/live.js
          grep -Fq 'function beginPresenterResize(' church/live/live.js
          grep -Fq 'function drawManagementCamera' church/live/management-camera-qr.js || grep -Fq 'qrMatrixV5' church/live/management-camera-qr.js
          release="$CHURCH_SOURCE_SHA"
          verified=false
          for attempt in $(seq 1 12); do
            page=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-qr-studio.html -w '%{http_code}' "https://ekodi.kr/ekodichurch/live/?mode=studio&release=$release" || true)
            js=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-qr-live.js -w '%{http_code}' "https://ekodi.kr/ekodichurch/live/live.js?release=$release" || true)
            qr=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/church-qr.js -w '%{http_code}' "https://ekodi.kr/ekodichurch/live/management-camera-qr.js?release=$release" || true)
            if [[ "$page" == 200 && "$js" == 200 && "$qr" == 200 ]] &&
              grep -Fq 'id="managementCameraDialog"' /tmp/church-qr-studio.html &&
              grep -Fq 'id="openManagementCameraButton"' /tmp/church-qr-studio.html &&
              grep -Fq 'id="presenterResizeGrip"' /tmp/church-qr-studio.html &&
              grep -Fq 'function createManagementCameraPair(' /tmp/church-qr-live.js &&
              grep -Fq 'function beginOverlayResize(' /tmp/church-qr-live.js &&
              grep -Fq 'function beginPresenterResize(' /tmp/church-qr-live.js &&
              grep -Fq 'function qrMatrixV5(' /tmp/church-qr.js; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Director-only QR camera and on-program sizing not verified in Church Pages production."
            exit 1
          fi
          echo "Verified director QR camera and overlay sizing assets in production: $release"

      - name: Verify linked EKODI services
        shell: bash
        run: |
          set -euo pipefail
          for target in 'https://ekodi.kr/ekodichurch/' 'https://ekodi.kr/ekodichurch/my/' 'https://ekodi.kr/community/' 'https://ekodi.kr/privacy' 'https://ekodi.kr/terms'; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "$target" || true)
            case "$code" in 2*|3*) echo "link ok: $code $target" ;; *) echo "link failed: $code $target"; exit 1 ;; esac
          done
