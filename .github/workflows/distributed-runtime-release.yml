name: Validate EKODI Distributed Runtime

on:
  workflow_dispatch:
  pull_request:
    paths: &runtime_paths
      - 'hybrid-execution.js'
      - 'hybrid-execution-admin.js'
      - 'hybrid-execution-monitor.js'
      - 'mission-control-entry-worker.js'
      - 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
      - 'migrations/0040_hybrid_execution.sql'
      - 'migrations/0041_hybrid_execution_monitor.sql'
      - 'test/hybrid-execution-contract.test.mjs'
      - 'test/hybrid-execution-monitor-contract.test.mjs'
      - 'test/device-control-contract.test.mjs'
      - '.github/workflows/distributed-runtime-release.yml'
  push:
    branches: [main]
    paths: *runtime_paths

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate distributed runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check hybrid-execution.js
          node --check hybrid-execution-admin.js
          node --check hybrid-execution-monitor.js
          node --check mission-control-entry-worker.js
          node --test test/hybrid-execution-contract.test.mjs test/hybrid-execution-monitor-contract.test.mjs test/device-control-contract.test.mjs
          npm run build
          test -f dist/device-control-admin.js
          grep -Fq 'EKODI HYBRID EXECUTION' dist/device-control-admin.js
          grep -Fq '/api/control/hybrid-execution/dashboard' dist/device-control-admin.js
          grep -Fq '/api/control/hybrid-execution/monitor' dist/device-control-admin.js
          grep -Fq '운영 자동감시' dist/device-control-admin.js
          grep -Fq '새 기기의 자동 실행은 기본 OFF' dist/device-control-admin.js
          ! grep -Eq 'child_process|execSync|spawnSync|Invoke-Expression' hybrid-execution.js
          ! grep -Eq 'child_process|execSync|spawnSync|Invoke-Expression' hybrid-execution-monitor.js
          node scripts/validate-deployment-guardrails.mjs

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse Agent and enforce execution boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          $content = Get-Content $path -Raw
          $commands = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ })
          foreach ($forbidden in @('Invoke-Expression','iex')) { if ($commands -contains $forbidden) { throw "Forbidden executable command found: $forbidden" } }
          foreach ($guard in @('arbitraryShell = $false','screenCapture = $false','credentialCollection = $false')) { if (-not $content.Contains($guard)) { throw "Missing privacy guard: $guard" } }
          if ($content -match '(?i)Restart-Computer|GetAsyncKeyState|SetWindowsHookEx|CopyFromScreen|GetClipboard') { throw 'Forbidden remote-control behavior found.' }
