name: Deploy EKODI Finance API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'finance-worker.js'
      - 'finance-entry-worker.js'
      - 'wrangler.finance.toml'
      - 'migrations/*finance*.sql'

permissions:
  contents: read

concurrency:
  group: ekodi-finance-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
      TOSS_PAYMENTS_MID: ${{ secrets.TOSS_PAYMENTS_MID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Finance source and namespace boundary
        run: |
          node --check finance-worker.js
          node --check finance-entry-worker.js
          grep -Fq "finance_organizations" finance-entry-worker.js
          grep -Fq "finance_payments" finance-entry-worker.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Apply shared D1 migrations when required
        run: npx --yes wrangler@4.119.0 d1 migrations apply ekodi-auth --remote --config wrangler.finance.toml
      - name: Deploy Finance Worker
        run: npm run deploy:finance
      - name: Connect Toss credentials when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOSS_PAYMENTS_SECRET_KEY:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_SECRET_KEY" | npx --yes wrangler@4.119.0 secret put TOSS_SECRET_KEY --config wrangler.finance.toml >/dev/null
          fi
          if [ -n "${TOSS_PAYMENTS_MID:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_MID" | npx --yes wrangler@4.119.0 secret put TOSS_MID --config wrangler.finance.toml >/dev/null
          fi
      - name: Verify Finance production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/health' || true)
            if printf '%s' "$health" | grep -q '"ok":true'; then
              echo 'EKODI Finance API production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
