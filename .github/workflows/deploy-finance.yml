name: Deploy EKODI Finance API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'finance-worker.js'
      - 'finance-entry-worker.js'
      - 'tax-business-registry-service.js'
      - 'wrangler.finance.toml'
      - 'migrations/**'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'scripts/guarded-worker-release.mjs'
      - 'scripts/validate-additive-migrations.mjs'
      - 'deploy/manifests/finance-api.worker.json'
      - '.github/workflows/deploy-finance.yml'
  push:
    branches: [main]
    paths:
      - 'finance-worker.js'
      - 'finance-entry-worker.js'
      - 'tax-business-registry-service.js'
      - 'wrangler.finance.toml'
      - 'migrations/**'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'scripts/guarded-worker-release.mjs'
      - 'scripts/validate-additive-migrations.mjs'
      - 'deploy/manifests/finance-api.worker.json'
      - '.github/workflows/deploy-finance.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-finance-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.127.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Finance source, namespace and migration policy
        run: |
          set -euo pipefail
          node --check finance-worker.js
          node --check finance-entry-worker.js
          node --check tax-business-registry-service.js
          node --check scripts/guarded-worker-release.mjs
          node --check scripts/validate-additive-migrations.mjs
          bash -n scripts/apply-d1-migrations-with-retry.sh
          node scripts/validate-additive-migrations.mjs migrations
          test -f deploy/manifests/finance-api.worker.json
          grep -Fq "finance_organizations" finance-entry-worker.js
          grep -Fq "finance_payments" finance-entry-worker.js
          grep -Fq "finance_tax_business_registry_status" finance-entry-worker.js
          grep -Fq "NTS_STATUS_ENDPOINT" tax-business-registry-service.js
          grep -Fq "NTS_BUSINESS_STATUS_SERVICE_KEY" tax-business-registry-service.js
          grep -Fq "TOSS_SECRET_KEY_NOT_CONFIGURED" finance-worker.js
          grep -Fq "'/health'" finance-worker.js

  staging:
    environment: development
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Resolve or create isolated Finance staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-auth-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-auth-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build isolated Finance staging config
        shell: bash
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          cat > wrangler.finance.staging.runtime.toml <<EOF
          name = "ekodi-finance-api-staging"
          main = "finance-entry-worker.js"
          compatibility_date = "2026-08-12"
          workers_dev = true
          preview_urls = false
          [vars]
          ENVIRONMENT = "staging"
          ALLOWED_ORIGINS = "https://admin.ekodi.kr"

          [observability.logs]
          enabled = true
          invocation_logs = true

          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-auth-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
      - name: Apply all migrations to isolated staging D1
        run: bash scripts/apply-d1-migrations-with-retry.sh DB wrangler.finance.staging.runtime.toml "$WRANGLER_VERSION"
      - name: Deploy isolated Finance staging Worker without production payment secrets
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.finance.staging.runtime.toml
      - name: Verify Finance staging health and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION deployments status --config wrangler.finance.staging.runtime.toml --json > /tmp/staging-deployments.json
          npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply DB --local --config wrangler.finance.staging.runtime.toml >/tmp/local-migrations.log 2>&1\n          npx --yes wrangler@$WRANGLER_VERSION dev --local --config wrangler.finance.staging.runtime.toml --ip 127.0.0.1 --port 8792 > /tmp/finance-remote-dev.log 2>&1 &
          runtime_pid=$!
          trap 'kill $runtime_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 'http://127.0.0.1:8792/health' || true)
            if [ "$code" = '200' ]; then ready=1; break; fi
            if ! kill -0 $runtime_pid 2>/dev/null; then cat /tmp/finance-remote-dev.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" != '1' ]; then cat /tmp/finance-remote-dev.log; exit 1; fi
          for attempt in $(seq 1 18); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'http://127.0.0.1:8792/health' || true)
            registry_health=$(curl -fsS --connect-timeout 5 --max-time 12 'http://127.0.0.1:8792/api/finance/tax-business-status-health' || true)
            overview_code=$(curl -sS -o /tmp/finance-stage-overview.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8792/api/finance/overview' || true)
            structure_code=$(curl -sS -o /tmp/finance-stage-structure.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8792/api/finance/structure' || true)
            if printf '%s' "$health" | grep -q '"ok":true' \
              && printf '%s' "$health" | grep -Fq 'ekodi-finance-api' \
              && printf '%s' "$registry_health" | grep -Fq '"service":"ekodi-tax-business-registry"' \
              && printf '%s' "$registry_health" | grep -Fq '"provider":"NTS_PUBLIC_DATA"' \
              && [ "$overview_code" = '401' ] \
              && [ "$structure_code" = '401' ]; then
              echo 'Finance API isolated staging verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Cleanup staging config
        if: always()
        run: rm -f wrangler.finance.staging.runtime.toml

  production:
    needs: [validate, staging]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
      TOSS_PAYMENTS_MID: ${{ secrets.TOSS_PAYMENTS_MID }}
      NTS_BUSINESS_STATUS_SERVICE_KEY: ${{ secrets.NTS_BUSINESS_STATUS_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Capture production D1 Time Travel bookmark
        id: d1_bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 time-travel info ekodi-auth --config wrangler.finance.toml --json > /tmp/finance-d1-bookmark.json
          BOOKMARK=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/finance-d1-bookmark.json','utf8'));const walk=x=>{if(!x||typeof x!=='object')return '';if(typeof x.bookmark==='string')return x.bookmark;for(const v of Object.values(x)){const r=walk(v);if(r)return r}return ''};process.stdout.write(walk(j))")
          test -n "$BOOKMARK"
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"
      - name: Apply production D1 migrations only after staging success
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.finance.toml "$WRANGLER_VERSION"
      - name: Build secret-safe candidate, verify at 0%, then promote
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const secrets = {};
          if (process.env.TOSS_PAYMENTS_SECRET_KEY) secrets.TOSS_SECRET_KEY = process.env.TOSS_PAYMENTS_SECRET_KEY;
          if (process.env.TOSS_PAYMENTS_MID) secrets.TOSS_MID = process.env.TOSS_PAYMENTS_MID;
          if (process.env.NTS_BUSINESS_STATUS_SERVICE_KEY) secrets.NTS_BUSINESS_STATUS_SERVICE_KEY = process.env.NTS_BUSINESS_STATUS_SERVICE_KEY;
          fs.writeFileSync('/tmp/finance-secrets.json', JSON.stringify(secrets), { mode: 0o600 });
          console.log(`Prepared guarded Finance candidate with ${Object.keys(secrets).length} secret key(s); values remain hidden.`);
          NODE
          trap 'rm -f /tmp/finance-secrets.json' EXIT
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/finance-api.worker.json --secrets-file /tmp/finance-secrets.json
      - name: Deep verify Finance production hostname and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/health' || true)
            registry_health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/api/finance/tax-business-status-health' || true)
            overview_code=$(curl -sS -o /tmp/finance-overview.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/api/finance/overview' || true)
            structure_code=$(curl -sS -o /tmp/finance-structure.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/api/finance/structure' || true)
            if printf '%s' "$health" | grep -q '"ok":true' \
              && printf '%s' "$health" | grep -Fq 'ekodi-finance-api' \
              && printf '%s' "$registry_health" | grep -Fq '"service":"ekodi-tax-business-registry"' \
              && printf '%s' "$registry_health" | grep -Fq '"provider":"NTS_PUBLIC_DATA"' \
              && printf '%s' "$registry_health" | grep -Fq '"schemaVersion":1' \
              && [ "$overview_code" = '401' ] \
              && [ "$structure_code" = '401' ]; then
              echo 'EKODI Finance API production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Record D1 recovery and secret-release policy
        shell: bash
        env:
          BOOKMARK: ${{ steps.d1_bookmark.outputs.bookmark }}
        run: |
          {
            echo '## Finance API production recovery point'
            echo
            echo "- D1 bookmark before production migrations: \`$BOOKMARK\`"
            echo '- Toss and optional NTS public-data secrets are included only in the 0% candidate version when GitHub secrets are present.'
            echo '- Missing keys in the candidate secrets file preserve the previous Worker secret values.'
            echo '- No immediate `wrangler secret put` runs after promotion, so secret rotation cannot bypass the release gate.'
            echo '- D1 restore remains manual to avoid discarding legitimate writes after deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
