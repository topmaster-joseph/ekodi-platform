name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ekodi-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:api
      - name: Verify deployed auth API and D1
        shell: bash
        run: |
          set -euo pipefail
          api='https://ekodi-auth-api.topmaster-joseph.workers.dev'
          origin='https://shy-thunder-39a4.topmaster-joseph.workers.dev'
          for attempt in $(seq 1 12); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 "$api/health" || true)
            status=$(curl -fsS --connect-timeout 5 --max-time 12 -H "Origin: $origin" "$api/api/status" || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$status" | grep -q '"initialized"'; then
              echo "Auth API ready: $status"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Auth API/D1 verification failed"
              echo "health=$health"
              echo "status=$status"
              exit 1
            fi
            sleep 5
          done
      - name: Deploy platform site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:site
      - name: Deploy EKODI Books
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:books
      - name: Verify EKODI root and Books navigation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            all_ok=1
            for url in 'https://ekodi.kr/' 'https://www.ekodi.kr/' 'https://books.ekodi.kr/'; do
              code=$(curl -L -sS -o /tmp/ekodi-check -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
              echo "$url -> $code"
              case "$code" in 2*|3*) ;; *) all_ok=0 ;; esac
            done
            if [ "$all_ok" -eq 1 ]; then
              curl -fsS --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' | grep -q 'href="https://ekodi.kr/"'
              exit 0
            fi
            sleep 5
          done
          exit 1
