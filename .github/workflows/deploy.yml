name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ekodi-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test

  deploy-root:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Best-effort legacy DNS cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr" > /tmp/zone.json
          zone_id=$(python - <<'PY'
          import json
          rows=(json.load(open('/tmp/zone.json')).get('result') or [])
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$zone_id" || (echo 'ekodi.kr zone not found' && exit 1)
          for name in ekodi.kr www.ekodi.kr; do
            curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100" > /tmp/records.json
            python - <<'PY' > /tmp/delete_ids
          import json
          for r in json.load(open('/tmp/records.json')).get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
            while read -r id; do
              [ -n "$id" ] || continue
              echo "Removing legacy DNS record $name/$id"
              curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/dev/null
            done < /tmp/delete_ids
          done
      - name: Deploy zero-JS root portal
        run: npm run deploy:site
      - name: Verify root custom domains
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true)
            www_code=$(curl -L -sS -o /tmp/www.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://www.ekodi.kr/' || true)
            echo "attempt=$attempt root=$root_code www=$www_code"
            if [[ "$root_code" =~ ^[23] ]] && [[ "$www_code" =~ ^[23] ]] \
              && grep -Fq 'CONNECTED ECOSYSTEM' /tmp/root.html \
              && ! grep -Fq '<script' /tmp/root.html; then
              echo 'EKODI zero-JS root portal is healthy.'
              exit 0
            fi
            sleep 5
          done
          echo 'EKODI root custom-domain verification failed.'
          exit 1

  deploy-api:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run deploy:api
      - name: Verify auth API and D1
        shell: bash
        run: |
          set -euo pipefail
          api='https://ekodi-auth-api.topmaster-joseph.workers.dev'
          for attempt in $(seq 1 12); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 "$api/health" || true)
            status=$(curl -fsS --connect-timeout 5 --max-time 12 "$api/api/status" || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$status" | grep -q '"initialized"'; then
              echo 'Auth API ready.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-books:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run deploy:books
      - name: Verify Books navigation
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
          [[ "$code" =~ ^[23] ]] && grep -Fq 'href="https://ekodi.kr/"' /tmp/books.html
