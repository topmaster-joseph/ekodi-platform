name: Full Ecosystem Verification (Manual)
# deployment-guardrail: verification-only-no-production-write

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for coordinated ecosystem verification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-full-ecosystem-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record verification reason
        run: |
          echo "Full ecosystem verification requested: ${{ inputs.reason }}"
          echo 'This workflow performs no deployment, migration, DNS mutation, or secret change.'
          echo 'Production writes are owned by the service-specific guarded release workflows.'
      - name: Validate all source and platform boundaries
        run: |
          npm run check
          npm test
      - name: Verify coordinated production state
        shell: bash
        run: |
          set -euo pipefail
          verify_html() { url="$1"; needle="$2"; code=$(curl -L -sS -o /tmp/verify-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true); echo "$url -> $code"; [[ "$code" =~ ^[23] ]] && grep -Fq "$needle" /tmp/verify-body; }
          for attempt in $(seq 1 12); do
            api=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/health' || true)
            finance=$(curl -fsS --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/health' || true)
            community=$(curl -fsS --connect-timeout 5 --max-time 12 'https://community.ekodi.kr/health' || true)
            social=$(curl -fsS --connect-timeout 5 --max-time 12 'https://social.ekodi.kr/health' || true)
            if verify_html 'https://ekodi.kr/' 'CONNECTED ECOSYSTEM' \
              && verify_html 'https://admin.ekodi.kr/' 'EKODI Control Center' \
              && verify_html 'https://auth.ekodi.kr/' 'EKODI 인증센터' \
              && verify_html 'https://marketing.ekodi.kr/' '마케팅AI' \
              && verify_html 'https://books.ekodi.kr/' 'EKODI' \
              && printf '%s' "$api" | grep -q '"ok":true' \
              && printf '%s' "$finance" | grep -q '"ok":true' \
              && printf '%s' "$community" | grep -q '"ok":true' \
              && printf '%s' "$social" | grep -q 'ekodi-social'; then
              echo 'EKODI guarded production ecosystem verified without modifying production.'
              exit 0
            fi
            sleep 5
          done
          exit 1
