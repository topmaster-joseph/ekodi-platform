name: Full Ecosystem Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for coordinated full ecosystem deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-full-ecosystem-production
  cancel-in-progress: false

jobs:
  coordinated-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
      TOSS_PAYMENTS_MID: ${{ secrets.TOSS_PAYMENTS_MID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Record coordinated release reason
        run: |
          echo "Full ecosystem deployment requested: ${{ inputs.reason }}"
          echo 'This workflow is intentionally manual-only. Normal source changes use platform-specific workflows.'

      - name: Validate all source and platform boundaries
        run: |
          npm run check
          npm test

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Apply shared D1 migrations
        run: npx --yes wrangler@4.119.0 d1 migrations apply ekodi-auth --remote --config wrangler.api.toml

      - name: Deploy shared site runtime
        run: npm run deploy:site

      - name: Deploy Control API
        run: npm run deploy:api

      - name: Deploy Finance API
        run: npm run deploy:finance

      - name: Connect Toss credentials when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOSS_PAYMENTS_SECRET_KEY:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_SECRET_KEY" | npx --yes wrangler@4.119.0 secret put TOSS_SECRET_KEY --config wrangler.finance.toml >/dev/null
          fi
          if [ -n "${TOSS_PAYMENTS_MID:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_MID" | npx --yes wrangler@4.119.0 secret put TOSS_MID --config wrangler.finance.toml >/dev/null
          fi

      - name: Deploy Books
        run: npm run deploy:books

      - name: Verify coordinated production release
        shell: bash
        run: |
          set -euo pipefail
          verify_html() {
            url="$1"
            needle="$2"
            code=$(curl -L -sS -o /tmp/verify-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
            echo "$url -> $code"
            [[ "$code" =~ ^[23] ]] && grep -Fq "$needle" /tmp/verify-body
          }
          for attempt in $(seq 1 18); do
            api=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/health' || true)
            finance=$(curl -fsS --connect-timeout 5 --max-time 12 'https://finance-api.ekodi.kr/health' || true)
            if verify_html 'https://ekodi.kr/' 'CONNECTED ECOSYSTEM' \
              && verify_html 'https://admin.ekodi.kr/' 'EKODI Control Center' \
              && verify_html 'https://auth.ekodi.kr/' 'EKODI 인증센터' \
              && verify_html 'https://pay.ekodi.kr/' 'EKODI Pay' \
              && verify_html 'https://trade.ekodi.kr/' 'EKODI GLOBAL TRADING' \
              && verify_html 'https://books.ekodi.kr/' 'EKODI' \
              && printf '%s' "$api" | grep -q '"ok":true' \
              && printf '%s' "$finance" | grep -q '"ok":true'; then
              echo 'Coordinated ecosystem release verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
