name: Full Ecosystem Verification (Manual)
# deployment-guardrail: verification-only-no-production-write
# production-probe-policy: single-quota-aware-post-deploy-canary

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for coordinated ecosystem verification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-full-ecosystem-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID || '46aad4738793fbaca88574832a2ccc0f' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record verification reason
        run: |
          echo "Full ecosystem verification requested: ${{ inputs.reason }}"
          echo 'This workflow performs no deployment, migration, DNS mutation, or secret change.'
          echo 'Production writes are owned by the service-specific guarded release workflows.'
          echo 'Production HTTP verification is delegated to the canonical quota-aware canary; no retry fan-out is permitted.'
      - name: Validate all source and platform boundaries
        run: |
          npm run check
          npm test
      - name: Read Production Cloudflare quota Source of Truth
        id: quota
        run: node scripts/cloudflare-production-budget.mjs --output=cloudflare-production-quota.json
      - name: Verify coordinated production state with canonical canary
        env:
          EKODI_CF_QUOTA_STATE: ${{ steps.quota.outputs.state }}
        run: node scripts/post-deploy-canary.mjs --scope=full --output=production-canary.json
