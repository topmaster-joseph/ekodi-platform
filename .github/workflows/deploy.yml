name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ekodi-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test

  migrate-db:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Apply D1 migrations
        run: npx --yes wrangler@4.119.0 d1 migrations apply ekodi-auth --remote --config wrangler.api.toml

  deploy-root:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Best-effort legacy DNS cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr" > /tmp/zone.json
          zone_id=$(python - <<'PY'
          import json
          rows=(json.load(open('/tmp/zone.json')).get('result') or [])
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$zone_id" || (echo 'ekodi.kr zone not found' && exit 1)
          for name in ekodi.kr www.ekodi.kr; do
            curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100" > /tmp/records.json
            python - <<'PY' > /tmp/delete_ids
          import json
          for r in json.load(open('/tmp/records.json')).get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
            while read -r id; do
              [ -n "$id" ] || continue
              echo "Removing legacy DNS record $name/$id"
              curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/dev/null
            done < /tmp/delete_ids
          done
      - name: Deploy EKODI root and gateway Worker
        run: npm run deploy:site
      - name: Verify root, admin, pay and trading domains
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true)
            admin_code=$(curl -L -sS -o /tmp/admin.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true)
            pay_code=$(curl -L -sS -o /tmp/pay.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://pay.ekodi.kr/' || true)
            trade_code=$(curl -L -sS -o /tmp/trade.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://trade.ekodi.kr/' || true)
            legacy_trade_code=$(curl -L -sS -o /tmp/legacy-trade.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://trade.biz.ekodi.kr/' || true)
            echo "attempt=$attempt root=$root_code admin=$admin_code pay=$pay_code trade=$trade_code legacy_trade=$legacy_trade_code"
            if [[ "$root_code" =~ ^[23] ]] && [[ "$admin_code" =~ ^[23] ]] && [[ "$pay_code" =~ ^[23] ]] && [[ "$trade_code" =~ ^[23] ]] && [[ "$legacy_trade_code" =~ ^[23] ]] \
              && grep -Fq 'CONNECTED ECOSYSTEM' /tmp/root.html \
              && grep -Fq 'CONTROL CENTER · V4' /tmp/admin.html \
              && grep -Fq 'EKODI Pay' /tmp/pay.html \
              && grep -Fq 'EKODI GLOBAL TRADING' /tmp/trade.html \
              && grep -Fq 'EKODI GLOBAL TRADING' /tmp/legacy-trade.html; then
              echo 'EKODI root, admin, pay and trading custom domains are healthy.'
              exit 0
            fi
            sleep 5
          done
          echo 'EKODI root/gateway custom-domain verification failed.'
          exit 1

  deploy-api:
    needs: migrate-db
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run deploy:api
      - name: Verify auth API and D1
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/health' || true)
            status=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/status' || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$status" | grep -q '"initialized"'; then
              echo 'Auth API ready.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-ops:
    needs: migrate-db
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
      TOSS_PAYMENTS_MID: ${{ secrets.TOSS_PAYMENTS_MID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy operations API
        run: npm run deploy:ops
      - name: Connect Toss server secret when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOSS_PAYMENTS_SECRET_KEY:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_SECRET_KEY" | npx --yes wrangler@4.119.0 secret put TOSS_SECRET_KEY --config wrangler.ops.toml >/dev/null
            echo 'Toss Payments server secret connected.'
          else
            echo 'TOSS_PAYMENTS_SECRET_KEY is not configured yet; payment sync remains safely disabled.'
          fi
          if [ -n "${TOSS_PAYMENTS_MID:-}" ]; then
            printf '%s' "$TOSS_PAYMENTS_MID" | npx --yes wrangler@4.119.0 secret put TOSS_MID --config wrangler.ops.toml >/dev/null
            echo 'Toss Payments MID connected.'
          fi
      - name: Verify operations API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://ops-api.ekodi.kr/health' || true)
            if printf '%s' "$health" | grep -q '"ok":true'; then
              echo 'Operations API ready.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-books:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run deploy:books
      - name: Verify Books navigation
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
          [[ "$code" =~ ^[23] ]] && grep -Fq 'href="https://ekodi.kr/"' /tmp/books.html
