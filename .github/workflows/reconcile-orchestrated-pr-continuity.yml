name: EKODI Orchestrated PR Continuity Reconciliation

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ekodi-orchestrated-pr-continuity
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted canonical main
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resume only approved missing/cancelled merge events
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-orchestrated-pr-continuity.mjs
