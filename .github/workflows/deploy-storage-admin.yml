name: Deploy Admin Storage Workspace

on:
  pull_request:
    paths: &storage_admin_paths
      - 'storage-admin.js'
      - 'storage-admin.css'
      - 'storage-admin-demand.js'
      - 'scripts/admin-system-map-postbuild.mjs'
      - '.github/workflows/deploy-storage-admin.yml'
  push:
    branches: [main]
    paths: *storage_admin_paths

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Storage remains demand-loaded
        run: |
          set -euo pipefail
          node --check storage-admin.js
          node --check storage-admin-demand.js
          npm run build
          test -f dist/storage-admin.js
          test -f dist/storage-admin.css
          grep -Fq "loadScript('storage-admin.js')" dist/admin-demand-loader.js
          ! grep -Fq '<script src="storage-admin.js"' dist/control-center.html
          ! grep -Fq 'setInterval(' storage-admin-demand.js
          ! grep -Fq 'MutationObserver' storage-admin-demand.js

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and guarded shared-site release
        run: |
          set -euo pipefail
          npm run build
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify Storage assets in production
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 3 https://admin.ekodi.kr/storage-admin.js -o /tmp/storage.js
          curl -fsS --retry 6 --retry-delay 3 https://admin.ekodi.kr/storage-admin.css -o /tmp/storage.css
          grep -Fq 'drive.ekodi.kr/api/control/storage/google' /tmp/storage.js
          grep -Fq '.storage-admin' /tmp/storage.css
