name: EKODI Exact-SHA Recovery Bootstrap

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  bootstrap:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ai/chatgpt/orchestrator-approval-receipt-v2-20261007' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'orchestrator-human-gate-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify exact-SHA owner approval before any privileged recovery
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="EKODI-HUMAN-GATE-APPROVE:$APPROVED_SHA"
          comments="$(curl -fsS --retry 2             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")"
          printf '%s' "$comments" | jq -e --arg marker "$marker"             'any(.[]; .user.login == "topmaster-joseph" and (.body | contains($marker)))' >/dev/null
          echo "Exact-SHA Super Administrator approval verified for $APPROVED_SHA."
      - name: Checkout trusted recovery runtime from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Bootstrap canonical recovery using the trusted main runtime
        env:
          GITHUB_EVENT_NAME: pull_request
        run: node scripts/recover-release-provenance.mjs
