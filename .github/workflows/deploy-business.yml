name: Deploy EKODI Business OS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'business/**'
      - 'business-worker.js'
      - 'business-live-worker.js'
      - 'auth-site/business-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*business_os*.sql'
      - 'supabase/functions/business-handoff-api/**'
      - 'wrangler.business*.toml'
      - 'test/business-os-platform.test.mjs'
      - 'deploy/manifests/business.worker.json'
      - 'platform-boundaries.json'
      - 'config/ecosystem-services.json'
      - 'config/user-ui-dna.json'
      - 'service-registry.json'
      - 'package.json'
      - '.github/workflows/deploy-business.yml'
  push:
    branches:
      - main
    paths:
      - 'business/**'
      - 'business-worker.js'
      - 'business-live-worker.js'
      - 'auth-site/business-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*business_os*.sql'
      - 'supabase/functions/business-handoff-api/**'
      - 'wrangler.business*.toml'
      - 'test/business-os-platform.test.mjs'
      - 'deploy/manifests/business.worker.json'
      - 'platform-boundaries.json'
      - 'config/ecosystem-services.json'
      - 'config/user-ui-dna.json'
      - 'service-registry.json'
      - 'package.json'
      - '.github/workflows/deploy-business.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-business-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Business OS source and guardrails
        run: |
          set -euo pipefail
          node --check business-worker.js
          node --check business-live-worker.js
          node --check business/app.js
          node --check auth-site/business-auth.js
          node --check auth-site/auth-router.js
          node --test test/business-os-platform.test.mjs
          npm run validate:boundaries
          npm run validate:ui-dna
          npm run validate:mission
          grep -Fq 'main = "business-live-worker.js"' wrangler.business-staging.toml
          grep -Fq 'INTEGRATIONS_ENABLED = "false"' wrangler.business-staging.toml
          grep -Fq 'EXECUTION_ENABLED = "false"' wrangler.business-staging.toml
          grep -Fq 'main = "business-live-worker.js"' wrangler.business.toml
          grep -Fq 'pattern = "business.ekodi.kr"' wrangler.business.toml
          grep -Fq 'INTEGRATIONS_ENABLED = "true"' wrangler.business.toml
          grep -Fq 'EXECUTION_ENABLED = "false"' wrangler.business.toml
          grep -Fq 'SUPABASE_URL' wrangler.business.toml
          grep -Fq 'SUPABASE_PUBLISHABLE_KEY' wrangler.business.toml
          test -f deploy/manifests/business.worker.json
          test -f supabase/migrations/20260817003000_business_os_live_data.sql
          test -f supabase/functions/business-handoff-api/index.ts

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.business-staging.toml
      - name: Verify isolated staging surface and safety gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/business-staging.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/' || true)
            health_code=$(curl -sS -o /tmp/business-staging-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/health' || true)
            config_code=$(curl -sS -o /tmp/business-staging-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/config.js' || true)
            workspaces_code=$(curl -sS -o /tmp/business-staging-workspaces.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/api/workspaces' || true)
            snapshot_code=$(curl -sS -o /tmp/business-staging-snapshot.json -w '%{http_code}' -H 'content-type: application/json' -d '{"workspace":"jadam"}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/api/snapshot' || true)
            block_code=$(curl -sS -o /tmp/business-staging-block.json -w '%{http_code}' -H 'content-type: application/json' -d '{"action":"transfer_money","workspace":"jadam"}' --connect-timeout 5 --max-time 15 'https://ekodi-business-staging.topmaster-joseph.workers.dev/api/action-check' || true)
            if [[ "$root_code" == "200" ]] && [[ "$health_code" == "200" ]] && [[ "$config_code" == "200" ]] && [[ "$workspaces_code" == "200" ]] && [[ "$snapshot_code" == "401" ]] && [[ "$block_code" == "200" ]] \
              && grep -Fq 'EKODI' /tmp/business-staging.html \
              && grep -Fq 'BUSINESS OS' /tmp/business-staging.html \
              && grep -Fq '"stage":"isolated-staging"' /tmp/business-staging-health.json \
              && grep -Fq '"executionEnabled":false' /tmp/business-staging-health.json \
              && grep -Fq '"integrationsEnabled":false' /tmp/business-staging-health.json \
              && grep -Fq '"dataEnabled":false' /tmp/business-staging-config.js \
              && grep -Fq '"id":"ekodibiz"' /tmp/business-staging-workspaces.json \
              && grep -Fq '"id":"jadam"' /tmp/business-staging-workspaces.json \
              && grep -Fq '"reason":"high_impact_human_only"' /tmp/business-staging-block.json; then
              echo 'Business OS staging verified with live gateway isolated and external execution disabled.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Bootstrap first production Worker only when no deployment exists
        shell: bash
        run: |
          set -euo pipefail
          set +e
          status_output=$(npx --yes wrangler@4.119.0 deployments status --config wrangler.business.toml --json 2>&1)
          status_code=$?
          set -e
          if [[ "$status_code" == "0" ]]; then
            echo 'Existing Business OS Worker found. Guarded release will preserve rollback history.'
            exit 0
          fi
          if ! grep -Fq 'does not exist' <<<"$status_output"; then
            printf '%s\n' "$status_output"
            echo 'Could not establish Business OS Worker state; refusing production bootstrap.'
            exit "$status_code"
          fi
          echo 'No production Business OS Worker exists. Performing one-time read-only bootstrap from the staging-verified source.'
          npx --yes wrangler@4.119.0 deploy --config wrangler.business.toml
      - name: Candidate at 0%, verify, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/business.worker.json
      - name: Deep verify Business OS production hostname and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/business.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/' || true)
            health_code=$(curl -sS -o /tmp/business-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/health' || true)
            config_code=$(curl -sS -o /tmp/business-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/config.js' || true)
            workspaces_code=$(curl -sS -o /tmp/business-workspaces.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/api/workspaces' || true)
            ekodibiz_code=$(curl -L -sS -o /tmp/business-ekodibiz.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/ekodibiz' || true)
            jadam_code=$(curl -L -sS -o /tmp/business-jadam.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/jadam' || true)
            snapshot_code=$(curl -sS -o /tmp/business-snapshot.json -w '%{http_code}' -H 'content-type: application/json' -d '{"workspace":"jadam"}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/api/snapshot' || true)
            block_code=$(curl -sS -o /tmp/business-block.json -w '%{http_code}' -H 'content-type: application/json' -d '{"action":"sign_contract","workspace":"jadam"}' --connect-timeout 5 --max-time 15 'https://business.ekodi.kr/api/action-check' || true)
            if [[ "$root_code" == "200" ]] && [[ "$health_code" == "200" ]] && [[ "$config_code" == "200" ]] && [[ "$workspaces_code" == "200" ]] && [[ "$ekodibiz_code" == "200" ]] && [[ "$jadam_code" == "200" ]] && [[ "$snapshot_code" == "401" ]] && [[ "$block_code" == "200" ]] \
              && grep -Fq 'EKODI' /tmp/business.html \
              && grep -Fq 'BUSINESS OS' /tmp/business.html \
              && grep -Fq 'BUSINESS OS' /tmp/business-ekodibiz.html \
              && grep -Fq 'BUSINESS OS' /tmp/business-jadam.html \
              && grep -Fq '"stage":"production-readonly-mvp"' /tmp/business-health.json \
              && grep -Fq '"executionEnabled":false' /tmp/business-health.json \
              && grep -Fq '"integrationsEnabled":true' /tmp/business-health.json \
              && grep -Fq '"dataEnabled":true' /tmp/business-config.js \
              && grep -Fq '"id":"ekodibiz"' /tmp/business-workspaces.json \
              && grep -Fq '"id":"jadam"' /tmp/business-workspaces.json \
              && grep -Fq '"reason":"high_impact_human_only"' /tmp/business-block.json; then
              echo 'Business OS production verified with read-only live integration and execution disabled.'
              exit 0
            fi
            sleep 5
          done
          exit 1
