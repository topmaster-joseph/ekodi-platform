name: Deploy Business OS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'business/**'
      - 'business-worker.js'
      - 'business-os-core.js'
      - 'business-os-public-api.js'
      - 'ekodibiz-doraji-office.js'
      - 'test/business-os-shared-core.test.mjs'
      - 'test/ekodibiz-doraji-office.test.mjs'
      - 'config/retire-business-subdomain.json'
      - 'business-live-worker.js'
      - 'auth-site/business-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*business_os*.sql'
      - 'supabase/functions/business-handoff-api/**'
      - 'wrangler.business*.toml'
      - 'test/business-os-platform.test.mjs'
      - 'deploy/manifests/business.worker.json'
      - 'platform-boundaries.json'
      - 'config/ecosystem-services.json'
      - 'config/user-ui-dna.json'
      - 'service-registry.json'
      - 'package.json'
      - '.github/workflows/deploy-business.yml'
  push:
    branches:
      - main
    paths:
      - 'business/**'
      - 'business-worker.js'
      - 'business-live-worker.js'
      - 'auth-site/business-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*business_os*.sql'
      - 'supabase/functions/business-handoff-api/**'
      - 'wrangler.business*.toml'
      - 'test/business-os-platform.test.mjs'
      - 'deploy/manifests/business.worker.json'
      - 'platform-boundaries.json'
      - 'config/ecosystem-services.json'
      - 'config/user-ui-dna.json'
      - 'service-registry.json'
      - 'package.json'
      - '.github/workflows/deploy-business.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-business-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_WRANGLER_VERSION: '4.127.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Business OS source and guardrails
        run: |
          set -euo pipefail
          node --check business-worker.js
          node --check business-live-worker.js
          node --check business/app.js
          node --check auth-site/business-auth.js
          node --check auth-site/auth-router.js
          node --test test/business-os-platform.test.mjs
          npm run validate:boundaries
          npm run validate:ui-dna
          npm run validate:mission
          grep -Fq 'main = "business-live-worker.js"' wrangler.business-staging.toml
          grep -Fq 'INTEGRATIONS_ENABLED = "false"' wrangler.business-staging.toml
          grep -Fq 'EXECUTION_ENABLED = "false"' wrangler.business-staging.toml
          grep -Fq 'main = "business-live-worker.js"' wrangler.business.toml
          grep -Fq 'workers_dev = false' wrangler.business.toml
          if grep -Fq '[[routes]]' wrangler.business.toml || grep -Fq 'custom_domain = true' wrangler.business.toml; then echo 'Public Business OS custom domain must stay disabled'; exit 1; fi
          node --test test/ekodibiz-doraji-office.test.mjs test/business-os-shared-core.test.mjs
          node scripts/retire-worker-custom-domains.mjs --config config/retire-business-subdomain.json --dry-run
          grep -Fq 'INTEGRATIONS_ENABLED = "true"' wrangler.business.toml
          grep -Fq 'EXECUTION_ENABLED = "false"' wrangler.business.toml
          grep -Fq 'SUPABASE_URL' wrangler.business.toml
          grep -Fq 'SUPABASE_PUBLISHABLE_KEY' wrangler.business.toml
          test -f deploy/manifests/business.worker.json
          test -f supabase/migrations/20260817003000_business_os_live_data.sql
          test -f supabase/functions/business-handoff-api/index.ts

  deploy-staging:
    environment: development
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-business-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@${STAGING_WRANGLER_VERSION} deploy --config wrangler.business-staging.toml
      - name: Confirm deployed staging revision exists
        run: npx --yes wrangler@${STAGING_WRANGLER_VERSION} deployments status --config wrangler.business-staging.toml --json > /tmp/business-deployments.json
      - name: Verify isolated staging surface and safety gates
        shell: bash
        run: |
          set -euo pipefail
          remote_protected=0
          verify_base="$STAGING_URL"
          runtime_pid=''
          cleanup() {
            if [[ -n "$runtime_pid" ]]; then kill "$runtime_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          access_code=$(curl -sS -D /tmp/business-access.headers -o /tmp/business-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
          if [[ "$access_code" == '302' ]] && grep -iq '^Www-Authenticate: Cloudflare-Access' /tmp/business-access.headers; then
            remote_protected=1
            echo 'Business staging is protected by Cloudflare Access. Keeping Access enabled and validating the exact staging configuration locally.'
            npx --yes wrangler@${STAGING_WRANGLER_VERSION} dev --config wrangler.business-staging.toml --local --port 8790 >/tmp/business-local.log 2>&1 &
            runtime_pid=$!
            verify_base='http://127.0.0.1:8790'
            ready=0
            for attempt in $(seq 1 30); do
              if curl -sSf --max-time 5 "$verify_base/health" >/dev/null 2>&1; then ready=1; break; fi
              if ! kill -0 "$runtime_pid" 2>/dev/null; then cat /tmp/business-local.log; exit 1; fi
              sleep 2
            done
            if [[ "$ready" != '1' ]]; then cat /tmp/business-local.log; exit 1; fi
          fi

          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/business-staging.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/" || true)
            health_code=$(curl -sS -o /tmp/business-staging-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/health" || true)
            config_code=$(curl -sS -o /tmp/business-staging-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/config.js" || true)
            workspaces_code=$(curl -sS -o /tmp/business-staging-workspaces.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/api/workspaces" || true)
            snapshot_code=$(curl -sS -o /tmp/business-staging-snapshot.json -w '%{http_code}' -H 'content-type: application/json' -d '{"workspace":"jadam"}' --connect-timeout 5 --max-time 15 "$verify_base/api/snapshot" || true)
            block_code=$(curl -sS -o /tmp/business-staging-block.json -w '%{http_code}' -H 'content-type: application/json' -d '{"action":"transfer_money","workspace":"jadam"}' --connect-timeout 5 --max-time 15 "$verify_base/api/action-check" || true)
            if [[ "$root_code" == "200" ]] && [[ "$health_code" == "200" ]] && [[ "$config_code" == "200" ]] && [[ "$workspaces_code" == "200" ]] && [[ "$snapshot_code" == "401" ]] && [[ "$block_code" == "200" ]] \
              && grep -Fq 'EKODI' /tmp/business-staging.html \
              && grep -Fq 'BUSINESS OS' /tmp/business-staging.html \
              && grep -Fq '"stage":"isolated-staging"' /tmp/business-staging-health.json \
              && grep -Fq '"executionEnabled":false' /tmp/business-staging-health.json \
              && grep -Fq '"integrationsEnabled":false' /tmp/business-staging-health.json \
              && grep -Fq '"dataEnabled":false' /tmp/business-staging-config.js \
              && grep -Fq '"id":"ekodibiz"' /tmp/business-staging-workspaces.json \
              && grep -Fq '"id":"jadam"' /tmp/business-staging-workspaces.json \
              && grep -Fq '"reason":"high_impact_human_only"' /tmp/business-staging-block.json; then
              if [[ "$remote_protected" == '1' ]]; then
                echo 'Business staging deployment exists in Development, Access remains enforced, and its exact staging configuration passes runtime contracts.'
              else
                echo 'Business OS staging verified remotely with live gateway isolated and external execution disabled.'
              fi
              exit 0
            fi
            sleep 5
          done
          cat /tmp/business-access.headers || true
          cat /tmp/business-staging-health.json || true
          cat /tmp/business-local.log 2>/dev/null || true
          exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate private Business OS Worker declarations
        run: |
          set -euo pipefail
          grep -Fq 'workers_dev = false' wrangler.business.toml
          ! grep -Fq '[[routes]]' wrangler.business.toml
          ! grep -Fq 'custom_domain = true' wrangler.business.toml
          node scripts/retire-worker-custom-domains.mjs --config config/retire-business-subdomain.json --dry-run
      - name: Check Cloudflare production quota before nonessential domain changes
        id: quota
        run: node scripts/cloudflare-production-budget.mjs --output=cloudflare-production-quota.json
      - name: Hold domain retirement when quota circuit is open
        if: steps.quota.outputs.skip_nonessential == 'true'
        run: |
          echo "Domain retirement held by production quota policy."
          echo "No domain detachment or DNS mutations were attempted." >> "$GITHUB_STEP_SUMMARY"
      - name: Retire obsolete public Business OS hostname after canonical health checks
        if: steps.quota.outputs.skip_nonessential != 'true'
        run: node scripts/retire-worker-custom-domains.mjs --config config/retire-business-subdomain.json
