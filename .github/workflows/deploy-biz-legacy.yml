name: Deploy EKODI Biz Legacy Redirect (Manual Topology Change)
# deployment-guardrail: topology-workflow-manual-only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-biz-legacy-redirect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Remove DNS records that can block Worker custom domains
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -u
          api='https://api.cloudflare.com/client/v4'; auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$api/zones?name=ekodibiz.kr" > /tmp/zone.json || exit 0
          zone_id=$(python - <<'PY'
          import json
          rows=(json.load(open('/tmp/zone.json')).get('result') or [])
          print(rows[0]['id'] if rows else '')
          PY
          )
          [ -n "$zone_id" ] || exit 0
          for name in ekodibiz.kr www.ekodibiz.kr; do
            curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100" > /tmp/records.json || continue
            python - <<'PY' > /tmp/delete_ids
          import json
          for r in json.load(open('/tmp/records.json')).get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}: print(r['id'])
          PY
            while read -r id; do [ -n "$id" ] || continue; curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/dev/null || true; done < /tmp/delete_ids
          done
      - name: Deploy dedicated permanent redirect Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.biz-legacy.toml
      - name: Verify ekodibiz.kr redirects to biz.ekodi.kr
        shell: bash
        run: |
          set -u
          failed=0
          for old in ekodibiz.kr www.ekodibiz.kr; do
            code=000; location=""
            for attempt in $(seq 1 15); do
              rm -f /tmp/headers; curl -sS -o /dev/null -D /tmp/headers --connect-timeout 10 --max-time 20 "https://$old/domain-check?source=biz-legacy" || true
              code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}' /tmp/headers 2>/dev/null || echo 0)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
              if [ "$code" = "301" ] && printf '%s' "$location" | grep -q 'https://biz.ekodi.kr/domain-check?source=biz-legacy'; then break; fi
              sleep 4
            done
            echo "$old http=$code location=$location"
            if [ "$code" != "301" ] || ! printf '%s' "$location" | grep -q 'https://biz.ekodi.kr/domain-check?source=biz-legacy'; then failed=1; fi
          done
          exit "$failed"
