name: Deploy EKODI Biz Legacy Redirect (Manual Topology Change)
# deployment-guardrail: topology-workflow-manual-only

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Verified orchestrator source branch (post-merge dispatch)'
        required: false
        type: string
      release_task_id:
        description: 'Verified orchestrator task id (post-merge dispatch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-biz-legacy-redirect
  cancel-in-progress: false

env:
  # WORKER-LANE-GRAPH-001: post-merge dispatches carry the orchestrator receipt.
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Verify active Cloudflare zone without DNS modification
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=ekodibiz.kr" \
            | jq -e '.success == true and any(.result[]; .name == "ekodibiz.kr" and .status == "active")' >/dev/null
          echo "Zone active. DNS records remain in place; Worker Routes reuse proxied web records."
      - name: Deploy dedicated permanent redirect Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.biz-legacy.toml
      - name: Proxy existing web DNS records only, with rollback on failed redirect check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-ekodibiz-legacy-route.mjs
      - name: Verify ekodibiz.kr redirects to ekodi.kr/ekodibiz
        shell: bash
        run: |
          set -u
          failed=0
          for old in ekodibiz.kr www.ekodibiz.kr; do
            code=000; location=""
            for attempt in $(seq 1 15); do
              rm -f /tmp/headers; curl -sS -o /dev/null -D /tmp/headers --connect-timeout 10 --max-time 20 "https://$old/domain-check?source=biz-legacy" || true
              code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}' /tmp/headers 2>/dev/null || echo 0)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
              if [ "$code" = "301" ] && printf '%s' "$location" | grep -q 'https://ekodi.kr/ekodibiz/domain-check?source=biz-legacy'; then break; fi
              sleep 4
            done
            echo "$old http=$code location=$location"
            if [ "$code" != "301" ] || ! printf '%s' "$location" | grep -q 'https://ekodi.kr/ekodibiz/domain-check?source=biz-legacy'; then failed=1; fi
          done
          exit "$failed"

      - name: Verify Naver owner file on ekodibiz.kr before claiming release success
        shell: bash
        run: |
          set -euo pipefail
          expected='naver-site-verification: naverf72bebc155107dcad735d8178146679f.html'
          url='https://ekodibiz.kr/naverf72bebc155107dcad735d8178146679f.html'
          ok=0
          for attempt in $(seq 1 15); do
            curl -fsS --connect-timeout 10 --max-time 20 -o /tmp/biz-naver-owner "$url" || true
            if [ -s /tmp/biz-naver-owner ] && [ "$(cat /tmp/biz-naver-owner)" = "$expected" ]; then
              ok=1
              break
            fi
            sleep 4
          done
          echo "ekodibiz.kr Naver HTML owner proof verified=$ok"
          test "$ok" = 1
