name: EKODI Age Verification Header Diagnostic (read only)
on:
  push:
    branches:
      - ai/chatgpt/age-verification-header-probe-20261105
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect only public response headers (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            '/verify/adult/?site=singles' \
            '/verify/adult/styles.css' \
            '/verify/adult/app.js' \
            '/verify/adult/client.js' \
            '/singles/vendor/supabase-js-2.117.3.umd.js' \
            '/api/age-verification/config?site=singles'; do
            echo "::group::HTTPS GET $path"
            curl -sS --retry 2 --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/age-headers -o /tmp/age-body \
              "https://ekodi.kr$path" || true
            grep -iE '^(HTTP/|content-type:|content-security-policy:|x-content-type-options:|cache-control:|x-ekodi-route:|x-ekodi-canonical-surface:|content-length:|location:)' /tmp/age-headers || true
            echo "bytes=$(wc -c </tmp/age-body)"
            echo "::endgroup::"
          done
