name: Remove Retired Admin Residue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/remove-retired-admin-residue.mjs
      - .github/workflows/remove-retired-admin-residue.yml

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  cleanup-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Remove retired runtime and consume migration helpers
        run: |
          set -euo pipefail
          node scripts/remove-retired-admin-residue.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/admin-central-login-link.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            "  assert.doesNotMatch(source, /legacy:'ai-ops'|domains:'ai-ops'|activity:'ai-ops'|overview:'operations'/);",
            "  assert.doesNotMatch(source, /const ALIASES=\\{[^}]*\\b(?:legacy|domains|activity|overview):/);"
          );
          fs.writeFileSync(path, source);
          NODE
          rm -f scripts/remove-retired-admin-residue.mjs .github/workflows/remove-retired-admin-residue.yml
      - name: Validate source policy and build
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test ! -e admin.html
          test ! -e control-center.js
          test ! -e control-center-features.js
          test ! -e control-center-ops.css
          test ! -e scripts/remove-retired-admin-residue.mjs
          test ! -e .github/workflows/remove-retired-admin-residue.yml
      - name: Commit cleaned source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(admin): remove retired admin compatibility residue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy current admin shell
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production retired paths
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            root=$(curl -sS -o /tmp/admin-root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?cleanup=${GITHUB_RUN_ID}" || true)
            admin_html=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin.html?cleanup=${GITHUB_RUN_ID}" || true)
            control=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center?cleanup=${GITHUB_RUN_ID}" || true)
            legacy=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/legacy?cleanup=${GITHUB_RUN_ID}" || true)
            runtime=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.js?cleanup=${GITHUB_RUN_ID}" || true)
            features=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-features.js?cleanup=${GITHUB_RUN_ID}" || true)
            echo "production admin cleanup -> root=$root retired=$admin_html/$control/$legacy/$runtime/$features"
            if [ "$root" = '200' ] && [ "$admin_html" = '404' ] && [ "$control" = '404' ] && [ "$legacy" = '404' ] && [ "$runtime" = '404' ] && [ "$features" = '404' ]; then exit 0; fi
            sleep 4
          done
          exit 1
