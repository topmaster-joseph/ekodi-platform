name: Finalize Canonical Admin Shell V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-admin-shell-v3.yml

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate canonical source and build
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-admin-shell*.yml
          node scripts/validate-admin-source.mjs
          node --check site-worker.js
          node --check admin-authenticated-shell.js
          node --check scripts/admin-performance-postbuild.mjs
          npm run build
          node --test test/admin-central-login-link.test.mjs test/admin-ai-first-navigation.test.mjs test/admin-free-ops-nav.contract.test.mjs
          for f in admin-shell.html admin-shell.css admin-finance.css admin-compact.css admin-compact.js; do test -f "dist/$f"; done
          for f in control-center.html control-center.css control-center-finance.css compact-control-center.css compact-control-center.js; do test ! -e "dist/$f"; done
          grep -Fq '<title>EKODI Admin</title>' dist/admin-shell.html
          grep -Fq 'admin-shell.css?v=' dist/admin-shell.html
          grep -Fq 'admin-compact.js' dist/admin-authenticated-shell.js
          ! grep -Fq 'compact-control-center' dist/admin-authenticated-shell.js
      - name: Deploy canonical admin shell
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production final state
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            root=$(curl -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?final=${nonce}" || true)
            new_shell=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-shell.css?final=${nonce}" || true)
            new_finance=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-finance.css?final=${nonce}" || true)
            new_compact=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-compact.css?final=${nonce}" || true)
            new_runtime=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-compact.js?final=${nonce}" || true)
            old_html=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.html?final=${nonce}" || true)
            old_route=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center?final=${nonce}" || true)
            old_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.css?final=${nonce}" || true)
            old_fin=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-finance.css?final=${nonce}" || true)
            old_compact=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.css?final=${nonce}" || true)
            old_runtime=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.js?final=${nonce}" || true)
            title=no; grep -Fq '<title>EKODI Admin</title>' /tmp/root && title=yes || true
            echo "final admin -> root=$root new=$new_shell/$new_finance/$new_compact/$new_runtime old=$old_html/$old_route/$old_css/$old_fin/$old_compact/$old_runtime title=$title"
            if [ "$root" = 200 ] && [ "$new_shell" = 200 ] && [ "$new_finance" = 200 ] && [ "$new_compact" = 200 ] && [ "$new_runtime" = 200 ] && [ "$old_html" = 404 ] && [ "$old_route" = 404 ] && [ "$old_css" = 404 ] && [ "$old_fin" = 404 ] && [ "$old_compact" = 404 ] && [ "$old_runtime" = 404 ] && [ "$title" = yes ]; then exit 0; fi
            sleep 4
          done
          exit 1
