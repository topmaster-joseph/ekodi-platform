name: Finalize Canonical Admin Shell V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-admin-shell-v3.yml

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Migrate admin shell to canonical names
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);
          const patch = (p, fn) => { const a = read(p); const b = fn(a); if (a !== b) write(p, b); };
          const move = (a, b) => {
            if (!fs.existsSync(a)) return;
            if (fs.existsSync(b)) throw new Error(`target exists: ${b}`);
            fs.renameSync(a, b);
          };

          move('control-center.html', 'admin-shell.html');
          move('control-center.css', 'admin-shell.css');
          move('control-center-finance.css', 'admin-finance.css');
          move('compact-control-center.css', 'admin-compact.css');

          const files = cp.execFileSync('git', ['ls-files'], {encoding:'utf8'})
            .split(/\r?\n/).filter(Boolean)
            .filter(p => fs.existsSync(p) && fs.statSync(p).isFile())
            .filter(p => !p.startsWith('.github/workflows/'))
            .filter(p => /\.(?:js|mjs|cjs|html|css|json|yml|yaml|md|txt)$/i.test(p));
          for (const p of files) {
            let s;
            try { s = read(p); } catch { continue; }
            let n = s
              .replaceAll('control-center-finance.css', 'admin-finance.css')
              .replaceAll('compact-control-center.css', 'admin-compact.css')
              .replaceAll('compact-control-center.js', 'admin-compact.js')
              .replaceAll('compact-control-center', 'admin-compact')
              .replaceAll('control-center.css', 'admin-shell.css')
              .replaceAll('compact-admin-shell.css', 'admin-compact.css')
              .replace(/(?<!\/)control-center\.html/g, 'admin-shell.html');
            if (n !== s) write(p, n);
          }

          patch('admin-shell.html', s => s
            .replaceAll('control-center.css', 'admin-shell.css')
            .replaceAll('compact-control-center.js', 'admin-compact.js')
            .replaceAll('EKODI Control Center', 'EKODI Admin')
            .replaceAll('CONTROL CENTER', 'ADMIN')
            .replaceAll('EKODI 중앙 관제실입니다.', 'EKODI 관리자 운영 화면입니다.'));
          patch('admin-compact.css', s => s.replaceAll('compact-control-center', 'admin-compact'));
          patch('admin-authenticated-shell.js', s => s
            .replace(/function canonicalizeLegacyEntry\(\)\{[^\n]*\}\n/, '')
            .replaceAll('canonicalizeLegacyEntry();', ''));

          patch('site-worker.js', s => {
            let n = s
              .replaceAll("assetRequest(request, '/control-center')", "assetRequest(request, '/admin-shell')")
              .replaceAll("'admin-control-center'", "'admin-shell'");
            if (!n.includes("'/control-center.css'")) {
              n = n.replace("  '/control-center-ops.css',\n]);", "  '/control-center-ops.css',\n  '/control-center.css',\n  '/control-center-finance.css',\n  '/compact-control-center.css',\n  '/compact-control-center.js',\n]);");
            }
            return n;
          });
          patch('scripts/build.mjs', s => s
            .replaceAll("asset === 'control-center.html'", "asset === 'admin-shell.html'")
            .replaceAll('minimal pre-auth Control Center', 'minimal pre-auth Admin Shell'));
          patch('scripts/admin-performance-postbuild.mjs', s => s
            .replaceAll('control-center\\.css', 'admin-shell\\.css')
            .replaceAll('control-center-finance\\.css', 'admin-finance\\.css'));
          patch('scripts/validate-admin-source.mjs', s => {
            let n = s;
            if (!n.includes("  'control-center.css',")) {
              n = n.replace("  'control-center-ops.css',\n];", "  'control-center-ops.css',\n  'control-center.html',\n  'control-center.css',\n  'control-center-finance.css',\n  'compact-control-center.css',\n];");
            }
            return n;
          });

          for (const p of fs.readdirSync('.github/workflows').filter(n => n.startsWith('finalize-admin-shell') && n.endsWith('.yml'))) {
            fs.rmSync(`.github/workflows/${p}`);
          }

          const required = ['admin-shell.html','admin-shell.css','admin-finance.css','admin-compact.css'];
          const retired = ['control-center.html','control-center.css','control-center-finance.css','compact-control-center.css'];
          for (const p of required) if (!fs.existsSync(p)) throw new Error(`missing ${p}`);
          for (const p of retired) if (fs.existsSync(p)) throw new Error(`retired source survived ${p}`);
          const shell = read('admin-shell.html');
          if (!shell.includes('<title>EKODI Admin</title>') || !shell.includes('admin-shell.css') || !shell.includes('admin-compact.js')) throw new Error('admin shell migration incomplete');
          const auth = read('admin-authenticated-shell.js');
          if (auth.includes('canonicalizeLegacyEntry') || auth.includes('compact-control-center')) throw new Error('authenticated shell legacy residue survived');
          const worker = read('site-worker.js');
          if (!worker.includes("assetRequest(request, '/admin-shell')") || !worker.includes("'/admin-compact.js'")) throw new Error('edge canonical routing incomplete');
          for (const p of ['/control-center','/control-center.html','/control-center.css','/control-center-finance.css','/compact-control-center.css','/compact-control-center.js']) {
            if (!worker.includes(`'${p}'`)) throw new Error(`missing retired tombstone ${p}`);
          }
          NODE
      - name: Validate canonical admin build
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --check admin-authenticated-shell.js
          node --check scripts/build.mjs
          node --check scripts/admin-thin-postbuild.mjs
          node --check scripts/admin-performance-postbuild.mjs
          node scripts/validate-admin-source.mjs
          npm run build
          node --test test/admin-central-login-link.test.mjs test/admin-ai-first-navigation.test.mjs test/admin-free-ops-nav.contract.test.mjs
          for f in admin-shell.html admin-shell.css admin-finance.css admin-compact.css admin-compact.js; do test -f "dist/$f"; done
          for f in control-center.html control-center.css control-center-finance.css compact-control-center.css compact-control-center.js; do test ! -e "dist/$f"; done
          grep -Fq '<title>EKODI Admin</title>' dist/admin-shell.html
          grep -Fq 'admin-shell.css?v=' dist/admin-shell.html
          grep -Fq 'admin-compact.js' dist/admin-authenticated-shell.js
          ! grep -Fq 'compact-control-center' dist/admin-authenticated-shell.js
      - name: Commit final admin source
        run: |
          set -euo pipefail
          git restore .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No canonical migration changes found'; exit 1; }
          git commit -m 'refactor(admin): finalize canonical admin shell'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy final admin shell
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production final state
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            root=$(curl -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?final=${nonce}" || true)
            new_shell=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-shell.css?final=${nonce}" || true)
            new_finance=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-finance.css?final=${nonce}" || true)
            new_compact=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-compact.css?final=${nonce}" || true)
            new_runtime=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-compact.js?final=${nonce}" || true)
            old_html=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.html?final=${nonce}" || true)
            old_route=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center?final=${nonce}" || true)
            old_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.css?final=${nonce}" || true)
            old_fin=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-finance.css?final=${nonce}" || true)
            old_compact=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.css?final=${nonce}" || true)
            old_runtime=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.js?final=${nonce}" || true)
            title=no; grep -Fq '<title>EKODI Admin</title>' /tmp/root && title=yes || true
            echo "final admin -> root=$root new=$new_shell/$new_finance/$new_compact/$new_runtime old=$old_html/$old_route/$old_css/$old_fin/$old_compact/$old_runtime title=$title"
            if [ "$root" = 200 ] && [ "$new_shell" = 200 ] && [ "$new_finance" = 200 ] && [ "$new_compact" = 200 ] && [ "$new_runtime" = 200 ] && [ "$old_html" = 404 ] && [ "$old_route" = 404 ] && [ "$old_css" = 404 ] && [ "$old_fin" = 404 ] && [ "$old_compact" = 404 ] && [ "$old_runtime" = 404 ] && [ "$title" = yes ]; then exit 0; fi
            sleep 4
          done
          exit 1
