name: Deploy Admin True Lazy Gate

on:
  pull_request:
    paths: &admin_perf_paths
      - '.github/workflows/deploy-admin-true-lazy.yml'
      - 'package.json'
      - 'control-center.html'
      - 'control-center.css'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-demand-loader.js'
      - 'admin-perf-diagnostics.js'
      - 'admin-lazy-features.js'
      - 'admin-readable-command.js'
      - 'admin-readable-command.css'
      - 'admin-menu-layout.js'
      - 'finance-monitor.js'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'campus-actions.js'
      - 'campus-actions.css'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'site-worker.js'
      - 'scripts/build.mjs'
      - 'scripts/admin-thin-postbuild.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-thin-shell.test.mjs'
      - 'test/admin-preauth-shell.test.mjs'
      - 'test/admin-performance-hardening.test.mjs'
      - 'test/admin-readable-command.test.mjs'
  push:
    branches: [main]
    paths: *admin_perf_paths

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate fingerprinted thin shell, flat AI Ops and hard budgets
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-perf-diagnostics.js
          node --check admin-menu-layout.js
          node --check admin-lazy-features.js
          node --check admin-readable-command.js
          node --check ai-ops-admin.js
          node --check release-control-admin.js
          node --check system-health-admin.js
          node --check scripts/admin-thin-postbuild.mjs
          node --check scripts/admin-readable-command-postbuild.mjs
          node --check scripts/admin-performance-postbuild.mjs
          node --test test/admin-true-lazy.test.mjs test/admin-thin-shell.test.mjs test/admin-preauth-shell.test.mjs test/admin-performance-hardening.test.mjs test/admin-readable-command.test.mjs
          npm run build

          for asset in admin-central-handoff.js admin-authenticated-shell.js admin-demand-loader.js admin-perf-diagnostics.js compact-control-center.js compact-control-center.css device-control-admin.js device-control-admin.css ai-ops-admin.css admin-lazy-features.js release-control-admin.js system-health-admin.js; do
            test -f "dist/$asset"
          done

          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/control-center.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          grep -Fq "control-center.css?v=$version" dist/control-center.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/control-center.html
          grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' dist/control-center.html
          ! grep -Fq '<script src="control-center.js"' dist/control-center.html
          ! grep -Fq 'control-center-ops.css' dist/control-center.html
          ! grep -Fq 'control-center-finance.css' dist/control-center.html
          ! grep -Fq '<script src="ai-ops-admin.js"' dist/control-center.html
          ! grep -Fq 'WINDOWS_AGENT_URL' dist/compact-control-center.js
          ! grep -Fq 'CAMPUS_SERVICES' dist/compact-control-center.js
          ! grep -Fq 'installPolicies' dist/compact-control-center.js
          ! grep -Fq 'setTimeout(' dist/compact-control-center.js
          ! grep -Fq 'setInterval(' dist/admin-central-handoff.js
          ! grep -Fq 'setInterval(' dist/admin-authenticated-shell.js
          ! grep -Fq 'setInterval(' dist/admin-demand-loader.js
          ! grep -Fq 'setInterval(' dist/finance-monitor.js
          grep -Fq "scripts: ['ai-ops-admin.js']" dist/admin-demand-loader.js
          grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" dist/admin-demand-loader.js
          ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq "scripts: ['release-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['device-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq 'isInputPending' dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-lazy-features.js
          grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' dist/admin-lazy-features.js
          grep -Fq 'admin-readable-command.css' dist/ai-ops-admin.css
          ! grep -Fq 'admin-readable-command.css' dist/compact-control-center.css

          handoff_bytes=$(wc -c < dist/admin-central-handoff.js)
          shell_bytes=$(wc -c < dist/admin-authenticated-shell.js)
          compact_bytes=$(wc -c < dist/compact-control-center.js)
          menu_bytes=$(wc -c < dist/admin-menu-layout.js)
          demand_bytes=$(wc -c < dist/admin-demand-loader.js)
          css_bytes=$(( $(wc -c < dist/control-center.css) + $(wc -c < dist/compact-control-center.css) ))
          first_path=$((handoff_bytes + shell_bytes + compact_bytes + menu_bytes + demand_bytes))
          echo "Admin budgets: version=$version handoff=$handoff_bytes shell=$shell_bytes compact=$compact_bytes menu=$menu_bytes demand=$demand_bytes first-js=$first_path first-css=$css_bytes"
          test "$handoff_bytes" -le 9000
          test "$compact_bytes" -le 5000
          test "$menu_bytes" -le 10000
          test "$demand_bytes" -le 14000
          test "$first_path" -le 43000
          test "$css_bytes" -le 40000

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build release candidate and capture content fingerprint
        run: |
          set -euo pipefail
          npm run build
          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/control-center.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          echo "ADMIN_ASSET_VERSION=$version" >> "$GITHUB_ENV"
          grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-lazy-features.js
          grep -Fq 'admin-readable-command.css' dist/ai-ops-admin.css
          ! grep -Fq 'admin-readable-command.css' dist/compact-control-center.css

      - name: Candidate at 0%, verify shared routes, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify production fingerprint, immutable assets and flat AI Ops
        shell: bash
        run: |
          set -euo pipefail
          expected="$ADMIN_ASSET_VERSION"
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true)
            live_version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' /tmp/admin-body 2>/dev/null | head -1 | sed 's/.*?v=//' || true)
            if [[ "$root_code" != '200' || -z "$live_version" || "$live_version" != "$expected" ]]; then
              echo "Production fingerprint pending (attempt $attempt/24, expected=$expected live=${live_version:-none})."
              sleep 4
              continue
            fi

            q="?v=$live_version"
            handoff_code=$(curl -sS -D /tmp/handoff-headers -o /tmp/handoff-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-central-handoff.js$q" || true)
            demand_code=$(curl -sS -D /tmp/demand-headers -o /tmp/demand-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-demand-loader.js$q" || true)
            compact_code=$(curl -sS -D /tmp/compact-headers -o /tmp/compact-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.js$q" || true)
            perf_code=$(curl -sS -D /tmp/perf-headers -o /tmp/perf-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-perf-diagnostics.js$q" || true)
            lazy_code=$(curl -sS -D /tmp/lazy-headers -o /tmp/lazy-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-lazy-features.js$q" || true)
            ai_css_code=$(curl -sS -D /tmp/ai-css-headers -o /tmp/ai-css-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/ai-ops-admin.css$q" || true)

            if [[ "$handoff_code" == '200' && "$demand_code" == '200' && "$compact_code" == '200' && "$perf_code" == '200' && "$lazy_code" == '200' && "$ai_css_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-headers \
              && grep -Fiq 'cache-control: no-store' /tmp/admin-headers \
              && grep -Fq "control-center.css?v=$live_version" /tmp/admin-body \
              && grep -Fq "admin-central-handoff.js?v=$live_version" /tmp/admin-body \
              && ! grep -Fq '<script src="control-center.js"' /tmp/admin-body \
              && ! grep -Fq 'control-center-ops.css' /tmp/admin-body \
              && ! grep -Fq 'control-center-finance.css' /tmp/admin-body \
              && grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/handoff-headers \
              && grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/demand-headers \
              && grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/compact-headers \
              && grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/perf-headers \
              && grep -Fq 'AbortController' /tmp/handoff-body \
              && ! grep -Fq 'PerformanceObserver' /tmp/handoff-body \
              && grep -Fq 'PerformanceObserver' /tmp/perf-body \
              && grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" /tmp/demand-body \
              && ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" /tmp/demand-body \
              && grep -Fq 'deployments:' /tmp/demand-body \
              && grep -Fq 'isInputPending' /tmp/demand-body \
              && ! grep -Fq 'WINDOWS_AGENT_URL' /tmp/compact-body \
              && ! grep -Fq 'installPolicies' /tmp/compact-body \
              && [[ $(wc -c < /tmp/compact-body) -le 5000 ]] \
              && grep -Fq "actionType:'ui.change_request'" /tmp/lazy-body \
              && grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' /tmp/lazy-body \
              && grep -Fq 'admin-readable-command.css' /tmp/ai-css-body; then
              echo "Production admin verified: version=$live_version, no-store HTML, immutable fingerprinted assets, thin shell and latest flat AI Ops."
              exit 0
            fi
            echo "Production verification pending (attempt $attempt/24, version=$live_version)."
            sleep 4
          done
          echo 'Production admin verification failed.'
          exit 1
