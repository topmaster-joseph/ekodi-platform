name: Fix EKODI Root DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ekodi-root-dns.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-root-dns-fix
  cancel-in-progress: true

jobs:
  fix-root-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve EKODI Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          code=$(curl -sS -o /tmp/zone.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$api/zones?name=ekodi.kr")
          echo "zone lookup HTTP $code"
          cat /tmp/zone.json
          echo
          test "$code" = '200'
          zone_id=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/zone.json'))
          rows=d.get('result') or []
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$zone_id" || (echo 'ekodi.kr zone not found' && exit 1)
          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Proxy root and www DNS records
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          proxy_name() {
            name="$1"
            records_code=$(curl -sS -o /tmp/records.json -w '%{http_code}' "${auth[@]}" \
              "$api/zones/$ZONE_ID/dns_records?name=$name&per_page=100")
            echo "$name records HTTP $records_code"
            cat /tmp/records.json
            echo
            test "$records_code" = '200'

            mapfile -t ids < <(python - <<'PY'
          import json
          d=json.load(open('/tmp/records.json'))
          for r in d.get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
            )

            if [ "${#ids[@]}" -eq 0 ]; then
              payload=$(python -c "import json; print(json.dumps({'type':'A','name':'$name','content':'192.0.2.0','ttl':1,'proxied':True}))")
              create_code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" \
                --data "$payload" "$api/zones/$ZONE_ID/dns_records")
              echo "$name create HTTP $create_code"
              cat /tmp/create.json
              echo
              [[ "$create_code" =~ ^20[01]$ ]]
              return
            fi

            for id in "${ids[@]}"; do
              patch_code=$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH "${auth[@]}" \
                --data '{"proxied":true,"ttl":1}' "$api/zones/$ZONE_ID/dns_records/$id")
              echo "$name proxy HTTP $patch_code"
              cat /tmp/patch.json
              echo
              [[ "$patch_code" =~ ^20[01]$ ]]
            done
          }

          proxy_name 'ekodi.kr'
          proxy_name 'www.ekodi.kr'

      - name: Deploy root Worker route and Books
        run: |
          npm run deploy:site
          npm run deploy:books

      - name: Verify EKODI root and Books navigation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true)
            www_code=$(curl -L -sS -o /tmp/www.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://www.ekodi.kr/' || true)
            books_code=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
            echo "attempt=$attempt root=$root_code www=$www_code books=$books_code"
            if [[ "$root_code" =~ ^[23] ]] && [[ "$www_code" =~ ^[23] ]] && [[ "$books_code" =~ ^[23] ]] && grep -q 'href="https://ekodi.kr/"' /tmp/books.html; then
              echo 'EKODI root and Books navigation are healthy.'
              exit 0
            fi
            sleep 5
          done
          exit 1
