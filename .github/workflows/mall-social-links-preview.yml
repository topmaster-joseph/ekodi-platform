name: Preview Mall Central Social Links

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/social-links-sites-*'
    paths:
      - '.github/workflows/mall-social-links-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Mall staging branch
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-mall
          ref: staging/social-links-20260815
          path: mall
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Mall Social registry integration
        working-directory: mall
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'https://api.ekodi.kr/api/social/registry' app.js
          grep -Fq 'https://social.ekodi.kr/?org=mall' app.js
          grep -Fq 'syncMallSocialLinks' app.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - name: Deploy Mall Pages preview
        shell: bash
        working-directory: mall
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy . --project-name ekodi-mall --branch social-links-preview --commit-dirty=true 2>&1 | tee /tmp/mall-social.log
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/mall-social.log | tail -1 || true)
          test -n "$url" || exit 1
          echo "MALL_URL=$url" >> "$GITHUB_ENV"
      - name: Verify Mall preview assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            root=$(curl -L -sS -o /tmp/mall.html -w '%{http_code}' "$MALL_URL/" || true)
            script=$(curl -L -sS -o /tmp/mall.js -w '%{http_code}' "$MALL_URL/app.js" || true)
            if [ "$root" = '200' ] && [ "$script" = '200' ] \
              && grep -Fq 'ekodibizmall' /tmp/mall.html \
              && grep -Fq 'api.ekodi.kr/api/social/registry' /tmp/mall.js \
              && grep -Fq 'social.ekodi.kr/?org=mall' /tmp/mall.js; then exit 0; fi
            sleep 3
          done
          exit 1
