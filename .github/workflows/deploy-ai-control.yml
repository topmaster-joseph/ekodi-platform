name: Deploy EKODI AI Control Plane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ai-control/**'
      - 'ai-control-*.js'
      - 'scripts/ai-account-node.mjs'
      - 'wrangler.ai*.toml'
      - 'test/ai-control-platform.test.mjs'
      - 'migrations/0050_ai_control_plane.sql'
      - 'migrations/0051_ai_account_nodes.sql'
      - 'deploy/manifests/ai-control.worker.json'
      - 'docs/AI-CONTROL-PLANE-MVP.md'
      - '.github/workflows/deploy-ai-control.yml'
  push:
    branches: [main]
    paths:
      - 'ai-control/**'
      - 'ai-control-*.js'
      - 'scripts/ai-account-node.mjs'
      - 'wrangler.ai*.toml'
      - 'test/ai-control-platform.test.mjs'
      - 'migrations/0050_ai_control_plane.sql'
      - 'migrations/0051_ai_account_nodes.sql'
      - 'deploy/manifests/ai-control.worker.json'
      - 'docs/AI-CONTROL-PLANE-MVP.md'
      - '.github/workflows/deploy-ai-control.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-ai-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate AI control plane
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-control-core.js
          node --check ai-control-provider-router.js
          node --check ai-control-worker.js
          node --check ai-control/app.js
          node --check scripts/ai-account-node.mjs
          node --test test/ai-control-platform.test.mjs
          grep -Fq 'pattern = "ai.ekodi.kr"' wrangler.ai.toml
          grep -Fq 'AI_TASK_EXECUTION_ENABLED = "false"' wrangler.ai.staging.toml
          grep -Fq 'GEMINI_MODEL = "gemini-3.7-flash"' wrangler.ai.staging.toml
          grep -Fq 'humanApprovalRequired:true' ai-control-worker.js
          grep -Fq 'ai-task-allocator.yml' ai-control-worker.js
          grep -Fq '/api/node/lease' ai-control-worker.js
          grep -Fq "['login','status']" scripts/ai-account-node.mjs
          test -f migrations/0050_ai_control_plane.sql
          test -f migrations/0051_ai_account_nodes.sql
          test -f deploy/manifests/ai-control.worker.json

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development boundary
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
      - name: Verify staging behavior locally
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 dev --local --config wrangler.ai.staging.toml --port 8787 > /tmp/ai-staging-local.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 24); do
            root_code=$(curl -sS -o /tmp/ai-local.html -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8787/ || true)
            config_code=$(curl -sS -o /tmp/ai-local-config.js -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8787/config.js || true)
            status_code=$(curl -sS -o /tmp/ai-local-status.json -w '%{http_code}' --connect-timeout 2 --max-time 5 http://127.0.0.1:8787/api/status || true)
            if [[ "$root_code" == "200" && "$config_code" == "200" && "$status_code" == "200" ]] \
              && grep -Fq 'AI Control Plane' /tmp/ai-local.html \
              && grep -Fq '"taskExecutionEnabled":false' /tmp/ai-local-config.js \
              && grep -Fq '"platform":"ai-control"' /tmp/ai-local-status.json \
              && grep -Fq '"stateStore":"unavailable"' /tmp/ai-local-status.json; then
              echo 'Local staging behavior verified with execution disabled.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-staging-local.log || true
          printf 'root=%s config=%s status=%s\n' "$root_code" "$config_code" "$status_code" >&2
          cat /tmp/ai-local-config.js 2>/dev/null || true
          cat /tmp/ai-local-status.json 2>/dev/null || true
          exit 1
      - name: Deploy isolated staging Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx --yes wrangler@4.119.0 deploy --config wrangler.ai.staging.toml 2>&1)
          printf '%s\n' "$output"
          staging_url=$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' | tail -n 1 || true)
          if [[ -z "$staging_url" ]]; then
            echo 'Unable to discover the deployed workers.dev URL from Wrangler output.' >&2
            exit 1
          fi
          echo "url=$staging_url" >> "$GITHUB_OUTPUT"
      - name: Verify protected staging edge
        shell: bash
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          headers=/tmp/ai-edge-headers.txt
          body=/tmp/ai-edge-body.txt
          code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --connect-timeout 5 --max-time 20 "$STAGING_URL/" || true)
          if [[ "$code" == "200" ]] && grep -Fq 'AI Control Plane' "$body"; then
            echo "AI Control Plane staging is directly reachable at $STAGING_URL."
            exit 0
          fi
          if [[ "$code" == "302" ]] && grep -Eqi '^www-authenticate:[[:space:]]*Cloudflare-Access' "$headers"; then
            echo "AI Control Plane staging deployed at $STAGING_URL and remains protected by Cloudflare Access."
            exit 0
          fi
          printf 'Unexpected staging edge response: HTTP %s\n' "$code" >&2
          cat "$headers" >&2 || true
          cat "$body" >&2 || true
          exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_ADMIN_EMAILS: ${{ secrets.AI_CONTROL_ADMIN_EMAILS }}
      AI_GEMINI_API_KEY: ${{ secrets.AI_CONTROL_GEMINI_API_KEY }}
      AI_OPENAI_API_KEY: ${{ secrets.AI_CONTROL_OPENAI_API_KEY }}
      AI_ANTHROPIC_API_KEY: ${{ secrets.AI_CONTROL_ANTHROPIC_API_KEY }}
      AI_GITHUB_TASK_TOKEN: ${{ secrets.AI_CONTROL_GITHUB_TASK_TOKEN }}
      AI_EXTERNAL_WORKER_URL: ${{ secrets.AI_CONTROL_WORKER_URL }}
      AI_EXTERNAL_WORKER_TOKEN: ${{ secrets.AI_CONTROL_WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply additive AI ledger migrations
        run: npx --yes wrangler@4.119.0 d1 migrations apply ekodi-auth --remote --config wrangler.ai.toml
      - name: Bootstrap Worker when absent
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(npx --yes wrangler@4.119.0 deployments status --config wrangler.ai.toml --json 2>&1)
          code=$?
          set -e
          if [[ "$code" == "0" ]]; then exit 0; fi
          if ! grep -Fq 'does not exist' <<<"$output"; then printf '%s\n' "$output"; exit "$code"; fi
          npx --yes wrangler@4.119.0 deploy --config wrangler.ai.toml
      - name: Provision optional AI Control secrets
        shell: bash
        run: |
          set -euo pipefail
          put_secret(){ local name="$1" value="$2"; if [[ -n "$value" ]]; then printf '%s' "$value" | npx --yes wrangler@4.119.0 secret put "$name" --config wrangler.ai.toml; fi; }
          put_secret ADMIN_EMAILS "$AI_ADMIN_EMAILS"
          put_secret GEMINI_API_KEY "$AI_GEMINI_API_KEY"
          put_secret OPENAI_API_KEY "$AI_OPENAI_API_KEY"
          put_secret ANTHROPIC_API_KEY "$AI_ANTHROPIC_API_KEY"
          put_secret GITHUB_TASK_TOKEN "$AI_GITHUB_TASK_TOKEN"
          put_secret AI_WORKER_URL "$AI_EXTERNAL_WORKER_URL"
          put_secret AI_WORKER_TOKEN "$AI_EXTERNAL_WORKER_TOKEN"
      - name: Guarded production promotion
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/ai-control.worker.json
