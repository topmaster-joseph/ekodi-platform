name: EKODI Curated Mall · Sync Coupang Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ekodi-curated-mall-coupang-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-curated-mall-coupang-secrets-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '46aad4738793fbaca88574832a2ccc0f'
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      TARGET_WORKER: ekodi-auth-api-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Development Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'

      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COUPANG_ACCESS_KEY:-}" ] && [ -n "${COUPANG_SECRET_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Encrypted Coupang credentials are available for the curated Mall runtime.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Coupang credentials are unavailable. Development Worker secret mutation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync secrets to curated Mall Development runtime
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_ACCESS_KEY --name "$TARGET_WORKER"
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_SECRET_KEY --name "$TARGET_WORKER"
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$TARGET_WORKER" > /tmp/curated-mall-secrets.txt
          grep -Fq 'COUPANG_PARTNERS_ACCESS_KEY' /tmp/curated-mall-secrets.txt
          grep -Fq 'COUPANG_PARTNERS_SECRET_KEY' /tmp/curated-mall-secrets.txt
          echo 'Curated Mall Development secret bindings verified without exposing values.' >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: development
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      TARGET_WORKER: ekodi-auth-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COUPANG_ACCESS_KEY:-}" ] && [ -n "${COUPANG_SECRET_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Coupang credentials are unavailable. Production Worker secret mutation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync secrets to curated Mall Production runtime
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_ACCESS_KEY --name "$TARGET_WORKER"
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_SECRET_KEY --name "$TARGET_WORKER"
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$TARGET_WORKER" > /tmp/curated-mall-secrets.txt
          grep -Fq 'COUPANG_PARTNERS_ACCESS_KEY' /tmp/curated-mall-secrets.txt
          grep -Fq 'COUPANG_PARTNERS_SECRET_KEY' /tmp/curated-mall-secrets.txt
          echo 'Curated Mall Production secret bindings verified without exposing values.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report safe no-key state
        if: steps.coupang.outputs.configured != 'true'
        run: echo 'Curated Mall remains fail-closed until both encrypted Coupang credentials are available.' >> "$GITHUB_STEP_SUMMARY"
