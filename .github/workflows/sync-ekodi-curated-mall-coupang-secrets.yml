name: EKODI Curated Mall · Sync Coupang Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ekodi-curated-mall-coupang-secrets.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-curated-mall-coupang-secret-sync
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '46aad4738793fbaca88574832a2ccc0f'
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      TARGET_WORKER: ekodi-auth-api-staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$COUPANG_ACCESS_KEY" ] && [ -n "$COUPANG_SECRET_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Coupang credentials are not configured; Development secret mutation is skipped.'
          fi
      - name: Sync secrets to curated Mall Development runtime
        if: steps.coupang.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_ACCESS_KEY --name "$TARGET_WORKER"
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_SECRET_KEY --name "$TARGET_WORKER"
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$TARGET_WORKER" --format json > /tmp/secrets.json
          node - <<'NODE'
          const rows = JSON.parse(require('fs').readFileSync('/tmp/secrets.json', 'utf8'));
          const names = new Set((Array.isArray(rows) ? rows : rows.result || []).map(x => x.name));
          for (const required of ['COUPANG_PARTNERS_ACCESS_KEY','COUPANG_PARTNERS_SECRET_KEY']) {
            if (!names.has(required)) throw new Error(`Missing Worker secret binding: ${required}`);
          }
          console.log('Curated Mall Development secret bindings verified without exposing values.');
          NODE

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      TARGET_WORKER: ekodi-auth-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$COUPANG_ACCESS_KEY" ] && [ -n "$COUPANG_SECRET_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Coupang credentials are not configured; Production secret mutation is skipped.'
          fi
      - name: Sync secrets to curated Mall Production runtime
        if: steps.coupang.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_ACCESS_KEY --name "$TARGET_WORKER"
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_SECRET_KEY --name "$TARGET_WORKER"
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$TARGET_WORKER" --format json > /tmp/secrets.json
          node - <<'NODE'
          const rows = JSON.parse(require('fs').readFileSync('/tmp/secrets.json', 'utf8'));
          const names = new Set((Array.isArray(rows) ? rows : rows.result || []).map(x => x.name));
          for (const required of ['COUPANG_PARTNERS_ACCESS_KEY','COUPANG_PARTNERS_SECRET_KEY']) {
            if (!names.has(required)) throw new Error(`Missing Worker secret binding: ${required}`);
          }
          console.log('Curated Mall Production secret bindings verified without exposing values.');
          NODE
