name: EKODI Data Store Read-Only Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-store-readonly-watch.yml'
      - 'config/data-store-topology.json'
      - 'scripts/verify-provider-data-stores.mjs'
      - 'scripts/verify-live-data-stores.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-data-store-readonly-watch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify static EKODI authority constraints without release mutation
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --static-policy
      - name: Test immutable inventory and read-only monitor contracts
        run: node --test test/data-store-topology.test.mjs test/data-store-live.test.mjs
      - name: Protect production traffic before scheduled verification
        id: quota
        run: node scripts/cloudflare-production-budget.mjs --output=data-store-quota.json
      - name: Verify registered provider D1 resources and public board read path
        if: steps.quota.outputs.state == 'normal'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-provider-data-stores.mjs --output=data-store-provider-inventory.json
          node scripts/verify-live-data-stores.mjs --scope=lite --output=data-store-live-health.json
      - name: Preserve privacy-safe, read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-store-readonly-watch-${{ github.run_id }}
          path: |
            data-store-quota.json
            data-store-provider-inventory.json
            data-store-live-health.json
          if-no-files-found: warn
          retention-days: 14
