name: Apply Cloudflare staging hardening

on:
  push:
    branches:
      - ops/cloudflare-boundary-hardening-20260829

permissions:
  contents: write

concurrency:
  group: ops-cloudflare-hardening-autofix
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/cloudflare-boundary-hardening-20260829
          token: ${{ secrets.EKODI_GITHUB_ADMIN_PAT || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply idempotent staging hardening
        run: |
          node --check scripts/harden-cloudflare-staging.mjs
          node scripts/harden-cloudflare-staging.mjs
      - name: Validate generated boundary changes
        run: |
          bash -n scripts/access-aware-staging.sh
          node scripts/validate-cloudflare-development-workflows.mjs
      - name: Commit generated hardening changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No workflow changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Make Development staging Access-aware and concurrency-safe'
          git push origin HEAD:ops/cloudflare-boundary-hardening-20260829
