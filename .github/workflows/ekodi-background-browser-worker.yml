name: EKODI Background Browser Worker

on:
  workflow_call:
    inputs:
      surface_path:
        description: Canonical ekodi.kr path to inspect (single-path compatibility input)
        required: false
        type: string
        default: /
      surface_paths:
        description: Comma-separated canonical ekodi.kr paths to inspect in one isolated browser run
        required: false
        type: string
        default: ''
      surface_registry:
        description: Optional repository-relative JSON registry of canonical surfaces to add
        required: false
        type: string
        default: ''
      device_profile:
        description: Device profile
        required: false
        type: string
        default: desktop
  workflow_dispatch:
    inputs:
      surface_path:
        description: Canonical ekodi.kr path to inspect (single-path compatibility input)
        required: false
        default: /
      surface_paths:
        description: Comma-separated canonical ekodi.kr paths to inspect in one isolated browser run
        required: false
        default: ''
      surface_registry:
        description: Optional repository-relative JSON registry of canonical surfaces to add
        required: false
        default: ''
      device_profile:
        description: Device profile
        required: false
        default: desktop
        type: choice
        options:
          - compact-mobile
          - mobile-portrait
          - mobile-landscape
          - tablet
          - desktop
  pull_request:
    paths:
      - 'scripts/ekodi-background-browser-worker.mjs'
      - 'scripts/validate-background-browser-worker.mjs'
      - 'config/background-browser-worker-policy.json'
      - 'config/board-surface-verification.json'
      - 'config/surface-system-verification-policy.json'
      - 'config/autonomous-execution-fabric-policy.json'
      - 'test/background-browser-worker.test.mjs'
      - '.github/workflows/ekodi-background-browser-worker.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'scripts/ekodi-background-browser-worker.mjs'
      - 'scripts/validate-background-browser-worker.mjs'
      - 'config/background-browser-worker-policy.json'
      - 'config/surface-system-verification-policy.json'
      - 'config/autonomous-execution-fabric-policy.json'
      - 'test/background-browser-worker.test.mjs'
      - '.github/workflows/ekodi-background-browser-worker.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: ekodi-background-browser-worker-${{ github.ref }}-${{ inputs.device_profile || 'desktop' }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout current platform revision
        if: github.repository == 'topmaster-joseph/ekodi-platform'
        uses: actions/checkout@v7
      - name: Checkout canonical EKODI browser worker for external EKODI repositories
        if: github.repository != 'topmaster-joseph/ekodi-platform'
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-platform
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate native worker contract
        run: |
          node --check scripts/ekodi-background-browser-worker.mjs
          node scripts/validate-background-browser-worker.mjs
          node --test test/background-browser-worker.test.mjs

  runtime-smoke:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current platform revision
        if: github.repository == 'topmaster-joseph/ekodi-platform'
        uses: actions/checkout@v7
      - name: Checkout canonical EKODI browser worker for external EKODI repositories
        if: github.repository != 'topmaster-joseph/ekodi-platform'
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-platform
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build bounded browser task
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.surface_path || '/' }}
          # PR smoke exercises representative public, personal, and admin surfaces so shared runtime errors are attributable before merge.
          INPUT_PATHS: ${{ inputs.surface_paths || (github.event_name == 'pull_request' && '/,/my/,/admin/' || '') }}
          INPUT_REGISTRY: ${{ inputs.surface_registry || '' }}
          INPUT_DEVICE: ${{ inputs.device_profile || 'desktop' }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const fallback=String(process.env.INPUT_PATH||'/').trim();
          const requested=String(process.env.INPUT_PATHS||'').split(',').map(v=>v.trim()).filter(Boolean);
          const registryInput=String(process.env.INPUT_REGISTRY||'').trim();
          let registered=[];
          if(registryInput){
            const root=path.resolve(process.cwd());
            const resolved=path.resolve(root,registryInput);
            if(resolved!==root&&!resolved.startsWith(root+path.sep)) throw new Error('surface registry must stay inside the checked-out repository');
            const registry=JSON.parse(fs.readFileSync(resolved,'utf8').replace(/^\\uFEFF/,''));
            if(registry?.canonicalOrigin!=='https://ekodi.kr') throw new Error('surface registry canonical origin must be https://ekodi.kr');
            if(Number(registry?.maxPaths||12)>12) throw new Error('surface registry maxPaths cannot exceed worker limit 12');
            registered=(Array.isArray(registry?.surfaces)?registry.surfaces:[])
              .filter(item=>item&&item.enabled!==false)
              .map(item=>String(item.path||'').trim())
              .filter(Boolean);
          }
          const base=requested.length?requested:[fallback];
          const paths=[...new Set([...base,...registered])];
          if(paths.length>12) throw new Error('combined surface paths support at most 12 canonical paths per run');
          for(const p of paths){
            if(!p.startsWith('/')||p.startsWith('//')) throw new Error('surface path must be a canonical root-relative path');
            const u=new URL(p,'https://ekodi.kr');
            if(u.origin!=='https://ekodi.kr') throw new Error('surface path must stay on canonical ekodi.kr');
          }
          const device=String(process.env.INPUT_DEVICE||'desktop');
          const allowed=new Set(['compact-mobile','mobile-portrait','mobile-landscape','tablet','desktop']);
          if(!allowed.has(device)) throw new Error('invalid device profile');
          const shotName=(p,index)=>{
            const clean=p.replace(/^\/+|\/+$/g,'').replace(/[?#]+/g,'-').replace(/[^a-zA-Z0-9._-]+/g,'-');
            return String(index+1)+'-'+(clean||'root');
          };
          const actions=[];
          paths.forEach((p,index)=>{
            if(index>0) actions.push({type:'goto',path:p});
            actions.push({type:'snapshot'});
            actions.push({type:'screenshot',name:'surface-'+shotName(p,index),fullPage:true});
          });
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/browser-task.json',JSON.stringify({
            taskId:'gha-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT+'-'+device,
            path:paths[0],
            deviceProfile:device,
            allowMutation:false,
            timeoutMs:120000,
            actions
          },null,2));
          NODE
      - name: Run EKODI-owned isolated browser
        env:
          EKODI_BROWSER_TASK_FILE: artifacts/browser-task.json
          EKODI_BROWSER_ARTIFACT_DIR: artifacts/background-browser-worker
        run: node scripts/ekodi-background-browser-worker.mjs
      - name: Validate evidence
        shell: bash
        run: |
          set -euo pipefail
          result=$(find artifacts/background-browser-worker -name result.json -print -quit)
          test -n "$result"
          jq -e '.ok == true and .mode == "ekodi-owned-background-browser" and .canonicalOrigin == "https://ekodi.kr" and .headless == true and .ephemeralContext == true and .activeUserProfileReused == false and .hostInputInjection == false' "$result" >/dev/null
          jq -e '.allowMutation == false' "$result" >/dev/null
          jq -e '[.results[] | select(.type == "snapshot" and .horizontalOverflow == true)] | length == 0' "$result" >/dev/null
          jq -e '[.results[] | select(.type == "snapshot" and (.url | test("/admin(?:/|$)"; "i")) and ((.userAiEntryCount // 0) > 0))] | length == 0' "$result" >/dev/null
          jq -e '.pageErrors | length == 0' "$result" >/dev/null
          jq -e '.httpErrorResponses | type == "array"' "$result" >/dev/null
          jq -e '.screenshots | length >= 1' "$result" >/dev/null
          echo '## EKODI Background Browser Worker' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Result: \(.ok)\n- Final URL: \(.finalUrl)\n- Device: \(.deviceProfile) \(.viewport.width)x\(.viewport.height)\n- Headless/ephemeral: \(.headless)/\(.ephemeralContext)\n- Blocked mutations: \(.blockedMutations|length)\n- Page errors: \(.pageErrors|length)\n- HTTP 4xx/5xx responses: \(.httpErrorResponses|length)\n- Horizontal overflow snapshots: \([.results[] | select(.type == "snapshot" and .horizontalOverflow == true)] | length)\n- Screenshots: \(.screenshots|length)"' "$result" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekodi-background-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/background-browser-worker
          retention-days: 7
