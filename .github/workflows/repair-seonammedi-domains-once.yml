name: Repair SeonamMedi Domain Redirects Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-seonammedi-domains-once.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-seonammedi-domain-redirect
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify exact redirect topology config
        run: |
          set -euo pipefail
          grep -Fq 'pattern = "seonammedi.kr"' wrangler.seonammedi-redirect.toml
          grep -Fq 'pattern = "xn--3e0b8b58jw4co4mnpll3k.kr"' wrangler.seonammedi-redirect.toml
          grep -Fq "'seonammedi.kr': '/seonammedi'" legacy-redirect.js
          grep -Fq "'xn--3e0b8b58jw4co4mnpll3k.kr': '/seonammedi'" legacy-redirect.js
      - name: Deploy dedicated redirect Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.seonammedi-redirect.toml
      - name: Verify both external redirects
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            old="$1"; path="$2"; expected="$3"
            ok=false
            for attempt in $(seq 1 24); do
              rm -f /tmp/headers
              curl -sS -o /dev/null -D /tmp/headers --connect-timeout 10 --max-time 20 "https://$old$path" || true
              code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}' /tmp/headers 2>/dev/null || echo 0)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
              echo "$old$path attempt=$attempt http=$code location=$location"
              if [ "$code" = "301" ] && [ "$location" = "$expected" ]; then ok=true; break; fi
              sleep 5
            done
            [ "$ok" = true ]
          }
          verify "seonammedi.kr" "/domain-check?source=repair" "https://ekodi.kr/seonammedi/domain-check?source=repair"
          verify "xn--3e0b8b58jw4co4mnpll3k.kr" "/admin/?source=repair" "https://ekodi.kr/seonammedi/admin/?source=repair"
