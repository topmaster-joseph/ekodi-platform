name: Adopt EKODI Service Links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adopt-service-links.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Switch remaining live service links to ekodi.kr
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'ekodibook.kr': 'books.ekodi.kr',
              'ekodichurch.kr': 'church.ekodi.kr',
              'ekodilab.kr': 'lab.ekodi.kr',
          }
          for filename in ['index.html', 'scripts/monitor-lib.mjs']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify mall canonical service URL
        run: |
          grep -Fq "id:'mall',name:'에코디몰',shortName:'Mall',url:'https://ekodi.kr/mall'" ekodi-service-manifest.js

      - name: Verify application
        run: |
          npm run check
          npm test

      - name: Commit service-link migration
        run: |
          if git diff --quiet; then
            echo 'No source change required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html scripts/monitor-lib.mjs
            git commit -m 'Use canonical live service links'
            git push
          fi

      - name: Deploy updated platform site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          npm run deploy:site
