name: Validate EKODI Service Links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/monitor-lib.mjs'
      - 'ekodi-service-manifest.js'
      - 'config/ekodi-service-urls.json'
      - '.github/workflows/adopt-service-links.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/monitor-lib.mjs'
      - 'ekodi-service-manifest.js'
      - 'config/ekodi-service-urls.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject retired public domains and verify canonical Mall URL
        run: |
          set -euo pipefail
          if grep -E 'ekodibook\.kr|ekodichurch\.kr|ekodilab\.kr|mall\.ekodi\.kr|www\.mall\.ekodi\.kr' index.html scripts/monitor-lib.mjs; then
            echo 'Retired service domain found. EKODI Mall must use https://ekodi.kr/ekodibiz/mall.'
            exit 1
          fi
          grep -Fq "id:'mall',name:'에코디몰',shortName:'Mall',url:'https://ekodi.kr/ekodibiz/mall'" ekodi-service-manifest.js
          grep -Fq 'https://ekodi.kr/ekodibiz/mall' config/ekodi-service-urls.json
      - name: Validate application and deployment ownership
        run: |
          npm run check
          node --test test/business-os-platform.test.mjs test/marketing-domain-policy.test.mjs test/marketing-custom-domain.test.mjs test/cgma-domain-boundary.test.mjs test/ekodibiz-invest-business.test.mjs test/root-entry-routing.test.mjs test/common-service-auth-routing.test.mjs test/ekodi-coupang-mall.test.mjs
          node scripts/validate-deployment-guardrails.mjs
