name: Verify EKODI Mission Media Native Chromium Synthetic UI

on:
  pull_request:
    paths:
      - 'scripts/verify-ekodimission-media-moderation-native-ui-e2e.mjs'
      - 'test/ekodimission-media-native-browser-ui-contract.test.mjs'
      - '.github/workflows/verify-ekodimission-media-native-ui-e2e.yml'
      - '.github/workflows/verify-ekodimission-admin-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-media-synthetic-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-synthetic-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID || '46aad4738793fbaca88574832a2ccc0f' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Contract and JS syntax
        run: |
          node --check scripts/verify-ekodimission-media-moderation-native-ui-e2e.mjs
          node --test test/ekodimission-media-native-browser-ui-contract.test.mjs
      - name: Respect EKODI production quota
        id: quota
        run: node scripts/cloudflare-production-budget.mjs --output=cloudflare-mission-media-quota.json
      - name: Install native Chromium
        if: steps.quota.outputs.skip_nonessential != 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify synthetic moderation UI on production GET assets
        if: steps.quota.outputs.skip_nonessential != 'true'
        run: node scripts/verify-ekodimission-media-moderation-native-ui-e2e.mjs
      - name: Surface honest execution disposition
        if: always()
        run: |
          if [ -f artifacts/ekodimission-media-native-ui-e2e/report.json ]; then
            jq -r '"Mission synthetic UI, passed=\(.passed), mode=production GET assets plus mocked auth/mutations"' artifacts/ekodimission-media-native-ui-e2e/report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Synthetic browser UI did not run: check quota/install/contract gates; no completion claim.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekodimission-media-native-ui-e2e
          path: artifacts/ekodimission-media-native-ui-e2e/
          if-no-files-found: warn
          retention-days: 7
