name: EKODI site monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekodi-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - name: Install workspaces
        run: pnpm install --frozen-lockfile
      - name: Verify monitor
        run: pnpm --filter @ekodi/site-monitor test
      - name: Check configured EKODI services
        run: pnpm monitor
      - name: Publish latest status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/public/monitor-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update EKODI monitoring status"
          git push
