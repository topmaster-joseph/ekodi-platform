name: EKODI site monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ekodi-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify monitor registry and logic
        run: |
          node --check scripts/monitor-lib.mjs
          node --test test/monitor.test.mjs
      - name: Check EKODI services, shared infrastructure and Marketing AI tenants
        run: npm run monitor
      - name: Publish latest status without deployment cascade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update EKODI monitoring status [skip ci]"
          git push
