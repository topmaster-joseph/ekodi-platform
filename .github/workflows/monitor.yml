name: EKODI site monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify monitor registry and logic
        run: |
          node --check scripts/monitor-lib.mjs
          node --check scripts/monitor.mjs
          node --test test/monitor.test.mjs
      - name: Check EKODI services, shared infrastructure and Marketing AI tenants
        run: npm run monitor
      - name: Preserve latest status without repository writes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ekodi-monitor-status
          path: monitor-status.json
          if-no-files-found: warn
          retention-days: 7
