name: SeonamMedi News Monitor (Runner Egress)

# Google News / Bing reject Cloudflare Workers egress (HTTP 503 / non-RSS),
# so the hourly SeonamMedi monitor also runs from a GitHub-hosted runner and
# writes to the same ekodi-auth D1. Publication policy is unchanged.
# GitHub throttles schedules on this repository (hourly crons fire every
# 3-5h) and merges pushed with GITHUB_TOKEN do not emit push events, so every
# completed CI run also wakes the runner (workflow_run always executes the
# default-branch workflow and code). The runner skips when a successful
# monitor run happened within the last 40 minutes.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seonammedi-news-monitor-runner
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: Naver Search API (developers.naver.com). Unset = Naver skipped.
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run SeonamMedi monitor from runner egress
        run: node scripts/seonammedi-monitor-runner.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
