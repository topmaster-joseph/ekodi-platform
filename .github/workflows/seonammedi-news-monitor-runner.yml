name: SeonamMedi News Monitor (Runner Egress)

# Google News / Bing reject Cloudflare Workers egress (HTTP 503 / non-RSS),
# so the hourly SeonamMedi monitor also runs from a GitHub-hosted runner and
# writes to the same ekodi-auth D1. Publication policy is unchanged.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seonammedi-news-monitor-runner
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: Naver Search API (developers.naver.com). Unset = Naver skipped.
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run SeonamMedi monitor from runner egress
        run: node scripts/seonammedi-monitor-runner.mjs
