name: Verify Health Capacity Production
on:
  pull_request:
    paths:
      - '.github/workflows/verify-health-capacity-production.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify production Health capacity evidence
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.ekodi.kr'
          ok=0
          for attempt in $(seq 1 24); do
            probe="?capacity-proof=${GITHUB_RUN_ID}-${attempt}"
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/$probe" || true)
            js_code=$(curl -sS -o /tmp/health.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/system-health-admin.js$probe" || true)
            css_code=$(curl -sS -o /tmp/health.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/system-health-admin.css$probe" || true)
            if [[ "$root_code" == '200' && "$js_code" == '200' && "$css_code" == '200' ]] \
              && grep -Fq 'ekodiCapacityEvidence' /tmp/health.js \
              && grep -Fq 'CAPACITY EVIDENCE' /tmp/health.js \
              && grep -Fq 'maxVerifiedConcurrency: 20' /tmp/health.js \
              && grep -Fq '다음 단계 50+는 아직 미검증' /tmp/health.js \
              && grep -Fq 'actions/runs/32541529236' /tmp/health.js \
              && grep -Fq '최대 20명이라는 뜻이 아닙니다' /tmp/health.js \
              && grep -Fq '.health-capacity-evidence' /tmp/health.css \
              && grep -Fq '.health-capacity-table' /tmp/health.css; then
              echo "Production Health capacity evidence verified on attempt $attempt."
              ok=1
              break
            fi
            echo "Capacity evidence not promoted yet (attempt $attempt/24, root=$root_code js=$js_code css=$css_code)."
            sleep 5
          done
          test "$ok" -eq 1
