name: Cloudflare Usage Root Cause Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main, chatgpt/cloudflare-usage-v2-livecheck-20260905]
    paths:
      - "scripts/diagnose-cloudflare-usage.mjs"
      - "scripts/cloudflare-usage-product-metrics.mjs"
      - "traffic-intelligence.js"
      - ".github/workflows/cloudflare-usage-root-cause-diagnose.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-usage-root-cause-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEVELOPMENT_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-cloudflare-usage.mjs
          node --check scripts/cloudflare-usage-product-metrics.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DEVELOPMENT_API_TOKEN"
          test "$CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          ! grep -Eq '(wrangler[[:space:]].*(deploy|delete)|curl[^\n]*-X[[:space:]]*(PUT|POST|PATCH|DELETE)[^\n]*/workers/scripts)' scripts/diagnose-cloudflare-usage.mjs scripts/cloudflare-usage-product-metrics.mjs

      - name: Diagnose five Cloudflare usage root causes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/diagnose-cloudflare-usage.mjs \
            "$RUNNER_TEMP/cloudflare-usage-root-cause.json" \
            "$RUNNER_TEMP/cloudflare-usage-root-cause.md"
          cat "$RUNNER_TEMP/cloudflare-usage-root-cause.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Livecheck sanitized D1 query insights
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 insights ekodi-auth --config wrangler.api.toml --time-period=3h --sort-type=sum --sort-by=reads --limit=100 --json > "$RUNNER_TEMP/d1-insights.json"
          node scripts/livecheck-d1-insights-summary.mjs "$RUNNER_TEMP/d1-insights.json"

      - name: Preserve diagnostic report
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-usage-root-cause-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloudflare-usage-root-cause.json
            ${{ runner.temp }}/cloudflare-usage-root-cause.md
          retention-days: 14
