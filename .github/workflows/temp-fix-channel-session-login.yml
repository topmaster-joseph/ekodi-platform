name: Temp Fix Channel Session Login

on:
  push:
    branches:
      - ai/chatgpt/fix-channel-session-login-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/chatgpt/fix-channel-session-login-20260917
          fetch-depth: 0
      - name: Apply exact one-line patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='workspace-admin-page.js';
          const src=fs.readFileSync(p,'utf8');
          const from="if(!token)return loginMailPanel('채널 연결에는 운영공간 로그인이 필요합니다.');";
          const to="if(!token)return loginPanel('채널 연결에는 운영공간 로그인이 필요합니다.');";
          const count=src.split(from).length-1;
          if(count!==1) throw new Error(`expected exactly one target, found ${count}`);
          const out=src.replace(from,to);
          if(out.includes(from)) throw new Error('old fallback still present');
          fs.writeFileSync(p,out);
          NODE
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/temp-fix-channel-session-login.yml' >/dev/null && { echo 'Expected source change missing'; exit 1; } || true
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workspace-admin-page.js
          git commit -m 'fix(admin): use workspace login for channel session expiry'
          git push origin HEAD:ai/chatgpt/fix-channel-session-login-20260917
