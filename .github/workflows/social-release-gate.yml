name: EKODI Social Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/social-*'
    paths:
      - 'social/**'
      - 'social-worker.js'
      - 'wrangler.social*.toml'
      - 'config/ecosystem-services.json'
      - 'platform-boundaries.json'
      - 'scripts/build.mjs'
      - '.github/workflows/social-release-gate.yml'
  pull_request:
    paths:
      - 'social/**'
      - 'social-worker.js'
      - 'wrangler.social*.toml'
      - 'config/ecosystem-services.json'
      - 'platform-boundaries.json'
      - 'scripts/build.mjs'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Social and shared registry changes
        run: |
          set -euo pipefail
          node --check social-worker.js
          node --check social/app.js
          node --check scripts/build.mjs
          node scripts/validate-platform-boundaries.mjs
          node -e "const r=JSON.parse(require('fs').readFileSync('config/ecosystem-services.json','utf8')); const m=r.services.find(x=>x.id==='mission'); if(!m||m.url!=='https://ekodi.kr/ekodimission') throw new Error('mission canonical registry invalid'); if(m.homepage===true&&m.productionVerified!==true) throw new Error('unverified mission cannot appear on homepage'); const c=r.services.find(x=>x.id==='community'); if(!c||c.name!=='커뮤니티'||c.url!=='https://ekodi.kr/community') throw new Error('community canonical registry invalid'); const s=r.services.find(x=>x.id==='social'); if(!s) throw new Error('social registry missing'); if(s.homepage===true&&s.productionVerified!==true) throw new Error('unverified social cannot appear on homepage'); if(s.productionVerified===true&&s.homepage!==true) throw new Error('verified social should be promoted or explicitly rolled back');"
      - name: Build root without regressing current features
        run: |
          set -euo pipefail
          node scripts/build.mjs
          grep -Fq 'data-ekodi-service-registry="v1"' dist/index.html
          grep -Fq '커뮤니티' dist/index.html
          test -f dist/domains-hub.js
          test -f dist/books-finance-admin.js
