name: Validate Marketing Tenant Addressing

on:
  pull_request:
    paths:
      - 'config/marketing-tenants.json'
      - 'config/domain-site-architecture.json'
      - 'config/domain-site-principle.approved.json'
      - '.github/workflows/configure-marketing-tenant-domains.yml'
      - 'test/marketing-domain-policy.test.mjs'
  push:
    branches: [main]
    paths:
      - 'config/marketing-tenants.json'
      - 'config/domain-site-architecture.json'
      - 'config/domain-site-principle.approved.json'
      - '.github/workflows/configure-marketing-tenant-domains.yml'
      - 'test/marketing-domain-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-tenant-addressing
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate approved domain/site principle
        run: node scripts/validate-domain-site-architecture.mjs
      - name: Validate Marketing AI tenant addressing
        run: |
          set -euo pipefail
          node --test test/marketing-domain-policy.test.mjs
          python - <<'PY'
          import json, re
          from pathlib import Path

          cfg=json.loads(Path('config/marketing-tenants.json').read_text())
          assert cfg['version'] >= 5
          assert cfg['canonicalPattern'] == 'https://ekodi.kr/ai/marketing/{tenant}/'
          assert cfg['runtimePattern'] == 'https://marketing.ekodi.kr/{tenant}/'
          assert cfg['policy']['tenantAddressing'] == 'root-ai-path'
          assert cfg['policy']['newTenantSubdomainCreation'] is False
          seen=set()
          for row in cfg['tenants']:
              tenant=row['tenant']
              assert re.fullmatch(r'[a-z0-9][a-z0-9-]*', tenant), tenant
              assert tenant not in seen, tenant
              assert row['canonicalPath'] == f'/ai/marketing/{tenant}/', row
              assert row['canonicalUrl'] == f"https://ekodi.kr{row['canonicalPath']}", row
              assert row['runtimePath'].startswith('/') and row['runtimePath'].endswith('/'), row
              assert row['runtimeUrl'] == f"https://marketing.ekodi.kr{row['runtimePath']}", row
              assert f'{tenant}.ai.ekodi.kr' in row.get('legacyDomains', []), row
              seen.add(tenant)
          print('Validated root-AI-path Marketing tenants:', ', '.join(sorted(seen)))
          PY
      - name: Confirm legacy tenant domains are compatibility-only
        run: echo 'No tenant DNS mutation job exists in this workflow; runtime and legacy domains remain compatibility aliases.'
