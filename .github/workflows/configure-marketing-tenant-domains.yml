name: Configure Marketing Tenant Domains

on:
  pull_request:
    paths:
      - 'config/marketing-tenants.json'
      - '.github/workflows/configure-marketing-tenant-domains.yml'
      - 'test/marketing-domain-policy.test.mjs'
  push:
    branches: [main]
    paths:
      - 'config/marketing-tenants.json'
      - '.github/workflows/configure-marketing-tenant-domains.yml'
      - 'test/marketing-domain-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-tenant-domains
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate canonical Marketing user routes and compatibility aliases
        run: |
          set -euo pipefail
          node --test test/marketing-domain-policy.test.mjs
          node scripts/validate-user-surfaces.mjs
          python - <<'PY'
          import json, re
          from pathlib import Path

          cfg = json.loads(Path('config/marketing-tenants.json').read_text())
          assert cfg['version'] >= 4
          assert cfg['domainPattern'] == '{tenant}.ai.ekodi.kr'
          assert cfg['domainPatternRole'] == 'legacy_execution_alias_only'
          assert cfg['canonicalPattern'] == 'https://ekodi.kr/{public_namespace}/marketing'
          assert cfg['namespace']['domain'] == 'ai.ekodi.kr'
          assert cfg['namespace']['aiGateway'] == 'ai.ekodi.kr'
          assert cfg['namespace']['engineDomain'] == 'marketing.ekodi.kr'
          assert cfg['namespace']['productHub'] == 'https://ekodi.kr/ekodibiz/marketing-ai'
          assert cfg['namespace']['providerTopologyVisibleToOrdinaryUsers'] is False
          assert cfg['hub']['domain'] == 'marketing.ekodi.kr'
          assert cfg['hub']['project'] == 'marketing-ai'
          assert cfg['hub']['role'] == 'common_engine'
          assert cfg['hub']['canonicalProductUrl'] == 'https://ekodi.kr/ekodibiz/marketing-ai'
          assert cfg['policy']['storeBasic']['dedicatedEkodiDomain'] is False
          assert cfg['policy']['storePlus']['dedicatedEkodiDomain'] is False
          assert cfg['policy']['storePro']['dedicatedEkodiDomain'] is False
          assert cfg['policy']['storePro']['customDomain'] is True
          assert cfg['policy']['customDomain']['registrationIncluded'] is False

          canonical = {
              'jadam': 'https://ekodi.kr/jadam/marketing',
              'pizzamaru': 'https://ekodi.kr/pizzamaru/marketing',
              'yogurt': 'https://ekodi.kr/yogurt/marketing',
              'cgma': 'https://ekodi.kr/cgma/marketing',
          }
          seen_tenants = set()
          seen_aliases = set()
          for row in cfg['tenants']:
              tenant = row['tenant']
              alias = row['domain']
              assert re.fullmatch(r'[a-z0-9][a-z0-9-]*', tenant), tenant
              assert alias == f'{tenant}.ai.ekodi.kr', alias
              assert row['domainRole'] == 'legacy_execution_alias', row
              assert row['executionAlias'] == alias, row
              assert row['canonicalUrl'] == canonical[tenant], row
              assert row['project'], row
              assert row.get('name'), row
              assert tenant not in seen_tenants, tenant
              assert alias not in seen_aliases, alias
              seen_tenants.add(tenant)
              seen_aliases.add(alias)

          biz = next(row for row in cfg['internalConsumers'] if row['id'] == 'ekodibiz')
          assert biz['entryDomain'] == 'ekodi.kr'
          assert biz['entryUrl'] == 'https://ekodi.kr/ekodibiz/marketing-ai'
          assert biz['engineUrl'] == 'https://marketing.ekodi.kr/'
          print('Validated canonical Marketing routes and compatibility aliases for:', ', '.join(sorted(seen_tenants)))
          PY

  apply:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Verify existing compatibility aliases without mutating Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/marketing-aliases.tsv
          import json
          cfg=json.load(open('config/marketing-tenants.json'))
          for row in cfg['tenants']:
              print('\t'.join([row['domain'], row['name'], row.get('landingPath', '/')]))
          PY

          failed=0
          while IFS=$'\t' read -r domain needle landing; do
            [ -n "$domain" ] || continue
            meta=$(curl -L -sS -o /tmp/marketing-alias.html -w '%{http_code}\t%{url_effective}' --connect-timeout 6 --max-time 20 "https://$domain/" || true)
            code="${meta%%$'\t'*}"
            effective="${meta#*$'\t'}"
            echo "$domain compatibility_alias http=$code effective=$effective"
            if [ "$code" != '200' ]; then failed=1; continue; fi
            if ! grep -Fq "$needle" /tmp/marketing-alias.html; then
              echo "Compatibility alias content marker missing: $domain"
              failed=1
            fi
            if [ "$landing" != '/' ] && [[ "$effective" != "https://$domain$landing"* ]]; then
              echo "Compatibility alias did not preserve landing path: $domain -> $landing"
              failed=1
            fi
          done < /tmp/marketing-aliases.tsv

          if [ "$failed" -ne 0 ]; then
            echo 'One or more declared compatibility aliases are unavailable. No DNS mutation was attempted.'
            exit 1
          fi
          echo 'Compatibility aliases verified. This workflow performs no domain attach or DNS write.'
