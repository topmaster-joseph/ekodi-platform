name: Cleanup Mall Legacy Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-mall-legacy-domain.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Remove obsolete custom domain and DNS record
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          old_domain='mall''.''ekodi.kr'
          project='ekodi-mall'

          code=$(curl -sS -o /tmp/domain-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" \
            "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$old_domain")
          if [ "$code" = "200" ] || [ "$code" = "404" ]; then
            echo "Pages custom domain absent/removed (HTTP $code)"
          else
            cat /tmp/domain-delete.json
            echo "Failed to remove Pages custom domain (HTTP $code)"
            exit 1
          fi

          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          test -n "$zone_id" || (echo 'ekodi.kr zone not accessible' && exit 1)

          records=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$old_domain")
          ids=$(printf '%s' "$records" | python -c "import sys,json; d=json.load(sys.stdin); print(' '.join(r['id'] for r in d.get('result',[])))")
          for id in $ids; do
            curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/tmp/dns-delete.json
            python -c "import json; d=json.load(open('/tmp/dns-delete.json')); assert d.get('success') is True"
          done
          echo "Legacy DNS records removed: ${ids:-none}"

      - name: Verify canonical mall URL
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 https://ekodi.kr/mall)
          echo "canonical_http=$code"
          case "$code" in 2*|3*) exit 0 ;; *) exit 1 ;; esac
