name: Validate Social Channel Gateway

# Canonical integration lives in customer-entry-worker.js; Mission Control remains the protected production entry.
on:
  pull_request:
    paths:
      - 'social-channel-gateway.js'
      - 'social-content-ai.js'
      - 'social-attribution-api.js'
      - 'customer-entry-worker.js'
      - 'social-admin.js'
      - 'wrangler.api.toml'
      - 'migrations/0048_social_channel_gateway.sql'
      - 'test/social-channel-gateway.test.mjs'
      - '.github/workflows/social-channel-gateway.yml'
  push:
    branches:
      - 'feat/direct-social-channel-gateway'
    paths:
      - 'social-channel-gateway.js'
      - 'social-content-ai.js'
      - 'social-attribution-api.js'
      - 'customer-entry-worker.js'
      - 'social-admin.js'
      - 'wrangler.api.toml'
      - 'migrations/0048_social_channel_gateway.sql'
      - 'test/social-channel-gateway.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse social runtime
        run: |
          node --check social-channel-gateway.js
          node --check social-content-ai.js
          node --check social-attribution-api.js
          node --check customer-entry-worker.js
          node --check social-admin.js
      - name: Run social unit tests
        run: node --test test/social-channel-gateway.test.mjs
      - name: Validate deployment guardrails
        run: npm run validate:deployments
