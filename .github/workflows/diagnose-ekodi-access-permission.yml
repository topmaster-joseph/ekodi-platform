name: Configure EKODI Mall staging Access

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/diagnose-ekodi-access-permission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    env:
      CF_ACCOUNT_ID: "46aad4738793fbaca88574832a2ccc0f"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      STAGING_HOST: ekodi-mall-api-staging.ekodi-development.workers.dev
    steps:
      - name: Ensure narrow Access bypasses
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const account = process.env.CF_ACCOUNT_ID;
          const token = process.env.CF_API_TOKEN;
          const host = process.env.STAGING_HOST;
          const api = 'https://api.cloudflare.com/client/v4';

          async function cf(path, options = {}) {
            const headers = {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              ...(options.headers || {})
            };
            const response = await fetch(`${api}${path}`, { ...options, headers });
            const text = await response.text();
            let body = {};
            try { body = JSON.parse(text); } catch {}
            if (!response.ok || body.success !== true) {
              const errors = Array.isArray(body.errors) ? body.errors.map(e => `${e.code || 'unknown'}:${e.message || ''}`).join(' | ') : 'none';
              throw new Error(`Cloudflare API failed status=${response.status} errors=${errors}`);
            }
            return body;
          }

          const specs = [
            {
              name: 'EKODI Mall staging health bypass',
              uri: `${host}/health`
            },
            {
              name: 'EKODI Mall staging public API bypass',
              uri: `${host}/api/public/*`
            }
          ];

          const listed = await cf(`/accounts/${account}/access/apps?per_page=100`);
          const apps = Array.isArray(listed.result) ? listed.result : [];

          for (const spec of specs) {
            const existing = apps.find(app =>
              Array.isArray(app.destinations) && app.destinations.some(d => d && d.type === 'public' && d.uri === spec.uri)
            );
            if (existing) {
              const hasBypass = Array.isArray(existing.policies) && existing.policies.some(policy =>
                policy && policy.decision === 'bypass' && Array.isArray(policy.include) && policy.include.some(rule => rule && Object.prototype.hasOwnProperty.call(rule, 'everyone'))
              );
              if (!hasBypass) {
                throw new Error(`Existing Access app for ${spec.uri} is not an Everyone bypass; refusing to weaken or overwrite it.`);
              }
              console.log(`Access bypass already correct: ${spec.uri}`);
              continue;
            }

            const created = await cf(`/accounts/${account}/access/apps`, {
              method: 'POST',
              body: JSON.stringify({
                type: 'self_hosted',
                name: spec.name,
                destinations: [{ type: 'public', uri: spec.uri }],
                policies: [{
                  name: `${spec.name} policy`,
                  decision: 'bypass',
                  include: [{ everyone: {} }]
                }]
              })
            });
            console.log(`Created Access bypass: ${spec.uri} app=${created.result?.id || 'created'}`);
          }
          NODE

      - name: Verify public paths and protected remainder
        shell: bash
        run: |
          set -euo pipefail
          base="https://${STAGING_HOST}"

          check_public() {
            path="$1"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "${base}${path}")
            echo "public_probe path=${path%%\?*} status=$code"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for public staging path ${path%%\?*}; got $code" >&2
              exit 1
            fi
          }

          check_public '/health'
          check_public '/api/public/fees'
          check_public '/api/public/products?limit=1'

          headers=$(mktemp)
          code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "${base}/api/operations/__access_probe__")
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
          rm -f "$headers"
          safe_location=${location%%\?*}
          echo "protected_probe status=$code redirect=${safe_location:-none}"
          if [ "$code" != "302" ] || [[ "$safe_location" != *"cloudflareaccess.com"* ]]; then
            echo "Expected non-public staging path to remain protected by Cloudflare Access." >&2
            exit 1
          fi
