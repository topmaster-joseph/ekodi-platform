name: Diagnose EKODI Access permission

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/diagnose-ekodi-access-permission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    env:
      CF_ACCOUNT_ID: "46aad4738793fbaca88574832a2ccc0f"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Check Access apps API permission
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/access-apps.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/access/apps" || true)
          echo "access_apps_status=$code"
          if [ "$code" = "200" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/access-apps.json','utf8'));
          for (const app of (j.result||[])) {
            const d=String(app.domain||'');
            if (d.includes('ekodi-development.workers.dev') || d.includes('ekodi-mall-api-staging')) {
              console.log(`matching_access_app=${app.id} domain=${d}`);
            }
          }
          NODE
          fi
