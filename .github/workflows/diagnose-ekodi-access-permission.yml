name: Diagnose EKODI Access permission

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/diagnose-ekodi-access-permission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    env:
      CF_ACCOUNT_ID: "46aad4738793fbaca88574832a2ccc0f"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Probe Access write permission without creating resources
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/access-write.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"type":"not_a_valid_type"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/access/apps" || true)
          echo "access_write_probe_http_status=$code"
          node - <<'NODE'
          const fs=require('fs');
          let j={};
          try { j=JSON.parse(fs.readFileSync('/tmp/access-write.json','utf8')); } catch {}
          const errors=Array.isArray(j.errors)?j.errors:[];
          console.log(`access_write_probe_success=${j.success === true}`);
          console.log(`access_write_probe_error_codes=${errors.map(e=>String(e.code||'unknown')).join(',')||'none'}`);
          console.log(`access_write_probe_error_messages=${errors.map(e=>String(e.message||'').replace(/[\r\n]/g,' ')).join(' | ')||'none'}`);
          if (j.success === true) {
            console.error('Unexpected resource creation; refusing to continue.');
            process.exit(1);
          }
          NODE
