name: Diagnose EKODI Access permission

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/diagnose-ekodi-access-permission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    env:
      CF_ACCOUNT_ID: "46aad4738793fbaca88574832a2ccc0f"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Verify Access API response safely
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/access-apps.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/access/apps?per_page=100" || true)
          echo "access_apps_http_status=$code"
          node - <<'NODE'
          const fs=require('fs');
          let j={};
          try { j=JSON.parse(fs.readFileSync('/tmp/access-apps.json','utf8')); } catch {}
          const errors=Array.isArray(j.errors)?j.errors:[];
          console.log(`access_api_success=${j.success === true}`);
          console.log(`access_error_codes=${errors.map(e=>String(e.code||'unknown')).join(',')||'none'}`);
          console.log(`access_error_messages=${errors.map(e=>String(e.message||'').replace(/[\r\n]/g,' ')).join(' | ')||'none'}`);
          const apps=Array.isArray(j.result)?j.result:[];
          console.log(`access_apps_count=${apps.length}`);
          for (const app of apps) {
            const id=String(app.id||'');
            const name=String(app.name||'').replace(/[\r\n]/g,' ');
            const domain=String(app.domain||'').replace(/[\r\n]/g,' ');
            const type=String(app.type||'');
            const destinations=Array.isArray(app.destinations)?app.destinations.map(d=>`${d.type||''}:${d.worker_id||''}`).join(','):'none';
            console.log(`access_app id=${id} type=${type} name=${name} domain=${domain} destinations=${destinations}`);
          }
          NODE
