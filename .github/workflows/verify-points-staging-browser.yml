name: Verify Points Staging (EKODI Browser)

# Real-screen verification of /my/points (member evidence claim) and the admin
# points console on the isolated DEVELOPMENT staging hosts (#6739). Ephemeral
# fixtures, member and admin session are created here and always revoked.
# Never targets production: fixed development project ref and staging origins.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-points-staging-browser
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      DEV_REF: lxcxwbdwwojjkgybbqii
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_STAGING_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_STAGING_CLIENT_SECRET }}
      ADMIN_STAGING: https://ekodi-admin-staging.ekodi-development.workers.dev
      MY_STAGING: https://ekodi-my-staging.ekodi-development.workers.dev
      POINTS_E2E_RUN: ${{ github.run_id }}
      POINTS_E2E_SITE: e2e-${{ github.run_id }}
      EKODI_BROWSER_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Preflight (credentials present, development-only targets)
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN SUPABASE_ACCESS_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (CF_ACCESS_* = repository secrets CF_ACCESS_STAGING_CLIENT_ID / CF_ACCESS_STAGING_CLIENT_SECRET)"
            exit 1
          fi
          test "$DEV_REF" = lxcxwbdwwojjkgybbqii
          node --check scripts/verify-points-staging-browser.mjs
          node --test test/ekodi-browser-staging-origin.test.mjs

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create ephemeral development fixtures, member and admin session
        shell: bash
        run: |
          set -euo pipefail
          sql(){ jq -nc --arg q "$1" '{query:$q}' | curl -fsS --retry 2 -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @- "https://api.supabase.com/v1/projects/$DEV_REF/database/query"; }
          echo "FIXTURES_CREATED=1" >> "$GITHUB_ENV"
          sql "insert into public.ekodi_point_sites(site_id,display_name,enabled,daily_cap) values('$POINTS_E2E_SITE','E2E 검증 사이트',true,100);
               insert into public.ekodi_point_rules(site_id,rule_id,points,daily_cap,daily_events,enabled) values('$POINTS_E2E_SITE','content',5,25,5,true);
               insert into public.ekodi_point_evidence_adapters(site_id,rule_id,adapter,trust,member_claimable,enabled) values('$POINTS_E2E_SITE','content','content_approval','verified',true,true);" >/dev/null

          # Existing owner-created development secret key, used transiently and masked.
          keys="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$DEV_REF/api-keys?reveal=true")"
          key="$(printf '%s' "$keys" | jq -r '[.[]|select(.type=="secret" and .name=="ekodi_points_control_staging")][0].api_key // empty')"
          case "$key" in sb_secret_*) ;; *) echo '::error::development secret key ekodi_points_control_staging not found'; exit 1;; esac
          echo "::add-mask::$key"
          auth="https://$DEV_REF.supabase.co/auth/v1/admin"
          email="points-e2e-${POINTS_E2E_RUN}@example.com"
          user="$(jq -nc --arg e "$email" '{email:$e,email_confirm:true}' | curl -fsS -X POST -H "apikey: $key" -H 'Content-Type: application/json' --data @- "$auth/users")"
          uid="$(printf '%s' "$user" | jq -r '.id')"
          [[ "$uid" =~ ^[0-9a-f-]{36}$ ]]
          echo "E2E_MEMBER_ID=$uid" >> "$GITHUB_ENV"
          sql "with p as (insert into public.people(ekodi_id,display_name) values('EKD-E2E-$POINTS_E2E_RUN','E2E 검증 회원') returning id)
               insert into public.login_identities(person_id,auth_user_id,provider,provider_subject,email,status)
               select id,'$uid','e2e','e2e-$POINTS_E2E_RUN','$email','active' from p;" >/dev/null
          for device in DESKTOP MOBILE; do
            link="$(jq -nc --arg e "$email" '{type:"magiclink",email:$e}' | curl -fsS -X POST -H "apikey: $key" -H 'Content-Type: application/json' --data @- "$auth/generate_link")"
            hash="$(printf '%s' "$link" | jq -r '.hashed_token // .properties.hashed_token // empty')"
            [ -n "$hash" ]
            echo "::add-mask::$hash"
            echo "POINTS_E2E_MEMBER_HASH_${device}=$hash" >> "$GITHUB_ENV"
          done

          # Staging admin session in the isolated staging D1 (never production).
          cf(){ curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          db="$(cf "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=ekodi-auth-staging" | jq -r '[.result[]|select(.name=="ekodi-auth-staging")][0].uuid // empty')"
          [ -n "$db" ]
          d1(){ jq -nc --arg s "$1" '{sql:$s}' | cf -X POST --data @- "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query"; }
          now="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"; expires="$(date -u -d '+20 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')"
          admin_email="points-e2e-${POINTS_E2E_RUN}@example.com"
          # Ephemeral admin with unusable credentials (password login is disabled; values are not hashes).
          d1 "INSERT INTO admins (email,password_hash,password_salt,birth_hash,birth_salt,role,created_at) VALUES ('$admin_email','disabled','disabled','disabled','disabled','super_admin','$now')" >/dev/null
          echo "E2E_D1=$db" >> "$GITHUB_ENV"; echo "E2E_ADMIN_EMAIL=$admin_email" >> "$GITHUB_ENV"
          admin_id="$(d1 "SELECT id FROM admins WHERE email='$admin_email'" | jq -r '.result[0].results[0].id')"
          [[ "$admin_id" =~ ^[0-9]+$ ]]
          token="$(openssl rand -hex 32)"; token_hash="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$token"
          d1 "INSERT INTO sessions (token_hash,admin_id,expires_at,created_at) VALUES ('$token_hash',$admin_id,'$expires','$now')" >/dev/null
          echo "E2E_TOKEN_HASH=$token_hash" >> "$GITHUB_ENV"
          session="$(curl -fsS -H "cf-access-client-id: $CF_ACCESS_CLIENT_ID" -H "cf-access-client-secret: $CF_ACCESS_CLIENT_SECRET" -H "Authorization: Bearer $token" "$ADMIN_STAGING/api/session")"
          printf '%s' "$session" | jq -e '.role=="super_admin"' >/dev/null
          echo "POINTS_E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo 'Ephemeral development fixtures, member links and staging admin session ready.'

      - name: EKODI browser — member evidence claim (My staging)
        env:
          POINTS_E2E_TARGET: member
          EKODI_BROWSER_ORIGIN: ${{ env.MY_STAGING }}
        run: node scripts/verify-points-staging-browser.mjs

      - name: EKODI browser — admin points console (admin staging)
        env:
          POINTS_E2E_TARGET: admin
          EKODI_BROWSER_ORIGIN: ${{ env.ADMIN_STAGING }}
        run: node scripts/verify-points-staging-browser.mjs

      - name: Confirm claims reached the development database
        shell: bash
        run: |
          set -euo pipefail
          q="select count(*)::int as n from public.ekodi_point_evidence_claims where site_id='$POINTS_E2E_SITE' and status='pending' and source_ref like 'e2e/$POINTS_E2E_RUN-%'"
          n="$(jq -nc --arg q "$q" '{query:$q}' | curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @- "https://api.supabase.com/v1/projects/$DEV_REF/database/query" | jq -r '.[0].n')"
          echo "pending e2e claims: $n"; test "$n" = 2

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: points-staging-browser-${{ github.run_id }}
          path: artifacts/points-staging-browser
          if-no-files-found: ignore
          retention-days: 14

      - name: Revoke ephemeral session, member and fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${E2E_D1:-}" ]; then
            for s in "DELETE FROM sessions WHERE token_hash='${E2E_TOKEN_HASH:-none}'" "DELETE FROM sessions WHERE admin_id IN (SELECT id FROM admins WHERE email='${E2E_ADMIN_EMAIL}')" "DELETE FROM admins WHERE email='${E2E_ADMIN_EMAIL}'"; do
              jq -nc --arg s "$s" '{sql:$s}' | curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_D1/query" >/dev/null
            done
          fi
          if [ -n "${FIXTURES_CREATED:-}" ]; then
            q="delete from public.ekodi_point_evidence_claims where site_id='$POINTS_E2E_SITE';
               delete from public.ekodi_point_anomalies where site_id='$POINTS_E2E_SITE';
               delete from public.ekodi_point_evidence_adapters where site_id='$POINTS_E2E_SITE';
               delete from public.ekodi_point_rules where site_id='$POINTS_E2E_SITE';
               delete from public.ekodi_point_sites where site_id='$POINTS_E2E_SITE';
               delete from public.login_identities where provider='e2e' and provider_subject='e2e-$POINTS_E2E_RUN';
               delete from public.people where ekodi_id='EKD-E2E-$POINTS_E2E_RUN';"
            jq -nc --arg q "$q" '{query:$q}' | curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @- "https://api.supabase.com/v1/projects/$DEV_REF/database/query" >/dev/null
          fi
          if [ -n "${E2E_MEMBER_ID:-}" ]; then
            keys="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$DEV_REF/api-keys?reveal=true")"
            key="$(printf '%s' "$keys" | jq -r '[.[]|select(.type=="secret" and .name=="ekodi_points_control_staging")][0].api_key // empty')"
            echo "::add-mask::$key"
            curl -fsS -X DELETE -H "apikey: $key" "https://$DEV_REF.supabase.co/auth/v1/admin/users/$E2E_MEMBER_ID" >/dev/null
          fi
          echo 'Ephemeral verification resources revoked.'
