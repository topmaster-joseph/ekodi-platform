name: Deploy Cloudflare Secret Manager

on:
  pull_request:
    paths:
      - 'cloudflare-secret-control.js'
      - 'mission-control-entry-worker.js'
      - 'admin-secret-generator.js'
      - 'admin-secret-generator.css'
      - 'migrations/0035_cloudflare_secret_audit.sql'
      - 'test/cloudflare-secret-control.test.mjs'
      - 'test/admin-secret-generator.test.mjs'
      - '.github/workflows/deploy-cloudflare-secret-manager.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-secret-control.js'
      - 'mission-control-entry-worker.js'
      - 'admin-secret-generator.js'
      - 'admin-secret-generator.css'
      - 'migrations/0035_cloudflare_secret_audit.sql'
      - 'test/cloudflare-secret-control.test.mjs'
      - 'test/admin-secret-generator.test.mjs'
      - '.github/workflows/deploy-cloudflare-secret-manager.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-cloudflare-secret-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate secret manager boundary
        run: |
          set -euo pipefail
          node --check cloudflare-secret-control.js
          node --check mission-control-entry-worker.js
          node --check admin-secret-generator.js
          node --test test/cloudflare-secret-control.test.mjs test/admin-secret-generator.test.mjs
          npm run build
          grep -Fq 'cloudflare-secret-control.js' mission-control-entry-worker.js
          grep -Fq '/api/control/secrets' mission-control-entry-worker.js
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' cloudflare-secret-control.js
          grep -Fq 'CLOUDFLARE_SECRET_MANAGER_TOKEN' cloudflare-secret-control.js
          grep -Fq 'SECRET_NAME_RESERVED' cloudflare-secret-control.js

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SECRET_MANAGER_TOKEN: ${{ secrets.CLOUDFLARE_SECRET_MANAGER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Check dedicated manager credential
        id: manager
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_SECRET_MANAGER_TOKEN:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Dedicated Cloudflare Secret Manager token is available.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare Secret Manager code is deployed safely, but GitHub secret CLOUDFLARE_SECRET_MANAGER_TOKEN is not configured. Automatic writes remain disabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait for Control API release containing Secret Manager route
        if: steps.manager.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/secret-status.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/control/secrets/status' || true)
            if [ "$code" = '401' ]; then
              echo 'Control API Secret Manager route is live.'
              exit 0
            fi
            echo "Waiting for Control API release (attempt $attempt/30, HTTP $code)."
            sleep 5
          done
          echo 'Control API Secret Manager route did not become live; refusing credential provisioning.'
          exit 1
      - name: Apply additive audit migration
        if: steps.manager.outputs.configured == 'true'
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.api.toml "$WRANGLER_VERSION"
      - name: Build guarded runtime secret file
        if: steps.manager.outputs.configured == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const values = {
            CLOUDFLARE_SECRET_MANAGER_TOKEN: process.env.CLOUDFLARE_SECRET_MANAGER_TOKEN,
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
          };
          if (!values.CLOUDFLARE_SECRET_MANAGER_TOKEN || !values.CLOUDFLARE_ACCOUNT_ID) process.exit(2);
          fs.writeFileSync('/tmp/ekodi-secret-manager.json', JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Guarded Control release with dedicated secret-manager credential
        if: steps.manager.outputs.configured == 'true'
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/control-api.worker.json --secrets-file /tmp/ekodi-secret-manager.json
      - name: Verify unauthenticated boundary
        if: steps.manager.outputs.configured == 'true'
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/secret-status.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/control/secrets/status')
          test "$code" = '401'
      - name: Remove temporary secret file
        if: always()
        run: rm -f /tmp/ekodi-secret-manager.json
