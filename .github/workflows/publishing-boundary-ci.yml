name: Publishing Boundary CI

on:
  pull_request:
    paths:
      - 'publishing/**'
      - 'publishing-worker.js'
      - 'wrangler.publishing.staging.toml'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'docs/operations/bookstore-publishing-boundary.md'
      - 'test/bookstore-publishing-boundary.test.mjs'
      - '.github/workflows/publishing-boundary-ci.yml'

permissions:
  contents: read

concurrency:
  group: publishing-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-publishing-staging.topmaster-joseph.workers.dev

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate bookstore and publishing boundary
        run: |
          set -euo pipefail
          node --check publishing-worker.js
          node --check ekodi-service-manifest.js
          node --test test/bookstore-publishing-boundary.test.mjs
          test -f wrangler.publishing.staging.toml

  isolated-staging:
    environment: development
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated Publishing staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.publishing.staging.toml
      - name: Verify independent Publishing staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/root-h -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            studio=$(curl -L -sS -o /tmp/studio.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/studio/" || true)
            health=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            echo "attempt=$attempt root=$root studio=$studio health=$health"
            if [[ "$root" == '200' && "$studio" == '200' && "$health" == '200' ]] \
              && grep -Fq 'EKODI PROFESSIONAL PUBLISHING SERVICE' /tmp/root.html \
              && grep -Fq 'PUBLISHING STUDIO' /tmp/studio.html \
              && grep -Fq '"publicName":"출판"' /tmp/health.json \
              && grep -Fq '"independentPlatform":true' /tmp/health.json \
              && grep -Fq '"privateCrossServiceDataAccess":false' /tmp/health.json \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/root-h; then
              echo 'Independent Publishing staging verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
