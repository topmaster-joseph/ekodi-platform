name: Deploy CGMA Apex Edge

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Authorized EKODI orchestrator release branch'
        required: true
        type: string
      release_task_id:
        description: 'Exact authorized EKODI task ID'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/deploy-cgma-apex-edge.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cgma-apex-edge.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: ekodi-cgma-apex-edge-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  CGMA_SOURCE_REPO: topmaster-joseph/cheonggye-market
  CGMA_SOURCE_REF: '628c6a5776d3101b86556dcfb888944d9f479fe9'
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate EKODI constitution and deployment ownership
        run: |
          set -euo pipefail
          node scripts/validate-constitution.mjs
          node scripts/validate-deployment-guardrails.mjs
      - name: Checkout pinned CGMA edge source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/cheonggye-market
          ref: ${{ env.CGMA_SOURCE_REF }}
          path: cgma-source
          persist-credentials: false
      - name: Validate CGMA edge contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cgma-source rev-parse HEAD)" = "$CGMA_SOURCE_REF"
          cd cgma-source
          node --check cgma-root-gateway.js
          node verify-root-gateway.mjs
          node verify-canonical.mjs
          grep -Fq 'isOwnerAdminPath' cgma-root-gateway.js
          grep -Fq 'delegatedOwnerAdminResponse' cgma-root-gateway.js
          grep -Fq 'isLivePath' cgma-root-gateway.js
          grep -Fq 'delegatedLiveResponse' cgma-root-gateway.js
          grep -Fq 'isBoardPath' cgma-root-gateway.js
          grep -Fq 'delegatedBoardResponse' cgma-root-gateway.js
          # Keep the safely bounded upstream identity/status diagnostic in release builds.
          grep -Fq 'x-ekodi-cgma-board-diagnostic' cgma-root-gateway.js
          grep -Fq 'board.internal.ekodi' cgma-root-gateway.js
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config wrangler.cgma-root-gateway.toml
          grep -Fq 'binding = "EKODI_SHARED"' wrangler.cgma-root-gateway.toml
          grep -Fq 'service = "shy-thunder-39a4"' wrangler.cgma-root-gateway.toml

  production:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.release_branch_ref != '' && inputs.release_task_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/cheonggye-market
          ref: ${{ env.CGMA_SOURCE_REF }}
          path: cgma-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Checkout EKODI orchestration control
        uses: actions/checkout@v7
        with:
          path: .ekodi-control

      - name: EKODI AI Orchestration Gate
        id: orchestrator_receipt
        run: node "$GITHUB_WORKSPACE/.ekodi-control/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify EKODI Production account boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '6986fd633f4e33bf804c921697b2d797'
          test "$(git -C cgma-source rev-parse HEAD)" = "$CGMA_SOURCE_REF"
      - name: Verify CGMA Pages upstream
        shell: bash
        run: |
          set -euo pipefail
          check_upstream() {
            local url="$1" needle="$2" body
            body=$(mktemp)
            curl -fsSL --max-redirs 6 --max-time 20 -o "$body" "$url"
            grep -Fq "$needle" "$body"
            rm -f "$body"
          }
          check_upstream 'https://cheonggye-market.pages.dev/' 'OFFICIAL ARCHIVE'
          check_upstream 'https://cheonggye-market.pages.dev/admin' 'data-admin-tab="today"'
          check_upstream 'https://cheonggye-market.pages.dev/member-admin' 'MOVED TO ADMIN CONSOLE'
          check_upstream 'https://cheonggye-market.pages.dev/api/resources' '"items"'
      - name: Deploy CGMA apex edge with central Production authority
        shell: bash
        run: |
          set -euo pipefail
          cd cgma-source
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.cgma-root-gateway.toml
      - name: Ensure current Shared Site board runtime before verification
        env:
          # workflow_dispatch passes explicit inputs; main push derives the same
          # owner-verified values from the preceding EKODI orchestration gate.
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || steps.orchestrator_receipt.outputs.branch_ref }}
          EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || steps.orchestrator_receipt.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          ready='false'
          for attempt in $(seq 1 3); do
            code=$(curl -sS -D /tmp/cgma.board.health.headers -o /tmp/cgma.board.health.body -w '%{http_code}' --max-time 20 "https://ekodi.kr/cgma/board/api/health?edge_release=${GITHUB_SHA}" || true)
            if [[ "$code" == '200' ]] && grep -Fq '"boardId":"site:cgma:main"' /tmp/cgma.board.health.body && grep -Fq '"independent":true' /tmp/cgma.board.health.body; then
              ready='true'
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 'true' ]]; then
            # Pass the same EKODI-orchestrator-approved receipt to Site Core.
            test -n "$EKODI_RELEASE_BRANCH_REF"
            test -n "$EKODI_RELEASE_TASK_ID"
            # workflow_dispatch accepts only top-level ref and a nested inputs object.
            # Passing -f release_* as top-level fields incorrectly yields HTTP 422.
            jq -nc --arg branch "$EKODI_RELEASE_BRANCH_REF" --arg task "$EKODI_RELEASE_TASK_ID" \
              '{ref:"main",inputs:{sync_domains:"false",release_branch_ref:$branch,release_task_id:$task}}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site-core.yml/dispatches" --input -
            echo 'CGMA board target is not healthy yet. Dispatched current-main Shared Site guarded release before blocking board verification.'
          else
            echo 'CGMA independent board runtime is already healthy; no Shared Site redispatch required.'
          fi
      - name: Verify CGMA edge production
        shell: bash
        run: |
          set -euo pipefail
          check_cgma() {
            local path="$1" needle="$2" route="$3" code
            for attempt in $(seq 1 18); do
              code=$(curl -sS -L --max-redirs 6 -D /tmp/cgma.headers -o /tmp/cgma.body -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?edge_release=${GITHUB_SHA}" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$needle" /tmp/cgma.body && grep -Fiq "x-ekodi-route: ${route}" /tmp/cgma.headers; then
                if [[ "$path" == '/cgma' || "$path" == '/cgma/' ]]; then
                  grep -Fiq 'x-ekodi-tenant-readability: v1' /tmp/cgma.headers || { echo "CGMA root missing tenant readability header"; sleep 4; continue; }
                  grep -Fq 'data-ekodi-tenant-readability="v1"' /tmp/cgma.body || { echo "CGMA root missing tenant readability marker"; sleep 4; continue; }
                  grep -Fq 'data-ekodi-fixed-header="v1"' /tmp/cgma.body || { echo "CGMA root missing fixed-header marker"; sleep 4; continue; }
                fi
                echo "CGMA edge verified: ${path} route=${route}"
                return 0
              fi
              sleep 4
            done
            echo "CGMA edge verification failed: ${path} route=${route} code=${code}"
            return 1
          }
          check_live() {
            local path="$1" code
            for attempt in $(seq 1 18); do
              code=$(curl -sS -L --max-redirs 6 -D /tmp/cgma.live.headers -o /tmp/cgma.live.body -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?edge_release=${GITHUB_SHA}" || true)
              if [[ "$code" == '200' ]] && grep -Fq 'id="hostButton"' /tmp/cgma.live.body && grep -Fq 'data-tenant="cgma"' /tmp/cgma.live.body && ! grep -Fiq 'x-ekodi-route: cgma-root-gateway' /tmp/cgma.live.headers; then
                echo "CGMA Live verified: ${path}"
                return 0
              fi
              sleep 4
            done
            echo "CGMA Live verification failed: ${path} code=${code}"
            return 1
          }
          check_board() {
            local path="$1" code
            for attempt in $(seq 1 72); do
              code=$(curl -sS -L --max-redirs 6 -D /tmp/cgma.board.headers -o /tmp/cgma.board.body -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?edge_release=${GITHUB_SHA}" || true)
              if [[ "$code" == '200' ]] && grep -Fq '<title>게시판</title>' /tmp/cgma.board.body && grep -Fiq 'x-ekodi-board-independent: true' /tmp/cgma.board.headers && grep -Fiq 'x-ekodi-board-id: site:cgma:main' /tmp/cgma.board.headers && ! grep -Fiq 'x-ekodi-route: cgma-root-gateway' /tmp/cgma.board.headers; then
                echo "CGMA independent board verified: ${path}"
                return 0
              fi
              sleep 5
            done
            echo "CGMA independent board verification failed after bounded Shared Site wait: ${path} code=${code}"
            return 1
          }
          check_protected_asset() {
            local path="$1" needle="$2" route="$3" code location
            for attempt in $(seq 1 18); do
              code=$(curl -sS --max-redirs 0 -D /tmp/cgma.protected.headers -o /tmp/cgma.protected.body -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?edge_release=${GITHUB_SHA}" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$needle" /tmp/cgma.protected.body && grep -Fiq "x-ekodi-route: ${route}" /tmp/cgma.protected.headers; then
                echo "CGMA protected asset served directly: ${path} route=${route}"
                return 0
              fi
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/cgma.protected.headers)
              if [[ "$code" =~ ^30[12378]$ ]] && [[ "$location" == *'/auth/'* ]]; then
                echo "CGMA protected asset correctly requires authentication: ${path}"
                return 0
              fi
              sleep 4
            done
            echo "CGMA protected asset verification failed: ${path} code=${code} location=${location:-missing}"
            return 1
          }
          check_redirect() {
            local path="$1" location_prefix="$2" code
            for attempt in $(seq 1 18); do
              code=$(curl -sS --max-redirs 0 -D /tmp/cgma.redirect.headers -o /dev/null -w '%{http_code}' --max-time 20 "https://ekodi.kr${path}?edge_release=${GITHUB_SHA}" || true)
              if [[ "$code" == '308' ]] && grep -Fiq "location: ${location_prefix}" /tmp/cgma.redirect.headers; then
                echo "CGMA redirect verified: ${path}"
                return 0
              fi
              sleep 4
            done
            echo "CGMA redirect verification failed: ${path} code=${code}"
            return 1
          }
          check_cgma '/cgma' '청계면상인회 | 오늘도 청계에서 만나요' 'cgma-root-gateway'
          check_cgma '/cgma/admin' 'data-admin-tab="today"' 'cgma-root-gateway'
          check_cgma '/cgma/api/resources' '"items"' 'cgma-root-gateway'
          check_cgma '/cgma/admin/member' 'EKODI Workspace Admin' 'workspace-admin'
          check_cgma '/cgma/admin/publishing' 'EKODI Workspace Admin' 'workspace-admin'
          check_board '/cgma/board'
          if ! check_protected_asset '/cgma/admin/assets/cgma-member-admin.js' 'mountCgmaMemberAdmin' 'admin-workspace-asset'; then
            echo '::warning::CGMA member admin JS asset verification is degraded; independent board release remains valid and asset repair is deferred.'
          fi
          if ! check_protected_asset '/cgma/admin/assets/cgma-member-admin.css' '.cgma-member-head' 'admin-workspace-asset'; then
            echo '::warning::CGMA member admin CSS asset verification is degraded; independent board release remains valid and asset repair is deferred.'
          fi
          check_redirect '/cgma/member-admin' 'https://ekodi.kr/cgma/admin/member?edge_release='
          check_live '/cgma/live/'
