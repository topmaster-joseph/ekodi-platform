name: Deploy Jadam Marketing AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-jadam-marketing-ai.yml'

permissions:
  contents: read

concurrency:
  group: managed-jadam-marketing-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EKODI control plane
        uses: actions/checkout@v7

      - name: Checkout managed Jadam site
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main
          path: managed/jadam-maru

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build managed site
        working-directory: managed/jadam-maru
        run: |
          npm run build
          test -f dist/marketing-ai/index.html
          test -f dist/marketing-ai/jadam-mokpo-univ/index.html
          test -f dist/marketing-ai/pizzamaru-mokpo-univ/index.html
          test -f dist/marketing-ai/yogurtpurple-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/jadam-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/pizzamaru-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/yogurtpurple-mokpo-univ/index.html
          ! grep -Fq 'href="./jadam-mokpo-univ/"' dist/marketing-ai/index.html
          ! grep -Fq 'href="./pizzamaru-mokpo-univ/"' dist/marketing-ai/index.html
          ! grep -Fq 'href="./yogurtpurple-mokpo-univ/"' dist/marketing-ai/index.html

      - name: Deploy to Cloudflare Pages
        working-directory: managed/jadam-maru
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 pages deploy dist --project-name=jadam-maru --branch=main

      - name: Verify live Marketing AI cases
        shell: bash
        run: |
          set -euo pipefail
          base='https://jadam-maru.pages.dev'
          for attempt in $(seq 1 12); do
            ok=1
            check() {
              url="$1"
              needle="$2"
              body=$(mktemp)
              code=$(curl -L -sS -o "$body" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
              echo "$url -> $code"
              if [ "$code" != '200' ] || ! grep -Fq "$needle" "$body"; then ok=0; fi
              rm -f "$body"
            }
            check "$base/" '자담&마루'
            check "$base/marketing-ai/" '마케팅AI'
            check "$base/marketing-ai/jadam-mokpo-univ/" '자담치킨 목포대점'
            check "$base/marketing-ai/pizzamaru-mokpo-univ/" '피자마루 목포대점'
            check "$base/marketing-ai/yogurtpurple-mokpo-univ/" '요거트퍼플 목포대점'
            if [ "$ok" -eq 1 ]; then
              echo 'Jadam Marketing AI deployment verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live Marketing AI verification failed.'
          exit 1
