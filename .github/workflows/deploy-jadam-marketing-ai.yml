name: Deploy Marketing AI (Guarded Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-marketing-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout EKODI release controller
        uses: actions/checkout@v7
      - name: Checkout Marketing AI source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main
          path: managed/marketing-ai-source
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Build and validate Marketing AI
        working-directory: managed/marketing-ai-source
        run: |
          set -euo pipefail
          npm run build
          test -f dist/marketing-ai/index.html
          test -f dist/marketing-ai/qa/index.html
          test -f dist/marketing-ai/jadam/index.html
          test -f dist/marketing-ai/pizzamaru/index.html
          test -f dist/marketing-ai/yogurtpurple/index.html
          grep -Fq '마케팅AI 검수센터' dist/marketing-ai/qa/index.html
          grep -Fq 'data-public-landing-cleanup' dist/marketing-ai/index.html
          grep -Fq 'id="googleCustomerAuth"' dist/marketing-ai/index.html
          for file in dist/marketing-ai/jadam/index.html dist/marketing-ai/pizzamaru/index.html dist/marketing-ai/yogurtpurple/index.html; do
            grep -Fq 'id="googleCustomerAuth"' "$file"
            grep -Fq 'Google로 무료 시작' "$file"
            if grep -Fq '/api/customer/login' "$file" || grep -Fq '/api/customer/accept-invite' "$file"; then echo "Legacy direct login detected in $file"; exit 1; fi
          done
          if grep -R -Fq 'https://yogurtpurple.ekodi.kr/' dist/marketing-ai; then echo 'Legacy yogurtpurple domain detected in generated site'; exit 1; fi
      - name: Verify guarded Pages release controller
        run: |
          node --check scripts/guarded-pages-release.mjs
          test -f deploy/manifests/marketing-ai.pages.json
      - name: Preview gate, production promotion and smoke verification
        run: node scripts/guarded-pages-release.mjs --root managed/marketing-ai-source --manifest deploy/manifests/marketing-ai.pages.json
      - name: Deep verify Marketing AI domains
        shell: bash
        run: |
          set -euo pipefail
          verify_url() { url="$1"; needle="$2"; code=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true); echo "$url -> $code"; [ "$code" = '200' ] && grep -Fq "$needle" /tmp/site.html; }
          for attempt in $(seq 1 24); do
            if verify_url 'https://marketing.ekodi.kr/' '마케팅AI' && verify_url 'https://marketing.ekodi.kr/qa/' '마케팅AI 검수센터' && verify_url 'https://jadam.ekodi.kr/' '자담치킨 목포대점' && verify_url 'https://pizzamaru.ekodi.kr/' '피자마루 목포대점' && verify_url 'https://yogurt.ekodi.kr/' '요거트퍼플 목포대점'; then echo 'Guarded Marketing AI manual release verified.'; exit 0; fi
            sleep 5
          done
          exit 1
