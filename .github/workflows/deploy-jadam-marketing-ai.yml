name: Deploy Marketing AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-jadam-marketing-ai.yml'

permissions:
  contents: read

concurrency:
  group: managed-marketing-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: marketing-ai
      CF_DOMAIN: marketing.ekodi.kr
    steps:
      - name: Checkout EKODI control plane
        uses: actions/checkout@v7

      - name: Checkout Marketing AI source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main
          path: managed/marketing-ai-source

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build Marketing AI
        working-directory: managed/marketing-ai-source
        run: |
          npm run build
          test -f dist/marketing-ai/index.html
          test -f dist/marketing-ai/jadam-mokpo-univ/index.html
          test -f dist/marketing-ai/pizzamaru-mokpo-univ/index.html
          test -f dist/marketing-ai/yogurtpurple-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/jadam-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/pizzamaru-mokpo-univ/index.html
          grep -Fq 'Powered by <span>EKODIBIZ</span>' dist/marketing-ai/yogurtpurple-mokpo-univ/index.html

      - name: Ensure standalone Pages project
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [ "$code" = '200' ]; then
            echo "$CF_PROJECT already exists"
          elif [ "$code" = '404' ]; then
            create=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "{\"name\":\"$CF_PROJECT\",\"production_branch\":\"main\"}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects")
            cat /tmp/create.json
            case "$create" in 200|201) ;; *) echo "Pages project creation failed: HTTP $create"; exit 1;; esac
          else
            cat /tmp/project.json
            echo "Pages project lookup failed: HTTP $code"
            exit 1
          fi

      - name: Deploy standalone Marketing AI
        working-directory: managed/marketing-ai-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai --project-name=marketing-ai --branch=main

      - name: Attach marketing.ekodi.kr
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains/$CF_DOMAIN")
          if [ "$code" = '200' ]; then
            echo "$CF_DOMAIN already attached"
          else
            create=$(curl -sS -o /tmp/domain-create.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "{\"name\":\"$CF_DOMAIN\"}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains")
            cat /tmp/domain-create.json
            case "$create" in 200|201) ;; *) echo "Custom domain attach failed: HTTP $create"; exit 1;; esac
          fi

      - name: Verify standalone Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          project=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          pages_host=$(printf '%s' "$project" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result']['subdomain'])")
          echo "Pages host: $pages_host"
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/pages.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$pages_host/" || true)
            echo "attempt=$attempt pages=$code"
            if [ "$code" = '200' ] && grep -Fq '마케팅AI' /tmp/pages.html; then
              echo 'Marketing AI standalone Pages deployment verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Report custom-domain state
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          result=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains/$CF_DOMAIN")
          status=$(printf '%s' "$result" | python -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('status','unknown'))")
          code=$(curl -L -sS -o /tmp/domain.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$CF_DOMAIN/" || true)
          echo "$CF_DOMAIN pages_status=$status http=$code"
          if [ "$code" = '200' ]; then
            grep -Fq '마케팅AI' /tmp/domain.html
            echo 'Custom domain is live.'
          else
            echo 'Custom domain remains pending DNS activation; Pages deployment itself is healthy.'
          fi
