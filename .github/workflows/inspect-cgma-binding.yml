name: Inspect CGMA Binding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-cgma-binding.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect binding and content markers
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr&account.id=$CF_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=cgma.ekodi.kr" -o /tmp/dns.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/dns.json'))
          for r in d.get('result',[]): print('dns',r.get('type'),r.get('name'),'->',r.get('content'),'proxied='+str(r.get('proxied')))
          PY
          curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/cheonggye-market/domains/cgma.ekodi.kr" -o /tmp/domain.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/domain.json')).get('result') or {}
          print('pages_domain_name='+str(d.get('name')))
          print('pages_domain_status='+str(d.get('status')))
          print('pages_validation_status='+str((d.get('validation_data') or {}).get('status')))
          PY
          curl -fsSL 'https://cheonggye-market.pages.dev/member' -o /tmp/canonical.html
          curl -fsSL 'https://cgma.ekodi.kr/member' -o /tmp/custom.html
          python - <<'PY'
          import hashlib
          for name in ['canonical','custom']:
            b=open('/tmp/'+name+'.html','rb').read()
            print(name+'_sha256='+hashlib.sha256(b).hexdigest())
            print(name+'_google_first='+str('Google 계정으로 로그인'.encode() in b).lower())
            print(name+'_title='+str('정회원 내 가게 | 청계면상인회'.encode() in b).lower())
          PY
