name: Admin DNS Diagnostics

on:
  push:
    branches:
      - staging/admin-dns-diagnostics-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Inspect Worker custom-domain attachment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4"
          payload=$(curl -fsS --retry 3 --retry-delay 2 \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=shy-thunder-39a4" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$payload" | jq -e '.success == true' >/dev/null
          echo 'Worker domains:'
          echo "$payload" | jq -c '.result[] | select(.hostname == "ekodi.kr" or .hostname == "admin.ekodi.kr" or .hostname == "auth.ekodi.kr") | {id,cert_id,hostname,service,zone_id,zone_name,environment}'
          zone_id=$(echo "$payload" | jq -r '.result[] | select(.hostname == "admin.ekodi.kr") | .zone_id' | head -n1)
          test -n "$zone_id" && test "$zone_id" != null
          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Compare Cloudflare DNS records
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          for host in ekodi.kr admin.ekodi.kr auth.ekodi.kr; do
            code=$(curl -sS -o /tmp/dns-record.json -w '%{http_code}' --retry 2 --retry-delay 1 \
              "$api/zones/$ZONE_ID/dns_records?name=$host&per_page=100" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "=== $host DNS Records API -> HTTP $code ==="
            if [ "$code" = 200 ]; then
              jq -c '{success,result:[.result[] | {id,type,name,content,proxied,proxiable,ttl,settings,modified_on}]}' /tmp/dns-record.json
            else
              jq -c '{success,errors}' /tmp/dns-record.json 2>/dev/null || cat /tmp/dns-record.json
            fi
          done

      - name: Resolve through independent public resolvers
        shell: bash
        run: |
          set -euo pipefail
          for host in ekodi.kr admin.ekodi.kr auth.ekodi.kr; do
            for type in A AAAA; do
              echo "=== Cloudflare DoH $host $type ==="
              curl -fsS --retry 3 -H 'accept: application/dns-json' \
                "https://cloudflare-dns.com/dns-query?name=$host&type=$type" \
                | jq -c '{Status,AD,Question,Answer}'
              echo "=== Google DoH $host $type ==="
              curl -fsS --retry 3 \
                "https://dns.google/resolve?name=$host&type=$type" \
                | jq -c '{Status,AD,Question,Answer}'
            done
          done
          echo '=== Runner resolver ==='
          getent ahosts admin.ekodi.kr || true

      - name: Probe Korean ISP recursive resolvers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          for spec in \
            'KT-primary:168.126.63.1' \
            'KT-secondary:168.126.63.2' \
            'SKT-primary:219.250.36.130' \
            'SKT-secondary:210.220.163.82' \
            'LGU+-primary:164.124.101.2' \
            'LGU+-secondary:203.248.252.2'; do
            label="${spec%%:*}"
            resolver="${spec#*:}"
            echo "=== $label $resolver ==="
            a=$(dig +time=3 +tries=1 +short @"$resolver" admin.ekodi.kr A | tr '\n' ' ' || true)
            aaaa=$(dig +time=3 +tries=1 +short @"$resolver" admin.ekodi.kr AAAA | tr '\n' ' ' || true)
            echo "A: ${a:-NO_ANSWER}"
            echo "AAAA: ${aaaa:-NO_ANSWER}"
          done

      - name: Probe HTTP from Asia-Pacific external nodes
        shell: bash
        run: |
          set -euo pipefail
          nodes=$(curl -fsS --retry 3 -H 'Accept: application/json' https://check-host.net/nodes/hosts)
          selected=$(echo "$nodes" | jq -r '.nodes | to_entries[] | select((.value.location[0] == "kr") or (.value.location[0] == "jp") or (.value.location[0] == "sg") or (.value.location[0] == "hk")) | .key' | head -n 6)
          if [ -z "$selected" ]; then
            echo 'No KR/JP/SG/HK Check-Host nodes available; using automatic nodes.'
            request=$(curl -fsS --retry 3 -H 'Accept: application/json' 'https://check-host.net/check-http?host=https%3A%2F%2Fadmin.ekodi.kr%2F&max_nodes=8')
          else
            args=''
            while IFS= read -r node; do
              [ -n "$node" ] || continue
              echo "Selected APAC node: $node"
              args="$args&node=$node"
            done <<< "$selected"
            request=$(curl -fsS --retry 3 -H 'Accept: application/json' "https://check-host.net/check-http?host=https%3A%2F%2Fadmin.ekodi.kr%2F${args}")
          fi
          echo "$request" | jq -c '{ok,request_id,nodes}'
          request_id=$(echo "$request" | jq -r '.request_id')
          test -n "$request_id" && test "$request_id" != null
          for attempt in 1 2 3 4 5; do
            sleep 3
            result=$(curl -fsS --retry 2 -H 'Accept: application/json' "https://check-host.net/check-result/$request_id")
            echo "$result" | jq -c '.'
            ready=$(echo "$result" | jq '[to_entries[] | select(.value != null)] | length')
            [ "$ready" -gt 0 ] && break
          done

      - name: Verify TLS and all admin entry paths
        shell: bash
        run: |
          set -euo pipefail
          echo | openssl s_client -connect admin.ekodi.kr:443 -servername admin.ekodi.kr -verify_hostname admin.ekodi.kr -brief 2>&1 | head -n 20
          check() {
            url="$1"
            code=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
            echo "$url -> $code"
            grep -Fi 'x-ekodi-route:' /tmp/headers || true
            grep -Fi 'server:' /tmp/headers || true
            grep -Fi 'alt-svc:' /tmp/headers || true
            if [ "$code" = 200 ]; then grep -Fq 'EKODI Control Center' /tmp/body; fi
          }
          check 'https://admin.ekodi.kr/'
          check 'https://admin.ekodi.kr/admin'
          check 'https://ekodi.kr/admin'
