name: Deploy EKODI Legacy Redirects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - legacy-redirect.js
      - wrangler.legacy-redirect.toml
      - .github/workflows/deploy-legacy-redirects.yml

permissions:
  contents: read

concurrency:
  group: ekodi-legacy-redirects
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Remove legacy DNS records that can block Worker custom domains
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -u
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          for zone in ekodibiz.kr; do
            curl -fsS "${auth[@]}" "$api/zones?name=$zone" > /tmp/zone.json || continue
            zone_id=$(python - <<'PY'
          import json
          rows=(json.load(open('/tmp/zone.json')).get('result') or [])
          print(rows[0]['id'] if rows else '')
          PY
            )
            [ -n "$zone_id" ] || continue
            for name in ekodibiz.kr www.ekodibiz.kr; do
              curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100" > /tmp/records.json || continue
              python - <<'PY' > /tmp/delete_ids
          import json
          for r in json.load(open('/tmp/records.json')).get('result') or []:
              if r.get('type') in {'A','AAAA','CNAME'}:
                  print(r['id'])
          PY
              while read -r id; do
                [ -n "$id" ] || continue
                curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id" >/dev/null || true
              done < /tmp/delete_ids
            done
          done
      - name: Detach legacy Pages domain associations
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          for spec in "ekodi-church:ekodichurch.kr" "ekodilab:ekodilab.kr" "ekodi-mall:ekodimall.kr"; do
            project="${spec%%:*}"
            domain="${spec#*:}"
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain" || true)
            echo "$domain detach_http=$code"
            if [ "$code" != "200" ] && [ "$code" != "204" ] && [ "$code" != "404" ]; then cat /tmp/delete.json || true; fi
          done
      - name: Deploy permanent redirect Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.legacy-redirect.toml
      - name: Verify permanent redirects
        run: |
          set -u
          failed=0
          for spec in \
            "ekodibiz.kr:biz.ekodi.kr" \
            "www.ekodibiz.kr:biz.ekodi.kr" \
            "ekodichurch.kr:church.ekodi.kr" \
            "ekodilab.kr:lab.ekodi.kr" \
            "ekodimall.kr:mall.ekodi.kr"; do
            old="${spec%%:*}"
            new="${spec#*:}"
            code=000
            location=""
            for attempt in $(seq 1 12); do
              curl -sS -o /dev/null -D /tmp/headers --connect-timeout 10 --max-time 20 "https://$old/domain-check?source=legacy" || true
              code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}' /tmp/headers 2>/dev/null || echo 0)
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/headers 2>/dev/null || true)
              if [ "$code" = "301" ] && printf '%s' "$location" | grep -q "https://$new/domain-check?source=legacy"; then break; fi
              sleep 5
            done
            echo "$old http=$code location=$location"
            if [ "$code" != "301" ] || ! printf '%s' "$location" | grep -q "https://$new/domain-check?source=legacy"; then failed=1; fi
          done
          exit "$failed"
