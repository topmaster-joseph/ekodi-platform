name: Audit and Repair Admin Menu Services V4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-fix-admin-menu-services-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  audit-fix-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Apply menu and linked-service fixes
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);
          const patch=(p,fn)=>{const a=read(p),b=fn(a);if(a!==b)write(p,b)};
          patch('admin-demand-loader.js',source=>{
            if(/\n\s*clients\s*:\s*\{/.test(source)) return source;
            const block=`    clients: { label:'고객 사이트', icon:'C', styles:['client-access.css'], scripts:['client-access.js'], real:'[data-section="clients"]', hashes:['#clients'] },\n    community: { label:'커뮤니티', icon:'◎', styles:['community-reports-admin.css'], scripts:['community-reports-admin.js'], real:'[data-section="community"]', hashes:['#community'] },\n    books: { label:'출판 · 도서', icon:'B', styles:['books-admin.css'], scripts:['books-admin.js'], secondaryStyles:['books-finance-admin.css'], secondaryScripts:['books-finance-admin.js'], real:'[data-section="books"]', hashes:['#books'] },\n    social: { label:'소셜', icon:'S', styles:['social-admin.css'], scripts:['social-admin.js'], real:'[data-section="social"]', hashes:['#social'] },\n    affiliates: { label:'제휴', icon:'A', styles:['marketing-funnel-admin.css'], scripts:['marketing-funnel-admin.js'], real:'[data-section="affiliates"]', hashes:['#affiliates'] },\n`;
            if(!source.includes('    marketing: {')) throw new Error('marketing loader anchor missing');
            return source.replace('    marketing: {',block+'    marketing: {');
          });
          patch('admin-shell.html',source=>{
            let next=source.split(/\r?\n/).filter(line=>!line.includes('accounts.google.com/AccountChooser')&&!line.includes('accounts.google.com/AddSession')&&!line.includes('<small>MAIL CENTER</small>')).join('\n');
            return next
              .replace('href="https://mail.google.com/a/ekodi.kr"','href="https://mail.ekodi.kr/"')
              .replace('<small>PRIMARY WORKSPACE MAIL</small><strong>에코디 메일</strong><p>@ekodi.kr Google Workspace 받은편지함</p>','<small>MAIL HUB</small><strong>에코디 메일</strong><p>연결된 Workspace 메일을 확인·검색하고 원본 Gmail로 안전하게 이동</p>')
              .replaceAll('href="https://live.ekodi.kr"','href="https://live.ekodi.kr/"')
              .replaceAll('href="https://live.church.ekodi.kr"','href="https://live.church.ekodi.kr/"')
              .replaceAll('href="https://cloud.ekodi.kr"','href="https://cloud.ekodi.kr/"')
              .replaceAll('href="https://marketing.ekodi.kr"','href="https://marketing.ekodi.kr/"')
              .replaceAll('href="https://cgma.ekodi.kr"','href="https://cgma.ekodi.kr/"')
              .replaceAll('href="https://biz.ekodi.kr"','href="https://biz.ekodi.kr/"')
              .replaceAll('href="https://trade.ekodi.kr"','href="https://trade.biz.ekodi.kr/"')
              .replaceAll('href="https://pay.ekodi.kr"','href="https://pay.ekodi.kr/"')
              .replaceAll('href="https://church.ekodi.kr"','href="https://church.ekodi.kr/"')
              .replaceAll('href="https://lab.ekodi.kr"','href="https://lab.ekodi.kr/"')
              .replace(/admin-authenticated-shell\.js\?v=[^"]+/,'admin-authenticated-shell.js?v=20260830-menu-service-audit-2');
          });
          const registry=JSON.parse(read('config/ecosystem-services.json'));
          const trade=registry.services.find(item=>item.id==='trade');
          if(!trade) throw new Error('trade service missing');
          trade.url='https://trade.biz.ekodi.kr'; trade.label='trade.biz.ekodi.kr';
          write('config/ecosystem-services.json',JSON.stringify(registry,null,2)+'\n');
          NODE
          cat > scripts/audit-admin-menu-services.mjs <<'AUDIT'
          import fs from 'node:fs';
          const read=p=>fs.readFileSync(p,'utf8');
          const menuRegistry=read('admin-menu-registry.js');
          const loader=read('admin-demand-loader.js');
          const shell=read('admin-shell.html');
          const services=JSON.parse(read('config/ecosystem-services.json'));
          const esc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          const menus=['campus','work','communication','workspace','organization','clients','admins','life-ai','community','books','social','aiops','marketing-ai','ai-module-spec','ai-membership','finance','tax','affiliates','storage','api-cost','health','security','devices','architecture'];
          for(const id of menus) if(!new RegExp("\\bid\\s*:\\s*['\"]"+esc(id)+"['\"]").test(menuRegistry)) throw new Error('menu missing: '+id);
          const lazy=['campus','work','clients','life-ai','community','books','social','aiops','marketing','ai-module-spec','aimembers','affiliates','storage','api-cost','health','security','devices'];
          for(const key of lazy) if(!new RegExp("(^|\\n)\\s*['\"]?"+esc(key)+"['\"]?\\s*:\\s*\\{",'m').test(loader)) throw new Error('loader missing: '+key);
          const contracts={
            'client-access.js':[/dataset\.section\s*=\s*['\"]clients['\"]/,/고객관리 API 요청 실패/],
            'community-reports-admin.js':[/dataset\.section\s*=\s*['\"]community['\"]/,/Ministry Reports/],
            'books-admin.js':[/dataset\.section\s*=\s*['\"]books['\"]/,/Publications/],
            'books-finance-admin.js':[/Sales & Costs/,/CHANNEL P&L/],
            'social-admin.js':[/dataset\.section\s*=\s*['\"]social['\"]/,/Social Channels/],
            'marketing-funnel-admin.js':[/dataset\.section\s*=\s*['\"]affiliates['\"]/,/affiliate/i],
          };
          for(const [file,patterns] of Object.entries(contracts)){if(!fs.existsSync(file))throw new Error('module missing: '+file);const src=read(file);for(const pattern of patterns)if(!pattern.test(src))throw new Error(file+' contract failed: '+pattern)}
          for(const css of ['client-access.css','community-reports-admin.css','books-admin.css','books-finance-admin.css','social-admin.css','marketing-funnel-admin.css']) if(!fs.existsSync(css)) throw new Error('style missing: '+css);
          for(const panel of ['communication','workspace','organization','finance','architecture']) if(!shell.includes('data-panel="'+panel+'"')) throw new Error('static panel missing: '+panel);
          for(const bad of ['mail.google.com/a/ekodi.kr','accounts.google.com/AccountChooser','accounts.google.com/AddSession','href="https://trade.ekodi.kr']) if(shell.includes(bad)) throw new Error('legacy link survived: '+bad);
          for(const good of ['https://mail.ekodi.kr/','https://trade.biz.ekodi.kr/','https://marketing.ekodi.kr/','https://cgma.ekodi.kr/','https://biz.ekodi.kr/','https://church.ekodi.kr/','https://lab.ekodi.kr/']) if(!shell.includes(good)) throw new Error('canonical link missing: '+good);
          if(!/id:\s*['"]tax['"][\s\S]{0,240}href:\s*['"]https:\/\/tax\.ekodi\.kr\/['"][\s\S]{0,120}adminHandoff:\s*true/.test(menuRegistry)) throw new Error('tax handoff registry missing');
          const trade=services.services.find(item=>item.id==='trade'); if(trade?.url!=='https://trade.biz.ekodi.kr') throw new Error('trade registry not canonical');
          console.log(`OK ${menus.length} menus, ${lazy.length} lazy modules, linked service contracts.`);
          AUDIT
      - name: Validate source and build
        run: |
          set -euo pipefail
          node --check scripts/audit-admin-menu-services.mjs
          node scripts/audit-admin-menu-services.mjs
          node scripts/validate-admin-source.mjs
          npm run build
          node scripts/audit-admin-menu-services.mjs
          for f in client-access.js community-reports-admin.js books-admin.js books-finance-admin.js social-admin.js marketing-funnel-admin.js; do node --check "$f"; done
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-demand-loader.js admin-shell.html config/ecosystem-services.json scripts/audit-admin-menu-services.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(admin): repair menu modules and linked services'
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production and linked services
        run: |
          set -euo pipefail
          nonce="$GITHUB_RUN_ID"
          curl -fsS "https://admin.ekodi.kr/?audit=$nonce" -o /tmp/admin
          curl -fsS "https://admin.ekodi.kr/admin-demand-loader.js?v=$nonce" -o /tmp/loader
          for marker in "clients:" "community:" "books:" "social:" "affiliates:"; do grep -Fq "$marker" /tmp/loader; done
          printf '| 서비스 | HTTP | 최종 주소 | 제목 |\n|---|---:|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for url in https://mail.ekodi.kr/ https://live.ekodi.kr/ https://live.church.ekodi.kr/ https://cloud.ekodi.kr/ https://marketing.ekodi.kr/ https://cgma.ekodi.kr/ https://biz.ekodi.kr/ https://trade.biz.ekodi.kr/ https://pay.ekodi.kr/ https://church.ekodi.kr/ https://lab.ekodi.kr/ https://tax.ekodi.kr/; do
            : > /tmp/body
            meta=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/body -w '%{http_code}|%{url_effective}' "$url" || true)
            status=${meta%%|*}; final=${meta#*|}; title=$(grep -io '<title>[^<]*</title>' /tmp/body | head -1 | sed -E 's#</?title>##Ig' | tr '|' '/' || true); [ -n "$title" ] || title='(no title)'
            printf '%s -> HTTP %s -> %s (%s)\n' "$url" "$status" "$final" "$title"
            printf '| %s | %s | %s | %s |\n' "$url" "$status" "$final" "$title" >> "$GITHUB_STEP_SUMMARY"
            [[ "$status" =~ ^[23] ]] || failed=1
          done
          exit "$failed"
