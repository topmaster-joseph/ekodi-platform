name: Support Central Identity CI

on:
  pull_request:
    paths:
      - 'support/**'
      - 'support-worker.js'
      - 'wrangler.support.toml'
      - 'wrangler.support.staging.toml'
      - 'supabase/functions/profile-api/index.ts'
      - 'test/support-central-identity.test.mjs'
      - '.github/workflows/support-central-identity-ci.yml'
  push:
    branches: [main]
    paths:
      - 'support/**'
      - 'support-worker.js'
      - 'wrangler.support.toml'
      - 'wrangler.support.staging.toml'
      - 'supabase/functions/profile-api/index.ts'
      - 'test/support-central-identity.test.mjs'
      - '.github/workflows/support-central-identity-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Support identity bridge and isolation
        run: |
          set -euo pipefail
          node --check support-worker.js
          node --check support/account.js
          node --check support/service.js
          node --check support/specialists.js
          node --test test/support-opportunity.test.mjs test/support-central-identity.test.mjs
          grep -Fq 'https://support.ekodi.kr' supabase/functions/profile-api/index.ts
          ! grep -Fq 'ekodi-support-opportunity-staging' supabase/functions/profile-api/index.ts
          grep -Fq 'SUPABASE_URL' wrangler.support.toml
          ! grep -Fq 'SUPABASE_URL' wrangler.support.staging.toml

  production-contract:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Support production identity contract
        shell: bash
        run: |
          set -euo pipefail
          specialist_paths=(grants subsidies scholarships contests welfare private-support sponsorship)
          for attempt in $(seq 1 60); do
            config_code=$(curl -sS -o /tmp/support-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/config.js' || true)
            account_code=$(curl -sS -o /tmp/support-account.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/account.js' || true)
            health_code=$(curl -sS -o /tmp/support-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/health' || true)
            specialist_ok=true
            for path in "${specialist_paths[@]}"; do
              code=$(curl -L -sS -o "/tmp/support-${path}.html" -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://support.ekodi.kr/$path" || true)
              if [[ "$code" != '200' ]] || ! grep -Fq 'id="ekodiAccount"' "/tmp/support-${path}.html"; then specialist_ok=false; fi
            done
            cors_code=$(curl -sS -o /dev/null -D /tmp/profile-cors.headers -w '%{http_code}' -X OPTIONS \
              --connect-timeout 5 --max-time 15 \
              'https://renzehysxirjilvdxacv.supabase.co/functions/v1/profile-api' \
              -H 'Origin: https://support.ekodi.kr' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' || true)
            if [[ "$config_code" == '200' && "$account_code" == '200' && "$health_code" == '200' && "$specialist_ok" == 'true' ]] \
              && grep -Fq '"centralIdentity":{"enabled":true' /tmp/support-config.js \
              && grep -Fq '"centralIdentityEnabled":true' /tmp/support-health.json \
              && grep -Fq 'support central identity unavailable' /tmp/support-account.js \
              && [[ "$cors_code" =~ ^(200|204)$ ]] \
              && grep -Eiq '^access-control-allow-origin:[[:space:]]*https://support\.ekodi\.kr' /tmp/profile-cors.headers; then
              echo 'Support central identity production contract verified on all seven specialist routes.'
              exit 0
            fi
            sleep 10
          done
          echo 'Support central identity production contract did not converge.'
          cat /tmp/support-config.js || true
          cat /tmp/support-health.json || true
          cat /tmp/profile-cors.headers || true
          exit 1
