name: Diagnose EKODI Mall staging

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/diagnose-ekodi-mall-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect staging redirect behavior
        shell: bash
        run: |
          set -euo pipefail
          base='https://ekodi-mall-api-staging.ekodi-development.workers.dev'
          for path in /health /api/public/fees '/api/public/products?limit=1'; do
            url="${base}${path}"
            headers=$(mktemp)
            first_code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
            safe_location=${location%%\?*}
            final_code=$(curl -sSL -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
            echo "path=${path%%\?*} first_status=$first_code final_status=$final_code redirect=${safe_location:-none}"
            rm -f "$headers"
          done
