name: Deploy Marketing AI Pages

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-marketing-pages.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-marketing-pages.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-marketing-ai-pages
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve latest Marketing AI source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(curl -fsS 'https://api.github.com/repos/topmaster-joseph/jadam-maru/commits/main' | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest jadam-maru/main: $sha"

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        run: |
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Plan idempotent Pages sync
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
            echo 'PR validation: build contracts only; no Cloudflare mutation.'
            exit 0
          fi

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          target='${{ steps.source.outputs.sha }}'
          all_current=1
          : > /tmp/previous.tsv

          for project in marketing-ai marketing-ai-jadam marketing-ai-pizzamaru marketing-ai-yogurtpurple; do
            curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/deployments?env=production&per_page=1" > "/tmp/$project-deployments.json"
            PROJECT="$project" python - <<'PY' >> /tmp/previous.tsv
          import json, os
          project=os.environ['PROJECT']
          rows=json.load(open('/tmp/'+project+'-deployments.json')).get('result') or []
          row=rows[0] if rows else {}
          trigger=(row.get('deployment_trigger') or {}).get('metadata') or {}
          print('\t'.join([project, str(row.get('id') or ''), str(trigger.get('commit_hash') or '')]))
          PY
          done

          while IFS=$'\t' read -r project deployment_id commit_hash; do
            echo "$project current_commit=${commit_hash:-unknown} deployment=${deployment_id:-none}"
            if [ "$commit_hash" != "$target" ]; then all_current=0; fi
          done < /tmp/previous.tsv

          if [ "$all_current" -eq 1 ]; then
            echo 'deploy_needed=false' >> "$GITHUB_OUTPUT"
            echo 'All Marketing AI Pages projects already match latest source; no build or deploy needed.'
          else
            echo 'deploy_needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Marketing AI source
        if: github.event_name == 'pull_request' || steps.plan.outputs.deploy_needed == 'true'
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: ${{ steps.source.outputs.sha }}
          path: marketing-source
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: github.event_name == 'pull_request' || steps.plan.outputs.deploy_needed == 'true'
        with:
          node-version: '24'

      - name: Build and verify Marketing AI deployment contract
        if: github.event_name == 'pull_request' || steps.plan.outputs.deploy_needed == 'true'
        working-directory: marketing-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          for file in \
            dist/marketing-ai/index.html \
            dist/marketing-ai/jadam/index.html \
            dist/marketing-ai/pizzamaru/index.html \
            dist/marketing-ai/yogurtpurple/index.html; do
            test -f "$file"
            grep -Fq 'data-ekodi-workspace-handoff' "$file"
            grep -Fq 'window.EKODI_MARKETING_CONTEXT' "$file"
            grep -Fq "/workspaces?site=marketing" "$file"
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' "$file"
            grep -Fq 'id="customDomainPanel"' "$file"
            grep -Fq 'https://marketing-api.ekodi.kr' "$file"
            grep -Fq '/api/marketing/domains' "$file"
            grep -Fq '/api/marketing/workspace/resolve?host=' "$file"
            grep -Fq '/api/marketing/store-domains' "$file"
            grep -Fq 'STORE MARKETING AI' "$file"
          done
          grep -Fq 'data-store-plan-links' dist/marketing-ai/index.html
          grep -Fq "url.searchParams.set('store',store)" dist/marketing-ai/index.html
          for file in \
            dist/marketing-ai/jadam/index.html \
            dist/marketing-ai/pizzamaru/index.html \
            dist/marketing-ai/yogurtpurple/index.html; do
            grep -Fq 'data-ekodi-customer-prereg' "$file"
            grep -Fq '/api/customer/federated-login' "$file"
            grep -Fq '/api/membership/me?site=marketing&tenant=' "$file"
          done

      - name: Deploy all Pages projects with automatic rollback
        if: github.event_name != 'pull_request' && steps.plan.outputs.deploy_needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          sha='${{ steps.source.outputs.sha }}'
          : > /tmp/deployed-projects

          previous_id() {
            awk -F $'\t' -v p="$1" '$1==p {print $2; exit}' /tmp/previous.tsv
          }

          rollback() {
            rc=$?
            trap - ERR
            echo "Marketing Pages deployment failed (rc=$rc); rolling back changed projects."
            if [ -s /tmp/deployed-projects ]; then
              tac /tmp/deployed-projects | while read -r project; do
                [ -n "$project" ] || continue
                prev=$(previous_id "$project")
                if [ -n "$prev" ]; then
                  echo "Rollback $project -> $prev"
                  curl -fsS -X POST "${auth[@]}" \
                    "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/deployments/$prev/rollback" >/tmp/rollback.json || true
                else
                  echo "No previous production deployment recorded for $project; manual review required."
                fi
              done
            fi
            exit "$rc"
          }
          trap rollback ERR

          deploy_one() {
            project="$1"; dir="$2"
            echo "Deploying $project from $dir @ $sha"
            npx --yes wrangler@$WRANGLER_VERSION pages deploy "$dir" \
              --project-name "$project" \
              --branch main \
              --commit-hash "$sha" \
              --commit-message "EKODI Marketing AI $sha"
            echo "$project" >> /tmp/deployed-projects
          }

          deploy_one marketing-ai marketing-source/dist/marketing-ai
          deploy_one marketing-ai-jadam marketing-source/dist/marketing-ai/jadam
          deploy_one marketing-ai-pizzamaru marketing-source/dist/marketing-ai/pizzamaru
          deploy_one marketing-ai-yogurtpurple marketing-source/dist/marketing-ai/yogurtpurple

          verified=0
          for attempt in $(seq 1 24); do
            ok=1
            for spec in \
              'marketing.ekodi.kr:마케팅AI' \
              'jadam.ekodi.kr:자담치킨' \
              'pizzamaru.ekodi.kr:피자마루' \
              'yogurt.ekodi.kr:요거트퍼플' \
              'jadam.ai.ekodi.kr:자담치킨' \
              'pizzamaru.ai.ekodi.kr:피자마루' \
              'yogurt.ai.ekodi.kr:요거트퍼플'; do
              domain="${spec%%:*}"
              needle="${spec#*:}"
              code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/" || true)
              echo "$domain http=$code attempt=$attempt"
              if [ "$code" != '200' ] \
                 || ! grep -Fq "$needle" /tmp/live.html \
                 || ! grep -Fq 'data-ekodi-workspace-handoff' /tmp/live.html \
                 || ! grep -Fq 'window.EKODI_MARKETING_CONTEXT' /tmp/live.html \
                 || ! grep -Fq 'id="customDomainPanel"' /tmp/live.html \
                 || ! grep -Fq 'https://marketing-api.ekodi.kr' /tmp/live.html \
                 || ! grep -Fq '/api/marketing/domains' /tmp/live.html \
                 || ! grep -Fq '/api/marketing/workspace/resolve?host=' /tmp/live.html \
                 || ! grep -Fq '/api/marketing/store-domains' /tmp/live.html \
                 || ! grep -Fq 'STORE MARKETING AI' /tmp/live.html; then
                ok=0
              fi
            done
            if [ "$ok" -eq 1 ]; then verified=1; break; fi
            sleep 5
          done
          [ "$verified" -eq 1 ]
          curl -L -fsS --connect-timeout 5 --max-time 15 'https://marketing.ekodi.kr/' -o /tmp/live-store-plan.html
          grep -Fq 'data-store-plan-links' /tmp/live-store-plan.html
          grep -Fq "url.searchParams.set('store',store)" /tmp/live-store-plan.html

          for project in marketing-ai marketing-ai-jadam marketing-ai-pizzamaru marketing-ai-yogurtpurple; do
            curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/deployments?env=production&per_page=1" > "/tmp/$project-latest.json"
            PROJECT="$project" TARGET="$sha" python - <<'PY'
          import json, os, sys
          project=os.environ['PROJECT']; target=os.environ['TARGET']
          rows=json.load(open('/tmp/'+project+'-latest.json')).get('result') or []
          if not rows: raise SystemExit(project+' has no production deployment')
          row=rows[0]
          meta=(row.get('deployment_trigger') or {}).get('metadata') or {}
          got=str(meta.get('commit_hash') or '')
          stage=row.get('latest_stage') or {}
          print(project, 'commit=', got, 'stage=', stage.get('status'))
          if got != target: raise SystemExit(project+' commit mismatch')
          if stage.get('status') not in ('success','idle'): raise SystemExit(project+' deployment not successful')
          PY
          done

          trap - ERR
          echo "Marketing AI Pages synchronized successfully at $sha"
