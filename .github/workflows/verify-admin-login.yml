name: Verify Admin Canonical Login Flow

on:
  pull_request:
    paths:
      - 'site-worker.js'
      - 'control-center.html'
      - 'admin-central-handoff.js'
      - 'test/admin-central-login-link.test.mjs'
      - '.github/workflows/verify-admin-login.yml'
  push:
    branches: [main]
    paths:
      - 'site-worker.js'
      - 'control-center.html'
      - 'admin-central-handoff.js'
      - 'test/admin-central-login-link.test.mjs'
      - '.github/workflows/verify-admin-login.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify source contract
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --test test/admin-central-login-link.test.mjs

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live canonical Work admin and apex auth flow with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          auth_url='https://ekodi.kr/auth/?site=admin&direct=1&return_to=https%3A%2F%2Fekodi.kr%2Fadmin%2Fwork'
          for attempt in $(seq 1 5); do
            page_code=$(curl -sS -D /tmp/admin-headers -o /tmp/admin-work.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/admin/work' || true)
            auth_code=$(curl -sS -D /tmp/auth-headers -o /tmp/auth.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$auth_url" || true)
            if [[ "$page_code" == "200" ]] \
              && grep -Fq 'id="centralAdminLogin"' /tmp/admin-work.html \
              && grep -Fq 'admin-central-handoff.js' /tmp/admin-work.html \
              && grep -Fiq 'x-ekodi-route: admin-shell' /tmp/admin-headers \
              && [[ "$auth_code" == "200" ]] \
              && grep -Fiq 'x-ekodi-route: central-auth' /tmp/auth-headers; then
              echo 'Live canonical Work admin login flow verified.'
              exit 0
            fi
            echo "Waiting for live canonical login flow ($attempt/5): page=$page_code auth=$auth_code"
            sleep 4
          done
          echo 'Live canonical Work admin login flow did not become healthy within the bounded retry window.'
          exit 1
