name: Apply Password Reset Feature

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-password-reset-feature.mjs'
      - '.github/workflows/apply-password-reset-feature.yml'

permissions:
  contents: write

concurrency:
  group: ekodi-password-reset-installer
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply reset feature
        run: node scripts/apply-password-reset-feature.mjs
      - name: Validate production sources
        run: |
          node --check auth-worker.js
          node --check control-center.js
          git diff --check
          grep -Fq '/api/password/reset' auth-worker.js
          grep -Fq 'passwordResetToggle' control-center.js
      - name: Commit production change and remove installer
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-password-reset-feature.mjs .github/workflows/apply-password-reset-feature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add secure administrator password recovery'
          git pull --rebase origin main
          git push origin HEAD:main
