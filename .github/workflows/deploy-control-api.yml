name: Deploy Control API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-worker.js'
      - 'auth-worker.js'
      - 'wrangler.api.toml'
      - '.github/workflows/deploy-control-api.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-control-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate control API source
        run: node --check api-worker.js && node --check auth-worker.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy API worker
        run: npm run deploy:api
      - name: Verify API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/health' || true)
            status=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/status' || true)
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$status" | grep -q '"initialized"'; then
              echo 'Control API verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
