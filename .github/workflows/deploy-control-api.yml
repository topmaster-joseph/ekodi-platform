permissions:
  contents: read
  pull-requests: read
  statuses: write

# Generic Control-plane release lane. Conversation changes are owned by the
# Release EKODI Conversation Foundation orchestrator.
concurrency:
  group: "ekodi-control-api-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}"
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.127.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Validate control plane, Core AI Gateway and governance
        run: |
          set -euo pipefail
          for file in api-worker.js platform-maturity-control.js preview-public-projection.js auth-worker.js admin-session-fastpath.js admin-google-auth.js customer-auth.js customer-entry-worker.js tenant-access-authority.js church-reports-control.js mission-control-entry-worker.js realtime-control.js realtime-tenant-registry.js storage-gateway.js canonical-drive-writer.js external-ai-module-gateway.js secure-projection.js traffic-intelligence.js traffic-intelligence-control.js devotional-control.js user-ai-control.js learning-control.js personal-ai-bridge.js ekodi-mcp-gateway.js ai-access-orchestration.js personal-ai-provider-registry.js gemini-provider-adapter.js personal-openai-provider-adapter.js claude-provider-adapter.js user-openai-provider-adapter.js universal-membership.js membership-billing.js generated/user-services.js messenger-operator-control.js ekodi-principal.js messenger-outbox.js messenger-channel-adapters.js device-control.js security-edge.js ai-agent-control.js ai-command-control.js ekodi-command-ledger.js ekodi-pulse-runtime.js ekodi-command-plane.js ekodi-capability-executor.js ekodi-ai-provider-registry.js cloudflare-workers-ai-provider-adapter.js ai-orchestrator-runtime.js anthropic-provider-adapter.js gemini-orchestrator-provider-adapter.js ai-governance-runtime.js ai-resilience-runtime.js core-ai-gateway.js core-api.js openai-provider-adapter.js api-usage-meter.js api-cost-control.js free-tier-resource-governor.js books-control.js books-finance-control.js books-distribution-control.js books-pipeline-control.js books-royalty-control.js affiliate-control.js affiliate-marketplace.js affiliate-provider-feed.js product-identity.js coupang-partners-automation.js offer-registry.js offer-registry-control.js offer-registry-sources.js social-registry-api.js mail-credential-vault.js mail-google-adapter.js mail-control.js external-account-control.js local-commerce-control.js language-automation.js ai-provider-control.js ai-free-quota.js config/language-registry.js config/managed-language-sites.js; do
            node --check "$file"
          done
          node --check scripts/generate-user-service-registry.mjs
          node --check scripts/validate-universal-membership.mjs
          node --check scripts/guarded-worker-release.mjs
          node --check scripts/validate-additive-migrations.mjs
          node --check scripts/validate-ai-mission-governance.mjs
          node --check scripts/validate-security-baseline.mjs
          node --check scripts/verify-ai-collaboration-settings-roundtrip.mjs
          node --check scripts/provision-realtime-sfu.mjs
          node scripts/provision-realtime-sfu.mjs --check
          node scripts/validate-universal-membership.mjs
          node scripts/validate-additive-migrations.mjs migrations
          node scripts/validate-ai-mission-governance.mjs
          node scripts/validate-security-baseline.mjs
          node scripts/validate-storage-ai-contracts.mjs
          node --test test/universal-membership-contract.test.mjs test/device-control-contract.test.mjs test/core-ai-gateway.test.mjs test/external-ai-module-gateway.test.mjs test/ai-orchestrator-runtime.test.mjs test/ekodi-command-plane.test.mjs test/ekodi-capability-executor-fallback.test.mjs test/core-ai-command-plane-gateway.test.mjs test/ekodi-v8-durable-command-plane.test.mjs test/openai-provider-adapter.test.mjs test/cloudflare-workers-ai-provider-adapter.test.mjs test/ai-free-quota.test.mjs test/free-tier-resource-governor.test.mjs test/free-tier-resource-collector.test.mjs test/api-cost-control.test.mjs test/traffic-intelligence.test.mjs test/user-ai-routing-policy.test.mjs test/learning-control.test.mjs test/personal-ai-provider-registry.test.mjs test/personal-ai-bridge.test.mjs test/personal-ai-bridge-migration.test.mjs test/ekodi-mcp-gateway.test.mjs test/oauth-consent-contract.test.mjs test/devotional-control.test.mjs test/mail-control.test.mjs test/local-commerce-control.test.mjs test/affiliate-provider-feed.test.mjs test/mall-product-identity.test.mjs test/ekodi-coupang-mall.test.mjs test/coupang-partners-reporting.test.mjs test/preview-public-projection.test.mjs test/language-automation.test.mjs test/platform-maturity-admin.test.mjs test/personal-finance-control-api-proxy.test.mjs test/realtime-core.test.mjs test/realtime-adaptive-media.test.mjs test/realtime-entitlement.test.mjs test/realtime-admin-bridge.test.mjs test/realtime-recording-management.test.mjs test/realtime-multitenant-live.test.mjs test/realtime-live-collaboration.test.mjs
          bash -n scripts/apply-d1-migrations-with-retry.sh
          grep -Fq 'main = "mission-control-entry-worker.js"' wrangler.api.toml
          grep -Fq 'binding = "LIVE_RECORDINGS_BUCKET"' wrangler.api.toml
          grep -Fq 'binding = "STORAGE"' wrangler.api.toml
          grep -Fq 'service = "ekodi-storage-control"' wrangler.api.toml
          grep -Fq 'OPENAI_MODEL = "gpt-5.6-terra"' wrangler.api.toml
          grep -Fq 'AI_MULTI_PROVIDER_ENABLED = "true"' wrangler.api.toml
          grep -Fq 'EKODI_PROVIDER_WORKERS_AI_ENABLED = "true"' wrangler.api.toml
          grep -Fq 'EKODI_PROVIDER_GEMINI_ENABLED = "true"' wrangler.api.toml
          grep -Fq 'EKODI_PROVIDER_OPENAI_ENABLED = "true"' wrangler.api.toml
          grep -Fq 'EKODI_PROVIDER_ANTHROPIC_ENABLED = "true"' wrangler.api.toml
          grep -Fq 'binding = "PERSONAL_FINANCE"' wrangler.api.toml
          grep -Fq 'service = "ekodi-personal-finance-api"' wrangler.api.toml
          ! grep -Fq 'OPENAI_API_KEY' wrangler.api.toml

  staging:
    environment: development
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve isolated Control staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-auth-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-auth-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build isolated Control staging config
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          cat > wrangler.api.staging.runtime.toml <<EOF
          name = "ekodi-auth-api-staging"
          main = "mission-control-entry-worker.js"
          compatibility_date = "2026-08-12"
          workers_dev = true
          preview_urls = false
          [vars]
          ENVIRONMENT = "staging"
          ADMIN_EMAIL = "topmaster.joseph@gmail.com"
          ADMIN_GOOGLE_BOOTSTRAP_EMAILS = "topmaster.joseph@gmail.com,joseph@ekodi.kr"
          ADMIN_WORKSPACE_DOMAIN = "ekodibiz.kr"
          GOOGLE_CLIENT_ID = "483044030492-j9dml7tsb7vq4a4ud041ttctavlgdskg.apps.googleusercontent.com"
          GOOGLE_IDENTITY_ORIGIN = "https://ekodi-shared-site-staging.ekodi-development.workers.dev"
          AI_PROVIDER = "NONE"
          OPENAI_MODEL = "gpt-5.6-terra"
          EKODI_PROVIDER_WORKERS_AI_ENABLED = "false"
          EKODI_WORKERS_AI_DAILY_CALL_LIMIT = "4"
          ALLOWED_ORIGINS = "https://ekodi-shared-site-staging.ekodi-development.workers.dev,https://ekodi-admin-staging.ekodi-development.workers.dev,http://127.0.0.1:4173,http://localhost:4173"
          [ai]
          binding = "AI"
          [[services]]
          binding = "PERSONAL_FINANCE"
          service = "ekodi-personal-finance-api-staging"
          [observability.logs]
          enabled = true
          invocation_logs = true
          [[ratelimits]]
          name = "AUTH_RATE_LIMITER"
          namespace_id = "3101"
            [ratelimits.simple]
            limit = 20
            period = 60
          [[ratelimits]]
          name = "SENSITIVE_RATE_LIMITER"
          namespace_id = "3102"
            [ratelimits.simple]
            limit = 120
            period = 60
          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-auth-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
      - name: Apply all migrations to isolated Control staging
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config wrangler.api.staging.runtime.toml
      - name: Deploy isolated Control staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.api.staging.runtime.toml
      - name: Verify Personal Finance Control service binding in staging
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://ekodi-auth-api-staging.ekodi-development.workers.dev/api/control/personal-finance'
          code=$(curl -sS -D /tmp/pf-control-staging.headers -o /tmp/pf-control-staging.json -w '%{http_code}' --connect-timeout 5 --max-time 12 "$endpoint" || true)
          if [ "$code" = '401' ] && grep -Fq '"code":"PF_ADMIN_AUTH_REQUIRED"' /tmp/pf-control-staging.json; then
            echo 'Remote Personal Finance staging proxy contract verified.'
          elif [ "$code" = '302' ] && grep -Eiq '^Www-Authenticate:[[:space:]]*Cloudflare-Access' /tmp/pf-control-staging.headers; then
            echo 'Remote Control staging is protected by Cloudflare Access; exact Personal Finance proxy contract will be verified against the same staging runtime locally.'
          else
            echo "Personal Finance staging proxy contract failed: status=$code body=$(cat /tmp/pf-control-staging.json)" >&2
            cat /tmp/pf-control-staging.headers >&2
            exit 1
          fi
      - name: Verify protected staging Google identity boundary
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://ekodi-auth-api-staging.ekodi-development.workers.dev/api/google/config'
          origin='https://ekodi-shared-site-staging.ekodi-development.workers.dev'
          code=$(curl -sS -D /tmp/staging-google.headers -o /tmp/staging-google.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$endpoint" -H "Origin: $origin" || true)
          if [ "$code" = '200' ]; then
            grep -Eiq "^access-control-allow-origin:[[:space:]]*$origin" /tmp/staging-google.headers
            grep -Fq '"clientId":"483044030492-j9dml7tsb7vq4a4ud041ttctavlgdskg.apps.googleusercontent.com"' /tmp/staging-google.json
            grep -Fq '"identityOrigin":"https://ekodi-shared-site-staging.ekodi-development.workers.dev"' /tmp/staging-google.json
          elif [ "$code" = '302' ] && grep -Eiq '^Www-Authenticate:[[:space:]]*Cloudflare-Access' /tmp/staging-google.headers; then
            echo 'Remote staging Control API is protected by Cloudflare Access; exact Google client contract will be verified against the same staging runtime locally.'
          else
            echo "Unexpected staging Google config response: HTTP $code"
            cat /tmp/staging-google.headers
            cat /tmp/staging-google.json
            exit 1
          fi
      - name: Verify security, AI auth boundary and universal membership
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION deployments status --config wrangler.api.staging.runtime.toml --json > /tmp/staging-deployments.json
          # Keep the broad local regression harness deterministic: Wrangler local service bindings can
          # change unrelated route behavior. The Personal Finance binding itself is validated by the
          # deployed staging config, executable proxy unit test, and guarded production probe.
          perl -0pe 's/\n\[\[services\]\]\nbinding = "PERSONAL_FINANCE"\nservice = "ekodi-personal-finance-api-staging"\n/\n/' wrangler.api.staging.runtime.toml > wrangler.api.staging.local-runtime.toml
          npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply DB --local --config wrangler.api.staging.local-runtime.toml >/tmp/local-migrations.log 2>&1
          e2e_token="ai-settings-staging-$(openssl rand -hex 24)"
          e2e_token_hash=$(printf '%s' "$e2e_token" | sha256sum | awk '{print $1}')
          e2e_created=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          e2e_expires=$(date -u -d '+20 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')
          e2e_sql="INSERT INTO admins(email,password_hash,password_salt,birth_hash,birth_salt,role,created_at) VALUES ('ai-settings-e2e@ekodi.local','x','x','x','x','super_admin','$e2e_created') ON CONFLICT(email) DO UPDATE SET role='super_admin'; INSERT OR REPLACE INTO sessions(token_hash,admin_id,expires_at,created_at) SELECT '$e2e_token_hash',id,'$e2e_expires','$e2e_created' FROM admins WHERE email='ai-settings-e2e@ekodi.local';"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute DB --local --config wrangler.api.staging.local-runtime.toml --command "$e2e_sql" >/tmp/ai-settings-e2e-session.log 2>&1
          npx --yes wrangler@$WRANGLER_VERSION dev --local --config wrangler.api.staging.local-runtime.toml --ip 127.0.0.1 --port 8791 > /tmp/control-remote-dev.log 2>&1 &
          runtime_pid=$!
          trap 'kill $runtime_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 'http://127.0.0.1:8791/health' || true)
            if [ "$code" = '200' ]; then ready=1; break; fi
            if ! kill -0 $runtime_pid 2>/dev/null; then cat /tmp/control-remote-dev.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" != '1' ]; then cat /tmp/control-remote-dev.log; exit 1; fi
          staging_origin='https://ekodi-shared-site-staging.ekodi-development.workers.dev'
          staging_google_code=$(curl -sS -D /tmp/local-staging-google.headers -o /tmp/local-staging-google.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'http://127.0.0.1:8791/api/google/config' -H "Origin: $staging_origin")
          test "$staging_google_code" = '200'
          grep -Eiq "^access-control-allow-origin:[[:space:]]*$staging_origin" /tmp/local-staging-google.headers
          grep -Fq '"clientId":"483044030492-j9dml7tsb7vq4a4ud041ttctavlgdskg.apps.googleusercontent.com"' /tmp/local-staging-google.json
          grep -Fq '"identityOrigin":"https://ekodi-shared-site-staging.ekodi-development.workers.dev"' /tmp/local-staging-google.json
          node scripts/verify-ai-collaboration-settings-roundtrip.mjs 'http://127.0.0.1:8791' "$e2e_token" "$staging_origin" > /tmp/ai-settings-roundtrip.json
          node -e "const j=require('/tmp/ai-settings-roundtrip.json');if(!j.ok||!j.auditVerified||j.productionMutation!==false)process.exit(1);console.log('AI collaboration settings staging roundtrip verified: router='+j.routerScoreVersion+' saved='+j.savedRevision+' restored='+j.restoredRevision)"
          for attempt in $(seq 1 18); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/health' || true)
            ai_modules=$(curl -fsS --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/ai-modules/v1/health' || true)
            headers=$(curl -fsSI --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/health' || true)
            devices=$(curl -sS -o /tmp/devices.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/devices' || true)
            ai=$(curl -sS -o /tmp/ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/ai/governance' || true)
            provider=$(curl -sS -o /tmp/provider.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/ai/provider-status' || true)
            user_ai=$(curl -sS -o /tmp/user-ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/user-ai/status' || true)
            learning_catalog=$(curl -sS -o /tmp/learning-catalog.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/learning/catalog' || true)
            learning_progress=$(curl -sS -o /tmp/learning-progress.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/learning/progress' || true)
            membership=$(curl -sS -o /tmp/membership.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/membership/portfolio' || true)
            catalog=$(curl -sS -o /tmp/catalog.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/membership/catalog?site=invest' || true)
            i18n=$(curl -sS -o /tmp/i18n.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/i18n/v1/status?service=community' || true)
            language_admin=$(curl -sS -o /tmp/language-admin.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/language-status' || true)
            maturity_unauth=$(curl -sS -o /tmp/maturity-unauth.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/platform-maturity' || true)
            maturity_admin=$(curl -sS -o /tmp/maturity-admin.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'http://127.0.0.1:8791/api/control/platform-maturity' -H "Authorization: Bearer $e2e_token" || true)
            if printf '%s' "$health" | grep -q '"ok":true' \
              && printf '%s' "$ai_modules" | grep -q '"directProviderStorageAccess":false' \
              && printf '%s' "$ai_modules" | grep -q '"providerTrainingAllowed":false' \
              && printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | grep -q '^strict-transport-security:' \
              && [ "$devices" = '401' ] \
              && [ "$ai" = '401' ] \
              && [ "$provider" = '401' ] \
              && [ "$user_ai" = '401' ] \
              && [ "$learning_catalog" = '200' ] \
              && [ "$learning_progress" = '401' ] \
              && grep -Fq 'ekodi-learning-fabric' /tmp/learning-catalog.json \
              && [ "$membership" = '401' ] \
              && [ "$catalog" = '200' ] \
              && [ "$i18n" = '200' ] \
              && [ "$language_admin" = '401' ] \
              && [ "$maturity_unauth" = '401' ] \
              && [ "$maturity_admin" = '200' ] \
              && grep -Fq '"certificationStatus":"not-claimed"' /tmp/maturity-admin.json \
              && grep -Fq '"publishedLocales":["ko-KR"]' /tmp/i18n.json \
              && grep -Fq '"inheritedDefault":true' /tmp/catalog.json; then
              exit 0
            fi
            if [ "$attempt" = '18' ]; then
              echo "Control staging local verification failed: devices=$devices ai=$ai provider=$provider user_ai=$user_ai learning_catalog=$learning_catalog learning_progress=$learning_progress membership=$membership catalog=$catalog i18n=$i18n language_admin=$language_admin maturity_unauth=$maturity_unauth maturity_admin=$maturity_admin" >&2
              echo 'Local Control runtime tail:' >&2
              tail -n 80 /tmp/control-remote-dev.log >&2 || true
            fi
            sleep 5
          done
          exit 1
      - name: Cleanup staging config
        if: always()
        run: rm -f wrangler.api.staging.runtime.toml wrangler.api.staging.local-runtime.toml

  production:
    needs: [validate, staging]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Provision isolated Mail OAuth and credential secrets
        shell: bash
        run: |
          set -euo pipefail
          oauth_secret="${MAIL_GOOGLE_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET:-}}"
          if [ -n "$oauth_secret" ]; then
            printf '%s' "$oauth_secret" | npx --yes wrangler@${WRANGLER_VERSION} secret put MAIL_GOOGLE_CLIENT_SECRET --config wrangler.api.toml >/dev/null
            echo 'Mail Google OAuth client secret provisioned without printing its value.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mail Google OAuth client secret is not present; Gmail accounts will remain pending_oauth.' >> "$GITHUB_STEP_SUMMARY"
          fi
          names=$(npx --yes wrangler@${WRANGLER_VERSION} secret list --config wrangler.api.toml 2>/dev/null || true)
          if ! printf '%s' "$names" | grep -Fq 'MAIL_CREDENTIAL_KEY'; then
            node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))" | npx --yes wrangler@${WRANGLER_VERSION} secret put MAIL_CREDENTIAL_KEY --config wrangler.api.toml >/dev/null
            echo 'Generated a persistent Mail credential-encryption key in Cloudflare Worker secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record configured AI providers without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          names=$(npx --yes wrangler@${WRANGLER_VERSION} secret list --config wrangler.api.toml 2>/dev/null || true)
          has_secret() { printf '%s' "$names" | grep -Fq "$1"; }
          openai=0; anthropic=0; gemini=0
          if has_secret 'OPENAI_API_KEY'; then openai=1; fi
          if has_secret 'ANTHROPIC_API_KEY'; then anthropic=1; fi
          if has_secret 'GEMINI_API_KEY' || has_secret 'GOOGLE_AI_API_KEY'; then gemini=1; fi
          provider_count=$((openai + anthropic + gemini))
          collaboration_ready=false; sentinel_ready=false
          if [ "$provider_count" -ge 2 ]; then collaboration_ready=true; fi
          if [ "$provider_count" -ge 3 ]; then sentinel_ready=true; fi
          echo "AI_PROVIDER_READY_COUNT=$provider_count" >> "$GITHUB_ENV"
          echo "AI_PROVIDER_COLLABORATION_READY=$collaboration_ready" >> "$GITHUB_ENV"
          echo "AI_PROVIDER_SENTINEL_READY=$sentinel_ready" >> "$GITHUB_ENV"
          echo "AI provider configuration: configured=$provider_count multi_provider_configured=$collaboration_ready independent_sentinel_configured=$sentinel_ready. Runtime health is reported separately. Secret values were not read or printed." >> "$GITHUB_STEP_SUMMARY"
      - name: Provision Cloudflare Realtime SFU if needed
        run: node scripts/provision-realtime-sfu.mjs
      - name: Capture production D1 recovery bookmark
        id: d1_bookmark
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 time-travel info ekodi-auth --config wrangler.api.toml --json > /tmp/bookmark.json
          BOOKMARK=$(node -e "const j=require('/tmp/bookmark.json');const walk=x=>{if(!x||typeof x!=='object')return '';if(typeof x.bookmark==='string')return x.bookmark;for(const v of Object.values(x)){const r=walk(v);if(r)return r}return ''};process.stdout.write(walk(j))")
          test -n "$BOOKMARK"
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"
      - name: Apply production migrations after isolated staging success
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.api.toml "$WRANGLER_VERSION"
      - name: Guarded 0-percent Control candidate then promote
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/control-api.worker.json
      - name: Deploy production routes and Cron triggers
        run: npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.api.toml
      - name: Verify production Control and universal membership boundaries
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/health')
          ai_modules=$(curl -fsS --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/ai-modules/v1/health')
          devices=$(curl -sS -o /tmp/devices.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/devices')
          ai=$(curl -sS -o /tmp/ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/ai/governance')
          ai_v8=$(curl -sS -o /tmp/ai-v8.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/ai/v8/status')
          provider=$(curl -sS -o /tmp/provider.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/ai/provider-status')
          user_ai=$(curl -sS -o /tmp/user-ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/user-ai/status')
          learning_catalog=$(curl -sS -o /tmp/learning-catalog.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/learning/catalog')
          learning_progress=$(curl -sS -o /tmp/learning-progress.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/learning/progress')
          membership=$(curl -sS -o /tmp/membership.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/membership/portfolio')
          catalog=$(curl -sS -o /tmp/catalog.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/membership/catalog?site=invest')
          i18n=$(curl -sS -o /tmp/i18n.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/i18n/v1/status?service=community')
          language_admin=$(curl -sS -o /tmp/language-admin.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/language-status')
          personal_finance=$(curl -sS -o /tmp/personal-finance.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/api/control/personal-finance')
          mcp_tools=$(curl -fsS --connect-timeout 5 --max-time 12 -H 'content-type: application/json' --data-binary '{"jsonrpc":"2.0","id":901,"method":"tools/list","params":{}}' 'https://ekodi.kr/mcp')
          printf '%s' "$mcp_tools" > /tmp/mcp-tools.json
          node -e "const b=require('/tmp/mcp-tools.json');const t=b?.result?.tools?.find(x=>x.name==='ekodi_delegate_command');if(!t||t.ekodiCapability!=='ai.command.delegate'||t.securitySchemes?.[0]?.type!=='oauth2'||t.annotations?.destructiveHint!==false)process.exit(1)"
          mcp_unauth=$(curl -fsS --connect-timeout 5 --max-time 12 -H 'content-type: application/json' --data-binary '{"jsonrpc":"2.0","id":902,"method":"tools/call","params":{"name":"ekodi_delegate_command","arguments":{"goal":"production boundary probe","risk":"normal"}}}' 'https://ekodi.kr/mcp')
          printf '%s' "$mcp_unauth" > /tmp/mcp-unauth.json
          node -e "const b=require('/tmp/mcp-unauth.json');const r=b?.result;if(r?.structuredContent?.authenticated!==false||!String(r?._meta?.['mcp/www_authenticate']?.[0]||'').includes('oauth-protected-resource'))process.exit(1)"
          printf '%s' "$health" | grep -q '"ok":true'
          printf '%s' "$ai_modules" | grep -q '"directProviderStorageAccess":false'
          printf '%s' "$ai_modules" | grep -q '"providerTrainingAllowed":false'
          [ "$devices" = '401' ]
          [ "$ai" = '401' ]
          [ "$ai_v8" = '401' ]
          [ "$provider" = '401' ]
          [ "$user_ai" = '401' ]
          [ "$learning_catalog" = '200' ]
          [ "$learning_progress" = '401' ]
          grep -Fq 'ekodi-learning-fabric' /tmp/learning-catalog.json
          [ "$membership" = '401' ]
          [ "$catalog" = '200' ]
          [ "$i18n" = '200' ]
          [ "$language_admin" = '401' ]
          [ "$personal_finance" = '401' ]
          grep -Fq '"code":"PF_ADMIN_AUTH_REQUIRED"' /tmp/personal-finance.json
          grep -Fq '"publishedLocales":["ko-KR"]' /tmp/i18n.json
          grep -Fq '"inheritedDefault":true' /tmp/catalog.json
      - name: Verify Realtime SFU production health
        run: node scripts/provision-realtime-sfu.mjs --verify
      - name: Record recovery point
        env:
          BOOKMARK: ${{ steps.d1_bookmark.outputs.bookmark }}
        run: |
          echo "D1 recovery bookmark before Control release: $BOOKMARK" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Control API production status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context 'ekodi/control-api-production' \
            --arg description "Control API production deployment: $JOB_STATUS; AI configured=${AI_PROVIDER_READY_COUNT:-0}" \
            --arg target_url "$target_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

# manual rerun 2026-09-08T00:36+09
