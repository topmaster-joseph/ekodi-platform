name: Deploy Control API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'api-worker.js'
      - 'auth-worker.js'
      - 'admin-session-fastpath.js'
      - 'admin-google-auth.js'
      - 'customer-auth.js'
      - 'customer-entry-worker.js'
      - 'device-control.js'
      - 'security-edge.js'
      - 'ai-agent-control.js'
      - 'ai-governance-runtime.js'
      - 'config/ai-mission-governance.json'
      - 'customer-google-prereg.js'
      - 'customer-federated-auth.js'
      - 'customer-member-directory.js'
      - 'books-control.js'
      - 'books-finance-control.js'
      - 'books-distribution-control.js'
      - 'books-pipeline-control.js'
      - 'books-royalty-control.js'
      - 'affiliate-control.js'
      - 'social-registry-api.js'
      - 'migrations/**'
      - '!migrations/*messenger*.sql'
      - 'wrangler.api.toml'
      - 'scripts/guarded-worker-release.mjs'
      - 'scripts/validate-additive-migrations.mjs'
      - 'scripts/validate-ai-mission-governance.mjs'
      - 'scripts/validate-security-baseline.mjs'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'deploy/manifests/control-api.worker.json'
  push:
    branches: [main]
    paths:
      - 'api-worker.js'
      - 'auth-worker.js'
      - 'admin-session-fastpath.js'
      - 'admin-google-auth.js'
      - 'customer-auth.js'
      - 'customer-entry-worker.js'
      - 'device-control.js'
      - 'security-edge.js'
      - 'ai-agent-control.js'
      - 'ai-governance-runtime.js'
      - 'config/ai-mission-governance.json'
      - 'customer-google-prereg.js'
      - 'customer-federated-auth.js'
      - 'customer-member-directory.js'
      - 'books-control.js'
      - 'books-finance-control.js'
      - 'books-distribution-control.js'
      - 'books-pipeline-control.js'
      - 'books-royalty-control.js'
      - 'affiliate-control.js'
      - 'social-registry-api.js'
      - 'migrations/**'
      - '!migrations/*messenger*.sql'
      - 'wrangler.api.toml'
      - 'scripts/guarded-worker-release.mjs'
      - 'scripts/validate-additive-migrations.mjs'
      - 'scripts/validate-ai-mission-governance.mjs'
      - 'scripts/validate-security-baseline.mjs'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'deploy/manifests/control-api.worker.json'

permissions:
  contents: read

# Generic Control-plane release lane. Conversation changes are owned by the
# Release EKODI Conversation Foundation orchestrator.
concurrency:
  group: ekodi-control-api-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate control plane and governance
        run: |
          set -euo pipefail
          for file in api-worker.js auth-worker.js admin-session-fastpath.js admin-google-auth.js customer-auth.js customer-entry-worker.js mission-control-entry-worker.js messenger-operator-control.js ekodi-principal.js messenger-outbox.js messenger-channel-adapters.js device-control.js security-edge.js ai-agent-control.js ai-governance-runtime.js books-control.js books-finance-control.js books-distribution-control.js books-pipeline-control.js books-royalty-control.js affiliate-control.js social-registry-api.js; do
            node --check "$file"
          done
          node --check scripts/guarded-worker-release.mjs
          node --check scripts/validate-additive-migrations.mjs
          node --check scripts/validate-ai-mission-governance.mjs
          node --check scripts/validate-security-baseline.mjs
          node scripts/validate-additive-migrations.mjs migrations
          node scripts/validate-ai-mission-governance.mjs
          node scripts/validate-security-baseline.mjs
          node --test test/device-control-contract.test.mjs
          bash -n scripts/apply-d1-migrations-with-retry.sh
          grep -Fq 'main = "mission-control-entry-worker.js"' wrangler.api.toml

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve isolated Control staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-auth-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-auth-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build isolated Control staging config
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          cat > wrangler.api.staging.runtime.toml <<EOF
          name = "ekodi-auth-api-staging"
          main = "mission-control-entry-worker.js"
          compatibility_date = "2026-08-12"
          workers_dev = true
          preview_urls = false
          [[routes]]
          pattern = "api-staging.ekodi.kr"
          custom_domain = true
          [vars]
          ENVIRONMENT = "staging"
          ADMIN_EMAIL = "topmaster.joseph@gmail.com"
          ADMIN_GOOGLE_BOOTSTRAP_EMAILS = "topmaster.joseph@gmail.com"
          ADMIN_WORKSPACE_DOMAIN = "ekodibiz.kr"
          GOOGLE_CLIENT_ID = "483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com"
          ALLOWED_ORIGINS = "https://admin.ekodi.kr,https://auth.ekodi.kr"
          [observability.logs]
          enabled = true
          invocation_logs = true
          [[ratelimits]]
          name = "AUTH_RATE_LIMITER"
          namespace_id = "3101"
            [ratelimits.simple]
            limit = 20
            period = 60
          [[ratelimits]]
          name = "SENSITIVE_RATE_LIMITER"
          namespace_id = "3102"
            [ratelimits.simple]
            limit = 120
            period = 60
          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-auth-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
      - name: Apply all migrations to isolated Control staging
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config wrangler.api.staging.runtime.toml
      - name: Deploy isolated Control staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.api.staging.runtime.toml
      - name: Verify security boundaries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api-staging.ekodi.kr/health' || true)
            headers=$(curl -fsSI --connect-timeout 5 --max-time 12 'https://api-staging.ekodi.kr/health' || true)
            devices=$(curl -sS -o /tmp/devices.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api-staging.ekodi.kr/api/control/devices' || true)
            ai=$(curl -sS -o /tmp/ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api-staging.ekodi.kr/api/control/ai/governance' || true)
            if printf '%s' "$health" | grep -q '"ok":true' \
              && printf '%s' "$headers" | tr '[:upper:]' '[:lower:]' | grep -q '^strict-transport-security:' \
              && [ "$devices" = '401' ] \
              && [ "$ai" = '401' ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Cleanup staging config
        if: always()
        run: rm -f wrangler.api.staging.runtime.toml

  production:
    needs: [validate, staging]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture production D1 recovery bookmark
        id: d1_bookmark
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 time-travel info ekodi-auth --config wrangler.api.toml --json > /tmp/bookmark.json
          BOOKMARK=$(node -e "const j=require('/tmp/bookmark.json');const walk=x=>{if(!x||typeof x!=='object')return '';if(typeof x.bookmark==='string')return x.bookmark;for(const v of Object.values(x)){const r=walk(v);if(r)return r}return ''};process.stdout.write(walk(j))")
          test -n "$BOOKMARK"
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"
      - name: Apply production migrations after isolated staging success
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.api.toml "$WRANGLER_VERSION"
      - name: Guarded 0-percent Control candidate then promote
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/control-api.worker.json
      - name: Verify production Control boundaries
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -fsS --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/health')
          devices=$(curl -sS -o /tmp/devices.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/control/devices')
          ai=$(curl -sS -o /tmp/ai.json -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://api.ekodi.kr/api/control/ai/governance')
          printf '%s' "$health" | grep -q '"ok":true'
          [ "$devices" = '401' ]
          [ "$ai" = '401' ]
      - name: Record recovery point
        env:
          BOOKMARK: ${{ steps.d1_bookmark.outputs.bookmark }}
        run: |
          echo "D1 recovery bookmark before Control release: $BOOKMARK" >> "$GITHUB_STEP_SUMMARY"
