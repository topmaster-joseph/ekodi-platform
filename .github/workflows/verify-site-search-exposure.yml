name: Verify EKODI Site Search Exposure (SEARCH-EXPOSURE-ALL-001)
# deployment-guardrail: read-only-live-audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  workflow_run:
    workflows: ["Deploy EKODI Shared Site Core"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ekodi-site-search-exposure-audit
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit public user sites (read-only)
        run: node scripts/verify-site-search-exposure.mjs
