name: Verify Health Diagrams Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-health-diagrams-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical Health diagram assets from production
        shell: bash
        run: |
          set -euo pipefail
          base='https://admin.ekodi.kr'
          ok=0
          for attempt in $(seq 1 24); do
            probe="?prod-health-diagrams=${GITHUB_RUN_ID}-${attempt}"
            root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/$probe" || true)
            js_code=$(curl -sS -o /tmp/health.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/system-health-admin.js$probe" || true)
            css_code=$(curl -sS -o /tmp/health.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/system-health-admin.css$probe" || true)
            if [[ "$root_code" == '200' && "$js_code" == '200' && "$css_code" == '200' ]] \
              && grep -Fq 'data-health-flow' /tmp/health.js \
              && grep -Fq 'data-health-state-matrix' /tmp/health.js \
              && grep -Fq 'data-health-bottlenecks' /tmp/health.js \
              && grep -Fq 'data-request-flow' /tmp/health.js \
              && grep -Fq 'data-checkpoint="analytics"' /tmp/health.js \
              && grep -Fq '.health-flow-node' /tmp/health.css \
              && grep -Fq '.health-bottleneck-row' /tmp/health.css \
              && grep -Fq '.health-request-track' /tmp/health.css; then
              echo "Production Health diagrams verified on attempt $attempt."
              ok=1
              break
            fi
            echo "Production diagram assets not promoted yet (attempt $attempt/24, root=$root_code js=$js_code css=$css_code)."
            sleep 5
          done
          test "$ok" -eq 1
