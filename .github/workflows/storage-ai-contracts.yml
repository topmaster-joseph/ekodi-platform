name: Storage and External AI Contracts

on:
  pull_request:
    paths:
      - 'config/storage-policy.json'
      - 'config/external-ai-module-contract.json'
      - 'canonical-drive-writer.js'
      - 'storage-gateway.js'
      - 'storage-worker.js'
      - 'external-ai-module-gateway.js'
      - 'mission-control-entry-worker.js'
      - 'migrations/0039_storage_ai_gateway.sql'
      - 'scripts/validate-storage-ai-contracts.mjs'
      - 'docs/EKODI-STORAGE-LAYER.md'
      - 'docs/EKODI-EXTERNAL-AI-MODULE-SPEC.md'
      - 'wrangler.api.toml'
      - 'wrangler.storage.toml'
      - '.github/workflows/storage-ai-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'config/storage-policy.json'
      - 'config/external-ai-module-contract.json'
      - 'canonical-drive-writer.js'
      - 'storage-gateway.js'
      - 'storage-worker.js'
      - 'external-ai-module-gateway.js'
      - 'mission-control-entry-worker.js'
      - 'migrations/0039_storage_ai_gateway.sql'
      - 'scripts/validate-storage-ai-contracts.mjs'
      - 'wrangler.api.toml'
      - 'wrangler.storage.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check canonical-drive-writer.js
          node --check storage-gateway.js
          node --check storage-worker.js
          node --check external-ai-module-gateway.js
          node --check mission-control-entry-worker.js
          node --check scripts/validate-storage-ai-contracts.mjs
      - name: Contract validation
        run: node scripts/validate-storage-ai-contracts.mjs
