name: Deploy EKODI Docs AI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "my/docs/**"
      - "supabase/functions/document-ai-api/**"
      - "supabase/migrations/*document_workspace*.sql"
      - "test/my-docs-ai.test.mjs"
      - ".github/workflows/deploy-docs-ai.yml"
  push:
    branches: [main]
    paths:
      - "my/docs/**"
      - "supabase/functions/document-ai-api/**"
      - "supabase/migrations/*document_workspace*.sql"
      - "test/my-docs-ai.test.mjs"
      - ".github/workflows/deploy-docs-ai.yml"

permissions:
  contents: read

concurrency:
  group: ekodi-docs-ai-${{ github.event_name == 'pull_request' && format('validate-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
env:
  SUPABASE_CLI_VERSION: "2.116.0"
  PROJECT_REF: renzehysxirjilvdxacv
  DOCUMENT_MIGRATION: supabase/migrations/20260907113000_document_workspace_ai.sql
  DOCUMENT_HEALTH_MIGRATION: supabase/migrations/20260907135500_document_workspace_health.sql
  DOCUMENT_MIGRATION_GLOB: "supabase/migrations/*document_workspace*.sql"
  DOCS_AI_RELEASE: "20260910-docs-ai-5"
  MY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate document contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check my/docs/docs.js
          node --test test/my-docs-ai.test.mjs
          test -f "$DOCUMENT_MIGRATION"
          test -f "$DOCUMENT_HEALTH_MIGRATION"
          grep -Fq 'alter table public.document_files enable row level security' "$DOCUMENT_MIGRATION"
          grep -Fq "workspace_key = ('personal:' || auth.uid()::text)" "$DOCUMENT_MIGRATION"
          grep -Fq 'revoke insert, update, delete on public.document_ai_usage from anon, authenticated' "$DOCUMENT_MIGRATION"
          grep -Fq 'document_workspace_health' "$DOCUMENT_HEALTH_MIGRATION"
          grep -Fq "'contract', 'ekodi.documents.v2'" "$DOCUMENT_HEALTH_MIGRATION"
          grep -Fq 'DAILY_LIMIT' supabase/functions/document-ai-api/index.ts
          grep -Fq 'GEMINI_API_KEY' supabase/functions/document-ai-api/index.ts
          grep -Fq 'OPENAI_API_KEY' supabase/functions/document-ai-api/index.ts
          grep -Fq 'store:false' supabase/functions/document-ai-api/index.ts
          grep -Fq 'const CANONICAL_ORIGIN="https://ekodi.kr"' supabase/functions/document-ai-api/index.ts
          grep -Fq "const RELEASE=\"$DOCS_AI_RELEASE\"" supabase/functions/document-ai-api/index.ts
          grep -Fq 'X-EKODI-Docs-Contract' supabase/functions/document-ai-api/index.ts
          grep -Fq 'auth.getUser()' supabase/functions/document-ai-api/index.ts
          ! grep -Eiq 'drop[[:space:]]+table|truncate[[:space:]]+table' "$DOCUMENT_MIGRATION" "$DOCUMENT_HEALTH_MIGRATION"

  production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Select Supabase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-}"
          [ -n "$token" ] || token="${TOKEN_B:-}"
          [ -n "$token" ] || token="${TOKEN_C:-}"
          [ -n "$token" ] || token="${TOKEN_D:-}"
          if [ -z "$token" ]; then
            echo 'No Supabase deployment credential is configured; switching to verify-only mode.'
            echo 'SUPABASE_DEPLOY_AVAILABLE=false' >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo 'SUPABASE_DEPLOY_AVAILABLE=true' >> "$GITHUB_ENV"
      - name: Apply idempotent private document schema through Management API
        if: env.SUPABASE_DEPLOY_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for migration in $DOCUMENT_MIGRATION_GLOB; do
            echo "Applying $migration"
            jq -Rs '{query:.,read_only:false}' "$migration" > /tmp/docs-migration.json
            code=$(curl -sS -o /tmp/docs-migration-result.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/docs-migration.json)
            if [[ "$code" != '201' ]]; then
              echo "Document migration failed with HTTP $code."
              cat /tmp/docs-migration-result.json
              exit 1
            fi
          done
          echo 'Document schema migrations applied.'
      - name: Deploy document AI function
        if: env.SUPABASE_DEPLOY_AVAILABLE == 'true'
        # The function validates bearer tokens with Supabase Auth so it can return its own CORS-safe 401 contract.
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} functions deploy document-ai-api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verify live schema and canonical function contract
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://$PROJECT_REF.supabase.co/rest/v1/rpc/document_workspace_health"
          health_code=$(curl -sS -o /tmp/docs-health.json -w '%{http_code}' -X POST "$health_url" \
            -H "apikey: $MY_SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}')
          [[ "$health_code" == '200' ]]
          grep -Fq '"ok": true' /tmp/docs-health.json || grep -Fq '"ok":true' /tmp/docs-health.json
          grep -Fq 'ekodi.documents.v2' /tmp/docs-health.json
          grep -Fq '"files": true' /tmp/docs-health.json || grep -Fq '"files":true' /tmp/docs-health.json
          grep -Fq '"versions": true' /tmp/docs-health.json || grep -Fq '"versions":true' /tmp/docs-health.json
          grep -Fq '"usage": true' /tmp/docs-health.json || grep -Fq '"usage":true' /tmp/docs-health.json

          endpoint="https://$PROJECT_REF.supabase.co/functions/v1/document-ai-api"
          canonical_options_code=$(curl -sS -D /tmp/docs-ai-canonical.headers -o /dev/null -w '%{http_code}' -X OPTIONS "$endpoint" \
            -H 'Origin: https://ekodi.kr' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type' || true)
          [[ "$canonical_options_code" =~ ^(200|204)$ ]]
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://ekodi\.kr' /tmp/docs-ai-canonical.headers
          grep -Eiq '^x-ekodi-docs-contract:[[:space:]]*ekodi\.document-ai\.v2' /tmp/docs-ai-canonical.headers
          grep -Eiq "^x-ekodi-docs-release:[[:space:]]*$DOCS_AI_RELEASE" /tmp/docs-ai-canonical.headers

          legacy_options_code=$(curl -sS -D /tmp/docs-ai-legacy.headers -o /dev/null -w '%{http_code}' -X OPTIONS "$endpoint" \
            -H 'Origin: https://my.ekodi.kr' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type' || true)
          [[ "$legacy_options_code" =~ ^(200|204)$ ]]
          ! grep -Eiq '^access-control-allow-origin:[[:space:]]*https://my\.ekodi\.kr' /tmp/docs-ai-legacy.headers

          unauth_code=$(curl -sS -D /tmp/docs-ai-unauth.headers -o /tmp/docs-ai-unauth.json -w '%{http_code}' -X POST "$endpoint" \
            -H 'Origin: https://ekodi.kr' \
            -H 'Content-Type: application/json' \
            --data '{"operation":"proofread","text":"test"}' || true)
          [[ "$unauth_code" == '401' ]]
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://ekodi\.kr' /tmp/docs-ai-unauth.headers
          grep -Eq 'UNAUTHORIZED_NO_AUTH_HEADER|authentication_required' /tmp/docs-ai-unauth.json
          echo "EKODI Docs AI canonical live schema/function verified (deploy_available=${SUPABASE_DEPLOY_AVAILABLE:-false})."
