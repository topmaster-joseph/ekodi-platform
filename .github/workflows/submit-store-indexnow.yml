name: Submit EKODI Public Discovery

on:
  workflow_run:
    workflows: ["Deploy EKODI Shared Site Core"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-public-discovery-main
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate platform discovery contract
        run: |
          set -euo pipefail
          node --check platform-indexnow.js
          node --check public-discovery-registry.js
          node --check scripts/submit-store-indexnow.mjs
          node --test test/store-indexnow.test.mjs
      - name: Notify Naver and IndexNow from Public Registry
        env:
          INDEXNOW_TIMEOUT_MS: '20000'
        run: node scripts/submit-store-indexnow.mjs
