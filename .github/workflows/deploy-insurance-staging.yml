name: EKODI Insurance · Staging

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/insurance-*'
    paths:
      - 'sites/ekodi-insurance/public/**'
      - 'sites/ekodi-insurance/worker.js'
      - 'sites/ekodi-insurance/wrangler.toml'
      - 'sites/ekodi-insurance/package.json'
      - 'sites/ekodi-insurance/test.mjs'
      - '.github/workflows/deploy-insurance-staging.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-insurance-staging
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Insurance UI
        working-directory: sites/ekodi-insurance
        run: npm run check
      - name: Validate free D1 bridge and privacy boundary
        run: |
          set -euo pipefail
          node --check sites/ekodi-insurance/public/server-bridge.js
          node --check sites/ekodi-insurance/worker.js
          grep -Fq 'personalPolicyData' sites/ekodi-insurance/worker.js
          grep -Fq 'browser-local' sites/ekodi-insurance/worker.js
          grep -Fq 'encrypted-d1-on-explicit-handoff' sites/ekodi-insurance/worker.js
          grep -Fq 'insurance-api-staging.ekodi.kr' sites/ekodi-insurance/public/server-bridge.js
          grep -Fq 'shareConsent' sites/ekodi-insurance/public/server-bridge.js
          grep -Fq 'consultation-access-v1' sites/ekodi-insurance/public/server-bridge.js
          ! grep -R -E 'SUPABASE_(SERVICE|SECRET)|PRIVATE_KEY' sites/ekodi-insurance/public sites/ekodi-insurance/worker.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated staging UI Worker
        working-directory: sites/ekodi-insurance
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.toml
      - name: Verify workers.dev staging
        shell: bash
        run: |
          set -euo pipefail
          base='https://ekodi-insurance-staging.topmaster-joseph.workers.dev'
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/insurance.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/" || true)
            bridge_code=$(curl -L -sS -o /tmp/bridge.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/server-bridge.js" || true)
            admin_code=$(curl -L -sS -o /tmp/admin.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/admin" || true)
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$base/health" || true)
            root_title=0; root_bridge=0; bridge_api=0; admin_marker=0; health_mode=0; health_local=0; health_handoff=0
            grep -Fq 'EKODI Insurance' /tmp/insurance.html && root_title=1 || true
            grep -Fq '/server-bridge.js' /tmp/insurance.html && root_bridge=1 || true
            grep -Fq 'insurance-api-staging.ekodi.kr' /tmp/bridge.js && bridge_api=1 || true
            grep -Fq 'STAGING LOCAL ADMIN' /tmp/admin.html && admin_marker=1 || true
            grep -Fq '"mode":"staging-cloudflare-d1-free"' /tmp/health.json && health_mode=1 || true
            grep -Fq '"personalPolicyData":"browser-local"' /tmp/health.json && health_local=1 || true
            grep -Fq '"consultationStorage":"encrypted-d1-on-explicit-handoff"' /tmp/health.json && health_handoff=1 || true
            echo "attempt=$attempt http=[$root_code,$bridge_code,$admin_code,$health_code] markers=[$root_title,$root_bridge,$bridge_api,$admin_marker,$health_mode,$health_local,$health_handoff]"
            if [[ "$root_code" == 200 && "$bridge_code" == 200 && "$admin_code" == 200 && "$health_code" == 200 \
              && "$root_title" == 1 && "$root_bridge" == 1 && "$bridge_api" == 1 && "$admin_marker" == 1 \
              && "$health_mode" == 1 && "$health_local" == 1 && "$health_handoff" == 1 ]]; then
              echo 'EKODI Insurance free-D1 UI staging verified.'
              exit 0
            fi
            sleep 4
          done
          echo '--- root tail ---'; tail -c 1200 /tmp/insurance.html || true
          echo; echo '--- bridge head ---'; head -c 800 /tmp/bridge.js || true
          echo; echo '--- admin head ---'; head -c 800 /tmp/admin.html || true
          echo; echo '--- health ---'; cat /tmp/health.json || true
          exit 1
