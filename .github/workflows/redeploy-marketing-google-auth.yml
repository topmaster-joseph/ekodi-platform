name: Redeploy Marketing Google Auth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/redeploy-marketing-google-auth.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and verify Google-first auth
        working-directory: source
        run: |
          set -euo pipefail
          npm run build
          grep -Fq 'auth.ekodi.kr/?site=marketing' dist/marketing-ai/index.html
          for p in jadam pizzamaru yogurtpurple; do
            grep -Fq 'id="googleCustomerAuth"' "dist/marketing-ai/$p/index.html"
            grep -Fq '>Google 로그인</a>' "dist/marketing-ai/$p/index.html"
            grep -Fq '>기존 로그인</button>' "dist/marketing-ai/$p/index.html"
          done
      - name: Deploy four Pages projects
        working-directory: source
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai --project-name=marketing-ai --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/jadam --project-name=marketing-ai-jadam --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/pizzamaru --project-name=marketing-ai-pizzamaru --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/yogurtpurple --project-name=marketing-ai-yogurtpurple --branch=main
      - name: Verify live custom domains
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"; expected="$2"
            for i in $(seq 1 24); do
              body=$(curl -fsSL --max-time 15 "$url" 2>/dev/null || true)
              if printf '%s' "$body" | grep -Fq "$expected"; then echo "OK $url"; return 0; fi
              sleep 5
            done
            echo "FAILED $url"; return 1
          }
          check 'https://marketing.ekodi.kr/' 'auth.ekodi.kr/?site=marketing'
          check 'https://jadam.ekodi.kr/' 'id="googleCustomerAuth"'
          check 'https://pizzamaru.ekodi.kr/' 'id="googleCustomerAuth"'
          check 'https://yogurtpurple.ekodi.kr/' 'id="googleCustomerAuth"'
