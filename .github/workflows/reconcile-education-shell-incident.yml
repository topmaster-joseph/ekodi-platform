name: Reconcile Education Guarded Shell Release

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: write

concurrency:
  group: ekodi-education-shell-incident-4813
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'topmaster-joseph/ekodi-platform' &&
      github.event.issue.number == 4813 &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'ekodi-education-shell-reconcile'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted, protected main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify owner, exact source SHA, official merge ancestry and Orchestrator receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reconcile-education-shell-incident.mjs
          node scripts/reconcile-education-shell-incident.mjs
