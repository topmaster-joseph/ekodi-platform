name: Redeploy Control on Central Core Change

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core-permission.js'
      - 'core-workflow.js'
      - 'core-evidence.js'
      - 'ekodi-service-manifest.js'
      - 'scripts/validate-central-modules.mjs'
      - '.github/workflows/redeploy-control-on-central-core.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: central-core-control-dispatch
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate central Core modules before release routing
        run: |
          set -euo pipefail
          node --check core-permission.js
          node --check core-workflow.js
          node --check core-evidence.js
          node --check scripts/validate-central-modules.mjs
          node scripts/validate-central-modules.mjs
      - name: Detect native Control push release for the same SHA
        id: dedupe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-control-api.yml/runs?branch=main&event=push&per_page=20")
            if jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha)' <<<"$runs" >/dev/null; then
              echo 'native_control_run=true' >> "$GITHUB_OUTPUT"
              echo "Native Control push run already exists for $GITHUB_SHA; duplicate dispatch suppressed."
              exit 0
            fi
            sleep 2
          done
          echo 'native_control_run=false' >> "$GITHUB_OUTPUT"
      - name: Dispatch existing guarded Control API release
        if: github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.native_control_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-control-api.yml --ref main
