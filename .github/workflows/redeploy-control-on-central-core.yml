name: Redeploy Control on Central Core Change

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Orchestrator-issued source branch'
        required: false
        type: string
      release_task_id:
        description: 'Orchestrator task id'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'core-permission.js'
      - 'core-workflow.js'
      - 'core-evidence.js'
      - 'core-ai-gateway.js'
      - 'ekodi-command-plane.js'
      - 'ekodi-command-ledger.js'
      - 'ekodi-pulse-runtime.js'
      - 'ekodi-capability-executor.js'
      - 'ekodi-capability-ecosystem.js'
      - 'config/capability-registry.json'
      - 'ekodi-service-manifest.js'
      - 'scripts/validate-central-modules.mjs'
      - 'seonammedi-admin-control.js'
      - '.github/workflows/redeploy-control-on-central-core.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: central-core-control-dispatch
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate central Core modules before release routing
        run: |
          set -euo pipefail
          node --check core-permission.js
          node --check core-workflow.js
          node --check core-evidence.js
          node --check scripts/validate-central-modules.mjs
          node scripts/validate-central-modules.mjs
      - name: Detect native Control push release for the same SHA
        id: dedupe
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-control-api.yml/runs?branch=main&event=push&per_page=20")
            if jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha)' <<<"$runs" >/dev/null; then
              echo 'native_control_run=true' >> "$GITHUB_OUTPUT"
              echo "Native Control push run already exists for $GITHUB_SHA; duplicate dispatch suppressed."
              exit 0
            fi
            sleep 2
          done
          echo 'native_control_run=false' >> "$GITHUB_OUTPUT"
      - name: Resolve immutable orchestrator provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.release_branch_ref || '' }}
          INPUT_TASK: ${{ inputs.release_task_id || '' }}
        run: |
          set -euo pipefail
          branch="$INPUT_BRANCH"
          task="$INPUT_TASK"
          if [[ -z "$branch" && "$GITHUB_EVENT_NAME" == 'push' ]]; then
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
            branch=$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // empty' <<<"$prs")
          fi
          if [[ ! "$branch" =~ ^ai/[a-zA-Z0-9._-]+/(orch_[a-zA-Z0-9_-]+)$ ]]; then
            echo "Missing orchestrator-issued merged provenance for $GITHUB_SHA" >&2
            exit 1
          fi
          derived="${BASH_REMATCH[1]}"
          [[ -z "$task" ]] && task="$derived"
          [[ "$task" == "$derived" ]] || { echo 'task/branch provenance mismatch' >&2; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "task=$task" >> "$GITHUB_OUTPUT"
      - name: Dispatch existing guarded Control API release
        if: github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.native_control_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-control-api.yml --ref main -f release_branch_ref='${{ steps.provenance.outputs.branch }}' -f release_task_id='${{ steps.provenance.outputs.task }}'
