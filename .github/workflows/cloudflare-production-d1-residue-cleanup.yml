name: Cloudflare Production D1 Residue Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-d1-residue-cleanup.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify isolation and retire Production D1 staging residues
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          test -n "$DEV_TOKEN"; test -n "$PROD_TOKEN"; test "$DEV_ACCOUNT_ID" != "$PROD_ACCOUNT_ID"

          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/d1/database" -o /tmp/prod-d1.json
          curl -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/d1/database" -o /tmp/dev-d1.json
          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod-workers.json
          jq -e '.success==true' /tmp/prod-d1.json >/dev/null
          jq -e '.success==true' /tmp/dev-d1.json >/dev/null
          jq -e '.success==true' /tmp/prod-workers.json >/dev/null

          targets=(
            ekodi-auth-staging
            ekodi-conversation-control-staging
            ekodi-insurance-control-staging
            ekodi-insurance-staging
            ekodi-mall-staging
            ekodi-marketing-domain-staging
            ekodi-workspace-staging
          )
          dev_required=(
            ekodi-auth-staging
            ekodi-conversation-control-staging
            ekodi-insurance-staging
            ekodi-mall-staging
            ekodi-marketing-domain-staging
            ekodi-workspace-staging
          )

          for name in "${dev_required[@]}"; do
            jq -e --arg n "$name" '.result[]? | select(.name==$n)' /tmp/dev-d1.json >/dev/null || {
              echo "::error::Development counterpart missing: $name"; exit 1;
            }
          done

          mkdir -p /tmp/settings
          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$worker/settings" -o "/tmp/settings/$worker.json"
          done < <(jq -r '.result[]?.id' /tmp/prod-workers.json)

          python3 - <<'PY'
          import glob,json,sys
          dbs=json.load(open('/tmp/prod-d1.json')).get('result') or []
          target_names={
            'ekodi-auth-staging','ekodi-conversation-control-staging','ekodi-insurance-control-staging',
            'ekodi-insurance-staging','ekodi-mall-staging','ekodi-marketing-domain-staging','ekodi-workspace-staging'
          }
          ids={d.get('uuid'):d.get('name') for d in dbs if d.get('name') in target_names}
          refs=[]
          for path in glob.glob('/tmp/settings/*.json'):
              worker=path.rsplit('/',1)[-1][:-5]
              result=json.load(open(path)).get('result') or {}
              for b in result.get('bindings') or []:
                  if b.get('type')!='d1': continue
                  dbid=b.get('id') or b.get('database_id') or b.get('database_id_ref')
                  if dbid in ids: refs.append((worker,b.get('name'),ids[dbid]))
          if refs:
              print('::error::Production Workers still bind target D1 databases: '+repr(refs))
              sys.exit(1)
          print('D1_ISOLATION_VERIFIED=1')
          PY

          deleted=0
          for name in "${targets[@]}"; do
            id=$(jq -r --arg n "$name" '.result[]? | select(.name==$n) | .uuid' /tmp/prod-d1.json | head -1)
            if [[ -z "$id" ]]; then
              echo "SKIP_ALREADY_ABSENT=$name"
              continue
            fi
            meta=$(jq -c --arg n "$name" '.result[]? | select(.name==$n) | {name,uuid,file_size,created_at}' /tmp/prod-d1.json)
            echo "RETIRE_PROD_D1=$meta"
            curl -fsS -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/d1/database/$id" -o /tmp/delete.json
            jq -e '.success==true' /tmp/delete.json >/dev/null
            deleted=$((deleted+1))
          done

          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/d1/database" -o /tmp/after.json
          jq -e '.success==true' /tmp/after.json >/dev/null
          remaining=$(jq -r '[.result[]? | select((.name // "") | test("staging";"i"))] | length' /tmp/after.json)
          echo "DELETED_COUNT=$deleted"
          echo "PRODUCTION_STAGING_D1_REMAINING=$remaining"
          if [[ "$remaining" != 0 ]]; then
            jq -r '.result[]? | select((.name // "") | test("staging";"i")) | "::error::Remaining Production staging D1: \(.name)"' /tmp/after.json
            exit 1
          fi
