name: EKODI Protected Merge Read-Only Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-protected-merge-checks.yml'
      - 'scripts/diagnose-protected-merge-checks.mjs'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Compare GitHub commit statuses, check runs and effective rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-protected-merge-checks.mjs
