name: One-time Cloudflare legacy Git build cleanup

on:
  push:
    branches:
      - ops/cloudflare-git-build-cleanup-20260822
    paths:
      - '.github/workflows/ops-cloudflare-git-build-cleanup.yml'

permissions:
  contents: read
  statuses: write

jobs:
  disconnect-legacy-worker-build-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL: ${{ secrets.CF_EMAIL }}
    steps:
      - name: Verify core credentials are available
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Remove only the legacy ekodi-platform Workers Builds triggers
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          request() {
            local method="$1" url="$2" output="$3"
            shift 3
            curl -sS -o "$output" -w '%{http_code}' -X "$method" "$url" "$@"
          }

          auth_mode=''
          workers_code=$(request GET "${api}/workers/scripts" /tmp/workers.json \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' || true)
          if [[ "$workers_code" == '200' ]]; then
            auth_mode='bearer'
          fi

          if [[ -z "$auth_mode" ]]; then
            key=''
            for candidate in "$CLOUDFLARE_GLOBAL_API_KEY" "$CLOUDFLARE_API_KEY" "$CF_GLOBAL_API_KEY" "$CF_API_KEY"; do
              if [[ -n "$candidate" ]]; then key="$candidate"; break; fi
            done
            email=''
            for candidate in "$CLOUDFLARE_EMAIL" "$CF_EMAIL"; do
              if [[ -n "$candidate" ]]; then email="$candidate"; break; fi
            done
            if [[ -n "$key" && -n "$email" ]]; then
              workers_code=$(request GET "${api}/workers/scripts" /tmp/workers.json \
                -H "X-Auth-Email: ${email}" \
                -H "X-Auth-Key: ${key}" \
                -H 'Content-Type: application/json' || true)
              if [[ "$workers_code" == '200' ]]; then auth_mode='global-key'; fi
            fi
          fi

          if [[ -z "$auth_mode" ]]; then
            echo "No existing repository credential can manage Cloudflare Workers Builds (Workers Scripts read returned HTTP ${workers_code})."
            echo 'No Cloudflare resource was changed.'
            exit 42
          fi

          cf_request() {
            local method="$1" url="$2" output="$3"
            if [[ "$auth_mode" == 'bearer' ]]; then
              request "$method" "$url" "$output" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json'
            else
              request "$method" "$url" "$output" \
                -H "X-Auth-Email: ${email}" \
                -H "X-Auth-Key: ${key}" \
                -H 'Content-Type: application/json'
            fi
          }

          worker_tag=$(jq -r '.result[]? | select(.id == "ekodi-platform") | .tag // empty' /tmp/workers.json | head -n1)
          if [[ -z "$worker_tag" ]]; then
            echo 'No Worker named ekodi-platform exists; no legacy Workers Builds trigger remains for that Worker.'
            exit 0
          fi

          trigger_code=$(cf_request GET "${api}/builds/workers/${worker_tag}/triggers" /tmp/triggers.json || true)
          if [[ "$trigger_code" != '200' ]]; then
            echo "Existing credential can read Workers but cannot manage Workers Builds triggers (HTTP ${trigger_code})."
            echo 'No Cloudflare resource was changed.'
            exit 43
          fi

          mapfile -t trigger_ids < <(jq -r '.result[]? | .trigger_uuid // empty' /tmp/triggers.json)
          if (( ${#trigger_ids[@]} == 0 )); then
            echo 'Worker ekodi-platform has no Workers Builds triggers.'
            exit 0
          fi

          echo "Found ${#trigger_ids[@]} legacy Workers Builds trigger(s) for ekodi-platform. Removing trigger(s) only."
          for trigger_uuid in "${trigger_ids[@]}"; do
            delete_code=$(cf_request DELETE "${api}/builds/triggers/${trigger_uuid}" /tmp/delete.json || true)
            [[ "$delete_code" == '200' ]]
            jq -e '.success == true' /tmp/delete.json >/dev/null
          done

          verify_code=$(cf_request GET "${api}/builds/workers/${worker_tag}/triggers" /tmp/after.json || true)
          [[ "$verify_code" == '200' ]]
          remaining=$(jq '[.result[]?] | length' /tmp/after.json)
          test "$remaining" = '0'
          echo 'Legacy ekodi-platform Workers Builds triggers removed and verified absent.'
      - name: Publish cleanup status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context 'ekodi/cloudflare-git-build-cleanup' \
            --arg description "Legacy Cloudflare Git build cleanup: $JOB_STATUS" \
            --arg target_url "$target_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
