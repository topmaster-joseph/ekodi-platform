name: EKODI Virtualization First Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtualized-policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install rootless execution prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns fuse-overlayfs jq
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
          test "$(id -u)" -ne 0
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = 'true'

      - name: Run EKODI governance and execution contract in isolated container
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=512m \
            --cpus=2 \
            --userns=keep-id \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            docker.io/library/node:24-alpine \
            sh -eu -c '
              node scripts/validate-autonomous-execution-fabric.mjs
              node scripts/validate-generation-readiness.mjs
              node --test test/autonomous-execution-fabric-runtime.test.mjs
            '

      - name: Emit virtualization gate receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ekodi-virtualization-first-gate.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            '{
              schemaVersion: 1,
              generation: 10,
              gate: "EKODI Virtualization First Gate",
              runId: $run_id,
              runAttempt: $run_attempt,
              sourceSha: $sha,
              sourceRef: $ref,
              isolationProfile: "standard",
              executionTechnology: "rootless-podman-oci",
              virtualizationProven: true,
              networkDefaultDenied: true,
              rootFilesystemReadOnly: true,
              capabilitiesDropped: true,
              noNewPrivileges: true,
              privileged: false,
              hostContainerSocketMounted: false,
              productionSecretExposed: false,
              productionMutationPerformed: false,
              authorityExpanded: false
            }' > "$receipt"
          cat "$receipt"

      - name: Upload virtualization gate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ekodi-virtualization-first-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ekodi-virtualization-first-gate.json
          if-no-files-found: error
          retention-days: 30
