name: Finalize EKODI Mall staging Access

on:
  push:
    branches:
      - ops/coupang-secret-sync-20260828
    paths:
      - .github/workflows/finalize-ekodi-mall-access.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ops/coupang-secret-sync-20260828
          fetch-depth: 0

      - name: Make Access enforcement durable and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize-ekodi-mall-access.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Mall staging Access boundary"
          git push origin HEAD:ops/coupang-secret-sync-20260828
