name: Bootstrap EKODI Release Provenance Recovery

on:
  push:
    branches:
      - ai/chatgpt/control-routing-recovery-20261007

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bootstrap-control-routing-provenance
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EKODI_RECOVERY_SOURCE_PR: '3686'
      EKODI_RECOVERY_SOURCE_BRANCH: 'ai/chatgpt/control-routing-recovery-20261007'
      EKODI_RECOVERY_SOURCE_SHA: ${{ github.sha }}
      EKODI_RECOVERY_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout trusted recovery runtime from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Bootstrap recovery event and invoke trusted main recovery script
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const event={
            pull_request:{
              number:Number(process.env.EKODI_RECOVERY_SOURCE_PR),
              title:'fix(control): reserve /control at canonical router and verify production assets',
              head:{
                ref:process.env.EKODI_RECOVERY_SOURCE_BRANCH,
                sha:process.env.EKODI_RECOVERY_SOURCE_SHA,
                repo:{full_name:process.env.GITHUB_REPOSITORY}
              }
            },
            number:Number(process.env.EKODI_RECOVERY_SOURCE_PR),
            sender:{login:process.env.EKODI_RECOVERY_ACTOR}
          };
          fs.writeFileSync('/tmp/ekodi-recovery-event.json',JSON.stringify(event));
          NODE
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH=/tmp/ekodi-recovery-event.json node scripts/recover-release-provenance.mjs
