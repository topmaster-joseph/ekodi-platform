name: Cloudflare Staging Orphan Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-staging-orphan-cleanup.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Delete only staging orphans proven replaced in Development
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_ACCOUNT_ID"
          test -n "$PROD_TOKEN"
          test -n "$DEV_TOKEN"
          test "$PROD_ACCOUNT_ID" != "$DEV_ACCOUNT_ID"

          api='https://api.cloudflare.com/client/v4'
          curl_json() {
            curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -fsS "$@"
          }
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod.json
          curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev.json
          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains.json
          jq -e '.success == true' /tmp/prod.json >/dev/null
          jq -e '.success == true' /tmp/dev.json >/dev/null
          jq -e '.success == true' /tmp/domains.json >/dev/null

          declare -A replacement
          replacement[ekodi-books-social-staging]=ekodi-books-staging
          replacement[ekodi-community-social-staging]=ekodi-community-staging
          replacement[ekodi-shared-site-staging]=ekodi-shared-site-staging

          mkdir -p /tmp/settings
          : > /tmp/safe.txt

          # Snapshot all Production worker settings to detect inbound Service Bindings.
          while IFS= read -r owner; do
            [[ -n "$owner" ]] || continue
            safe_name=$(printf '%s' "$owner" | tr '/:' '__')
            curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$owner/settings" -o "/tmp/settings/$safe_name.json"
            jq -e '.success == true' "/tmp/settings/$safe_name.json" >/dev/null
          done < <(jq -r '.result[]?.id' /tmp/prod.json)

          # Snapshot routes for all Production zones.
          curl_json "${prod_auth[@]}" "$api/zones?account.id=$PROD_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          jq -e '.success == true' /tmp/zones.json >/dev/null
          : > /tmp/routes.ndjson
          while IFS=$'\t' read -r zid zname; do
            [[ -n "$zid" ]] || continue
            curl_json "${prod_auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/zr.json
            jq -e '.success == true' /tmp/zr.json >/dev/null
            jq -c --arg zone "$zname" '.result[]? | {zone:$zone,pattern:.pattern,script:.script}' /tmp/zr.json >> /tmp/routes.ndjson
          done < <(jq -r '.result[]? | [.id,.name] | @tsv' /tmp/zones.json)

          for old in "${!replacement[@]}"; do
            new="${replacement[$old]}"
            if ! jq -e --arg s "$old" '.result[]? | select(.id==$s)' /tmp/prod.json >/dev/null; then
              echo "SKIP: $old already absent from Production"
              continue
            fi
            jq -e --arg s "$new" '.result[]? | select(.id==$s)' /tmp/dev.json >/dev/null || {
              echo "HOLD: $old; Development replacement $new is missing"
              continue
            }

            settings="/tmp/settings/$old.json"
            risky=$(jq '[.result.bindings[]? | select(.type != "assets" and .type != "plain_text")] | length' "$settings")
            domains=$(jq --arg s "$old" '[.result[]? | select((.service // .script // .service_name)==$s)] | length' /tmp/domains.json)
            routes=$(jq -s --arg s "$old" '[.[] | select(.script==$s)] | length' /tmp/routes.ndjson 2>/dev/null || echo 0)
            inbound=0
            for sf in /tmp/settings/*.json; do
              n=$(jq --arg s "$old" '[.result.bindings[]? | select(.type=="service" and ((.service // .service_name)==$s))] | length' "$sf")
              inbound=$((inbound+n))
            done

            if [[ "$risky" == 0 && "$domains" == 0 && "$routes" == 0 && "$inbound" == 0 ]]; then
              echo "$old" >> /tmp/safe.txt
              echo "SAFE: $old -> $new"
            else
              echo "HOLD: $old risky=$risky domains=$domains routes=$routes inbound=$inbound"
            fi
          done

          while IFS= read -r old; do
            [[ -n "$old" ]] || continue
            echo "Deleting Production staging orphan: $old"
            curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$old" -o /tmp/delete.json
            jq -e '.success == true' /tmp/delete.json >/dev/null
          done < /tmp/safe.txt

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/after.json
          jq -e '.success == true' /tmp/after.json >/dev/null
          failed=0
          while IFS= read -r old; do
            [[ -n "$old" ]] || continue
            if jq -e --arg s "$old" '.result[]? | select(.id==$s)' /tmp/after.json >/dev/null; then
              echo "::error::$old still exists in Production"
              failed=1
            else
              echo "VERIFIED_REMOVED=$old"
            fi
          done < /tmp/safe.txt

          remain=$(jq -r '.result[]?.id | select(endswith("-staging") or contains("-staging-"))' /tmp/after.json | wc -l | tr -d ' ')
          echo "PRODUCTION_STAGING_REMAINING=$remain"
          exit "$failed"
