name: Deploy EKODI Shared Site Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-worker.js'
      - 'index.html'
      - 'hub.html'
      - 'trade.html'
      - 'styles.css'
      - 'script.js'
      - 'responsive.css'
      - '_headers'
      - 'config/ecosystem-services.json'
      - 'scripts/ecosystem-registry.mjs'
      - 'scripts/build.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - 'wrangler.site.toml'
      - '.github/workflows/deploy-site-core.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate shared site Worker and release gate
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --check script.js
          node --check scripts/ecosystem-registry.mjs
          node --check scripts/build.mjs
          node --check scripts/guarded-worker-release.mjs
          test -f deploy/manifests/shared-site.worker.json
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Build shared site assets
        run: npm run build
      - name: Candidate at 0%, verify shared routes, promote and auto-rollback on failure
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify every shared-runtime domain family
        shell: bash
        run: |
          set -euo pipefail
          verify_html() { url="$1"; needle="$2"; code=$(curl -L -sS -o /tmp/site-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true); echo "$url -> $code"; [[ "$code" =~ ^[23] ]] && grep -Fq "$needle" /tmp/site-body; }
          verify_mail() { code=$(curl -L -sS -o /tmp/mail-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://mail.ekodi.kr/' || true); [[ "$code" =~ ^[23] ]] && grep -Fq 'EKODI Mail' /tmp/mail-body && grep -Fq 'ekodibiz.kr' /tmp/mail-body && grep -Fq 'ekodi.kr' /tmp/mail-body && grep -Fq '메일 열기' /tmp/mail-body; }
          verify_homepage_registry() { code=$(curl -L -sS -o /tmp/homepage -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true); [[ "$code" =~ ^[23] ]] && grep -Fq 'data-ekodi-service-registry="v1"' /tmp/homepage && grep -Fq 'data-service-id="community"' /tmp/homepage && grep -Fq 'https://community.ekodi.kr' /tmp/homepage && grep -Fq 'data-service-id="work"' /tmp/homepage && grep -Fq 'https://work.ekodi.kr' /tmp/homepage && grep -Fq 'data-service-id="marketing"' /tmp/homepage && grep -Fq 'https://marketing.ekodi.kr' /tmp/homepage; }
          for attempt in $(seq 1 18); do
            if verify_html 'https://ekodi.kr/' 'CONNECTED ECOSYSTEM' && verify_homepage_registry && verify_html 'https://admin.ekodi.kr/' 'EKODI Control Center' && verify_html 'https://auth.ekodi.kr/' 'EKODI 인증센터' && verify_html 'https://pay.ekodi.kr/' 'EKODI Pay' && verify_html 'https://trade.ekodi.kr/' 'EKODI GLOBAL TRADING' && verify_mail; then
              echo 'Shared site Worker, mail lobby and automatic homepage registry verified.'; exit 0
            fi
            sleep 5
          done
          exit 1
