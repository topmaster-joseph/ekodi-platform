name: Deploy EKODI Shared Site Core

on:
  workflow_dispatch:
    inputs:
      sync_domains:
        description: 'Force Cloudflare custom-domain trigger synchronization'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'site-worker.js'
      - 'platform-router-entry-worker.js'
      - 'tax-portal-worker.js'
      - 'tax-service-worker.js'
      - 'finance-entry-worker.js'
      - 'index.html'
      - 'homepage-ambient.css'
      - 'homepage-ambient.js'
      - 'hub.html'
      - 'trade.html'
      - 'styles.css'
      - 'script.js'
      - 'responsive.css'
      - 'admin-shell.html'
      - 'admin-shell.css'
      - 'admin-demand-loader.js'
      - 'admin-menu-registry.js'
      - '_headers'
      - 'auth-site/**'
      - 'marketing-ai-admin.js'
      - 'marketing-ai-admin.css'
      - 'config/ecosystem-services.json'
      - 'scripts/ecosystem-registry.mjs'
      - 'scripts/audit-admin-menu-services.mjs'
      - 'scripts/validate-admin-source.mjs'
      - 'scripts/build.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - 'wrangler.site.toml'
      - '.github/workflows/deploy-site-core.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate current shared site and admin sources
        run: |
          set -euo pipefail
          for f in site-worker.js platform-router-entry-worker.js tax-portal-worker.js tax-service-worker.js finance-entry-worker.js script.js homepage-ambient.js auth-site/auth-workspace-target.js marketing-ai-admin.js admin-demand-loader.js scripts/ecosystem-registry.mjs scripts/build.mjs scripts/guarded-worker-release.mjs; do
            node --check "$f"
          done
          node scripts/validate-admin-source.mjs
          if [ -f scripts/audit-admin-menu-services.mjs ]; then node scripts/audit-admin-menu-services.mjs; fi
          test -f homepage-ambient.css
          test -f marketing-ai-admin.css
          test -f admin-shell.html
          test -f admin-shell.css
          test -f config/ecosystem-services.json
          test -f deploy/manifests/shared-site.worker.json
          grep -Fq '/auth-workspace-target.js' site-worker.js
          grep -Fq '/marketing-ai-admin.js' site-worker.js
          grep -Fq "const LIVE = 'https://marketing.ekodi.kr/';" marketing-ai-admin.js
          grep -Fq 'marketing-ai-user-link' marketing-ai-admin.js
          grep -Fq "styles: ['marketing-ai-admin.css']" admin-demand-loader.js
          grep -Fq "scripts: ['marketing-ai-admin.js']" admin-demand-loader.js
          grep -Fq 'position:fixed!important' admin-shell.css
          grep -Fq '.app>main{padding-top:calc(78px + env(safe-area-inset-top,0px))}' admin-shell.css
          grep -Fq -- '--ekodi-home-header-height' index.html
          if grep -Eq "frame-src[^;]*https://marketing\.ekodi\.kr" site-worker.js; then
            echo 'Marketing public UI must not be embedded in the admin CSP.'
            exit 1
          fi
          for host in ekodi.kr admin.ekodi.kr auth.ekodi.kr tax.ekodi.kr; do
            grep -Fq "pattern = \"$host\"" wrangler.site.toml
          done

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build shared site assets
        run: |
          set -euo pipefail
          npm run build
          cp auth-site/auth-workspace-target.js dist/auth-workspace-target.js
          for f in dist/index.html dist/admin-shell.html dist/admin-shell.css dist/admin-demand-loader.js dist/marketing-ai-admin.js dist/marketing-ai-admin.css dist/ecosystem-services.json dist/auth-workspace-target.js; do
            test -f "$f"
          done
          grep -Fq 'workspace_key:requested' dist/auth-workspace-target.js
          grep -Fq 'serviceOrigins' dist/auth-workspace-target.js
          grep -Fq "button.dataset.section = 'marketing-ai'" dist/marketing-ai-admin.js
          grep -Fq 'marketing-ai-user-link' dist/marketing-ai-admin.js
          if grep -Fq '<iframe' dist/marketing-ai-admin.js; then
            echo 'Marketing public UI must open externally, not inside the admin workspace.'
            exit 1
          fi
          grep -Fq "styles: ['marketing-ai-admin.css']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['marketing-ai-admin.js']" dist/admin-demand-loader.js
          if grep -Fq '<script src="marketing-ai-admin.js"' dist/admin-shell.html || grep -Fq '<link rel="stylesheet" href="marketing-ai-admin.css"' dist/admin-shell.html; then
            echo 'Marketing AI must remain demand-loaded, not part of the admin first path.'
            exit 1
          fi
          grep -Fq 'position:fixed!important' dist/admin-shell.css
          grep -Fq '.app>main{padding-top:calc(78px + env(safe-area-inset-top,0px))}' dist/admin-shell.css
          grep -Fq -- '--ekodi-home-header-height' dist/index.html

      - name: Verify and repair Cloudflare custom-domain attachments
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_SYNC: ${{ inputs.sync_domains }}
        run: |
          set -euo pipefail
          read_domains() {
            curl -fsS --retry 3 --retry-delay 2 \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=shy-thunder-39a4" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          }
          payload=$(read_domains)
          echo "$payload" | jq -e '.success == true' >/dev/null
          needs_sync=false
          for host in ekodi.kr admin.ekodi.kr auth.ekodi.kr tax.ekodi.kr; do
            if ! echo "$payload" | jq -e --arg host "$host" --arg service 'shy-thunder-39a4' '.result[] | select(.hostname == $host and .service == $service)' >/dev/null; then
              echo "Cloudflare Worker domain missing: $host"
              needs_sync=true
            fi
          done
          config_changed=false
          if [ "$GITHUB_EVENT_NAME" = 'push' ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
            if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null | grep -Fxq 'wrangler.site.toml'; then config_changed=true; fi
          fi
          if [ "${FORCE_SYNC:-false}" = 'true' ]; then config_changed=true; fi
          if [ "$needs_sync" = 'true' ] || [ "$config_changed" = 'true' ]; then
            npx --yes wrangler@4.119.0 triggers deploy --config wrangler.site.toml
            payload=$(read_domains)
          fi
          for host in ekodi.kr admin.ekodi.kr auth.ekodi.kr tax.ekodi.kr; do
            echo "$payload" | jq -e --arg host "$host" --arg service 'shy-thunder-39a4' '.result[] | select(.hostname == $host and .service == $service)' >/dev/null \
              || { echo "Required Cloudflare Worker domain is not attached: $host"; exit 1; }
            echo "Verified Cloudflare Worker domain: $host"
          done

      - name: Candidate at 0%, verify routes, promote and auto-rollback on failure
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify admin assets and every registered production service
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            : > /tmp/link-body
            local meta status final title
            meta=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/link-body -w '%{http_code}|%{url_effective}' "$url" || true)
            status=${meta%%|*}
            final=${meta#*|}
            title=$(grep -io '<title>[^<]*</title>' /tmp/link-body | head -1 | sed -E 's#</?title>##Ig' | tr '|' '/' || true)
            [ -n "$title" ] || title='(no title)'
            printf '| %s | %s | %s | %s |\n' "$url" "$status" "$final" "$title" >> "$GITHUB_STEP_SUMMARY"
            printf '%s -> HTTP %s -> %s\n' "$url" "$status" "$final"
            [[ "$status" =~ ^[23] ]]
          }

          printf '## EKODI production link audit\n\n| URL | HTTP | final URL | title |\n|---|---:|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          urls_file=/tmp/ekodi-urls
          node <<'NODE' > "$urls_file"
          const fs=require('node:fs');
          const registry=JSON.parse(fs.readFileSync('config/ecosystem-services.json','utf8'));
          const shell=fs.readFileSync('admin-shell.html','utf8');
          const urls=new Set([
            'https://ekodi.kr/',
            'https://ekodi.kr/history',
            'https://ekodi.kr/mall',
            'https://ekodi.kr/admin',
            'https://admin.ekodi.kr/',
            'https://auth.ekodi.kr/',
            'https://ai.ekodi.kr/',
            'https://tax.ekodi.kr/',
            'https://mail.ekodi.kr/',
            'https://live.ekodi.kr/',
            'https://live.church.ekodi.kr/',
            'https://cloud.ekodi.kr/',
            'https://marketing.ekodi.kr/',
            'https://cgma.ekodi.kr/',
            'https://biz.ekodi.kr/',
            'https://trade.biz.ekodi.kr/',
            'https://pay.ekodi.kr/',
            'https://pay.biz.ekodi.kr/',
            'https://church.ekodi.kr/',
            'https://lab.ekodi.kr/'
          ]);
          for(const service of registry.services||[]) if(service.productionVerified===true && service.url) urls.add(service.url);
          for(const match of shell.matchAll(/href=["'](https:\/\/[^"']+\.ekodi\.kr\/?[^"']*)["']/g)) urls.add(match[1]);
          console.log([...urls].sort().join('\n'));
          NODE

          failed=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            check "$url" || failed=1
          done < "$urls_file"

          for asset in \
            'https://admin.ekodi.kr/admin-shell.css' \
            'https://admin.ekodi.kr/admin-demand-loader.js' \
            'https://admin.ekodi.kr/admin-menu-registry.js' \
            'https://admin.ekodi.kr/marketing-ai-admin.js' \
            'https://auth.ekodi.kr/auth-workspace-target.js'; do
            check "$asset" || failed=1
          done

          exit "$failed"
