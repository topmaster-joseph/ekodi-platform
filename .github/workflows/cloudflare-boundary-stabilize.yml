name: Cloudflare Boundary Stabilize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-boundary-stabilize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Repair Development staging URLs and zone isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          changed = []
          for path in sorted(root.glob('*.yml')):
              if path.name == 'cloudflare-boundary-stabilize.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Staging Worker hostnames must resolve in the Development account namespace.
              text = re.sub(
                  r'([A-Za-z0-9_-]+-staging)\.topmaster-joseph\.workers\.dev',
                  r'\1.ekodi-development.workers.dev',
                  text,
              )

              # A Development account cannot own the Production ekodi.kr zone.
              # Remove only custom-domain blocks whose pattern itself is explicitly staging.
              text = re.sub(
                  r'(?m)^\s*\[\[routes\]\]\s*\n\s*pattern\s*=\s*"[^"]*staging\.ekodi\.kr"\s*\n\s*custom_domain\s*=\s*true\s*\n',
                  '',
                  text,
              )
              text = re.sub(
                  r'(?m)^\s*routes\s*=\s*\[\{\s*pattern\s*=\s*"[^"]*staging\.ekodi\.kr"\s*,\s*custom_domain\s*=\s*true\s*\}\]\s*\n',
                  '',
                  text,
              )

              # Preserve existing Conversation release contract tests: dependency ordering first.
              if path.name == 'release-messenger-investment-functional.yml':
                  text = re.sub(
                      r'(?m)^(  (?:workspace|control|site)-staging:\n)    environment: development\n(    needs: [^\n]+\n)',
                      r'\1\3    environment: development\n',
                      text,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)
                  print('PATCHED', path.name)

          print('PATCHED_FILES=' + str(len(changed)))
          if not changed:
              raise SystemExit('No files changed; stabilization pass unexpectedly empty.')
          PY

      - name: Validate staging boundary statically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text=path.read_text(encoding='utf-8')
              for n,line in enumerate(text.splitlines(),1):
                  if '-staging.topmaster-joseph.workers.dev' in line:
                      failures.append(f'{path.name}:{n}: old Production workers.dev staging namespace')
                  if re.search(r'pattern\s*=\s*"[^"]*staging\.ekodi\.kr"', line):
                      failures.append(f'{path.name}:{n}: Development staging custom domain still targets Production zone')
              # every Worker staging job must stay on Development credentials
              lines=text.splitlines()
              starts=[]
              for i,l in enumerate(lines):
                  m=re.match(r'^  ([A-Za-z0-9_-]*staging[A-Za-z0-9_-]*):\s*$',l)
                  if m: starts.append((i,m.group(1)))
              for idx,(start,name) in enumerate(starts):
                  end=starts[idx+1][0] if idx+1<len(starts) else len(lines)
                  block='\n'.join(lines[start:end])
                  worker=bool(re.search(r'wrangler(?:@[^\s]+)?\s+deploy\b',block)) and 'pages deploy' not in block
                  if worker:
                      for marker in ('environment: development','CLOUDFLARE_DEVELOPMENT_API_TOKEN','46aad4738793fbaca88574832a2ccc0f'):
                          if marker not in block:
                              failures.append(f'{path.name}:{name}: missing {marker}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('STATIC_BOUNDARY=PASS')
          PY

      - name: Re-run Conversation release contract tests
        run: node --test test/conversation-foundation-release.test.mjs test/workspace-platform.test.mjs

      - name: Probe current Business staging contract
        shell: bash
        run: |
          set +e
          base='https://ekodi-business-staging.ekodi-development.workers.dev'
          for item in root health config workspaces snapshot block; do
            case "$item" in
              root) url="$base/"; args=(-L) ;;
              health) url="$base/health"; args=() ;;
              config) url="$base/config.js"; args=() ;;
              workspaces) url="$base/api/workspaces"; args=() ;;
              snapshot) url="$base/api/snapshot"; args=(-H 'content-type: application/json' -d '{"workspace":"jadam"}') ;;
              block) url="$base/api/action-check"; args=(-H 'content-type: application/json' -d '{"action":"transfer_money","workspace":"jadam"}') ;;
            esac
            code=$(curl "${args[@]}" -sS -o "/tmp/business-$item.out" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url")
            echo "BUSINESS_PROBE $item HTTP=$code"
            head -c 500 "/tmp/business-$item.out"; echo
          done
          exit 0

      - name: Commit validated stabilization
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows
          git diff --cached --check
          git diff --cached --name-status --no-renames
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cloudflare): stabilize Development staging boundaries'
          git push origin HEAD:main
