name: Patch Guarded Release Rollback Contract

on:
  push:
    branches: [fix/guarded-release-rollback-contract]
    paths:
      - 'scripts/patch-guarded-release-rollback.mjs'
      - '.github/workflows/patch-guarded-release-rollback.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guarded-release-rollback-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply rollback contract
        run: node scripts/patch-guarded-release-rollback.mjs
      - name: Validate
        run: |
          node --check scripts/guarded-worker-release.mjs
          node -e "JSON.parse(require('fs').readFileSync('deploy/manifests/shared-site.worker.json','utf8'))"
          grep -Fq "verifyAll('', 'rollback')" scripts/guarded-worker-release.mjs
          grep -Fq 'rollbackVerify' deploy/manifests/shared-site.worker.json
          grep -Fq 'rollbackExpect' deploy/manifests/shared-site.worker.json
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/guarded-worker-release.mjs deploy/manifests/shared-site.worker.json
          git commit -m 'fix: separate candidate and rollback release contracts'
          git push origin HEAD:fix/guarded-release-rollback-contract
