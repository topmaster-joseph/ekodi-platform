name: Deploy Central Identity API

on:
  pull_request:
    paths:
      - "supabase/functions/identity-api/**"
      - "test/auth-person-workspace-contract.test.mjs"
      - ".github/workflows/deploy-identity-api.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/identity-api/**"
      - ".github/workflows/deploy-identity-api.yml"
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Approved orchestrator source branch'
        required: true
        type: string
      release_task_id:
        description: 'Approved orchestrator release task'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-identity-api-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate identity origin contract
        shell: bash
        run: |
          set -euo pipefail
          node --test test/auth-person-workspace-contract.test.mjs
          grep -Fq 'const AUTH_ORIGINS=new Set(["https://ekodi.kr"])' supabase/functions/identity-api/index.ts
          grep -Fq 'AUTH_ORIGINS.has(origin)' supabase/functions/identity-api/index.ts
          grep -Fq 'origin_not_allowed' supabase/functions/identity-api/index.ts

  production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      PROJECT_REF: renzehysxirjilvdxacv
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Recover exact orchestrator release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref }}
          REQUESTED_RELEASE_TASK_ID: ${{ inputs.release_task_id }}
        run: |
          set -euo pipefail
          branch="${REQUESTED_RELEASE_BRANCH_REF:-}"
          task="${REQUESTED_RELEASE_TASK_ID:-}"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            branch="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("ai/")))] | sort_by(.merged_at) | last | .head.ref // empty')"
            task=''
          fi
          if [[ "$branch" =~ ^ai/[^/]+/(orch_[A-Za-z0-9_-]+)$ ]]; then
            derived_task="${BASH_REMATCH[1]}"
            if [ -n "$task" ] && [ "$task" != "$derived_task" ]; then
              echo "Release task does not match authorized orchestrator branch" >&2
              exit 1
            fi
            echo "EKODI_RELEASE_BRANCH_REF=$branch" >> "$GITHUB_ENV"
            echo "EKODI_RELEASE_TASK_ID=${task:-$derived_task}" >> "$GITHUB_ENV"
          else
            echo "Missing authoritative orchestrator release provenance" >&2
            exit 1
          fi
      - name: EKODI AI Orchestration Gate
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Validate deployment guardrails
        run: node scripts/validate-deployment-guardrails.mjs
      - name: Select Supabase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-}"
          [ -n "$token" ] || token="${TOKEN_B:-}"
          [ -n "$token" ] || token="${TOKEN_C:-}"
          [ -n "$token" ] || token="${TOKEN_D:-}"
          if [ -z "$token" ]; then
            echo 'No Supabase deployment credential is configured.'
            exit 2
          fi
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Sync dormant Naver/Kakao/Apple login keys (only when provided)
        # Keys only register the adapters. Login stays off until public.identity_providers.enabled
        # is switched on for that provider, so syncing keys never exposes a new login path by itself.
        shell: bash
        env:
          NAVER_LOGIN_CLIENT_ID: ${{ secrets.NAVER_LOGIN_CLIENT_ID }}
          NAVER_LOGIN_CLIENT_SECRET: ${{ secrets.NAVER_LOGIN_CLIENT_SECRET }}
          KAKAO_LOGIN_REST_API_KEY: ${{ secrets.KAKAO_LOGIN_REST_API_KEY }}
          KAKAO_LOGIN_CLIENT_SECRET: ${{ secrets.KAKAO_LOGIN_CLIENT_SECRET }}
          APPLE_LOGIN_SERVICES_ID: ${{ secrets.APPLE_LOGIN_SERVICES_ID }}
          APPLE_LOGIN_TEAM_ID: ${{ secrets.APPLE_LOGIN_TEAM_ID }}
          APPLE_LOGIN_KEY_ID: ${{ secrets.APPLE_LOGIN_KEY_ID }}
          APPLE_LOGIN_PRIVATE_KEY: ${{ secrets.APPLE_LOGIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          if [ -n "${NAVER_LOGIN_CLIENT_ID:-}" ] && [ -n "${NAVER_LOGIN_CLIENT_SECRET:-}" ]; then
            printf 'NAVER_CLIENT_ID=%s\nNAVER_CLIENT_SECRET=%s\n' "$NAVER_LOGIN_CLIENT_ID" "$NAVER_LOGIN_CLIENT_SECRET" >> "$env_file"
          fi
          if [ -n "${KAKAO_LOGIN_REST_API_KEY:-}" ]; then
            printf 'KAKAO_REST_API_KEY=%s\n' "$KAKAO_LOGIN_REST_API_KEY" >> "$env_file"
            if [ -n "${KAKAO_LOGIN_CLIENT_SECRET:-}" ]; then printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_LOGIN_CLIENT_SECRET" >> "$env_file"; fi
          fi
          if [ -n "${APPLE_LOGIN_SERVICES_ID:-}" ] && [ -n "${APPLE_LOGIN_TEAM_ID:-}" ] && [ -n "${APPLE_LOGIN_KEY_ID:-}" ] && [ -n "${APPLE_LOGIN_PRIVATE_KEY:-}" ]; then
            # The .p8 key is multi-line; store it on one line with literal \n (the adapter restores newlines).
            apple_key="$(printf '%s' "$APPLE_LOGIN_PRIVATE_KEY" | awk 'BEGIN{ORS="\\n"}{print}')"
            printf 'APPLE_SERVICES_ID=%s\nAPPLE_TEAM_ID=%s\nAPPLE_KEY_ID=%s\nAPPLE_PRIVATE_KEY=%s\n' "$APPLE_LOGIN_SERVICES_ID" "$APPLE_LOGIN_TEAM_ID" "$APPLE_LOGIN_KEY_ID" "$apple_key" >> "$env_file"
          fi
          if [ -s "$env_file" ]; then
            npx --yes supabase@2.116.0 secrets set --project-ref "$PROJECT_REF" --env-file "$env_file" >/dev/null
            echo "Federated login keys synced: $(cut -d= -f1 "$env_file" | tr '\n' ' ')"
          else
            echo 'No federated login keys provided; Naver/Kakao/Apple stay unregistered.'
          fi
      - name: Deploy identity API
        run: npx --yes supabase@2.116.0 functions deploy identity-api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verify canonical auth origin and reject legacy origin
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://$PROJECT_REF.supabase.co/functions/v1/identity-api/challenge"
          key='sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_'
          origin='https://ekodi.kr'
          code=$(curl -sS -D /tmp/identity.headers -o /tmp/identity.json -w '%{http_code}' -X POST "$endpoint" -H "Origin: $origin" -H "apikey: $key")
          test "$code" = '201'
          grep -Eiq "^access-control-allow-origin:[[:space:]]*$origin" /tmp/identity.headers
          grep -Fq '483044030492-ej1ie2boa4e01lglm75e9q1r6m25pkp2.apps.googleusercontent.com' /tmp/identity.json
          grep -Eq '"nonce":"[a-f0-9]{48}"' /tmp/identity.json
          bad_origin='https://evil.example'
          bad=$(curl -sS -o /tmp/identity-bad.json -w '%{http_code}' -X POST "$endpoint" -H "Origin: $bad_origin" -H "apikey: $key")
          test "$bad" = '403'
          grep -Fq 'origin_not_allowed' /tmp/identity-bad.json
          ready=$(curl -sS -o /tmp/identity-ready.json -w '%{http_code}' "https://$PROJECT_REF.supabase.co/functions/v1/identity-api/providers/readiness" -H "Origin: $origin" -H "apikey: $key")
          test "$ready" = '200'
          grep -Eq '"id":"google","name":"[^"]*","keysInstalled":true,"enabled":true' /tmp/identity-ready.json
          echo "Login path readiness: $(tr -d '\n' < /tmp/identity-ready.json)"
      - name: Prove live Naver/Kakao login paths reach the provider sign-in page
        # For every path that is switched on and has keys installed, issue a real login
        # challenge and follow its authorize URL once. A wrong key, an unregistered redirect
        # URI or a disabled provider login lands on the provider's error page and fails here.
        shell: bash
        run: |
          set -euo pipefail
          key='sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_'
          origin='https://ekodi.kr'
          base="https://$PROJECT_REF.supabase.co/functions/v1/identity-api"
          for provider in kakao naver; do
            if ! grep -Eq "\"id\":\"$provider\",\"name\":\"[^\"]*\",\"keysInstalled\":true,\"enabled\":true" /tmp/identity-ready.json; then
              echo "$provider: not live (keys or switch off) — skipped"; continue
            fi
            code=$(curl -sS -o /tmp/challenge-$provider.json -w '%{http_code}' -X POST "$base/providers/$provider/challenge" -H "Origin: $origin" -H "apikey: $key")
            test "$code" = '201'
            url=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(d.authorizeUrl||""))' /tmp/challenge-$provider.json)
            case "$provider" in
              kakao) expect='https://kauth.kakao.com/oauth/authorize?';;
              naver) expect='https://nid.naver.com/oauth2.0/authorize?';;
            esac
            [[ "$url" == "$expect"* ]] || { echo "::error title=$provider authorize URL::unexpected host"; exit 1; }
            [[ "$url" == *'redirect_uri=https%3A%2F%2Fekodi.kr%2Fauth%2F'* ]] || { echo "::error title=$provider authorize URL::redirect URI mismatch"; exit 1; }
            result=$(curl -sS -o /tmp/authorize-$provider.html -w '%{http_code} %{redirect_url}' "$url") || { echo "::error title=$provider authorize request::curl could not reach the provider"; exit 1; }
            echo "$provider authorize -> $result"
            case "$provider" in
              kakao)
                koe=$(grep -Eo 'KOE[0-9]+' /tmp/authorize-kakao.html | head -1 || true)
                if [[ "$result" != 30[12]* ]] || [[ "$result" == *error* ]] || [ -n "$koe" ]; then
                  echo "Kakao refused the authorize request ${koe:-} (check REST API key, redirect URI and Kakao Login activation)"; exit 1
                fi
                ;;
              naver)
                # Surface a query-free summary as an annotation (logs may be unreadable to agents).
                loc="$(printf '%s' "${result#* }" | sed 's/[?#].*//')"
                tokens="$(grep -Eoi 'redirect_uri_mismatch|invalid_request|invalid_client|unauthorized_client|access_denied|등록되지 않은[^<\"]{0,24}|Callback URL[^<\"]{0,24}|서비스 URL[^<\"]{0,24}|검수[^<\"]{0,24}|권한[^<\"]{0,24}' /tmp/authorize-naver.html | sort -u | head -6 | tr '\n' ';' || true)"
                echo "::notice title=Naver authorize probe::status=${result%% *} location=${loc:-none} markers=${tokens:-none}"
                if grep -Eiq 'invalid|error|오류' /tmp/authorize-naver.html && [[ "$result" != 302* ]]; then echo "::error title=Naver refused the authorize request::status=${result%% *} location=${loc:-none} markers=${tokens:-none}"; exit 1; fi
                ;;
            esac
          done
