name: Supabase Environment Boundary

on:
  pull_request:
    paths:
      - 'config/supabase-environment-boundary.json'
      - 'config/supabase-dev-legacy-drain.json'
      - 'docs/operations/supabase-development-production-boundary.md'
      - 'scripts/validate-supabase-environment-boundary.mjs'
      - '.github/workflows/supabase-environment-boundary.yml'
      - 'supabase/**'
  push:
    branches: [main, development]
    paths:
      - 'config/supabase-environment-boundary.json'
      - 'config/supabase-dev-legacy-drain.json'
      - 'scripts/validate-supabase-environment-boundary.mjs'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: Supabase DEV PROD Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate immutable environment contract
        run: node scripts/validate-supabase-environment-boundary.mjs
      - name: Prohibit production project ref in development-only files
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/development ]; then
            if grep -R --line-number --fixed-strings 'renzehysxirjilvdxacv' supabase/development; then
              echo 'Production Supabase project ref is forbidden under supabase/development.'
              exit 1
            fi
          fi
      - name: Prohibit development project ref in production-only files
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/production ]; then
            if grep -R --line-number --fixed-strings 'lxcxwbdwwojjkgybbqii' supabase/production; then
              echo 'Development Supabase project ref is forbidden under supabase/production.'
              exit 1
            fi
          fi
