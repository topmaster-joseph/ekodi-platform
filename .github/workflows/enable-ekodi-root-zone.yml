name: Repair EKODI Auth and Root Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-ekodi-root-zone.yml'

permissions:
  contents: write

concurrency:
  group: ekodi-auth-root-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Patch authentication resilience and root routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('auth-worker.js')
          text = path.read_text(encoding='utf-8')
          if "    try {\n      await ensureSchema(env.DB);" not in text:
              old = "    await ensureSchema(env.DB);"
              if old not in text:
                  raise SystemExit('auth-worker ensureSchema marker not found')
              text = text.replace(old, "    try {\n      await ensureSchema(env.DB);", 1)
              tail = "    return reply({ error: 'Not found' }, 404);\n  }\n};"
              replacement = """    return reply({ error: 'Not found' }, 404);\n    } catch (error) {\n      console.error('Unhandled auth API error', error);\n      return reply({\n        error: '인증 서버 내부 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',\n        code: 'AUTH_API_ERROR'\n      }, 500);\n    }\n  }\n};"""
              if tail not in text:
                  raise SystemExit('auth-worker tail marker not found')
              text = text.replace(tail, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = """  } catch (error) {\n    loginError.textContent = error.message;\n  } finally {"""
          new = """  } catch (error) {\n    const networkFailure = error instanceof TypeError || error?.message === 'Failed to fetch';\n    loginError.textContent = networkFailure\n      ? '인증 서버 연결 오류입니다. 서버 상태를 확인한 뒤 다시 시도해 주세요.'\n      : error.message;\n  } finally {"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "const networkFailure = error instanceof TypeError" not in text:
              raise SystemExit('script.js login catch marker not found')
          path.write_text(text, encoding='utf-8')

          path = Path('wrangler.site.toml')
          text = path.read_text(encoding='utf-8')
          custom = """\n[[routes]]\npattern = \"ekodi.kr\"\nzone_name = \"ekodi.kr\"\ncustom_domain = true\n\n[[routes]]\npattern = \"www.ekodi.kr\"\nzone_name = \"ekodi.kr\"\ncustom_domain = true\n\n"""
          routed = """\n[[routes]]\npattern = \"ekodi.kr/*\"\nzone_name = \"ekodi.kr\"\n\n[[routes]]\npattern = \"www.ekodi.kr/*\"\nzone_name = \"ekodi.kr\"\n\n"""
          if custom in text:
              text = text.replace(custom, routed, 1)
          elif 'pattern = "ekodi.kr/*"' not in text:
              marker = '[assets]\n'
              if marker not in text:
                  raise SystemExit('wrangler.site.toml assets marker not found')
              text = text.replace(marker, routed + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('books/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('href="https://ekodi.kr"', 'href="https://ekodi.kr/"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched code
        run: |
          npm run check
          npm test
          npm run validate:books

      - name: Commit durable source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add auth-worker.js script.js wrangler.site.toml books/index.html
            git commit -m 'fix: harden auth and route EKODI root through Cloudflare'
            git pull --rebase origin main
            git push
          fi

      - name: Deploy repaired auth API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:api

      - name: Verify auth API, D1 and CORS
        shell: bash
        run: |
          set -euo pipefail
          api='https://ekodi-auth-api.topmaster-joseph.workers.dev'
          origin='https://shy-thunder-39a4.topmaster-joseph.workers.dev'
          for attempt in $(seq 1 12); do
            body=$(mktemp)
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --connect-timeout 5 --max-time 12 -H "Origin: $origin" "$api/api/status" || true)
            echo "status attempt=$attempt http=$code body=$(cat "$body" 2>/dev/null || true)"
            if [ "$code" = '200' ] && grep -q '"initialized"' "$body" && grep -qi "^access-control-allow-origin: $origin" "$headers"; then
              echo 'Auth API, D1 and CORS are healthy.'
              rm -f "$body" "$headers"
              break
            fi
            rm -f "$body" "$headers"
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done

      - name: Prepare existing root DNS for Worker routes
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr&account.id=$CF_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          test -n "$zone_id" || (echo 'ekodi.kr zone not found' && exit 1)

          ensure_proxy() {
            name="$1"
            fallback_type="$2"
            fallback_content="$3"
            records=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100")
            mapfile -t ids < <(printf '%s' "$records" | python -c "import sys,json; d=json.load(sys.stdin); [print(r['id']) for r in d.get('result',[]) if r.get('type') in ('A','AAAA','CNAME')]")
            if [ "${#ids[@]}" -eq 0 ]; then
              payload=$(python -c "import json; print(json.dumps({'type':'$fallback_type','name':'$name','content':'$fallback_content','ttl':1,'proxied':True}))")
              curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records" >/tmp/dns-create.json
              python -c "import json; d=json.load(open('/tmp/dns-create.json')); assert d.get('success') is True; print('created', d['result']['name'], 'proxied=', d['result']['proxied'])"
            else
              for id in "${ids[@]}"; do
                curl -fsS -X PATCH "${auth[@]}" --data '{"proxied":true}' "$api/zones/$zone_id/dns_records/$id" >/tmp/dns-patch.json
                python -c "import json; d=json.load(open('/tmp/dns-patch.json')); assert d.get('success') is True; print('proxied', d['result']['name'], d['result']['type'])"
              done
            fi
          }

          ensure_proxy 'ekodi.kr' 'A' '192.0.2.1'
          ensure_proxy 'www.ekodi.kr' 'CNAME' 'ekodi.kr'

      - name: Deploy root platform and Books
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy:site
          npm run deploy:books

      - name: Verify root portal and Books link
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/' || true)
            www_code=$(curl -L -sS -o /tmp/www.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://www.ekodi.kr/' || true)
            books_code=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
            echo "attempt=$attempt root=$root_code www=$www_code books=$books_code"
            if [[ "$root_code" =~ ^[23] ]] && [[ "$www_code" =~ ^[23] ]] && [[ "$books_code" =~ ^[23] ]] && grep -q 'href="https://ekodi.kr/"' /tmp/books.html; then
              echo 'EKODI root portal and Books navigation are connected.'
              exit 0
            fi
            sleep 5
          done
          echo 'Root/Books verification did not become healthy in time.'
          exit 1
