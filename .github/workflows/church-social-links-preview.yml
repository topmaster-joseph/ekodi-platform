name: Deploy Church Central Social Links

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/social-links-sites-*'
    paths:
      - '.github/workflows/church-social-links-preview.yml'

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Church main
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/ekodi-church
          ref: main
          path: church
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate merged Church Social registry integration
        working-directory: church
        run: |
          set -euo pipefail
          node --check script.js
          grep -Fq 'https://api.ekodi.kr/api/social/registry' script.js
          grep -Fq 'https://social.ekodi.kr/?org=church' script.js
          grep -Fq 'syncChurchSocialLinks' script.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - name: Deploy Church Pages production
        shell: bash
        working-directory: church
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy . --project-name ekodi-church --branch main --commit-dirty=true
      - name: Verify church.ekodi.kr production assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            root=$(curl -L -sS -o /tmp/church.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/' || true)
            script=$(curl -L -sS -o /tmp/church.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://church.ekodi.kr/script.js' || true)
            if [ "$root" = '200' ] && [ "$script" = '200' ] \
              && grep -Fq 'EKODI교회' /tmp/church.html \
              && grep -Fq 'api.ekodi.kr/api/social/registry' /tmp/church.js \
              && grep -Fq 'social.ekodi.kr/?org=church' /tmp/church.js; then
              echo 'Church Social registry production verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
