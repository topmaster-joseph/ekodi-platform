name: Trigger Marketing Channel Integration

on:
  push:
    branches: [main]
    paths:
      - 'marketing-channel-console.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch integration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run integrate-marketing-channel-console.yml --repo topmaster-joseph/ekodi-platform --ref main
