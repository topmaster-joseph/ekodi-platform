          current_has_review=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq "[.labels[].name] | index(\"${review_label}\") != null")
          review_evidence="$(
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[] | .body // empty'
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[] | .body // empty'
