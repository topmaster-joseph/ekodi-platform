name: EKODI Parallel Change Conflict Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ekodi-conflict-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Capture conflict-review snapshot
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          name="${REPOSITORY#*/}"
          snapshot="${RUNNER_TEMP}/ekodi-conflict-guard.json"
          gh api graphql \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  current: pullRequest(number: $number) {
                    number
                    headRefName
                    baseRefName
                    body
                    mergeable
                    mergeStateStatus
                    labels(first: 100) { nodes { name } pageInfo { hasNextPage } }
                    files(first: 100) { nodes { path } pageInfo { hasNextPage } }
                    comments(first: 100) { nodes { body } pageInfo { hasNextPage } }
                    reviews(first: 100) { nodes { body } pageInfo { hasNextPage } }
                  }
                  open: pullRequests(first: 100, states: OPEN) {
                    nodes {
                      number
                      headRefName
                      baseRefName
                      labels(first: 100) { nodes { name } pageInfo { hasNextPage } }
                      files(first: 100) { nodes { path } pageInfo { hasNextPage } }
                    }
                    pageInfo { hasNextPage }
                  }
                }
              }' \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PR_NUMBER" > "$snapshot"
          test -s "$snapshot"

      - name: Detect exact and related changes, review, and integration order
        shell: bash
        run: |
          set -euo pipefail
          node scripts/parallel-change-conflict-guard.mjs \
            --snapshot "${RUNNER_TEMP}/ekodi-conflict-guard.json" \
            --config config/parallel-change-review-scopes.json \
            --pr "$PR_NUMBER" \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --summary "$GITHUB_STEP_SUMMARY"
