name: EKODI Parallel Change Conflict Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-conflict-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Detect overlapping files across open PRs
        shell: bash
        run: |
          set -euo pipefail

          current_files=$(mktemp)
          conflicts=$(mktemp)
          trap 'rm -f "$current_files" "$conflicts"' EXIT

          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' \
            | sort -u > "$current_files"

          : > "$conflicts"

          while IFS=$'\t' read -r other_pr other_branch; do
            [[ -n "$other_pr" ]] || continue
            [[ "$other_pr" != "$PR_NUMBER" ]] || continue

            other_files=$(mktemp)
            overlap=$(mktemp)
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${other_pr}/files?per_page=100" \
              --jq '.[].filename' \
              | sort -u > "$other_files"

            comm -12 "$current_files" "$other_files" > "$overlap"

            if [[ -s "$overlap" ]]; then
              while IFS= read -r file; do
                printf '%s\t%s\t%s\n' "$other_pr" "$other_branch" "$file" >> "$conflicts"
              done < "$overlap"
            fi

            rm -f "$other_files" "$overlap"
          done < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&base=${BASE_REF}&per_page=100" \
              --jq '.[] | [.number, .head.ref] | @tsv'
          )

          {
            echo '## EKODI parallel conflict guard'
            echo "- Current PR: #${PR_NUMBER}"
            echo "- Branch: \`${HEAD_REF}\`"
            echo "- Base: \`${BASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -s "$conflicts" ]]; then
            echo '- Result: no file overlap with other open PRs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '- Result: BLOCKED because another open PR modifies one or more of the same files.'
            echo ''
            echo '| Other PR | Branch | Overlapping file |'
            echo '|---:|---|---|'
            while IFS=$'\t' read -r other_pr other_branch file; do
              printf '| #%s | `%s` | `%s` |\n' "$other_pr" "$other_branch" "$file"
            done < "$conflicts"
            echo ''
            echo 'Central integration must decide merge order. Merge or close the winning PR first, then refresh/rebase the remaining task branch and rerun validation.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo 'Parallel change collision detected. See workflow summary for the overlapping PRs/files.' >&2
          exit 1

      - name: Verify GitHub mergeability signal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mergeable=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable')
          mergeable_state=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')
          {
            echo ''
            echo '### GitHub merge signal'
            echo "- mergeable: \`${mergeable}\`"
            echo "- mergeable_state: \`${mergeable_state}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$mergeable" == 'false' ]]; then
            echo 'GitHub reports an actual merge conflict with the base branch.' >&2
            exit 1
          fi
