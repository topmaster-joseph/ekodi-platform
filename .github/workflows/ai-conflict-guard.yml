          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$mergeable" == 'false' ]]; then
            echo 'GitHub reports an actual merge conflict with the base branch.' >&2
            exit 1
          fi
\t' read -r scope current_scope_files other_scope_files; do
                printf '%s\t%s\t%s\t%s\t%s\n' \
                  "$other_pr" "$other_branch" "$scope" "$current_scope_files" "$other_scope_files" \
                  >> "$semantic_conflicts"
              done < "$semantic_overlap"
            fi
            rm -f "$other_files" "$exact_overlap" "$semantic_overlap"
          done < <(
            jq -r --argjson current "$PR_NUMBER" '.[] | select(.number != $current) | [.number, .headRefName] | @tsv' "$open_pr_snapshot"
          )

          {
            echo '## EKODI parallel conflict guard'
            echo "- Current PR: #${PR_NUMBER}"
            echo "- Branch: \`${HEAD_REF}\`"
            echo "- Base: \`${BASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -s "$exact_conflicts" && ! -s "$semantic_conflicts" ]]; then
