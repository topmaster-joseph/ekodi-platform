name: EKODI Parallel Change Conflict Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-conflict-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Detect overlapping files and integration order
        shell: bash
        run: |
          set -euo pipefail
          current_files=$(mktemp)
          conflicts=$(mktemp)
          trap 'rm -f "$current_files" "$conflicts"' EXIT

          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' \
            | sort -u > "$current_files"

          : > "$conflicts"
          while IFS=$'\t' read -r other_pr other_branch; do
            [[ -n "$other_pr" ]] || continue
            [[ "$other_pr" != "$PR_NUMBER" ]] || continue

            other_files=$(mktemp)
            overlap=$(mktemp)
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${other_pr}/files?per_page=100" \
              --jq '.[].filename' \
              | sort -u > "$other_files"
            comm -12 "$current_files" "$other_files" > "$overlap"

            if [[ -s "$overlap" ]]; then
              while IFS= read -r file; do
                printf '%s\t%s\t%s\n' "$other_pr" "$other_branch" "$file" >> "$conflicts"
              done < "$overlap"
            fi
            rm -f "$other_files" "$overlap"
          done < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls?state=open&base=${BASE_REF}&per_page=100" \
              --jq '.[] | [.number, .head.ref] | @tsv'
          )

          {
            echo '## EKODI parallel conflict guard'
            echo "- Current PR: #${PR_NUMBER}"
            echo "- Branch: \`${HEAD_REF}\`"
            echo "- Base: \`${BASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -s "$conflicts" ]]; then
            echo '- Result: no file overlap with other open PRs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          priority_label='integration-order-approved'
          approved_count=0
          approved_winner=''
          conflict_prs=$( { printf '%s\n' "$PR_NUMBER"; cut -f1 "$conflicts"; } | sort -nu )
          while IFS= read -r candidate_pr; do
            [[ -n "$candidate_pr" ]] || continue
            has_priority=$(gh api "repos/${REPOSITORY}/pulls/${candidate_pr}" \
              --jq "[.labels[].name] | index(\"${priority_label}\") != null")
            if [[ "$has_priority" == 'true' ]]; then
              approved_count=$((approved_count + 1))
              approved_winner="$candidate_pr"
            fi
          done <<< "$conflict_prs"

          {
            echo '- Result: overlapping files detected.'
            echo ''
            echo '| Other PR | Branch | Overlapping file |'
            echo '|---:|---|---|'
            while IFS=$'\t' read -r other_pr other_branch file; do
              printf '| #%s | `%s` | `%s` |\n' "$other_pr" "$other_branch" "$file"
            done < "$conflicts"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$approved_count" -eq 1 && "$approved_winner" == "$PR_NUMBER" ]]; then
            echo "- Integration order: current PR is the single centrally approved winner via \`${priority_label}\`." | tee -a "$GITHUB_STEP_SUMMARY"
            echo '- Result: ALLOWED to merge first. Every overlapping open PR must refresh/rebase on main after this winner merges and rerun validation.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$approved_count" -gt 1 ]]; then
            echo "Multiple overlapping PRs carry \`${priority_label}\`; central integration order is ambiguous." | tee -a "$GITHUB_STEP_SUMMARY" >&2
          elif [[ "$approved_count" -eq 1 ]]; then
            echo "Central integration winner is PR #${approved_winner}; current PR #${PR_NUMBER} must wait and refresh after the winner merges." | tee -a "$GITHUB_STEP_SUMMARY" >&2
          else
            echo "No overlapping PR has the \`${priority_label}\` central integration approval." | tee -a "$GITHUB_STEP_SUMMARY" >&2
          fi
          echo 'Parallel change collision remains blocked. Central integration must choose exactly one winner, then refresh/rebase remaining PRs.' | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
      - name: Verify GitHub mergeability signal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mergeable=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable')
          mergeable_state=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')
          {
            echo ''
            echo '### GitHub merge signal'
            echo "- mergeable: \`${mergeable}\`"
            echo "- mergeable_state: \`${mergeable_state}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$mergeable" == 'false' ]]; then
            echo 'GitHub reports an actual merge conflict with the base branch.' >&2
            exit 1
          fi
