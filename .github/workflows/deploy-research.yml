name: EKODI Research protected validation and release

on:
  pull_request:
    paths:
      - 'research/**'
      - 'research-worker.js'
      - 'test/research-platform.test.mjs'
      - 'wrangler.research.toml'
      - 'wrangler.research.staging.toml'
      - 'platform-route-registry.js'
      - 'platform-boundaries.json'
      - 'ekodi-service-manifest.js'
      - 'deploy/manifests/research.worker.json'
      - '.github/workflows/deploy-research.yml'
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Exact EKODI Orchestrator-issued ai/<agent>/orch_<task-id> branch'
        required: true
        type: string
      release_task_id:
        description: 'Matching authoritative orchestrator task id'
        required: true
        type: string
      release_sha:
        description: 'Exact protected-main merged SHA'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: ekodi-research-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'protected-production' }
  cancel-in-progress: ${{ github.event_name == 'pull_request' }

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Research syntax, contract, isolation and functional tests
        run: |
          set -euo pipefail
          node --check research-worker.js
          node --check research/app.js
          node --check research/planner.js
          node --check ekodi-service-manifest.js
          node --check platform-route-registry.js
          node --test test/research-platform.test.mjs
          node scripts/validate-platform-boundaries.mjs
          node scripts/constitution-check.mjs
          node -e "JSON.parse(require('fs').readFileSync('deploy/manifests/research.worker.json','utf8'))"
          grep -Fq "id:'research'" ekodi-service-manifest.js
          grep -Fq 'ekodi.kr/research*' wrangler.research.toml
  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-research-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require EKODI Orchestrator release provenance
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Verify isolated development credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated Research staging
        run: npx --yes wrangler@$WRANGLER_VERSION deploy --config wrangler.research.staging.toml
      - name: Verify stage health, public home and private fail-closed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code=$(curl -sS -L -o /tmp/research.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health=$(curl -sS -o /tmp/research-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            private=$(curl -sS -o /tmp/research-private.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/api/projects" || true)
            if [[ "$code" == "200" && "$health" == "200" && "$private" == "503" ]] &&
               grep -Fq 'EKODI Research' /tmp/research.html &&
               grep -Fq '"phase":"foundation"' /tmp/research-health.json &&
               grep -Fq '"privateDocuments":false' /tmp/research-health.json &&
               grep -Fq 'research_storage_not_configured' /tmp/research-private.json; then
              echo 'Isolated Research staging functional and fail-closed checks passed.'
              exit 0
            fi
            sleep 4
          done
          echo 'Isolated Research staging verification failed.' >&2
          exit 1

  production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require matching protected main and approved orchestrator-origin PR
        env:
          GH_TOKEN: ${{ github.token }
          REQUESTED_BRANCH: ${{ inputs.release_branch_ref }
          REQUESTED_TASK: ${{ inputs.release_task_id }
          REQUESTED_SHA: ${{ inputs.release_sha }
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]] || exit 1
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$REQUESTED_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$REQUESTED_BRANCH" =~ ^ai/[a-z0-9][a-z0-9._-]{0,31}/orch_[a-z0-9][a-z0-9_-]{15,120}$ ]] || exit 1
          [[ "$REQUESTED_BRANCH" == */"$REQUESTED_TASK" ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg branch "$REQUESTED_BRANCH" '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == $branch)] | length >= 1'
      - name: Require authoritative Orchestrator release gate
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Guarded release, canaries and automatic rollback
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/research.worker.json
      - name: Production checks on canonical path
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 'https://ekodi.kr/research/health' | grep -Fq '"service":"ekodi-research"'
          curl -fsS --max-time 15 'https://ekodi.kr/research/' | grep -Fq 'EKODI Research'
          private=$(curl -sS -o /tmp/research-private.json -w '%{http_code}' --max-time 15 'https://ekodi.kr/research/api/projects')
          [[ "$private" == "503" ]] || exit 1
          grep -Fq 'research_storage_not_configured' /tmp/research-private.json
