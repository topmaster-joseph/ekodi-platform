name: EKODI Orchestrated PR Convergent Merge

on:
  push:
    branches:
      - 'ai/*/orch_*'
  workflow_dispatch:
  # Reuse this same protected release lane after an owner's genuine re-review.
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read
  actions: write

# Per-branch group (owner decision 2026-10-20). GitHub keeps one *pending* run
# per concurrency group and a newer pending run cancels the older one, so a
# repo-wide group silently dropped other PRs' convergence (12 of 28 runs
# cancelled on 2026-10-19). Merges and update-branch are pinned to exact head
# SHAs, every post-merge deploy has its own production concurrency group, and
# runs of the same branch still never overlap. The continuity watchdog remains
# the safety net for cancelled, timed-out or never-started runs.
concurrency:
  group: ekodi-orchestrated-merge-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  converge:
    # Never run privileged PR code from a foreign repository or unapproved
    # review. Normal issued orchestrator push/dispatch still uses receipt gate.
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.review.user.login == 'topmaster-joseph' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'ai/'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      EKODI_PR_REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
      EKODI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Wait for verified head checks, recover merge status drift, and merge
        run: node scripts/converge-orchestrated-pr-merge.mjs
