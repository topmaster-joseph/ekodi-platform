name: EKODI Orchestrated PR Convergent Merge

on:
  push:
    branches:
      - 'ai/*/orch_*'

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ekodi-orchestrated-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Wait for verified head checks, recover merge status drift, and merge
        run: node scripts/converge-orchestrated-pr-merge.mjs
