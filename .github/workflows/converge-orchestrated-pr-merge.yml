name: EKODI Orchestrated PR Convergent Merge

on:
  push:
    branches:
      - 'ai/*/orch_*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: read
  actions: write

# Per-branch group: GitHub keeps one *pending* run per concurrency group and a
# newer pending run cancels the older one, so a repo-wide group silently dropped
# other PRs' convergence (12 of 28 runs cancelled on 2026-10-19). Merges and
# update-branch are pinned to exact head SHAs, so cross-PR serialization is not
# needed for safety; runs of the same branch still never overlap.
concurrency:
  group: ekodi-orchestrated-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Wait for verified head checks, recover merge status drift, and merge
        run: node scripts/converge-orchestrated-pr-merge.mjs
