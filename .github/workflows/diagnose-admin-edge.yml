name: Diagnose Admin Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-admin-edge.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare routing and redirect state
        shell: bash
        run: |
          set -u
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr&account.id=$CF_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "zone_id=$zone_id"

          echo '=== DNS admin.ekodi.kr ==='
          curl -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=admin.ekodi.kr&per_page=100" | python -m json.tool || true

          echo '=== Worker zone routes containing admin ==='
          curl -sS "${auth[@]}" "$api/zones/$zone_id/workers/routes" | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([r for r in (d.get('result') or []) if 'admin' in str(r.get('pattern',''))], ensure_ascii=False, indent=2))" || true

          echo '=== Worker custom domains containing admin ==='
          curl -sS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/workers/domains/records" | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([r for r in (d.get('result') or []) if 'admin' in str(r.get('hostname','')) or 'admin' in str(r.get('zone_name',''))], ensure_ascii=False, indent=2))" || true

          for phase in http_request_dynamic_redirect http_request_redirect; do
            echo "=== ruleset phase: $phase ==="
            curl -sS "${auth[@]}" "$api/zones/$zone_id/rulesets/phases/$phase/entrypoint" | python -m json.tool || true
          done

          echo '=== legacy page rules ==='
          curl -sS "${auth[@]}" "$api/zones/$zone_id/pagerules?status=active&per_page=100" | python -m json.tool || true

          echo '=== HTTP root, no follow ==='
          curl -sS --max-redirs 0 -D - -o /dev/null --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true
          echo '=== HTTP control-center, no follow ==='
          curl -sS --max-redirs 0 -D - -o /dev/null --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/control-center.html' || true
          echo '=== HTTP admin alias, no follow ==='
          curl -sS --max-redirs 0 -D - -o /dev/null --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/admin' || true
