name: EKODI Insurance · Release Candidate CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/insurance-release-*'
    paths:
      - 'sites/ekodi-insurance/**'
      - 'supabase/functions/insurance-api/**'
      - 'insurance-admin.js'
      - 'insurance-admin.css'
      - 'control-center-features.js'
      - 'scripts/build.mjs'
      - '.github/workflows/insurance-*.yml'

permissions:
  contents: read

jobs:
  integrated-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate customer Insurance app
        working-directory: sites/ekodi-insurance
        run: npm run check

      - name: Validate Insurance admin integration
        run: |
          set -euo pipefail
          node --check insurance-admin.js
          node --check control-center-features.js
          node --check scripts/build.mjs
          grep -Fq 'loadInsurance' control-center-features.js
          grep -Fq '/api/insurance/admin/consultations' insurance-admin.js
          grep -Fq '고객의 전체 보험계약·청구기록' insurance-admin.js
          grep -Fq 'insurance-admin.js' scripts/build.mjs
          grep -Fq 'insurance-admin.css' scripts/build.mjs
          npm run build
          test -f dist/insurance-admin.js
          test -f dist/insurance-admin.css

      - name: Type-check privacy-first Insurance API
        working-directory: supabase/functions/insurance-api
        run: deno check --config deno.json index.ts

      - name: Verify API privacy and handoff contract
        run: |
          set -euo pipefail
          f='supabase/functions/insurance-api/index.ts'
          for marker in 'store:false' 'INSURANCE_CONTACT_KEY' 'AES-GCM' '[고유식별정보 가림]' '[연락처 가림]' 'consultation_share_consent_required' 'insurance_audit_events' 'admin.consultation.viewed' 'consultation.revoked'; do
            grep -Fq "$marker" "$f"
          done
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path('supabase/functions/insurance-api/index.ts').read_text()
          if re.search(r"OPENAI_API_KEY\s*=\s*['\"][A-Za-z0-9_-]{16,}", text):
              sys.exit('Hardcoded OpenAI API key detected')
          PY

      - name: Prepare local Supabase auth mocks
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated;
          SQL

      - name: Apply Insurance schema and explicit privileges
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f sites/ekodi-insurance/sql/001_insurance_platform.sql
          psql -v ON_ERROR_STOP=1 -f sites/ekodi-insurance/sql/002_insurance_privileges.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id) values
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');
          insert into public.insurance_staff(user_id,role)
          values ('33333333-3333-4333-8333-333333333333','admin');
          SQL

      - name: Verify RLS owner and staff boundaries
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          insert into public.insurance_policies(user_id,company,product,monthly_premium)
          values ('11111111-1111-4111-8111-111111111111','TEST','OWNER POLICY',10000);
          do $$ begin if (select count(*) from public.insurance_policies) <> 1 then raise exception 'owner policy read failed'; end if; end $$;
          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',false);
          do $$ begin if (select count(*) from public.insurance_policies) <> 0 then raise exception 'cross-user leak'; end if; end $$;
          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub','33333333-3333-4333-8333-333333333333',false);
          do $$ begin if (select count(*) from public.insurance_policies) <> 0 then raise exception 'staff policy-ledger leak'; end if; end $$;
          reset role;
          SQL
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          insert into public.insurance_consultation_requests(user_id,contact_name,contact_ciphertext,ai_summary)
          values ('11111111-1111-4111-8111-111111111111','Bypass','plaintext','bypass');
          SQL
          then
            echo 'Direct consultation insert unexpectedly succeeded'
            exit 1
          else
            echo 'Direct consultation insert correctly blocked.'
          fi

      - name: Verify public isolated staging still healthy
        run: |
          set -euo pipefail
          base='https://ekodi-insurance-staging.topmaster-joseph.workers.dev'
          root=$(curl -L -fsS "$base/")
          admin=$(curl -L -fsS "$base/admin")
          health=$(curl -fsS "$base/health")
          printf '%s' "$root" | grep -Fq 'EKODI Insurance'
          printf '%s' "$admin" | grep -Fq 'STAGING LOCAL ADMIN'
          printf '%s' "$health" | grep -Fq '"aiChat":true'
          printf '%s' "$health" | grep -Fq '"humanHandoffQueue":true'
          printf '%s' "$health" | grep -Fq '"externalAiProvider":false'

      - name: Verify no production route in Insurance staging Worker config
        run: |
          set -euo pipefail
          grep -Fq 'workers_dev = true' sites/ekodi-insurance/wrangler.toml
          if grep -Eq '^routes?\s*=' sites/ekodi-insurance/wrangler.toml; then
            echo 'Production/custom route detected in staging config'
            exit 1
          fi
