name: Request EKODI Mall Shared Site Deployment

on:
  workflow_dispatch:
  pull_request:
    paths: &mall_paths
      - 'mall.html'
      - 'mall.css'
      - 'mall.js'
      - '.github/workflows/release-ekodi-mall.yml'
  push:
    branches: [main]
    paths: *mall_paths

permissions:
  actions: write
  contents: read

concurrency:
  group: request-ekodi-mall-shared-site-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate canonical Mall source
        shell: bash
        run: |
          set -euo pipefail
          node --check mall.js
          grep -Fq '<link rel="canonical" href="https://ekodi.kr/mall">' mall.html
          if grep -Eq 'https://(ekodi-mall\.pages\.dev|mall\.ekodi\.kr)' mall.html mall.js 2>/dev/null; then
            echo 'Legacy Mall public URL detected in release source.'
            exit 1
          fi

      - name: Enforce request-only ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'guarded-worker-release\.mjs|wrangler(@[^ ]+)? +deploy|npm +run +deploy:site' .github/workflows/release-ekodi-mall.yml
          grep -Fq 'gh workflow run deploy-site-core.yml' .github/workflows/release-ekodi-mall.yml
          echo 'Mall workflow validates and requests only; deploy-site-core.yml remains the sole production writer.'

  request:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Request canonical shared-site deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-site-core.yml --ref main -f sync_domains=false
          echo 'Deployment requested. deploy-site-core.yml is the only production owner.'
