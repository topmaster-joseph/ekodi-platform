name: Request EKODI Mall Shared Site Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mall.html'
      - 'mall.css'
      - 'mall.js'
      - 'config/ekodi-service-urls.json'
      - '.github/workflows/release-ekodi-mall.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: request-ekodi-mall-shared-site-deployment
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate canonical Mall source
        shell: bash
        run: |
          set -euo pipefail
          node --check mall.js
          grep -Fq 'https://ekodi.kr/mall' config/ekodi-service-urls.json
          if grep -Eq 'https://(ekodi-mall\.pages\.dev|mall\.ekodi\.kr)' mall.html mall.js 2>/dev/null; then
            echo 'Legacy Mall public URL detected in release source.'
            exit 1
          fi

      - name: Request canonical shared-site deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-site-core.yml --ref main -f sync_domains=false
          echo 'Deployment requested. deploy-site-core.yml is the only production owner.'
