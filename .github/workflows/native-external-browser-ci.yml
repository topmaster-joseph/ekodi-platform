name: EKODI Native External Browser Contract

on:
  pull_request:
    paths:
      - 'scripts/ekodi-owned-youtube-browser.mjs'
      - 'test/ekodi-owned-youtube-browser.test.mjs'
      - 'config/native-external-browser-policy.json'
      - 'docs/native-external-browser.md'
      - '.github/workflows/native-external-browser-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ekodi-owned-youtube-browser.mjs'
      - 'test/ekodi-owned-youtube-browser.test.mjs'
      - 'config/native-external-browser-policy.json'
      - 'docs/native-external-browser.md'
      - '.github/workflows/native-external-browser-ci.yml'

permissions:
  contents: read

jobs:
  native-browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate native external provider adapter
        run: |
          node --check scripts/ekodi-owned-youtube-browser.mjs
          node --test test/ekodi-owned-youtube-browser.test.mjs
      - name: Verify existing background browser isolation is unchanged
        run: |
          node scripts/validate-background-browser-worker.mjs
