name: Validate Admin AI Control Plane

on:
  pull_request:
    paths: &control_plane_paths
      - '.github/workflows/deploy-admin-control-plane.yml'
      - 'admin-ai-control-plane.js'
      - 'admin-ai-governor.js'
      - 'admin-secret-generator.js'
      - 'scripts/build.mjs'
      - 'site-worker.js'
      - 'wrangler.site.toml'
      - 'deploy/manifests/shared-site.worker.json'
  push:
    branches: [main]
    paths: *control_plane_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Admin AI control plane and build contract
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-ai-control-plane.js
          node --check admin-ai-governor.js
          node --check admin-secret-generator.js
          npm run build
          test -f dist/admin-secret-generator.js
          test -f dist/ai-ops-admin.js
          grep -Fq 'EKODIAdminAIControlPlane' dist/admin-secret-generator.js
          grep -Fq 'EKODIAdminAIGovernor' dist/admin-secret-generator.js
          grep -Fq '다시 조회' dist/admin-secret-generator.js
          grep -Fq 'Worker 목록이 비어 있습니다. Cloudflare Account ID와 Workers 읽기 권한을 확인하세요.' dist/admin-secret-generator.js
          grep -Fq 'API Token의 Account/Zone/Workers 읽기 권한' dist/admin-secret-generator.js
      - name: Enforce validation-only ownership
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          ! grep -Eq 'guarded-worker-release\.mjs|wrangler(@[^ ]+)? +deploy|npm +run +deploy:site|gh +workflow +run +deploy-site-core\.yml' .github/workflows/deploy-admin-control-plane.yml
          echo 'Shared-site production ownership remains with deploy-site-core.yml.'
