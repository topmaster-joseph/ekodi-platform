name: Deploy EKODI Education

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Exact EKODI Orchestrator-issued release branch'
        required: true
        type: string
      release_task_id:
        description: 'Exact EKODI Orchestrator task id paired with the branch'
        required: true
        type: string
      release_sha:
        description: 'Exact protected main merge SHA approved for this release'
        required: true
        type: string
  pull_request:
    paths:
      - 'education/**'
      - 'education-worker.js'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'canonical-surface-router.js'
      - 'wrangler.site.toml'
      - 'wrangler.site-staging.toml'
      - 'my/life-journey.js'
      - 'test/education-platform.test.mjs'
      - 'test/my-life-journey.test.mjs'
      - 'wrangler.education.toml'
      - 'wrangler.education.staging.toml'
      - 'deploy/manifests/education.worker.json'
      - '.github/workflows/deploy-education.yml'
  push:
    branches: [main]
    paths:
      - 'education/**'
      - 'education-worker.js'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'canonical-surface-router.js'
      - 'wrangler.site.toml'
      - 'wrangler.site-staging.toml'
      - 'my/life-journey.js'
      - 'test/education-platform.test.mjs'
      - 'test/my-life-journey.test.mjs'
      - 'wrangler.education.toml'
      - 'wrangler.education.staging.toml'
      - 'deploy/manifests/education.worker.json'
      - '.github/workflows/deploy-education.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ekodi-education-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Education contracts
        run: |
          set -euo pipefail
          node --check education-worker.js
          node --check education/app.js
          node --check ekodi-service-manifest.js
          node --test test/education-platform.test.mjs test/my-life-journey.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('platform-boundaries.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('deploy/manifests/education.worker.json','utf8'))"
          grep -Fq 'EKODI Education' education/index.html
          grep -Fq 'ADMISSION · SOURCE FIRST' education/admission/index.html
          grep -Fq 'STUDY · CONTINUITY' education/study/index.html
          grep -Fq "id:'edu'" ekodi-service-manifest.js
          grep -Fq "authMode:'client'" ekodi-service-manifest.js
          grep -Fq '"education"' platform-boundaries.json

  staging:
    environment: development
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-education-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy isolated Education staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.education.staging.toml
      - name: Verify staging surfaces and isolation
        shell: bash
        run: |
          set -euo pipefail
          access_code=$(curl -sS -D /tmp/edu-stage-access-headers -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
          access_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print $2; exit}' /tmp/edu-stage-access-headers)
          if [[ "$access_code" =~ ^30[12378]$ ]] && [[ "$access_location" =~ ^https://([A-Za-z0-9-]+\.)*cloudflareaccess\.com/cdn-cgi/access/login/ ]]; then
            echo 'EKODI Education staging is isolated behind Cloudflare Access; public content verification is intentionally unavailable without an Access identity.'
            exit 0
          fi
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/edu-stage-headers -o /tmp/edu-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            admission=$(curl -L -sS -o /tmp/edu-stage-admission.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/admission" || true)
            study=$(curl -L -sS -o /tmp/edu-stage-study.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/study" || true)
            health=$(curl -sS -o /tmp/edu-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            config=$(curl -sS -o /tmp/edu-stage-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/config.js" || true)
            if [[ "$root" == '200' && "$admission" == '200' && "$study" == '200' && "$health" == '200' && "$config" == '200' ]] \
              && grep -Fq 'EKODI Education' /tmp/edu-stage.html \
              && grep -Fq 'ADMISSION · SOURCE FIRST' /tmp/edu-stage-admission.html \
              && grep -Fq 'STUDY · CONTINUITY' /tmp/edu-stage-study.html \
              && grep -Fq '"service":"ekodi-education"' /tmp/edu-stage-health.json \
              && grep -Fq '"submissionExecution":false' /tmp/edu-stage-health.json \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/edu-stage-health.json \
              && grep -Fq '"dataEnabled":false' /tmp/edu-stage-config.js \
              && grep -Eiq '^x-ekodi-shell: v2' /tmp/edu-stage-headers; then
              echo 'EKODI Education isolated staging verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Confirm final-approved merged release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ inputs.release_branch_ref }}
          REQUESTED_TASK: ${{ inputs.release_task_id }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF_NAME" == 'main' ]] || { echo 'Production release must run on protected main'; exit 1; }
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$REQUESTED_SHA" == "$GITHUB_SHA" ]] || { echo 'Exact main merge SHA mismatch; release remains blocked'; exit 1; }
            [[ "$REQUESTED_BRANCH" =~ ^ai/[a-z0-9][a-z0-9._-]{0,31}/orch_[a-z0-9][a-z0-9_-]{15,120}$ ]] || { echo 'Orchestrator-issued branch required'; exit 1; }
            [[ "$REQUESTED_TASK" == "${REQUESTED_BRANCH##*/}" ]] || { echo 'Orchestrator task and branch differ'; exit 1; }
            associated=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              | jq --arg branch "$REQUESTED_BRANCH" '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == $branch)] | length')
            [[ "$associated" =~ ^[0-9]+$ && "$associated" -ge 1 ]] || { echo 'No merged PR for this exact orchestrator branch and SHA'; exit 1; }
            echo "EKODI_RELEASE_BRANCH_REF=$REQUESTED_BRANCH" >> "$GITHUB_ENV"
            echo "EKODI_RELEASE_TASK_ID=$REQUESTED_TASK" >> "$GITHUB_ENV"
            RELEASE_SHA="$REQUESTED_SHA" ORCHESTRATOR_BRANCH="$REQUESTED_BRANCH" GITHUB_TOKEN="$GH_TOKEN" \
              node scripts/preflight-merged-release.mjs
          else
            [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_NAME" == 'main' ]] || { echo 'Unexpected Education deployment event'; exit 1; }
            # The existing CI/release gate authenticates main push through its merged-PR association.
          fi
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate AI bootcamp native verification harness
        run: node --check scripts/verify-education-bootcamp-native.mjs
      - name: Wait for Shell and central auth Education contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            shell_code=$(curl -sS -o /tmp/edu-manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/shell/manifest.json' || true)
            auth_code=$(curl -sS -o /tmp/edu-client-auth.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/auth/client-auth.js' || true)
            if [[ "$shell_code" == '200' && "$auth_code" == '200' ]] \
              && grep -Fq '"id":"edu"' /tmp/edu-manifest.json \
              && grep -Fq '"authMode":"client"' /tmp/edu-manifest.json \
              && grep -Fq 'manifestRealm' /tmp/edu-client-auth.js; then
              echo 'Education Shell/Auth contract is live.'
              break
            fi
            if [[ "$attempt" == '24' ]]; then echo 'Education Shell/Auth contract is not live; deployment blocked.'; exit 1; fi
            sleep 5
          done
      - name: Reconcile Education production hostname trigger
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.education.toml
      - name: Bootstrap or guarded release
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.education.toml --json > /tmp/edu-deployments.log 2>&1; then
            echo 'Stable Education Worker exists; using guarded release.'
            node scripts/guarded-worker-release.mjs --manifest deploy/manifests/education.worker.json
          elif grep -Eq 'This Worker does not exist|has no deployments|code: 10007' /tmp/edu-deployments.log; then
            echo 'No Education production Worker exists; bootstrapping verified source.'
            npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.education.toml
          else
            cat /tmp/edu-deployments.log
            exit 1
          fi
      - name: Verify real Education production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/edu-headers -o /tmp/edu.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/' || true)
            admission=$(curl -L -sS -o /tmp/edu-admission.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/admission' || true)
            study=$(curl -L -sS -o /tmp/edu-study.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study' || true)
            health=$(curl -sS -o /tmp/edu-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/health' || true)
            config=$(curl -sS -o /tmp/edu-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/config.js' || true)
            admin=$(curl -sS -o /dev/null -D /tmp/edu-admin-headers -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/admin' || true)
            admin_redirect=false
            case "$admin" in 301|302|303|307|308) admin_redirect=true;; esac
            if [[ "$root" == '200' && "$admission" == '200' && "$study" == '200' && "$health" == '200' && "$config" == '200' && "$admin_redirect" == 'true' ]] \
              && grep -Fq 'EKODI Education' /tmp/edu.html \
              && grep -Fq 'ADMISSION · SOURCE FIRST' /tmp/edu-admission.html \
              && grep -Fq 'STUDY · CONTINUITY' /tmp/edu-study.html \
              && grep -Fq '"service":"ekodi-education"' /tmp/edu-health.json \
              && grep -Fq '"dataMode":"production"' /tmp/edu-health.json \
              && grep -Fq '"submissionExecution":false' /tmp/edu-health.json \
              && grep -Fq '"dataEnabled":true' /tmp/edu-config.js \
              && grep -Eiq '^x-ekodi-shell: v2' /tmp/edu-headers \
              && grep -Eiq '^location: https://ekodi\.kr/admin/?' /tmp/edu-admin-headers; then
              classroom=$(curl -L -sS -o /tmp/edu-bootcamp.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study/ai-bootcamp/' || true)
              catalog=$(curl -L -sS -o /tmp/edu-catalog.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study/ai-bootcamp/catalog.js' || true)
              classroom_js=$(curl -L -sS -o /tmp/edu-classroom.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study/ai-bootcamp/classroom.js' || true)
              classroom_css=$(curl -L -sS -o /tmp/edu-classroom.css -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study/ai-bootcamp/classroom.css' || true)
              classroom_csv=$(curl -L -sS -o /tmp/edu-sample.csv -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://edu.ekodi.kr/study/ai-bootcamp/data/sample.csv' || true)
              if [[ "$classroom" == 200 && "$catalog" == 200 && "$classroom_js" == 200 && "$classroom_css" == 200 && "$classroom_csv" == 200 ]] \
                && grep -Fq '/study/ai-bootcamp/' /tmp/edu-study.html \
                && grep -Fq 'id="presentDialog"' /tmp/edu-bootcamp.html \
                && grep -Fq 'AI로 바꾸는 대학의 일' /tmp/edu-bootcamp.html \
                && grep -Fq 'syntheticOnly' /tmp/edu-catalog.js \
                && grep -Fq 'makeSlides' /tmp/edu-classroom.js \
                && grep -Fq '.present-dialog' /tmp/edu-classroom.css \
                && grep -Fq '만족도평균_가상' /tmp/edu-sample.csv; then
                echo 'EKODI Education production verified including actual AI bootcamp HTML and four same-origin assets.'
              else
                echo "Education bootcamp contract missing: classroom=$classroom catalog=$catalog js=$classroom_js css=$classroom_css csv=$classroom_csv" >&2
                exit 1
              fi
              exit 0
            fi
            echo "Education verify attempt=$attempt root=$root admission=$admission study=$study health=$health config=$config admin=$admin"
            grep -Ei '^(x-ekodi-shell|location):' /tmp/edu-headers /tmp/edu-admin-headers || true
            head -c 300 /tmp/edu-config.js || true
            echo
            sleep 5
          done
          exit 1
      - name: Install isolated EKODI Chromium verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify actual Education classroom on desktop and mobile with EKODI-owned Chromium
        run: node scripts/verify-education-bootcamp-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekodi-education-native-${{ github.run_id }}
          path: artifacts/education-native/
          retention-days: 7
      - name: Publish Education production status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'ekodi/education-production' --arg description "EKODI Education production deployment: $JOB_STATUS" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
