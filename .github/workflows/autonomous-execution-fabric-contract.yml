name: EKODI Autonomous Execution Fabric Contract

on:
  pull_request:
    paths:
      - 'governance/architecture/ekodi-autonomous-execution-fabric.v1.json'
      - 'config/autonomous-execution-fabric-policy.json'
      - 'config/virtualized-execution-policy.json'
      - 'evidence/runtime/autonomous-execution-fabric/**'
      - 'scripts/validate-autonomous-execution-fabric.mjs'
      - 'scripts/validate-virtualized-execution-policy.mjs'
      - '.github/workflows/autonomous-execution-fabric-contract.yml'
  push:
    branches: [main]
    paths:
      - 'governance/architecture/ekodi-autonomous-execution-fabric.v1.json'
      - 'config/autonomous-execution-fabric-policy.json'
      - 'config/virtualized-execution-policy.json'
      - 'evidence/runtime/autonomous-execution-fabric/**'
      - 'scripts/validate-autonomous-execution-fabric.mjs'
      - 'scripts/validate-virtualized-execution-policy.mjs'
      - '.github/workflows/autonomous-execution-fabric-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate constitutional execution-fabric contract
        run: |
          node scripts/validate-autonomous-execution-fabric.mjs
          node scripts/validate-virtualized-execution-policy.mjs
      - name: Assert production readiness is not claimed by partial runtime proof
        shell: bash
        run: |
          set -euo pipefail
          state=$(jq -r '.activation.currentState' governance/architecture/ekodi-autonomous-execution-fabric.v1.json)
          production=$(jq -r '.runtimeEvidence.autonomousProductionReadinessProven' governance/architecture/ekodi-autonomous-execution-fabric.v1.json)
          test "$state" = 'nonproduction_runtime_proven_activation_incomplete'
          test "$production" = 'false'
          echo 'Contract validated: non-production isolation is proven, production autonomy remains gated.'
