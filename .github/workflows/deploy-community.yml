name: Deploy EKODI Community

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'community/**'
      - 'community-worker.js'
      - 'wrangler.community.toml'
      - '.github/workflows/deploy-community.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-community-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Community source
        run: |
          set -euo pipefail
          node --check community-worker.js
          node --check community/app.js
          node --check community/social-links.js
          grep -Fq 'EKODI Community' community/index.html
          grep -Fq 'community-api' community/app.js
          grep -Fq '<script src="/social-links.js" defer></script>' community/index.html
          grep -Fq 'https://api.ekodi.kr/api/social/registry' community/social-links.js
          grep -Fq "'community':{name:'EKODI Community'" auth-site/client-auth.js
          grep -Fq "returnTo:'https://community.ekodi.kr/'" auth-site/client-auth.js
          grep -Fq "open:true,kind:'community'" auth-site/client-auth.js
          grep -Fq "site==='community'" auth-site/auth-router.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy Community Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.community.toml
      - name: Verify Community production hostname and Social assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/community.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://community.ekodi.kr/' || true)
            social_code=$(curl -L -sS -o /tmp/community-social.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://community.ekodi.kr/social-links.js' || true)
            health_code=$(curl -sS -o /tmp/community-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://community.ekodi.kr/health' || true)
            if [[ "$root_code" == "200" ]] && [[ "$social_code" == "200" ]] && [[ "$health_code" == "200" ]] \
              && grep -Fq 'EKODI Community' /tmp/community.html \
              && grep -Fq '/social-links.js' /tmp/community.html \
              && grep -Fq 'api.ekodi.kr/api/social/registry' /tmp/community-social.js \
              && grep -Fq '"socialRegistry":true' /tmp/community-health.json; then
              echo 'EKODI Community production and Social assets verified.'
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              echo 'Community production verification failed.'
              exit 1
            fi
            sleep 5
          done
      - name: Verify Community central auth realm semantically
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            client_code=$(curl -sS -o /tmp/community-client-auth.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/client-auth.js' || true)
            router_code=$(curl -sS -o /tmp/community-auth-router.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/auth-router.js' || true)
            if [[ "$client_code" == "200" ]] && [[ "$router_code" == "200" ]] \
              && grep -Fq "'community':{name:'EKODI Community'" /tmp/community-client-auth.js \
              && grep -Fq "returnTo:'https://community.ekodi.kr/'" /tmp/community-client-auth.js \
              && grep -Fq "open:true,kind:'community'" /tmp/community-client-auth.js \
              && grep -Fq "site==='community'" /tmp/community-auth-router.js; then
              echo 'EKODI Community central auth realm verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Community central auth verification failed.'
          exit 1
