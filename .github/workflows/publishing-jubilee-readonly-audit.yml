name: EKODI Jubilee Publishing Readonly Inventory

# Manual, main-only verification of private publication-project counts.
# NEVER emits owner UUID, auth session, project IDs or manuscript bytes.
on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Exact EKODI Orchestrator released source branch'
        required: true
        type: string
      release_task_id:
        description: 'Exact EKODI Orchestrator release task ID'
        required: true
        type: string

permissions:
  contents: read

env:
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}

concurrency:
  group: ekodi-publishing-readonly-inventory
  cancel-in-progress: false

jobs:
  count-author-projects:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLISHING_JUBILEE_AUTHOR_USER_ID: ${{ secrets.PUBLISHING_JUBILEE_AUTHOR_USER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check EKODI orchestrator release identity
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Verify aggregate-only D1 audit tests
        run: node --test test/jubilee-publishing-d1-readonly-audit.test.mjs
      - name: Production private project count (SELECT only; no IDs)
        run: node scripts/jubilee-publishing-d1-readonly-audit.mjs
