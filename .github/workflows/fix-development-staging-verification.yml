name: Fix Development Staging Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-development-staging-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate corrected workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/generated-workflows
          python - <<'PY'
          from pathlib import Path

          names = [
              'deploy-control-api.yml',
              'deploy-finance.yml',
              'deploy-marketing-domain-api.yml',
          ]
          for name in names:
              src = Path('.github/workflows') / name
              out = Path('ops/generated-workflows') / name
              text = src.read_text(encoding='utf-8')
              broken = '>/tmp/local-migrations.log 2>&1\\n          npx --yes wrangler@'
              fixed = '>/tmp/local-migrations.log 2>&1\n          npx --yes wrangler@'
              if text.count(broken) != 1:
                  raise SystemExit(f'{name}: expected exactly one malformed local-verification newline, found {text.count(broken)}')
              text = text.replace(broken, fixed, 1)
              if '\\n          npx --yes wrangler@' in text:
                  raise SystemExit(f'{name}: malformed literal newline remains')
              out.write_text(text, encoding='utf-8')
              print(f'Generated {out}')
          PY
          grep -Fq 'd1 migrations apply DB --local' ops/generated-workflows/deploy-control-api.yml
          grep -Fq 'dev --local' ops/generated-workflows/deploy-control-api.yml
      - name: Commit corrected staged blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/generated-workflows/deploy-control-api.yml ops/generated-workflows/deploy-finance.yml ops/generated-workflows/deploy-marketing-domain-api.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'chore(ops): correct Development verification workflow blobs'
          git push origin HEAD:main
