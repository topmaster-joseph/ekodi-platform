name: Validate EKODI Ecosystem Registry

on:
  workflow_dispatch:
  pull_request:
    paths: &registry_paths
      - 'config/ecosystem-services.json'
      - 'config/user-ui-dna.json'
      - 'scripts/ecosystem-registry.mjs'
      - 'scripts/build.mjs'
      - 'index.html'
      - 'homepage-ambient.css'
      - 'homepage-ambient.js'
      - 'deploy/manifests/shared-site.worker.json'
      - '.github/workflows/deploy-ecosystem-registry.yml'
  push:
    branches: [main]
    paths: *registry_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate registry and generated homepage
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ecosystem-registry.mjs
          node --check homepage-ambient.js
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('config/ecosystem-services.json')); if(![2,3].includes(x.version)||!x.services?.length) process.exit(1); const ids=x.services.map(s=>s.id); if(new Set(ids).size!==ids.length) throw new Error('duplicate service id'); const states=new Set(['live','beta','preparing','planned']); for(const s of x.services.filter(s=>s.homepage)){if(!states.has(s.status)) throw new Error('invalid homepage status: '+s.id); if(!s.nameEn||!s.descriptionKo||!s.descriptionEn) throw new Error('missing bilingual homepage copy: '+s.id); if((s.status==='live'||s.status==='beta')&&!s.productionVerified) throw new Error('clickable service not production verified: '+s.id)}"
          npm run build
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('config/ecosystem-services.json')); const html=fs.readFileSync('dist/index.html','utf8'); const visible=x.services.filter(s=>s.homepage===true&&s.productionVerified===true&&s.status==='live'); const visibleIds=new Set(visible.map(s=>s.id)); for(const s of visible){for(const marker of [s.name,s.nameEn,s.label]){if(!html.includes(marker)) throw new Error('generated homepage missing live '+s.id+' marker: '+marker)} if(!html.includes('href=\"'+s.url+'\"')) throw new Error('live service missing link: '+s.id)} for(const s of x.services.filter(s=>s.homepage===true&&!visibleIds.has(s.id))){if(html.includes('data-service-id=\"'+s.id+'\"')) throw new Error('non-live service exposed on public root: '+s.id); if(html.includes('href=\"'+s.url+'\"')) throw new Error('non-live service exposed as link: '+s.id)}"
      - name: Verify single production owner policy
        run: node scripts/validate-deployment-guardrails.mjs
