name: Generation 10 Production Evidence Ledger

on:
  workflow_run:
    workflows: ['Deploy Control API']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: gen10-production-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record-production-evidence:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.127.1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch completed Control deployment logs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/control-deploy.log
          test -s /tmp/control-deploy.log
      - name: Build Generation 10 production evidence
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/build-production-release-evidence.mjs \
            --log /tmp/control-deploy.log \
            --output /tmp/control-production-evidence.json \
            --sql /tmp/control-production-evidence.sql \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-workflow 'Deploy Control API' \
            --source-conclusion "$SOURCE_CONCLUSION" \
            --source-url "$SOURCE_URL" \
            --head-sha "$HEAD_SHA" \
            --service control-api \
            --worker ekodi-auth-api
          node -e "const e=require('/tmp/control-production-evidence.json');if(e.generation!==10||!e.evidenceId||!e.source?.logSha256)process.exit(1);console.log('Evidence '+e.evidenceId+' outcome='+e.outcome)"
      - name: Append evidence to production D1 ledger
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --file /tmp/control-production-evidence.sql
      - name: Verify production evidence roundtrip
        run: |
          set -euo pipefail
          EVIDENCE_ID=$(node -e "const e=require('/tmp/control-production-evidence.json');process.stdout.write(e.evidenceId)")
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --command "SELECT id,generation,outcome,production_verified,rollback_attempted,rollback_verified,log_sha256 FROM ai_production_evidence WHERE id='${EVIDENCE_ID}'" \
            --json > /tmp/control-production-evidence-roundtrip.json
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = require('/tmp/control-production-evidence.json');
          const raw = JSON.parse(fs.readFileSync('/tmp/control-production-evidence-roundtrip.json', 'utf8'));
          const rows = [];
          const walk = value => {
            if (Array.isArray(value)) for (const item of value) walk(item);
            else if (value && typeof value === 'object') {
              if (typeof value.id === 'string' && Object.hasOwn(value, 'generation')) rows.push(value);
              for (const item of Object.values(value)) walk(item);
            }
          };
          walk(raw);
          const row = rows.find(item => item.id === expected.evidenceId);
          if (!row) throw new Error('production evidence row not found after insert');
          if (Number(row.generation) !== 10) throw new Error('generation mismatch');
          if (String(row.log_sha256) !== expected.source.logSha256) throw new Error('log digest mismatch');
          if (Number(row.production_verified) !== (expected.release.productionVerified ? 1 : 0)) throw new Error('production verification mismatch');
          if (Number(row.rollback_verified) !== (expected.release.rollbackVerified ? 1 : 0)) throw new Error('rollback verification mismatch');
          console.log(`Production evidence roundtrip verified: ${row.id} outcome=${row.outcome}`);
          NODE
      - name: Publish evidence summary
        if: always()
        run: |
          if [ -f /tmp/control-production-evidence.json ]; then
            echo '## Generation 10 Production Evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/control-production-evidence.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
