name: Generation 10 Production Evidence Ledger

on:
  workflow_run:
    workflows:
      - 'Deploy Control API'
      - 'Deploy EKODI Shared Site Core'
      - 'EKODI Autonomous Execution Fabric Runtime Proof'
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: gen10-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record-production-evidence:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name != 'EKODI Autonomous Execution Fabric Runtime Proof'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.127.1'
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve governed production evidence subject
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_WORKFLOW" in
            'Deploy Control API')
              echo 'EVIDENCE_SERVICE=control-api' >> "$GITHUB_ENV"
              echo 'EVIDENCE_WORKER=ekodi-auth-api' >> "$GITHUB_ENV"
              ;;
            'Deploy EKODI Shared Site Core')
              echo 'EVIDENCE_SERVICE=shared-site' >> "$GITHUB_ENV"
              echo 'EVIDENCE_WORKER=shy-thunder-39a4' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported production evidence source: $SOURCE_WORKFLOW" >&2
              exit 64
              ;;
          esac

      - name: Fetch completed production deployment logs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/production-deploy.log
          test -s /tmp/production-deploy.log

      - name: Build Generation 10 production evidence
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/build-production-release-evidence.mjs \
            --log /tmp/production-deploy.log \
            --output /tmp/production-evidence.json \
            --sql /tmp/production-evidence.sql \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-workflow "$SOURCE_WORKFLOW" \
            --source-conclusion "$SOURCE_CONCLUSION" \
            --source-url "$SOURCE_URL" \
            --head-sha "$HEAD_SHA" \
            --service "$EVIDENCE_SERVICE" \
            --worker "$EVIDENCE_WORKER"
          node - <<'NODE'
          const e=require('/tmp/production-evidence.json');
          if(e.generation!==10||!e.evidenceId||!e.source?.logSha256) process.exit(1);
          if(e.source.workflow==='Deploy EKODI Shared Site Core' && e.source.conclusion==='success'){
            if(!e.release?.productionVerified) throw new Error('successful Shared Site workflow lacks production verification evidence');
            if(!e.release?.stagingArtifactReproducible) throw new Error('successful Shared Site workflow lacks reproducible staging artifact evidence');
            if(!e.release?.artifactContinuityVerified) throw new Error('successful Shared Site workflow lacks staging-to-production digest continuity evidence');
          }
          console.log('Evidence '+e.evidenceId+' outcome='+e.outcome);
          NODE

      - name: Append production evidence to D1 ledger
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --file /tmp/production-evidence.sql

      - name: Verify production evidence roundtrip
        run: |
          set -euo pipefail
          EVIDENCE_ID=$(node -e "const e=require('/tmp/production-evidence.json');process.stdout.write(e.evidenceId)")
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --command "SELECT id,generation,outcome,production_verified,rollback_attempted,rollback_verified,log_sha256 FROM ai_production_evidence WHERE id='${EVIDENCE_ID}'" \
            --json > /tmp/production-evidence-roundtrip.json
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = require('/tmp/production-evidence.json');
          const raw = JSON.parse(fs.readFileSync('/tmp/production-evidence-roundtrip.json', 'utf8'));
          const rows = [];
          const walk = value => {
            if (Array.isArray(value)) for (const item of value) walk(item);
            else if (value && typeof value === 'object') {
              if (typeof value.id === 'string' && Object.hasOwn(value, 'generation')) rows.push(value);
              for (const item of Object.values(value)) walk(item);
            }
          };
          walk(raw);
          const row = rows.find(item => item.id === expected.evidenceId);
          if (!row) throw new Error('production evidence row not found after insert');
          if (Number(row.generation) !== 10) throw new Error('generation mismatch');
          if (String(row.log_sha256) !== expected.source.logSha256) throw new Error('log digest mismatch');
          if (Number(row.production_verified) !== (expected.release.productionVerified ? 1 : 0)) throw new Error('production verification mismatch');
          if (Number(row.rollback_verified) !== (expected.release.rollbackVerified ? 1 : 0)) throw new Error('rollback verification mismatch');
          console.log(`Production evidence roundtrip verified: ${row.id} outcome=${row.outcome}`);
          NODE

      - name: Publish production evidence summary
        if: always()
        run: |
          if [ -f /tmp/production-evidence.json ]; then
            echo '## Generation 10 Production Evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/production-evidence.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  record-runtime-evidence:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'EKODI Autonomous Execution Fabric Runtime Proof'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.127.1'
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch execution-fabric artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/runtime-artifacts.json
          test -s /tmp/runtime-artifacts.json

      - name: Build Generation 10 runtime evidence
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node scripts/build-gen10-runtime-evidence.mjs \
            --artifacts /tmp/runtime-artifacts.json \
            --output /tmp/runtime-evidence.json \
            --sql /tmp/runtime-evidence.sql \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-workflow "$SOURCE_WORKFLOW" \
            --source-conclusion "$SOURCE_CONCLUSION" \
            --source-url "$SOURCE_URL" \
            --head-sha "$HEAD_SHA"
          node - <<'NODE'
          const e=require('/tmp/runtime-evidence.json');
          if(e.generation!==10||!e.evidenceId||!e.payloadSha256) process.exit(1);
          if(e.source.conclusion==='success' && !e.verified) throw new Error('successful execution-fabric workflow lacks the complete required runtime evidence set');
          console.log('Runtime evidence '+e.evidenceId+' outcome='+e.outcome);
          NODE

      - name: Append runtime evidence to D1 ledger
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --file /tmp/runtime-evidence.sql

      - name: Verify runtime evidence roundtrip
        run: |
          set -euo pipefail
          EVIDENCE_ID=$(node -e "const e=require('/tmp/runtime-evidence.json');process.stdout.write(e.evidenceId)")
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --command "SELECT id,generation,outcome,payload_sha256,artifact_count FROM ai_generation10_evidence WHERE id='${EVIDENCE_ID}'" \
            --json > /tmp/runtime-evidence-roundtrip.json
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = require('/tmp/runtime-evidence.json');
          const raw = JSON.parse(fs.readFileSync('/tmp/runtime-evidence-roundtrip.json', 'utf8'));
          const rows = [];
          const walk = value => {
            if (Array.isArray(value)) for (const item of value) walk(item);
            else if (value && typeof value === 'object') {
              if (typeof value.id === 'string' && Object.hasOwn(value, 'generation')) rows.push(value);
              for (const item of Object.values(value)) walk(item);
            }
          };
          walk(raw);
          const row = rows.find(item => item.id === expected.evidenceId);
          if (!row) throw new Error('runtime evidence row not found after insert');
          if (Number(row.generation) !== 10) throw new Error('generation mismatch');
          if (String(row.payload_sha256) !== expected.payloadSha256) throw new Error('payload digest mismatch');
          if (Number(row.artifact_count) !== expected.evidence.artifactCount) throw new Error('artifact count mismatch');
          console.log(`Runtime evidence roundtrip verified: ${row.id} outcome=${row.outcome}`);
          NODE

      - name: Publish runtime evidence summary
        if: always()
        run: |
          if [ -f /tmp/runtime-evidence.json ]; then
            echo '## Generation 10 Runtime Evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/runtime-evidence.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
