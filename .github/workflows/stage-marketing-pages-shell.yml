# 2026-08-24 official USER UI / ADMIN UI governance + same-origin asset routing
# 2026-08-24 Google origin-return deployment sync
name: Stage Marketing AI Pages Shell

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-marketing-pages.yml'
      - '.github/workflows/stage-marketing-pages-shell.yml'

permissions:
  contents: read

concurrency:
  group: marketing-pages-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  preview:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest Marketing AI source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(curl -fsS \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/topmaster-joseph/jadam-maru/commits/main' \
            | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: ${{ steps.source.outputs.sha }}
          path: marketing-source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and verify official UI + same-origin assets
        working-directory: marketing-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          hub='dist/marketing-ai/index.html'
          grep -Fq 'data-ekodi-ui-classification="USER UI"' "$hub"
          grep -Fq 'data-ekodi-asset-routing="same-origin"' "$hub"
          grep -Fq 'href="/official-ui.css?v=' "$hub"
          grep -Fq 'src="/official-ui.js?v=' "$hub"

          for tenant in jadam pizzamaru yogurtpurple; do
            dir="dist/marketing-ai/$tenant"
            file="$dir/index.html"
            grep -Fq 'data-ekodi-ui-classification="ADMIN UI"' "$file"
            grep -Fq 'data-ekodi-admin-context' "$file"
            grep -Fq 'data-ekodi-asset-routing="same-origin"' "$file"
            grep -Fq 'href="/site.css?v=' "$file"
            grep -Fq 'src="/shell-style.js?v=' "$file"
            grep -Fq 'href="/official-ui.css?v=' "$file"
            grep -Fq 'src="/official-ui.js?v=' "$file"
            ! grep -Eq 'jadam-maru\.pages\.dev/marketing-ai/.+/(site|official-ui|shell)\.(css|js)' "$file"
            test -s "$dir/site.css"
            test -s "$dir/shell.css"
            test -s "$dir/shell-style.js"
            test -s "$dir/official-ui.css"
            test -s "$dir/official-ui.js"
            grep -Fq 'Generated by scripts/patch-marketing-style-assets.mjs' "$dir/site.css"
            grep -Fq 'data-ekodi-shell-external-style' "$dir/shell-style.js"
          done

      - name: Verify Development Cloudflare boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "46aad4738793fbaca88574832a2ccc0f"

      - name: Deploy Marketing shell preview as Development Worker static assets
        shell: bash
        run: |
          set -euo pipefail
          cat > .tmp-marketing-shell-worker.mjs <<'EOF'
          export default { async fetch(request, env) { return env.ASSETS.fetch(request); } };
          EOF
          cat > .tmp-marketing-shell-wrangler.jsonc <<'EOF'
          {
            "name": "ekodi-marketing-pages-shell-staging",
            "main": ".tmp-marketing-shell-worker.mjs",
            "account_id": "46aad4738793fbaca88574832a2ccc0f",
            "compatibility_date": "2026-09-03",
            "workers_dev": true,
            "preview_urls": true,
            "assets": {
              "directory": "./marketing-source/dist/marketing-ai",
              "binding": "ASSETS"
            }
          }
          EOF
          trap 'rm -f .tmp-marketing-shell-worker.mjs .tmp-marketing-shell-wrangler.jsonc' EXIT
          npx --yes wrangler@$WRANGLER_VERSION deploy \
            --config .tmp-marketing-shell-wrangler.jsonc \
            --experimental-provision=false
          echo "STAGING_URL=https://ekodi-marketing-pages-shell-staging.ekodi-development.workers.dev" >> "$GITHUB_ENV"

      - name: Verify Development preview deployment or Access protection
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT
          code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
          auth=$(awk 'BEGIN{IGNORECASE=1} /^www-authenticate:/{sub(/\r$/,""); print; exit}' "$headers")
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print; exit}' "$headers")
          echo "Development preview status=$code ${auth:-no-auth-header} ${location%%\?*}"
          if [ "$code" = "302" ] && { printf '%s\n%s' "$auth" "$location" | grep -Eiq 'Cloudflare-Access|cloudflareaccess\.com|/cdn-cgi/access/'; }; then
            echo 'Development preview is deployed behind Cloudflare Access.'
            exit 0
          fi
          test "$code" = "200"
          check_surface() {
            path="$1"; marker="$2"
            curl -fsS --connect-timeout 5 --max-time 15 "$STAGING_URL$path" -o "$body"
            grep -Fq "$marker" "$body"
          }

          check_asset_type() {
            path="$1"; kind="$2"
            curl -fsS -D "$headers" -o "$body" --connect-timeout 5 --max-time 15 "$STAGING_URL$path"
            if [ "$kind" = css ]; then grep -Eiq '^content-type:[[:space:]]*text/css' "$headers"; fi
            if [ "$kind" = js ]; then grep -Eiq '^content-type:.*(javascript|ecmascript)' "$headers"; fi
          }
          check_surface '/' 'data-ekodi-ui-classification="USER UI"'
          check_surface '/jadam/' 'data-ekodi-ui-classification="ADMIN UI"'
          check_surface '/pizzamaru/' 'data-ekodi-ui-classification="ADMIN UI"'
          check_surface '/yogurtpurple/' 'data-ekodi-ui-classification="ADMIN UI"'
          check_asset_type '/official-ui.css' css
          check_asset_type '/official-ui.js' js
          echo 'Development Worker static-assets preview verified.'
