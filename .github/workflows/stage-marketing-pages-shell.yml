# 2026-08-24 official USER UI / ADMIN UI governance + same-origin asset routing
# 2026-08-24 Google origin-return deployment sync
name: Stage Marketing AI Pages Shell

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-marketing-pages.yml'
      - '.github/workflows/stage-marketing-pages-shell.yml'

permissions:
  contents: read

concurrency:
  group: marketing-pages-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  preview:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest Marketing AI source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(curl -fsS \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/topmaster-joseph/jadam-maru/commits/main' \
            | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: ${{ steps.source.outputs.sha }}
          path: marketing-source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and verify official UI + same-origin assets
        working-directory: marketing-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          hub='dist/marketing-ai/index.html'
          grep -Fq 'data-ekodi-ui-classification="USER UI"' "$hub"
          grep -Fq 'data-ekodi-asset-routing="same-origin"' "$hub"
          grep -Fq 'href="/official-ui.css?v=' "$hub"
          grep -Fq 'src="/official-ui.js?v=' "$hub"

          for tenant in jadam pizzamaru yogurtpurple; do
            dir="dist/marketing-ai/$tenant"
            file="$dir/index.html"
            grep -Fq 'data-ekodi-ui-classification="ADMIN UI"' "$file"
            grep -Fq 'data-ekodi-admin-context' "$file"
            grep -Fq 'data-ekodi-asset-routing="same-origin"' "$file"
            grep -Fq 'href="/site.css?v=' "$file"
            grep -Fq 'src="/shell-style.js?v=' "$file"
            grep -Fq 'href="/official-ui.css?v=' "$file"
            grep -Fq 'src="/official-ui.js?v=' "$file"
            ! grep -Eq 'jadam-maru\.pages\.dev/marketing-ai/.+/(site|official-ui|shell)\.(css|js)' "$file"
            test -s "$dir/site.css"
            test -s "$dir/shell.css"
            test -s "$dir/shell-style.js"
            test -s "$dir/official-ui.css"
            test -s "$dir/official-ui.js"
            grep -Fq 'Generated by scripts/patch-marketing-style-assets.mjs' "$dir/site.css"
            grep -Fq 'data-ekodi-shell-external-style' "$dir/shell-style.js"
          done

      - name: Verify Development Cloudflare boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "46aad4738793fbaca88574832a2ccc0f"

      - name: Ensure Development Pages preview projects
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          ensure_project() {
            project="$1"
            code=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$api/$project")
            if [ "$code" = "200" ]; then
              return
            fi
            if [ "$code" != "404" ]; then
              cat /tmp/pages-project.json
              echo "::error::Unable to inspect Development Pages project $project (HTTP $code)."
              exit 1
            fi
            code=$(curl -sS -o /tmp/pages-project-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$project\",\"production_branch\":\"development\"}" \
              "$api")
            if [ "$code" != "200" ]; then
              cat /tmp/pages-project-create.json
              echo "::error::Unable to create Development Pages project $project (HTTP $code)."
              exit 1
            fi
          }
          for project in marketing-ai marketing-ai-jadam marketing-ai-pizzamaru marketing-ai-yogurtpurple; do
            ensure_project "$project"
          done

      - name: Deploy four non-production Pages previews to Development
        shell: bash
        run: |
          set -euo pipefail
          branch="shell-pr-${{ github.event.pull_request.number }}"
          sha='${{ steps.source.outputs.sha }}'
          deploy_preview() {
            project="$1"; dir="$2"; env_name="$3"
            log="/tmp/${project}.log"
            npx --yes wrangler@$WRANGLER_VERSION pages deploy "$dir" \
              --project-name "$project" \
              --branch "$branch" \
              --commit-hash "$sha" \
              --commit-message "EKODI Marketing Shell preview $sha" | tee "$log"
            url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$log" | tail -1 || true)
            test -n "$url"
            echo "$env_name=$url" >> "$GITHUB_ENV"
          }
          deploy_preview marketing-ai marketing-source/dist/marketing-ai MARKETING_PREVIEW
          deploy_preview marketing-ai-jadam marketing-source/dist/marketing-ai/jadam JADAM_PREVIEW
          deploy_preview marketing-ai-pizzamaru marketing-source/dist/marketing-ai/pizzamaru PIZZAMARU_PREVIEW
          deploy_preview marketing-ai-yogurtpurple marketing-source/dist/marketing-ai/yogurtpurple YOGURT_PREVIEW

      - name: Verify preview HTML, CSS and JS MIME contracts
        shell: bash
        run: |
          set -euo pipefail
          check_asset() {
            url="$1"; kind="$2"; marker="$3"
            curl -L -fsS -D /tmp/headers -o /tmp/asset --connect-timeout 5 --max-time 15 "$url"
            if [ "$kind" = css ]; then grep -Eiq '^content-type:[[:space:]]*text/css' /tmp/headers; fi
            if [ "$kind" = js ]; then grep -Eiq '^content-type:.*(javascript|ecmascript)' /tmp/headers; fi
            grep -Fq "$marker" /tmp/asset
          }

          for spec in \
            "$MARKETING_PREVIEW|USER UI|generic" \
            "$JADAM_PREVIEW|ADMIN UI|tenant" \
            "$PIZZAMARU_PREVIEW|ADMIN UI|tenant" \
            "$YOGURT_PREVIEW|ADMIN UI|tenant"; do
            url="${spec%%|*}"; rest="${spec#*|}"; ui="${rest%%|*}"; kind="${rest#*|}"
            verified=0
            for attempt in $(seq 1 18); do
              if curl -L -fsS --connect-timeout 5 --max-time 15 "$url" -o /tmp/page \
                && grep -Fq "data-ekodi-ui-classification=\"$ui\"" /tmp/page \
                && grep -Fq 'data-ekodi-asset-routing="same-origin"' /tmp/page \
                && check_asset "${url%/}/official-ui.css" css 'EKODI official USER UI / ADMIN UI governance layer' \
                && check_asset "${url%/}/official-ui.js" js 'EKODI'; then
                if [ "$kind" = tenant ]; then
                  grep -Fq 'data-ekodi-admin-context' /tmp/page || { sleep 4; continue; }
                  check_asset "${url%/}/site.css" css 'Generated by scripts/patch-marketing-style-assets.mjs' || { sleep 4; continue; }
                  check_asset "${url%/}/shell-style.js" js 'data-ekodi-shell-external-style' || { sleep 4; continue; }
                fi
                verified=1
                break
              fi
              sleep 4
            done
            test "$verified" = 1
          done

          echo 'All Marketing AI previews verified with official USER/ADMIN boundaries and browser-loadable same-origin styling.'
