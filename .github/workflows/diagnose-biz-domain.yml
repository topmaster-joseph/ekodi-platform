name: Diagnose EKODI Biz Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-biz-domain.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS and HTTP diagnostics
        run: |
          set +e
          for domain in ekodibiz.kr biz.ekodi.kr; do
            echo "===== $domain DNS ====="
            getent ahosts "$domain" | head -10
            echo "===== $domain HEAD ====="
            curl -sS -I --connect-timeout 5 --max-time 10 "https://$domain/" | head -30
            echo "===== $domain GET status ====="
            curl -sS -o /dev/null -w 'http=%{http_code} redirect=%{redirect_url} remote=%{remote_ip}\n' --connect-timeout 5 --max-time 10 "https://$domain/"
            echo
          done
