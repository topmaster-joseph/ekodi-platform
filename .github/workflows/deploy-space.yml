            (select count(*) from public.tenant_members tm join auth.users u on u.id=tm.user_id
                 join chosen c on c.tenant_id=tm.tenant_id
                 where lower(u.email)='bbqmuancg@gmail.com'
                   and u.email_confirmed_at is null)=0 as no_unverified_grant,
            exists(select 1 from pg_trigger tg where tg.tgname='on_auth_user_access'
