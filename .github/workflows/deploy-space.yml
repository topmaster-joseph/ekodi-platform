      - name: Verify anonymous public projection RPC schema proof
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          base="https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc"
          verify_rpc() {
            local name="$1" body="$2" out="$3" marker="${4:-}"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST "$base/$name" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$body")
            if [ "$code" != '200' ]; then
              echo "Required Space public RPC $name is unavailable (HTTP $code)." >&2
              cat "$out" || true
              exit 1
            fi
            if [ -n "$marker" ]; then
              grep -Fq "$marker" "$out" || { echo "Required Space public RPC $name returned an unexpected projection." >&2; cat "$out"; exit 1; }
            fi
          }

          verify_rpc store_admin_route_profile '{"p_operating_slug":"jadam"}' /tmp/store-route-proof.json '"slug"'
          verify_rpc organization_public_snapshot '{"p_slug":"hammu"}' /tmp/organization-proof.json '"publicationState"'
          verify_rpc store_public_storefront '{"p_slug":"jadam"}' /tmp/storefront-proof.json
          verify_rpc store_user_site_public_profile '{"p_slug":"jadam"}' /tmp/user-site-profile-proof.json
          verify_rpc store_user_site_public_snapshot '{"p_slug":"jadam"}' /tmp/user-site-snapshot-proof.json
          verify_rpc mission_activity_page_public_snapshot '{"p_workspace_slug":"ekodimission"}' /tmp/mission-activity-editor-proof.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/mission-activity-editor-proof.json >/dev/null

          # 목포노회 선교부 명단 + 부장 조회: public roster masks phones; bad credentials and tokens are refused.
          if [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" = 'management' ]; then
            verify_rpc organization_event_roster_public '{"p_slug":"mokpo-mission","p_event":"pck-policy-2026"}' /tmp/mokpo-roster-proof.json
            jq -e 'type == "array" and all(.[]; (.phone == null) and ((.phoneMasked // "") | test("^(|010-\\*\\*\\*\\*-\\*\\*\\*\\*)$")))' /tmp/mokpo-roster-proof.json >/dev/null
            verify_rpc organization_pin_login '{"p_slug":"mokpo-mission","p_phone":"01000000000","p_pin":"0000"}' /tmp/mokpo-pin-proof.json '"INVALID_CREDENTIALS"'
            verify_rpc organization_name_login '{"p_slug":"mokpo-mission","p_name":"존재하지않는이름","p_pin":"0000"}' /tmp/mokpo-name-proof.json '"INVALID_CREDENTIALS"'
            pin_snapshot=$(curl -sS -o /tmp/mokpo-pin-snapshot.json -w '%{http_code}' -X POST "$base/organization_pin_snapshot" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data '{"p_slug":"mokpo-mission","p_token":"invalid"}')
            case "$pin_snapshot" in 4*) ;; *) echo "organization_pin_snapshot accepted an invalid token (HTTP $pin_snapshot)" >&2; exit 1;; esac
            approve=$(curl -sS -o /tmp/mokpo-approve-proof.json -w '%{http_code}' -X POST "$base/organization_pin_budget_approve" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data '{"p_slug":"mokpo-mission","p_token":"invalid","p_year":2027}')
            case "$approve" in 4*) ;; *) echo "organization_pin_budget_approve accepted an invalid token (HTTP $approve)" >&2; exit 1;; esac
            member=$(curl -sS -o /tmp/mokpo-member-proof.json -w '%{http_code}' -X POST "$base/organization_member_snapshot" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data '{"p_slug":"mokpo-mission"}')
            case "$member" in 4*) ;; *) echo "organization_member_snapshot served an anonymous caller (HTTP $member)" >&2; exit 1;; esac
            echo 'Mokpo mission roster/viewer RPCs: masked public roster, refused bad PIN and token, anonymous approval and member reads refused.'
          fi

          if [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" = 'public-rpc-proof' ]; then
            echo 'Space Supabase production schema contract verified read-only through six live public RPCs; schema mutation remained disabled.'
          else
            echo 'Space public RPC projections verified live after Management API schema preflight.'
          fi

