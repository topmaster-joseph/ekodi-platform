name: Deploy EKODI Operating Space

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: Orchestrator-issued ai/<agent>/orch_<task-id> branch
        required: true
        type: string
      release_task_id:
        description: Verified EKODI orchestrator task ID
        required: true
        type: string
  pull_request:
    paths:
      - 'space/**'
      - 'space-worker.js'
      - 'test/space-noindex-preservation.test.mjs'
      - 'bbq-cheonggye-site.js'
      - 'test/bbq-cheonggye-site.test.mjs'
      - 'test/bbqcg-hard-cutover.test.mjs'
      - 'test/bbqcg-admin-access.test.mjs'
      - 'mission-activity-editor-api.js'
      - 'test/ekodimission-activity-editor.test.mjs'
      - 'supabase/migrations/20261103090000_mission_activity_inline_editor.sql'
      - 'mnubiz-public-page.js'
      - 'mnubiz-suncheon-page.js'
      - 'test/mnubiz-suncheon.test.mjs'
      - 'realtime-tenant-registry.js'
      - 'tenant-live-page.js'
      - 'storefront-page.js'
      - 'restaurant-storefront.js'
      - 'restaurant-storefront-v2.js'
      - 'store-discovery.js'
      - 'test/store-discovery.test.mjs'
      - 'pizzamaru-catalog.js'
      - 'jadam-storefront.js'
      - 'workspace-route-policy.js'
      - 'wrangler.space*.toml'
      - 'deploy/manifests/space.worker.json'
      - 'supabase/functions/workspace-api/**'
      - 'supabase/migrations/20260906001000_store_operating_spaces.sql'
      - 'supabase/migrations/20260906005000_store_user_site_provisioning.sql'
      - 'supabase/migrations/20260909003000_storefront_public_snapshot.sql'
      - 'supabase/migrations/20260906006000_store_admin_routing.sql'
      - 'supabase/migrations/20261108103000_bbqcheonggye_workspace.sql'
      - 'supabase/migrations/20261108104500_bbqcg_hard_cutover.sql'
      - 'supabase/migrations/20261108150000_bbqcg_verified_admin_invites.sql'
      - 'supabase/migrations/20260914095000_organization_subsite_operations.sql'
      - 'supabase/migrations/20261031123000_mokpo_presbytery_organization_tenants.sql'
      - 'supabase/migrations/20261105210000_mokpo_mission_roster_pin_viewer.sql'
      - 'supabase/migrations/20261106090000_mokpo_mission_inline_roles.sql'
      - 'supabase/migrations/20261106120000_mokpo_mission_name_login.sql'
      - 'supabase/migrations/20261031210000_organization_budget_lines.sql'
      - 'supabase/migrations/20260909001000_public_storefront.sql'
      - 'supabase/migrations/20260913013000_ekodimall_canonical_path.sql'
      - 'supabase/tests/store_operating_spaces.test.sql'
      - 'supabase/tests/store_user_site_provisioning.test.sql'
      - 'test/store-operating-space.test.mjs'
      - 'test/store-user-site-admin.test.mjs'
      - 'test/space-auth-apex-constitution.test.mjs'
      - 'test/storefront-public.test.mjs'
      - 'test/pizzamaru-full-menu-social.test.mjs'
      - 'test/jadam-storefront-brand.test.mjs'
      - 'test/ekodimission-shell-contract.test.mjs'
      - 'test/ekodimission-photo-upload.test.mjs'
      - 'scripts/validate-ekodimission-shell-contract.mjs'
      - 'scripts/verify-ekodimission-production.mjs'
      - '.github/workflows/deploy-space.yml'
  push:
    branches: [main]
    paths:
      - 'space/**'
      - 'space-worker.js'
      - 'test/space-noindex-preservation.test.mjs'
      - 'bbq-cheonggye-site.js'
      - 'test/bbq-cheonggye-site.test.mjs'
      - 'test/bbqcg-hard-cutover.test.mjs'
      - 'test/bbqcg-admin-access.test.mjs'
      - 'mission-activity-editor-api.js'
      - 'test/ekodimission-activity-editor.test.mjs'
      - 'supabase/migrations/20261103090000_mission_activity_inline_editor.sql'
      - 'mnubiz-public-page.js'
      - 'mnubiz-suncheon-page.js'
      - 'test/mnubiz-suncheon.test.mjs'
      - 'realtime-tenant-registry.js'
      - 'tenant-live-page.js'
      - 'storefront-page.js'
      - 'restaurant-storefront.js'
      - 'restaurant-storefront-v2.js'
      - 'store-discovery.js'
      - 'test/store-discovery.test.mjs'
      - 'pizzamaru-catalog.js'
      - 'jadam-storefront.js'
      - 'workspace-route-policy.js'
      - 'wrangler.space*.toml'
      - 'deploy/manifests/space.worker.json'
      - 'supabase/functions/workspace-api/**'
      - 'supabase/migrations/20260906001000_store_operating_spaces.sql'
      - 'supabase/migrations/20260906005000_store_user_site_provisioning.sql'
      - 'supabase/migrations/20260909003000_storefront_public_snapshot.sql'
      - 'supabase/migrations/20260906006000_store_admin_routing.sql'
      - 'supabase/migrations/20261108103000_bbqcheonggye_workspace.sql'
      - 'supabase/migrations/20261108104500_bbqcg_hard_cutover.sql'
      - 'supabase/migrations/20261108150000_bbqcg_verified_admin_invites.sql'
      - 'supabase/migrations/20260914095000_organization_subsite_operations.sql'
      - 'supabase/migrations/20261031123000_mokpo_presbytery_organization_tenants.sql'
      - 'supabase/migrations/20261105210000_mokpo_mission_roster_pin_viewer.sql'
      - 'supabase/migrations/20261106090000_mokpo_mission_inline_roles.sql'
      - 'supabase/migrations/20261106120000_mokpo_mission_name_login.sql'
      - 'supabase/migrations/20261031210000_organization_budget_lines.sql'
      - 'supabase/migrations/20260909001000_public_storefront.sql'
      - 'supabase/migrations/20260913013000_ekodimall_canonical_path.sql'
      - 'supabase/tests/store_operating_spaces.test.sql'
      - 'supabase/tests/store_user_site_provisioning.test.sql'
      - 'test/store-operating-space.test.mjs'
      - 'test/store-user-site-admin.test.mjs'
      - 'test/space-auth-apex-constitution.test.mjs'
      - 'test/storefront-public.test.mjs'
      - 'test/pizzamaru-full-menu-social.test.mjs'
      - 'test/jadam-storefront-brand.test.mjs'
      - 'test/ekodimission-shell-contract.test.mjs'
      - 'test/ekodimission-photo-upload.test.mjs'
      - 'scripts/validate-ekodimission-shell-contract.mjs'
      - 'scripts/verify-ekodimission-production.mjs'
      - '.github/workflows/deploy-space.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-space-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
  WRANGLER_VERSION: '4.119.0'
  SUPABASE_PROJECT_REF: renzehysxirjilvdxacv
  STORE_ROUTE_MIGRATION: supabase/migrations/20260906006000_store_admin_routing.sql
  ORGANIZATION_MIGRATION: supabase/migrations/20260914095000_organization_subsite_operations.sql
  MOKPO_ORGANIZATION_MIGRATION: supabase/migrations/20261031123000_mokpo_presbytery_organization_tenants.sql
  ORGANIZATION_BUDGET_MIGRATION: supabase/migrations/20261031210000_organization_budget_lines.sql
  MOKPO_ROSTER_VIEWER_MIGRATION: supabase/migrations/20261105210000_mokpo_mission_roster_pin_viewer.sql
  MOKPO_INLINE_ROLES_MIGRATION: supabase/migrations/20261106090000_mokpo_mission_inline_roles.sql
  MOKPO_NAME_LOGIN_MIGRATION: supabase/migrations/20261106120000_mokpo_mission_name_login.sql
  BBQ_WORKSPACE_MIGRATION: supabase/migrations/20261108104500_bbqcg_hard_cutover.sql
  BBQ_WORKSPACE_PINNED_BLOB: 3fb20a5e441b0f68474a2870026dd4085f62df2c
  BBQ_DEV_PROJECT: lxcxwbdwwojjkgybbqii
  BBQ_ADMIN_MIGRATION: supabase/migrations/20261108150000_bbqcg_verified_admin_invites.sql
  BBQ_ADMIN_PINNED_BLOB: bd35a8df1f002374d93e54ff2d09ee26fcb169c2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate operating-space contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check space-worker.js
          node --test test/space-noindex-preservation.test.mjs
          node --check bbq-cheonggye-site.js
          node --test test/bbq-cheonggye-site.test.mjs
          node --test test/bbqcg-hard-cutover.test.mjs
          node --test test/bbqcg-admin-access.test.mjs
          node --check mission-activity-editor-api.js
          node --check space/ekodimission-activity-editor.js
          node --test test/ekodimission-activity-editor.test.mjs
          node --check storefront-page.js
          node --check restaurant-storefront.js
          node --check restaurant-storefront-v2.js
          node --check pizzamaru-catalog.js
          node --check jadam-storefront.js
          node --check space/app.js
          node --test test/space-auth-apex-constitution.test.mjs test/workspace-routing-10g.test.mjs test/store-discovery.test.mjs test/store-operating-space.test.mjs test/store-user-site-admin.test.mjs test/storefront-public.test.mjs test/pizzamaru-full-menu-social.test.mjs test/jadam-storefront-brand.test.mjs test/ekodimission-site.test.mjs test/ekodimission-home-and-media-consent.test.mjs test/organization-subsite.test.mjs test/mnubiz-workspace.test.mjs test/mnubiz-suncheon.test.mjs
          node scripts/validate-ekodimission-shell-contract.mjs
          node --test test/ekodimission-shell-contract.test.mjs test/ekodimission-photo-upload.test.mjs
          grep -Fq "pattern = \"space.ekodi.kr\"" wrangler.space.toml
          grep -Fq 'binding = "STORAGE"' wrangler.space.toml
          grep -Fq 'service = "ekodi-storage-control"' wrangler.space.toml
          grep -Fq 'MISSION_ACTIVITY_MEDIA_UPLOAD_RE' space-worker.js
          grep -Fq "https://storage.internal/api/storage/v1/records" space-worker.js
          grep -Fq 'DATA_ENABLED = "false"' wrangler.space.staging.toml
          grep -Fq 'DATA_MODE = "isolated-staging"' wrangler.space.staging.toml
          grep -Fq 'path -> slug(locator) -> workspace_id -> relationship/policy -> role -> capability' space-worker.js
          grep -Fq 'workspace_not_found_or_forbidden' supabase/functions/workspace-api/index.ts
          grep -Fq 'tenant_members+RLS' supabase/functions/workspace-api/index.ts
          grep -Fq 'store_members+RLS' supabase/functions/workspace-api/index.ts
          grep -Fq 'current_store_operating_spaces' supabase/functions/workspace-api/index.ts
          grep -Fq '/spaces/store-dashboard' supabase/functions/workspace-api/index.ts
          grep -Fq 'space:["https://space.ekodi.kr"]' supabase/functions/workspace-api/index.ts
          grep -Fq '/spaces/resolve' space/app.js
          grep -Fq "routeModel:['/{slug}','/{slug}/{service}']" space-worker.js
          grep -Fq 'memberNamespaceRequired:false' space-worker.js
          test -f deploy/manifests/space.worker.json
          test -f "$BBQ_WORKSPACE_MIGRATION"
          test "$(git hash-object "$BBQ_WORKSPACE_MIGRATION")" = "$BBQ_WORKSPACE_PINNED_BLOB"
          test -f supabase/migrations/20260906006000_store_admin_routing.sql
          grep -Fq 'store_admin_route_profile' supabase/migrations/20260906006000_store_admin_routing.sql
          grep -Fq 'store_public_storefront' supabase/migrations/20260909001000_public_storefront.sql
          test -f supabase/migrations/20260913013000_ekodimall_canonical_path.sql
          test -f supabase/migrations/20260921040000_ekodimall_root_canonical_path.sql
          grep -Fq "'domain','ekodi.kr/ekodimall'" supabase/migrations/20260921040000_ekodimall_root_canonical_path.sql
          grep -Fq 'publicStorefront' space/index.html
          grep -Fq 'storefront.json' platform-router-entry-worker.js

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-space-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Development boundary
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          grep -Fq 'DATA_ENABLED = "false"' wrangler.space.staging.toml
      - name: Deploy isolated operating-space staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.space.staging.toml
      - name: Verify staging or Cloudflare Access boundary
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@${WRANGLER_VERSION} deployments status --config wrangler.space.staging.toml --json > /tmp/space-stage-deployments.json
          test -s /tmp/space-stage-deployments.json
          for attempt in $(seq 1 12); do
            code=$(curl -sS -D /tmp/space-stage.headers -o /tmp/space-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health=$(curl -sS -o /tmp/space-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$code" == '200' && "$health" == '200' ]] && grep -Fq 'OPERATING SPACE' /tmp/space-stage.html && grep -Fq '"dataEnabled":false' /tmp/space-stage-health.json && grep -Fq '"dataMode":"isolated-staging"' /tmp/space-stage-health.json; then
              echo 'Operating Space staging verified with production data disabled.'
              exit 0
            fi
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print}' /tmp/space-stage.headers | tail -1)
            if [[ "$code" == '302' && "$location" == https://*.cloudflareaccess.com/cdn-cgi/access/login/* ]]; then
              echo 'Operating Space staging is deployed behind Cloudflare Access; source contracts and isolated-data configuration are verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify orchestrator release intent
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EKODI_RELEASE_BRANCH_REF"
          test -n "$EKODI_RELEASE_TASK_ID"
          [[ "$EKODI_RELEASE_BRANCH_REF" =~ ^ai/[a-zA-Z0-9._-]+/orch_[a-zA-Z0-9_-]+$ ]]
          [[ "$EKODI_RELEASE_BRANCH_REF" == *"/$EKODI_RELEASE_TASK_ID" ]]
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Select Supabase production deployment path
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-}"
          [ -n "$token" ] || token="${TOKEN_B:-}"
          [ -n "$token" ] || token="${TOKEN_C:-}"
          [ -n "$token" ] || token="${TOKEN_D:-}"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
            echo "SUPABASE_SCHEMA_PREFLIGHT_MODE=management" >> "$GITHUB_ENV"
            echo 'Space schema preflight will use the configured Supabase Management API credential.'
          else
            echo "SUPABASE_ACCESS_TOKEN=" >> "$GITHUB_ENV"
            echo "SUPABASE_SCHEMA_PREFLIGHT_MODE=public-rpc-proof" >> "$GITHUB_ENV"
            echo 'No Supabase Management API credential is configured; Space release will fail closed unless all required public read-only RPC contracts are live.'
          fi

      - name: Heal and verify Supabase Space schema contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" != 'management' ]; then
            echo 'Management credential unavailable: schema mutation is disabled. Live public RPC proof is required before Worker release.'
            exit 0
          fi

          query_sql() {
            local sql="$1" out="$2"
            jq -n --arg query "$sql" '{query:$query,read_only:true}' > /tmp/space-schema-query.json
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/space-schema-query.json)
            [ "$code" = '201' ] || { echo "Space Supabase schema query failed with HTTP $code"; cat "$out"; exit 1; }
          }

          apply_migration() {
            local migration="$1"
            echo "Applying missing Space schema dependency: $migration"
            jq -Rs '{query:.,read_only:false}' "$migration" > /tmp/space-schema-migration.json
            local code
            code=$(curl -sS -o /tmp/space-schema-migration-result.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/space-schema-migration.json)
            [ "$code" = '201' ] || { echo "Space Supabase migration failed for $migration with HTTP $code"; cat /tmp/space-schema-migration-result.json; exit 1; }
          }

          proof_sql="select
            to_regprocedure('public.store_admin_route_profile(text)') is not null as store_route,
            to_regprocedure('public.organization_public_snapshot(text)') is not null as organization_public,
            to_regprocedure('public.store_public_storefront(text)') is not null as storefront_public,
            to_regprocedure('public.store_user_site_public_profile(text)') is not null as user_site_profile,
            to_regprocedure('public.store_user_site_public_snapshot(text)') is not null as user_site_snapshot,
            exists(select 1 from public.tenants where slug='mokpo-mission' and settings->>'organization_engine'='v1') and exists(select 1 from public.tenants where slug='mokpo-presbytery' and settings->>'organization_engine'='v1') as mokpo_organizations,
            to_regprocedure('public.organization_budget_command(text,text,jsonb)') is not null as organization_budget,
            to_regclass('public.mission_activity_page_edits') is not null as mission_editor_table,
            to_regprocedure('public.mission_activity_page_public_snapshot(text)') is not null as mission_editor_public,
            to_regprocedure('public.mission_activity_page_update(text,text,text,text,text,date,time without time zone,bigint)') is not null as mission_editor_update,
            to_regprocedure('public.organization_pin_snapshot(text,text)') is not null and to_regprocedure('public.organization_event_roster_public(text,text)') is not null and to_regprocedure('public.organization_pin_viewer_set(text,text,text,text)') is not null as mokpo_roster_viewer,
            to_regprocedure('public.organization_site_context(text)') is not null and to_regprocedure('public.organization_member_snapshot(text)') is not null and to_regprocedure('public.organization_pin_budget_approve(text,text,integer)') is not null as mokpo_inline_roles,
            to_regprocedure('public.organization_name_login(text,text,text)') is not null and to_regprocedure('public.organization_login_member_set(text,text,text,text)') is not null as mokpo_name_login;"

          query_sql "$proof_sql" /tmp/space-schema-before.json

          if ! grep -Fq '"store_route":true' /tmp/space-schema-before.json; then
            apply_migration "$STORE_ROUTE_MIGRATION"
          fi
          if ! grep -Fq '"organization_public":true' /tmp/space-schema-before.json; then
            apply_migration "$ORGANIZATION_MIGRATION"
          fi
          if ! grep -Fq '"mokpo_organizations":true' /tmp/space-schema-before.json; then
            apply_migration "$MOKPO_ORGANIZATION_MIGRATION"
          fi
          if ! grep -Fq '"organization_budget":true' /tmp/space-schema-before.json; then
            apply_migration "$ORGANIZATION_BUDGET_MIGRATION"
          fi
          if ! grep -Fq '"mission_editor_public":true' /tmp/space-schema-before.json || ! grep -Fq '"mission_editor_update":true' /tmp/space-schema-before.json || ! grep -Fq '"mission_editor_table":true' /tmp/space-schema-before.json; then
            apply_migration 'supabase/migrations/20261103090000_mission_activity_inline_editor.sql'
          fi
          if ! grep -Fq '"mokpo_roster_viewer":true' /tmp/space-schema-before.json; then
            apply_migration "$MOKPO_ROSTER_VIEWER_MIGRATION"
          fi
          if ! grep -Fq '"mokpo_inline_roles":true' /tmp/space-schema-before.json; then
            apply_migration "$MOKPO_INLINE_ROLES_MIGRATION"
          fi
          if ! grep -Fq '"mokpo_name_login":true' /tmp/space-schema-before.json; then
            apply_migration "$MOKPO_NAME_LOGIN_MIGRATION"
          fi

          query_sql "$proof_sql" /tmp/space-schema-after.json
          for marker in '"store_route":true' '"organization_public":true' '"storefront_public":true' '"user_site_profile":true' '"user_site_snapshot":true' '"mokpo_organizations":true' '"organization_budget":true' '"mission_editor_table":true' '"mission_editor_public":true' '"mission_editor_update":true' '"mokpo_roster_viewer":true' '"mokpo_inline_roles":true' '"mokpo_name_login":true'; do
            grep -Fq "$marker" /tmp/space-schema-after.json || { echo "Missing required Space Supabase contract: $marker"; cat /tmp/space-schema-after.json; exit 1; }
          done

          echo 'Space Supabase production schema contract verified through the Management API before Worker release.'

      - name: Stage and verify approved BBQ store workspace before production
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object "$BBQ_WORKSPACE_MIGRATION")" = "$BBQ_WORKSPACE_PINNED_BLOB"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          # Only data-plane registrations are provisioned. Never write a role or provider credential.
          cat > "$temp_dir/proof.sql" <<'SQL'
          select
            (select count(*) = 1
              from public.tenants t join public.stores s on s.tenant_id=t.id
              join public.store_user_sites us on us.store_id=s.id
              where t.slug='bbqcg' and t.name='BBQ 무안청계점'
                and t.kind='business' and t.settings->>'ownership'='customer'
                and s.slug='bbq-muan-cheonggye' and s.name='BBQ 무안청계점'
                and s.operating_space_slug='bbqcg'
                and us.status='active') as workspace_ready,
            (select count(*) <= 1 from public.stores where operating_space_slug='bbqcg') as unique_store_locator,
            (select count(*) <= 1 from public.tenants where slug='bbqcg') as unique_tenant_locator;
          SQL
          query_project() {
            local project="$1" result_file="$2" code
            jq -Rs '{query:.,read_only:true}' "$temp_dir/proof.sql" > "$temp_dir/query.json"
            code=$(curl -sS --retry 2 --max-time 75 -o "$result_file" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$project/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @"$temp_dir/query.json")
            [ "$code" = 201 ] || { echo "Failed read-only DB readiness proof for $project (HTTP $code)"; exit 1; }
          }
          promote_project() {
            local project="$1" code
            jq -Rs '{query:.,read_only:false}' "$BBQ_WORKSPACE_MIGRATION" > "$temp_dir/migration.json"
            code=$(curl -sS --retry 2 --max-time 75 -o "$temp_dir/migration-result.json" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$project/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @"$temp_dir/migration.json")
            [ "$code" = 201 ] || { echo "Guarded BBQ Workspace migration failed for $project (HTTP $code)"; exit 1; }
          }
          # A missing management credential cannot be turned into an unsecured browser/RPC write.
          [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" = management ] || {
            echo "No authorized management credential for staged BBQ workspace provisioning."
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          ! grep -Eiq '(insert[[:space:]]+into[[:space:]]+public\.(store_members|tenant_members|site_access_registry))' "$BBQ_WORKSPACE_MIGRATION"
          for project in "$BBQ_DEV_PROJECT" "$SUPABASE_PROJECT_REF"; do
            query_project "$project" "$temp_dir/before.json"
            jq -e 'length == 1 and (.[0].unique_store_locator == true) and (.[0].unique_tenant_locator == true) ' "$temp_dir/before.json" >/dev/null
            if ! jq -e '.[0].workspace_ready == true' "$temp_dir/before.json" >/dev/null; then
              if [ "$project" = "$SUPABASE_PROJECT_REF" ]; then
                test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              fi
              promote_project "$project"
            fi
            query_project "$project" "$temp_dir/after.json"
            jq -e 'length == 1 and (.[0] | all(.[]; . == true))' "$temp_dir/after.json" >/dev/null
            echo "BBQ customer workspace identity, tenant boundary and tenant ownership confirmed for $project."
          done

      - name: Verify BBQCG operator onboarding on DEV then PROD
