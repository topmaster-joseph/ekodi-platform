name: Deploy EKODI Operating Space

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'space/**'
      - 'space-worker.js'
      - 'mnubiz-public-page.js'
      - 'realtime-tenant-registry.js'
      - 'tenant-live-page.js'
      - 'storefront-page.js'
      - 'restaurant-storefront.js'
      - 'restaurant-storefront-v2.js'
      - 'pizzamaru-catalog.js'
      - 'jadam-storefront.js'
      - 'workspace-route-policy.js'
      - 'wrangler.space*.toml'
      - 'deploy/manifests/space.worker.json'
      - 'supabase/functions/workspace-api/**'
      - 'supabase/migrations/20260906001000_store_operating_spaces.sql'
      - 'supabase/migrations/20260906005000_store_user_site_provisioning.sql'
      - 'supabase/migrations/20260909003000_storefront_public_snapshot.sql'
      - 'supabase/migrations/20260906006000_store_admin_routing.sql'
      - 'supabase/migrations/20260914095000_organization_subsite_operations.sql'
      - 'supabase/migrations/20260909001000_public_storefront.sql'
      - 'supabase/migrations/20260913013000_ekodimall_canonical_path.sql'
      - 'supabase/tests/store_operating_spaces.test.sql'
      - 'supabase/tests/store_user_site_provisioning.test.sql'
      - 'test/store-operating-space.test.mjs'
      - 'test/store-user-site-admin.test.mjs'
      - 'test/storefront-public.test.mjs'
      - 'test/pizzamaru-full-menu-social.test.mjs'
      - 'test/jadam-storefront-brand.test.mjs'
      - 'test/ekodimission-shell-contract.test.mjs'
      - 'test/ekodimission-photo-upload.test.mjs'
      - 'scripts/validate-ekodimission-shell-contract.mjs'
      - 'scripts/verify-ekodimission-production.mjs'
      - '.github/workflows/deploy-space.yml'
  push:
    branches: [main]
    paths:
      - 'space/**'
      - 'space-worker.js'
      - 'mnubiz-public-page.js'
      - 'realtime-tenant-registry.js'
      - 'tenant-live-page.js'
      - 'storefront-page.js'
      - 'restaurant-storefront.js'
      - 'restaurant-storefront-v2.js'
      - 'pizzamaru-catalog.js'
      - 'jadam-storefront.js'
      - 'workspace-route-policy.js'
      - 'wrangler.space*.toml'
      - 'deploy/manifests/space.worker.json'
      - 'supabase/functions/workspace-api/**'
      - 'supabase/migrations/20260906001000_store_operating_spaces.sql'
      - 'supabase/migrations/20260906005000_store_user_site_provisioning.sql'
      - 'supabase/migrations/20260909003000_storefront_public_snapshot.sql'
      - 'supabase/migrations/20260906006000_store_admin_routing.sql'
      - 'supabase/migrations/20260914095000_organization_subsite_operations.sql'
      - 'supabase/migrations/20260909001000_public_storefront.sql'
      - 'supabase/migrations/20260913013000_ekodimall_canonical_path.sql'
      - 'supabase/tests/store_operating_spaces.test.sql'
      - 'supabase/tests/store_user_site_provisioning.test.sql'
      - 'test/store-operating-space.test.mjs'
      - 'test/store-user-site-admin.test.mjs'
      - 'test/storefront-public.test.mjs'
      - 'test/pizzamaru-full-menu-social.test.mjs'
      - 'test/jadam-storefront-brand.test.mjs'
      - 'test/ekodimission-shell-contract.test.mjs'
      - 'test/ekodimission-photo-upload.test.mjs'
      - 'scripts/validate-ekodimission-shell-contract.mjs'
      - 'scripts/verify-ekodimission-production.mjs'
      - '.github/workflows/deploy-space.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-space-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  SUPABASE_PROJECT_REF: renzehysxirjilvdxacv
  STORE_ROUTE_MIGRATION: supabase/migrations/20260906006000_store_admin_routing.sql
  ORGANIZATION_MIGRATION: supabase/migrations/20260914095000_organization_subsite_operations.sql

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate operating-space contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check space-worker.js
          node --check storefront-page.js
          node --check restaurant-storefront.js
          node --check restaurant-storefront-v2.js
          node --check pizzamaru-catalog.js
          node --check jadam-storefront.js
          node --check space/app.js
          node --test test/workspace-routing-10g.test.mjs test/store-operating-space.test.mjs test/store-user-site-admin.test.mjs test/storefront-public.test.mjs test/pizzamaru-full-menu-social.test.mjs test/jadam-storefront-brand.test.mjs test/ekodimission-site.test.mjs test/organization-subsite.test.mjs test/mnubiz-workspace.test.mjs
          node scripts/validate-ekodimission-shell-contract.mjs
          node --test test/ekodimission-shell-contract.test.mjs test/ekodimission-photo-upload.test.mjs
          grep -Fq "pattern = \"space.ekodi.kr\"" wrangler.space.toml
          grep -Fq 'binding = "STORAGE"' wrangler.space.toml
          grep -Fq 'service = "ekodi-storage-control"' wrangler.space.toml
          grep -Fq 'MISSION_ACTIVITY_MEDIA_UPLOAD_RE' space-worker.js
          grep -Fq "https://storage.internal/api/storage/v1/records" space-worker.js
          grep -Fq 'DATA_ENABLED = "false"' wrangler.space.staging.toml
          grep -Fq 'DATA_MODE = "isolated-staging"' wrangler.space.staging.toml
          grep -Fq 'path -> slug(locator) -> workspace_id -> relationship/policy -> role -> capability' space-worker.js
          grep -Fq 'workspace_not_found_or_forbidden' supabase/functions/workspace-api/index.ts
          grep -Fq 'tenant_members+RLS' supabase/functions/workspace-api/index.ts
          grep -Fq 'store_members+RLS' supabase/functions/workspace-api/index.ts
          grep -Fq 'current_store_operating_spaces' supabase/functions/workspace-api/index.ts
          grep -Fq '/spaces/store-dashboard' supabase/functions/workspace-api/index.ts
          grep -Fq 'space:["https://space.ekodi.kr"]' supabase/functions/workspace-api/index.ts
          grep -Fq '/spaces/resolve' space/app.js
          grep -Fq "routeModel:['/{slug}','/{slug}/{service}']" space-worker.js
          grep -Fq 'memberNamespaceRequired:false' space-worker.js
          test -f deploy/manifests/space.worker.json
          test -f supabase/migrations/20260906006000_store_admin_routing.sql
          grep -Fq 'store_admin_route_profile' supabase/migrations/20260906006000_store_admin_routing.sql
          grep -Fq 'store_public_storefront' supabase/migrations/20260909001000_public_storefront.sql
          test -f supabase/migrations/20260913013000_ekodimall_canonical_path.sql
          test -f supabase/migrations/20260921040000_ekodimall_root_canonical_path.sql
          grep -Fq "'domain','ekodi.kr/ekodimall'" supabase/migrations/20260921040000_ekodimall_root_canonical_path.sql
          grep -Fq 'publicStorefront' space/index.html
          grep -Fq 'storefront.json' platform-router-entry-worker.js

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-space-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Development boundary
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          grep -Fq 'DATA_ENABLED = "false"' wrangler.space.staging.toml
      - name: Deploy isolated operating-space staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.space.staging.toml
      - name: Verify staging or Cloudflare Access boundary
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@${WRANGLER_VERSION} deployments status --config wrangler.space.staging.toml --json > /tmp/space-stage-deployments.json
          test -s /tmp/space-stage-deployments.json
          for attempt in $(seq 1 12); do
            code=$(curl -sS -D /tmp/space-stage.headers -o /tmp/space-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health=$(curl -sS -o /tmp/space-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$code" == '200' && "$health" == '200' ]] && grep -Fq 'OPERATING SPACE' /tmp/space-stage.html && grep -Fq '"dataEnabled":false' /tmp/space-stage-health.json && grep -Fq '"dataMode":"isolated-staging"' /tmp/space-stage-health.json; then
              echo 'Operating Space staging verified with production data disabled.'
              exit 0
            fi
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print}' /tmp/space-stage.headers | tail -1)
            if [[ "$code" == '302' && "$location" == https://*.cloudflareaccess.com/cdn-cgi/access/login/* ]]; then
              echo 'Operating Space staging is deployed behind Cloudflare Access; source contracts and isolated-data configuration are verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Select Supabase production deployment path
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-}"
          [ -n "$token" ] || token="${TOKEN_B:-}"
          [ -n "$token" ] || token="${TOKEN_C:-}"
          [ -n "$token" ] || token="${TOKEN_D:-}"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
            echo "SUPABASE_SCHEMA_PREFLIGHT_MODE=management" >> "$GITHUB_ENV"
            echo 'Space schema preflight will use the configured Supabase Management API credential.'
          else
            echo "SUPABASE_ACCESS_TOKEN=" >> "$GITHUB_ENV"
            echo "SUPABASE_SCHEMA_PREFLIGHT_MODE=public-rpc-proof" >> "$GITHUB_ENV"
            echo 'No Supabase Management API credential is configured; Space release will fail closed unless all required public read-only RPC contracts are live.'
          fi

      - name: Heal and verify Supabase Space schema contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" != 'management' ]; then
            echo 'Management credential unavailable: schema mutation is disabled. Live public RPC proof is required before Worker release.'
            exit 0
          fi

          query_sql() {
            local sql="$1" out="$2"
            jq -n --arg query "$sql" '{query:$query,read_only:true}' > /tmp/space-schema-query.json
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/space-schema-query.json)
            [ "$code" = '201' ] || { echo "Space Supabase schema query failed with HTTP $code"; cat "$out"; exit 1; }
          }

          apply_migration() {
            local migration="$1"
            echo "Applying missing Space schema dependency: $migration"
            jq -Rs '{query:.,read_only:false}' "$migration" > /tmp/space-schema-migration.json
            local code
            code=$(curl -sS -o /tmp/space-schema-migration-result.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/space-schema-migration.json)
            [ "$code" = '201' ] || { echo "Space Supabase migration failed for $migration with HTTP $code"; cat /tmp/space-schema-migration-result.json; exit 1; }
          }

          proof_sql="select
            to_regprocedure('public.store_admin_route_profile(text)') is not null as store_route,
            to_regprocedure('public.organization_public_snapshot(text)') is not null as organization_public,
            to_regprocedure('public.store_public_storefront(text)') is not null as storefront_public,
            to_regprocedure('public.store_user_site_public_profile(text)') is not null as user_site_profile,
            to_regprocedure('public.store_user_site_public_snapshot(text)') is not null as user_site_snapshot;"

          query_sql "$proof_sql" /tmp/space-schema-before.json

          if ! grep -Fq '"store_route":true' /tmp/space-schema-before.json; then
            apply_migration "$STORE_ROUTE_MIGRATION"
          fi
          if ! grep -Fq '"organization_public":true' /tmp/space-schema-before.json; then
            apply_migration "$ORGANIZATION_MIGRATION"
          fi

          query_sql "$proof_sql" /tmp/space-schema-after.json
          for marker in '"store_route":true' '"organization_public":true' '"storefront_public":true' '"user_site_profile":true' '"user_site_snapshot":true'; do
            grep -Fq "$marker" /tmp/space-schema-after.json || { echo "Missing required Space Supabase contract: $marker"; cat /tmp/space-schema-after.json; exit 1; }
          done

          echo 'Space Supabase production schema contract verified through the Management API before Worker release.'

      - name: Verify anonymous public projection RPC schema proof
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          base="https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc"
          verify_rpc() {
            local name="$1" body="$2" out="$3" marker="${4:-}"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST "$base/$name" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$body")
            if [ "$code" != '200' ]; then
              echo "Required Space public RPC $name is unavailable (HTTP $code)." >&2
              cat "$out" || true
              exit 1
            fi
            if [ -n "$marker" ]; then
              grep -Fq "$marker" "$out" || { echo "Required Space public RPC $name returned an unexpected projection." >&2; cat "$out"; exit 1; }
            fi
          }

          verify_rpc store_admin_route_profile '{"p_operating_slug":"jadam"}' /tmp/store-route-proof.json '"slug"'
          verify_rpc organization_public_snapshot '{"p_slug":"hammu"}' /tmp/organization-proof.json '"publicationState"'
          verify_rpc store_public_storefront '{"p_slug":"jadam"}' /tmp/storefront-proof.json
          verify_rpc store_user_site_public_profile '{"p_slug":"jadam"}' /tmp/user-site-profile-proof.json
          verify_rpc store_user_site_public_snapshot '{"p_slug":"jadam"}' /tmp/user-site-snapshot-proof.json

          if [ "${SUPABASE_SCHEMA_PREFLIGHT_MODE:-}" = 'public-rpc-proof' ]; then
            echo 'Space Supabase production schema contract verified read-only through all five live public RPCs; schema mutation remained disabled.'
          else
            echo 'Space public RPC projections verified live after Management API schema preflight.'
          fi

      - name: Bootstrap or guarded release
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler@${WRANGLER_VERSION} deployments status --config wrangler.space.toml --json > /tmp/space-prod-deployments.json 2>&1; then
            node scripts/guarded-worker-release.mjs --manifest deploy/manifests/space.worker.json
          else
            if ! grep -Eq 'has no deployments|does not exist|code: 10007' /tmp/space-prod-deployments.json; then cat /tmp/space-prod-deployments.json; exit 1; fi
            npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.space.toml
            for attempt in $(seq 1 18); do
              root=$(curl -sS -o /tmp/space-live.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://space.ekodi.kr/' || true)
              health=$(curl -sS -o /tmp/space-live-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://space.ekodi.kr/health' || true)
              route=$(curl -sS -D /tmp/space-live-route.headers -o /tmp/space-live-route.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://space.ekodi.kr/deployment-probe' || true)
              root_location=$(curl -sSI --connect-timeout 5 --max-time 15 'https://space.ekodi.kr/' | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print}' | tail -1)
              if [[ "$root" == '308' && "$root_location" == 'https://ekodi.kr/my/' && "$health" == '200' && "$route" == '200' ]] && grep -Fq '"service":"ekodi-space"' /tmp/space-live-health.json && grep -Eiq '^x-ekodi-route:[[:space:]]*space-workspace' /tmp/space-live-route.headers; then
                echo 'Operating Space production bootstrap verified.'
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
      - name: Verify EKODI Mission production shell contract
        env:
          EKODI_MISSION_VERIFY_SCOPE: space
        run: node scripts/verify-ekodimission-production.mjs
      - name: Verify EKODI Mission collaborative photo upload surface
        shell: bash
        run: |
          set -euo pipefail
          archive='https://ekodi.kr/ekodimission/activities/261003-autumn-community-trip/archive'
          code=$(curl -sS -o /tmp/mission-archive.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$archive" || true)
          [ "$code" = '200' ]
          grep -Fq 'data-photo-upload' /tmp/mission-archive.html
          grep -Fq '사진 함께 올리기' /tmp/mission-archive.html
          api_code=$(curl -sS -o /tmp/mission-photo-api.json -w '%{http_code}' --connect-timeout 5 --max-time 20             'https://ekodi.kr/ekodimission/api/activities/261003-autumn-community-trip/media-upload' || true)
          [ "$api_code" = '405' ]
          echo 'Mission collaborative photo upload UI and POST-only API route are live.'
      - name: Verify mnubiz user UI, shared header and shared footer
        shell: bash
        run: |
          set -euo pipefail
          page_code=$(curl -sS -D /tmp/mnubiz.headers -o /tmp/mnubiz.html -w '%{http_code}' --connect-timeout 5 --max-time 20 'https://ekodi.kr/mnubiz/' || true)
          css_code=$(curl -sS -o /tmp/mnubiz.css -w '%{http_code}' --connect-timeout 5 --max-time 20 'https://ekodi.kr/mnubiz/assets/site.css' || true)
          [[ "$page_code" == '200' && "$css_code" == '200' ]]
          grep -Fq 'site-header mnubiz-header' /tmp/mnubiz.html
          grep -Fq 'data-ekodi-user-footer=' /tmp/mnubiz.html
          grep -Fq 'data-ekodi-user-header-root=' /tmp/mnubiz.html
          if grep -Fq 'data-ekodi-user-header-fallback' /tmp/mnubiz.html || grep -Fq '>Community</a>' /tmp/mnubiz.html; then
            echo 'mnubiz must keep exactly one site-owned header and must not inject the Community fallback header'
            exit 1
          fi
          grep -Fq 'data-ekodi-user-ai-entry="off"' /tmp/mnubiz.html
          grep -Fq '국립목포대학교 경영동문회' /tmp/mnubiz.html
          grep -Fq '.mnubiz-hero' /tmp/mnubiz.css
          grep -Fq 'body>main.mnubiz-main' /tmp/mnubiz.css
          grep -Fq -- '--ekodi-user-footer-background' /tmp/mnubiz.css
          if grep -Fq '/mnubiz/community' /tmp/mnubiz.html; then
            echo 'mnubiz public UI must not expose the legacy Community route'
            exit 1
          fi
          if grep -Fq '운영공간' /tmp/mnubiz.html || grep -Fq 'Workspace' /tmp/mnubiz.html; then
            echo 'mnubiz public UI must not expose legacy operating-space copy'
            exit 1
          fi
          if grep -Eq '<style[[:space:]>]' /tmp/mnubiz.html; then
            echo 'mnubiz must not depend on blocked inline CSS'
            exit 1
          fi
          grep -Eiq '^x-ekodi-shell:[[:space:]]*v2' /tmp/mnubiz.headers
          grep -Eiq '^x-ekodi-user-footer:[[:space:]]*shared' /tmp/mnubiz.headers
          echo 'mnubiz public UI verified with CSP-safe CSS and shared user chrome.'
