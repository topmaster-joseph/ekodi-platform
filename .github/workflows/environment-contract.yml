name: EKODI Environment Contract

on:
  pull_request:
    paths:
      - 'config/ekodi-environments.json'
      - 'config/supabase-environment-boundary.json'
      - 'EKODI_ENVIRONMENT_CONTRACT.md'
      - 'docs/operations/supabase-development-production-boundary.md'
      - 'scripts/validate-supabase-environment-boundary.mjs'
      - 'supabase/**'
      - '.github/workflows/environment-contract.yml'
      - '.github/workflows/supabase-environment-boundary.yml'
      - '.github/workflows/supabase-free-plan-liveness.yml'
  push:
    branches: [main, development]
    paths:
      - 'config/ekodi-environments.json'
      - 'config/supabase-environment-boundary.json'
      - 'EKODI_ENVIRONMENT_CONTRACT.md'
      - 'scripts/validate-supabase-environment-boundary.mjs'
      - 'supabase/**'
      - '.github/workflows/environment-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: EKODI DEV PROD Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate canonical environment mapping
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-supabase-environment-boundary.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/ekodi-environments.json').read_text())
          prod = data['environments']['production']
          dev = data['environments']['development']

          assert data['canonicalRepository'] == 'topmaster-joseph/ekodi-platform'
          assert prod['git'] == {'branch': 'main', 'githubEnvironment': 'production'}
          assert dev['git']['branch'] == 'development'
          assert dev['git']['githubEnvironment'] == 'development'
          assert prod['supabase']['logicalName'] == 'ekodi-prod'
          assert prod['supabase']['currentProjectRef'] == 'renzehysxirjilvdxacv'
          assert dev['supabase']['logicalName'] == 'ekodi-dev'
          assert dev['supabase']['currentProjectRef'] == 'lxcxwbdwwojjkgybbqii'
          assert dev['supabase']['realUserDataAllowed'] is False
          assert dev['supabase']['productionCredentialAccessAllowed'] is False
          assert data['promotion']['directPushToMainAllowed'] is False
          assert data['promotion']['directDevelopmentMutationOfProductionAllowed'] is False
          assert data['traffic']['targetConcurrentUsers'] == 100000
          assert data['legacyDrain']['noNewProductionDependencies'] is True
          assert data['legacyDrain']['destructiveCleanupAllowedBeforeDependencyProof'] is False
          PY

      - name: Enforce cross-environment project-ref boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/development ]; then
            ! grep -R --line-number --fixed-strings 'renzehysxirjilvdxacv' supabase/development
          fi
          if [ -d supabase/production ]; then
            ! grep -R --line-number --fixed-strings 'lxcxwbdwwojjkgybbqii' supabase/production
          fi

      - name: Validate liveness safety
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260906143000_add_ekodi_platform_keepalive_rpc.sql'
          liveness='.github/workflows/supabase-free-plan-liveness.yml'
          test -f "$migration"
          test -f "$liveness"
          grep -Fq 'security invoker' "$migration"
          grep -Fq 'select true' "$migration"
          ! grep -Eiq 'service[_-]?role|database[_-]?password|postgresql://' "$liveness" || {
            echo '::error::Privileged database credentials are forbidden in the liveness workflow.'
            exit 1
          }

      - name: Summarize contract
        run: |
          {
            echo '### EKODI environment contract'
            echo '- main / production -> ekodi-prod'
            echo '- development / PR staging -> ekodi-dev'
            echo '- production data never copies back to development'
            echo '- Cloudflare-first scaling target: 100,000 concurrent users'
            echo '- legacy ekodi-church dependencies are drain-only; no new production dependency'
          } >> "$GITHUB_STEP_SUMMARY"
