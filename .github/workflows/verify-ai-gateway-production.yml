name: Verify EKODI AI Commons Production

on:
  workflow_run:
    workflows: ['Deploy EKODI AI Control Plane']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-ai-commons-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Require guarded upstream success
        if: github.event_name == 'workflow_run'
        run: |
          test "$UPSTREAM_CONCLUSION" = 'success' || (echo "Guarded upstream was $UPSTREAM_CONCLUSION" && exit 1)
      - name: Verify AI Commons production contract with bounded retries
        id: commons
        shell: bash
        run: |
          set -euo pipefail
          passed='false'
          for attempt in $(seq 1 8); do
            canonical_code=$(curl -sS -D /tmp/ai-canonical-headers -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai' || true)
            root_code=$(curl -sS -D /tmp/ai-root-headers -o /tmp/ai-root -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai/' || true)
            health_code=$(curl -sS -o /tmp/ai-health -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai/__health' || true)
            services_code=$(curl -sS -o /tmp/ai-services -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai/api/commons/services' || true)
            requests_code=$(curl -sS -o /tmp/ai-requests -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai/api/commons/requests' || true)
            ideas_code=$(curl -sS -o /tmp/ai-ideas -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ai/api/commons/ideas' || true)
            if [ "$canonical_code" = '308' ] \
              && [ "$root_code" = '200' ] \
              && [ "$health_code" = '200' ] \
              && [ "$services_code" = '200' ] \
              && [ "$requests_code" = '200' ] \
              && [ "$ideas_code" = '401' ] \
              && grep -Fiq 'location: https://ekodi.kr/ai/' /tmp/ai-canonical-headers \
              && grep -Fiq 'x-ekodi-canonical-surface: ai' /tmp/ai-root-headers \
              && grep -Fiq 'x-ekodi-canonical-path: /ai' /tmp/ai-root-headers \
              && grep -Fq 'EKODI 모두의 AI 프로젝트' /tmp/ai-root \
              && grep -Fq '"platform":"ai-control"' /tmp/ai-health \
              && grep -Fq '"surface":"runtime-and-commons"' /tmp/ai-health \
              && grep -Fq '"commons":true' /tmp/ai-health \
              && grep -Fq '"categories"' /tmp/ai-services \
              && grep -Fq '"requests"' /tmp/ai-requests \
              && grep -Fq 'authentication_required' /tmp/ai-ideas; then
              passed='true'
              break
            fi
            echo "AI Commons verification pending (attempt $attempt/8 canonical=$canonical_code root=$root_code health=$health_code services=$services_code requests=$requests_code ideas=$ideas_code)"
            sleep 8
          done
          test "$passed" = 'true' || (echo 'AI Commons production verification failed within bounded retries.' && exit 1)
          echo '✅ ekodi.kr/ai/ production contract verified.'
      - name: Publish AI Commons production failure checkpoint
        if: ${{ always() && steps.commons.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.commons.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${UPSTREAM_SHA:-$CURRENT_SHA}"
          body=$(cat <<EOF
          ❌ **AI COMMONS PRODUCTION NOT VERIFIED**

          - commit: \`$commit\`
          - guarded upstream: \`${UPSTREAM_CONCLUSION:-manual}\`
          - canonical user surface: https://ekodi.kr/ai/
          - AI Commons production check: \`$VERIFY_OUTCOME\`
          - security: browsing is public; request/save actions remain authenticated
          - verification workflow: $RUN_URL
          - upstream workflow: ${UPSTREAM_RUN_URL:-manual}
          - checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
          gh issue comment 443 --repo "$GITHUB_REPOSITORY" --body "$body"
