name: Verify EKODI AI Runtime Production

on:
  workflow_run:
    workflows: ['Deploy EKODI AI Control Plane']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-ai-runtime-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Require guarded upstream success
        if: github.event_name == 'workflow_run'
        run: |
          test "$UPSTREAM_CONCLUSION" = 'success' || (echo "Guarded upstream was $UPSTREAM_CONCLUSION" && exit 1)
      - name: Verify AI Runtime production contract with bounded retries
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          passed='false'
          for attempt in $(seq 1 3); do
            root_code=$(curl -sS -D /tmp/ai-root-headers -o /tmp/ai-root -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ai.ekodi.kr/' || true)
            health_code=$(curl -sS -D /tmp/ai-health-headers -o /tmp/ai-health -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ai.ekodi.kr/__health' || true)
            config_code=$(curl -sS -o /tmp/ai-config -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ai.ekodi.kr/config.js' || true)
            status_code=$(curl -sS -o /tmp/ai-status -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ai.ekodi.kr/api/status' || true)
            exchange_code=$(curl -sS -o /tmp/ai-exchange -w '%{http_code}' --connect-timeout 5 --max-time 15 -X POST 'https://ai.ekodi.kr/api/auth/exchange' || true)

            if [ "$root_code" = '307' ] \
              && [ "$health_code" = '200' ] \
              && [ "$config_code" = '410' ] \
              && [ "$status_code" = '401' ] \
              && [ "$exchange_code" = '410' ] \
              && grep -Fiq 'location: https://admin.ekodi.kr/?route=common-services&service=ai' /tmp/ai-root-headers \
              && grep -Fiq 'x-ekodi-route: ai-runtime-admin-handoff' /tmp/ai-root-headers \
              && grep -Fiq 'cache-control: no-store' /tmp/ai-root-headers \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/ai-root-headers \
              && grep -Fq '"platform":"ai-control"' /tmp/ai-health \
              && grep -Fq '"surface":"runtime-only"' /tmp/ai-health \
              && grep -Fq 'operator_surface_moved' /tmp/ai-config \
              && grep -Fq 'authentication_required' /tmp/ai-status \
              && grep -Fq 'service_local_auth_retired' /tmp/ai-exchange; then
              passed='true'
              break
            fi
            echo "AI Runtime verification pending (attempt $attempt/3 root=$root_code health=$health_code config=$config_code status=$status_code exchange=$exchange_code)"
            sleep 4
          done
          test "$passed" = 'true' || (echo 'AI Runtime production verification failed within bounded retries.' && exit 1)
          echo '✅ ai.ekodi.kr runtime-only production contract verified.'

      - name: Publish AI Runtime production failure checkpoint
        if: ${{ always() && steps.runtime.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.runtime.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${UPSTREAM_SHA:-$CURRENT_SHA}"
          body=$(cat <<EOF
          ❌ **AI RUNTIME PRODUCTION NOT VERIFIED**

          - commit: \`$commit\`
          - guarded upstream: \`${UPSTREAM_CONCLUSION:-manual}\`
          - AI Runtime production check: \`$VERIFY_OUTCOME\`
          - operator surface: central Admin only
          - canonical runtime: https://ai.ekodi.kr/
          - security: detailed status requires Central Admin authority; service-local auth is retired
          - verification workflow: $RUN_URL
          - upstream workflow: ${UPSTREAM_RUN_URL:-manual}
          - checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
          gh issue comment 443 --repo "$GITHUB_REPOSITORY" --body "$body"
