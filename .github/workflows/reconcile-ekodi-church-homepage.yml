name: Reconcile EKODI Church Production

on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'EKODI Orchestrator-issued ai/<agent>/orch_<task> release branch'
        required: false
        type: string
      release_task_id:
        description: 'Matching EKODI Orchestrator release task ID'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: ekodi-church-production-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical EKODI orchestrator source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare Church main with production marker
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git ls-remote https://github.com/topmaster-joseph/ekodi-church.git refs/heads/main | awk '{print $1}')
          test "$source_sha"
          deployed_sha=$(curl -fsS --connect-timeout 5 --max-time 15 'https://ekodi.kr/ekodichurch/church-release.json?reconcile=1' 2>/dev/null | jq -r '.sourceSha // empty' || true)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          if [[ "$source_sha" == "$deployed_sha" ]]; then
            echo 'needs_deploy=false' >> "$GITHUB_OUTPUT"
            echo "Church production already converged at $source_sha"
          else
            echo 'needs_deploy=true' >> "$GITHUB_OUTPUT"
            echo "Church drift detected: source=$source_sha production=${deployed_sha:-missing}"
          fi

      - name: Dispatch only with live EKODI Orchestrator receipt
        if: steps.compare.outputs.needs_deploy == 'true'
        shell: bash
        env:
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
          EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
        run: node scripts/dispatch-guarded-church-release.mjs
