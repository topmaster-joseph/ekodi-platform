name: Deploy EKODIBIZ Revenue OS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ekodibiz/**'
      - 'ekodibiz-worker.js'
      - 'ekodibiz-payment-worker.js'
      - 'wrangler.ekodibiz*.toml'
      - 'test/ekodibiz-revenue-os.test.mjs'
      - 'deploy/manifests/ekodibiz.worker.json'
      - '.github/workflows/deploy-ekodibiz.yml'
  push:
    branches: [main]
    paths:
      - 'ekodibiz/**'
      - 'ekodibiz-worker.js'
      - 'ekodibiz-payment-worker.js'
      - 'wrangler.ekodibiz*.toml'
      - 'test/ekodibiz-revenue-os.test.mjs'
      - 'deploy/manifests/ekodibiz.worker.json'
      - '.github/workflows/deploy-ekodibiz.yml'

permissions:
  contents: read

concurrency:
  group: ekodibiz-revenue-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate source and safety boundaries
        run: |
          set -euo pipefail
          node --check ekodibiz-worker.js
          node --check ekodibiz-payment-worker.js
          node --check ekodibiz/app.js
          node --test test/ekodibiz-revenue-os.test.mjs
          npm run validate:boundaries
          npm run validate:ui-dna
          npm run validate:mission
          grep -Fq 'main = "ekodibiz-payment-worker.js"' wrangler.ekodibiz.toml
          grep -Fq 'pattern = "biz.ekodi.kr"' wrangler.ekodibiz.toml
          ! grep -Fq 'pattern = "business.ekodi.kr"' wrangler.ekodibiz.toml
          grep -Fq 'PAYMENT_SERVICE_URL = "https://pay.biz.ekodi.kr"' wrangler.ekodibiz.toml
          grep -Fq 'HIGH_IMPACT_APPROVAL = "required"' wrangler.ekodibiz.toml
          grep -Fq '[exports.RevenueStore]' wrangler.ekodibiz.toml
          grep -Fq 'storage = "sqlite"' wrangler.ekodibiz.toml
          grep -Fq 'https://pay.biz.ekodi.kr' deploy/manifests/ekodibiz.worker.json
      - name: Validate Cloudflare bundle
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.ekodibiz-staging.toml --outdir /tmp/ekodibiz-staging-dry
          npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.ekodibiz.toml --outdir /tmp/ekodibiz-production-dry

  deploy-staging:
    needs: validate
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify development credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated staging
        run: npx --yes wrangler@4.127.1 deploy --config wrangler.ekodibiz-staging.toml
      - name: Verify functional bundle and AI operations locally
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/ekodibiz-local-runtime.log
          npx --yes wrangler@4.127.1 dev --config wrangler.ekodibiz-staging.toml --local --port 8787 >"$log" 2>&1 &
          runtime_pid=$!
          cleanup() { kill "$runtime_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -sSf --max-time 5 'http://127.0.0.1:8787/api/health' >/tmp/ekodibiz-health.json 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 2
          done
          [[ "$ready" == "1" ]] || { cat "$log"; exit 1; }
          root=$(curl -L -sS --max-time 15 'http://127.0.0.1:8787/' || true)
          health=$(cat /tmp/ekodibiz-health.json)
          catalog=$(curl -sS --max-time 15 'http://127.0.0.1:8787/api/catalog' || true)
          consult=$(curl -sS --max-time 15 -H 'content-type: application/json' -d '{"goal":"식당 매출을 늘리고 싶어요"}' 'http://127.0.0.1:8787/api/consult' || true)
          lead_id=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.leadId||"")' "$consult")
          offer=$(curl -sS --max-time 15 -H 'content-type: application/json' -d "{\"goal\":\"식당 매출을 늘리고 싶어요\",\"offerId\":\"growth-30\",\"leadId\":\"$lead_id\"}" 'http://127.0.0.1:8787/api/offers' || true)
          order_id=$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.orderId||"")' "$offer")
          sleep 1
          ops=$(curl -sS --max-time 15 'http://127.0.0.1:8787/api/ops/status' || true)
          checkout=$(curl -sS --max-time 15 -H 'content-type: application/json' -d "{\"orderId\":\"$order_id\"}" 'http://127.0.0.1:8787/api/checkout-intent' || true)
          grep -Fq '무엇을 이루고 싶으세요?' <<<"$root"
          grep -Fq 'operational-mvp' <<<"$health"
          grep -Fq 'durable-object-sqlite' <<<"$health"
          grep -Fq 'https://pay.biz.ekodi.kr' <<<"$health"
          grep -Fq '30일 자동홍보팩' <<<"$catalog"
          grep -Fq 'LEAD-' <<<"$consult"
          grep -Fq 'EB-' <<<"$offer"
          grep -Fq '"taskCount":4' <<<"$offer"
          grep -Fq 'growth_scout' <<<"$ops"
          grep -Fq 'finance_gatekeeper' <<<"$ops"
          grep -Fq '"tasks":4' <<<"$ops"
          grep -Fq 'approval_required' <<<"$checkout"
          grep -Fq 'https://pay.biz.ekodi.kr' <<<"$checkout"
          ! grep -Fq 'https://pay.ekodi.kr' <<<"$checkout"
          echo 'EKODIBIZ staging functional AI operations and canonical payment gateway verified.'

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Bootstrap Worker if it does not exist
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out=$(npx --yes wrangler@4.127.1 deployments status --config wrangler.ekodibiz.toml --json 2>&1)
          code=$?
          set -e
          if [[ $code -ne 0 ]] && grep -Fq 'does not exist' <<<"$out"; then
            npx --yes wrangler@4.127.1 deploy --config wrangler.ekodibiz.toml
          elif [[ $code -ne 0 ]]; then
            printf '%s\n' "$out"; exit $code
          fi
      - name: Guarded production release
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/ekodibiz.worker.json
      - name: Verify production hostname and operations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS --max-time 15 'https://biz.ekodi.kr/' || true)
            health=$(curl -sS --max-time 15 'https://biz.ekodi.kr/api/health' || true)
            catalog=$(curl -sS --max-time 15 'https://biz.ekodi.kr/api/catalog' || true)
            ops=$(curl -sS --max-time 15 'https://biz.ekodi.kr/api/ops/status' || true)
            if grep -Fq '무엇을 이루고 싶으세요?' <<<"$root" \
              && grep -Fq 'operational-mvp' <<<"$health" \
              && grep -Fq 'approval-gated' <<<"$health" \
              && grep -Fq 'durable-object-sqlite' <<<"$health" \
              && grep -Fq 'https://pay.biz.ekodi.kr' <<<"$health" \
              && grep -Fq '행사 완성팩' <<<"$catalog" \
              && grep -Fq 'finance_gatekeeper' <<<"$ops"; then
              echo 'EKODIBIZ production verified and operations active with canonical payment gateway.'
              exit 0
            fi
            sleep 5
          done
          exit 1
