name: EKODI Church Native UI Capability Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-church-live-ui-with-synthetic-session.mjs'
      - '.github/workflows/verify-church-native-ui-capability.yml'
      - 'test/church-native-ui-capability-contract.test.mjs'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-church-live-ui-with-synthetic-session.mjs'
      - '.github/workflows/verify-church-native-ui-capability.yml'
      - 'test/church-native-ui-capability-contract.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-church-native-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate synthetic-auth browser test safety
        run: |
          set -euo pipefail
          node --check scripts/verify-church-live-ui-with-synthetic-session.mjs
          node --test test/church-native-ui-capability-contract.test.mjs
      - name: Install first-party isolated Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live Church UI, synthetic capability, no live admin bearer
        run: node scripts/verify-church-live-ui-with-synthetic-session.mjs
      - name: Upload proof without any browser profile or secrets
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ekodi-church-native-ui-capability-proof
          path: artifacts/church-worship-ui/evidence.json
          if-no-files-found: ignore
          retention-days: 7
