# 2026-10-15 EKODI production integrity migration 0132 post-release read-only Chromium revalidation
name: EKODI AI Assistance Native Production Evidence

on:
  push:
    branches:
      - ai/chatgpt/20261015-ai-assistance-native-e2e
    paths:
      - .github/workflows/ai-assistance-native-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check actual EKODI production routes and anonymous write isolation
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://ekodi.kr';
          async function get(path){
            const response=await fetch(base+path,{headers:{'accept':'*/*','cache-control':'no-cache'},redirect:'manual',signal:AbortSignal.timeout(15000)});
            const text=await response.text();
            return {response,text};
          }
          const home=await get('/ai/');
          assert.equal(home.response.status,200,'/ai/ public homepage status');
          for(const id of ['support-programs','support-detail','supportNotices','assistanceRequestForm','assistanceContractText','assistancePriceSummary','assistanceQuotePanel','assistanceAdminPanel','assistanceAcknowledgmentForm','assistanceMerchantQuoteForm','assistancePricingSection','assistancePricebookForm','assistancePricebookRows']){
            assert.ok(home.text.includes('id="'+id+'"'),'/ai/ missing '+id);
          }
          const css=await get('/ai/api/commons/style');
          assert.equal(css.response.status,200,'/ai/ CSS status');
          assert.ok(css.text.includes('.assistance-plan'),'production CSS does not include assistance');
          const js=await get('/ai/api/commons/client');
          assert.equal(js.response.status,200,'/ai/ browser client status');
          assert.ok(js.text.includes('openSupportDetail'),'production browser JS does not include assistance');
          assert.ok(js.text.includes('openAssistanceQuote'),'production JS missing contract review');
          assert.ok(js.text.includes('loadAssistanceAdmin'),'production JS missing approved-quote management');
          assert.ok(js.text.includes('loadAssistancePricebook'),'production JS missing approved standard-price management');
          const catalog=await get('/ai/api/commons/assistance/catalog');
          assert.equal(catalog.response.status,200,'assistance catalog public API');
          const data=JSON.parse(catalog.text);
          assert.equal(data.merchant,'EKODIBIZ');
          assert.equal(data.plans?.length,6);
          assert.equal(data.checkoutEnabled,false);
          assert.equal(data.agreementExecutionEnabled,false);
          assert.equal(data.plans.find(p=>p.id==='information').price.amount,0);
          for(const plan of data.plans.filter(p=>p.id!=='information')){
            assert.ok(['quote_required','fixed'].includes(plan.price.kind),'unexpected published price state');
            if(plan.price.kind==='fixed'){
              assert.equal(plan.price.currency,'KRW');
              assert.equal(plan.price.vatIncluded,true);
              assert.ok(Number.isSafeInteger(plan.price.amount)&&plan.price.amount>=0);
              assert.ok(plan.price.policyVersion);
            }else assert.equal(plan.price.amount,null);
          }
          const privateList=await get('/ai/api/commons/assistance/requests');
          const privateQuote=await get('/ai/api/commons/assistance/requests/00000000-0000-0000-0000-000000000000');
          assert.equal(privateQuote.response.status,401,'anonymous user must not inspect quote detail');
          const merchantList=await get('/ai/api/commons/admin/assistance/requests');
          const merchantPrices=await get('/ai/api/commons/admin/assistance/pricebook');
          assert.equal(merchantPrices.response.status,401,'anonymous user must not access merchant standard-price approval');
          assert.equal(merchantList.response.status,401,'anonymous user must not view merchant quote management');
          assert.equal(privateList.response.status,401,'anonymous user must not read assistance requests');
          console.log(JSON.stringify({ok:true,origin:base,home:home.response.status,css:css.response.status,js:js.response.status,catalog:catalog.response.status,planCount:data.plans.length,anonymousRequests:privateList.response.status,anonymousQuote:privateQuote.response.status,anonymousMerchant:merchantList.response.status,anonymousMerchantPricebook:merchantPrices.response.status,contractSigned:false,paymentExecuted:false}));
          JS

  native-browser:
    strategy:
      fail-fast: false
      matrix:
        device_profile: [desktop, mobile-portrait]
    uses: ./.github/workflows/ekodi-background-browser-worker.yml
    with:
      surface_path: /ai/
      surface_paths: /ai/
      device_profile: ${{ matrix.device_profile }}
