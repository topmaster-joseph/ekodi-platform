name: Ecosystem Bounded Load Test

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the approved production load check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-bounded-production-load
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOAD_TARGETS_JSON: >-
        [{"label":"root","url":"https://ekodi.kr/"},{"label":"admin","url":"https://admin.ekodi.kr/"},{"label":"api-health","url":"https://api.ekodi.kr/health"},{"label":"biz","url":"https://biz.ekodi.kr/"},{"label":"marketing","url":"https://marketing.ekodi.kr/"},{"label":"church","url":"https://church.ekodi.kr/"},{"label":"lab","url":"https://lab.ekodi.kr/"},{"label":"support","url":"https://support.ekodi.kr/"}]
      LOAD_CONCURRENCY: '1'
      LOAD_REQUESTS_PER_STAGE: '5'
      LOAD_TIMEOUT_MS: '5000'
      LOAD_P95_BUDGET_MS: '1500'
      LOAD_INCIDENT_P95_MS: '3000'
      LOAD_ERROR_RATE_BUDGET: '0.05'
    steps:
      - name: Block production load from development branch
        shell: bash
        run: |
          echo '::error::Production load testing is disabled from the development branch. Use the main-branch manual workflow only.'
          exit 1
