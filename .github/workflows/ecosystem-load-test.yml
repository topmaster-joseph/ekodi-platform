name: Ecosystem Bounded Load Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ecosystem-load-test.yml'
      - 'scripts/ecosystem-load-test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-bounded-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOAD_CONCURRENCY: '1,5,10,20'
      LOAD_REQUESTS_PER_STAGE: '40'
      LOAD_TIMEOUT_MS: '5000'
      LOAD_P95_BUDGET_MS: '1500'
      LOAD_INCIDENT_P95_MS: '2500'
      LOAD_ERROR_RATE_BUDGET: '0.01'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run bounded production load test
        run: node scripts/ecosystem-load-test.mjs

      - name: Publish load summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/ecosystem-load-test.md ]; then
            cat artifacts/ecosystem-load-test.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Load test did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-load-test
          path: |
            artifacts/ecosystem-load-test.json
            artifacts/ecosystem-load-test.md
          if-no-files-found: warn
          retention-days: 14
