name: Supabase Local CI

on:
  # This check is required by main branch protection. Keep PR validation unconditional
  # so path-filtered changes do not leave the required check permanently "expected".
  pull_request: {}
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'auth-site/**'
      - 'test/**'
      - 'scripts/validate-supabase-public-grants.mjs'
      - '.github/workflows/supabase-local-ci.yml'

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.110.0'
  TEST_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Supabase-impacting changes
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(supabase/|auth-site/|scripts/validate-supabase-public-grants\.mjs$|test/[^/]*supabase[^/]*\.test\.mjs$|\.github/workflows/supabase-local-ci\.yml$)'; then
            echo 'needs_db=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_db=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        with:
          node-version: '24'

      - name: Validate explicit Supabase public-object access policy
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        run: |
          node scripts/validate-supabase-public-grants.mjs
          node --test test/supabase-public-grants-policy.test.mjs

      - name: Initialize ephemeral Supabase config
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        run: npx --yes supabase@$SUPABASE_CLI_VERSION init --force

      - name: Start database-only Supabase
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/ekodi-migrations"
          mkdir -p supabase/migrations
          npx --yes supabase@$SUPABASE_CLI_VERSION db start
          rm -rf supabase/migrations
          mv "$RUNNER_TEMP/ekodi-migrations" supabase/migrations

      - name: Apply production-compatible test baseline
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/ci/platform_baseline.sql

      - name: Apply proposed migrations on baseline
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n1)"
          test -n "$db_container"
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Prove secure defaults for new public objects
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.__ekodi_grant_probe(id bigint primary key);
          create sequence public.__ekodi_grant_probe_seq;
          create function public.__ekodi_grant_probe_fn() returns integer
          language sql
          as $func$ select 1 $func$;

          do $block$
          declare
            role_name text;
          begin
            foreach role_name in array array['anon','authenticated','service_role'] loop
              if has_table_privilege(role_name,'public.__ekodi_grant_probe','select')
                 or has_table_privilege(role_name,'public.__ekodi_grant_probe','insert')
                 or has_table_privilege(role_name,'public.__ekodi_grant_probe','update')
                 or has_table_privilege(role_name,'public.__ekodi_grant_probe','delete') then
                raise exception 'unexpected table privilege for %', role_name;
              end if;
              if has_sequence_privilege(role_name,'public.__ekodi_grant_probe_seq','usage')
                 or has_sequence_privilege(role_name,'public.__ekodi_grant_probe_seq','select') then
                raise exception 'unexpected sequence privilege for %', role_name;
              end if;
              if has_function_privilege(role_name,'public.__ekodi_grant_probe_fn()','execute') then
                raise exception 'unexpected function privilege for %', role_name;
              end if;
            end loop;
          end
          $block$;

          drop function public.__ekodi_grant_probe_fn();
          drop sequence public.__ekodi_grant_probe_seq;
          drop table public.__ekodi_grant_probe;
          SQL

      - name: Lint Postgres functions
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        run: >-
          npx --yes supabase@$SUPABASE_CLI_VERSION db lint
          --db-url "$TEST_DB_URL"
          --level error
          --fail-on error

      - name: Run pgTAP database contracts
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        run: npx --yes supabase@$SUPABASE_CLI_VERSION test db --db-url "$TEST_DB_URL"

      - name: Run application contract tests
        if: github.event_name != 'pull_request' || steps.scope.outputs.needs_db == 'true'
        run: npm test

      - name: Stop ephemeral Supabase database
        if: always()
        shell: bash
        run: |
          npx --yes supabase@$SUPABASE_CLI_VERSION stop --no-backup || true
          docker ps -aq --filter 'name=supabase_db_' | xargs -r docker rm -f || true
