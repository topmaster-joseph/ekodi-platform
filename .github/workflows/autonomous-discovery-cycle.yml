name: EKODI Autonomous Discovery Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'ekodi-autonomous-discovery-engine.js'
      - 'ekodi-autonomous-evolution-loop.js'
      - 'autonomous-evolution-store.js'
      - 'scripts/run-autonomous-discovery-cycle.mjs'
      - 'scripts/collect-autonomous-research-evidence.mjs'
      - 'scripts/run-autonomous-evolution-loop.mjs'
      - 'test/autonomous-discovery-engine.test.mjs'
      - 'test/autonomous-discovery-cycle.test.mjs'
      - 'test/autonomous-evolution-loop.test.mjs'
      - 'test/autonomous-research-evidence.test.mjs'
      - 'governance/architecture/ekodi-autonomous-discovery-engine.json'
      - 'migrations/0079_autonomous_evolution_lifecycle.sql'
      - '.github/workflows/autonomous-discovery-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'ekodi-autonomous-discovery-engine.js'
      - 'ekodi-autonomous-evolution-loop.js'
      - 'autonomous-evolution-store.js'
      - 'scripts/run-autonomous-discovery-cycle.mjs'
      - 'scripts/collect-autonomous-research-evidence.mjs'
      - 'scripts/run-autonomous-evolution-loop.mjs'
      - 'governance/architecture/ekodi-autonomous-discovery-engine.json'
      - 'migrations/0079_autonomous_evolution_lifecycle.sql'
      - '.github/workflows/autonomous-discovery-cycle.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ekodi-autonomous-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate discovery, research and evolution lifecycle
        run: |
          node --check ekodi-autonomous-discovery-engine.js
          node --check ekodi-autonomous-evolution-loop.js
          node --check autonomous-evolution-store.js
          node --check scripts/run-autonomous-discovery-cycle.mjs
          node --check scripts/collect-autonomous-research-evidence.mjs
          node --check scripts/run-autonomous-evolution-loop.mjs
          node --test \
            test/autonomous-discovery-engine.test.mjs \
            test/autonomous-discovery-cycle.test.mjs \
            test/autonomous-evolution-loop.test.mjs \
            test/autonomous-research-evidence.test.mjs

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Collect recent GitHub Actions evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | {databaseId: .id, workflowName: .name, status: .status, conclusion: .conclusion, createdAt: .created_at, url: .html_url, event: .event}]' \
            > "$RUNNER_TEMP/ekodi-workflow-runs.json"

      - name: Run read-only discovery cycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-autonomous-discovery-cycle.mjs \
            --runs "$RUNNER_TEMP/ekodi-workflow-runs.json" \
            --output "$RUNNER_TEMP/ekodi-autonomous-discovery-report.json" \
            --summary "$RUNNER_TEMP/ekodi-autonomous-discovery-summary.md"
          cat "$RUNNER_TEMP/ekodi-autonomous-discovery-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect research evidence down to failed jobs and steps
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect-autonomous-research-evidence.mjs \
            --discovery "$RUNNER_TEMP/ekodi-autonomous-discovery-report.json" \
            --runs "$RUNNER_TEMP/ekodi-workflow-runs.json" \
            --output "$RUNNER_TEMP/ekodi-autonomous-research-evidence.json" \
            > /dev/null

      - name: Run autonomous evolution lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-autonomous-evolution-loop.mjs \
            --discovery "$RUNNER_TEMP/ekodi-autonomous-discovery-report.json" \
            --evidence "$RUNNER_TEMP/ekodi-autonomous-research-evidence.json" \
            --output "$RUNNER_TEMP/ekodi-autonomous-evolution-report.json" \
            --summary "$RUNNER_TEMP/ekodi-autonomous-evolution-summary.md"
          cat "$RUNNER_TEMP/ekodi-autonomous-evolution-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce research and evolution authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const root = process.env.RUNNER_TEMP;
          const discovery = JSON.parse(fs.readFileSync(root + '/ekodi-autonomous-discovery-report.json', 'utf8'));
          const research = JSON.parse(fs.readFileSync(root + '/ekodi-autonomous-research-evidence.json', 'utf8'));
          const evolution = JSON.parse(fs.readFileSync(root + '/ekodi-autonomous-evolution-report.json', 'utf8'));
          const violated = discovery.productionMutationPerformed !== false
            || discovery.authorityExpanded !== false
            || discovery.cycle?.productionMutationPerformed !== false
            || discovery.cycle?.authorityExpanded !== false
            || research.productionMutationPerformed !== false
            || research.authorityExpanded !== false
            || evolution.productionMutationPerformed !== false
            || evolution.authorityExpanded !== false
            || evolution.automaticPromotionPerformed !== false;
          if (violated) throw new Error('Autonomous evolution cycle crossed its delegated authority boundary');
          NODE
          echo 'Verified: autonomous research/evolution remains non-production-mutating, non-authority-expanding, and non-self-promoting.'

      - name: Upload autonomous evolution evidence
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-autonomous-evolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ekodi-autonomous-discovery-report.json
            ${{ runner.temp }}/ekodi-autonomous-research-evidence.json
            ${{ runner.temp }}/ekodi-autonomous-evolution-report.json
            ${{ runner.temp }}/ekodi-autonomous-discovery-summary.md
            ${{ runner.temp }}/ekodi-autonomous-evolution-summary.md
          if-no-files-found: error
          retention-days: 90
