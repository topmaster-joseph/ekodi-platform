name: EKODI Autonomous Discovery Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'ekodi-autonomous-discovery-engine.js'
      - 'scripts/run-autonomous-discovery-cycle.mjs'
      - 'test/autonomous-discovery-engine.test.mjs'
      - 'test/autonomous-discovery-cycle.test.mjs'
      - 'governance/architecture/ekodi-autonomous-discovery-engine.json'
      - '.github/workflows/autonomous-discovery-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'ekodi-autonomous-discovery-engine.js'
      - 'scripts/run-autonomous-discovery-cycle.mjs'
      - 'governance/architecture/ekodi-autonomous-discovery-engine.json'
      - '.github/workflows/autonomous-discovery-cycle.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ekodi-autonomous-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate discovery engine and evidence adapter
        run: |
          node --check ekodi-autonomous-discovery-engine.js
          node --check scripts/run-autonomous-discovery-cycle.mjs
          node --test test/autonomous-discovery-engine.test.mjs test/autonomous-discovery-cycle.test.mjs

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Collect recent GitHub Actions evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | {databaseId: .id, workflowName: .name, status: .status, conclusion: .conclusion, createdAt: .created_at, url: .html_url, event: .event}]' \
            > "$RUNNER_TEMP/ekodi-workflow-runs.json"

      - name: Run read-only discovery cycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-autonomous-discovery-cycle.mjs \
            --runs "$RUNNER_TEMP/ekodi-workflow-runs.json" \
            --output "$RUNNER_TEMP/ekodi-autonomous-discovery-report.json" \
            --summary "$RUNNER_TEMP/ekodi-autonomous-discovery-summary.md"
          cat "$RUNNER_TEMP/ekodi-autonomous-discovery-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce research-only runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ekodi-autonomous-discovery-report.json','utf8'));if(p.productionMutationPerformed!==false||p.authorityExpanded!==false||p.cycle?.productionMutationPerformed!==false||p.cycle?.authorityExpanded!==false){throw new Error('Discovery cycle crossed the research-only authority boundary')}"
          echo 'Verified: discovery cycle is read-only, non-production-mutating, and non-authority-expanding.'
