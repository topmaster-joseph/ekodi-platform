name: Diagnose Marketing Access

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-marketing-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Access and Marketing Pages topology
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          access_code=$(curl -sS -o /tmp/access.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/access/apps")
          pages_code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/marketing-ai")
          domains_code=$(curl -sS -o /tmp/domains.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/marketing-ai/domains")
          echo "access_http=$access_code pages_http=$pages_code domains_http=$domains_code"
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const access=read('/tmp/access.json');
          const apps=(access.result||[]).map(a=>({id:a.id,name:a.name,type:a.type,domain:a.domain||'',destinations:a.destinations||[]}));
          console.log('access_apps='+JSON.stringify(apps));
          const pages=read('/tmp/pages.json').result||{};
          console.log('marketing_pages='+JSON.stringify({name:pages.name,subdomain:pages.subdomain,production_branch:pages.production_branch,domains:pages.domains||[]}));
          const domains=(read('/tmp/domains.json').result||[]).map(d=>({name:d.name,status:d.status}));
          console.log('marketing_domains='+JSON.stringify(domains));
          NODE
