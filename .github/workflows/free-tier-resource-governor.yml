name: Free Tier Resource Governor
# Main-path changes intentionally trigger one post-merge collection baseline in addition to the daily schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'free-tier-quota-guard.js'
      - 'free-tier-resource-governor.js'
      - 'config/free-tier-optimization-policy.json'
      - 'scripts/collect-free-tier-resource-usage.mjs'
      - 'test/free-tier-resource-governor.test.mjs'
      - 'test/free-tier-resource-collector.test.mjs'
      - 'migrations/0099_free_tier_provider_quota.sql'
      - '.github/workflows/free-tier-resource-governor.yml'
  pull_request:
    paths:
      - 'free-tier-quota-guard.js'
      - 'free-tier-resource-governor.js'
      - 'config/free-tier-optimization-policy.json'
      - 'scripts/collect-free-tier-resource-usage.mjs'
      - 'test/free-tier-resource-governor.test.mjs'
      - 'test/free-tier-resource-collector.test.mjs'
      - 'migrations/0099_free_tier_provider_quota.sql'
      - '.github/workflows/free-tier-resource-governor.yml'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ekodi-free-tier-resource-governor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate measured-only governor
        run: |
          set -euo pipefail
          node --check free-tier-resource-governor.js
          node --check scripts/collect-free-tier-resource-usage.mjs
          node --check scripts/validate-free-tier-optimization.mjs
          node scripts/validate-free-tier-optimization.mjs
          node --test test/free-tier-resource-governor.test.mjs test/free-tier-resource-collector.test.mjs test/free-tier-supabase-oidc-contract.test.mjs

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select Supabase management credential
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-}"
          [ -n "$token" ] || token="${TOKEN_B:-}"
          [ -n "$token" ] || token="${TOKEN_C:-}"
          [ -n "$token" ] || token="${TOKEN_D:-}"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
            echo "SUPABASE_TELEMETRY_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo 'Supabase management credential is not configured; Supabase telemetry will remain missing.'
            echo "SUPABASE_ACCESS_TOKEN=" >> "$GITHUB_ENV"
            echo "SUPABASE_TELEMETRY_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Request GitHub OIDC token for Supabase telemetry
        if: env.SUPABASE_TELEMETRY_AVAILABLE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          audience="$(node -e "const c=require('./config/free-tier-supabase-oidc.json');process.stdout.write(c.audience)")"
          response="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.value||''))})")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SUPABASE_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SUPABASE_OIDC_CONFIG=config/free-tier-supabase-oidc.json" >> "$GITHUB_ENV"
          echo "SUPABASE_OIDC_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Collect measured free-tier resource telemetry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          sql_file="$RUNNER_TEMP/free-tier-resource-snapshots.sql"
          node scripts/collect-free-tier-resource-usage.mjs "$sql_file"
          test -s "$sql_file"
          grep -Fq 'provider_quota_snapshots' "$sql_file"
          npx --yes wrangler@4.127.1 d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --file "$sql_file"

      - name: Verify latest measured snapshots exist
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 d1 execute ekodi-auth \
            --remote --config wrangler.api.toml --json \
            --command "SELECT provider,metric,observed_value,free_limit,source,observed_at FROM provider_quota_snapshots WHERE provider IN ('cloudflare','supabase','github') ORDER BY observed_at DESC LIMIT 40;" \
            > "$RUNNER_TEMP/free-tier-resource-proof.json"
          grep -Fq '"provider"' "$RUNNER_TEMP/free-tier-resource-proof.json"
          grep -Fq '"cloudflare"' "$RUNNER_TEMP/free-tier-resource-proof.json"
          node - "$RUNNER_TEMP/free-tier-resource-proof.json" <<'NODE'
          const fs=require('node:fs');
          const path=process.argv[2];
          const raw=JSON.parse(fs.readFileSync(path,'utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(batch=>Array.isArray(batch?.results)?batch.results:[]);
          for(const row of rows){
            console.log(JSON.stringify({
              provider:row.provider,
              metric:row.metric,
              observed_value:row.observed_value,
              free_limit:row.free_limit,
              source:row.source,
              observed_at:row.observed_at
            }));
          }
          NODE
