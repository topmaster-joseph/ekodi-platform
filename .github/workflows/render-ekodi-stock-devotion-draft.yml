name: Render EKODI Stock Narrator Devotion Draft
# Rights-safe stock male/female AI voices (no cloned speaker input).
# This workflow never publishes to the Bible public site.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Already published Korean devotional date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-stock-devotion-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.119.0'
      BOOK_BUCKET: ekodi-book-files
    steps:
      - name: Checkout reviewed first-party scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify public published script date and source SHA
        env:
          DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          mkdir -p private
          chmod 700 private
          node scripts/ekodi-voice/export-devotion-script.mjs "$DAY" private/devotion.json > /dev/null
      - name: Install stock licensed model runner (draft only)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install --disable-pip-version-check -q 'supertonic==1.2.2'
          python -m pip show supertonic
      - name: Render built-in Korean male M1 and female F1 draft
        run: |
          set -euo pipefail
          python -I scripts/ekodi-voice/render-stock-devotion.py --script private/devotion.json --out private/draft --steps 10 --speed 0.94
          test -s private/draft/male.mp3
          test -s private/draft/female.mp3
          test -s private/draft/draft-manifest.json
          node -e "const m=require('./private/draft/draft-manifest.json'); if(m.approved!==false||m.status!=='draft'||m.review.voicePerformance!==false||m.modelLicense!=='OpenRAIL-M'||m.tracks.male.voiceId!=='M1'||m.tracks.female.voiceId!=='F1')process.exit(1)"
      - name: Save unreviewed drafts to private R2, never public assets
        env:
          DAY: ${{ inputs.date }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          for gender in male female; do
            npx --yes wrangler@${WRANGLER_VERSION} r2 object put "${BOOK_BUCKET}/_voice/devotion-drafts/${DAY}/stock/${RUN_ID}/${gender}.mp3" --remote --file "private/draft/${gender}.mp3" --content-type audio/mpeg >/dev/null
          done
          npx --yes wrangler@${WRANGLER_VERSION} r2 object put "${BOOK_BUCKET}/_voice/devotion-drafts/${DAY}/stock/${RUN_ID}/draft-manifest.json" --remote --file private/draft/draft-manifest.json --content-type application/json >/dev/null
          echo "Private stock-narrator male/female devotional drafts stored. Human rights, Scripture pronunciation, acoustic and accessibility review remains required."
      - name: Remove unapproved local audio and public-script copies
        if: always()
        run: rm -rf private
