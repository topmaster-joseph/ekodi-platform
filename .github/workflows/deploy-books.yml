name: Deploy EKODI Books

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'books-worker.js'
      - 'scripts/validate-books.mjs'
      - 'wrangler.books.toml'
      - 'scripts/guarded-worker-release.mjs'
      - 'deploy/manifests/books.worker.json'
      - '.github/workflows/deploy-books.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-books-production
  cancel-in-progress: false

jobs:
  staging_gate:
    uses: ./.github/workflows/stage-books-shell.yml
    secrets: inherit

  deploy:
    needs: staging_gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Books source and release gate
        run: |
          set -euo pipefail
          node --check books-worker.js
          node --check scripts/guarded-worker-release.mjs
          test -f deploy/manifests/books.worker.json
          npm run validate:books
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Candidate at 0%, verify, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/books.worker.json
      - name: Deep verify Books production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/books.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/' || true)
            publishing_code=$(curl -L -sS -o /tmp/publishing.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/publishing/' || true)
            upaper_code=$(curl -L -sS -D /tmp/upaper-headers -o /tmp/upaper.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/publishing/upaper/' || true)
            admin_code=$(curl -sS --max-redirs 0 -D /tmp/books-admin-headers -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://books.ekodi.kr/admin' || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$publishing_code" =~ ^[23] ]] && [[ "$upaper_code" =~ ^[23] ]] && [[ "$admin_code" =~ ^30[1278]$ ]] \
              && grep -Fq 'href="https://ekodi.kr/"' /tmp/books.html \
              && grep -Fq 'id="consultationForm"' /tmp/publishing.html \
              && grep -Fq 'UPAPER QUICK PUBLISH' /tmp/upaper.html \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/upaper-headers \
              && grep -Fiq 'location: https://admin.ekodi.kr/books#books' /tmp/books-admin-headers; then
              echo 'EKODI Books production and adaptive UPaper helper verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
