name: Cloudflare Staging Intentional Retirement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-staging-intentional-retirement.yml'

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Retire Production residues whose Development staging intent is verified
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          curl_json(){ curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -fsS "$@"; }
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          targets=(ekodi-marketing-domain-api-staging ekodi-marketing-publishing-staging)

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod.json
          curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev.json
          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains.json
          curl_json "${prod_auth[@]}" "$api/zones?account.id=$PROD_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          for f in /tmp/prod.json /tmp/dev.json /tmp/domains.json /tmp/zones.json; do jq -e '.success==true' "$f" >/dev/null; done

          mkdir -p /tmp/ps /tmp/ds
          while IFS= read -r s; do
            [[ -n "$s" ]] || continue
            curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$s/settings" -o "/tmp/ps/$s.json"
          done < <(jq -r '.result[]?.id' /tmp/prod.json)

          : >/tmp/routes.ndjson
          while IFS=$'\t' read -r zid zname; do
            [[ -n "$zid" ]] || continue
            curl_json "${prod_auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/zr.json
            jq -e '.success==true' /tmp/zr.json >/dev/null
            jq -c --arg zone "$zname" '.result[]? | {zone:$zone,pattern:.pattern,script:.script}' /tmp/zr.json >>/tmp/routes.ndjson
          done < <(jq -r '.result[]? | [.id,.name] | @tsv' /tmp/zones.json)

          : >/tmp/safe.txt
          for s in "${targets[@]}"; do
            jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/prod.json >/dev/null || { echo "SKIP $s already absent"; continue; }
            jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/dev.json >/dev/null || { echo "HOLD $s no Development counterpart"; continue; }
            curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/$s/settings" -o "/tmp/ds/$s.json"

            routes=$(jq -s --arg s "$s" '[.[] | select(.script==$s)] | length' /tmp/routes.ndjson 2>/dev/null || echo 0)
            inbound=0
            for f in /tmp/ps/*.json; do
              n=$(jq --arg s "$s" '[.result.bindings[]? | select(.type=="service" and ((.service // .service_name)==$s))] | length' "$f")
              inbound=$((inbound+n))
            done
            [[ "$routes" == 0 && "$inbound" == 0 ]] || { echo "HOLD $s routes=$routes inbound=$inbound"; continue; }

            if [[ "$s" == "ekodi-marketing-domain-api-staging" ]]; then
              curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$s/schedules" -o /tmp/prod-sched.json
              curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/$s/schedules" -o /tmp/dev-sched.json
              prod_crons=$(jq -cS '[.result.schedules[]?.cron] | sort' /tmp/prod-sched.json)
              dev_crons=$(jq -cS '[.result.schedules[]?.cron] | sort' /tmp/dev-sched.json)
              [[ "$prod_crons" == "$dev_crons" ]] || { echo "HOLD $s cron differs PROD=$prod_crons DEV=$dev_crons"; continue; }
              echo "INTENT_VERIFIED=$s cron=$dev_crons"
            fi

            if [[ "$s" == "ekodi-marketing-publishing-staging" ]]; then
              prod_has_db=$(jq '[.result.bindings[]? | select(.name=="DB" and .type=="d1")] | length' "/tmp/ps/$s.json")
              dev_has_db=$(jq '[.result.bindings[]? | select(.name=="DB" and .type=="d1")] | length' "/tmp/ds/$s.json")
              [[ "$prod_has_db" == 1 && "$dev_has_db" == 0 ]] || { echo "HOLD $s unexpected DB intent prod=$prod_has_db dev=$dev_has_db"; continue; }
              echo "INTENT_VERIFIED=$s Development staging is intentionally data-detached"
            fi

            echo "$s" >>/tmp/safe.txt
          done

          while IFS= read -r s; do
            [[ -n "$s" ]] || continue
            while IFS=$'\t' read -r did host; do
              [[ -n "$did" ]] || continue
              echo "DETACH_DOMAIN=$host"
              curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains/$did" -o /tmp/dd.json
            done < <(jq -r --arg s "$s" '.result[]? | select((.service // .script // .service_name)==$s) | [.id,.hostname] | @tsv' /tmp/domains.json)
            echo "DELETE_PROD_STAGING=$s"
            curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$s" -o /tmp/del.json
          done </tmp/safe.txt

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/after.json
          moved=0
          while IFS= read -r s; do
            [[ -n "$s" ]] || continue
            ! jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/after.json >/dev/null
            jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/dev.json >/dev/null
            echo "VERIFIED_RETIRED_FROM_PROD=$s"
            moved=$((moved+1))
          done </tmp/safe.txt
          remain=$(jq -r '.result[]?.id | select(endswith("-staging") or contains("-staging-"))' /tmp/after.json | wc -l | tr -d ' ')
          echo "RETIRED_COUNT=$moved"
          echo "PRODUCTION_STAGING_REMAINING=$remain"
