name: Sync EKODI Worker Domains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-worker-domains.yml'
      - 'wrangler.site.toml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-worker-domain-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Apply Worker domains and routes
        id: routes
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 triggers deploy --config wrangler.site.toml

      - name: Verify AI Gateway hostname is provisioned
        id: hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/ai-root -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ai.ekodi.kr/' || true)
            echo "ai.ekodi.kr -> $code (attempt $attempt/18)"
            if [ "$code" != '000' ] && [ -n "$code" ]; then
              exit 0
            fi
            sleep 4
          done
          echo 'ai.ekodi.kr DNS/TLS provisioning was not observable.'
          exit 1

      - name: Publish AI Gateway domain checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          HOSTNAME_OUTCOME: ${{ steps.hostname.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ROUTES_OUTCOME" = 'success' ] && [ "$HOSTNAME_OUTCOME" = 'success' ]; then
            icon='✅'; summary='DOMAIN SYNC VERIFIED'
          else
            icon='❌'; summary='DOMAIN SYNC NOT VERIFIED'
          fi
          body=$(cat <<EOF
          $icon **$summary**

          - commit: \`$COMMIT_SHA\`
          - Worker routes/domains: \`$ROUTES_OUTCOME\`
          - ai.ekodi.kr DNS/TLS observable: \`$HOSTNAME_OUTCOME\`
          - canonical: https://ai.ekodi.kr/
          - workflow: $RUN_URL
          - checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
          gh issue comment 443 --repo "$GITHUB_REPOSITORY" --body "$body"
