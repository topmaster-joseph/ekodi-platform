name: Sync EKODI Worker Domains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-worker-domains.yml'
      - 'wrangler.site.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Apply Worker domains and routes
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 triggers deploy --config wrangler.site.toml

      - name: Verify AI Gateway hostname is provisioned
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/ai-root -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ai.ekodi.kr/' || true)
            echo "ai.ekodi.kr -> $code (attempt $attempt/18)"
            if [ "$code" != '000' ] && [ -n "$code" ]; then
              exit 0
            fi
            sleep 4
          done
          echo 'ai.ekodi.kr DNS/TLS provisioning was not observable.'
          exit 1
