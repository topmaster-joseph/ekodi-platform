name: Sync EKODI Root Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-worker-domains.yml'
      - 'wrangler.site.toml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-root-domain-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build Worker assets
        run: npm run build

      - name: Apply root domain and canonical path routes
        id: routes
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 triggers deploy --config wrangler.site.toml

      - name: Verify canonical apex
        id: hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 12 'https://ekodi.kr/' || true)
            echo "ekodi.kr -> $code (attempt $attempt/18)"
            case "$code" in 2*|3*) exit 0 ;; esac
            sleep 4
          done
          echo 'ekodi.kr was not observable after route sync.'
          exit 1

      - name: Publish root-domain checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
          HOSTNAME_OUTCOME: ${{ steps.hostname.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ROUTES_OUTCOME" = 'success' ] && [ "$HOSTNAME_OUTCOME" = 'success' ]; then
            icon='✅'; summary='ROOT DOMAIN SYNC VERIFIED'
          else
            icon='❌'; summary='ROOT DOMAIN SYNC NOT VERIFIED'
          fi
          body=$(cat <<EOF
          $icon **$summary**

          - commit: \`$COMMIT_SHA\`
          - root routes: \`$ROUTES_OUTCOME\`
          - ekodi.kr observable: \`$HOSTNAME_OUTCOME\`
          - canonical: https://ekodi.kr/
          - public service subdomains: forbidden
          - workflow: $RUN_URL
          - checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
          gh issue comment 443 --repo "$GITHUB_REPOSITORY" --body "$body"
