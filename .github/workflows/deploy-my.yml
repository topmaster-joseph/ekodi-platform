name: Deploy My EKODI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'auth-site/**'
      - 'config/**'
      - 'ekodi-service-manifest.js'
      - 'capability-intent-runtime.js'
      - 'scripts/validate-my.mjs'
      - 'scripts/validate-universal-membership.mjs'
      - 'scripts/validate-capability-registry.mjs'
      - 'scripts/generate-user-service-registry.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/**'
      - 'supabase/functions/profile-api/**'
      - 'supabase/migrations/**'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - '.github/workflows/deploy-my.yml'
  push:
    branches: [main]
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'auth-site/**'
      - 'config/**'
      - 'ekodi-service-manifest.js'
      - 'capability-intent-runtime.js'
      - 'scripts/validate-my.mjs'
      - 'scripts/validate-universal-membership.mjs'
      - 'scripts/validate-capability-registry.mjs'
      - 'scripts/generate-user-service-registry.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/**'
      - 'supabase/functions/profile-api/**'
      - 'supabase/migrations/**'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - '.github/workflows/deploy-my.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ekodi-my-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  MY_SUPABASE_URL: https://renzehysxirjilvdxacv.supabase.co
  MY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Validate My EKODI contracts and church worship operations
        shell: bash
        run: |
          set -euo pipefail
          node --check my-worker.js
          node --check my/app.js
          node --check my/church-meeting-ops.js
          node --check my/church-marketing-ai.js
          node scripts/validate-my.mjs
          node scripts/validate-universal-membership.mjs
          node scripts/validate-capability-registry.mjs
          node --test test/church-meeting-ops.test.mjs test/universal-membership-contract.test.mjs test/my-ekodi-contract.test.mjs test/my-private-workspace-routing.test.mjs test/my-manifest-services.test.mjs test/my-life-journey.test.mjs test/my-life-communication.test.mjs test/my-progressive-personalization.test.mjs test/my-docs-ai.test.mjs test/my-intent-os.test.mjs test/my-intent-execution-bridge.test.mjs
          grep -Fq 'church_worship_materials' my/church-meeting-ops.js
          grep -Fq 'PptxGenJS' my/church-meeting-ops.js
          grep -Fq 'https://ekodi.kr/ekodichurch/mypage/' my/church-meeting-ops.js
          grep -Fq 'https://ekodi.kr/ekodichurch/live/' my/church-meeting-ops.js
          if grep -RniF 'https://my.ekodi.kr' -- my auth-site config deploy/manifests/my.worker.json; then
            echo 'Deprecated My EKODI subdomain must not be referenced by runtime assets.'
            exit 1
          fi

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-my-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
      - name: Generate user-service registry
        run: npm run generate:user-services
      - name: Deploy isolated My EKODI staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.staging.toml
      - name: Verify staging worship operations asset
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/my-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            ops_code=$(curl -L -sS -o /tmp/my-stage-church-ops.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/church-meeting-ops.js" || true)
            health_code=$(curl -L -sS -o /tmp/my-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$root_code" == '200' ]] && grep -Fq 'Cloudflare Access' /tmp/my-stage.html; then
              echo 'My EKODI staging is deployed and protected by Cloudflare Access.'
              exit 0
            fi
            if [[ "$root_code" == '200' && "$ops_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'church_worship_materials' /tmp/my-stage-church-ops.js \
              && grep -Fq 'PptxGenJS' /tmp/my-stage-church-ops.js; then
              echo 'My EKODI staging worship operations verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production prerequisites on canonical origin
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          endpoint="$MY_SUPABASE_URL/functions/v1/profile-api/character"
          code=$(curl -sS -D /tmp/profile.headers -o /dev/null -w '%{http_code}' -X OPTIONS --connect-timeout 5 --max-time 15 "$endpoint" -H 'Origin: https://ekodi.kr' -H 'Access-Control-Request-Method: PATCH' -H 'Access-Control-Request-Headers: authorization,apikey,content-type' || true)
          [[ "$code" =~ ^(200|204)$ ]]
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://ekodi\.kr[[:space:]]*$' /tmp/profile.headers
          grep -Eiq '^access-control-allow-methods:.*PATCH' /tmp/profile.headers
          grep -Eiq '^access-control-allow-methods:.*DELETE' /tmp/profile.headers
          auth_code=$(curl -sS -o /tmp/client-auth.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/auth/client-auth.js' || true)
          [[ "$auth_code" == '200' ]]
          grep -Fq "returnTo:'https://ekodi.kr/my/'" /tmp/client-auth.js
      - name: Generate user-service registry
        run: npm run generate:user-services
      - name: Deploy My EKODI production
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.toml
      - name: Verify canonical My EKODI production and church operations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            root_code=$(curl -L -sS -o /tmp/my.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/' || true)
            ops_code=$(curl -L -sS -o /tmp/church-ops.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/church-meeting-ops.js' || true)
            entry_code=$(curl -L -sS -o /tmp/church-entry.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/church-marketing-ai.js' || true)
            health_code=$(curl -L -sS -o /tmp/my-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/health' || true)
            if [[ "$root_code" == '200' && "$ops_code" == '200' && "$entry_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'My EKODI' /tmp/my.html \
              && grep -Fq 'church_worship_materials' /tmp/church-ops.js \
              && grep -Fq 'PptxGenJS' /tmp/church-ops.js \
              && grep -Fq 'https://ekodi.kr/ekodichurch/live/' /tmp/church-ops.js \
              && grep -Fq 'church-meeting-ops.js' /tmp/church-entry.js \
              && grep -Fq '"dataMode":"production"' /tmp/my-health.json; then
              echo 'Canonical My EKODI production and Church worship operations verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Canonical My EKODI production did not converge.'
          exit 1
      - name: Publish My EKODI production status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'ekodi/my-production' --arg description "My EKODI canonical production: $JOB_STATUS" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
