name: Deploy My EKODI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'config/capability-registry.json'
      - 'config/workspace-packs.json'
      - 'capability-intent-runtime.js'
      - 'scripts/validate-capability-registry.mjs'
      - 'test/my-intent-os.test.mjs'
      - 'test/my-intent-execution-bridge.test.mjs'
      - 'ekodi-service-manifest.js'
      - 'config/ecosystem-services.json'
      - 'config/universal-membership.json'
      - 'scripts/generate-user-service-registry.mjs'
      - 'scripts/validate-universal-membership.mjs'
      - 'test/universal-membership-contract.test.mjs'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - 'scripts/validate-my.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/my-ekodi-contract.test.mjs'
      - 'test/my-private-workspace-routing.test.mjs'
      - 'test/my-manifest-services.test.mjs'
      - 'test/my-life-journey.test.mjs'
      - 'test/my-life-communication.test.mjs'
      - 'test/my-progressive-personalization.test.mjs'
      - 'auth-site/client-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*creator_*'
      - 'supabase/migrations/*my_personalization*.sql'
      - '.github/workflows/deploy-my.yml'
  push:
    branches: [main]
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'config/capability-registry.json'
      - 'config/workspace-packs.json'
      - 'capability-intent-runtime.js'
      - 'scripts/validate-capability-registry.mjs'
      - 'test/my-intent-os.test.mjs'
      - 'test/my-intent-execution-bridge.test.mjs'
      - 'ekodi-service-manifest.js'
      - 'config/ecosystem-services.json'
      - 'config/universal-membership.json'
      - 'scripts/generate-user-service-registry.mjs'
      - 'scripts/validate-universal-membership.mjs'
      - 'test/universal-membership-contract.test.mjs'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - 'scripts/validate-my.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/my-ekodi-contract.test.mjs'
      - 'test/my-private-workspace-routing.test.mjs'
      - 'test/my-manifest-services.test.mjs'
      - 'test/my-life-journey.test.mjs'
      - 'test/my-life-communication.test.mjs'
      - 'test/my-progressive-personalization.test.mjs'
      - 'auth-site/client-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*creator_*'
      - 'supabase/migrations/*my_personalization*.sql'
      - '.github/workflows/deploy-my.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ekodi-my-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Validate My EKODI contracts
        run: |
          set -euo pipefail
          node --check my-worker.js
          node --check my/app.js
          node --check my/approval-brief.js
          node --check my/approvals/app.js
          node --check my/progressive-personalization.js
          node --check my/character-identity.js
          node --check my/intent-navigator.js
          node --check capability-intent-runtime.js
          node --check scripts/validate-capability-registry.mjs
          node scripts/validate-capability-registry.mjs
          node --check my/private-workspace-router.js
          node --check my/journey/app.js
          node --check my/membership-summary.js
          node --check my/user-services.js
          node --check ekodi-service-manifest.js
          node --check auth-site/client-auth.js
          node --check auth-site/auth-router.js
          node --check scripts/validate-my.mjs
          node --check scripts/validate-universal-membership.mjs
          node scripts/validate-my.mjs
          node scripts/validate-universal-membership.mjs
          node --test test/universal-membership-contract.test.mjs test/my-ekodi-contract.test.mjs test/my-private-workspace-routing.test.mjs test/my-manifest-services.test.mjs test/my-life-journey.test.mjs test/my-life-communication.test.mjs test/my-progressive-personalization.test.mjs test/my-intent-os.test.mjs test/my-intent-execution-bridge.test.mjs
          test -f deploy/manifests/my.worker.json

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-my-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Verify Development staging boundary
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_DEVELOPMENT_API_TOKEN' && exit 1)
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test "$STAGING_URL" = 'https://ekodi-my-staging.ekodi-development.workers.dev'
      - name: Deploy isolated My EKODI staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.staging.toml
      - name: Verify staging, private workspace routes, Life Journey, universal membership and personal-data isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/my-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            private_code=$(curl -sS -D /tmp/my-stage-private.headers -o /tmp/my-stage-private.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/w/person:deployment-probe" || true)
            journey_code=$(curl -L -sS -o /tmp/my-stage-journey.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/journey/" || true)
            approval_code=$(curl -L -sS -o /tmp/my-stage-approvals.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/approvals/" || true)
            journey_app_code=$(curl -sS -o /tmp/my-stage-journey-app.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/journey/app.js" || true)
            config_code=$(curl -sS -o /tmp/my-stage-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/config.js" || true)
            personalization_code=$(curl -sS -o /tmp/my-stage-personalization.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/progressive-personalization.js" || true)
            character_code=$(curl -sS -o /tmp/my-stage-character.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/character-identity.js" || true)
            app_code=$(curl -sS -o /tmp/my-stage-app.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/app.js" || true)
            membership_code=$(curl -sS -o /tmp/my-stage-membership.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/membership-summary.js" || true)
            membership_css_code=$(curl -sS -o /tmp/my-stage-membership.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/membership-summary.css" || true)
            user_services_code=$(curl -sS -o /tmp/my-stage-user-services.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/user-services.js" || true)
            manifest_code=$(curl -sS -o /tmp/my-stage-services.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/service-manifest.json" || true)
            health_code=$(curl -sS -o /tmp/my-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$root_code" == '200' && "$approval_code" == '200' ]] \
              && grep -Fq 'Cloudflare Access' /tmp/my-stage.html \
              && grep -Fq 'Cloudflare Access' /tmp/my-stage-approvals.html; then
              npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.my.staging.toml --json > /tmp/my-stage-deployments.json
              echo 'My EKODI staging is deployed and correctly protected by Cloudflare Access.'
              exit 0
            fi
            if [[ "$root_code" == '200' && "$private_code" == '200' && "$journey_code" == '200' && "$approval_code" == '200' && "$journey_app_code" == '200' && "$config_code" == '200' && "$personalization_code" == '200' && "$character_code" == '200' && "$app_code" == '200' && "$membership_code" == '200' && "$membership_css_code" == '200' && "$user_services_code" == '200' && "$manifest_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'My EKODI' /tmp/my-stage.html \
              && grep -Fq 'MY PLATFORMS' /tmp/my-stage.html \
              && grep -Fq 'membership-summary.js' /tmp/my-stage.html \
              && grep -Fq 'PERSONAL BRAND MARKETING' /tmp/my-stage.html \
              && grep -Fq '/private-workspace-router.js' /tmp/my-stage-private.html \
              && grep -Eiq '^x-ekodi-private-workspace:[[:space:]]*v1' /tmp/my-stage-private.headers \
              && grep -Eiq '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' /tmp/my-stage-private.headers \
              && grep -Fq 'MY JOURNEY · PERSON FIRST' /tmp/my-stage-journey.html \
              && grep -Fq 'MY APPROVAL · DECISION INBOX' /tmp/my-stage-approvals.html \
              && grep -Fq '외국인만을 위한 경로가 아니라' /tmp/my-stage-journey.html \
              && grep -Fq 'current_site_access' /tmp/my-stage-journey-app.js \
              && grep -Fq 'https://auth.ekodi.kr/' /tmp/my-stage-journey-app.js \
              && grep -Fq 'buildPersonalizedServiceView' /tmp/my-stage-app.js \
              && grep -Fq 'PERSONALIZATION_VERSION=1' /tmp/my-stage-personalization.js \
              && grep -Fq "DB_NAME='ekodi-my-character-v1'" /tmp/my-stage-character.js \
              && grep -Fq 'const EKODI_SERVICE_MANIFEST_VERSION=' /tmp/my-stage-app.js \
              && grep -Fq "$(node -e 'const m=JSON.parse(require("fs").readFileSync("/tmp/my-stage-services.json","utf8"));const s=m.services.find(v=>v.id==="trade");process.stdout.write(JSON.stringify([s.id,s.name,s.url]));')" /tmp/my-stage-app.js \
              && grep -Fq '/api/membership/portfolio' /tmp/my-stage-membership.js \
              && grep -Fq 'USER_SERVICES' /tmp/my-stage-user-services.js \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/my-stage-services.json \
              && grep -Fq '"id":"community"' /tmp/my-stage-services.json \
              && grep -Fq '"dataEnabled":false' /tmp/my-stage-config.js \
              && grep -Fq '"privateWorkspaceRouting":true' /tmp/my-stage-health.json \
              && grep -Fq '"manifestDrivenServices":true' /tmp/my-stage-health.json \
              && grep -Fq '"approvalHub":true' /tmp/my-stage-health.json \
              && grep -Fq '"progressivePersonalization":true' /tmp/my-stage-health.json \
              && grep -Fq '"personalizationAuthority":"presentation-only"' /tmp/my-stage-health.json \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/my-stage-health.json; then
              echo 'My EKODI staging verified in the Development account with private workspace routes, Life Journey, universal membership, manifest-driven services and production personal data disabled.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: >-
      always() && needs.validate.result == 'success' &&
      github.event_name != 'pull_request'
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MY_SUPABASE_URL: https://renzehysxirjilvdxacv.supabase.co
      MY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate universal user-service registry
        run: npm run generate:user-services
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Wait for central My EKODI registry auth realm
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            client_code=$(curl -sS -o /tmp/my-client-auth.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/client-auth.js' || true)
            router_code=$(curl -sS -o /tmp/my-auth-router.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/auth-router.js' || true)
            manifest_code=$(curl -sS -o /tmp/my-shell-manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/manifest.json' || true)
            shell_health_code=$(curl -sS -o /tmp/my-shell-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/health' || true)
            if [[ "$client_code" == '200' && "$router_code" == '200' && "$manifest_code" == '200' && "$shell_health_code" == '200' ]] \
              && grep -Fq "'my':{name:'My EKODI'" /tmp/my-client-auth.js \
              && grep -Fq "returnTo:'https://my.ekodi.kr/'" /tmp/my-client-auth.js \
              && grep -Fq 'manifestService' /tmp/my-auth-router.js \
              && grep -Fq 'isRegistryUserService' /tmp/my-auth-router.js \
              && grep -Fq "site==='portal'||isRegistryUserService" /tmp/my-auth-router.js \
              && grep -Fq '"id":"my"' /tmp/my-shell-manifest.json \
              && grep -Fq '"url":"https://my.ekodi.kr/"' /tmp/my-shell-manifest.json \
              && grep -Fq '"characterIdentityRegistryVersion":2' /tmp/my-shell-health.json \
              && grep -Fq '"userCharacterVersion":6' /tmp/my-shell-health.json; then
              echo 'Central My EKODI registry auth realm is live.'
              break
            fi
            if [[ "$attempt" == '24' ]]; then echo 'Central My EKODI registry auth realm is not live; deployment blocked.'; exit 1; fi
            sleep 5
          done
      - name: Wait for central character profile API
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$MY_SUPABASE_URL/functions/v1/profile-api/character"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -D /tmp/my-character-profile.headers -o /dev/null -w '%{http_code}' -X OPTIONS --connect-timeout 5 --max-time 15 "$endpoint" -H 'Origin: https://my.ekodi.kr' -H 'Access-Control-Request-Method: PATCH' -H 'Access-Control-Request-Headers: authorization,apikey,content-type' || true)
            if [[ "$code" =~ ^(200|204)$ ]] \
              && grep -Eiq '^access-control-allow-origin:[[:space:]]*https://my\.ekodi\.kr' /tmp/my-character-profile.headers \
              && grep -Eiq '^access-control-allow-methods:.*DELETE' /tmp/my-character-profile.headers; then
              echo 'Central character profile API is live.'
              break
            fi
            if [[ "$attempt" == '24' ]]; then echo 'Central character profile API is not live; My EKODI release blocked.'; exit 1; fi
            sleep 5
          done
      - name: Verify Creator portfolio database contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/my-db.json -w '%{http_code}' --connect-timeout 5 --max-time 15 \
            "$MY_SUPABASE_URL/rest/v1/creator_portfolio_items?select=id&limit=1" \
            -H "apikey: $MY_SUPABASE_PUBLISHABLE_KEY" || true)
          if [[ "$code" != '200' ]]; then
            echo "Creator portfolio database contract is not ready (HTTP $code)."
            cat /tmp/my-db.json || true
            exit 1
          fi
          echo 'Creator portfolio schema is reachable and RLS-protected.'
      - name: Bootstrap, migrate legacy page, or run guarded release
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.my.toml --json > /tmp/my-deployments.log 2>&1; then
            health_code=$(curl -sS -o /tmp/my-live-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/health' || true)
            root_code=$(curl -L -sS -o /tmp/my-live.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/' || true)
            if [[ "$health_code" == '200' && "$root_code" == '200' ]] \
              && grep -Fq '"service":"ekodi-my"' /tmp/my-live-health.json \
              && grep -Fq 'MY PLATFORMS' /tmp/my-live.html; then
              echo 'Existing production satisfies the My EKODI hub contract; using guarded candidate release.'
              node scripts/guarded-worker-release.mjs --manifest deploy/manifests/my.worker.json
            else
              echo 'Existing Worker is missing the My EKODI hub contract; performing one-time direct migration from staging-validated source.'
              npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.toml
            fi
          elif grep -Eq 'has no deployments|This Worker does not exist|does not exist on your account|code: 10007' /tmp/my-deployments.log; then
            echo 'No active My EKODI production deployment exists; performing one-time bootstrap from staging-validated source.'
            npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.toml
          else
            cat /tmp/my-deployments.log
            exit 1
          fi
      - name: Verify real My EKODI production hostname, private workspace routes, Life Journey and universal membership
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/my.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/' || true)
            private_code=$(curl -sS -D /tmp/my-private.headers -o /tmp/my-private.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/w/person:deployment-probe' || true)
            journey_code=$(curl -L -sS -o /tmp/my-journey.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/journey/' || true)
            approval_code=$(curl -L -sS -o /tmp/my-approvals.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/approvals/' || true)
            journey_app_code=$(curl -sS -o /tmp/my-journey-app.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/journey/app.js' || true)
            config_code=$(curl -sS -o /tmp/my-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/config.js' || true)
            personalization_code=$(curl -sS -o /tmp/my-personalization.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/progressive-personalization.js' || true)
            character_code=$(curl -sS -o /tmp/my-character.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/character-identity.js' || true)
            app_code=$(curl -sS -o /tmp/my-app.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/app.js' || true)
            membership_code=$(curl -sS -o /tmp/my-membership.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/membership-summary.js' || true)
            membership_css_code=$(curl -sS -o /tmp/my-membership.css -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/membership-summary.css' || true)
            user_services_code=$(curl -sS -o /tmp/my-user-services.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/user-services.js' || true)
            manifest_code=$(curl -sS -o /tmp/my-services.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/service-manifest.json' || true)
            health_code=$(curl -sS -o /tmp/my-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/health' || true)
            if [[ "$root_code" == '200' && "$private_code" == '200' && "$journey_code" == '200' && "$approval_code" == '200' && "$journey_app_code" == '200' && "$config_code" == '200' && "$personalization_code" == '200' && "$character_code" == '200' && "$app_code" == '200' && "$membership_code" == '200' && "$membership_css_code" == '200' && "$user_services_code" == '200' && "$manifest_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'My EKODI' /tmp/my.html \
              && grep -Fq 'MY PLATFORMS' /tmp/my.html \
              && grep -Fq 'membership-summary.js' /tmp/my.html \
              && grep -Fq 'PERSONAL BRAND MARKETING' /tmp/my.html \
              && grep -Fq '/private-workspace-router.js' /tmp/my-private.html \
              && grep -Eiq '^x-ekodi-private-workspace:[[:space:]]*v1' /tmp/my-private.headers \
              && grep -Eiq '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' /tmp/my-private.headers \
              && grep -Fq 'MY JOURNEY · PERSON FIRST' /tmp/my-journey.html \
              && grep -Fq 'MY APPROVAL · DECISION INBOX' /tmp/my-approvals.html \
              && grep -Fq '외국인만을 위한 경로가 아니라' /tmp/my-journey.html \
              && grep -Fq 'current_site_access' /tmp/my-journey-app.js \
              && grep -Fq 'https://auth.ekodi.kr/' /tmp/my-journey-app.js \
              && grep -Fq 'buildPersonalizedServiceView' /tmp/my-app.js \
              && grep -Fq 'PERSONALIZATION_VERSION=1' /tmp/my-personalization.js \
              && grep -Fq "DB_NAME='ekodi-my-character-v1'" /tmp/my-character.js \
              && grep -Fq 'const EKODI_SERVICE_MANIFEST_VERSION=' /tmp/my-app.js \
              && grep -Fq "$(node -e 'const m=JSON.parse(require("fs").readFileSync("/tmp/my-services.json","utf8"));const s=m.services.find(v=>v.id==="trade");process.stdout.write(JSON.stringify([s.id,s.name,s.url]));')" /tmp/my-app.js \
              && grep -Fq '/api/membership/portfolio' /tmp/my-membership.js \
              && grep -Fq 'USER_SERVICES' /tmp/my-user-services.js \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/my-services.json \
              && grep -Fq '"dataEnabled":true' /tmp/my-config.js \
              && grep -Fq '"dataMode":"production"' /tmp/my-health.json \
              && grep -Fq '"privateWorkspaceRouting":true' /tmp/my-health.json \
              && grep -Fq '"manifestDrivenServices":true' /tmp/my-health.json \
              && grep -Fq '"approvalHub":true' /tmp/my-health.json \
              && grep -Fq '"ekodiShell":true' /tmp/my-health.json \
              && grep -Fq '"progressivePersonalization":true' /tmp/my-health.json \
              && grep -Fq '"characterIdentityPersonalization":true' /tmp/my-health.json \
              && grep -Fq '"personalizationAuthority":"presentation-only"' /tmp/my-health.json; then
              echo 'My EKODI production verified with private workspace routes, Life Journey, universal membership and manifest-driven service registry.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Publish My EKODI production status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg state "$state" \
            --arg context 'ekodi/my-production' \
            --arg description "My EKODI production deployment: $JOB_STATUS" \
            --arg target_url "$target_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
