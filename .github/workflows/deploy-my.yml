name: Deploy My EKODI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - 'scripts/validate-my.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/my-ekodi-contract.test.mjs'
      - 'auth-site/client-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*creator_*'
      - '.github/workflows/deploy-my.yml'
  push:
    branches: [main]
    paths:
      - 'my/**'
      - 'my-worker.js'
      - 'wrangler.my.toml'
      - 'wrangler.my.staging.toml'
      - 'deploy/manifests/my.worker.json'
      - 'scripts/validate-my.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'test/my-ekodi-contract.test.mjs'
      - 'auth-site/client-auth.js'
      - 'auth-site/auth-router.js'
      - 'supabase/migrations/*creator_*'
      - '.github/workflows/deploy-my.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-my-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate My EKODI contracts
        run: |
          set -euo pipefail
          node --check my-worker.js
          node --check my/app.js
          node --check auth-site/client-auth.js
          node --check auth-site/auth-router.js
          node --check scripts/validate-my.mjs
          node scripts/validate-my.mjs
          node --test test/my-ekodi-contract.test.mjs
          test -f deploy/manifests/my.worker.json

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://ekodi-my-staging.topmaster-joseph.workers.dev
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy isolated My EKODI staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.staging.toml
      - name: Verify staging and personal-data isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/my-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            config_code=$(curl -sS -o /tmp/my-stage-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/config.js" || true)
            health_code=$(curl -sS -o /tmp/my-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$root_code" == '200' && "$config_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'My EKODI' /tmp/my-stage.html \
              && grep -Fq 'MY PLATFORMS' /tmp/my-stage.html \
              && grep -Fq 'CREATOR PORTFOLIO' /tmp/my-stage.html \
              && grep -Fq 'PERSONAL BRAND MARKETING' /tmp/my-stage.html \
              && grep -Fq '"dataEnabled":false' /tmp/my-stage-config.js \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/my-stage-health.json \
              && grep -Fq '"creatorPortfolio":true' /tmp/my-stage-health.json \
              && grep -Fq '"personalBrandMarketing":true' /tmp/my-stage-health.json; then
              echo 'My EKODI staging verified with personal brand entry and production personal data disabled.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: >-
      always() && needs.validate.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.ref == 'release/marketing-personal-brand-20260818' && needs.staging.result == 'success'))
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MY_SUPABASE_URL: https://renzehysxirjilvdxacv.supabase.co
      MY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Wait for central My EKODI auth realm
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            client_code=$(curl -sS -o /tmp/my-client-auth.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/client-auth.js' || true)
            router_code=$(curl -sS -o /tmp/my-auth-router.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/auth-router.js' || true)
            if [[ "$client_code" == '200' && "$router_code" == '200' ]] \
              && grep -Fq "'my':{name:'My EKODI'" /tmp/my-client-auth.js \
              && grep -Fq "returnTo:'https://my.ekodi.kr/'" /tmp/my-client-auth.js \
              && grep -Fq "site==='my'" /tmp/my-auth-router.js; then
              echo 'Central My EKODI auth realm is live.'
              break
            fi
            if [[ "$attempt" == '24' ]]; then echo 'Central My EKODI auth realm is not live; deployment blocked.'; exit 1; fi
            sleep 5
          done
      - name: Verify Creator portfolio database contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/my-db.json -w '%{http_code}' --connect-timeout 5 --max-time 15 \
            "$MY_SUPABASE_URL/rest/v1/creator_portfolio_items?select=id&limit=1" \
            -H "apikey: $MY_SUPABASE_PUBLISHABLE_KEY" || true)
          if [[ "$code" != '200' ]]; then
            echo "Creator portfolio database contract is not ready (HTTP $code)."
            cat /tmp/my-db.json || true
            exit 1
          fi
          echo 'Creator portfolio schema is reachable and RLS-protected.'
      - name: Bootstrap, migrate legacy page, or run guarded release
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.my.toml --json > /tmp/my-deployments.log 2>&1; then
            health_code=$(curl -sS -o /tmp/my-live-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/health' || true)
            root_code=$(curl -L -sS -o /tmp/my-live.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/' || true)
            if [[ "$health_code" == '200' && "$root_code" == '200' ]] \
              && grep -Fq '"service":"ekodi-my"' /tmp/my-live-health.json \
              && grep -Fq 'MY PLATFORMS' /tmp/my-live.html \
              && grep -Fq 'CREATOR PORTFOLIO' /tmp/my-live.html; then
              echo 'Existing production already satisfies the current My EKODI hub contract; using guarded candidate release.'
              node scripts/guarded-worker-release.mjs --manifest deploy/manifests/my.worker.json
            else
              echo "Existing Worker is missing the current My EKODI hub contract (root HTTP $root_code, health HTTP $health_code); performing one-time direct migration from staging-validated source."
              npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.toml
            fi
          elif grep -Eq 'has no deployments|This Worker does not exist|does not exist on your account|code: 10007' /tmp/my-deployments.log; then
            echo 'No active My EKODI production deployment exists; performing one-time bootstrap from staging-validated source.'
            npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.my.toml
          else
            echo 'Unable to determine My EKODI deployment state.'
            cat /tmp/my-deployments.log
            exit 1
          fi
      - name: Verify real My EKODI production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/my.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/' || true)
            config_code=$(curl -sS -o /tmp/my-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/config.js' || true)
            health_code=$(curl -sS -o /tmp/my-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://my.ekodi.kr/health' || true)
            if [[ "$root_code" == '200' && "$config_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'My EKODI' /tmp/my.html \
              && grep -Fq 'MY PLATFORMS' /tmp/my.html \
              && grep -Fq 'CREATOR PORTFOLIO' /tmp/my.html \
              && grep -Fq 'PERSONAL BRAND MARKETING' /tmp/my.html \
              && grep -Fq '"dataEnabled":true' /tmp/my-config.js \
              && grep -Fq '"dataMode":"production"' /tmp/my-health.json \
              && grep -Fq '"service":"ekodi-my"' /tmp/my-health.json \
              && grep -Fq '"personalBrandMarketing":true' /tmp/my-health.json; then
              echo 'My EKODI production verified with personal brand marketing entry.'
              exit 0
            fi
            sleep 5
          done
          exit 1
