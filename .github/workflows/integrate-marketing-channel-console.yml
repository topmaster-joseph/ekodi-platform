name: Integrate Marketing Channel Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-marketing-channel-console.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: integrate-marketing-channel-console
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Patch shared build and admin publishing proxy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const buildPath = 'scripts/build.mjs';
          let build = fs.readFileSync(buildPath, 'utf8');
          if (!build.includes('marketingChannelManagerJs')) {
            build = build.replace(
              'const [marketingAdminCss, marketingAdminJs, marketingLiveCss, marketingLiveJs, marketingPostingStatusJs] = await Promise.all([',
              'const [marketingAdminCss, marketingAdminJs, marketingLiveCss, marketingLiveJs, marketingPostingStatusJs, marketingChannelManagerJs] = await Promise.all(['
            );
            build = build.replace(
              "  readFile(`${root}marketing-ai-admin-posting-status.js`, 'utf8'),\n]);",
              "  readFile(`${root}marketing-ai-admin-posting-status.js`, 'utf8'),\n  readFile(`${root}marketing-ai-channel-manager.js`, 'utf8'),\n]);"
            );
            build = build.replace(
              "if (!marketingPostingStatusJs.includes(\"TAB_KEY = 'publications'\")) throw new Error('Marketing posting status marker missing');",
              "if (!marketingPostingStatusJs.includes(\"TAB_KEY = 'publications'\")) throw new Error('Marketing posting status marker missing');\nif (!marketingChannelManagerJs.includes(\"TAB_KEY = 'channels'\")) throw new Error('Marketing channel manager marker missing');"
            );
            build = build.replace(
              'await writeFile(`${output}marketing-ai-admin.js`, `${marketingAdminJs}\\n${marketingLiveJs}\\n${marketingPostingStatusJs}\\n`);',
              'await writeFile(`${output}marketing-ai-admin.js`, `${marketingAdminJs}\\n${marketingLiveJs}\\n${marketingPostingStatusJs}\\n${marketingChannelManagerJs}\\n`);'
            );
          }
          if (!build.includes('marketingChannelManagerJs')) throw new Error('Build integration failed');
          fs.writeFileSync(buildPath, build);

          const sitePath = 'site-worker.js';
          let site = fs.readFileSync(sitePath, 'utf8');
          if (!site.includes('ADMIN_MARKETING_PUBLISHING_PREFIX')) {
            site = site.replace(
              "const ADMIN_STORAGE_PREFIX = '/api/control/storage/';",
              "const ADMIN_STORAGE_PREFIX = '/api/control/storage/';\nconst ADMIN_MARKETING_PUBLISHING_PREFIX = '/api/control/marketing-publishing';"
            );
          }
          if (!site.includes('async function proxyAdminMarketingPublishing')) {
            const proxy = `
async function proxyAdminMarketingPublishing(request) {
  const url = new URL(request.url);
  const suffix = url.pathname.slice(ADMIN_MARKETING_PUBLISHING_PREFIX.length) || '/health';
  if (!(suffix === '/health' || suffix.startsWith('/v1/'))) {
    return withHostSecurity(new Response(JSON.stringify({error:'NOT_FOUND'}), {
      status:404,
      headers:{'content-type':'application/json; charset=utf-8','cache-control':'no-store'},
    }), ADMIN_CSP, 'no-store', 'admin-marketing-publishing-proxy');
  }
  const target = new URL('https://marketing-publish-api.ekodi.kr');
  target.pathname = suffix;
  target.search = url.search;
  const headers = new Headers(request.headers);
  headers.delete('origin');
  headers.delete('host');
  const body = ['GET','HEAD'].includes(request.method) ? undefined : await request.arrayBuffer();
  const upstream = await fetch(target.toString(), {method:request.method,headers,body,redirect:'manual'});
  const response = new Response(upstream.body, upstream);
  response.headers.set('X-EKODI-Marketing-Publishing-Proxy', 'same-origin-v1');
  return withHostSecurity(response, ADMIN_CSP, 'no-store', 'admin-marketing-publishing-proxy');
}
`;
            site = site.replace('\nexport default {', `${proxy}\nexport default {`);
          }
          if (!site.includes("url.pathname.startsWith(ADMIN_MARKETING_PUBLISHING_PREFIX)")) {
            site = site.replace(
              "      if (url.pathname.startsWith(ADMIN_STORAGE_PREFIX)) return proxyAdminStorage(request, env);",
              "      if (url.pathname.startsWith(ADMIN_STORAGE_PREFIX)) return proxyAdminStorage(request, env);\n      if (url.pathname.startsWith(ADMIN_MARKETING_PUBLISHING_PREFIX)) return proxyAdminMarketingPublishing(request);"
            );
          }
          if (!site.includes("X-EKODI-Marketing-Publishing-Proxy")) throw new Error('Admin publishing proxy integration failed');
          fs.writeFileSync(sitePath, site);
          NODE
      - name: Validate integrated source
        run: |
          set -euo pipefail
          node --check marketing-ai-channel-manager.js
          node --check site-worker.js
          node --check scripts/build.mjs
          npm run build --if-present
          grep -Fq 'Channels · 계정연결' dist/marketing-ai-admin.js
          grep -Fq 'same-origin-v1' site-worker.js
      - name: Commit integration
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.mjs site-worker.js
          git commit -m 'feat: integrate marketing channel connection console'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch guarded shared-site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site-core.yml --ref main
