name: Deploy EKODI Publishing
# Isolated PR staging + guarded/recovery production activation + persisted diagnostics.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'publishing/**'
      - 'publishing-worker.js'
      - 'wrangler.publishing.toml'
      - 'wrangler.publishing.staging.toml'
      - 'deploy/manifests/publishing.worker.json'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - '.github/workflows/deploy-publishing.yml'
  push:
    branches: [main]
    paths:
      - 'publishing/**'
      - 'publishing-worker.js'
      - 'wrangler.publishing.toml'
      - 'wrangler.publishing.staging.toml'
      - 'deploy/manifests/publishing.worker.json'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'scripts/guarded-worker-release.mjs'
      - '.github/workflows/deploy-publishing.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: ekodi-publishing-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Publishing source and release gate
        run: |
          set -euo pipefail
          node --check publishing-worker.js
          node --check publishing/app.js
          node --check publishing/studio/app.js
          node --check publishing/upaper/app.js
          node --check ekodi-service-manifest.js
          node --check scripts/guarded-worker-release.mjs
          test -f wrangler.publishing.staging.toml
          test -f deploy/manifests/publishing.worker.json
          grep -Fq "id:'publishing'" ekodi-service-manifest.js
          grep -Fq "state:'beta'" ekodi-service-manifest.js
          grep -Fq '"publishing"' platform-boundaries.json

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://ekodi-publishing-staging.topmaster-joseph.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated Publishing staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.publishing.staging.toml
      - name: Verify isolated Publishing staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/pub-stage-h -o /tmp/pub-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            studio=$(curl -L -sS -o /tmp/pub-stage-studio.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/studio/" || true)
            health=$(curl -sS -o /tmp/pub-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$root" == '200' && "$studio" == '200' && "$health" == '200' ]] \
              && grep -Fq 'EKODI PROFESSIONAL PUBLISHING SERVICE' /tmp/pub-stage.html \
              && grep -Fq 'EKODI PUBLISHING STUDIO' /tmp/pub-stage-studio.html \
              && grep -Fq '"service":"ekodi-publishing"' /tmp/pub-stage-health.json \
              && grep -Fq '"membership":"universal-free-lazy"' /tmp/pub-stage-health.json \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/pub-stage-h; then
              echo 'EKODI Publishing isolated staging verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Bootstrap unavailable production or use guarded release when stable
        shell: bash
        run: |
          set -euo pipefail
          live_code=$(curl -L -sS -o /tmp/publishing-before.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/' || true)
          if [[ "$live_code" =~ ^[23] ]] && grep -Fq 'EKODI PROFESSIONAL PUBLISHING SERVICE' /tmp/publishing-before.html; then
            echo 'Stable Publishing production is reachable; using guarded candidate release.'
            node scripts/guarded-worker-release.mjs --manifest deploy/manifests/publishing.worker.json
          else
            echo "Publishing production is unavailable or incomplete (HTTP $live_code); performing recovery bootstrap deploy."
            npx --yes wrangler@$WRANGLER_VERSION deploy --config wrangler.publishing.toml
          fi
      - name: Deep verify Publishing production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            root_code=$(curl -L -sS -D /tmp/root-h -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/' || true)
            studio_code=$(curl -L -sS -o /tmp/studio.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/studio/' || true)
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/health' || true)
            admin_code=$(curl -sS --max-redirs 0 -D /tmp/admin-h -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/admin' || true)
            echo "attempt=$attempt root=$root_code studio=$studio_code health=$health_code admin=$admin_code"
            if [[ "$root_code" =~ ^[23] ]] && [[ "$studio_code" =~ ^[23] ]] && [[ "$health_code" == '200' ]] && [[ "$admin_code" =~ ^30[1278]$ ]] \
              && grep -Fq 'EKODI PROFESSIONAL PUBLISHING SERVICE' /tmp/root.html \
              && grep -Fq 'EKODI PUBLISHING STUDIO' /tmp/studio.html \
              && grep -Fq '"service":"ekodi-publishing"' /tmp/health.json \
              && grep -Fq '"privateCrossServiceDataAccess":false' /tmp/health.json \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/root-h \
              && grep -Fiq 'location: https://admin.ekodi.kr/publishing#publishing' /tmp/admin-h; then
              echo 'EKODI Publishing production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Persist Publishing production probe
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ops/deploy-status
          root_meta=$(curl -L -sS -o /tmp/probe-root.html -w '%{http_code}|%{remote_ip}|%{errormsg}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/' 2>/tmp/probe-root.err)
          studio_meta=$(curl -L -sS -o /tmp/probe-studio.html -w '%{http_code}|%{remote_ip}|%{errormsg}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/studio/' 2>/tmp/probe-studio.err)
          health_meta=$(curl -L -sS -o /tmp/probe-health.json -w '%{http_code}|%{remote_ip}|%{errormsg}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/health' 2>/tmp/probe-health.err)
          admin_meta=$(curl -sS --max-redirs 0 -o /dev/null -w '%{http_code}|%{remote_ip}|%{errormsg}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/admin' 2>/tmp/probe-admin.err)
          ROOT_META="$root_meta" STUDIO_META="$studio_meta" HEALTH_META="$health_meta" ADMIN_META="$admin_meta" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          def split(value):
              parts=(value or '').split('|',2)
              parts += ['']*(3-len(parts))
              return {'http': parts[0], 'remoteIp': parts[1], 'error': parts[2]}
          payload={
              'service':'publishing',
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'githubRunId':os.environ.get('GITHUB_RUN_ID',''),
              'githubSha':os.environ.get('GITHUB_SHA',''),
              'root':split(os.environ.get('ROOT_META')),
              'studio':split(os.environ.get('STUDIO_META')),
              'health':split(os.environ.get('HEALTH_META')),
              'admin':split(os.environ.get('ADMIN_META')),
          }
          open('ops/deploy-status/publishing.json','w').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          cat ops/deploy-status/publishing.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/deploy-status/publishing.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ops): record Publishing production probe [skip ci]'
          git pull --rebase origin main || true
          git push || true
      - name: Publish Publishing production status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n --arg state "$state" --arg context 'ekodi/publishing-production' --arg description "EKODI Publishing production deployment: $JOB_STATUS" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
