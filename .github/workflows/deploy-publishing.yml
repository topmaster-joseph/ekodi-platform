name: Deploy EKODI Publishing
# 2026-08-24 operational activation and live-route verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publishing/**'
      - 'publishing-worker.js'
      - 'wrangler.publishing.toml'
      - 'deploy/manifests/publishing.worker.json'
      - 'scripts/guarded-worker-release.mjs'
      - '.github/workflows/deploy-publishing.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-publishing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Publishing source and release gate
        run: |
          set -euo pipefail
          node --check publishing-worker.js
          node --check publishing/app.js
          node --check publishing/studio/app.js
          node --check publishing/upaper/app.js
          node --check scripts/guarded-worker-release.mjs
          test -f deploy/manifests/publishing.worker.json
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Candidate at 0%, verify, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/publishing.worker.json
      - name: Deep verify Publishing production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -D /tmp/root-h -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/' || true)
            studio_code=$(curl -L -sS -o /tmp/studio.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/studio/' || true)
            admin_code=$(curl -sS --max-redirs 0 -D /tmp/admin-h -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://publishing.ekodi.kr/admin' || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$studio_code" =~ ^[23] ]] && [[ "$admin_code" =~ ^30[1278]$ ]] \
              && grep -Fq 'EKODI PROFESSIONAL PUBLISHING SERVICE' /tmp/root.html \
              && grep -Fq 'EKODI PUBLISHING STUDIO' /tmp/studio.html \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/root-h \
              && grep -Fiq 'location: https://admin.ekodi.kr/publishing#publishing' /tmp/admin-h; then
              echo 'EKODI Publishing production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
