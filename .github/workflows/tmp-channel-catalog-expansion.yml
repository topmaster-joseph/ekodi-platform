name: Temporary Channel Catalog Expansion

on:
  push:
    branches:
      - ai/chatgpt/channel-catalog-expansion-20260916
    paths:
      - .github/workflows/tmp-channel-catalog-expansion.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/chatgpt/channel-catalog-expansion-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --ci
      - name: Apply shared channel catalog integration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          function read(file){return fs.readFileSync(file,'utf8')}
          function write(file,text){fs.writeFileSync(file,text,'utf8')}
          function replaceOnce(text,from,to,label){
            const first=text.indexOf(from);
            if(first<0) throw new Error(`missing ${label}`);
            if(text.indexOf(from,first+from.length)>=0) throw new Error(`non-unique ${label}`);
            return text.slice(0,first)+to+text.slice(first+from.length);
          }
          function edit(file,fn){const before=read(file);const after=fn(before);if(after===before)throw new Error(`no change ${file}`);write(file,after)}

          edit('workspace-admin-page.js', text=>{
            text=replaceOnce(text,"import { ekodiBizAdminScopeSnapshot } from './ekodibiz-admin-registry.js';\n","import { ekodiBizAdminScopeSnapshot } from './ekodibiz-admin-registry.js';\nimport { channelTargetOptions } from './channel-publishing-catalog.js';\n",'workspace catalog import');
            text=replaceOnce(text,'function clientMain(POLICY,ADMIN_HUB){','function clientMain(POLICY,ADMIN_HUB,CHANNEL_CATALOG){','workspace client signature');
            text=replaceOnce(text,"  const CHANNEL_PROVIDERS=Object.freeze({youtube:{label:'YouTube',login:'Google',healthKey:'youtubeConfigured'},meta:{label:'Facebook · Instagram',login:'Meta',healthKey:'metaConfigured'},threads:{label:'Threads',login:'Threads',healthKey:'threadsConfigured'}});","  const CHANNEL_TARGETS=new Map((CHANNEL_CATALOG||[]).map(target=>[target.id,target]));\n  const CHANNEL_PROVIDERS=Object.freeze(Object.fromEntries((CHANNEL_CATALOG||[]).map(target=>[target.id,target])));\n  const CHANNEL_AUTH_PATHS=Object.freeze({youtube:'/v1/connect/youtube/start',meta:'/v1/connect/meta/start',threads:'/v1/connect/threads/start'});",'workspace providers');
            text=replaceOnce(text,"  function registryProvider(provider){return provider==='youtube'?{provider:'google',serviceKey:'youtube'}:provider==='threads'?{provider:'meta',serviceKey:'threads'}:{provider:'meta',serviceKey:'facebook'}}\n  function channelProviderFromRegistry(a){if(a?.provider==='google'&&a?.serviceKey==='youtube')return'youtube';if(a?.provider==='meta'&&a?.serviceKey==='threads')return'threads';if(a?.provider==='meta'&&['facebook','instagram','meta','general'].includes(a?.serviceKey))return'meta';return''}","  function registryProvider(provider){const target=CHANNEL_TARGETS.get(provider);if(!target)throw new Error('지원하지 않는 채널입니다.');return{provider:target.provider,serviceKey:target.serviceKey,connectionMode:target.connectionMode||'oauth'}}\n  function channelProviderFromRegistry(a){const provider=String(a?.provider||'').toLowerCase(),serviceKey=String(a?.serviceKey||'').toLowerCase();const target=(CHANNEL_CATALOG||[]).find(item=>item.provider===provider&&item.serviceKey===serviceKey);if(target)return target.id;if(provider==='meta'&&['meta','general','ads'].includes(serviceKey))return'facebook';return''}", 'workspace registry mapping');
            text=replaceOnce(text,"  async function startChannelConnect(provider,account={}){if(!CHANNEL_PROVIDERS[provider])throw new Error('지원하지 않는 채널입니다.');const path=provider==='youtube'?'/v1/connect/youtube/start':provider==='threads'?'/v1/connect/threads/start':'/v1/connect/meta/start';const accountHint=String(account.loginHint||account.providerAccountId||'').trim();const registryConnectionId=String(account.id||'').trim();const d=await growth(path,{method:'POST',body:JSON.stringify({mode:'publish',returnUrl:location.origin+location.pathname,accountHint,registryConnectionId})});if(!d.authorizationUrl)throw new Error('인증 주소를 받지 못했습니다.');location.assign(d.authorizationUrl)}","  async function startChannelConnect(provider,account={}){const target=CHANNEL_TARGETS.get(provider);if(!target)throw new Error('지원하지 않는 채널입니다.');const path=CHANNEL_AUTH_PATHS[target.authAdapter]||'';if(!target.automationAdapter||!path)throw new Error(target.limitation||`${target.label} 연결은 플랫폼 어댑터 활성 후 사용할 수 있습니다.`);const accountHint=String(account.loginHint||account.providerAccountId||'').trim();const registryConnectionId=String(account.id||'').trim();const d=await growth(path,{method:'POST',body:JSON.stringify({mode:'publish',returnUrl:location.origin+location.pathname,accountHint,registryConnectionId})});if(!d.authorizationUrl)throw new Error('인증 주소를 받지 못했습니다.');location.assign(d.authorizationUrl)}",'workspace auth start');
            text=replaceOnce(text,"      const providerCheck=(id,label)=>`<label><input type=\"checkbox\" name=\"provider:${id}\" ${allowed.has(id)?'checked':''}> ${label}</label>`;","      const policyTargets=(CHANNEL_CATALOG||[]).filter(target=>target.automationAdapter);\n      const providerCheck=(id,label)=>`<label><input type=\"checkbox\" name=\"provider:${id}\" ${allowed.has(id)?'checked':''}> ${label}</label>`;",'workspace policy targets');
            text=replaceOnce(text,"${providerCheck('facebook','Facebook')}${providerCheck('instagram','Instagram')}${providerCheck('threads','Threads')}${providerCheck('youtube','YouTube')}","${policyTargets.map(target=>providerCheck(target.id,target.label)).join('')}",'workspace policy checkboxes');
            const oldAccount="      const accountForm=`<form id='channelAccountForm' class='trade-form'><h2>게시채널 계정 추가</h2><p class='empty'>아이디·이메일 같은 계정 식별자만 먼저 등록합니다. 비밀번호나 OAuth 토큰은 이 화면에 저장하지 않습니다.</p><div class='design-grid'><div class='design-field'><strong>채널</strong><select name='provider'><option value='youtube'>YouTube</option><option value='meta'>Facebook · Instagram</option><option value='threads'>Threads</option></select></div><div class='design-field'><strong>계정 아이디 / 이메일</strong><input name='account' required maxlength='240' placeholder='YouTube는 Google 이메일, 그 외는 계정 식별자'></div><div class='design-field'><strong>표시 이름</strong><input name='displayName' maxlength='160' placeholder='선택 입력'></div></div><div class='actions'><button class='button primary' type='submit'>계정 등록</button></div></form>`;";
            const newAccount="      const catalogRows=(CHANNEL_CATALOG||[]).map(target=>{const configured=Boolean(platform[target.healthKey]),formats=(target.formats||[]).map(format=>format.label).join(' · '),stateLabel=target.automationAdapter?(configured?'연결 가능':'플랫폼 설정 필요'):target.id==='naver_blog'?'공식 공유 방식':target.automaticPublishing?'어댑터 준비 필요':'연결관리';return `<div class='service-row'><div><strong>${ae(target.label)}</strong><p>${ae(formats||'연결')}</p>${target.limitation?`<p>${ae(target.limitation)}</p>`:''}</div><span class='tag ${configured&&target.automationAdapter?'live':'warn'}'>${ae(stateLabel)}</span></div>`}).join('');\n      const catalogPanel=`<h2>지원 채널 · 게시형식</h2><div class='service-list'>${catalogRows}</div>`;\n      const targetOptions=(CHANNEL_CATALOG||[]).map(target=>`<option value='${ae(target.id)}'>${ae(target.label)} — ${ae((target.formats||[]).map(format=>format.label).join(' · '))}</option>`).join('');\n      const accountForm=`<form id='channelAccountForm' class='trade-form'><h2>게시채널 계정 추가</h2><p class='empty'>채널을 먼저 선택하고 계정 식별자만 등록합니다. 비밀번호나 OAuth 토큰은 저장하지 않습니다. 자동게시를 지원하지 않는 채널도 공식 공유·연결관리 대상으로 등록할 수 있습니다.</p><div class='design-grid'><div class='design-field'><strong>채널</strong><select name='provider'>${targetOptions}</select></div><div class='design-field'><strong>계정 아이디 / 이메일</strong><input name='account' required maxlength='240' placeholder='채널의 계정 ID 또는 이메일'></div><div class='design-field'><strong>표시 이름</strong><input name='displayName' maxlength='160' placeholder='선택 입력'></div></div><div class='actions'><button class='button primary' type='submit'>계정 등록</button></div></form>`;";
            text=replaceOnce(text,oldAccount,newAccount,'workspace account form');
            const oldRows="      const accountRows=registeredAccounts.map(a=>{const provider=channelProviderFromRegistry(a),ready=readyForProvider(provider),label=CHANNEL_PROVIDERS[provider]?.label||provider,status=accountStatusLabel(a.status);return `<div class='service-row'><div><strong>${ae(a.displayName||a.providerAccountId||label)}</strong><p>${ae(label)} · ${ae(a.loginHint||a.providerAccountId||'식별자 미입력')}</p>${a.lastError?`<p>최근 오류: ${ae(a.lastError)}</p>`:''}</div><div class='actions'><span class='tag ${a.status==='active'?'live':'warn'}'>${ae(status)}</span><button class='button ${ready?'primary':''}' type='button' data-account-auth='${ae(a.id)}' data-provider='${ae(provider)}' ${ready?'':'disabled'}>${a.status==='active'?'재인증':'인증'}${ready?'':' · 플랫폼 설정 대기'}</button></div></div>`}).join('');";
            const newRows="      const accountRows=registeredAccounts.map(a=>{const provider=channelProviderFromRegistry(a),target=CHANNEL_TARGETS.get(provider),ready=Boolean(target?.automationAdapter&&CHANNEL_AUTH_PATHS[target.authAdapter]&&platform[target.healthKey]),label=target?.label||provider,status=accountStatusLabel(a.status),inactiveLabel=target?.id==='naver_blog'?'공식 공유 방식':target?.automaticPublishing?'어댑터 준비 필요':'연결관리';return `<div class='service-row'><div><strong>${ae(a.displayName||a.providerAccountId||label)}</strong><p>${ae(label)} · ${ae(a.loginHint||a.providerAccountId||'식별자 미입력')} · ${ae((target?.formats||[]).map(format=>format.label).join(' · '))}</p>${a.lastError?`<p>최근 오류: ${ae(a.lastError)}</p>`:''}</div><div class='actions'><span class='tag ${a.status==='active'?'live':'warn'}'>${ae(status)}</span>${target?.automationAdapter?`<button class='button ${ready?'primary':''}' type='button' data-account-auth='${ae(a.id)}' data-provider='${ae(provider)}' ${ready?'':'disabled'}>${a.status==='active'?'재인증':'인증'}${ready?'':' · 플랫폼 설정 대기'}</button>`:`<span class='tag warn'>${ae(inactiveLabel)}</span>`}</div></div>`}).join('');";
            text=replaceOnce(text,oldRows,newRows,'workspace account rows');
            text=replaceOnce(text,"진행합니다.</p>${accountForm}","진행합니다.</p>${catalogPanel}${accountForm}",'workspace catalog panel render');
            const oldSubmit="      const accountEl=$('channelAccountForm');if(accountEl)accountEl.onsubmit=async e=>{e.preventDefault();try{state('계정 등록 중');const fd=new FormData(accountEl),provider=String(fd.get('provider')||''),account=String(fd.get('account')||'').trim(),displayName=String(fd.get('displayName')||'').trim(),map=registryProvider(provider);if(provider==='youtube'&&!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(account))throw new Error('YouTube는 인증할 Google 이메일을 입력해 주세요.');await externalAccountApi('/accounts',{method:'POST',body:JSON.stringify({workspaceSlug:canonicalSubjectKey(),provider:map.provider,serviceKey:map.serviceKey,providerAccountId:account,loginHint:provider==='youtube'?account:'',displayName:displayName||account,connectionMode:'oauth',capabilities:['channel.publish'],authorityRef:channelRegistryAuthority()})});await channel()}catch(e){state('계정 등록 확인 필요');$('pageCopy').textContent=e.message}};";
            const newSubmit="      const accountEl=$('channelAccountForm');if(accountEl)accountEl.onsubmit=async e=>{e.preventDefault();try{state('계정 등록 중');const fd=new FormData(accountEl),provider=String(fd.get('provider')||''),account=String(fd.get('account')||'').trim(),displayName=String(fd.get('displayName')||'').trim(),target=CHANNEL_TARGETS.get(provider),map=registryProvider(provider);if(provider==='youtube'&&!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(account))throw new Error('YouTube는 인증할 Google 이메일을 입력해 주세요.');const capabilities=target?.automationAdapter?['channel.publish']:provider==='naver_blog'?['channel.share']:['channel.manage'];await externalAccountApi('/accounts',{method:'POST',body:JSON.stringify({workspaceSlug:canonicalSubjectKey(),provider:map.provider,serviceKey:map.serviceKey,providerAccountId:account,loginHint:provider==='youtube'?account:'',displayName:displayName||account,connectionMode:map.connectionMode,capabilities,authorityRef:channelRegistryAuthority()})});await channel()}catch(e){state('계정 등록 확인 필요');$('pageCopy').textContent=e.message}};";
            text=replaceOnce(text,oldSubmit,newSubmit,'workspace account submit');
            text=replaceOnce(text,"providers=['facebook','instagram','threads','youtube'].filter(id=>fd.has('provider:'+id))","providers=policyTargets.filter(target=>fd.has('provider:'+target.id)).map(target=>target.id)",'workspace policy save');
            text=replaceOnce(text,"(${clientMain.toString()})(${JSON.stringify(payload)},${JSON.stringify(ekodiBizAdminScopeSnapshot())});","(${clientMain.toString()})(${JSON.stringify(payload)},${JSON.stringify(ekodiBizAdminScopeSnapshot())},${JSON.stringify(channelTargetOptions())});",'workspace script payload');
            return text;
          });

          edit('store-admin-engine.js', text=>{
            text=replaceOnce(text,"import { TENANT_ADMIN_CAPABILITIES, tenantAdminPolicySnapshot } from './tenant-admin-policy.js';\n","import { TENANT_ADMIN_CAPABILITIES, tenantAdminPolicySnapshot } from './tenant-admin-policy.js';\nimport { channelTargetOptions } from './channel-publishing-catalog.js';\n",'store catalog import');
            text=replaceOnce(text,'function clientMain(POLICY){','function clientMain(POLICY,CHANNEL_CATALOG){','store client signature');
            text=replaceOnce(text,"  const PUBLISH_API='https://marketing-publish-api.ekodi.kr';","  const PUBLISH_API='https://marketing-publish-api.ekodi.kr';\n  const CHANNEL_TARGETS=new Map((CHANNEL_CATALOG||[]).map(target=>[target.id,target]));\n  const CHANNEL_AUTH_PATHS=Object.freeze({youtube:'/v1/connect/youtube/start',meta:'/v1/connect/meta/start',threads:'/v1/connect/threads/start'});",'store catalog constants');
            text=replaceOnce(text,"  function storeRegistryProvider(provider){return provider==='youtube'?{provider:'google',serviceKey:'youtube'}:provider==='threads'?{provider:'meta',serviceKey:'threads'}:{provider:'meta',serviceKey:'facebook'}}\n  function storeChannelProvider(a){if(a?.provider==='google'&&a?.serviceKey==='youtube')return'youtube';if(a?.provider==='meta'&&a?.serviceKey==='threads')return'threads';if(a?.provider==='meta'&&['facebook','instagram','meta','general'].includes(a?.serviceKey))return'meta';return''}","  function storeRegistryProvider(provider){const target=CHANNEL_TARGETS.get(provider);if(!target)throw new Error('지원하지 않는 채널입니다.');return{provider:target.provider,serviceKey:target.serviceKey,connectionMode:target.connectionMode||'oauth'}}\n  function storeChannelProvider(a){const provider=String(a?.provider||'').toLowerCase(),serviceKey=String(a?.serviceKey||'').toLowerCase();const target=(CHANNEL_CATALOG||[]).find(item=>item.provider===provider&&item.serviceKey===serviceKey);if(target)return target.id;if(provider==='meta'&&['meta','general','ads'].includes(serviceKey))return'facebook';return''}", 'store registry mapping');
            text=replaceOnce(text,"  async function startStoreChannelAuth(provider,account){const path=provider==='youtube'?'/v1/connect/youtube/start':provider==='threads'?'/v1/connect/threads/start':'/v1/connect/meta/start';const r=await growthChannel(path,{method:'POST',body:JSON.stringify({mode:'publish',returnUrl:location.origin+location.pathname,accountHint:String(account.loginHint||account.providerAccountId||''),registryConnectionId:String(account.id||'')})});if(!r.authorizationUrl)throw new Error('인증 주소를 받지 못했습니다.');location.assign(r.authorizationUrl)}","  async function startStoreChannelAuth(provider,account){const target=CHANNEL_TARGETS.get(provider);if(!target)throw new Error('지원하지 않는 채널입니다.');const path=CHANNEL_AUTH_PATHS[target.authAdapter]||'';if(!target.automationAdapter||!path)throw new Error(target.limitation||`${target.label} 연결은 플랫폼 어댑터 활성 후 사용할 수 있습니다.`);const r=await growthChannel(path,{method:'POST',body:JSON.stringify({mode:'publish',returnUrl:location.origin+location.pathname,accountHint:String(account.loginHint||account.providerAccountId||''),registryConnectionId:String(account.id||'')})});if(!r.authorizationUrl)throw new Error('인증 주소를 받지 못했습니다.');location.assign(r.authorizationUrl)}",'store auth start');
            const oldReady="  const ready=p=>Boolean(platform[p==='youtube'?'youtubeConfigured':p==='threads'?'threadsConfigured':'metaConfigured']);const rows=accounts.map(a=>{const p=storeChannelProvider(a),ok=ready(p);return `<div class=\"service-row\"><div><strong>${esc(a.displayName||a.providerAccountId)}</strong><p>${esc(p)} · ${esc(a.loginHint||a.providerAccountId||'')}</p>${a.lastError?`<p>${esc(a.lastError)}</p>`:''}</div><div class=\"actions\"><span class=\"tag ${a.status==='active'?'live':'warn'}\">${esc(storeAccountStatus(a.status))}</span><button class=\"button ${ok?'primary':''}\" data-store-auth=\"${esc(a.id)}\" data-provider=\"${esc(p)}\" ${ok?'':'disabled'}>${a.status==='active'?'재인증':'인증'}${ok?'':' · 플랫폼 설정 대기'}</button></div></div>`}).join('');";
            const newReady="  const ready=p=>{const target=CHANNEL_TARGETS.get(p);return Boolean(target?.automationAdapter&&CHANNEL_AUTH_PATHS[target.authAdapter]&&platform[target.healthKey])};const rows=accounts.map(a=>{const p=storeChannelProvider(a),target=CHANNEL_TARGETS.get(p),ok=ready(p),inactiveLabel=target?.id==='naver_blog'?'공식 공유 방식':target?.automaticPublishing?'어댑터 준비 필요':'연결관리';return `<div class=\"service-row\"><div><strong>${esc(a.displayName||a.providerAccountId)}</strong><p>${esc(target?.label||p)} · ${esc(a.loginHint||a.providerAccountId||'')} · ${esc((target?.formats||[]).map(format=>format.label).join(' · '))}</p>${a.lastError?`<p>${esc(a.lastError)}</p>`:''}</div><div class=\"actions\"><span class=\"tag ${a.status==='active'?'live':'warn'}\">${esc(storeAccountStatus(a.status))}</span>${target?.automationAdapter?`<button class=\"button ${ok?'primary':''}\" data-store-auth=\"${esc(a.id)}\" data-provider=\"${esc(p)}\" ${ok?'':'disabled'}>${a.status==='active'?'재인증':'인증'}${ok?'':' · 플랫폼 설정 대기'}</button>`:`<span class=\"tag warn\">${esc(inactiveLabel)}</span>`}</div></div>`}).join('');";
            text=replaceOnce(text,oldReady,newReady,'store account rows');
            const marker="  const channelRows=channels.map(c=>`<form class=\"service-row\"";
            const idx=text.indexOf(marker);if(idx<0)throw new Error('missing store channelRows marker');
            const insert="  const catalogRows=(CHANNEL_CATALOG||[]).map(target=>{const configured=Boolean(platform[target.healthKey]),formats=(target.formats||[]).map(format=>format.label).join(' · '),stateLabel=target.automationAdapter?(configured?'연결 가능':'플랫폼 설정 필요'):target.id==='naver_blog'?'공식 공유 방식':target.automaticPublishing?'어댑터 준비 필요':'연결관리';return `<div class=\"service-row\"><div><strong>${esc(target.label)}</strong><p>${esc(formats||'연결')}</p>${target.limitation?`<p>${esc(target.limitation)}</p>`:''}</div><span class=\"tag ${configured&&target.automationAdapter?'live':'warn'}\">${esc(stateLabel)}</span></div>`}).join('');\n  const targetOptions=(CHANNEL_CATALOG||[]).map(target=>`<option value=\"${esc(target.id)}\">${esc(target.label)} — ${esc((target.formats||[]).map(format=>format.label).join(' · '))}</option>`).join('');\n";
            text=text.slice(0,idx)+insert+text.slice(idx);
            text=replaceOnce(text,"<h2>게시채널 멀티계정</h2><p class=\"panel-lead\">계정 아이디·이메일만 먼저 등록하고 각 계정의 공식 OAuth 화면에서 인증합니다. 비밀번호·토큰은 이 화면에 저장하지 않습니다.</p><form id=\"storeChannelAccountForm\" class=\"trade-form\"><div class=\"trade-grid\"><label>채널<select name=\"provider\"><option value=\"youtube\">YouTube</option><option value=\"meta\">Facebook · Instagram</option><option value=\"threads\">Threads</option></select></label>","<h2>지원 채널 · 게시형식</h2><div class=\"service-list\">${catalogRows}</div><h2 style=\"margin-top:18px\">게시채널 멀티계정</h2><p class=\"panel-lead\">채널을 선택해 계정 식별자만 등록합니다. 비밀번호·토큰은 저장하지 않으며 자동게시 미지원 채널도 공식 공유·연결관리 대상으로 유지합니다.</p><form id=\"storeChannelAccountForm\" class=\"trade-form\"><div class=\"trade-grid\"><label>채널<select name=\"provider\">${targetOptions}</select></label>",'store catalog/form');
            const oldSubmit="  $('storeChannelAccountForm').onsubmit=async e=>{e.preventDefault();try{const fd=new FormData(e.currentTarget),provider=String(fd.get('provider')||''),account=String(fd.get('account')||'').trim(),displayName=String(fd.get('displayName')||'').trim(),map=storeRegistryProvider(provider);if(provider==='youtube'&&!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(account))throw new Error('YouTube는 인증할 Google 이메일을 입력해 주세요.');setState('계정 등록 중');await externalAccountCall('/accounts',{method:'POST',body:JSON.stringify({workspaceSlug:SLUG,provider:map.provider,serviceKey:map.serviceKey,providerAccountId:account,loginHint:provider==='youtube'?account:'',displayName:displayName||account,connectionMode:'oauth',capabilities:['channel.publish'],authorityRef:`store:${STORE_ID}`})});await publishingPanel()}catch(err){$('pageCopy').textContent=err.message;setState('계정 등록 확인 필요','warn')}};";
