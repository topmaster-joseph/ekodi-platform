name: EKODI Mall Sub ID Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ekodi-mall-subid-diagnose.yml'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.127.1'
  VERIFIED_MALL_SUB_ID: 'ekodimall'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Request one-time forced report discovery
        id: force_request
        shell: bash
        run: |
          set -euo pipefail
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ready=false
          for attempt in $(seq 1 60); do
            if npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --command "INSERT INTO affiliate_partner_report_control(account_id,force_requested_at,force_reason,force_consumed_at,updated_at) VALUES('coupang-ekodibiz','$requested_at','github_diagnostic',NULL,'$requested_at') ON CONFLICT(account_id) DO UPDATE SET force_requested_at=excluded.force_requested_at,force_reason=excluded.force_reason,force_consumed_at=NULL,updated_at=excluded.updated_at" >/tmp/force-request.log 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          [ "$ready" = "true" ]
          echo "request_epoch=$(date -u -d "$requested_at" +%s)" >> "$GITHUB_OUTPUT"
          echo "One-time force request queued at $requested_at." >> "$GITHUB_STEP_SUMMARY"
      - name: Observe fresh scheduled discovery and aggregate Sub IDs
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          cutoff='${{ steps.force_request.outputs.request_epoch }}'
          fresh=false
          for attempt in $(seq 1 48); do
            npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT sync_date,status,reason,start_date,end_date,orders_rows,cancels_rows,commission_rows,matched_product_rows,unmatched_product_rows,error_text,started_at,finished_at FROM affiliate_partner_report_runs ORDER BY id DESC LIMIT 3" > /tmp/runs.json
            fresh=$(CUTOFF="$cutoff" node - <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const rows=unwrap(JSON.parse(fs.readFileSync('/tmp/runs.json','utf8')));
          const t=Date.parse(rows[0]?.started_at||'')/1000;
          process.stdout.write(Number.isFinite(t)&&t>=Number(process.env.CUTOFF)?'true':'false');
          NODE
            )
            [ "$fresh" = "true" ] && break
            sleep 15
          done
          if [ "$fresh" != "true" ]; then
            echo 'No fresh scheduled Coupang report run observed within diagnostic window.' >&2
            exit 1
          fi
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT candidate_sub_id,is_default,clicks_rows,orders_rows,cancels_rows,commission_rows,first_seen_date,last_seen_date,updated_at FROM affiliate_partner_subid_discovery ORDER BY orders_rows DESC,clicks_rows DESC" > /tmp/subids.json
          node <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const c=unwrap(JSON.parse(fs.readFileSync('/tmp/subids.json','utf8')));
          const runs=unwrap(JSON.parse(fs.readFileSync('/tmp/runs.json','utf8')));
          const safe=c.map(r=>({subId:String(r.candidate_sub_id||''),isDefault:Number(r.is_default||0),clicks:Number(r.clicks_rows||0),orders:Number(r.orders_rows||0),cancels:Number(r.cancels_rows||0),commissionRows:Number(r.commission_rows||0),firstSeen:r.first_seen_date||'',lastSeen:r.last_seen_date||''}));
          const verified=String(process.env.VERIFIED_MALL_SUB_ID||'').trim();
          const observed=safe.some(r=>r.subId===verified);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`observed_verified_subid=${observed?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Fresh Coupang Sub ID discovery\n\nRegistry-verified Mall Sub ID configured: `'+Boolean(verified)+'`\n\nObserved in recent report rows: `'+observed+'`\n\nCandidates: `'+JSON.stringify(safe)+'`\n\nRun: `'+JSON.stringify(runs[0]||{})+'`\n');
          console.log(JSON.stringify({candidates:safe,latestRun:runs[0]||{},registryVerified:Boolean(verified),observedVerifiedSubId:observed}));
          NODE
      - name: Bind verified EKODI Mall Sub ID
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERIFIED_MALL_SUB_ID}"
          printf '%s' "${VERIFIED_MALL_SUB_ID}" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_PARTNERS_SUB_ID --config wrangler.api.toml >/dev/null
          date -u +%s > /tmp/bind-cutoff
          echo 'Registry-verified EKODI Mall Sub ID bound to production Worker secret.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify bound report closed loop
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(cat /tmp/bind-cutoff)
          success=false
          for attempt in $(seq 1 48); do
            npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT sync_date,status,start_date,end_date,orders_rows,cancels_rows,commission_rows,matched_product_rows,unmatched_product_rows,error_text,started_at,finished_at FROM affiliate_partner_report_runs ORDER BY id DESC LIMIT 1" > /tmp/bound-run.json
            success=$(CUTOFF="$cutoff" node - <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const r=unwrap(JSON.parse(fs.readFileSync('/tmp/bound-run.json','utf8')))[0]||{};
          const fresh=Date.parse(r.started_at||'')/1000>=Number(process.env.CUTOFF);
          process.stdout.write(fresh&&r.status==='success'?'true':'false');
          NODE
            )
            [ "$success" = "true" ] && break
            sleep 15
          done
          if [ "$success" != "true" ]; then
            echo 'Bound Sub ID report did not reach success within diagnostic window.' >&2
            cat /tmp/bound-run.json >&2
            exit 1
          fi
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT COUNT(*) AS rows,SUM(orders) AS orders,SUM(cancels) AS cancels,SUM(gmv_krw) AS gmv_krw,SUM(commission_krw) AS commission_krw FROM affiliate_product_performance_daily WHERE source='coupang_partner_api_purchase'" > /tmp/perf.json
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT COUNT(*) AS rows,SUM(clicks) AS clicks,SUM(orders) AS orders,SUM(revenue_krw) AS commission_krw FROM affiliate_daily_metrics WHERE account_id='coupang-ekodibiz' AND source='coupang_partner_api'" > /tmp/metrics.json
          node <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const run=unwrap(JSON.parse(fs.readFileSync('/tmp/bound-run.json','utf8')))[0]||{};
          const perf=unwrap(JSON.parse(fs.readFileSync('/tmp/perf.json','utf8')))[0]||{};
          const metrics=unwrap(JSON.parse(fs.readFileSync('/tmp/metrics.json','utf8')))[0]||{};
          const proof={run,productPerformance:perf,dailyMetrics:metrics};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Bound report proof\n\n`'+JSON.stringify(proof)+'`\n');
          console.log(JSON.stringify(proof));
          NODE

      - name: Request one-time catalog refresh after Sub ID bind
        id: catalog_force
        shell: bash
        run: |
          set -euo pipefail
          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ready=false
          for attempt in $(seq 1 60); do
            if npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --command "INSERT INTO affiliate_partner_report_control(account_id,catalog_force_requested_at,catalog_force_reason,catalog_force_consumed_at,updated_at) VALUES('coupang-ekodibiz','$requested_at','subid_rebind',NULL,'$requested_at') ON CONFLICT(account_id) DO UPDATE SET catalog_force_requested_at=excluded.catalog_force_requested_at,catalog_force_reason=excluded.catalog_force_reason,catalog_force_consumed_at=NULL,updated_at=excluded.updated_at" >/tmp/catalog-force.log 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          [ "$ready" = "true" ]
          echo "request_epoch=$(date -u -d "$requested_at" +%s)" >> "$GITHUB_OUTPUT"
          echo "One-time catalog refresh queued at $requested_at." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify refreshed Sub ID catalog
        shell: bash
        run: |
          set -euo pipefail
          cutoff='${{ steps.catalog_force.outputs.request_epoch }}'
          success=false
          for attempt in $(seq 1 48); do
            npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT status,reason,selected_count,started_at,finished_at FROM affiliate_recommendation_runs WHERE storefront_slug='ekodi-mall' ORDER BY id DESC LIMIT 1" > /tmp/catalog-run.json
            success=$(CUTOFF="$cutoff" node - <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const r=unwrap(JSON.parse(fs.readFileSync('/tmp/catalog-run.json','utf8')))[0]||{};
          const fresh=Date.parse(r.started_at||'')/1000>=Number(process.env.CUTOFF);
          process.stdout.write(fresh&&r.status==='success'&&r.reason==='schedule_force:subid_rebind'?'true':'false');
          NODE
            )
            [ "$success" = "true" ] && break
            sleep 15
          done
          if [ "$success" != "true" ]; then
            echo 'Sub ID catalog refresh did not reach success.' >&2
            cat /tmp/catalog-run.json >&2
            exit 1
          fi
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.api.toml --json --command "SELECT COUNT(*) AS active_products,MAX(selected_at) AS latest_selected_at FROM affiliate_storefront_products WHERE account_id='coupang-ekodibiz' AND storefront_slug='ekodi-mall' AND status='active'" > /tmp/catalog-proof.json
          node <<'NODE'
          const fs=require('node:fs');
          const unwrap=x=>{const a=Array.isArray(x)?x:(x?.result||[]);const b=Array.isArray(a)?a[0]:a;return b?.results||b?.result||[]};
          const run=unwrap(JSON.parse(fs.readFileSync('/tmp/catalog-run.json','utf8')))[0]||{};
          const catalog=unwrap(JSON.parse(fs.readFileSync('/tmp/catalog-proof.json','utf8')))[0]||{};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Refreshed Sub ID catalog\n\n`'+JSON.stringify({run,catalog})+'`\n');
          console.log(JSON.stringify({run,catalog}));
          NODE


