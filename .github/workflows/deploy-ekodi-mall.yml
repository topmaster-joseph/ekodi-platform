name: EKODI Mall · Build and Deploy

on:
  pull_request:
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  push:
    branches: [main]
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/ekodi-mall
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load deployment manifest
        id: manifest
        run: |
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).projectName")
          PUBLIC_URL=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).publicUrl")
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Validate Mall site and API contracts
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/assets/seller-server.js
          test -f dist/assets/public-product.js
          test -f dist/assets/shared-product.html
          test -f dist/seller/index.html
          grep -q "SELLER STUDIO" dist/seller/index.html
          grep -q "/p/\* /assets/shared-product.html 200" dist/_redirects
          grep -q "api/public/checkout/quote" dist/assets/public-product.js
          grep -q "/share-links" dist/assets/seller-server.js
          echo "Mall static build, attribution split and order quote client verified"

      - name: Check Cloudflare credentials
        id: cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; PR validation remains green and deployment will be skipped."
          fi

      - name: Resolve or create Mall D1
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        id: mall_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=j.find(v=>v.name==='ekodi-mall');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating isolated ekodi-mall D1 database in APAC"
            npx --yes wrangler@4 d1 create ekodi-mall --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          cp api/wrangler.toml api/wrangler.runtime.toml
          printf '\ndatabase_id = "%s"\n' "$DB_ID" >> api/wrangler.runtime.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply Mall D1 migrations
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config api/wrangler.runtime.toml

      - name: Deploy Mall API Worker
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config api/wrangler.runtime.toml

      - name: Smoke test Mall API
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/mall-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api.ekodi.kr/health || true)
            if [ "$code" = "200" ] \
              && grep -Fq '"schemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"orderSchemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"paymentsEnabled":false' /tmp/mall-api.json \
              && grep -Fq '"payoutExecutionEnabled":false' /tmp/mall-api.json; then
              echo "Mall API, order schema and disabled payment/payout gates are ready."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/mall-api.json || true
          exit 1

      - name: Deploy production to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ steps.manifest.outputs.project }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Smoke test production
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          PUBLIC_URL: ${{ steps.manifest.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_URL%/}"
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/mall-root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/" || true)
            seller_code=$(curl -L -sS -o /tmp/mall-seller.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/seller/" || true)
            shared_code=$(curl -L -sS -o /tmp/mall-shared.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/p/not-a-real-product" || true)
            public_js_code=$(curl -L -sS -o /tmp/mall-public-js -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/assets/public-product.js" || true)
            seller_js_code=$(curl -L -sS -o /tmp/mall-seller-js -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/assets/seller-server.js" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$seller_code" =~ ^[23] ]] && [[ "$shared_code" =~ ^[23] ]] \
              && [ "$public_js_code" = "200" ] && [ "$seller_js_code" = "200" ] \
              && grep -Fq 'EKODI MALL' /tmp/mall-root.html \
              && grep -Fq 'SERVER READY' /tmp/mall-seller.html \
              && grep -Fq 'PUBLIC PRODUCT' /tmp/mall-shared.html \
              && grep -Fq 'api/public/checkout/quote' /tmp/mall-public-js \
              && grep -Fq '/share-links' /tmp/mall-seller-js; then
              echo "EKODI Mall production smoke test passed."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Cleanup runtime config
        if: always()
        run: rm -f api/wrangler.runtime.toml

      - name: Deployment configuration notice
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available != 'true'
        run: |
          echo "### EKODI Mall build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare deployment was skipped because repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
