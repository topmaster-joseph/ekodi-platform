name: EKODI Mall · Build and Deploy

on:
  pull_request:
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  push:
    branches: [main]
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/ekodi-mall
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load deployment manifest
        id: manifest
        run: |
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).projectName")
          PUBLIC_URL=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).publicUrl")
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Validate content
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/assets/styles.css
          test -f dist/assets/platform.css
          test -f dist/assets/app.js
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/stores/ekodi-select/index.html
          test -f dist/seller/index.html
          grep -q "EKODI MALL" dist/index.html
          grep -q "MARKETPLACE" dist/index.html
          grep -q "EKODI Select" dist/stores/ekodi-select/index.html
          grep -q "SELLER STUDIO" dist/seller/index.html
          PRODUCT_COUNT=$(find dist/products -name index.html | wc -l)
          STORE_COUNT=$(find dist/stores -name index.html | wc -l)
          POLICY_COUNT=$(find dist/pages -name index.html | wc -l)
          test "$PRODUCT_COUNT" -gt 0
          test "$STORE_COUNT" -gt 0
          test "$POLICY_COUNT" -gt 0
          echo "Verified $STORE_COUNT stores, $PRODUCT_COUNT product pages and $POLICY_COUNT policy pages"

      - name: Check Cloudflare credentials
        id: cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; build remains green and deployment will be skipped."
          fi

      - name: Deploy production to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ steps.manifest.outputs.project }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Smoke test production
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available == 'true'
        env:
          PUBLIC_URL: ${{ steps.manifest.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_URL%/}"
          for attempt in $(seq 1 18); do
            echo "Production propagation check ${attempt}/18"
            root_code=$(curl -L -sS -o /tmp/mall-root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/" || true)
            product_code=$(curl -L -sS -o /tmp/mall-product.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/products/reusable-daily-bottle/" || true)
            store_code=$(curl -L -sS -o /tmp/mall-store.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/stores/ekodi-select/" || true)
            seller_code=$(curl -L -sS -o /tmp/mall-seller.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/seller/" || true)
            privacy_code=$(curl -L -sS -o /tmp/mall-privacy.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/pages/privacy/" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$product_code" =~ ^[23] ]] && [[ "$store_code" =~ ^[23] ]] && [[ "$seller_code" =~ ^[23] ]] && [[ "$privacy_code" =~ ^[23] ]] \
              && grep -Fq 'EKODI MALL' /tmp/mall-root.html \
              && grep -Fq 'MARKETPLACE' /tmp/mall-root.html \
              && grep -Fq 'EKODI Select' /tmp/mall-product.html \
              && grep -Fq 'EKODI Select' /tmp/mall-store.html \
              && grep -Fq 'SELLER STUDIO' /tmp/mall-seller.html \
              && grep -Fq 'EKODI MALL' /tmp/mall-privacy.html; then
              echo "EKODI Mall production smoke test passed."
              exit 0
            fi
            sleep 5
          done
          echo "EKODI Mall production alias did not converge to the deployed build in time."
          exit 1

      - name: Deployment configuration notice
        if: github.event_name != 'pull_request' && steps.cloudflare_credentials.outputs.available != 'true'
        run: |
          echo "### EKODI Mall build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare deployment was skipped because repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          echo "Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"
