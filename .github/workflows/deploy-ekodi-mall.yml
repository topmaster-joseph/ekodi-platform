name: EKODI Mall · Stage and Deploy

on:
  pull_request:
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  push:
    branches: [main]
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.119.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cloudflare: ${{ steps.cloudflare_credentials.outputs.available }}
      project: ${{ steps.manifest.outputs.project }}
      public_url: ${{ steps.manifest.outputs.url }}
    defaults:
      run:
        working-directory: sites/ekodi-mall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Load deployment manifest
        id: manifest
        run: |
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).projectName")
          PUBLIC_URL=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).publicUrl")
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Validate Mall source and API contracts
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify static and secure-attribution assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/seller-server.js
          test -f dist/assets/public-product.js
          test -f dist/assets/marketplace-live.js
          test -f dist/assets/shared-product.html
          test -f dist/seller/index.html
          grep -Fq '/assets/marketplace-live.js' dist/index.html
          grep -Fq '7% 직접링크 복사' dist/assets/seller-server.js
          grep -Fq '/api/public/attribution/visit' dist/assets/public-product.js
          grep -Fq '/p/* /assets/shared-product.html 200' dist/_redirects
          echo "Mall UI + secure attribution build verified"

      - name: Validate all Mall D1 migrations in SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          for migration in sorted(Path('api/migrations').glob('*.sql')):
              db.executescript(migration.read_text(encoding='utf-8'))
          tables = {row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          required = {'seller_profiles','memberships','stores','products','attribution_tokens','product_events','share_links','attribution_visits'}
          missing = required - tables
          if missing:
              raise SystemExit(f'Missing Mall D1 tables: {sorted(missing)}')
          print('Mall D1 migrations valid:', ', '.join(sorted(required)))
          PY

      - name: Check Cloudflare credentials
        id: cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; code validation passes but staging/production deployment is skipped."
          fi

  staging:
    needs: validate
    if: needs.validate.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/ekodi-mall
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve or create isolated staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-mall-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating isolated ekodi-mall-staging D1 database in APAC"
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-mall-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build staging Wrangler config
        shell: bash
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          cat > api/wrangler.staging.runtime.toml <<EOF
          name = "ekodi-mall-api-staging"
          main = "worker.js"
          compatibility_date = "2026-08-14"
          workers_dev = true
          preview_urls = false

          [[routes]]
          pattern = "mall-api-staging.ekodi.kr"
          custom_domain = true

          [vars]
          ENVIRONMENT = "staging"
          MALL_BASE_URL = "https://mall.ekodi.kr"
          ALLOWED_ORIGINS = "https://mall.ekodi.kr,https://mall.biz.ekodi.kr,https://ekodi-mall.pages.dev"
          SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
          SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"

          [observability.logs]
          enabled = true
          invocation_logs = true

          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-mall-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF

      - name: Apply staging D1 migrations
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config api/wrangler.staging.runtime.toml

      - name: Deploy staging Mall API
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.staging.runtime.toml

      - name: Smoke test staging contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health_code=$(curl -sS -o /tmp/mall-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api-staging.ekodi.kr/health || true)
            fees_code=$(curl -sS -o /tmp/mall-stage-fees.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api-staging.ekodi.kr/api/public/fees || true)
            legacy_code=$(curl -sS -o /tmp/mall-stage-legacy.json -w '%{http_code}' --connect-timeout 5 --max-time 15 -X POST https://mall-api-staging.ekodi.kr/api/public/attribution || true)
            if [ "$health_code" = "200" ] && [ "$fees_code" = "200" ] && [ "$legacy_code" = "410" ] \
              && grep -Fq '"schemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"environment":"staging"' /tmp/mall-stage-health.json \
              && grep -Fq '"version":2' /tmp/mall-stage-health.json \
              && grep -Fq '"direct":7' /tmp/mall-stage-fees.json \
              && grep -Fq '"marketplace":8' /tmp/mall-stage-fees.json \
              && grep -Fq '"ai":9' /tmp/mall-stage-fees.json \
              && grep -Fq 'DIRECT_ATTRIBUTION_ENDPOINT_RETIRED' /tmp/mall-stage-legacy.json; then
              echo "Mall staging API passed migration, health, fee and anti-spoof checks."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/mall-stage-health.json || true
          cat /tmp/mall-stage-fees.json || true
          cat /tmp/mall-stage-legacy.json || true
          exit 1

      - name: Cleanup staging runtime config
        if: always()
        run: rm -f api/wrangler.staging.runtime.toml

  production:
    needs: [validate, staging]
    if: github.event_name != 'pull_request' && needs.validate.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites/ekodi-mall
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Rebuild exact production artifact
        run: npm run build

      - name: Resolve or create production D1
        id: mall_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-mall');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating isolated ekodi-mall production D1 database in APAC"
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-mall --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          cp api/wrangler.toml api/wrangler.runtime.toml
          printf '\ndatabase_id = "%s"\n' "$DB_ID" >> api/wrangler.runtime.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply production migrations after staging success
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config api/wrangler.runtime.toml

      - name: Deploy production Mall API after staging success
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.runtime.toml

      - name: Smoke test production API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health_code=$(curl -sS -o /tmp/mall-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api.ekodi.kr/health || true)
            fees_code=$(curl -sS -o /tmp/mall-fees.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api.ekodi.kr/api/public/fees || true)
            if [ "$health_code" = "200" ] && [ "$fees_code" = "200" ] \
              && grep -Fq '"schemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"environment":"production"' /tmp/mall-api.json \
              && grep -Fq '"version":2' /tmp/mall-api.json \
              && grep -Fq '"paymentsEnabled":false' /tmp/mall-api.json \
              && grep -Fq '"direct":7' /tmp/mall-fees.json \
              && grep -Fq '"marketplace":8' /tmp/mall-fees.json \
              && grep -Fq '"ai":9' /tmp/mall-fees.json; then
              echo "Mall production API verified."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/mall-api.json || true
          cat /tmp/mall-fees.json || true
          exit 1

      - name: Deploy production to Cloudflare Pages
        env:
          CF_PROJECT: ${{ needs.validate.outputs.project }}
        run: npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Smoke test production UI
        env:
          PUBLIC_URL: ${{ needs.validate.outputs.public_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_URL%/}"
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/mall-root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/" || true)
            seller_code=$(curl -L -sS -o /tmp/mall-seller.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/seller/" || true)
            shared_code=$(curl -L -sS -o /tmp/mall-shared.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/p/not-a-real-product" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$seller_code" =~ ^[23] ]] && [[ "$shared_code" =~ ^[23] ]] \
              && grep -Fq 'EKODI MALL' /tmp/mall-root.html \
              && grep -Fq '/assets/marketplace-live.js' /tmp/mall-root.html \
              && grep -Fq 'SERVER READY' /tmp/mall-seller.html \
              && grep -Fq 'PUBLIC PRODUCT' /tmp/mall-shared.html; then
              echo "EKODI Mall production UI smoke test passed."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Cleanup production runtime config
        if: always()
        run: rm -f api/wrangler.runtime.toml
