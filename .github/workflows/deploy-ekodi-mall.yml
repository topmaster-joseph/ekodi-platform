name: EKODI Mall · Stage and Deploy

on:
  pull_request:
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  push:
    branches: [main]
    paths:
      - "sites/ekodi-mall/**"
      - ".github/workflows/deploy-ekodi-mall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.119.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      development_cloudflare: ${{ steps.development_cloudflare_credentials.outputs.available }}
      production_cloudflare: ${{ steps.production_cloudflare_credentials.outputs.available }}
      project: ${{ steps.manifest.outputs.project }}
      public_url: ${{ steps.manifest.outputs.url }}
    defaults:
      run:
        working-directory: sites/ekodi-mall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Load deployment manifest
        id: manifest
        run: |
          PROJECT=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).projectName")
          PUBLIC_URL=$(node -p "JSON.parse(require('fs').readFileSync('deployment.json','utf8')).publicUrl")
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Validate Mall site and API contracts
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify first-touch and live-marketplace assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/seller-server.js
          test -f dist/assets/public-product.js
          test -f dist/assets/marketplace-live.js
          test -f dist/assets/shared-product.html
          test -f dist/assets/verification-ops.html
          test -f dist/assets/verification-ops.js
          test -f dist/seller/index.html
          grep -Fq '/assets/marketplace-live.js' dist/index.html
          grep -Fq '/api/public/attribution/visit' dist/assets/public-product.js
          grep -Fq 'api/public/checkout/quote' dist/assets/public-product.js
          grep -Fq '/share-links' dist/assets/seller-server.js
          grep -Fq '/api/internal/verification/queue' dist/assets/verification-ops.js
          grep -Fq '/api/internal/verification/launch-readiness' dist/assets/verification-ops.js
          grep -Fq '/api/internal/operations/cockpit' dist/assets/verification-ops.js
          grep -Fq 'COMMERCE OS COCKPIT' dist/assets/verification-ops.html
          grep -Fq '/checkout-gate' dist/assets/verification-ops.js
          grep -Fq '/p/* /assets/shared-product.html 200' dist/_redirects
          echo "Mall static build, first-touch attribution, discovery and order quote client verified"

      - name: Validate all Mall D1 migrations locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          for migration in sorted(Path('api/migrations').glob('*.sql')):
              db.executescript(migration.read_text(encoding='utf-8'))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'seller_profiles','memberships','stores','products','attribution_tokens','product_events','share_links','orders','order_payments','settlement_ledger','attribution_visits','commerce_events'}
          missing = required - tables
          if missing:
              raise SystemExit(f'Missing Mall tables: {sorted(missing)}')
          print('Mall migrations verified:', ', '.join(sorted(required)))
          PY

      - name: Check Development Cloudflare credentials
        id: development_cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Development Cloudflare credential is not configured; staging deployment is skipped."
          fi

      - name: Check Production Cloudflare credentials
        id: production_cloudflare_credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production Cloudflare credentials are not configured; production deployment is skipped."
          fi

  staging:
    needs: validate
    if: needs.validate.outputs.development_cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: development
    defaults:
      run:
        working-directory: sites/ekodi-mall
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "46aad4738793fbaca88574832a2ccc0f"
      STAGING_URL: "https://ekodi-mall-api-staging.ekodi-development.workers.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Development boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "46aad4738793fbaca88574832a2ccc0f"
          case "$STAGING_URL" in
            https://*.ekodi-development.workers.dev) ;;
            *) echo "Invalid Development staging URL" >&2; exit 1 ;;
          esac

      - name: Generate one-time transaction rehearsal token
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "TRANSACTION_REHEARSAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Resolve or create isolated staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-mall-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating isolated ekodi-mall-staging D1 database in Development APAC"
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-mall-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build staging Worker config
        shell: bash
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          OPS_EMAILS=$(node -e "const fs=require('fs');const s=fs.readFileSync('api/wrangler.toml','utf8');const m=s.match(/^MALL_OPERATIONS_EMAILS\s*=\s*\"([^\"]+)\"/m);if(!m)process.exit(2);process.stdout.write(m[1])")
          test -n "$OPS_EMAILS"
          cat > api/wrangler.staging.runtime.toml <<EOF
          name = "ekodi-mall-api-staging"
          main = "entry.js"
          compatibility_date = "2026-08-14"
          workers_dev = true
          preview_urls = false

          [vars]
          ENVIRONMENT = "staging"
          MALL_BASE_URL = "https://ekodi.kr/ekodibiz/mall"
          ALLOWED_ORIGINS = "https://ekodi.kr,https://ekodi-mall.pages.dev"
          SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
          SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"
          MALL_OPERATIONS_EMAILS = "$OPS_EMAILS"
          PAYMENTS_ENABLED = "false"
          PAYMENT_PROVIDER = "toss"
          TRANSACTION_REHEARSAL_ENABLED = "true"
          TRANSACTION_REHEARSAL_TOKEN = "$TRANSACTION_REHEARSAL_TOKEN"
          SOURCING_AUTO_ORDER_ENABLED = "false"
          BUYER_PII_RELEASE_ENABLED = "false"
          SUPPLIER_FORWARD_ENABLED = "false"
          DOMEMAE_LOOKUP_ENABLED = "false"

          [observability.logs]
          enabled = true
          invocation_logs = true

          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-mall-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF

      - name: Apply staging migrations
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config api/wrangler.staging.runtime.toml

      - name: Deploy staging Mall API
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.staging.runtime.toml

      - name: Ensure narrow staging Access bypasses
        shell: bash
        run: node scripts/ensure-staging-access.mjs

      - name: Verify staging API, schemas and safety gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health_code=$(curl -sS -o /tmp/mall-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "${STAGING_URL}/health" || true)
            fees_code=$(curl -sS -o /tmp/mall-stage-fees.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "${STAGING_URL}/api/public/fees" || true)
            feed_code=$(curl -sS -o /tmp/mall-stage-feed.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "${STAGING_URL}/api/public/products?limit=1" || true)
            if [ "$health_code" = "200" ] && [ "$fees_code" = "200" ] && [ "$feed_code" = "200" ] \
              && grep -Fq '"schemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"orderSchemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"firstTouchSchemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"verificationSchemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"commerceEventSchemaReady":true' /tmp/mall-stage-health.json \
              && grep -Fq '"commerceOsVersion":1' /tmp/mall-stage-health.json \
              && grep -Fq '"environment":"staging"' /tmp/mall-stage-health.json \
              && grep -Fq '"version":3' /tmp/mall-stage-health.json \
              && grep -Fq '"operationsReviewConfigured":true' /tmp/mall-stage-health.json \
              && grep -Fq '"operationsEmailAllowlistConfigured":true' /tmp/mall-stage-health.json \
              && grep -Fq '"transactionRehearsalEnabled":true' /tmp/mall-stage-health.json \
              && grep -Fq '"paymentsEnabled":false' /tmp/mall-stage-health.json \
              && grep -Fq '"paymentProvider":{"id":"toss"' /tmp/mall-stage-health.json \
              && grep -Fq '"adapterImplemented":true' /tmp/mall-stage-health.json \
              && grep -Fq '"payoutExecutionEnabled":false' /tmp/mall-stage-health.json \
              && grep -Fq '"direct":7' /tmp/mall-stage-fees.json \
              && grep -Fq '"marketplace":8' /tmp/mall-stage-fees.json \
              && grep -Fq '"ai":9' /tmp/mall-stage-fees.json \
              && grep -Fq '"attributionWindowDays":7' /tmp/mall-stage-fees.json \
              && grep -Fq '"products":[' /tmp/mall-stage-feed.json; then
              echo "Mall Development staging passed D1, order, first-touch, 7/8/9, feed and disabled-payment/payout checks."
              break
            fi
            if [ "$attempt" = "18" ]; then
              cat /tmp/mall-stage-health.json || true
              cat /tmp/mall-stage-fees.json || true
              cat /tmp/mall-stage-feed.json || true
              exit 1
            fi
            sleep 5
          done

      - name: Run isolated staging transaction rehearsal
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/mall-transaction-rehearsal.json -w '%{http_code}' --connect-timeout 5 --max-time 30 \
              -X POST -H 'content-type: application/json' -H "x-ekodi-rehearsal-token: $TRANSACTION_REHEARSAL_TOKEN" \
              --data "{\"runId\":\"gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"}" \
              "${STAGING_URL}/api/internal/rehearsal/transaction" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Mall rehearsal Access propagation attempt=$attempt status=$code"
            sleep 5
          done
          [ "$code" = "200" ] || { cat /tmp/mall-transaction-rehearsal.json || true; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/mall-transaction-rehearsal.json','utf8'));
          if (!body.ok || body.cleanup !== true) throw new Error('rehearsal did not complete and clean up');
          if (body.proof?.safetyGate?.checkoutReady !== false || !body.proof.safetyGate.blockers.includes('payments-disabled')) throw new Error('disabled-payment safety gate was not proven');
          if (body.proof?.order?.status !== 'paid' || body.proof.order.feeRatePercent !== 10) throw new Error('business order proof failed');
          if (body.proof?.payment?.provider !== 'REHEARSAL' || body.proof.payment.status !== 'DONE') throw new Error('synthetic payment proof failed');
          if (body.proof?.settlement?.status !== 'pending' || body.proof.settlement.count !== 1) throw new Error('settlement idempotence proof failed');
          for (const key of ['order.created','payment.recorded','settlement.prepared']) if (body.proof?.commerceEvents?.[key] !== 1) throw new Error(`commerce event proof failed: ${key}`);
          if (body.proof.realPaymentExecuted !== false || body.proof.payoutExecuted !== false || body.proof.buyerPiiReleased !== false) throw new Error('rehearsal crossed a high-impact boundary');
          console.log('Mall staging transaction rehearsal passed: order -> synthetic payment -> single settlement ledger -> cleanup.');
          NODE

      - name: Verify staging private paths remain Access-protected
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 20 "${STAGING_URL}/api/operations/__access_probe__" || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
            rm -f "$headers"
            safe_location=${location%%\?*}
            echo "Mall staging protected-path probe attempt=$attempt status=$code redirect=${safe_location:-none}"
            if [ "$code" = "302" ] && [[ "$safe_location" == *"cloudflareaccess.com"* ]]; then
              echo "Mall staging non-public paths remain Cloudflare Access-protected."
              exit 0
            fi
            sleep 5
          done
          echo "Non-public Mall staging paths are not protected by Cloudflare Access; refusing promotion." >&2
          exit 1

      - name: Disable staging transaction rehearsal after proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f api/wrangler.staging.runtime.toml ]; then
            echo "Staging runtime config was not created; nothing to disable."
            exit 0
          fi
          sed -i 's/TRANSACTION_REHEARSAL_ENABLED = "true"/TRANSACTION_REHEARSAL_ENABLED = "false"/' api/wrangler.staging.runtime.toml
          sed -i 's/TRANSACTION_REHEARSAL_TOKEN = ".*"/TRANSACTION_REHEARSAL_TOKEN = "disabled"/' api/wrangler.staging.runtime.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.staging.runtime.toml
          for attempt in $(seq 1 12); do
            health_code=$(curl -sS -o /tmp/mall-stage-disabled-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "${STAGING_URL}/health" || true)
            rehearsal_code=$(curl -sS -o /tmp/mall-stage-disabled-rehearsal.json -w '%{http_code}' --connect-timeout 5 --max-time 15 -X POST "${STAGING_URL}/api/internal/rehearsal/transaction" || true)
            if [ "$health_code" = "200" ] && [ "$rehearsal_code" = "404" ] && grep -Fq '"transactionRehearsalEnabled":false' /tmp/mall-stage-disabled-health.json; then
              echo "Mall staging transaction rehearsal is disabled again after proof."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/mall-stage-disabled-health.json || true
          cat /tmp/mall-stage-disabled-rehearsal.json || true
          exit 1

      - name: Cleanup staging config
        if: always()
        run: rm -f api/wrangler.staging.runtime.toml

  production:
    needs: [validate, staging]
    if: github.event_name != 'pull_request' && needs.validate.outputs.production_cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: sites/ekodi-mall
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect production Mall components
        id: production_scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual release remains fail-closed and validates both API/D1 and Pages."
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "Unknown push baseline; releasing both components fail-closed."
            exit 0
          fi
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${before}^{commit}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$before"
          fi
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$before" "$GITHUB_SHA")
          api_changed=false
          site_changed=false
          if printf '%s\n' "$changed" | grep -Eq '^sites/ekodi-mall/api/'; then api_changed=true; fi
          if printf '%s\n' "$changed" | grep -E '^sites/ekodi-mall/' | grep -Ev '^sites/ekodi-mall/api/' | grep -q .; then site_changed=true; fi
          if printf '%s\n' "$changed" | grep -Fxq '.github/workflows/deploy-ekodi-mall.yml'; then site_changed=true; fi
          echo "api_changed=$api_changed" >> "$GITHUB_OUTPUT"
          echo "site_changed=$site_changed" >> "$GITHUB_OUTPUT"
          printf 'Mall production scope: api=%s site=%s\n' "$api_changed" "$site_changed"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Rebuild exact production artifact
        if: steps.production_scope.outputs.site_changed == 'true'
        run: npm run build

      - name: Resolve or create production D1
        if: steps.production_scope.outputs.api_changed == 'true'
        id: mall_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-mall');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating isolated ekodi-mall production D1 database in APAC"
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-mall --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          cp api/wrangler.toml api/wrangler.runtime.toml
          printf '\ndatabase_id = "%s"\n' "$DB_ID" >> api/wrangler.runtime.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply production migrations after staging success
        if: steps.production_scope.outputs.api_changed == 'true'
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config api/wrangler.runtime.toml

      - name: Deploy production Mall API after staging success
        if: steps.production_scope.outputs.api_changed == 'true'
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.runtime.toml

      - name: Verify production API before Pages promotion
        if: steps.production_scope.outputs.api_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health_code=$(curl -sS -o /tmp/mall-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api.ekodi.kr/health || true)
            fees_code=$(curl -sS -o /tmp/mall-fees.json -w '%{http_code}' --connect-timeout 5 --max-time 15 https://mall-api.ekodi.kr/api/public/fees || true)
            feed_code=$(curl -sS -o /tmp/mall-feed.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://mall-api.ekodi.kr/api/public/products?limit=1' || true)
            verification_queue_code=$(curl -sS -o /tmp/mall-verification-unauth.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://mall-api.ekodi.kr/api/internal/verification/queue' || true)
            launch_readiness_code=$(curl -sS -o /tmp/mall-launch-readiness-unauth.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://mall-api.ekodi.kr/api/internal/verification/launch-readiness' || true)
            cockpit_code=$(curl -sS -o /tmp/mall-cockpit-unauth.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://mall-api.ekodi.kr/api/internal/operations/cockpit' || true)
            rehearsal_code=$(curl -sS -o /tmp/mall-production-rehearsal.json -w '%{http_code}' --connect-timeout 5 --max-time 15 -X POST 'https://mall-api.ekodi.kr/api/internal/rehearsal/transaction' || true)
            if [ "$health_code" = "200" ] && [ "$fees_code" = "200" ] && [ "$feed_code" = "200" ] \
              && grep -Fq '"schemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"orderSchemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"firstTouchSchemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"verificationSchemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"commerceEventSchemaReady":true' /tmp/mall-api.json \
              && grep -Fq '"commerceOsVersion":1' /tmp/mall-api.json \
              && grep -Fq '"environment":"production"' /tmp/mall-api.json \
              && grep -Fq '"version":3' /tmp/mall-api.json \
              && grep -Fq '"operationsReviewConfigured":true' /tmp/mall-api.json \
              && grep -Fq '"operationsEmailAllowlistConfigured":true' /tmp/mall-api.json \
              && [ "$verification_queue_code" = "401" ] \
              && [ "$launch_readiness_code" = "401" ] \
              && [ "$cockpit_code" = "401" ] \
              && [ "$rehearsal_code" = "404" ] \
              && grep -Fq '"transactionRehearsalEnabled":false' /tmp/mall-api.json \
              && grep -Fq '"paymentsEnabled":false' /tmp/mall-api.json \
              && grep -Fq '"paymentProvider":{"id":"toss"' /tmp/mall-api.json \
              && grep -Fq '"adapterImplemented":true' /tmp/mall-api.json \
              && grep -Fq '"payoutExecutionEnabled":false' /tmp/mall-api.json \
              && grep -Fq '"direct":7' /tmp/mall-fees.json \
              && grep -Fq '"marketplace":8' /tmp/mall-fees.json \
              && grep -Fq '"ai":9' /tmp/mall-fees.json; then
              echo "Mall production API verified after staging promotion."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/mall-api.json || true
          cat /tmp/mall-fees.json || true
          exit 1

      - name: Record API release scope
        if: steps.production_scope.outputs.api_changed != 'true'
        run: echo "Mall API/D1 unchanged; preserving the verified production API and releasing Pages independently." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production to Cloudflare Pages
        if: steps.production_scope.outputs.site_changed == 'true'
        env:
          CF_PROJECT: ${{ needs.validate.outputs.project }}
        run: npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Smoke test production UI
        if: steps.production_scope.outputs.site_changed == 'true'
        env:
          PUBLIC_URL: ${{ needs.validate.outputs.public_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_URL%/}"
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/mall-root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/" || true)
            seller_code=$(curl -L -sS -o /tmp/mall-seller.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/seller/" || true)
            shared_code=$(curl -L -sS -o /tmp/mall-shared.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/p/not-a-real-product" || true)
            public_js_code=$(curl -L -sS -o /tmp/mall-public-js -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/assets/public-product.js" || true)
            live_js_code=$(curl -L -sS -o /tmp/mall-live-js -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/assets/marketplace-live.js" || true)
            seller_js_code=$(curl -L -sS -o /tmp/mall-seller-js -w '%{http_code}' --connect-timeout 5 --max-time 15 "${BASE}/assets/seller-server.js" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$seller_code" =~ ^[23] ]] && [[ "$shared_code" =~ ^[23] ]] \
              && [ "$public_js_code" = "200" ] && [ "$live_js_code" = "200" ] && [ "$seller_js_code" = "200" ] \
              && grep -Fq 'EKODI MALL' /tmp/mall-root.html \
              && grep -Fq '/assets/marketplace-live.js' /tmp/mall-root.html \
              && grep -Fq 'SERVER READY' /tmp/mall-seller.html \
              && grep -Fq 'PUBLIC PRODUCT' /tmp/mall-shared.html \
              && grep -Fq 'api/public/attribution/visit' /tmp/mall-public-js \
              && grep -Fq 'api/public/checkout/quote' /tmp/mall-public-js \
              && grep -Fq 'api/public/products?limit=24' /tmp/mall-live-js \
              && grep -Fq '/share-links' /tmp/mall-seller-js; then
              echo "EKODI Mall production smoke test passed."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Cleanup production config
        if: always()
        run: rm -f api/wrangler.runtime.toml
