name: Verify Tenant Live Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tenant-live-production-e2e.yml'
      - 'scripts/tenant-live-production-e2e.mjs'
      - 'scripts/church-live-production-e2e.mjs'
      - 'realtime-control.js'
      - 'realtime-tenant-registry.js'
      - 'tenant-live-page.js'
      - 'tenant-live.js'
      - 'tenant-live.css'

permissions:
  contents: read

concurrency:
  group: ekodi-tenant-live-production-e2e
  cancel-in-progress: false

jobs:
  tenant-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Issue short-lived super-admin session
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }
          databases=$(curl -fsS --retry 2 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          auth_db=''; admin_id=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admins','sessions')" || true)
            echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("admins") != null and index("sessions") != null)' >/dev/null 2>&1 || continue
            candidate=$(cf_query "$db" "SELECT id FROM admins WHERE role='super_admin' ORDER BY id LIMIT 1" || true)
            id=$(echo "$candidate" | jq -r '.result[]?.results[0]?.id // empty' | head -1)
            if [[ "$id" =~ ^[0-9]+$ ]]; then auth_db="$db"; admin_id="$id"; break; fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')
          test -n "$auth_db"; test -n "$admin_id"
          token=$(openssl rand -hex 32)
          token_hash=$(printf '%s' "$token" | sha256sum | awk '{print $1}')
          created=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          expires=$(date -u -d '+20 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')
          echo "::add-mask::$token"; echo "::add-mask::$token_hash"
          result=$(cf_query "$auth_db" "INSERT INTO sessions (token_hash,admin_id,expires_at,created_at) VALUES ('$token_hash',$admin_id,'$expires','$created')")
          echo "$result" | jq -e '.success == true and ([.result[]?.success] | all)' >/dev/null
          session=$(curl -fsS --retry 3 'https://ekodi.kr/api/session' -H "Authorization: Bearer $token")
          echo "$session" | jq -e '.authenticated == true and .role == "super_admin"' >/dev/null
          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_TOKEN_HASH=$token_hash" >> "$GITHUB_ENV"
          echo "E2E_AUTH_DB_ID=$auth_db" >> "$GITHUB_ENV"

      - name: Install Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run every common Tenant Live publish and anonymous viewer pull
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS='|' read -r tenant live_url label; do
            [ -n "$tenant" ] || continue
            echo "::group::System Verify $tenant"
            if TENANT_LIVE_TENANT="$tenant" TENANT_LIVE_URL="$live_url" TENANT_LIVE_LABEL="$label" node scripts/tenant-live-production-e2e.mjs; then
              echo "System Verified: $tenant"
            else
              echo "::error::System verification failed: $tenant"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done <<'TENANTS'
          ekodimission|https://ekodi.kr/ekodimission/live/|EKODI Mission
          ekodi-biz|https://ekodi.kr/ekodibiz/live/|EKODI Biz
          ekodi-lab|https://ekodi.kr/ekodilab/live/|EKODI Lab
          cgma|https://ekodi.kr/cgma/live/|CGMA
          mokdaehumun|https://ekodi.kr/mokdaehumun/live/|Mokdae Humun
          jadam|https://ekodi.kr/jadam/live/|Jadam
          pizzamaru|https://ekodi.kr/pizzamaru/live/|Pizzamaru
          yogurt|https://ekodi.kr/yogurt/live/|Yogurt Purple
          ekodimall|https://ekodi.kr/ekodimall/live/|EKODI Mall
          ekoditrade|https://ekodi.kr/ekodibiz/trade/live/|EKODI Trade
          TENANTS
          test "$failures" -eq 0

      - name: Run dedicated Church Live publish and anonymous viewer pull
        if: always() && env.E2E_ADMIN_TOKEN != ''
        run: node scripts/church-live-production-e2e.mjs

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-live-production-e2e
          path: |
            artifacts/tenant-live-production-e2e/*.json
            artifacts/church-live-production-e2e/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Revoke short-lived E2E session
        if: always() && env.E2E_AUTH_DB_ID != '' && env.E2E_TOKEN_HASH != ''
        shell: bash
        run: |
          set -euo pipefail
          sql="DELETE FROM sessions WHERE token_hash = '$E2E_TOKEN_HASH'"
          curl -fsS --retry 2 -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_AUTH_DB_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" \
            | jq -e '.success == true' >/dev/null
          echo 'Short-lived Tenant Live E2E session revoked.'
