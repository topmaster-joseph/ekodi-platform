name: Cleanup Church History Production Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-church-history-production-staging.yml'

permissions:
  contents: read

concurrency:
  group: church-history-production-staging-cleanup
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  LEGACY_WORKER: 'ekodi-church-history-staging'
  DEVELOPMENT_ACCOUNT_ID: '46aad4738793fbaca88574832a2ccc0f'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Production account boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_ACCOUNT_ID" != "$DEVELOPMENT_ACCOUNT_ID"
          test "$LEGACY_WORKER" = 'ekodi-church-history-staging'
      - name: Confirm legacy Worker exists only in Production account
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/legacy-worker-before -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LEGACY_WORKER")
          if [[ "$code" == 404 ]]; then
            echo 'Legacy Production staging Worker is already absent.'
            echo 'ALREADY_ABSENT=1' >> "$GITHUB_ENV"
            exit 0
          fi
          test "$code" == 200
          echo 'ALREADY_ABSENT=0' >> "$GITHUB_ENV"
          npx --yes wrangler@${WRANGLER_VERSION} deployments list --name "$LEGACY_WORKER" --json > /tmp/legacy-deployments.json
          test -s /tmp/legacy-deployments.json
      - name: Dry-run legacy Worker deletion
        if: env.ALREADY_ABSENT != '1'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} delete --name "$LEGACY_WORKER" --dry-run
      - name: Delete legacy Production staging Worker
        if: env.ALREADY_ABSENT != '1'
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | npx --yes wrangler@${WRANGLER_VERSION} delete --name "$LEGACY_WORKER"
      - name: Verify legacy Worker removal and canonical production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            code=$(curl -sS -o /tmp/legacy-worker-after -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LEGACY_WORKER" || true)
            if [[ "$code" == 404 ]]; then break; fi
            if [[ "$attempt" == 8 ]]; then
              echo "Legacy Worker still present: HTTP $code"
              exit 1
            fi
            sleep 3
          done
          public_code=$(curl -L -sS -o /tmp/history-prod.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ekodichurch/history')
          admin_code=$(curl -L -sS -o /tmp/history-prod-admin.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/ekodichurch/admin/history')
          api_code=$(curl -L -sS -o /tmp/history-prod-api.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/api/church/admin/history')
          test "$public_code" == 200
          test "$admin_code" == 200
          test "$api_code" == 401
          grep -Fq '지나온 길' /tmp/history-prod.html
          grep -Fq '지나온 길 기록관리' /tmp/history-prod-admin.html
          echo 'Legacy Production staging Worker removed; canonical Church History production remains healthy.'
