name: Insurance Law Source Watch

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'sites/ekodi-insurance/public/insurance-law-sources.json'
      - 'sites/ekodi-insurance/public/insurance-detail.js'
      - 'sites/ekodi-insurance/check-law-sources.mjs'
      - '.github/workflows/insurance-law-watch.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify-official-law-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: law
        name: Verify official law source markers
        continue-on-error: true
        run: node sites/ekodi-insurance/check-law-sources.mjs
      - name: Open or refresh EKODI law review issue
        if: steps.law.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title='[Insurance Law Watch] 공식 법령 원문 변경 감지';
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(issue=>!issue.pull_request&&issue.title===title);
            const body=[
              'EKODI Insurance의 공식 법령 원문 감시가 변경 또는 접근 이상을 감지했습니다.',
              '',
              '- `sites/ekodi-insurance/public/insurance-law-sources.json`의 공식 출처와 기준값을 재검증하세요.',
              '- 자동차보험 공용 설명이 현행 「자동차손해배상 보장법」 및 시행령과 일치하는지 확인하세요.',
              '- 변경이 확인되면 `ai/` 네임스페이스 브랜치에서 공용 원본 → 다국어 안내 → 테스트 순으로 갱신하세요.',
              '- 보험사별 특약·보험료·긴급출동 등 회사별 조건은 공용 법령 설명과 섞지 마세요.',
              '',
              `감지 워크플로: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            if(existing){await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body});}
            else{await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});}
      - name: Enforce fresh law sources
        if: steps.law.outcome == 'failure'
        run: exit 1
