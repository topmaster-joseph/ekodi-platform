name: EKODI Media Shield · Provision Secrets

# EKODI-MEDIA-SHIELD-001: generates the Media Shield / content-trace secrets inside the
# runner and writes them straight to the Shared Site Worker. Values are never printed,
# never stored in the repository or artifacts, and an existing secret is NEVER replaced
# (rotating EKODI_MEDIA_SHIELD_MASTER_KEY would make already-encrypted media unreadable).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-media-shield-secrets.yml'
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Orchestrator-issued release branch (ai/<agent>/orch_<task-id>) whose receipt authorizes this mutation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-media-shield-secrets
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  SHARED_SITE_WORKER: 'shy-thunder-39a4'

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: EKODI AI Orchestration Gate
        env:
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref }}
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Verify Production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Provision missing secrets (create-only, never rotate)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$SHARED_SITE_WORKER" --format json > /tmp/ms-existing.json
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          const existing = new Set(JSON.parse(readFileSync('/tmp/ms-existing.json', 'utf8')).map(entry => entry.name));
          const wanted = { EKODI_MEDIA_SHIELD_TOKEN_SECRET: 48, EKODI_MEDIA_SHIELD_MASTER_KEY: 64, EKODI_CONTENT_TRACE_SECRET: 48 };
          const create = {};
          for (const [name, bytes] of Object.entries(wanted)) {
            if (!existing.has(name)) create[name] = randomBytes(bytes).toString('base64url');
          }
          writeFileSync('/tmp/ms-create.json', JSON.stringify(create));
          const summary = Object.keys(wanted).map(name => `- ${name}: ${existing.has(name) ? 'already configured (kept)' : 'created'}`).join('\n');
          writeFileSync('/tmp/ms-summary.md', `### EKODI Media Shield secrets\n${summary}\n`);
          NODE
          # Diagnostics (IDs only): Cloudflare refuses secret edits when the latest Worker
          # version is not the one serving 100% (e.g. after an automatic rollback).
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "$SHARED_SITE_WORKER" 2>&1 | grep -E "Version|Created|%" | sed 's/^/deployed: /' || true
          npx --yes wrangler@${WRANGLER_VERSION} versions list --name "$SHARED_SITE_WORKER" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s);const l=v[v.length-1]||v[0];console.log("latest version:",l?.id,l?.metadata?.created_on||"")}catch{console.log("latest version: unavailable")}})' || true
          status=0
          if [ "$(cat /tmp/ms-create.json)" != '{}' ]; then
            # wrangler prints only key names and results for bulk uploads, never values.
            npx --yes wrangler@${WRANGLER_VERSION} secret bulk /tmp/ms-create.json --name "$SHARED_SITE_WORKER" > /tmp/ms-bulk.log 2>&1 || status=$?
            grep -v -F -f <(node -e 'const o=require("/tmp/ms-create.json");console.log(Object.values(o).join("\n"))') /tmp/ms-bulk.log | sed 's/^/wrangler: /' || true
            rm -f /tmp/ms-bulk.log
          fi
          shred -u /tmp/ms-create.json 2>/dev/null || rm -f /tmp/ms-create.json
          echo "wrangler secret bulk exit=$status"
          test "$status" -eq 0
          cat /tmp/ms-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Read back (names only)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} secret list --name "$SHARED_SITE_WORKER" --format json > /tmp/ms-after.json
          node -e 'const l=JSON.parse(require("fs").readFileSync("/tmp/ms-after.json","utf8"));console.log("secret names on worker:",l.length);for(const e of l)if(/MEDIA_SHIELD|CONTENT_TRACE/.test(e.name))console.log(" -",e.name)' || true
          for name in EKODI_MEDIA_SHIELD_TOKEN_SECRET EKODI_MEDIA_SHIELD_MASTER_KEY EKODI_CONTENT_TRACE_SECRET; do
            grep -Fq "\"$name\"" /tmp/ms-after.json || { echo "::error::$name missing after provisioning"; exit 1; }
          done
          rm -f /tmp/ms-after.json /tmp/ms-existing.json
          echo 'Read-back: all three secrets present on the Shared Site Worker (values never printed).' >> "$GITHUB_STEP_SUMMARY"
