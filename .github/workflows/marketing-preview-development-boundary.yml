name: Marketing Preview Development Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/stage-marketing-pages-shell.yml'
      - '.github/workflows/marketing-preview-development-boundary.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-marketing-pages-shell.yml'
      - '.github/workflows/marketing-preview-development-boundary.yml'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Enforce Development-only Marketing preview
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/stage-marketing-pages-shell.yml'
          grep -Fq 'environment: development' "$file"
          grep -Fq 'secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN' "$file"
          grep -Fq '46aad4738793fbaca88574832a2ccc0f' "$file"
          grep -Fq 'ekodi-marketing-pages-shell-staging' "$file"
          grep -Fq 'ekodi-development.workers.dev' "$file"
          grep -Fq 'wrangler@4.127.0 deploy' "$file"
          ! grep -Fq 'secrets.CLOUDFLARE_API_TOKEN' "$file"
          ! grep -Fq 'secrets.CLOUDFLARE_ACCOUNT_ID' "$file"
          ! grep -Fq 'pages deploy' "$file"
          ! grep -Fq 'topmaster-joseph.workers.dev' "$file"
          echo 'Marketing preview boundary passed: Development Worker Static Assets only.'
