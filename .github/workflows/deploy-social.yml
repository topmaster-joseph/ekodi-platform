name: Deploy EKODI Social

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging/social-community-20260814
    paths:
      - 'social/**'
      - 'social-worker.js'
      - 'wrangler.social.toml'
      - 'wrangler.social-staging.toml'
      - '.github/workflows/deploy-social.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-social-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Social source
        run: |
          set -euo pipefail
          node --check social-worker.js
          node --check social/app.js
          node -e "const r=JSON.parse(require('fs').readFileSync('social/channels.json','utf8')); if(!Array.isArray(r.organizations)||!r.organizations.length) process.exit(1); for(const o of r.organizations){if(!o.id||!o.name||!o.website) process.exit(1); for(const c of o.channels||[]){if(c.provider==='youtube'&&!c.channelId) process.exit(1)}}"
          grep -Fq 'EKODI Social' social/index.html
          grep -Fq 'featuredSection' social/index.html
          grep -Fq '에코디커뮤니티' social/channels.json
          grep -Fq 'youtubeRssFallback:true' social-worker.js
          if grep -R -Fq '에코디선교회' social; then echo 'Legacy mission label found in social source'; exit 1; fi

  deploy-staging:
    if: github.ref == 'refs/heads/staging/social-community-20260814'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy isolated staging Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 deploy --config wrangler.social-staging.toml 2>&1 | tee /tmp/social-staging-deploy.log
          staging_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/social-staging-deploy.log | tail -1 || true)
          test -n "$staging_url" || (echo 'Could not resolve staging workers.dev URL' && exit 1)
          echo "STAGING_URL=$staging_url" >> "$GITHUB_ENV"
      - name: Verify staging Social Hub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            root_code=$(curl -L -sS -o /tmp/social.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -o /tmp/social-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            feed_code=$(curl -sS -o /tmp/social-feed.json -w '%{http_code}' --connect-timeout 5 --max-time 20 "$STAGING_URL/api/feed?org=community" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$health_code" == "200" ]] && [[ "$feed_code" == "200" ]] \
              && grep -Fq 'EKODI Social' /tmp/social.html \
              && grep -Fq 'ekodi-social' /tmp/social-health.json \
              && grep -Fq '에코디커뮤니티' /tmp/social-feed.json; then
              echo "EKODI Social staging verified: $STAGING_URL"
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy Social Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.social.toml
      - name: Verify Social production hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/social.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://social.ekodi.kr/' || true)
            health_code=$(curl -sS -o /tmp/social-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://social.ekodi.kr/health' || true)
            feed_code=$(curl -sS -o /tmp/social-feed.json -w '%{http_code}' --connect-timeout 5 --max-time 20 'https://social.ekodi.kr/api/feed?org=community' || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$health_code" == "200" ]] && [[ "$feed_code" == "200" ]] \
              && grep -Fq 'EKODI Social' /tmp/social.html \
              && grep -Fq 'ekodi-social' /tmp/social-health.json \
              && grep -Fq '에코디커뮤니티' /tmp/social-feed.json; then
              echo 'EKODI Social production verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
