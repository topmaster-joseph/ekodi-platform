name: Validate EKODI Service Domains

on:
  workflow_dispatch:
  pull_request:
    paths: &service_domain_paths
      - 'index.html'
      - 'scripts/monitor-lib.mjs'
      - 'ekodi-service-manifest.js'
      - 'config/ekodi-service-urls.json'
      - '.github/workflows/promote-service-domains.yml'
  push:
    branches: [main]
    paths: *service_domain_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject retired service domains and enforce Mall canonical path
        run: |
          set -euo pipefail
          if grep -E 'ekodimall\.kr|ekodibook\.kr|ekodichurch\.kr|ekodilab\.kr' index.html scripts/monitor-lib.mjs; then
            echo 'Retired EKODI service domain remains in source.'
            exit 1
          fi
          grep -Fq "id:'mall',name:'에코디몰',shortName:'Mall',url:'https://ekodi.kr/ekodibiz/mall'" ekodi-service-manifest.js
          grep -Fq 'https://ekodi.kr/ekodibiz/mall' config/ekodi-service-urls.json
          npm run check
          node --test test/business-os-platform.test.mjs test/marketing-domain-policy.test.mjs test/marketing-custom-domain.test.mjs test/cgma-domain-boundary.test.mjs test/ekodibiz-invest-business.test.mjs test/root-entry-routing.test.mjs test/common-service-auth-routing.test.mjs test/ekodi-coupang-mall.test.mjs
      - name: Verify single production owner policy
        run: node scripts/validate-deployment-guardrails.mjs
