name: Configure Marketing Domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-marketing-domains.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Attach canonical Pages custom domains and retire legacy Yogurt alias
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          add_domain() {
            project="$1"
            domain="$2"
            echo "==> $project -> $domain"
            pcode=$(curl -sS -o /tmp/project.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project")
            [ "$pcode" = '200' ] || { cat /tmp/project.json; echo "Project unavailable: $project HTTP $pcode"; return 1; }
            dcode=$(curl -sS -o /tmp/domain.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain")
            if [ "$dcode" = '200' ]; then
              echo "$domain already attached"
              return 0
            fi
            ccode=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "{\"name\":\"$domain\"}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains")
            cat /tmp/create.json
            case "$ccode" in 200|201) ;; *) echo "Attach failed: $domain HTTP $ccode"; return 1;; esac
          }

          remove_domain() {
            project="$1"
            domain="$2"
            code=$(curl -sS -o /tmp/domain-remove.json -w '%{http_code}' -X DELETE "${auth[@]}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain")
            case "$code" in
              200|204|404) echo "$domain legacy Pages alias retired or already absent" ;;
              *) cat /tmp/domain-remove.json; echo "Legacy domain removal failed: $domain HTTP $code"; return 1 ;;
            esac
          }

          add_domain 'cheonggye-market' 'cgma.ekodi.kr'
          add_domain 'marketing-ai' 'marketing.ekodi.kr'
          add_domain 'marketing-ai-jadam' 'jadam.ekodi.kr'
          add_domain 'marketing-ai-pizzamaru' 'pizzamaru.ekodi.kr'
          add_domain 'marketing-ai-yogurtpurple' 'yogurt.ekodi.kr'
          remove_domain 'marketing-ai-yogurtpurple' 'yogurtpurple.ekodi.kr'

      - name: Create canonical EKODI CNAME records and remove legacy Yogurt DNS
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr&account.id=$CF_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          test -n "$zone_id" || { echo 'ekodi.kr zone not found'; exit 1; }

          pages_target() {
            project="$1"
            curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project" | \
              python -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])"
          }

          upsert_cname() {
            name="$1"
            target="$2"
            existing_code=$(curl -sS -o /tmp/existing.json -w '%{http_code}' "${auth[@]}" "$api/zones/$zone_id/dns_records?type=CNAME&name=$name")
            [ "$existing_code" = '200' ] || { cat /tmp/existing.json; echo "DNS lookup failed: HTTP $existing_code"; exit 1; }
            record_id=$(python -c "import json; d=json.load(open('/tmp/existing.json')); print(d['result'][0]['id'] if d.get('result') else '')")
            payload="{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$target\",\"ttl\":1,\"proxied\":true,\"comment\":\"Managed by EKODI Platform\"}"
            if [ -n "$record_id" ]; then
              code=$(curl -sS -o /tmp/dns.json -w '%{http_code}' -X PUT "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records/$record_id")
            else
              code=$(curl -sS -o /tmp/dns.json -w '%{http_code}' -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records")
            fi
            case "$code" in 200|201) ;; *) cat /tmp/dns.json; echo "DNS upsert failed: HTTP $code"; exit 1;; esac
            python -c "import json; d=json.load(open('/tmp/dns.json')); print(d['result']['name'], '->', d['result']['content'])"
          }

          delete_dns_records() {
            name="$1"
            lookup=$(curl -sS -o /tmp/legacy-dns.json -w '%{http_code}' "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$name&per_page=100")
            [ "$lookup" = '200' ] || { cat /tmp/legacy-dns.json; echo "Legacy DNS lookup failed: $name HTTP $lookup"; exit 1; }
            python - <<'PY' > /tmp/legacy-dns-ids
          import json
          for row in json.load(open('/tmp/legacy-dns.json')).get('result') or []:
              print(row['id'])
          PY
            while read -r record_id; do
              [ -n "$record_id" ] || continue
              code=$(curl -sS -o /tmp/legacy-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$record_id")
              case "$code" in 200|204) ;; *) cat /tmp/legacy-delete.json; echo "Legacy DNS delete failed: $name HTTP $code"; exit 1;; esac
            done < /tmp/legacy-dns-ids
            echo "$name legacy DNS retired"
          }

          upsert_cname 'cgma.ekodi.kr' "$(pages_target 'cheonggye-market')"
          upsert_cname 'marketing.ekodi.kr' "$(pages_target 'marketing-ai')"
          upsert_cname 'jadam.ekodi.kr' "$(pages_target 'marketing-ai-jadam')"
          upsert_cname 'pizzamaru.ekodi.kr' "$(pages_target 'marketing-ai-pizzamaru')"
          yogurt_target="$(pages_target 'marketing-ai-yogurtpurple')"
          upsert_cname 'yogurt.ekodi.kr' "$yogurt_target"
          delete_dns_records 'yogurtpurple.ekodi.kr'

      - name: Verify canonical custom domains
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            ok=1
            for spec in \
              'cgma.ekodi.kr:청계면상인회' \
              'marketing.ekodi.kr:마케팅AI' \
              'jadam.ekodi.kr:자담치킨 목포대점' \
              'pizzamaru.ekodi.kr:피자마루 목포대점' \
              'yogurt.ekodi.kr:요거트퍼플 목포대점'; do
              domain="${spec%%:*}"
              needle="${spec#*:}"
              code=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/" || true)
              echo "$domain http=$code"
              if [ "$code" != '200' ] || ! grep -Fq "$needle" /tmp/site.html; then ok=0; fi
            done
            [ "$ok" -eq 1 ] && { echo 'Canonical Marketing domains verified.'; exit 0; }
            sleep 5
          done
          exit 1
