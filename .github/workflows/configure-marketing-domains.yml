name: Configure Marketing Domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-marketing-domains.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Attach managed custom domains
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          add_domain() {
            project="$1"
            domain="$2"
            echo "==> $project -> $domain"
            pcode=$(curl -sS -o /tmp/project.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project")
            [ "$pcode" = '200' ] || { cat /tmp/project.json; echo "Project unavailable: $project HTTP $pcode"; return 1; }
            dcode=$(curl -sS -o /tmp/domain.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain")
            if [ "$dcode" = '200' ]; then
              echo "$domain already attached"
              return 0
            fi
            ccode=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "{\"name\":\"$domain\"}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains")
            cat /tmp/create.json
            case "$ccode" in 200|201) ;; *) echo "Attach failed: $domain HTTP $ccode"; return 1;; esac
          }

          add_domain 'cheonggye-market' 'cgma.ekodi.kr'
          # marketing-ai is created/deployed by Deploy Marketing AI; attach when available.
          if curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/marketing-ai" >/dev/null 2>&1; then
            add_domain 'marketing-ai' 'marketing.ekodi.kr'
          else
            echo 'marketing-ai Pages project not created yet; deploy workflow will attach marketing.ekodi.kr.'
          fi

      - name: Verify cgma.ekodi.kr
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          for attempt in $(seq 1 20); do
            result=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/cheonggye-market/domains/cgma.ekodi.kr" || true)
            status=$(printf '%s' "$result" | python -c "import sys,json; s=sys.stdin.read(); d=json.loads(s) if s else {}; print((d.get('result') or {}).get('status','unknown'))" 2>/dev/null || echo unknown)
            code=$(curl -L -sS -o /tmp/cgma.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://cgma.ekodi.kr/' || true)
            echo "attempt=$attempt status=$status http=$code"
            if [ "$code" = '200' ] && grep -Fq '청계면상인회' /tmp/cgma.html; then
              echo 'CGMA custom domain verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'CGMA custom-domain verification is still pending.'
          exit 1
