name: Import Seonammedi Campaign Hero
on:
  push:
    branches:
      - feat/seonammedi-home-hero-20261013-1608
    paths:
      - .github/workflows/seonammedi-campaign-hero-import.yml
permissions:
  contents: write
jobs:
  import-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify user-supplied artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sites/seonammedi/public/assets
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IgFYuI0BG12rOdEtYmFORAqXKR/2ffaac37-46b6-4fd3-9dea-ad5c25e26abf.png' \
            -o sites/seonammedi/public/assets/campaign-reconsideration-20261013.png
          printf '3d30b3faa1db1eeb075a4af8b25887000204ebb26c92f6640c5d70be7205c324  sites/seonammedi/public/assets/campaign-reconsideration-20261013.png\n' | sha256sum --check --status
          file sites/seonammedi/public/assets/campaign-reconsideration-20261013.png
      - name: Add original hero file to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/seonammedi/public/assets/campaign-reconsideration-20261013.png
          if git diff --cached --quiet; then
            echo "Image already committed."
          else
            git commit -m "assets(seonammedi): import campaign hero artwork"
            git push origin HEAD:feat/seonammedi-home-hero-20261013-1608
          fi
