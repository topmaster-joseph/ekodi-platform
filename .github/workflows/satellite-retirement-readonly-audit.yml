name: EKODI Satellite Source and Retirement Read-Only Evidence

# Observation is not deployment approval or deletion authorization. This workflow
# only reads the canonical registry and fixed public source-release markers.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/satellite-retirement-readonly-audit.yml'
      - 'config/site-repository-retirement-readiness.json'
      - 'config/repository-source-of-truth.json'
      - 'scripts/audit-satellite-live-source-markers.mjs'
      - 'scripts/inspect-satellite-repository-retirement.mjs'
      - 'scripts/audit-fleet-source-release-topology.mjs'
      - 'scripts/build-satellite-retirement-watch-report.mjs'
      - 'test/satellite-retirement-watch-report.test.mjs'

permissions:
  contents: read

concurrency:
  group: satellite-retirement-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact protected source without persisted Git credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js for reproducible evidence
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove offline public audit and retirement guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test \
            test/satellite-retirement-watch-report.test.mjs \
            test/satellite-live-source-markers.test.mjs \
            test/satellite-repository-retirement.test.mjs
      - name: Capture static registry and independent release-unit boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/satellite-retirement-readonly"
          node scripts/inspect-satellite-repository-retirement.mjs \
            > "$RUNNER_TEMP/satellite-retirement-readonly/retirement.json"
          node scripts/audit-fleet-source-release-topology.mjs \
            > "$RUNNER_TEMP/satellite-retirement-readonly/topology.json"
      - name: Observe only fixed public Church and Lab release markers
        run: |
          set -euo pipefail
          # The CLI returns nonzero when Church is still legacy. That is an
          # expected observation, not permission to bypass release or delete.
          set +e
          node scripts/audit-satellite-live-source-markers.mjs \
            > "$RUNNER_TEMP/satellite-retirement-readonly/live-markers.json"
          audit_result=$?
          set -e
          if test "$audit_result" -ne 0; then
            echo '::warning::One or more public markers are legacy/unavailable. See the retained report; no release or deletion was attempted.'
          fi
      - name: Build fail-closed six-repository observation report
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/satellite-retirement-readonly"
          node scripts/build-satellite-retirement-watch-report.mjs \
            "$evidence_dir/retirement.json" "$evidence_dir/live-markers.json" \
            > "$evidence_dir/report.json"
          node scripts/build-satellite-retirement-watch-report.mjs \
            "$evidence_dir/retirement.json" "$evidence_dir/live-markers.json" --markdown \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain public read-only source evidence without provider secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-satellite-retirement-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/satellite-retirement-readonly/
          if-no-files-found: warn
          retention-days: 14
