name: EKODI Reliability Validation

on:
  workflow_call:
    inputs:
      suite:
        description: Reliability suite to execute
        required: false
        type: string
        default: release
      observed_peak_rps:
        description: Optional observed peak RPS used to scale the test profile
        required: false
        type: string
        default: '0'
  workflow_dispatch:
    inputs:
      suite:
        description: Reliability suite
        required: true
        type: choice
        default: release
        options:
          - release
          - synthetic
          - stress
          - soak
      observed_peak_rps:
        description: Optional observed peak RPS (0 uses policy defaults)
        required: false
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: ekodi-reliability-${{ github.run_id }}
  cancel-in-progress: false

env:
  STAGING_URL: https://ekodi-shared-site-staging.ekodi-development.workers.dev

jobs:
  contract:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate reliability policy and guardrails
        run: |
          set -euo pipefail
          node --check scripts/reliability-validation-lib.mjs
          node --check scripts/run-reliability-validation.mjs
          node scripts/run-reliability-validation.mjs --validate-only
          node --check scripts/verify-reliability-release-evidence.mjs
          node --test test/reliability-validation.test.mjs test/reliability-release-proof-contract.test.mjs test/verify-reliability-release-evidence.test.mjs

  staging-release:
    if: inputs.suite == 'release'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Baseline traffic validation
        env:
          OBSERVED_RPS: ${{ inputs.observed_peak_rps || vars.EKODI_OBSERVED_PEAK_RPS || '0' }}
        run: node scripts/run-reliability-validation.mjs --target="$STAGING_URL" --profile=baseline --observed-rps="$OBSERVED_RPS" --output=reliability-baseline.json
      - name: Spike traffic validation
        env:
          OBSERVED_RPS: ${{ inputs.observed_peak_rps || vars.EKODI_OBSERVED_PEAK_RPS || '0' }}
        run: node scripts/run-reliability-validation.mjs --target="$STAGING_URL" --profile=spike --observed-rps="$OBSERVED_RPS" --output=reliability-spike.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reliability-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: reliability-*.json
          if-no-files-found: ignore
          retention-days: 14

  staging-manual:
    # In the release suite, this is an independent proof of the actual
    # baseline/spike artifacts, not a skipped manual-only matrix job.
    # No additional requests hit the staging service or Cloudflare.
    needs: [contract, staging-release]
    if: >-
      always() && needs.contract.result == 'success' &&
      ((inputs.suite == 'release' && needs['staging-release'].result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.suite != 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retrieve same-run baseline and spike results
        if: inputs.suite == 'release'
        uses: actions/download-artifact@v7
        with:
          name: reliability-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: reliability-proof
      - name: Independently verify guarded release reliability evidence
        if: inputs.suite == 'release'
        run: node scripts/verify-reliability-release-evidence.mjs --directory=reliability-proof
      - name: Run explicitly selected staging profile
        if: inputs.suite != 'release'
        env:
          OBSERVED_RPS: ${{ inputs.observed_peak_rps || vars.EKODI_OBSERVED_PEAK_RPS || '0' }}
        run: node scripts/run-reliability-validation.mjs --target="$STAGING_URL" --profile="${{ inputs.suite }}" --observed-rps="$OBSERVED_RPS" --manual=true --output=reliability-manual.json
      - uses: actions/upload-artifact@v7
        if: inputs.suite != 'release' && always()
        with:
          name: reliability-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: reliability-manual.json
          if-no-files-found: ignore
          retention-days: 14
