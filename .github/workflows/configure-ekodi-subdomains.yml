name: Configure EKODI Subdomains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-ekodi-subdomains.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Attach Pages custom domains
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          add_domain() {
            project="$1"
            domain="$2"
            echo "==> $project -> $domain"

            project_code=$(curl -sS -o /tmp/project.json -w '%{http_code}' "${auth[@]}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project")
            if [ "$project_code" != "200" ]; then
              echo "Pages project '$project' not accessible (HTTP $project_code)"
              cat /tmp/project.json
              return 1
            fi

            domain_code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' "${auth[@]}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain")
            if [ "$domain_code" = "200" ]; then
              echo "$domain already attached"
              cat /tmp/domain.json
              return 0
            fi

            create_code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "{\"name\":\"$domain\"}" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains")
            cat /tmp/create.json
            if [ "$create_code" != "200" ] && [ "$create_code" != "201" ]; then
              echo "Failed to attach $domain to $project (HTTP $create_code)"
              return 1
            fi
          }

          add_domain "ekodi-church" "church.ekodi.kr"
          add_domain "ekodilab" "lab.ekodi.kr"

      - name: Verify configured Pages domains
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          for spec in "ekodi-church:church.ekodi.kr" "ekodilab:lab.ekodi.kr"; do
            project="${spec%%:*}"
            domain="${spec#*:}"
            echo "==> $domain"
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain"
            echo
          done

      - name: Note reserved EKODI addresses
        run: |
          echo 'Active/attached in this workflow: church.ekodi.kr, lab.ekodi.kr'
          echo 'Mall canonical URL: https://ekodi.kr/mall'
          echo 'Already managed by Wrangler: books.ekodi.kr'
          echo 'Reserved for service deployment: biz.ekodi.kr, trade.ekodi.kr, ins.ekodi.kr, pay.ekodi.kr, mission.ekodi.kr, community.ekodi.kr, edu.ekodi.kr, media.ekodi.kr, event.ekodi.kr, give.ekodi.kr, admin.ekodi.kr, api.ekodi.kr'
