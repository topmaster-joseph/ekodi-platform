name: Diagnose Cloudflare Token Capability

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-cloudflare-token-capability.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect token capability without changing Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const base = 'https://api.cloudflare.com/client/v4';
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };

          async function req(label, path) {
            const response = await fetch(base + path, { headers });
            const body = await response.json().catch(() => ({}));
            const msg = body?.errors?.[0]?.message || '';
            console.log(`${label}: http=${response.status} success=${body?.success === true}${msg ? ` error=${msg.slice(0,120)}` : ''}`);
            return { response, body };
          }

          const verify = await req('account_verify', `/accounts/${account}/tokens/verify`);
          const tokenId = verify.body?.result?.id || '';
          console.log(`token_active=${Boolean(tokenId)} token_id_tail=${tokenId ? tokenId.slice(-6) : 'none'}`);
          if (!tokenId) process.exit(2);

          const details = await req('account_token_details', `/accounts/${account}/tokens/${tokenId}`);
          const groups = await req('account_permission_groups', `/accounts/${account}/tokens/permission_groups`);
          const tokenData = details.body?.result || {};
          const policies = Array.isArray(tokenData.policies) ? tokenData.policies : [];
          console.log(`token_name=${String(tokenData.name || '').slice(0,80)} policy_count=${policies.length}`);
          for (const [index, policy] of policies.entries()) {
            const names = (policy.permission_groups || []).map(group => group.name || group.id).join(' | ');
            const resources = Object.keys(policy.resources || {}).join(' | ');
            console.log(`policy_${index + 1}_permissions=${names}`);
            console.log(`policy_${index + 1}_resources=${resources}`);
          }

          const permissionGroups = Array.isArray(groups.body?.result) ? groups.body.result : [];
          const interesting = permissionGroups.filter(group => /analytics read|api tokens (write|edit|read)/i.test(String(group.name || '')));
          for (const group of interesting) {
            console.log(`permission_group name=${group.name} id=${group.id} scope=${group.scopes?.join(',') || group.scope || group.meta?.scope || 'unknown'}`);
          }

          const hasTokenWrite = policies.some(policy => (policy.permission_groups || []).some(group => /account api tokens (write|edit)/i.test(String(group.name || ''))));
          const hasAnalyticsRead = policies.some(policy => (policy.permission_groups || []).some(group => /analytics read/i.test(String(group.name || ''))));
          console.log(`has_account_token_write=${hasTokenWrite}`);
          console.log(`has_analytics_read=${hasAnalyticsRead}`);
          NODE
