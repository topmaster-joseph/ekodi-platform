name: Verify Conversation Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-conversation-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Workspace Conversation health
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/workspace.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://workspace-api.ekodi.kr/health')
          [[ "$code" == '200' ]]
          cat /tmp/workspace.json
          grep -Fq '"schemaReady":true' /tmp/workspace.json
          grep -Fq '"mutations":true' /tmp/workspace.json
          grep -Fq '"conversationFoundation":"v2"' /tmp/workspace.json
          grep -Fq '"eventOutbox":true' /tmp/workspace.json
          grep -Fq '"conversationSchemaReady":true' /tmp/workspace.json
      - name: Verify Control Operator boundary
        run: |
          set -euo pipefail
          health=$(curl -sS -o /tmp/control.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://api.ekodi.kr/health')
          inbox=$(curl -sS -o /tmp/inbox.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://api.ekodi.kr/api/control/messenger/inbox')
          [[ "$health" == '200' ]]
          [[ "$inbox" == '401' ]]
          cat /tmp/control.json
          cat /tmp/inbox.json
      - name: Diagnose and verify Messenger UI and async client
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          root=$(curl -sS -D /tmp/headers -o /tmp/root.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://messenger.ekodi.kr/?verify=$stamp")
          app=$(curl -sS -D /tmp/app-headers -o /tmp/app.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://messenger.ekodi.kr/app.js?verify=$stamp")
          echo "root_status=$root app_status=$app"
          for marker in 'EKODI Messenger'; do
            if grep -Fq "$marker" /tmp/root.html; then echo "ROOT_MARKER_OK: $marker"; else echo "ROOT_MARKER_MISSING: $marker"; fi
          done
          for marker in 'refreshAssistantUntilSettled' 'EKODI AI' '담당자 연결 대기' 'https://workspace-api.ekodi.kr'; do
            if grep -Fq "$marker" /tmp/app.js; then echo "APP_MARKER_OK: $marker"; else echo "APP_MARKER_MISSING: $marker"; fi
          done
          if grep -Fiq 'x-ekodi-shell: v1' /tmp/headers; then echo 'SHELL_HEADER_OK'; else echo 'SHELL_HEADER_MISSING'; fi
          echo '--- root headers ---'
          cat /tmp/headers
          echo '--- app headers ---'
          cat /tmp/app-headers
          [[ "$root" == '200' && "$app" == '200' ]]
          grep -Fq 'EKODI Messenger' /tmp/root.html
          grep -Fq 'refreshAssistantUntilSettled' /tmp/app.js
          grep -Fq 'EKODI AI' /tmp/app.js
          grep -Fq '담당자 연결 대기' /tmp/app.js
          grep -Fq 'https://workspace-api.ekodi.kr' /tmp/app.js
          grep -Fiq 'x-ekodi-shell: v1' /tmp/headers
