name: EKODI Merged Release Recovery Preflight
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged commit SHA
        required: true
        type: string
      orchestrator_branch:
        description: Official orchestrator-issued branch (ai/agent/orch_task)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate merged SHA and canonical release receipt
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ORCHESTRATOR_BRANCH: ${{ inputs.orchestrator_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preflight-merged-release.mjs
      - name: Next authorized stage
        if: success()
        run: echo "Preflight passed. Use existing guarded staging/release workflow; this job does not deploy or issue a receipt." >> "$GITHUB_STEP_SUMMARY"
