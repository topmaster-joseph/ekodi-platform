name: EKODI Jubilee Protected Private Infrastructure Inventory
# Read-only publisher-private R2/D1/Worker inventory; no manuscript data.
on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Verified orchestrator branch for this protected read'
        required: true
        type: string
      release_task_id:
        description: 'Verified orchestrator task ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ekodi-jubilee-infra-readonly
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref }}
      EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Read-only Cloudflare resource inventory
        run: node scripts/audit-jubilee-publisher-infra.mjs
      - name: Confirm public Publishing remains isolated
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 14 https://ekodi.kr/publishing/api/workflow/health |
            node -e 'let b=""; process.stdin.on("data",c=>b+=c).on("end",()=>{let x=JSON.parse(b);if(!x.ok||!x.dbConfigured||x.saleActivationEnabled!==false)process.exit(1);console.log("PUBLIC_PUBLISHING_HEALTH_OK_SALES_DISABLED")})'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' --max-time 14 https://ekodi.kr/publishing/api/workflow/jubilee/register)
          test "$code" = "401"
          echo 'PUBLIC_UNAUTHENTICATED_JUBILEE_WRITE_401'
