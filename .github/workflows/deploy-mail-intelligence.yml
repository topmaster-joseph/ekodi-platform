name: Deploy Mail Intelligence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mail-intelligence-core.js'
      - 'mail-intelligence-worker.js'
      - 'wrangler.mail.toml'
      - 'migrations/0048_mail_intelligence.sql'
      - 'test/mail-intelligence.test.mjs'
      - '.github/workflows/deploy-mail-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'mail-intelligence-core.js'
      - 'mail-intelligence-worker.js'
      - 'wrangler.mail.toml'
      - 'migrations/0048_mail_intelligence.sql'
      - 'test/mail-intelligence.test.mjs'
      - '.github/workflows/deploy-mail-intelligence.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-mail-intelligence-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.127.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate mail intelligence
        run: |
          node --check mail-intelligence-core.js
          node --check mail-intelligence-worker.js
          node --test test/mail-intelligence.test.mjs
          grep -Fq 'crons = ["*/10 * * * *"]' wrangler.mail.toml
          grep -Fq 'database_name = "ekodi-auth"' wrangler.mail.toml
          ! grep -Eq '(GMAIL_CLIENT_SECRET|GMAIL_REFRESH_TOKEN)\s*=\s*"[^"#]+' wrangler.mail.toml

  production:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply additive D1 migration
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config wrangler.mail.toml
      - name: Deploy Mail Intelligence Worker
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.mail.toml
      - name: Configure Gmail secrets when repository secrets exist
        env:
          GMAIL_CLIENT_ID: ${{ secrets.EKODI_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.EKODI_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.EKODI_GMAIL_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          put_secret() { printf '%s' "$2" | npx --yes wrangler@${WRANGLER_VERSION} secret put "$1" --config wrangler.mail.toml >/dev/null; }
          if [ -n "${GMAIL_CLIENT_ID:-}" ]; then put_secret GMAIL_CLIENT_ID "$GMAIL_CLIENT_ID"; fi
          if [ -n "${GMAIL_CLIENT_SECRET:-}" ]; then put_secret GMAIL_CLIENT_SECRET "$GMAIL_CLIENT_SECRET"; fi
          if [ -n "${GMAIL_REFRESH_TOKEN:-}" ]; then put_secret GMAIL_REFRESH_TOKEN "$GMAIL_REFRESH_TOKEN"; fi
      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --connect-timeout 5 --max-time 12 'https://mailops.ekodi.kr/health' || true)
            if printf '%s' "$body" | grep -q '"ok":true'; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          exit 1
