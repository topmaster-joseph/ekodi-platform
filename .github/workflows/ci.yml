name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitor-status.json'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check
      - name: Validate AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - run: npm test
