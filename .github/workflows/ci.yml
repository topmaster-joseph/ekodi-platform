name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitor-status.json'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/deploy-control-api.yml \
            .github/workflows/backup-ekodi-core.yml \
            .github/workflows/verify-ekodi-core-completion.yml \
            .github/workflows/release-messenger-investment-functional.yml \
            .github/workflows/release-invest-personalization.yml \
            .github/workflows/cloud-control-workers-builds.yml
      - name: Enforce traffic-ready data plane
        run: |
          node --check data-plane.js
          node --check data-plane-adapters.js
          node --test test/data-plane.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Validate AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Compare application tests with PR base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          npm test 2>&1 | tee test-output-head.txt
          head_status=${PIPESTATUS[0]}
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/ekodi-pr-base "$BASE_SHA"
          (cd /tmp/ekodi-pr-base && npm test) 2>&1 | tee test-output-base.txt
          base_status=${PIPESTATUS[0]}
          printf 'head_status=%s\nbase_status=%s\n' "$head_status" "$base_status" | tee test-status.txt
          exit "$head_status"
      - name: Run application tests
        if: github.event_name != 'pull_request'
        run: npm test
      - name: Preserve baseline comparison diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: admin-baseline-test-output
          path: |
            test-output-head.txt
            test-output-base.txt
            test-status.txt
          retention-days: 1
