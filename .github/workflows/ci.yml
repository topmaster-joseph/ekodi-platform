name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitor-status.json'
  pull_request:

permissions:
  contents: read

jobs:
  orchestration-gate:
    name: CI Orchestration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate canonical orchestration contract
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_DEVELOPMENT_POLICY.md
          test -s config/ai-development-completion-policy.json
          test -s scripts/validate-ai-development-completion-policy.mjs
          test -s scripts/ekodi-task-start.mjs
          node --check scripts/ekodi-task-start.mjs
          node --check scripts/validate-ai-development-completion-policy.mjs
          node scripts/validate-ai-development-completion-policy.mjs
      - name: Enforce guarded production path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'central pipeline' AI_DEVELOPMENT_POLICY.md
          grep -q 'guarded deployment workflow' AI_DEVELOPMENT_POLICY.md
          grep -q 'not proof of production completion' AI_DEVELOPMENT_POLICY.md

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/deploy-control-api.yml \
            .github/workflows/backup-ekodi-core.yml \
            .github/workflows/verify-ekodi-core-completion.yml \
            .github/workflows/release-messenger-investment-functional.yml \
            .github/workflows/release-invest-personalization.yml \
            .github/workflows/cloud-control-workers-builds.yml \
            .github/workflows/redeploy-control-on-central-core.yml \
            .github/workflows/github-governance-audit.yml \
            .github/workflows/reliability-validation.yml
      - name: Enforce traffic-ready data plane
        run: |
          node --check data-plane.js
          node --check data-plane-adapters.js
          node --test test/data-plane.test.mjs
      - name: Validate traffic-aware reliability gate
        run: |
          node --check scripts/reliability-validation-lib.mjs
          node --check scripts/run-reliability-validation.mjs
          node scripts/run-reliability-validation.mjs --validate-only
          node --test test/reliability-validation.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Validate AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Run full tests with PR regression gate
        if: github.event_name == 'pull_request'
        run: node scripts/test-no-regression.mjs
      - name: Run full tests on main
        if: github.event_name != 'pull_request'
        run: npm test


  final-production-orchestrator-proof:
    name: Final production orchestrator proof
    if: github.event_name == 'pull_request' && github.head_ref == 'ai/chatgpt/final-workers-ai-production-proof-20260918'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EKODI_ORIGIN: https://ekodi.kr
    steps:
      - name: Dispatch guarded Shared Site production release
        shell: bash
        run: |
          set -euo pipefail
          started_epoch=$(date -u +%s)
          echo "STARTED_EPOCH=$started_epoch" >> "$GITHUB_ENV"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-site-core.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.out || true
          test "$code" = "204"

      - name: Wait for Shared Site production success
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(curl -fsS --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-site-core.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
              | jq -r --argjson started "$STARTED_EPOCH" '.workflow_runs | map(select((.created_at|fromdateiso8601) >= $started)) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "SITE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          for attempt in $(seq 1 120); do
            payload=$(curl -fsS --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(echo "$payload" | jq -r '.status')
            conclusion=$(echo "$payload" | jq -r '.conclusion // empty')
            echo "shared-site run=$run_id status=$status conclusion=$conclusion attempt=$attempt"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Verify live connect auth handoff
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-redirs 0 "$EKODI_ORIGIN/connect")
          test "$code" = "302"
          grep -qi '^location: https://ekodi.kr/auth/?site=ai&return_to=https%3A%2F%2Fekodi.kr%2Fai%2F&source=mcp-connect' "$headers"
          grep -qi '^x-ekodi-route: mcp-connect-auth' "$headers"

      - name: Issue short-lived genuine production admin session
        shell: bash
        run: |
          set -euo pipefail
          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 --retry-delay 1 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }
          databases=$(curl -fsS --retry 2 --retry-delay 1 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          auth_db=''
          admin_id=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admins','sessions')" || true)
            if ! echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("admins") != null and index("sessions") != null)' >/dev/null 2>&1; then
              continue
            fi
            candidate=$(cf_query "$db" "SELECT id FROM admins WHERE role='super_admin' ORDER BY id LIMIT 1" || true)
            id=$(echo "$candidate" | jq -r '.result[]?.results[0]?.id // empty' | head -1)
            if [[ "$id" =~ ^[0-9]+$ ]]; then auth_db="$db"; admin_id="$id"; break; fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')
          test -n "$auth_db"
          test -n "$admin_id"
          token=$(openssl rand -hex 32)
          token_hash=$(printf '%s' "$token" | sha256sum | awk '{print $1}')
          created=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          expires=$(date -u -d '+20 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')
          echo "::add-mask::$token"
          echo "::add-mask::$token_hash"
          cf_query "$auth_db" "INSERT INTO sessions (token_hash, admin_id, expires_at, created_at) VALUES ('$token_hash', $admin_id, '$expires', '$created')" \
            | jq -e '.success == true' >/dev/null
          session=$(curl -fsS "$EKODI_ORIGIN/api/session" -H "Authorization: Bearer $token")
          echo "$session" | jq -e '.authenticated == true and .role == "super_admin"' >/dev/null
          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_TOKEN_HASH=$token_hash" >> "$GITHUB_ENV"
          echo "E2E_AUTH_DB_ID=$auth_db" >> "$GITHUB_ENV"

      - name: Refuse to consume unrelated queued tasks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            queued=$(curl -fsS "$EKODI_ORIGIN/api/control/ai/v8/tasks?state=queued&limit=5" \
              -H "Authorization: Bearer $E2E_ADMIN_TOKEN")
            count=$(echo "$queued" | jq '.tasks | length')
            if [ "$count" -eq 0 ]; then exit 0; fi
            echo "waiting for normal scheduler to clear $count queued task(s)"
            sleep 5
          done
          echo "Refusing to consume unrelated production queue."
          exit 1

      - name: Submit real read-only production Orchestrator task
        shell: bash
        run: |
          set -euo pipefail
          task_id="proof_workers_ai_$GITHUB_RUN_ID_$GITHUB_RUN_ATTEMPT"
          pulse_id="pulse_$task_id"
          goal='Read-only production orchestration proof. Assess current EKODI platform health at a high level and return concise structured findings. Do not deploy, modify business data, change permissions, DNS, secrets, purchases, or irreversible state.'
          payload=$(jq -nc \
            --arg taskId "$task_id" \
            --arg pulseId "$pulse_id" \
            --arg goal "$goal" \
            '{
              taskId:$taskId,
              goal:$goal,
              risk:"low",
              target:{service:"core",capability:"platform_health",surface:"admin"},
              delegation:{allowed:true,reversible:true,audited:true,preflightVerified:true,verificationDefined:true},
              context:{proof:"workers-ai-production-e2e",externalTestClient:"github-actions",productionMutationAllowed:false},
              event:{id:$pulseId,kind:"manual_goal",source:"github-actions-production-proof",summary:$goal,changeClass:"green",actionable:true,requiresHumanDecision:false},
              executeNow:true
            }')
          response=$(curl -fsS --retry 2 --retry-delay 1 \
            -X POST "$EKODI_ORIGIN/api/control/ai/v8/pulse" \
            -H "Authorization: Bearer $E2E_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload")
          echo "$response" | jq -e '.ok == true and .queued == true' >/dev/null
          echo "TASK_ID=$task_id" >> "$GITHUB_ENV"
          echo "Submitted task: $task_id"

      - name: Prove Workers AI result and durable D1 evidence
        shell: bash
        run: |
          set -euo pipefail
          terminal=''
          for attempt in $(seq 1 45); do
            response=$(curl -fsS "$EKODI_ORIGIN/api/control/ai/v8/tasks/$TASK_ID" \
              -H "Authorization: Bearer $E2E_ADMIN_TOKEN")
            state=$(echo "$response" | jq -r '.task.state // empty')
            echo "task=$TASK_ID state=$state attempt=$attempt"
            case "$state" in
              verified|degraded|core_only|failed|human_gate|ignored)
                printf '%s' "$response" > "$RUNNER_TEMP/task.json"
                terminal="$state"
                break
                ;;
            esac
            sleep 4
          done
          test -n "$terminal"
          case "$terminal" in
            verified|degraded) ;;
            *)
              jq '{task:{id:.task.id,state:.task.state,lastError:.task.lastError,evidence:.task.evidence,result:{specialists:[.task.result.specialists[]? | {role,provider,mode,ok}],sentinel:(.task.result.sentinel // null | if .==null then null else {provider,mode,ok} end)}}}' "$RUNNER_TEMP/task.json"
              exit 1
              ;;
          esac
          providers=$(jq -c '[.task.result.specialists[]?.provider,.task.result.sentinel?.provider,.task.result.reverifier?.provider] | map(select(. != null and . != "")) | unique' "$RUNNER_TEMP/task.json")
          echo "$providers" | jq -e 'index("cloudflare-workers-ai") != null' >/dev/null
          diversity=$(jq -r '.task.evidence.providerDiversity // 0' "$RUNNER_TEMP/task.json")
          test "$diversity" -ge 1

          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 --retry-delay 1 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }
          databases=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ledger_db=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('ai_command_tasks','ai_command_runs','ai_provider_daily_budget')" || true)
            if echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("ai_command_tasks") != null and index("ai_command_runs") != null and index("ai_provider_daily_budget") != null)' >/dev/null 2>&1; then
              ledger_db="$db"
              break
            fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')
          test -n "$ledger_db"

          run=$(cf_query "$ledger_db" "SELECT task_id,attempt,state,provider_diversity,sentinel_independent,completed_at FROM ai_command_runs WHERE task_id='$TASK_ID' ORDER BY id DESC LIMIT 1")
          echo "$run" | jq -e '.success == true and (.result[]?.results | length) > 0' >/dev/null
          run_state=$(echo "$run" | jq -r '.result[]?.results[0]?.state // empty' | head -1)
          run_diversity=$(echo "$run" | jq -r '.result[]?.results[0]?.provider_diversity // 0' | head -1)
          completed_at=$(echo "$run" | jq -r '.result[]?.results[0]?.completed_at // empty' | head -1)
          test "$run_diversity" -ge 1
          test -n "$completed_at"

          day=$(date -u +%F)
          budget=$(cf_query "$ledger_db" "SELECT call_count FROM ai_provider_daily_budget WHERE provider_id='cloudflare-workers-ai' AND usage_date='$day' LIMIT 1")
          calls=$(echo "$budget" | jq -r '.result[]?.results[0]?.call_count // 0' | head -1)
          test "$calls" -ge 1
          test "$calls" -le 4

          jq -n \
            --arg taskId "$TASK_ID" \
            --arg terminalState "$terminal" \
            --argjson actualProviders "$providers" \
            --argjson providerDiversity "$diversity" \
            --arg ledgerRunState "$run_state" \
            --argjson ledgerProviderDiversity "$run_diversity" \
            --arg completedAt "$completed_at" \
            --argjson workersAiDailyCalls "$calls" \
            --arg siteRun "$SITE_RUN_ID" \
            '{
              schemaVersion:1,
              proof:"ekodi-orchestrator-workers-ai-production-e2e",
              externalTestClient:"github-actions",
              canonicalIngress:"https://ekodi.kr/api/control/ai/v8/pulse",
              taskId:$taskId,
              terminalState:$terminalState,
              actualProviders:$actualProviders,
              providerDiversity:$providerDiversity,
              durableLedgerVerified:true,
              ledgerRunState:$ledgerRunState,
              ledgerProviderDiversity:$ledgerProviderDiversity,
              workersAiDailyCalls:$workersAiDailyCalls,
              completedAt:$completedAt,
              connectAuthHandoffVerified:true,
              productionSharedSiteRun:$siteRun,
              productionBusinessMutationPerformed:false
            }' | tee "$RUNNER_TEMP/ekodi-workers-ai-proof.json"

      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-workers-ai-final-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ekodi-workers-ai-proof.json
          if-no-files-found: warn
          retention-days: 90

      - name: Revoke short-lived production admin session
        if: always() && env.E2E_AUTH_DB_ID != '' && env.E2E_TOKEN_HASH != ''
        shell: bash
        run: |
          set -euo pipefail
          sql="DELETE FROM sessions WHERE token_hash = '$E2E_TOKEN_HASH'"
          curl -fsS \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_AUTH_DB_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" \
            | jq -e '.success == true' >/dev/null
