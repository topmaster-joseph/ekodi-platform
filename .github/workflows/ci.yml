name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitor-status.json'
  pull_request:

permissions:
  contents: read

jobs:
  orchestration-gate:
    name: CI Orchestration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate canonical orchestration contract
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_DEVELOPMENT_POLICY.md
          test -s config/ai-development-completion-policy.json
          test -s scripts/validate-ai-development-completion-policy.mjs
          test -s scripts/ekodi-task-start.mjs
          node --check scripts/ekodi-task-start.mjs
          node --check scripts/validate-ai-development-completion-policy.mjs
          node scripts/validate-ai-development-completion-policy.mjs
      - name: Enforce guarded production path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'central pipeline' AI_DEVELOPMENT_POLICY.md
          grep -q 'guarded deployment workflow' AI_DEVELOPMENT_POLICY.md
          grep -q 'not proof of production completion' AI_DEVELOPMENT_POLICY.md

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/deploy-control-api.yml \
            .github/workflows/backup-ekodi-core.yml \
            .github/workflows/verify-ekodi-core-completion.yml \
            .github/workflows/release-messenger-investment-functional.yml \
            .github/workflows/release-invest-personalization.yml \
            .github/workflows/cloud-control-workers-builds.yml \
            .github/workflows/redeploy-control-on-central-core.yml \
            .github/workflows/github-governance-audit.yml \
            .github/workflows/reliability-validation.yml
      - name: Enforce traffic-ready data plane
        run: |
          node --check data-plane.js
          node --check data-plane-adapters.js
          node --test test/data-plane.test.mjs
      - name: Validate traffic-aware reliability gate
        run: |
          node --check scripts/reliability-validation-lib.mjs
          node --check scripts/run-reliability-validation.mjs
          node scripts/run-reliability-validation.mjs --validate-only
          node --test test/reliability-validation.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Validate AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Run full tests with PR regression gate
        if: github.event_name == 'pull_request'
        run: node scripts/test-no-regression.mjs
      - name: Run full tests on main
        if: github.event_name != 'pull_request'
        run: npm test


  diagnose-live-orchestrator-task:
    name: Diagnose live orchestrator task
    if: github.event_name == 'pull_request' && github.head_ref == 'ai/chatgpt/dispatch-live-proof-20260918'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TASK_ID: proof_orch_35298337475_1
    steps:
      - name: Read sanitized production ledger and provider health
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 --retry-delay 1 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }

          databases=$(curl -fsS --retry 2 --retry-delay 1 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$databases" | jq -e '.success == true' >/dev/null

          ledger_db=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('ai_command_tasks','ai_command_runs')" || true)
            if echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("ai_command_tasks") != null and index("ai_command_runs") != null)' >/dev/null 2>&1; then
              ledger_db="$db"
              break
            fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')
          test -n "$ledger_db"

          task=$(cf_query "$ledger_db" "SELECT id,state,attempt_count,max_attempts,next_attempt_at,last_error,plan_json,result_json,evidence_json,created_at,updated_at,closed_at FROM ai_command_tasks WHERE id='$TASK_ID' LIMIT 1")
          runs=$(cf_query "$ledger_db" "SELECT attempt,state,provider_diversity,sentinel_independent,result_json,started_at,completed_at FROM ai_command_runs WHERE task_id='$TASK_ID' ORDER BY id ASC")
          providers=$(cf_query "$ledger_db" "SELECT provider_id,enabled,health_status,last_checked_at,last_error FROM ai_provider_registry ORDER BY priority,provider_id" || true)

          echo "$task" | jq -e '.success == true and (.result[]?.results | length) == 1' >/dev/null
          echo "$runs" | jq -e '.success == true and (.result[]?.results | length) >= 1' >/dev/null

          task_row=$(echo "$task" | jq -c '.result[]?.results[0]')
          run_rows=$(echo "$runs" | jq -c '[.result[]?.results[]]')
          provider_rows=$(echo "$providers" | jq -c 'if .success == true then [.result[]?.results[] | {
            providerId:.provider_id,
            enabled:(.enabled == 1),
            health:(.health_status // "unknown"),
            lastCheckedAt:(.last_checked_at // null),
            lastError:(.last_error // "")
          }] else [] end')

          jq -n \
            --arg taskId "$TASK_ID" \
            --argjson task "$task_row" \
            --argjson runs "$run_rows" \
            --argjson providers "$provider_rows" \
            '{
              taskId:$taskId,
              task:{
                state:$task.state,
                attemptCount:$task.attempt_count,
                maxAttempts:$task.max_attempts,
                nextAttemptAt:$task.next_attempt_at,
                lastError:$task.last_error,
                createdAt:$task.created_at,
                updatedAt:$task.updated_at,
                closedAt:$task.closed_at,
                resultState:(($task.result_json|fromjson?).state // null),
                resultError:(($task.result_json|fromjson?).error // null),
                resultReason:(($task.result_json|fromjson?).reason // null),
                assignments:[(($task.result_json|fromjson?).plan.assignments[]? // empty) | {role,provider}],
                specialists:[(($task.result_json|fromjson?).specialists[]? // empty) | {role,provider,mode,ok}],
                sentinel:(($task.result_json|fromjson?).sentinel // null | if . == null then null else {role,provider,mode,ok} end),
                reverifier:(($task.result_json|fromjson?).reverifier // null | if . == null then null else {role,provider,mode,ok} end),
                evidence:{
                  providerDiversity:(($task.evidence_json|fromjson?).providerDiversity // 0),
                  sentinelIndependent:(($task.evidence_json|fromjson?).sentinelIndependent // false),
                  verified:(($task.evidence_json|fromjson?).verified // false),
                  consultationStatus:(($task.evidence_json|fromjson?).consultation.status // null)
                }
              },
              runs:[$runs[] | {
                attempt,
                state,
                providerDiversity:.provider_diversity,
                sentinelIndependent:(.sentinel_independent == 1),
                resultState:((.result_json|fromjson?).state // null),
                resultError:((.result_json|fromjson?).error // null),
                resultReason:((.result_json|fromjson?).reason // null),
                specialists:[((.result_json|fromjson?).specialists[]? // empty) | {role,provider,mode,ok}],
                startedAt:.started_at,
                completedAt:.completed_at
              }],
              providerHealth:$providers
            }' | tee "$RUNNER_TEMP/ekodi-orchestrator-diagnostic.json"

      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-orchestrator-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ekodi-orchestrator-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
