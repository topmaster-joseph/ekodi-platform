name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'monitor-status.json'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes= \
            .github/workflows/ci.yml \
            .github/workflows/deploy-control-api.yml \
            .github/workflows/backup-ekodi-core.yml \
            .github/workflows/verify-ekodi-core-completion.yml \
            .github/workflows/release-messenger-investment-functional.yml \
            .github/workflows/release-invest-personalization.yml \
            .github/workflows/cloud-control-workers-builds.yml \
            .github/workflows/redeploy-control-on-central-core.yml
      - name: Enforce traffic-ready data plane
        run: |
          node --check data-plane.js
          node --check data-plane-adapters.js
          node --test test/data-plane.test.mjs
      - run: npm run check
      - run: npm run build
      - name: Validate AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Run full tests with PR regression gate
        if: github.event_name == 'pull_request'
        run: node scripts/test-no-regression.mjs
      - name: Run full tests on main
        if: github.event_name != 'pull_request'
        run: npm test
