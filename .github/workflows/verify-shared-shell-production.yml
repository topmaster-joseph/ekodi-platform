name: Verify Shared Shell Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-shared-shell-production.yml'
      - 'ekodi-service-manifest.js'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'test/ekodi-shell.test.mjs'

permissions:
  contents: read

concurrency:
  group: verify-shared-shell-production-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Verify Shell service and canonical production manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            health=$(curl -sS -o /tmp/shell-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/health' || true)
            manifest=$(curl -sS -o /tmp/shell-manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/manifest.json' || true)
            if [[ "$health" == '200' && "$manifest" == '200' ]] \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/shell-health.json \
              && grep -Fq '"shellPolicy":"required-for-user-facing-services"' /tmp/shell-manifest.json; then
              break
            fi
            if [[ "$attempt" == '24' ]]; then exit 1; fi
            sleep 5
          done
      - name: Verify Worker-based production services
        shell: bash
        run: |
          set -euo pipefail
          verify_worker() {
            url="$1"; needle="$2"; ok=0
            for attempt in $(seq 1 24); do
              code=$(curl -L -sS -D /tmp/service.headers -o /tmp/service.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
              echo "$url -> $code attempt=$attempt"
              if [[ "$code" == '200' ]] \
                && grep -Fq "$needle" /tmp/service.html \
                && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/service.html \
                && grep -Fiq 'x-ekodi-shell: v1' /tmp/service.headers; then
                ok=1; break
              fi
              sleep 5
            done
            [[ "$ok" == '1' ]]
          }
          verify_worker 'https://business.ekodi.kr/' 'BUSINESS OS'
          verify_worker 'https://work.ekodi.kr/' 'EKODI Work'
          verify_worker 'https://author.ekodi.kr/' 'EKODI Creator AI'
          verify_worker 'https://books.ekodi.kr/' 'https://ekodi.kr/'
          verify_worker 'https://social.ekodi.kr/' 'EKODI Social'
          verify_worker 'https://energy.ekodi.kr/' 'EKODI Energy AI'
          verify_worker 'https://trade.biz.ekodi.kr/' 'EKODI Global Trading'
          verify_worker 'https://pay.ekodi.kr/' 'EKODI Hub'
      - name: Verify already-migrated shared Shell services still work
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'https://my.ekodi.kr/|My EKODI' \
            'https://community.ekodi.kr/|에코디커뮤니티' \
            'https://church.ekodi.kr/|EKODI' \
            'https://biz.ekodi.kr/|EKODI BIZ' \
            'https://lab.ekodi.kr/|EKODI' \
            'https://mall.ekodi.kr/|EKODI'; do
            url="${spec%%|*}"; needle="${spec#*|}"; ok=0
            for attempt in $(seq 1 18); do
              code=$(curl -L -sS -D /tmp/shared.headers -o /tmp/shared.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
              if [[ "$code" == '200' ]] && grep -Fq "$needle" /tmp/shared.html && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/shared.html; then ok=1; break; fi
              sleep 4
            done
            [[ "$ok" == '1' ]]
          done
      - name: Verify Marketing AI production Pages and store surfaces
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'https://marketing.ekodi.kr/|마케팅AI' \
            'https://jadam.ekodi.kr/|자담치킨' \
            'https://pizzamaru.ekodi.kr/|피자마루' \
            'https://yogurt.ekodi.kr/|요거트퍼플' \
            'https://jadam.ai.ekodi.kr/|자담치킨' \
            'https://pizzamaru.ai.ekodi.kr/|피자마루' \
            'https://yogurt.ai.ekodi.kr/|요거트퍼플'; do
            url="${spec%%|*}"; needle="${spec#*|}"; ok=0
            for attempt in $(seq 1 24); do
              code=$(curl -L -sS -o /tmp/marketing.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
              echo "$url -> $code attempt=$attempt"
              if [[ "$code" == '200' ]] \
                && grep -Fq "$needle" /tmp/marketing.html \
                && grep -Fq 'data-ekodi-shell="v1"' /tmp/marketing.html \
                && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/marketing.html \
                && grep -Fq 'data-ekodi-service="marketing"' /tmp/marketing.html \
                && grep -Fq 'data-ekodi-workspace-handoff' /tmp/marketing.html; then
                ok=1; break
              fi
              sleep 5
            done
            [[ "$ok" == '1' ]]
          done
          echo 'All active EKODI production surfaces verified with the shared My/Shell contract.'
