name: Verify Shared Shell Production

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-shared-shell-production.yml'
      - 'ekodi-service-manifest.js'
      - 'config/ecosystem-services.json'
      - 'config/seasonal-design-governance.json'
      - 'docs/ekodi-shell-contract.md'
      - 'shell/**'
      - 'scripts/build-shell-audit-matrix.mjs'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'scripts/validate-seasonal-design-governance.mjs'
      - 'test/ekodi-shell.test.mjs'

permissions:
  contents: read

concurrency:
  group: verify-shared-shell-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: matrix
        name: Build Shell audit matrix without contacting production
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(node scripts/build-shell-audit-matrix.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Validate Shell source contracts
        run: |
          set -euo pipefail
          node scripts/validate-ekodi-shell-adoption.mjs
          node scripts/validate-seasonal-design-governance.mjs
          node --test test/ekodi-shell.test.mjs
      - name: Confirm PR checks are production-free
        if: github.event_name == 'pull_request'
        run: echo 'PR Shell verification completed without production network probes.'

  shell-production:
    needs: source-contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify shared Shell service with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            health=$(curl -sS -o /tmp/shell-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/health' || true)
            script=$(curl -sS -o /tmp/shell.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/shell.js' || true)
            theme=$(curl -sS -o /tmp/theme.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/theme.json' || true)
            if [[ "$health" == '200' && "$script" == '200' && "$theme" == '200' ]] \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/shell-health.json \
              && grep -Fq 'window.EKODIShell' /tmp/shell.js \
              && grep -Fq 'EKODI 서비스 전환' /tmp/shell.js \
              && grep -Fq 'ekodi:public-experience' /tmp/shell.js \
              && grep -Fq '"rotation":"weekly-deterministic"' /tmp/theme.json \
              && grep -Fq '"timezone":"Asia/Seoul"' /tmp/theme.json; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  services-production:
    needs: [source-contract, shell-production]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.source-contract.outputs.matrix) }}
    steps:
      - name: Verify ${{ matrix.id }} production Shell contract once
        shell: bash
        env:
          URL: ${{ matrix.url }}
          SERVICE_ID: ${{ matrix.id }}
          INTEGRATION: ${{ matrix.integration }}
        run: |
          set -euo pipefail
          code=$(curl -L -sS -D /tmp/service.headers -o /tmp/service.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$URL" || true)
          echo "$SERVICE_ID $URL -> $code integration=$INTEGRATION"
          body_shell=false
          header_shell=false
          grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/service.html && body_shell=true || true
          grep -Eiq '^x-ekodi-shell:[[:space:]]*v2[[:space:]]*$' /tmp/service.headers && header_shell=true || true
          contract_ok=false
          case "$INTEGRATION" in
            static-script|external-build) [[ "$body_shell" == 'true' ]] && contract_ok=true ;;
            worker-injected|shared-proxy) [[ "$header_shell" == 'true' || "$body_shell" == 'true' ]] && contract_ok=true ;;
            *) echo "Unsupported production Shell integration for $SERVICE_ID: $INTEGRATION" >&2; exit 1 ;;
          esac
          [[ "$code" == '200' && "$contract_ok" == 'true' ]]

  summary:
    needs: [source-contract, shell-production, services-production]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Manual, bounded Shared Shell production verification completed.'
