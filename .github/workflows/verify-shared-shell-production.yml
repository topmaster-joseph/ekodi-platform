name: Verify Shared Shell Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-shared-shell-production.yml'
      - 'ekodi-service-manifest.js'
      - 'config/ecosystem-services.json'
      - 'config/seasonal-design-governance.json'
      - 'docs/ekodi-shell-contract.md'
      - 'shell/**'
      - 'scripts/build-shell-audit-matrix.mjs'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'scripts/validate-seasonal-design-governance.mjs'
      - 'test/ekodi-shell.test.mjs'

permissions:
  contents: read

concurrency:
  group: verify-shared-shell-production-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        name: Build active-service audit matrix from canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(node scripts/build-shell-audit-matrix.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify shared Shell service
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            health=$(curl -sS -o /tmp/shell-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/health' || true)
            script=$(curl -sS -o /tmp/shell.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/shell.js' || true)
            theme=$(curl -sS -o /tmp/theme.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/theme.json' || true)
            if [[ "$health" == '200' && "$script" == '200' && "$theme" == '200' ]] \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/shell-health.json \
              && grep -Fq 'window.EKODIShell' /tmp/shell.js \
              && grep -Fq 'EKODI 서비스 전환' /tmp/shell.js \
              && grep -Fq 'ekodi:public-experience' /tmp/shell.js \
              && grep -Fq '"rotation":"weekly-deterministic"' /tmp/theme.json \
              && grep -Fq '"timezone":"Asia/Seoul"' /tmp/theme.json; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  services:
    needs: [inventory, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Verify ${{ matrix.id }} production Shell contract
        shell: bash
        env:
          URL: ${{ matrix.url }}
          SERVICE_ID: ${{ matrix.id }}
          INTEGRATION: ${{ matrix.integration }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -D /tmp/service.headers -o /tmp/service.html -w '%{http_code}' --connect-timeout 5 --max-time 20 "$URL" || true)
            echo "$SERVICE_ID $URL -> $code integration=$INTEGRATION attempt=$attempt"
            if [[ "$code" == '200' ]] && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/service.html; then
              echo "$SERVICE_ID shared Shell verified."
              exit 0
            fi
            sleep 5
          done
          echo "Shared Shell production audit failed for $SERVICE_ID at $URL" >&2
          exit 1

  summary:
    needs: [inventory, shell, services]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All active services from the canonical EKODI manifest were verified with the shared top service selector, weekly public identity rotation, and My/Shell contract.'
