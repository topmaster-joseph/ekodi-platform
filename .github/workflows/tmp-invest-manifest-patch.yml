name: Temporary Invest Manifest Patch

on:
  push:
    branches:
      - ai/chatgpt/fix-invest-canonical-release-marker-20260916
    paths:
      - .github/workflows/tmp-invest-manifest-patch.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/chatgpt/fix-invest-canonical-release-marker-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --ci
      - name: Apply exact canonical Invest release patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='deploy/manifests/shared-site.worker.json';
          let text=fs.readFileSync(file,'utf8');
          const version='  "version": 68,';
          const legacy='          "invest.ekodi.kr",\n';
          if(!text.includes(version)) throw new Error('manifest version 68 marker missing');
          if(!text.includes(legacy)) throw new Error('legacy invest marker missing');
          text=text.replace(version,'  "version": 69,').replace(legacy,'');
          fs.writeFileSync(file,text,'utf8');
          JSON.parse(text);
          if(text.includes('"invest.ekodi.kr"')) throw new Error('legacy invest marker remains');
          NODE
          rm .github/workflows/tmp-invest-manifest-patch.yml
          git diff --check
          git diff -- deploy/manifests/shared-site.worker.json
          git config user.name 'EKODI AI'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/manifests/shared-site.worker.json .github/workflows/tmp-invest-manifest-patch.yml
          git commit -m 'fix(release): align Invest canonical smoke marker'
          git push origin HEAD:ai/chatgpt/fix-invest-canonical-release-marker-20260916
