name: Deploy EKODI Work Staging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'work/**'
      - 'work-worker.js'
      - 'wrangler.work-staging.toml'
      - 'auth-site/client-auth.js'
      - 'auth-site/auth-router.js'
      - '.github/workflows/deploy-work-staging.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-work-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-work-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Static validation
        run: |
          set -euo pipefail
          node --check work-worker.js
          node --check work/app.js
          node --check work/opportunities.js
          node --check work/workforce-os.js
          grep -Fq 'AI recommends · Human decides' work/index.html
          grep -Fq 'LOCAL WORKFORCE OS' work/index.html
          grep -Fq '/config.js' work/index.html
          grep -Fq '/opportunities.js' work/index.html
          grep -Fq '/workforce-os.js' work/index.html
          grep -Fq '/api/opportunities' work-worker.js
          grep -Fq 'DATA_ENABLED = "false"' wrangler.work-staging.toml
      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f' || {
            echo '::error::Staging deployment must use EKODI Development.'
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo '::error::Missing CLOUDFLARE_DEVELOPMENT_API_TOKEN.'
            exit 1
          }
      - name: Deploy isolated staging Worker
        run: npx wrangler deploy --config wrangler.work-staging.toml
      - name: Verify staging boundary and data isolation
        shell: bash
        run: |
          set -euo pipefail
          access_code=$(curl -sS -D /tmp/work-access.headers -o /tmp/work-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
          if [[ "$access_code" == '302' ]] && grep -Fiq '^www-authenticate: Cloudflare-Access' /tmp/work-access.headers; then
            echo "EKODI Work staging deployed and is correctly protected by Cloudflare Access at $STAGING_URL"
            exit 0
          fi
          for attempt in $(seq 1 12); do
            root_code=$(curl -L -sS -o /tmp/work-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            config_code=$(curl -sS -o /tmp/work-stage-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/config.js" || true)
            health_code=$(curl -sS -o /tmp/work-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            feed_code=$(curl -sS -o /tmp/work-stage-feed.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/api/opportunities?limit=4" || true)
            os_code=$(curl -sS -o /tmp/work-stage-os.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/workforce-os.js" || true)
            if [[ "$root_code" == "200" ]] && [[ "$config_code" == "200" ]] && [[ "$health_code" == "200" ]] && [[ "$feed_code" == "200" ]] && [[ "$os_code" == "200" ]] \
              && grep -Fq 'EKODI Work' /tmp/work-stage.html \
              && grep -Fq 'LOCAL WORKFORCE OS' /tmp/work-stage.html \
              && grep -Fq '"dataEnabled":false' /tmp/work-stage-config.js \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/work-stage-health.json \
              && grep -Fq '"dataEnabled":false' /tmp/work-stage-health.json \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/work-stage-feed.json \
              && grep -Fq '"id":"work24"' /tmp/work-stage-feed.json \
              && grep -Fq 'work_passports' /tmp/work-stage-os.js; then
              echo "EKODI Work staging verified and isolated at $STAGING_URL"
              exit 0
            fi
            sleep 3
          done
          echo 'EKODI Work staging verification failed or data isolation was lost.'
          exit 1
