name: Cloudflare Account Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-account-hygiene.yml'
      - '.github/workflows/cloudflare-boundary-audit.yml'
      - 'docs/operations/cloudflare-two-account-boundary.md'
  schedule:
    - cron: '17 18 * * 0'

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    env:
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Inventory Development Workers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -o /tmp/workers.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/workers.json', encoding='utf-8'))
          if not data.get('success'):
              raise SystemExit(f"Cloudflare API failed: {data.get('errors')}")
          names = sorted(item['id'] for item in data.get('result', []))
          staging = [n for n in names if n.endswith('-staging') or '-staging-' in n]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## EKODI Development\n')
              f.write(f'- Workers: **{len(names)}**\n')
              f.write(f'- Staging Workers: **{len(staging)}**\n')
              if staging:
                  f.write('- Staging inventory: `' + '`, `'.join(staging) + '`\n')
          print('Development Workers:', ', '.join(names) or '(none)')
          PY

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inventory Production Workers and flag staging residue
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -o /tmp/workers.json
          python - <<'PY'
          import json, os
          data = json.load(open('/tmp/workers.json', encoding='utf-8'))
          if not data.get('success'):
              raise SystemExit(f"Cloudflare API failed: {data.get('errors')}")
          names = sorted(item['id'] for item in data.get('result', []))
          residue = [n for n in names if n.endswith('-staging') or '-staging-' in n]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## EKODI Production\n')
              f.write(f'- Workers: **{len(names)}**\n')
              f.write(f'- Staging residue: **{len(residue)}**\n')
              if residue:
                  f.write('- ⚠️ Cleanup candidates, verify routes/bindings before deletion: `' + '`, `'.join(residue) + '`\n')
              else:
                  f.write('- ✅ No staging-named Worker remains in Production.\n')
          print('Production Workers:', ', '.join(names) or '(none)')
          if residue:
              print('::warning::Production still contains staging-named Workers: ' + ', '.join(residue))
          PY
