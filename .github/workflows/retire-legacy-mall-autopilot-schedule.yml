name: Retire Legacy Mall Revenue Autopilot Schedule

# Owner-approved 2026-10-20 (KST): the legacy worker `ekodi-mall-revenue-autopilot`
# (retired repo topmaster-joseph/ekodi-mall) still fires every 6h and has failed
# 104+ consecutive runs with CATALOG_HTTP_530 since 2026-09-25. The canonical
# Mall profit loop runs in ekodi-marketing-growth. This job removes ONLY that
# worker's cron triggers. The script, its code and the ekodi-mall D1 data are
# kept, so the change is reversible by re-adding the schedule.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-mall-autopilot-schedule.yml'
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Verified EKODI Orchestrator branch (ai/<agent>/orch_<task-id>)'
        required: true
        type: string
      release_task_id:
        description: 'Verified EKODI Orchestrator task ID (orch_<task-id>)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: retire-legacy-mall-autopilot-schedule
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_SCRIPT: ekodi-mall-revenue-autopilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
          EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Remove legacy cron triggers and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LEGACY_SCRIPT/schedules"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          before=$(curl -fsS "${auth[@]}" "$api")
          echo "$before" | jq -e '.success == true' >/dev/null
          echo "before: $(echo "$before" | jq -c '[.result.schedules[]?.cron]')"
          if [[ "$(echo "$before" | jq '.result.schedules | length')" != "0" ]]; then
            curl -fsS -X PUT "${auth[@]}" --data '[]' "$api" | jq -e '.success == true' >/dev/null
          fi
          after=$(curl -fsS "${auth[@]}" "$api")
          echo "$after" | jq -e '.success == true and ((.result.schedules // []) | length) == 0' >/dev/null || { echo 'Legacy schedule still present'; exit 1; }
          echo "legacy_mall_autopilot_schedule=retired (script and data preserved)"
