name: Sync Marketing AI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-marketing-ai.yml'

permissions:
  contents: read

concurrency:
  group: sync-marketing-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Marketing AI source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build and validate tenant customer auth
        run: |
          set -euo pipefail
          npm run build
          for spec in \
            'jadam:const TENANT="jadam"' \
            'pizzamaru:const TENANT="pizzamaru"' \
            'yogurtpurple:const TENANT="yogurt"'; do
            dir="${spec%%:*}"
            tenant="${spec#*:}"
            file="dist/marketing-ai/$dir/index.html"
            test -f "$file"
            grep -Fq 'id="customerAuthOpen"' "$file"
            grep -Fq '/api/customer/login' "$file"
            grep -Fq '/api/customer/accept-invite' "$file"
            grep -Fq "$tenant" "$file"
          done

      - name: Deploy current source to existing Pages projects
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai --project-name=marketing-ai --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/jadam --project-name=marketing-ai-jadam --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/pizzamaru --project-name=marketing-ai-pizzamaru --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/yogurtpurple --project-name=marketing-ai-yogurtpurple --branch=main

      - name: Verify production customer authentication UI
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            domain="$1"
            store="$2"
            tenant="$3"
            code=$(curl -sS -L -o /tmp/customer.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/" || true)
            echo "$domain -> $code"
            [ "$code" = '200' ]
            grep -Fq "$store" /tmp/customer.html
            grep -Fq 'id="customerAuthOpen"' /tmp/customer.html
            grep -Fq '고객 로그인' /tmp/customer.html
            grep -Fq '/api/customer/login' /tmp/customer.html
            grep -Fq '/api/customer/accept-invite' /tmp/customer.html
            grep -Fq "const TENANT=\"$tenant\"" /tmp/customer.html
          }

          for attempt in $(seq 1 18); do
            if verify 'jadam.ekodi.kr' '자담치킨 목포대점' 'jadam' \
              && verify 'pizzamaru.ekodi.kr' '피자마루 목포대점' 'pizzamaru' \
              && verify 'yogurt.ekodi.kr' '요거트퍼플 목포대점' 'yogurt'; then
              echo 'Marketing AI source sync and customer auth verification succeeded.'
              exit 0
            fi
            sleep 5
          done
          exit 1
