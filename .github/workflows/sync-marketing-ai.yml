name: Sync Marketing AI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-marketing-ai.yml'

permissions:
  contents: read

concurrency:
  group: sync-marketing-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Marketing AI source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build and validate free-member Marketing AI workspace
        run: |
          set -euo pipefail
          npm run build
          hub='dist/marketing-ai/index.html'
          test -f "$hub"
          grep -Fq 'id="freeTrialForm"' "$hub"
          grep -Fq '무료회원 콘텐츠 실습실' "$hub"
          grep -Fq 'Marketing AI basic trial engine' "$hub"
          grep -Fq 'id="trialType"' "$hub"
          grep -Fq 'id="trialSubject"' "$hub"
          grep -Fq 'id="trialTask"' "$hub"
          grep -Fq '개인·크리에이터' "$hub"
          grep -Fq '기관·공공기관' "$hub"
          grep -Fq '비영리·종교단체' "$hub"
          grep -Fq '모임·협회·커뮤니티' "$hub"
          grep -Fq '나와 우리를 위한 마케팅' "$hub"
          grep -Fq 'class="member-workspace"' "$hub"
          grep -Fq 'id="channelGrid"' "$hub"
          grep -Fq 'id="quotaCaption"' "$hub"
          grep -Fq 'id="quotaPost"' "$hub"
          grep -Fq 'id="quotaShorts"' "$hub"
          grep -Fq 'FREE · 연결 잠김' "$hub"
          grep -Fq '채널 1개 · 직접 게시' "$hub"
          grep -Fq '채널 2개 · 예약 게시' "$hub"
          grep -Fq '채널 5개 · 반복·분석' "$hub"
          grep -Fq '채널 10개 · 기획→분석' "$hub"
          if grep -Fq 'id="trialStore"' "$hub"; then
            echo 'Store-only trial field must not survive in the public hub'
            exit 1
          fi
          grep -Fq 'id="pricing"' "$hub"
          grep -Fq 'id="usageEstimator"' "$hub"
          grep -Fq 'BEST PLAN AI' "$hub"
          grep -Fq '1회 결제' "$hub"
          grep -Fq '종량제' "$hub"
          grep -Fq '자동화 플랜' "$hub"
          grep -Fq 'Google로 무료 시작' "$hub"
          grep -Fq 'https://auth.ekodi.kr/?site=marketing' "$hub"
          for plan in free flex plus pro auto; do
            grep -Fq "data-plan=\"$plan\"" "$hub"
          done
          if grep -Fq 'APPLICATION CASES' "$hub" || grep -Fq 'class="case-list"' "$hub"; then
            echo 'Public Marketing AI hub regressed to application-case directory'
            exit 1
          fi
          if grep -Fq 'href="https://pay.ekodi.kr' "$hub"; then
            echo 'Live checkout must remain disabled during beta pricing QA'
            exit 1
          fi

          for dir in jadam pizzamaru yogurtpurple; do
            file="dist/marketing-ai/$dir/index.html"
            test -f "$file"
            grep -Fq 'id="googleCustomerAuth"' "$file"
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' "$file"
            grep -Fq 'Google로 무료 시작' "$file"
            if grep -Fq 'id="customerAuthOpen"' "$file" \
              || grep -Fq '/api/customer/login' "$file" \
              || grep -Fq '/api/customer/accept-invite' "$file"; then
              echo "Legacy direct customer auth detected in $file"
              exit 1
            fi
          done

          if grep -R -Fq 'https://yogurtpurple.ekodi.kr/' dist/marketing-ai; then
            echo 'Legacy yogurtpurple domain detected in generated site'
            exit 1
          fi
          grep -Fq 'https://yogurt.ekodi.kr/' dist/marketing-ai/qa/index.html

      - name: Deploy current source to existing Pages projects
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai --project-name=marketing-ai --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/jadam --project-name=marketing-ai-jadam --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/pizzamaru --project-name=marketing-ai-pizzamaru --branch=main
          npx --yes wrangler@4.119.0 pages deploy dist/marketing-ai/yogurtpurple --project-name=marketing-ai-yogurtpurple --branch=main

      - name: Verify production free-member workspace and central authentication
        shell: bash
        run: |
          set -euo pipefail
          verify_hub() {
            code=$(curl -sS -L -o /tmp/hub.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://marketing.ekodi.kr/' || true)
            echo "marketing.ekodi.kr -> $code"
            [ "$code" = '200' ]
            grep -Fq 'id="freeTrialForm"' /tmp/hub.html
            grep -Fq '무료회원 콘텐츠 실습실' /tmp/hub.html
            grep -Fq 'Marketing AI basic trial engine' /tmp/hub.html
            grep -Fq 'id="trialType"' /tmp/hub.html
            grep -Fq 'id="trialSubject"' /tmp/hub.html
            grep -Fq 'id="trialTask"' /tmp/hub.html
            grep -Fq '개인·크리에이터' /tmp/hub.html
            grep -Fq '기관·공공기관' /tmp/hub.html
            grep -Fq '비영리·종교단체' /tmp/hub.html
            grep -Fq '나와 우리를 위한 마케팅' /tmp/hub.html
            grep -Fq 'class="member-workspace"' /tmp/hub.html
            grep -Fq 'id="channelGrid"' /tmp/hub.html
            grep -Fq 'FREE · 연결 잠김' /tmp/hub.html
            ! grep -Fq 'id="trialStore"' /tmp/hub.html
            grep -Fq 'id="pricing"' /tmp/hub.html
            grep -Fq 'id="usageEstimator"' /tmp/hub.html
            grep -Fq 'BEST PLAN AI' /tmp/hub.html
            grep -Fq '1회 결제' /tmp/hub.html
            grep -Fq '종량제' /tmp/hub.html
            grep -Fq '자동화 플랜' /tmp/hub.html
            grep -Fq 'Google로 무료 시작' /tmp/hub.html
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' /tmp/hub.html
            ! grep -Fq 'APPLICATION CASES' /tmp/hub.html
            ! grep -Fq 'class="case-list"' /tmp/hub.html
            ! grep -Fq 'href="https://pay.ekodi.kr' /tmp/hub.html
          }
          verify_customer() {
            domain="$1"
            store="$2"
            code=$(curl -sS -L -o /tmp/customer.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$domain/" || true)
            echo "$domain -> $code"
            [ "$code" = '200' ]
            grep -Fq "$store" /tmp/customer.html
            grep -Fq 'id="googleCustomerAuth"' /tmp/customer.html
            grep -Fq 'Google로 무료 시작' /tmp/customer.html
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' /tmp/customer.html
            ! grep -Fq 'id="customerAuthOpen"' /tmp/customer.html
            ! grep -Fq '/api/customer/login' /tmp/customer.html
            ! grep -Fq '/api/customer/accept-invite' /tmp/customer.html
          }

          for attempt in $(seq 1 24); do
            if verify_hub \
              && verify_customer 'jadam.ekodi.kr' '자담치킨 목포대점' \
              && verify_customer 'pizzamaru.ekodi.kr' '피자마루 목포대점' \
              && verify_customer 'yogurt.ekodi.kr' '요거트퍼플 목포대점'; then
              echo 'Marketing AI free-member channel workspace and tiered automation verified in production.'
              exit 0
            fi
            sleep 5
          done
          exit 1

# Sync trigger: free-member channel workspace + tiered automation
