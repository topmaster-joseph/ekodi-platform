name: Sync Marketing AI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-marketing-ai.yml'
      - 'scripts/guarded-pages-release.mjs'
      - 'deploy/manifests/marketing-ai.pages.json'

permissions:
  contents: read

concurrency:
  group: sync-marketing-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout EKODI release controller
        uses: actions/checkout@v7
        with:
          path: controller
      - name: Checkout Marketing AI source
        uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: main
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify release controller and credentials
        run: |
          set -euo pipefail
          node --check controller/scripts/guarded-pages-release.mjs
          test -f controller/deploy/manifests/marketing-ai.pages.json
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Build and validate authenticated Marketing AI tiers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          hub='dist/marketing-ai/index.html'
          test -f "$hub"
          grep -Fq 'id="googleCustomerAuth"' "$hub"
          grep -Fq 'FREE MEMBER · GOOGLE VERIFIED' "$hub"
          grep -Fq "ekodiAuthState==='authenticated'" "$hub"
          grep -Fq 'EKODI_MARKETING_AUTH_TOKEN' "$hub"
          grep -Fq 'EKODI_MARKETING_CONTEXT' "$hub"
          grep -Fq 'FREE는 문구·게시글·쇼츠 각각 월 1회' "$hub"
          grep -Fq '채널 1개 · 1회 실행' "$hub"
          grep -Fq '채널 3개 · 예약' "$hub"
          grep -Fq '채널 5개 · 반복·분석' "$hub"
          grep -Fq '채널 10개 · 상시 운영' "$hub"
          grep -Fq '/api/marketing/runtime/consume' "$hub"
          grep -Fq '/api/marketing/runtime/channels' "$hub"
          grep -Fq '/api/marketing/runtime/automations' "$hub"
          grep -Fq 'data-member-workspace' "$hub"
          grep -Fq 'data-member-session-layout' "$hub"
          grep -Fq 'id="pricing"' "$hub"
          for plan in free flex plus pro auto; do grep -Fq "data-plan=\"$plan\"" "$hub"; done
          if grep -Fq "localStorage.getItem(KEY)==='1'" "$hub" || grep -Fq 'ekodi-marketing-free-usage:' "$hub"; then
            echo 'Browser-local membership/quota authority detected'; exit 1
          fi
          if grep -Fq 'href="https://pay.ekodi.kr' "$hub"; then
            echo 'Live checkout must remain disabled until billing UI QA'; exit 1
          fi
          for dir in jadam pizzamaru yogurtpurple; do
            file="dist/marketing-ai/$dir/index.html"
            test -f "$file"
            grep -Fq 'id="googleCustomerAuth"' "$file"
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' "$file"
            if grep -Fq 'id="customerAuthOpen"' "$file" || grep -Fq '/api/customer/login' "$file"; then
              echo "Legacy customer auth detected in $file"; exit 1
            fi
          done
          if grep -R -Fq 'https://yogurtpurple.ekodi.kr/' dist/marketing-ai; then
            echo 'Legacy yogurtpurple domain detected'; exit 1
          fi
      - name: Preview gate, production promotion and smoke verification
        run: |
          set -euo pipefail
          node controller/scripts/guarded-pages-release.mjs --root source --manifest controller/deploy/manifests/marketing-ai.pages.json
      - name: Verify production contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS -L -o /tmp/hub.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://marketing.ekodi.kr/' || true)
            if [ "$code" = '200' ] \
              && grep -Fq 'FREE MEMBER · GOOGLE VERIFIED' /tmp/hub.html \
              && grep -Fq 'FREE는 문구·게시글·쇼츠 각각 월 1회' /tmp/hub.html \
              && grep -Fq '채널 3개 · 예약' /tmp/hub.html \
              && grep -Fq '채널 5개 · 반복·분석' /tmp/hub.html \
              && grep -Fq '채널 10개 · 상시 운영' /tmp/hub.html \
              && grep -Fq '/api/marketing/runtime/consume' /tmp/hub.html \
              && ! grep -Fq 'ekodi-marketing-free-usage:' /tmp/hub.html; then
              echo 'Marketing AI authenticated tier contract verified in production.'
              exit 0
            fi
            sleep 5
          done
          exit 1

# Release policy: build -> isolated preview -> preview smoke -> production promote -> production verify
