name: Audit Marketing Pages Source

on:
  pull_request:
    paths:
      - '.github/workflows/audit-marketing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials are available
        run: |
          test -n "$CF_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Audit Pages source configuration without changing anything
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          for project in marketing-ai marketing-ai-jadam marketing-ai-pizzamaru marketing-ai-yogurtpurple; do
            curl -fsS "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project" > "/tmp/$project.json"
            PROJECT="$project" python - <<'PY'
          import json, os
          p=os.environ['PROJECT']
          d=json.load(open('/tmp/'+p+'.json'))['result']
          source=d.get('source') or {}
          cfg=source.get('config') or {}
          build=d.get('build_config') or {}
          deployment=d.get('latest_deployment') or {}
          dep_source=deployment.get('source') or {}
          print({
            'project': d.get('name'),
            'subdomain': d.get('subdomain'),
            'production_branch': d.get('production_branch'),
            'source_type': source.get('type'),
            'source_owner': cfg.get('owner'),
            'source_repo': cfg.get('repo_name'),
            'build_command': build.get('build_command'),
            'destination_dir': build.get('destination_dir'),
            'root_dir': build.get('root_dir'),
            'latest_branch': dep_source.get('branch'),
            'latest_commit': dep_source.get('hash'),
            'latest_stage': deployment.get('stage'),
          })
          PY
          done
