name: Deploy EKODI Support Opportunity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'support/**'
      - 'support-worker.js'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'test/support-opportunity.test.mjs'
      - 'test/support-need-sensing.test.mjs'
      - 'test/support-institution-sources.test.mjs'
      - 'config/workspace-packs.json'
      - 'config/capability-registry.json'
      - 'test/support-benefit-radar-10g.test.mjs'
      - 'wrangler.support.toml'
      - 'wrangler.support.staging.toml'
      - 'deploy/manifests/support.worker.json'
      - '.github/workflows/deploy-support-opportunity.yml'
  push:
    branches: [main]
    paths:
      - 'support/**'
      - 'support-worker.js'
      - 'ekodi-service-manifest.js'
      - 'platform-boundaries.json'
      - 'test/support-opportunity.test.mjs'
      - 'test/support-need-sensing.test.mjs'
      - 'test/support-institution-sources.test.mjs'
      - 'config/workspace-packs.json'
      - 'config/capability-registry.json'
      - 'test/support-benefit-radar-10g.test.mjs'
      - 'wrangler.support.toml'
      - 'wrangler.support.staging.toml'
      - 'deploy/manifests/support.worker.json'
      - '.github/workflows/deploy-support-opportunity.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ekodi-support-${{ github.event_name == 'pull_request' && format('staging-pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: '4.129.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Support contracts
        run: |
          set -euo pipefail
          node --check support-worker.js
          node --check support/core.js
          node --check support/sources.js
          node --check support/institution-sources.js
          node --check support/need-sensing.js
          node --check support/app.js
          node --check support/service.js
          node --check support/specialists.js
          node --check ekodi-service-manifest.js
          node --test test/support-opportunity.test.mjs test/support-need-sensing.test.mjs test/support-institution-sources.test.mjs test/support-benefit-radar-10g.test.mjs
          node scripts/validate-capability-registry.mjs
          node scripts/validate-platform-boundaries.mjs
          node scripts/validate-ai-mission-governance.mjs
          node -e "JSON.parse(require('fs').readFileSync('deploy/manifests/support.worker.json','utf8'))"
          grep -Fq 'EKODI SUPPORT · OPPORTUNITY FIRST' support/index.html
          grep -Fq 'OFFICIAL FEED' support/index.html
          grep -Fq 'PROACTIVE BRIEF' support/index.html
          grep -Fq 'SPECIALIST WORKSPACE · SHARED OPPORTUNITY CORE' support/service.html
          grep -Fq '자동 제출 금지' support/service.html
          grep -Fq "id:'support'" ekodi-service-manifest.js
          grep -Fq '"support"' platform-boundaries.json

  staging:
    environment: development
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-support-opportunity-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated staging
        run: npx wrangler@${WRANGLER_VERSION} deploy --config wrangler.support.staging.toml
      - name: Verify staging
        run: |
          set -euo pipefail
          remote_protected=0
          verify_base="$STAGING_URL"
          runtime_pid=''
          cleanup() {
            if [[ -n "$runtime_pid" ]]; then kill "$runtime_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          access_code=$(curl -sS -D /tmp/support-access.headers -o /tmp/support-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
          if [[ "$access_code" == '302' ]] && grep -iq '^Www-Authenticate: Cloudflare-Access' /tmp/support-access.headers; then
            remote_protected=1
            echo 'Support Opportunity staging is protected by Cloudflare Access. Keeping Access enabled and validating the exact staging configuration locally.'
            npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.support.staging.toml --json > /tmp/support-deployments.json
            test -s /tmp/support-deployments.json
            npx --yes wrangler@${WRANGLER_VERSION} dev --config wrangler.support.staging.toml --local --port 8797 >/tmp/support-local.log 2>&1 &
            runtime_pid=$!
            verify_base='http://127.0.0.1:8797'
            ready=0
            for attempt in $(seq 1 30); do
              if curl -sSf --max-time 5 "$verify_base/health" >/dev/null 2>&1; then ready=1; break; fi
              if ! kill -0 "$runtime_pid" 2>/dev/null; then cat /tmp/support-local.log; exit 1; fi
              sleep 2
            done
            if [[ "$ready" != '1' ]]; then cat /tmp/support-local.log; exit 1; fi
          elif [[ "$access_code" != '200' ]]; then
            echo "Unexpected Support staging edge response: HTTP $access_code" >&2
            cat /tmp/support-access.headers >&2 || true
            cat /tmp/support-access.body >&2 || true
            exit 1
          fi
          specialist_paths=(grants subsidies scholarships contests welfare private-support sponsorship)
          no_consent='{"profile":{"profileType":"business","region":"Jeonnam","need":"AI marketing support","interests":["AI"]},"needContext":{"consent":{"proactiveBenefits":false,"activityContext":false,"externalData":false,"sensitiveBenefits":false},"signals":[]}}'
          yes_consent='{"profile":{"profileType":"business","region":"Jeonnam","need":"AI marketing support","interests":["AI"]},"needContext":{"consent":{"proactiveBenefits":true,"activityContext":false,"externalData":false,"sensitiveBenefits":false},"signals":[]}}'
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/support-headers -o /tmp/support.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/" || true)
            health=$(curl -sS -o /tmp/support-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/health" || true)
            sources=$(curl -sS -o /tmp/support-sources.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/api/sources/status" || true)
            feed_ok=true
            notices='skipped-protected-staging'
            if [[ "$remote_protected" != '1' ]]; then
              notices=$(curl -sS -o /tmp/support-notices.json -w '%{http_code}' --connect-timeout 8 --max-time 25 "$verify_base/api/opportunities?limit=5" || true)
              if [[ "$notices" != '200' ]] || ! grep -Fq '"ok":true' /tmp/support-notices.json || ! grep -Fq '"source":"combined"' /tmp/support-notices.json || ! grep -Fq '"id":"bizinfo"' /tmp/support-notices.json || ! grep -Fq '"official":true' /tmp/support-notices.json; then
                feed_ok=false
              fi
            fi
            need_no=$(curl -sS -o /tmp/support-need-no.json -w '%{http_code}' -H 'content-type: application/json' -d "$no_consent" --connect-timeout 5 --max-time 15 "$verify_base/api/need-assessment" || true)
            need_yes=$(curl -sS -o /tmp/support-need-yes.json -w '%{http_code}' -H 'content-type: application/json' -d "$yes_consent" --connect-timeout 5 --max-time 15 "$verify_base/api/need-assessment" || true)
            specialist_ok=true
            for path in "${specialist_paths[@]}"; do
              code=$(curl -L -sS -o "/tmp/support-${path}.html" -w '%{http_code}' --connect-timeout 5 --max-time 15 "$verify_base/$path" || true)
              if [[ "$code" != '200' ]] || ! grep -Fq 'SPECIALIST WORKSPACE · SHARED OPPORTUNITY CORE' "/tmp/support-${path}.html"; then
                echo "specialist staging route failed path=$path code=$code"
                specialist_ok=false
              fi
            done
            if [[ "$root" == '200' && "$health" == '200' && "$sources" == '200' && "$need_no" == '200' && "$need_yes" == '200' && "$specialist_ok" == 'true' && "$feed_ok" == 'true' ]] \
              && grep -Fq 'GRANT WORKSPACE' /tmp/support.html \
              && grep -Fq 'OFFICIAL FEED' /tmp/support.html \
              && grep -Fq 'id="proactiveBenefits"' /tmp/support.html \
              && grep -Fq '"service":"ekodi-support-opportunity"' /tmp/support-health.json \
              && grep -Fq '"specialistWorkspace":true' /tmp/support-health.json \
              && grep -Fq '"needSensing":"consent-first"' /tmp/support-health.json \
              && grep -Fq '"id":"support.benefit-radar"' /tmp/support-health.json \
              && grep -Fq '"generation":10' /tmp/support-health.json \
              && grep -Fq '"contract":"ekodi.benefit-radar.v1"' /tmp/support-health.json \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/support-health.json \
              && grep -Fq '"id":"bizinfo"' /tmp/support-sources.json \
              && grep -Fq '"id":"trusted-institutions"' /tmp/support-sources.json \
              && grep -Fq '"proactiveEligible":false' /tmp/support-need-no.json \
              && grep -Fq '"proactiveEligible":true' /tmp/support-need-yes.json \
              && grep -Eiq '^x-ekodi-shell: v2' /tmp/support-headers; then
              if [[ "$remote_protected" == '1' ]]; then
                echo 'Support staging deployment exists, Cloudflare Access remains enforced, and exact staging runtime contracts including Generation 10 consent-first Benefit Radar pass locally. External official-feed liveness is verified only on a network-capable remote/production path.'
              else
                echo 'Support root, APIs, consent-first Benefit Radar and all seven specialist staging routes verified remotely.'
              fi
              exit 0
            fi
            sleep 4
          done
          cat /tmp/support-access.headers || true
          cat /tmp/support-health.json || true
          cat /tmp/support-notices.json || true
          cat /tmp/support-need-no.json || true
          cat /tmp/support-need-yes.json || true
          cat /tmp/support-local.log 2>/dev/null || true
          exit 1

  production:
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Wait for Shell contract
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/manifest.json' || true)
            if [[ "$code" == '200' ]] && grep -Fq '"id":"support"' /tmp/manifest.json; then break; fi
            if [[ "$attempt" == '24' ]]; then exit 1; fi
            sleep 5
          done
      - name: Bootstrap or guarded release
        run: |
          set -euo pipefail
          if npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.support.toml --json > /tmp/deployments.log 2>&1; then
            node scripts/guarded-worker-release.mjs --manifest deploy/manifests/support.worker.json
          elif grep -Eq 'This Worker does not exist|has no deployments|code: 10007' /tmp/deployments.log; then
            npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.support.toml
          else
            cat /tmp/deployments.log
            exit 1
          fi
      - name: Sync optional Bizinfo credential
        if: env.BIZINFO_API_KEY != ''
        run: printf '%s' "$BIZINFO_API_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put BIZINFO_API_KEY --config wrangler.support.toml
      - name: Reconcile production hostname trigger
        run: npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.support.toml
      - name: Verify real production hostname
        run: |
          set -euo pipefail
          specialist_paths=(grants subsidies scholarships contests welfare private-support sponsorship)
          for attempt in $(seq 1 18); do
            root=$(curl -L -sS -D /tmp/support-headers -o /tmp/support.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/' || true)
            health=$(curl -sS -o /tmp/support-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/health' || true)
            sources=$(curl -sS -o /tmp/support-sources.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/api/sources/status' || true)
            notices=$(curl -sS -o /tmp/support-notices.json -w '%{http_code}' --connect-timeout 8 --max-time 25 'https://support.ekodi.kr/api/opportunities?limit=5' || true)
            admin=$(curl -sS -o /dev/null -D /tmp/support-admin-headers -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://support.ekodi.kr/admin' || true)
            specialist_ok=true
            for path in "${specialist_paths[@]}"; do
              code=$(curl -L -sS -o "/tmp/support-${path}.html" -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://support.ekodi.kr/$path" || true)
              if [[ "$code" != '200' ]] || ! grep -Fq 'SPECIALIST WORKSPACE · SHARED OPPORTUNITY CORE' "/tmp/support-${path}.html"; then
                echo "specialist production route failed path=$path code=$code"
                specialist_ok=false
              fi
            done
            if [[ "$root" == '200' && "$health" == '200' && "$sources" == '200' && "$notices" == '200' && "$specialist_ok" == 'true' ]] \
              && grep -Fq 'GRANT WORKSPACE' /tmp/support.html \
              && grep -Fq 'OFFICIAL FEED' /tmp/support.html \
              && grep -Fq '"dataMode":"production"' /tmp/support-health.json \
              && grep -Fq '"submissionExecution":false' /tmp/support-health.json \
              && grep -Fq '"specialistWorkspace":true' /tmp/support-health.json \
              && grep -Fq '"id":"bizinfo"' /tmp/support-sources.json \
              && grep -Fq '"id":"trusted-institutions"' /tmp/support-sources.json \
              && grep -Fq '"ok":true' /tmp/support-notices.json \
              && grep -Fq '"source":"combined"' /tmp/support-notices.json \
              && grep -Fq '"id":"bizinfo"' /tmp/support-notices.json \
              && grep -Fq '"official":true' /tmp/support-notices.json \
              && grep -Eiq '^x-ekodi-shell: v2' /tmp/support-headers \
              && grep -Eiq '^location: https://admin\.ekodi\.kr/?' /tmp/support-admin-headers; then
              echo 'Support root, APIs and all seven specialist production routes verified.'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/support-notices.json || true
          exit 1
      - name: Publish production verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${VERIFY_STATE}\",\"context\":\"EKODI Support Production\",\"description\":\"support.ekodi.kr production verification\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
