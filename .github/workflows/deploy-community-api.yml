name: Deploy Community API

on:
  pull_request:
    paths:
      - 'supabase/functions/community-api/**'
      - 'supabase/migrations/20261103142625_community_reading_shared_workspace.sql'
      - 'test/community-reading-*.test.mjs'
      - '.github/workflows/deploy-community-api.yml'
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Verified orchestrator release branch'
        required: true
        type: string
      release_task_id:
        description: 'Exact orchestrator task ID'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact protected main release commit'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-community-api-${{ github.event_name == 'pull_request' && format('pr-{0}',github.event.pull_request.number) || 'protected-production' }}
  cancel-in-progress: false

env:
  PROJECT_REF: renzehysxirjilvdxacv
  PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate canonical Community endpoint and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/community-api/reading.ts
          test -f supabase/functions/community-api/reading-policy.js
          grep -Fq '"https://ekodi.kr"' supabase/functions/community-api/index.ts
          grep -Fq 'workspace_tenant_id' supabase/functions/community-api/index.ts
          grep -Fq 'x-ekodi-workspace' supabase/functions/community-api/index.ts
          grep -Fq 'handleReading(req, path' supabase/functions/community-api/index.ts
          deno check --node-modules-dir=auto supabase/functions/community-api/index.ts
          node --test test/community-reading-*.test.mjs

  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 17
    environment: production
    env:
      TOKEN_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_B: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_C: ${{ secrets.SUPABASE_PAT }}
      TOKEN_D: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: ${{ inputs.release_branch_ref }}
      RELEASE_TASK: ${{ inputs.release_task_id }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Guard exact main commit and EKODI orchestrator release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$RELEASE_BRANCH" =~ ^ai/[A-Za-z0-9._-]+/orch_[A-Za-z0-9_-]+$ ]]
          [[ "$RELEASE_TASK" =~ ^orch_[A-Za-z0-9_-]+$ ]]
          test "${RELEASE_BRANCH##*/}" = "$RELEASE_TASK"
          branch_enc="$(printf '%s' "$RELEASE_BRANCH" | jq -sRr @uri)"
          task_enc="$(printf '%s' "$RELEASE_TASK" | jq -sRr @uri)"
          curl --fail-with-body -sS --retry 2 --max-time 20             "https://ekodi.kr/api/orchestrator/release-receipt?taskId=$task_enc&branchRef=$branch_enc" |
            jq -e --arg task "$RELEASE_TASK" --arg branch "$RELEASE_BRANCH"               '.ok==true and .authorized==true and .authority=="ekodi-orchestrator" and .taskId==$task and .branchRef==$branch' >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_SHA"
          node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Select protected Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-${TOKEN_D:-}}}}"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Refuse API promotion unless production reading RLS and RPC exist
        shell: bash
        run: |
          set -euo pipefail
          sql="select (select count(*)=4 and bool_and(c.relrowsecurity) and bool_and(not has_table_privilege('anon',c.oid,'select')) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('community_reading_meetings','community_reading_entries','community_reading_attendance','community_reading_audit')) as safe, to_regprocedure('public.community_reading_review_member(uuid,uuid,uuid,text)') is not null as approval_ready"
          body="$(jq -n --arg query "$sql" '{query:$query,read_only:true}')"
          code="$(curl -sS -o /tmp/reading-db-proof.json -w '%{http_code}' --max-time 40 -X POST             "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")"
          test "$code" = '201'
          jq -e 'length==1 and .[0].safe==true and .[0].approval_ready==true' /tmp/reading-db-proof.json >/dev/null
      - name: Record current production API version
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail-with-body -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/community-api")"
          before="$(jq -r '.version' <<<"$meta")"
          [[ "$before" =~ ^[0-9]+$ ]]
          echo "BEFORE_VERSION=$before" >> "$GITHUB_ENV"
      - name: Deploy Community API through the official Supabase lane
        run: npx --yes supabase@2.116.0 functions deploy community-api --project-ref "$PROJECT_REF"
      - name: Verify live JWT and canonical CORS after deployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail-with-body -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/community-api")"
          version="$(jq -r '.version' <<<"$meta")"
          status="$(jq -r '.status' <<<"$meta")"
          jwt="$(jq -r '.verify_jwt' <<<"$meta")"
          test "$status" = 'ACTIVE'
          test "$jwt" = 'true'
          [[ "$version" =~ ^[0-9]+$ ]]
          if git diff HEAD~1 HEAD --name-only -- supabase/functions/community-api/ | grep -q .; then
            test "$version" -gt "$BEFORE_VERSION"
          fi
          endpoint="https://$PROJECT_REF.supabase.co/functions/v1/community-api"
          code=$(curl -sS -o /tmp/reading-unauth.json -w '%{http_code}' --max-time 20             "$endpoint/circles/11111111-1111-4111-8111-111111111111/reading" -H "apikey: $PUBLISHABLE_KEY")
          test "$code" = '401'
          code=$(curl -sS -D /tmp/reading-cors.headers -o /dev/null -w '%{http_code}' --max-time 20             -X OPTIONS "$endpoint/profile" -H 'Origin: https://ekodi.kr'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-ekodi-workspace')
          [[ "$code" =~ ^(200|204)$ ]]
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://ekodi\.kr[[:space:]]*$' /tmp/reading-cors.headers
          grep -Eiq '^access-control-allow-headers:.*x-ekodi-workspace' /tmp/reading-cors.headers
          echo "Community API v$version verified; unauthorized reading endpoint denied."
      - name: Recover previous guarded code after failed verification
        if: failure() && steps.verify.conclusion == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- supabase/functions/community-api
          npx --yes supabase@2.116.0 functions deploy community-api --project-ref "$PROJECT_REF"
          echo 'Rollback to preceding protected Community API source dispatched.'
