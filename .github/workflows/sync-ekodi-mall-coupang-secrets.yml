name: EKODI Mall · Sync Coupang Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ekodi-mall-coupang-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-coupang-secrets-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COUPANG_ACCESS_KEY:-}" ] && [ -n "${COUPANG_SECRET_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Coupang Partners credentials are present in GitHub Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'COUPANG_ACCESS_KEY and/or COUPANG_SECRET_KEY are not configured in GitHub Actions secrets. No Worker secret mutation was attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync secrets to staging Worker
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_ACCESS_KEY --name ekodi-mall-api-staging
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_SECRET_KEY --name ekodi-mall-api-staging

      - name: Sync secrets to production Worker
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_ACCESS_KEY --name ekodi-mall-api
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_SECRET_KEY --name ekodi-mall-api

      - name: Report safe state
        shell: bash
        run: |
          if [ "${{ steps.coupang.outputs.configured }}" = 'true' ]; then
            echo 'Coupang Partners secrets synchronized to staging and production Mall Workers.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mall remains operational without Coupang API credentials; affiliate API automation stays unavailable until the two encrypted GitHub secrets exist.' >> "$GITHUB_STEP_SUMMARY"
          fi
