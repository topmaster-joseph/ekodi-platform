name: EKODI Mall · Sync Coupang Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ekodi-mall-coupang-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-mall-coupang-secrets-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '46aad4738793fbaca88574832a2ccc0f'
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Development Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'

      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COUPANG_ACCESS_KEY:-}" ] && [ -n "${COUPANG_SECRET_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Coupang Partners credentials are present in encrypted GitHub Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'COUPANG_ACCESS_KEY and/or COUPANG_SECRET_KEY are not configured. Development Worker secret mutation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync secrets to Development staging Worker
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_ACCESS_KEY --name ekodi-mall-api-staging
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_SECRET_KEY --name ekodi-mall-api-staging
          echo 'Coupang Partners secrets synchronized to the Development staging Worker.' >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: development
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Detect Coupang Partners credentials
        id: coupang
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COUPANG_ACCESS_KEY:-}" ] && [ -n "${COUPANG_SECRET_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'COUPANG_ACCESS_KEY and/or COUPANG_SECRET_KEY are not configured. Production Worker secret mutation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync secrets to Production Worker
        if: steps.coupang.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COUPANG_ACCESS_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_ACCESS_KEY --name ekodi-mall-api
          printf '%s' "$COUPANG_SECRET_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put COUPANG_SECRET_KEY --name ekodi-mall-api
          echo 'Coupang Partners secrets synchronized to the Production Mall Worker.' >> "$GITHUB_STEP_SUMMARY"

      - name: Report safe no-key state
        if: steps.coupang.outputs.configured != 'true'
        run: echo 'Mall remains operational; Coupang API automation stays fail-closed until both encrypted credentials exist.' >> "$GITHUB_STEP_SUMMARY"
