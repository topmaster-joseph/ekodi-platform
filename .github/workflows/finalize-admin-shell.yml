name: Finalize Canonical Admin Shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-admin-shell.yml

permissions:
  contents: write

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  finalize-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Canonicalize current admin shell
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          const move = (from, to) => {
            if (!fs.existsSync(from)) return;
            if (fs.existsSync(to)) throw new Error(`target already exists: ${to}`);
            fs.renameSync(from, to);
          };
          const read = path => fs.readFileSync(path, 'utf8');
          const write = (path, source) => fs.writeFileSync(path, source);
          const patch = (path, transform) => {
            const before = read(path);
            const after = transform(before);
            if (after !== before) write(path, after);
          };

          move('control-center.html', 'admin-shell.html');
          move('control-center.css', 'admin-shell.css');
          move('control-center-finance.css', 'admin-finance.css');
          move('compact-control-center.css', 'admin-compact.css');

          const tracked = cp.execFileSync('git', ['ls-files'], { encoding:'utf8' })
            .split(/\r?\n/).filter(Boolean)
            .filter(path => fs.existsSync(path) && fs.statSync(path).isFile())
            .filter(path => !path.startsWith('.github/workflows/finalize-admin-shell.yml'));
          const textExt = /\.(?:js|mjs|cjs|html|css|json|yml|yaml|md|txt)$/i;
          for (const path of tracked) {
            if (!textExt.test(path)) continue;
            let source;
            try { source = read(path); } catch { continue; }
            let next = source
              .replaceAll('control-center-finance.css', 'admin-finance.css')
              .replaceAll('control-center.css', 'admin-shell.css')
              .replaceAll('compact-control-center.css', 'admin-compact.css')
              .replaceAll('compact-control-center.js', 'admin-compact.js')
              .replaceAll('compact-control-center', 'admin-compact')
              .replace(/(?<!\/)control-center\.html/g, 'admin-shell.html');
            if (next !== source) write(path, next);
          }

          patch('admin-shell.html', source => source
            .replaceAll('EKODI Control Center', 'EKODI Admin')
            .replaceAll('CONTROL CENTER', 'ADMIN')
            .replaceAll('EKODI 중앙 관제실입니다.', 'EKODI 관리자 운영 화면입니다.'));

          patch('admin-authenticated-shell.js', source => {
            let next = source;
            next = next.replace("const criticalPostAuthScripts = ['admin-compact.js','admin-menu-layout.js','admin-demand-loader.js'];", "const criticalPostAuthScripts = ['admin-menu-layout.js','admin-demand-loader.js'];");
            next = next.replace(/function canonicalizeLegacyEntry\(\)\{[^\n]*\}\n/, '');
            next = next.replaceAll('canonicalizeLegacyEntry();', '');
            return next;
          });

          patch('site-worker.js', source => {
            let next = source;
            next = next.replaceAll("assetRequest(request, '/control-center')", "assetRequest(request, '/admin-shell')");
            next = next.replaceAll("'admin-control-center'", "'admin-shell'");
            next = next.replace("  '/control-center-ops.css',\n]);", "  '/control-center-ops.css',\n  '/control-center.css',\n  '/control-center-finance.css',\n  '/compact-control-center.css',\n  '/compact-control-center.js',\n]);");
            next = next.replace("  '/admin-compact.js',\n", '');
            return next;
          });

          patch('scripts/build.mjs', source => source
            .replaceAll("asset === 'control-center.html'", "asset === 'admin-shell.html'")
            .replaceAll('minimal pre-auth Control Center', 'minimal pre-auth Admin Shell'));

          patch('scripts/validate-admin-source.mjs', source => {
            let next = source;
            next = next.replace("  'control-center-ops.css',\n];", "  'control-center-ops.css',\n  'control-center.html',\n  'control-center.css',\n  'control-center-finance.css',\n  'compact-control-center.css',\n];");
            next = next.replace("'/control-center-ops.css']", "'/control-center-ops.css','/control-center.css','/control-center-finance.css','/compact-control-center.css','/compact-control-center.js']");
            return next;
          });

          patch('test/admin-central-login-link.test.mjs', source => source
            .replace("const html = await read('control-center.html');", "const html = await read('admin-shell.html');"));

          if (fs.existsSync('.github/workflows/finalize-admin-shell.yml')) fs.rmSync('.github/workflows/finalize-admin-shell.yml');

          const required = ['admin-shell.html','admin-shell.css','admin-finance.css','admin-compact.css'];
          for (const path of required) if (!fs.existsSync(path)) throw new Error(`canonical admin asset missing: ${path}`);
          const retired = ['control-center.html','control-center.css','control-center-finance.css','compact-control-center.css'];
          for (const path of retired) if (fs.existsSync(path)) throw new Error(`legacy admin asset survived: ${path}`);
          const shell = read('admin-shell.html');
          if (!shell.includes('<title>EKODI Admin</title>')) throw new Error('canonical admin title missing');
          if (!shell.includes('admin-shell.css')) throw new Error('canonical shell stylesheet reference missing');
          const auth = read('admin-authenticated-shell.js');
          if (auth.includes('canonicalizeLegacyEntry') || auth.includes('compact-control-center')) throw new Error('legacy authenticated shell residue survived');
          const worker = read('site-worker.js');
          if (!worker.includes("assetRequest(request, '/admin-shell')")) throw new Error('admin edge does not serve canonical shell');
          for (const oldPath of ['/control-center','/control-center.html','/control-center.css','/control-center-finance.css','/compact-control-center.css','/compact-control-center.js']) {
            if (!worker.includes(`'${oldPath}'`)) throw new Error(`retired path is not fail-closed: ${oldPath}`);
          }
          NODE
      - name: Validate canonical admin source
        run: |
          set -euo pipefail
          npm run check
          npm run build
          node --test test/admin-central-login-link.test.mjs test/admin-ai-first-navigation.test.mjs test/admin-free-ops-nav.contract.test.mjs
          test -f dist/admin-shell.html
          test -f dist/admin-shell.css
          test -f dist/admin-finance.css
          test -f dist/admin-compact.css
          test ! -e dist/control-center.html
          test ! -e dist/control-center.css
          test ! -e dist/control-center-finance.css
          test ! -e dist/compact-control-center.css
          grep -Fq '<title>EKODI Admin</title>' dist/admin-shell.html
          grep -Fq 'admin-shell.css' dist/admin-shell.html
          ! grep -Fq 'compact-control-center' dist/admin-authenticated-shell.js
      - name: Commit canonical admin source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(admin): finalize canonical admin shell'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy canonical admin shell
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production canonical shell
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            root=$(curl -sS -o /tmp/admin-root -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/?canonical=${nonce}" || true)
            shell_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-shell.css?canonical=${nonce}" || true)
            finance_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-finance.css?canonical=${nonce}" || true)
            compact_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/admin-compact.css?canonical=${nonce}" || true)
            old_html=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.html?canonical=${nonce}" || true)
            old_route=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center?canonical=${nonce}" || true)
            old_css=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center.css?canonical=${nonce}" || true)
            old_finance=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/control-center-finance.css?canonical=${nonce}" || true)
            old_compact=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.css?canonical=${nonce}" || true)
            title=no
            grep -Fq '<title>EKODI Admin</title>' /tmp/admin-root && title=yes || true
            echo "canonical admin -> root=$root assets=$shell_css/$finance_css/$compact_css retired=$old_html/$old_route/$old_css/$old_finance/$old_compact title=$title"
            if [ "$root" = '200' ] && [ "$shell_css" = '200' ] && [ "$finance_css" = '200' ] && [ "$compact_css" = '200' ] && [ "$old_html" = '404' ] && [ "$old_route" = '404' ] && [ "$old_css" = '404' ] && [ "$old_finance" = '404' ] && [ "$old_compact" = '404' ] && [ "$title" = yes ]; then exit 0; fi
            sleep 4
          done
          exit 1
