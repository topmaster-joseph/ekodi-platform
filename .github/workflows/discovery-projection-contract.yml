name: Discovery Projection Contract

on:
  pull_request:
    paths:
      - 'discovery-layer.js'
      - 'public-discovery-runtime.js'
      - 'config/public-discovery-registry.json'
      - 'site-publication-runtime.js'
      - 'DISCOVERY_LAYER.md'
      - 'governance/security/discovery-secure-projection.md'
      - 'scripts/discovery-build.mjs'
      - 'test/discovery-layer.test.mjs'
      - 'test/public-discovery-runtime.test.mjs'
      - 'site-worker.js'
      - 'site-shell-worker.js'
      - '.github/workflows/discovery-projection-contract.yml'
  push:
    branches: [main]
    paths:
      - 'discovery-layer.js'
      - 'public-discovery-runtime.js'
      - 'config/public-discovery-registry.json'
      - 'site-publication-runtime.js'
      - 'DISCOVERY_LAYER.md'
      - 'governance/security/discovery-secure-projection.md'
      - 'scripts/discovery-build.mjs'
      - 'test/discovery-layer.test.mjs'
      - 'test/public-discovery-runtime.test.mjs'
      - 'site-worker.js'
      - 'site-shell-worker.js'
      - '.github/workflows/discovery-projection-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Discovery Secure Projection
        run: |
          set -euo pipefail
          node --check discovery-layer.js
          node --check public-discovery-runtime.js
          node --check site-publication-runtime.js
          node --test test/discovery-layer.test.mjs test/public-discovery-runtime.test.mjs
          npm run build
