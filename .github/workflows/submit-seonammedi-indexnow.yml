name: Submit SeonamMedi Search IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ekodi-search-index-submit.mjs'
      - '.github/workflows/submit-seonammedi-indexnow.yml'
      - 'scripts/discovery-build.mjs'
      - 'sites/seonammedi/public/**'
      - 'discovery-layer.js'
      - 'seonammedi-domain-gateway.js'
      - 'platform-indexnow.js'
  # Bot-generated protected merges use GITHUB_TOKEN and do not create push runs.
  # Listen for the official, receipt-verified customer-domain gateway deployment.
  workflow_run:
    workflows: ['Deploy SeonamMedi Domain Gateway (Manual Topology Change)']
    branches: [main]
    types: [completed]
  # Catch any completed deploy missed before this listener was introduced.
  # Scheduled runs submit only if a successful deploy is newer than last submission.
  schedule:
    - cron: '31 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-seonammedi-search-submit
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Submit only when a new guarded deploy is present
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != 'schedule' ]; then
            echo 'submit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          deployed=$(curl -fsS --retry 2 "${auth[@]}" "$api/deploy-seonammedi-domains.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].created_at // empty')
          submitted=$(curl -fsS --retry 2 "${auth[@]}" "$api/submit-seonammedi-indexnow.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].created_at // empty')
          if [ -z "$deployed" ] || { [ -n "$submitted" ] && [[ "$submitted" > "$deployed" ]]; }; then
            echo 'submit=false' >> "$GITHUB_OUTPUT"
            echo 'No new successful customer-domain deployment since last submission.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'submit=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate native IndexNow HTTP submission code
        if: steps.decision.outputs.submit == 'true'
        run: |
          node --check scripts/ekodi-search-index-submit.mjs
          node --test test/seonammedi-indexnow-batch.test.mjs
      - name: Verify public IndexNow key and Korean domain search metadata
        if: steps.decision.outputs.submit == 'true'
        run: |
          set -euo pipefail
          key=$(node --input-type=module -e "import('./platform-indexnow.js').then(m=>process.stdout.write(m.EKODI_INDEXNOW_KEY))")
          test -n "$key"
          idn='xn--3e0b8b58jw4co4mnpll3k.kr'
          body=$(curl -fsS --retry 3 --retry-delay 2 "https://$idn/$key.txt")
          test "$body" = "$key"
          # Do not use curl | grep -q with pipefail: grep quits on a match
          # and curl may fail with EPIPE / exit 23 despite valid SEO metadata.
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          curl -fsS --retry 3 --retry-delay 2 -o "$probe_dir/robots" "https://$idn/robots.txt"
          curl -fsS --retry 3 --retry-delay 2 -o "$probe_dir/sitemap" "https://$idn/sitemap.xml"
          curl -fsS --retry 3 --retry-delay 2 -o "$probe_dir/home" "https://$idn/"
          grep -Fq "Sitemap: https://$idn/sitemap.xml" "$probe_dir/robots"
          grep -Fq "<loc>https://$idn/</loc>" "$probe_dir/sitemap"
          grep -Fq "<link rel=\"canonical\" href=\"https://$idn/\">" "$probe_dir/home"
      - name: Submit canonical SeonamMedi URL from EKODI isolated browser
        if: steps.decision.outputs.submit == 'true'
        run: node scripts/ekodi-search-index-submit.mjs
