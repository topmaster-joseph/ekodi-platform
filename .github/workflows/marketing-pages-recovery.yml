name: Marketing AI Production Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketing-pages-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: marketing-ai-production-recovery
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve latest Marketing AI source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(curl -fsS \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/topmaster-joseph/jadam-maru/commits/main' \
            | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: topmaster-joseph/jadam-maru
          ref: ${{ steps.source.outputs.sha }}
          path: marketing-source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build exact source and validate contracts
        working-directory: marketing-source
        run: npm run build

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy four production Pages projects
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.source.outputs.sha }}'
          deploy_one() {
            project="$1"; dir="$2"
            npx --yes wrangler@$WRANGLER_VERSION pages deploy "$dir" \
              --project-name "$project" \
              --branch main \
              --commit-hash "$sha" \
              --commit-message "Marketing AI CSS recovery $sha"
          }
          deploy_one marketing-ai marketing-source/dist/marketing-ai
          deploy_one marketing-ai-jadam marketing-source/dist/marketing-ai/jadam
          deploy_one marketing-ai-pizzamaru marketing-source/dist/marketing-ai/pizzamaru
          deploy_one marketing-ai-yogurtpurple marketing-source/dist/marketing-ai/yogurtpurple

      - name: Verify live HTML, CSS and JS on Pages and canonical domains
        shell: bash
        run: |
          set -euo pipefail
          short='${{ steps.source.outputs.short }}'

          fetch_asset() {
            url="$1"; kind="$2"; marker="$3"
            curl -L -fsS -D /tmp/headers -o /tmp/asset \
              --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' "${url}?ekodi_verify=$short"
            if [ "$kind" = css ]; then
              grep -Eiq '^content-type:[[:space:]]*text/css' /tmp/headers
            else
              grep -Eiq '^content-type:.*(javascript|ecmascript)' /tmp/headers
            fi
            grep -Fq "$marker" /tmp/asset
          }

          verify_domain() {
            domain="$1"; ui="$2"; kind="$3"
            curl -L -fsS -o /tmp/page \
              --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' "https://$domain/?ekodi_verify=$short"
            grep -Fq "data-ekodi-build-sha=\"$short\"" /tmp/page
            grep -Fq "data-ekodi-ui-classification=\"$ui\"" /tmp/page
            grep -Fq 'data-ekodi-asset-routing="same-origin"' /tmp/page
            grep -Fq 'href="/official-ui.css?v=' /tmp/page
            grep -Fq 'src="/official-ui.js?v=' /tmp/page
            fetch_asset "https://$domain/official-ui.css" css 'EKODI official USER UI / ADMIN UI governance layer'
            fetch_asset "https://$domain/official-ui.js" js 'EKODI'
            if [ "$kind" = tenant ]; then
              grep -Fq 'data-ekodi-admin-context' /tmp/page
              grep -Fq 'href="/site.css?v=' /tmp/page
              grep -Fq 'src="/shell-style.js?v=' /tmp/page
              fetch_asset "https://$domain/site.css" css 'Generated by scripts/patch-marketing-style-assets.mjs'
              fetch_asset "https://$domain/shell-style.js" js 'data-ekodi-shell-external-style'
            fi
          }

          verified=0
          for attempt in $(seq 1 24); do
            ok=1
            for spec in \
              'marketing-ai.pages.dev|USER UI|hub' \
              'marketing-ai-jadam.pages.dev|ADMIN UI|tenant' \
              'marketing-ai-pizzamaru.pages.dev|ADMIN UI|tenant' \
              'marketing-ai-yogurtpurple.pages.dev|ADMIN UI|tenant' \
              'marketing.ekodi.kr|USER UI|hub' \
              'jadam.ekodi.kr|ADMIN UI|tenant' \
              'jadam.ai.ekodi.kr|ADMIN UI|tenant' \
              'pizzamaru.ekodi.kr|ADMIN UI|tenant' \
              'pizzamaru.ai.ekodi.kr|ADMIN UI|tenant' \
              'yogurt.ekodi.kr|ADMIN UI|tenant' \
              'yogurt.ai.ekodi.kr|ADMIN UI|tenant'; do
              domain="${spec%%|*}"; rest="${spec#*|}"; ui="${rest%%|*}"; kind="${rest#*|}"
              if ! verify_domain "$domain" "$ui" "$kind"; then
                echo "$domain not converged yet, attempt=$attempt"
                ok=0
              else
                echo "verified $domain"
              fi
            done
            if [ "$ok" -eq 1 ]; then verified=1; break; fi
            sleep 5
          done
          test "$verified" = 1

      - name: Record recovery success
        if: success()
        shell: bash
        run: |
          gh issue comment 448 --repo "$GITHUB_REPOSITORY" --body "✅ Marketing AI production CSS recovery verified · source \`${{ steps.source.outputs.short }}\` · four Cloudflare Pages projects + seven canonical domains · same-origin CSS/JS + MIME + USER/ADMIN UI contracts passed · ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close 448 --repo "$GITHUB_REPOSITORY" --reason completed
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Record recovery failure
        if: failure()
        run: gh issue comment 448 --repo "$GITHUB_REPOSITORY" --body "❌ Marketing AI production CSS recovery failed · source \`${{ steps.source.outputs.short }}\` · ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}
