name: EKODI Jubilee Publisher Author Bindings
# One-time audited production identity bootstrap. No PR, branch, or unverified
# actor can invoke the production configuration lane.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publishing-jubilee-author-bindings.yml'
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: 'Exact EKODI Orchestrator released source branch'
        required: true
        type: string
      release_task_id:
        description: 'Exact EKODI Orchestrator release task ID'
        required: true
        type: string

permissions:
  contents: read

env:
  EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
  EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}

concurrency:
  group: ekodi-publishing-production
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLISHING_JUBILEE_AUTHOR_USER_ID: ${{ secrets.PUBLISHING_JUBILEE_AUTHOR_USER_ID }}
      PUBLISHING_JUBILEE_AUTHOR_ALIASES: ${{ secrets.PUBLISHING_JUBILEE_AUTHOR_ALIASES }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Validate verified publisher identity credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/validate-jubilee-author-credentials.mjs
      - name: Bind two linked logins to the single private author (no source exposure)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          SECRET_FILE="$secret_file" node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {validateJubileeAuthorBindings} from './scripts/validate-jubilee-author-credentials.mjs';
          const checked=validateJubileeAuthorBindings(
            process.env.PUBLISHING_JUBILEE_AUTHOR_USER_ID,
            process.env.PUBLISHING_JUBILEE_AUTHOR_ALIASES
          );
          writeFileSync(process.env.SECRET_FILE,JSON.stringify({
            PUBLISHING_JUBILEE_AUTHOR_USER_ID:checked.owner,
            PUBLISHING_JUBILEE_AUTHOR_ALIASES:JSON.stringify(checked.aliases)
          }),{mode:0o600});
          NODE
          npx --yes wrangler@4.119.0 secret bulk "$secret_file" --config wrangler.publishing.toml
      - name: Verify secret names on deployed Publishing Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 secret list --config wrangler.publishing.toml > "$RUNNER_TEMP/publishing-secret-names.txt"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=readFileSync(process.env.RUNNER_TEMP+'/publishing-secret-names.txt','utf8');
          for(const name of ['PUBLISHING_JUBILEE_AUTHOR_USER_ID','PUBLISHING_JUBILEE_AUTHOR_ALIASES']){
            if(!report.includes('"'+name+'"'))throw Error('JUBILEE_REQUIRED_WORKER_BINDING_MISSING');
          }
          process.stdout.write('Both protected Worker binding names present (values never logged).\n');
          NODE
      - name: Verify public Publishing health and guest isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://ekodi.kr/publishing/api/workflow/health | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const p=JSON.parse(s);if(!p.ok||!p.dbConfigured||p.saleActivationEnabled!==false)process.exit(1);
              console.log("Publishing operational; sales remain disabled");
            })'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' -d '{}' https://ekodi.kr/publishing/api/workflow/jubilee/register)
          test "$code" = "401"
          echo "Unauthenticated Jubilee registration remains denied."
