name: Marketing Ledger Control Dispatch

on:
  push:
    branches: [main]
    paths:
      - 'marketing-ledger-control.js'
      - 'test/marketing-ledger-contract.test.mjs'
      - '.github/workflows/marketing-ledger-control-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: marketing-ledger-control-dispatch
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Marketing ledger control contract
        run: |
          set -euo pipefail
          node --check marketing-ledger-control.js
          node --test test/marketing-ledger-contract.test.mjs
          grep -Fq '/api/marketing/ledger/overview' marketing-ledger-control.js
          grep -Fq '/api/marketing/ledger/events' marketing-ledger-control.js
          grep -Fq '/api/marketing/ledger/campaigns' marketing-ledger-control.js
          grep -Fq "'human_gate'" marketing-ledger-control.js
          grep -Fq 'externalExecution:false' marketing-ledger-control.js

  dispatch-control-api:
    needs: validate-and-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # CONTROL-API-DISPATCH-DEDUPE-001: one Control API dispatch per SHA across all callers.
    concurrency:
      group: control-api-release-dispatch-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # CONTROL-API-DISPATCH-RECEIPT-001: dispatch with the merged orchestrator receipt.
      - name: Dispatch guarded Control API workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-control-api-release.mjs
