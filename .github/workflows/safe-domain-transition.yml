name: Safe EKODI Domain Transition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-domain-transition.yml'

permissions:
  contents: write

jobs:
  rollback-live-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve working legacy service links
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'mall.ekodi.kr': 'ekodimall.kr',
              'books.ekodi.kr': 'ekodibook.kr',
              'church.ekodi.kr': 'ekodichurch.kr',
              'lab.ekodi.kr': 'ekodilab.kr',
          }
          for filename in ['index.html', 'scripts/monitor-lib.mjs']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for new, old in replacements.items():
                  text = text.replace(new, old)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify application
        run: |
          npm run check
          npm test
      - name: Commit safe transition
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/monitor-lib.mjs
          git commit -m 'Keep legacy service links until subdomains activate'
          git push
      - name: Deploy platform site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:site
