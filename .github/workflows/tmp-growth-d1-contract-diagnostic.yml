name: Temporary Growth D1 Contract Diagnostic

on:
  push:
    branches:
      - ai/chatgpt/diagnose-growth-d1-contract-20260916
    paths:
      - .github/workflows/tmp-growth-d1-contract-diagnostic.yml

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/chatgpt/diagnose-growth-d1-contract-20260916
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --ci
      - name: Read non-secret production growth contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== publish policies ==='
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.marketing-growth.toml \
            --command "SELECT subject_type,subject_key,mode,enabled,max_posts_per_day FROM marketing_publish_policies WHERE subject_key IN ('ekodi-biz','ekodibiz','ekodimall','ekoditrade') ORDER BY subject_key;" --json
          echo '=== tenant domains ==='
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --config wrangler.marketing-growth.toml \
            --command "SELECT slug,domain,status FROM customer_tenants WHERE slug IN ('ekodi-biz','ekodibiz','ekodimall','ekoditrade') ORDER BY slug;" --json
