name: Cleanup Safe Exact Production Staging Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-safe-exact-production-staging-once.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      TARGETS: ekodi-management-staging ekodi-my-staging
    steps:
      - uses: actions/checkout@v7

      - name: Prove source recurrence is closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              '.github/workflows/deploy-management.yml': [
                  'environment: development',
                  'secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN',
                  '46aad4738793fbaca88574832a2ccc0f',
                  'https://ekodi-management-staging.ekodi-development.workers.dev',
              ],
              '.github/workflows/deploy-my.yml': [
                  'environment: development',
                  'secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN',
                  '46aad4738793fbaca88574832a2ccc0f',
                  'https://ekodi-my-staging.ekodi-development.workers.dev',
              ],
          }
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'HOLD: {filename} missing {marker}')
          if 'ekodi-management-staging.topmaster-joseph.workers.dev' in Path('.github/workflows/deploy-management.yml').read_text(encoding='utf-8'):
              raise SystemExit('HOLD: management still points to Production workers.dev')
          if 'ekodi-my-staging.topmaster-joseph.workers.dev' in Path('.github/workflows/deploy-my.yml').read_text(encoding='utf-8'):
              raise SystemExit('HOLD: my still points to Production workers.dev')
          print('SOURCE_RECURRENCE_CLOSED=1')
          PY

      - name: Prove Cloudflare dependency safety
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_ACCOUNT_ID"
          test -n "$PROD_TOKEN"
          test -n "$DEV_TOKEN"
          test "$PROD_ACCOUNT_ID" != "$DEV_ACCOUNT_ID"

          api='https://api.cloudflare.com/client/v4'
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod-workers.json
          curl -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev-workers.json
          jq -e '.success == true' /tmp/prod-workers.json >/dev/null
          jq -e '.success == true' /tmp/dev-workers.json >/dev/null

          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains.json
          jq -e '.success == true' /tmp/domains.json >/dev/null

          curl -fsS "${prod_auth[@]}" "$api/zones?account.id=$PROD_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          jq -e '.success == true' /tmp/zones.json >/dev/null
          : > /tmp/routes.ndjson
          jq -r '.result[]? | [.id,.name] | @tsv' /tmp/zones.json | while IFS=$'\t' read -r zid zname; do
            [ -n "$zid" ] || continue
            curl -fsS "${prod_auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/zone-routes.json
            jq -e '.success == true' /tmp/zone-routes.json >/dev/null
            jq -c --arg zone "$zname" '.result[]? | {zone:$zone,pattern:.pattern,script:.script}' /tmp/zone-routes.json >> /tmp/routes.ndjson
          done

          : > /tmp/inbound.tsv
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            safe=$(printf '%s' "$script" | tr '/:' '__')
            curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$script/settings" -o "/tmp/settings-$safe.json"
            jq -e '.success == true' "/tmp/settings-$safe.json" >/dev/null
            for target in $TARGETS; do
              n=$(jq --arg target "$target" '[.result.bindings[]? | select(.type == "service" and ((.service // .service_name) == $target))] | length' "/tmp/settings-$safe.json")
              if [ "$n" != '0' ]; then printf '%s\t%s\t%s\n' "$script" "$target" "$n" >> /tmp/inbound.tsv; fi
            done
          done < <(jq -r '.result[]?.id' /tmp/prod-workers.json)

          for target in $TARGETS; do
            jq -e --arg s "$target" '.result[] | select(.id == $s)' /tmp/dev-workers.json >/dev/null || {
              echo "HOLD: Development counterpart missing: $target"
              exit 1
            }

            if ! jq -e --arg s "$target" '.result[] | select(.id == $s)' /tmp/prod-workers.json >/dev/null; then
              echo "$target" >> /tmp/already-absent.txt
              echo "ALREADY_ABSENT: $target"
              continue
            fi

            curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$target/settings" -o /tmp/target-settings.json
            jq -e '.success == true' /tmp/target-settings.json >/dev/null
            risky=$(jq '[.result.bindings[]? | select(.type != "assets" and .type != "plain_text")] | length' /tmp/target-settings.json)
            test "$risky" = '0' || { echo "HOLD: $target risky bindings=$risky"; jq '.result.bindings' /tmp/target-settings.json; exit 1; }

            domains=$(jq --arg s "$target" '[.result[]? | select((.service // .script // .service_name) == $s)] | length' /tmp/domains.json)
            test "$domains" = '0' || { echo "HOLD: $target custom domains=$domains"; exit 1; }

            routes=$(jq -s --arg s "$target" '[.[] | select(.script == $s)] | length' /tmp/routes.ndjson)
            test "$routes" = '0' || { echo "HOLD: $target routes=$routes"; exit 1; }

            inbound=$(awk -F '\t' -v t="$target" '$2==t {sum+=$3} END {print sum+0}' /tmp/inbound.tsv)
            test "$inbound" = '0' || { echo "HOLD: $target inbound service bindings=$inbound"; cat /tmp/inbound.tsv; exit 1; }

            curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$target/schedules" -o /tmp/prod-schedules.json
            curl -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/$target/schedules" -o /tmp/dev-schedules.json
            jq -e '.success == true' /tmp/prod-schedules.json >/dev/null
            jq -e '.success == true' /tmp/dev-schedules.json >/dev/null
            prod_sched=$(jq -cS '.result' /tmp/prod-schedules.json)
            dev_sched=$(jq -cS '.result' /tmp/dev-schedules.json)
            test "$prod_sched" = "$dev_sched" || { echo "HOLD: $target schedule mismatch"; echo "prod=$prod_sched"; echo "dev=$dev_sched"; exit 1; }

            echo "SAFE_TO_DELETE: $target domains=$domains routes=$routes risky=$risky inbound=$inbound"
          done

      - name: Delete only verified Production residues
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          touch /tmp/already-absent.txt
          for target in $TARGETS; do
            if grep -Fxq "$target" /tmp/already-absent.txt; then
              echo "Skip already absent: $target"
              continue
            fi
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$target")
            test "$code" = '200' || { cat /tmp/delete.json; echo "Delete failed $target HTTP $code"; exit 1; }
            jq -e '.success == true' /tmp/delete.json >/dev/null
            echo "DELETED: $target"
          done

      - name: Verify Development survives and inventory Production
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod-after.json
          curl -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev-after.json
          jq -e '.success == true' /tmp/prod-after.json >/dev/null
          jq -e '.success == true' /tmp/dev-after.json >/dev/null
          for target in $TARGETS; do
            if jq -e --arg s "$target" '.result[] | select(.id == $s)' /tmp/prod-after.json >/dev/null; then
              echo "Verification failed: $target still exists in Production"
              exit 1
            fi
            jq -e --arg s "$target" '.result[] | select(.id == $s)' /tmp/dev-after.json >/dev/null || {
              echo "Verification failed: Development counterpart missing: $target"
              exit 1
            }
          done
          jq -r '.result[]?.id | select(endswith("-staging") or contains("-staging-"))' /tmp/prod-after.json | sort | tee /tmp/remain.txt
          count=$(wc -l < /tmp/remain.txt | tr -d ' ')
          echo "REMAINING_PRODUCTION_STAGING=$count"
          {
            echo '## Safe exact staging cleanup'
            echo
            echo '- Removed from Production: `ekodi-management-staging`, `ekodi-my-staging`'
            echo '- Development counterparts preserved: **yes**'
            echo "- Remaining Production staging-named Workers: **$count**"
            echo
            sed 's/^/- `/' /tmp/remain.txt | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
