name: Integrate Remote Power Control

on:
  push:
    branches: [feat/remote-power-wol]
    paths:
      - remote-power-control.js
      - remote-power-admin.js
      - remote-power-admin.css
      - tools/remote-power-relay/**
      - tools/apply-remote-power-patch.mjs
      - .github/workflows/remote-power-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remote-power-wol
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Apply idempotent integration patch
        run: node tools/apply-remote-power-patch.mjs
      - name: Verify syntax
        run: |
          node --check remote-power-control.js
          node --check remote-power-admin.js
          node --check tools/remote-power-relay/relay.mjs
          node --check api-worker.js
          node --check admin-lazy-features.js
      - name: Commit generated integration changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-worker.js admin-lazy-features.js .dev.vars.example
          git commit -m 'feat: wire remote power control into admin and API'
          git push origin HEAD:feat/remote-power-wol
