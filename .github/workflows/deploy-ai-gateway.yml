name: Validate AI Runtime Boundary

on:
  pull_request:
    paths: &ai_runtime_paths
      - 'ai-control-worker.js'
      - 'wrangler.ai*.toml'
      - 'wrangler.site.toml'
      - 'platform-router-entry-worker.js'
      - 'deploy/manifests/ai-control.worker.json'
      - 'test/ai-runtime-boundary.test.mjs'
      - '.github/workflows/deploy-ai-gateway.yml'
      - '.github/workflows/verify-ai-gateway-production.yml'
  push:
    branches: [main]
    paths: *ai_runtime_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate single AI Runtime owner and production contract
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-control-worker.js
          node --check platform-router-entry-worker.js
          node --test test/ai-runtime-boundary.test.mjs
          grep -Fq 'pattern = "ai.ekodi.kr"' wrangler.ai.release.toml
          ! grep -Fq 'pattern = "ai.ekodi.kr"' wrangler.site.toml
          grep -Fq "route=common-services&service=ai" ai-control-worker.js
          grep -Fq "surface:'runtime-only'" ai-control-worker.js
          grep -Fq 'operator_surface_moved' ai-control-worker.js
          grep -Fq 'service_local_auth_retired' ai-control-worker.js
          test ! -e ai-gateway-page.js
          ! grep -Fq 'ai-gateway-page.js' platform-router-entry-worker.js
          ! grep -Fq 'AI_GATEWAY_HOST' platform-router-entry-worker.js
      - name: Verify deployment ownership guardrails
        run: node scripts/validate-deployment-guardrails.mjs
