name: Validate AI Runtime Boundary

on:
  pull_request:
    paths: &ai_runtime_paths
      - 'ai-control-worker.js'
      - 'ai-control-provider-router.js'
      - 'ekodi-ai-provider-registry.js'
      - 'openai-provider-adapter.js'
      - 'anthropic-provider-adapter.js'
      - 'gemini-orchestrator-provider-adapter.js'
      - 'test/ai-control-provider-router.test.mjs'
      - 'ai-commons.js'
      - 'ai-control/**'
      - 'site-worker.js'
      - 'platform-route-registry.js'
      - 'wrangler.ai*.toml'
      - 'wrangler.site.toml'
      - 'deploy/manifests/ai-control.worker.json'
      - 'test/ai-runtime-boundary.test.mjs'
      - '.github/workflows/deploy-ai-gateway.yml'
      - '.github/workflows/verify-ai-gateway-production.yml'
  push:
    branches: [main]
    paths: *ai_runtime_paths
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate canonical AI Commons boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-control-worker.js
          node --check ai-control-provider-router.js
          node --check gemini-orchestrator-provider-adapter.js
          node --test test/ai-control-provider-router.test.mjs
          node --check site-worker.js
          node --test test/ai-runtime-boundary.test.mjs
          ! grep -Fq 'pattern = "ai.ekodi.kr"' wrangler.ai.release.toml
          grep -Fq 'binding = "AI"' wrangler.site.toml
          grep -Fq 'service = "ekodi-ai-control"' wrangler.site.toml
          grep -Fq '"/ai"' wrangler.site.toml
          grep -Fq '"/ai/*"' wrangler.site.toml
          ! grep -Fq '"/ai*"' wrangler.site.toml
          grep -Fq "surface:'runtime-and-commons'" ai-control-worker.js
          grep -Fq 'commons:true' ai-control-worker.js
          grep -Fq "url.pathname === '/ai'" site-worker.js
          grep -Fq "url.pathname.startsWith('/ai/')" site-worker.js
          grep -Fq 'env.AI.fetch' site-worker.js
          grep -Fq "'ai','bible'" platform-route-registry.js
          test ! -e ai-gateway-page.js
      - name: Verify deployment ownership guardrails
        run: node scripts/validate-deployment-guardrails.mjs
