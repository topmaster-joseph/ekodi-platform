name: Validate Admin First Paint Guard

on:
  workflow_dispatch:
  pull_request:
    paths: &first_paint_paths
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'control-center.html'
      - 'compact-control-center.js'
      - '.github/workflows/deploy-admin-first-paint.yml'
  push:
    branches: [main]
    paths: *first_paint_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate admin first-paint guard
        run: |
          set -euo pipefail
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          grep -Fq "if(becameVisible)app.style.visibility='hidden'" admin-central-handoff.js
          grep -Fq "function announceReady(){if(app)app.style.visibility=''" admin-authenticated-shell.js
          grep -Fq 'await new Promise(resolve=>setTimeout(resolve,0));announceReady()' admin-authenticated-shell.js

      - name: Build and verify guarded admin assets
        run: |
          set -euo pipefail
          npm run build
          test -f dist/admin-central-handoff.js
          test -f dist/admin-authenticated-shell.js
          test -f dist/control-center.html
          grep -Fq "if(becameVisible)app.style.visibility='hidden'" dist/admin-central-handoff.js
          grep -Fq "function announceReady(){if(app)app.style.visibility=''" dist/admin-authenticated-shell.js
          grep -Fq 'await new Promise(resolve=>setTimeout(resolve,0));announceReady()' dist/admin-authenticated-shell.js
          grep -Fq 'admin-authenticated-shell.js' dist/control-center.html

      - name: Enforce validation-only ownership
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          ! grep -Eq 'guarded-worker-release\.mjs|wrangler(@[^ ]+)? +deploy|npm +run +deploy:site|gh +workflow +run +deploy-site-core\.yml' .github/workflows/deploy-admin-first-paint.yml
          echo 'Shared-site production ownership remains with deploy-site-core.yml.'
