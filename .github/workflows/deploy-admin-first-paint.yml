name: Deploy Admin First Paint Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'control-center.html'
      - 'compact-control-center.js'
      - '.github/workflows/deploy-admin-first-paint.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate admin first-paint guard
        run: |
          set -euo pipefail
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          grep -Fq "if(becameVisible)app.style.visibility='hidden'" admin-central-handoff.js
          grep -Fq "function announceReady(){if(app)app.style.visibility=''" admin-authenticated-shell.js
          grep -Fq 'await new Promise(resolve=>setTimeout(resolve,0));announceReady()' admin-authenticated-shell.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build and verify guarded admin assets
        run: |
          set -euo pipefail
          npm run build
          test -f dist/admin-central-handoff.js
          test -f dist/admin-authenticated-shell.js
          test -f dist/control-center.html
          grep -Fq "if(becameVisible)app.style.visibility='hidden'" dist/admin-central-handoff.js
          grep -Fq "function announceReady(){if(app)app.style.visibility=''" dist/admin-authenticated-shell.js
          grep -Fq 'await new Promise(resolve=>setTimeout(resolve,0));announceReady()' dist/admin-authenticated-shell.js
          grep -Fq 'admin-authenticated-shell.js' dist/control-center.html

      - name: Guarded shared-site release
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify production first-paint guard
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            handoff_url="https://admin.ekodi.kr/admin-central-handoff.js?boot=${RELEASE_SHA}"
            shell_url="https://admin.ekodi.kr/admin-authenticated-shell.js?boot=${RELEASE_SHA}"
            root_url="https://admin.ekodi.kr/?boot=${RELEASE_SHA}"
            handoff_code=$(curl -sS -o /tmp/handoff -w '%{http_code}' --connect-timeout 5 --max-time 15 "$handoff_url" || true)
            shell_code=$(curl -sS -o /tmp/shell -w '%{http_code}' --connect-timeout 5 --max-time 15 "$shell_url" || true)
            root_code=$(curl -sS -o /tmp/root -w '%{http_code}' --connect-timeout 5 --max-time 15 "$root_url" || true)
            guard=no; settle=no; reveal=no; wired=no
            grep -Fq "if(becameVisible)app.style.visibility='hidden'" /tmp/handoff && guard=yes || true
            grep -Fq 'await new Promise(resolve=>setTimeout(resolve,0));announceReady()' /tmp/shell && settle=yes || true
            grep -Fq "function announceReady(){if(app)app.style.visibility=''" /tmp/shell && reveal=yes || true
            grep -Fq 'admin-authenticated-shell.js' /tmp/root && wired=yes || true
            echo "admin first paint -> codes=$handoff_code/$shell_code/$root_code guard=$guard settle=$settle reveal=$reveal wired=$wired"
            if [ "$handoff_code" = '200' ] && [ "$shell_code" = '200' ] && [[ "$root_code" =~ ^[23] ]] && [ "$guard" = yes ] && [ "$settle" = yes ] && [ "$reveal" = yes ] && [ "$wired" = yes ]; then
              echo 'Admin first-paint guard verified in production.'
              exit 0
            fi
            sleep 4
          done
          exit 1
