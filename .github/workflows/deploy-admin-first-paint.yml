name: Validate Admin First Paint Guard

on:
  workflow_dispatch:
  pull_request:
    paths: &first_paint_paths
      - 'admin-shell.html'
      - 'admin-shell.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-menu-layout.js'
      - 'admin-menu-registry.js'
      - 'admin-sidebar.js'
      - 'admin-menu-runtime.js'
      - 'admin-demand-loader.js'
      - 'scripts/admin-performance-postbuild.mjs'
      - '.github/workflows/deploy-admin-first-paint.yml'
  push:
    branches: [main]
    paths: *first_paint_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate admin first-paint contract
        run: |
          set -euo pipefail
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-menu-layout.js
          node --check admin-menu-runtime.js
          grep -Fq "function announceReady(){if(app)app.style.visibility=''" admin-authenticated-shell.js
          grep -Fq "document.documentElement.dataset.ekodiAdminReady='loading'" admin-authenticated-shell.js
          grep -Fq 'for(const src of criticalPostAuthScripts)' admin-authenticated-shell.js
          grep -Fq 'await loadScript(src)' admin-authenticated-shell.js
          grep -Fq 'announceReady();loadDeferredEnhancements()' admin-authenticated-shell.js

      - name: Build and verify first-paint assets
        run: |
          set -euo pipefail
          npm run build
          for asset in admin-shell.html admin-shell.css admin-central-handoff.js admin-authenticated-shell.js admin-menu-layout.js admin-menu-registry.js admin-sidebar.js admin-menu-runtime.js admin-demand-loader.js; do
            test -s "dist/$asset"
          done
          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/admin-shell.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          grep -Fq "admin-shell.css?v=$version" dist/admin-shell.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/admin-shell.html
          grep -Fq 'data-ekodi-postauth="admin-compact.js admin-menu-layout.js admin-demand-loader.js"' dist/admin-shell.html
          # The build/postbuild pipeline enforces first-path byte budgets,
          # startup observer limits and immutable fingerprinting. Retired control-center
          # artifacts must never be restored just to satisfy this gate.
          test ! -e dist/control-center.html
          test ! -e dist/control-center.js
          test ! -e dist/control-center.css

      - name: Verify repository deployment ownership policy
        run: node scripts/validate-deployment-guardrails.mjs
