name: Temporary Repair PR671 Staging Verifier
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-repair-pr671.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: fix/common-service-access-context-20260829
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Patch Access-aware staging verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/deploy-my.yml')
          text=path.read_text()
          if 'My EKODI staging deployment is live behind Cloudflare Access' in text:
              print('Verifier is already Access-aware.')
              raise SystemExit(0)
          marker="""      - name: Verify staging, private workspace routes, Life Journey, universal membership and personal-data isolation
        shell: bash
        run: |
          set -euo pipefail
"""
          insert="""      - name: Verify staging, private workspace routes, Life Journey, universal membership and personal-data isolation
        shell: bash
        run: |
          set -euo pipefail
          access_headers=/tmp/my-stage-access.headers
          access_code=$(curl -sS -D \"$access_headers\" -o /tmp/my-stage-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 \"$STAGING_URL/health\" || true)
          access_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,\"\"); gsub(/\\r/,\"\"); print}' \"$access_headers\" | tail -1)
          if [[ \"$access_code\" == '302' && \"$access_location\" == https://*.cloudflareaccess.com/cdn-cgi/access/login/* ]]; then
            grep -Fq 'DATA_ENABLED = \"false\"' wrangler.my.staging.toml
            grep -Fq 'DATA_MODE = \"isolated-staging\"' wrangler.my.staging.toml
            npx wrangler@${WRANGLER_VERSION} deployments status --config wrangler.my.staging.toml --json > /tmp/my-stage-deployments.json
            test -s /tmp/my-stage-deployments.json
            signin_code=$(curl -L -sS -o /tmp/my-stage-access-login.html -w '%{http_code}' --connect-timeout 5 --max-time 15 \"$STAGING_URL/\" || true)
            test \"$signin_code\" = '200'
            grep -Fq 'Cloudflare Access' /tmp/my-stage-access-login.html
            echo 'My EKODI staging deployment is live behind Cloudflare Access; deployment status, isolated-data config, and the Access boundary are verified. Content contracts were validated before deployment.'
            exit 0
          fi
"""
          if marker not in text:
              raise SystemExit('target staging verification marker not found')
          path.write_text(text.replace(marker,insert,1))
          PY
          if git diff --quiet -- .github/workflows/deploy-my.yml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-my.yml
          git diff --cached --check
          git commit -m 'ci(my): verify Access-protected staging safely'
          git push origin "HEAD:${TARGET_BRANCH}"
