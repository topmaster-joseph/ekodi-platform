name: Reconcile My EKODI Triggers

on:
  pull_request:
    paths:
      - 'wrangler.my.toml'
      - '.github/workflows/reconcile-my-triggers.yml'
  push:
    branches:
      - main
    paths:
      - 'wrangler.my.toml'
      - '.github/workflows/reconcile-my-triggers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-my-ekodi-triggers-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  LEGACY_MY_HOST: my.ekodi.kr
  CANONICAL_ZONE: ekodi.kr
  CF_ZONE_ID: e39707f426b195d12c67a86f62b52ba7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate canonical trigger source of truth
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^workers_dev[[:space:]]*=[[:space:]]*true' wrangler.my.toml
          grep -Eq '^routes[[:space:]]*=[[:space:]]*\[\][[:space:]]*$' wrangler.my.toml
          if grep -Fqi 'my.ekodi.kr' wrangler.my.toml; then
            echo 'Retired My EKODI subdomain must not appear in Wrangler routing configuration.'
            exit 1
          fi
          test "$LEGACY_MY_HOST" = 'my.ekodi.kr'
          test "$CANONICAL_ZONE" = 'ekodi.kr'
          test "$CF_ZONE_ID" = 'e39707f426b195d12c67a86f62b52ba7'
          npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --dry-run --config wrangler.my.toml

  production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Reconcile routes and custom domains from canonical config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.my.toml
      - name: Detach retired My EKODI custom domain
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          domains=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$endpoint")
          echo "$domains" | jq -e '.success == true' >/dev/null
          domain_id=$(echo "$domains" | jq -r '.result[] | select(.hostname == env.LEGACY_MY_HOST) | .id' | head -n1)
          if [[ -n "$domain_id" ]]; then
            echo "Detaching retired Workers Custom Domain $LEGACY_MY_HOST."
            delete_http=$(curl -sS -o /tmp/my-domain-delete.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$endpoint/$domain_id")
            if [[ ! "$delete_http" =~ ^20[0-9]$ ]]; then
              echo "Workers Custom Domain detach failed with HTTP $delete_http."
              cat /tmp/my-domain-delete.out || true
              exit 1
            fi
          else
            echo "Retired Workers Custom Domain $LEGACY_MY_HOST is already detached."
          fi
          for attempt in $(seq 1 12); do
            remaining=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$endpoint")
            echo "$remaining" | jq -e '.success == true' >/dev/null
            if ! echo "$remaining" | jq -e '.result[] | select(.hostname == env.LEGACY_MY_HOST)' >/dev/null; then
              echo "Workers Custom Domain detached: $LEGACY_MY_HOST"
              break
            fi
            if [[ "$attempt" == '12' ]]; then
              echo "$LEGACY_MY_HOST is still attached as a Workers Custom Domain."
              exit 1
            fi
            sleep 3
          done
      - name: Verify canonical My EKODI and Revenue Engine remain live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -o /tmp/my-health.json https://ekodi.kr/my/health
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -o /tmp/my-channel-automation.js https://ekodi.kr/my/channel-automation.js
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -o /tmp/my-revenue-opportunity.js 'https://ekodi.kr/my/revenue-opportunity.js?v=20260911-revenue-engine-1'
          grep -Fq '"service":"ekodi-my"' /tmp/my-health.json
          grep -Fq 'revenue-opportunity' /tmp/my-channel-automation.js
          grep -Eiq 'revenue|수익' /tmp/my-revenue-opportunity.js
      - name: Remove exact retired My DNS record
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          lookup_http=$(curl -sS -o /tmp/my-dns-records.json -w '%{http_code}' "${auth[@]}" \
            "$api/zones/$CF_ZONE_ID/dns_records?name=$LEGACY_MY_HOST&per_page=100")
          if [[ "$lookup_http" != '200' ]]; then
            echo "Exact DNS lookup failed with HTTP $lookup_http."
            jq '{success,errors,messages}' /tmp/my-dns-records.json 2>/dev/null || cat /tmp/my-dns-records.json
            exit 1
          fi
          jq -e '.success == true' /tmp/my-dns-records.json >/dev/null
          mapfile -t record_ids < <(jq -r '.result[] | select(.name == env.LEGACY_MY_HOST) | .id' /tmp/my-dns-records.json)
          if [[ "${#record_ids[@]}" == '0' ]]; then
            echo "No residual DNS record exists for $LEGACY_MY_HOST."
          fi
          for record_id in "${record_ids[@]}"; do
            delete_http=$(curl -sS -o /tmp/my-dns-delete.out -w '%{http_code}' -X DELETE "${auth[@]}" \
              "$api/zones/$CF_ZONE_ID/dns_records/$record_id")
            if [[ ! "$delete_http" =~ ^20[0-9]$ ]]; then
              echo "Exact DNS delete failed with HTTP $delete_http."
              cat /tmp/my-dns-delete.out || true
              exit 1
            fi
          done
          remaining_http=$(curl -sS -o /tmp/my-dns-remaining.json -w '%{http_code}' "${auth[@]}" \
            "$api/zones/$CF_ZONE_ID/dns_records?name=$LEGACY_MY_HOST&per_page=100")
          test "$remaining_http" = '200'
          jq -e '.success == true' /tmp/my-dns-remaining.json >/dev/null
          test "$(jq '[.result[] | select(.name == env.LEGACY_MY_HOST)] | length' /tmp/my-dns-remaining.json)" = '0'
          echo "Exact retired DNS hostname absent: $LEGACY_MY_HOST"
      - name: Re-verify canonical My after retirement
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -o /tmp/my-health-after.json https://ekodi.kr/my/health
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 -o /tmp/my-revenue-after.js 'https://ekodi.kr/my/revenue-opportunity.js?v=20260911-revenue-engine-1'
          grep -Fq '"service":"ekodi-my"' /tmp/my-health-after.json
          grep -Eiq 'revenue|수익' /tmp/my-revenue-after.js
      - name: Verify retired My subdomain no longer serves first-party traffic
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/legacy-my.out -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://$LEGACY_MY_HOST/" || true)
            if [[ ! "$code" =~ ^[23] ]]; then
              echo "Retired hostname no longer serves first-party traffic (HTTP ${code:-000})."
              exit 0
            fi
            echo "Legacy hostname still active (HTTP $code), waiting for retirement propagation: attempt $attempt/36"
            sleep 5
          done
          echo "$LEGACY_MY_HOST still serves a 2xx/3xx response after retirement."
          exit 1
