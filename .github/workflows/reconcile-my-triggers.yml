name: Verify My EKODI Path Contract

on:
  pull_request:
    paths:
      - 'wrangler.my.toml'
      - 'my-worker.js'
      - 'my/**'
      - '.github/workflows/reconcile-my-triggers.yml'
  push:
    branches:
      - main
    paths:
      - 'wrangler.my.toml'
      - 'my-worker.js'
      - 'my/**'
      - '.github/workflows/reconcile-my-triggers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-my-ekodi-path-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate My worker is private from public hostname routing
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^workers_dev[[:space:]]*=[[:space:]]*true' wrangler.my.toml
          grep -Eq '^routes[[:space:]]*=[[:space:]]*\[\][[:space:]]*$' wrangler.my.toml
          ! grep -Fq 'custom_domain = true' wrangler.my.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --config wrangler.my.toml
      - name: Validate canonical My path source contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/zero-subdomain-guard.mjs
          grep -R -Fq 'https://ekodi.kr/my' my my-worker.js

  production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical My EKODI path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -sS -o /tmp/my-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/health' || true)
            shell=$(curl -sS -o /tmp/my.html -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/' || true)
            if [ "$health" = '200' ] && [ "$shell" = '200' ] && grep -Fq '"service":"ekodi-my"' /tmp/my-health.json; then
              echo 'My EKODI canonical path verified.'
              exit 0
            fi
            sleep 5
          done
          exit 1
