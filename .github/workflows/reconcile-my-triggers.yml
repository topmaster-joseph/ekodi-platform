name: Reconcile My EKODI Triggers

on:
  pull_request:
    paths:
      - 'wrangler.my.toml'
      - '.github/workflows/reconcile-my-triggers.yml'
  push:
    branches:
      - main
    paths:
      - 'wrangler.my.toml'
      - '.github/workflows/reconcile-my-triggers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-my-ekodi-triggers-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  LEGACY_MY_HOST: my.ekodi.kr
  CANONICAL_ZONE: ekodi.kr

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate canonical trigger source of truth
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^workers_dev[[:space:]]*=[[:space:]]*true' wrangler.my.toml
          grep -Eq '^routes[[:space:]]*=[[:space:]]*\[\][[:space:]]*$' wrangler.my.toml
          if grep -Fqi 'my.ekodi.kr' wrangler.my.toml; then
            echo 'Retired My EKODI subdomain must not appear in Wrangler routing configuration.'
            exit 1
          fi
          test "$LEGACY_MY_HOST" = 'my.ekodi.kr'
          test "$CANONICAL_ZONE" = 'ekodi.kr'
          npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --dry-run --config wrangler.my.toml

  production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Reconcile routes and custom domains from canonical config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.my.toml
      - name: Detach retired My EKODI custom domain
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          domains=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$endpoint")
          echo "$domains" | jq -e '.success == true' >/dev/null
          domain_id=$(echo "$domains" | jq -r '.result[] | select(.hostname == "my.ekodi.kr") | .id' | head -n1)
          if [[ -n "$domain_id" ]]; then
            echo "Detaching retired Workers Custom Domain my.ekodi.kr."
            delete_code=$(curl -sS -o /tmp/my-domain-delete.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$endpoint/$domain_id" || true)
            if [[ ! "$delete_code" =~ ^2 ]]; then
              echo "Workers Custom Domain detach failed (HTTP $delete_code)."
              cat /tmp/my-domain-delete.out || true
              exit 1
            fi
          else
            echo 'Retired Workers Custom Domain my.ekodi.kr is already detached.'
          fi
          remaining=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$endpoint")
          echo "$remaining" | jq -e '.success == true' >/dev/null
          if echo "$remaining" | jq -e '.result[] | select(.hostname == "my.ekodi.kr")' >/dev/null; then
            echo 'my.ekodi.kr is still attached as a Workers Custom Domain.'
            exit 1
          fi
      - name: Verify canonical My EKODI and Revenue Engine remain live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 https://ekodi.kr/my/health | grep -Fq '"service":"ekodi-my"'
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 https://ekodi.kr/my/channel-automation.js | grep -Fq 'revenue-opportunity'
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/revenue-opportunity.js?v=20260911-revenue-engine-1' | grep -Eiq 'revenue|수익'
      - name: Remove exact retired My DNS record
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones=$(curl --fail-with-body -sS "${auth[@]}" "$api/zones?name=$CANONICAL_ZONE&status=active&per_page=50")
          test "$(jq -r '.success' <<<"$zones")" = 'true'
          test "$(jq '[.result[] | select(.name == env.CANONICAL_ZONE)] | length' <<<"$zones")" = '1'
          zone_id=$(jq -r '.result[] | select(.name == env.CANONICAL_ZONE) | .id' <<<"$zones")
          records=$(curl --fail-with-body -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$LEGACY_MY_HOST&per_page=100")
          test "$(jq -r '.success' <<<"$records")" = 'true'
          mapfile -t record_ids < <(jq -r '.result[] | select(.name == env.LEGACY_MY_HOST) | .id' <<<"$records")
          for record_id in "${record_ids[@]}"; do
            deleted=$(curl --fail-with-body -sS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$record_id")
            test "$(jq -r '.success' <<<"$deleted")" = 'true'
          done
          remaining=$(curl --fail-with-body -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$LEGACY_MY_HOST&per_page=100")
          test "$(jq '[.result[] | select(.name == env.LEGACY_MY_HOST)] | length' <<<"$remaining")" = '0'
          echo "Exact retired DNS hostname removed: $LEGACY_MY_HOST"
      - name: Re-verify canonical My after DNS retirement
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 https://ekodi.kr/my/health | grep -Fq '"service":"ekodi-my"'
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 'https://ekodi.kr/my/revenue-opportunity.js?v=20260911-revenue-engine-1' | grep -Eiq 'revenue|수익'
      - name: Verify retired My subdomain no longer serves first-party traffic
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/legacy-my.out -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://$LEGACY_MY_HOST/" || true)
            if [[ ! "$code" =~ ^[23] ]]; then
              echo "Retired hostname no longer serves first-party traffic (HTTP ${code:-000})."
              exit 0
            fi
            echo "Legacy hostname still active (HTTP $code), waiting for DNS propagation: attempt $attempt/36"
            sleep 5
          done
          echo "$LEGACY_MY_HOST still serves a 2xx/3xx response after exact DNS retirement."
          exit 1
