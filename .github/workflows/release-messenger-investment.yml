name: Release Messenger & Investment Onboarding (Manual Recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

# The automatic first-launch path was completed in PR #313.
# Future platform changes use the generic manifest onboarding gates and the
# functional Messenger/Investment release. This workflow remains only as a
# manual recovery/replay path so it cannot race a normal feature release.
concurrency:
  group: release-messenger-investment-onboarding-recovery
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-shared-site-staging.topmaster-joseph.workers.dev
  SHELL_STAGING_URL: https://ekodi-shell-staging.topmaster-joseph.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate automatic onboarding contracts
        run: |
          set -euo pipefail
          node --check platform-router-worker.js
          node --check auth-site/auth-router.js
          node --check auth-site/client-auth.js
          node --check ekodi-shell-worker.js
          node scripts/validate-ekodi-shell-adoption.mjs
          npm run build
          grep -Fq 'data-service-id="messenger"' dist/index.html
          grep -Fq 'data-service-id="invest"' dist/index.html
          grep -Fq 'messenger.ekodi.kr' wrangler.site.toml
          grep -Fq 'invest.ekodi.kr' wrangler.site.toml

  staging:
    environment: development
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Stage canonical Shell manifest first
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.staging.toml
      - name: Verify staged Manifest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$SHELL_STAGING_URL/manifest.json" || true)
            if [[ "$code" == '200' ]] \
              && grep -Fq '"id":"messenger"' /tmp/manifest.json \
              && grep -Fq '"id":"invest"' /tmp/manifest.json \
              && grep -Fq '"authMode":"client"' /tmp/manifest.json; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Build and deploy isolated shared-site staging
        run: |
          npm run build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.site-staging.toml
      - name: Verify both staged surfaces
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            host="$1"; marker="$2"
            code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "x-ekodi-staging-host: $host" "$STAGING_URL/" || true)
            [[ "$code" == '200' ]] && grep -Fq "$marker" /tmp/b && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/b && grep -Fiq 'x-ekodi-shell: v1' /tmp/h
          }
          verify 'messenger.ekodi.kr' 'EKODI Messenger'
          verify 'invest.ekodi.kr' 'EKODI Investment'

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish canonical Shell manifest
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.toml
      - name: Build production assets
        run: npm run build
      - name: Reconcile custom-domain triggers
        run: npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.site.toml
      - name: Guarded candidate and rollback-safe promotion
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
