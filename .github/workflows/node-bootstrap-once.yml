name: EKODI Node Bootstrap Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/node-bootstrap-once.yml'

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Provision two short-lived device enrollments
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const now = new Date();
          const expires = new Date(now.getTime() + 10*60*1000);
          const nodes = ['EKODI Node 01','EKODI Node 02'].map(label => {
            const code = 'EKD-' + crypto.randomBytes(10).toString('hex').toUpperCase();
            const hash = crypto.createHash('sha256').update(code).digest('hex');
            const id = 'enr_bootstrap_' + crypto.randomUUID();
            return { label, code, hash, id };
          });
          const q = s => "'" + String(s).replaceAll("'","''") + "'";
          const sql = [
            "DELETE FROM device_enrollments WHERE used_at IS NOT NULL OR expires_at < datetime('now','-1 day');",
            ...nodes.map(n => `INSERT INTO device_enrollments (id, code_hash, expires_at, created_at, created_by) VALUES (${q(n.id)}, ${q(n.hash)}, ${q(expires.toISOString())}, ${q(now.toISOString())}, NULL);`)
          ].join('\n');
          fs.writeFileSync('/tmp/bootstrap.sql', sql);
          fs.writeFileSync('/tmp/enrollments.json', JSON.stringify({ node1: nodes[0].code, node2: nodes[1].code }));
          NODE
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute ekodi-auth --remote --file=/tmp/bootstrap.sql --config wrangler.api.toml >/tmp/wrangler.out
          cat >/tmp/ekodi-bootstrap-pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlt7CKMoPE2YoZOKn/QRb
          WVv7EGPF3V136SUvxQcl/WpOOqQZwX+0If3SOUdCSpG6Qp3N/NNK26w3e8z3ecQO
          liMwWW7GTUmHE+2zhQP5nMlX/Jzd+9cXCu0hm7lLKXjSEa5LeMjs0RCclM+YOJiO
          K+Rrebmbiviy2SgFtC8ZbGR08GoZKdNLYOTYa+iMSGueBLcjw30EvMA/RV+NqCVV
          xO40npXTRgP5nQJtGRl9aKytp/8ZPANNm2EHFUhPqp2sZQJav0vLcJU7v3vNR1+K
          6XG2qY2dEtHqN6lmoAVI4HeUzFNrjOi2qqt+DNA5dFi2KkEijSvB0/QQfVVD3sWz
          tQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey /tmp/ekodi-bootstrap-pub.pem -in /tmp/enrollments.json -out /tmp/enrollments.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          cipher=$(base64 -w0 /tmp/enrollments.bin)
          echo "EKODI_NODE_ENROLLMENT_CIPHERTEXT=$cipher"
          rm -f /tmp/bootstrap.sql /tmp/enrollments.json /tmp/enrollments.bin /tmp/ekodi-bootstrap-pub.pem /tmp/wrangler.out
