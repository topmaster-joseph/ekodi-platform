name: Activate EKODI Pages Domains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-ekodi-pages-domains.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Upsert ekodi.kr Pages CNAME records
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=ekodi.kr&account.id=$CF_ACCOUNT_ID")
          zone_id=$(printf '%s' "$zone_json" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          test -n "$zone_id" || (echo 'ekodi.kr zone not found' && exit 1)
          echo "ekodi.kr zone located"

          upsert_cname() {
            name="$1"
            target="$2"
            existing=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=CNAME&name=$name")
            record_id=$(printf '%s' "$existing" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
            payload="{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$target\",\"ttl\":1,\"proxied\":true,\"comment\":\"EKODI canonical Pages domain\"}"
            if [ -n "$record_id" ]; then
              echo "Updating $name -> $target"
              curl -fsS -X PUT "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records/$record_id" >/tmp/cf-dns.json
            else
              echo "Creating $name -> $target"
              curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/dns_records" >/tmp/cf-dns.json
            fi
            python -c "import json; d=json.load(open('/tmp/cf-dns.json')); assert d.get('success') is True; print(d['result']['name'], '->', d['result']['content'])"
          }

          upsert_cname "church.ekodi.kr" "ekodi-church.pages.dev"
          upsert_cname "lab.ekodi.kr" "ekodilab.pages.dev"
          upsert_cname "mall.ekodi.kr" "ekodi-mall.pages.dev"

      - name: Confirm Cloudflare activation and HTTPS
        shell: bash
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          all_ok=0
          for attempt in $(seq 1 12); do
            echo "activation-check=$attempt"
            all_ok=1
            for spec in "ekodi-church:church.ekodi.kr" "ekodilab:lab.ekodi.kr" "ekodi-mall:mall.ekodi.kr"; do
              project="${spec%%:*}"
              domain="${spec#*:}"
              result=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain" || true)
              status=$(printf '%s' "$result" | python -c "import sys,json; s=sys.stdin.read(); d=json.loads(s) if s else {}; print((d.get('result') or {}).get('status','unknown'))" 2>/dev/null || echo unknown)
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 12 "https://$domain/" || true)
              echo "$domain pages_status=$status http=$code"
              case "$code" in 2*|3*) ;; *) all_ok=0 ;; esac
            done
            [ "$all_ok" -eq 1 ] && exit 0
            sleep 3
          done
          exit 1
