name: Cloudflare Insurance Staging to Development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-insurance-staging-to-development.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_VERSION: '4.119.0'
      INSURANCE_SOURCE_REF: 89d5d3d0f0e7aee5e47f9b1a4b480d8bd5ce0aaf
      DEV_UI_URL: https://ekodi-insurance-staging.ekodi-development.workers.dev
      DEV_API_URL: https://ekodi-insurance-api-staging.ekodi-development.workers.dev
    steps:
      - name: Checkout migration controller
        uses: actions/checkout@v7

      - name: Checkout last clean Insurance staging source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.INSURANCE_SOURCE_REF }}
          path: insurance-source

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate account boundary
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.DEV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$DEV_TOKEN"
          test -n "$PROD_TOKEN"
          test "$DEV_ACCOUNT_ID" != "$PROD_ACCOUNT_ID"
          cd insurance-source
          node --check sites/ekodi-insurance/worker.js
          node --check sites/ekodi-insurance/public/server-bridge.js
          node --check sites/ekodi-insurance/api/worker.js

      - name: Retarget Insurance staging endpoints to Development account
        shell: bash
        run: |
          set -euo pipefail
          cd insurance-source
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'https://insurance-api-staging.ekodi.kr':'https://ekodi-insurance-api-staging.ekodi-development.workers.dev',
            'https://ekodi-insurance-staging.topmaster-joseph.workers.dev':'https://ekodi-insurance-staging.ekodi-development.workers.dev',
          }
          for p in [
            Path('sites/ekodi-insurance/public/server-bridge.js'),
            Path('sites/ekodi-insurance/worker.js'),
            Path('sites/ekodi-insurance/api/worker.js'),
          ]:
            text=p.read_text(encoding='utf-8')
            for old,new in replacements.items():
              text=text.replace(old,new)
            p.write_text(text,encoding='utf-8')
          PY
          grep -Fq "$DEV_API_URL" sites/ekodi-insurance/public/server-bridge.js
          grep -Fq "$DEV_UI_URL" sites/ekodi-insurance/api/worker.js
          ! grep -R -F 'insurance-api-staging.ekodi.kr' sites/ekodi-insurance/public/server-bridge.js sites/ekodi-insurance/worker.js sites/ekodi-insurance/api/worker.js

      - name: Create isolated Development D1 and deploy Insurance API staging
        id: api
        working-directory: insurance-source/sites/ekodi-insurance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.DEV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-insurance-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-insurance-staging --location apac >/tmp/d1-create.txt
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"

          cat > api/wrangler.development-staging.toml <<EOF
          name = "ekodi-insurance-api-staging"
          main = "worker.js"
          compatibility_date = "2026-08-14"
          workers_dev = true
          preview_urls = false

          [vars]
          ENVIRONMENT = "staging-clean"
          ALLOWED_ORIGINS = "$DEV_UI_URL"
          SUPABASE_URL = "https://renzehysxirjilvdxacv.supabase.co"
          SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_"

          [triggers]
          crons = ["17 3 * * *"]

          [observability.logs]
          enabled = true
          invocation_logs = true

          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-insurance-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF

          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config api/wrangler.development-staging.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config api/wrangler.development-staging.toml

          DATA_KEY=$(openssl rand -base64 32 | tr -d '\n')
          INTERNAL_TOKEN=$(openssl rand -hex 32)
          RATE_SALT=$(openssl rand -hex 32)
          echo "::add-mask::$DATA_KEY"
          echo "::add-mask::$INTERNAL_TOKEN"
          echo "::add-mask::$RATE_SALT"
          printf '%s' "$DATA_KEY" | npx --yes wrangler@${WRANGLER_VERSION} secret put INSURANCE_DATA_KEY --config api/wrangler.development-staging.toml >/dev/null
          printf '%s' "$INTERNAL_TOKEN" | npx --yes wrangler@${WRANGLER_VERSION} secret put INSURANCE_INTERNAL_TOKEN --config api/wrangler.development-staging.toml >/dev/null
          printf '%s' "$RATE_SALT" | npx --yes wrangler@${WRANGLER_VERSION} secret put RATE_LIMIT_SALT --config api/wrangler.development-staging.toml >/dev/null

      - name: Deploy Insurance UI staging to Development
        working-directory: insurance-source/sites/ekodi-insurance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.DEV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.DEV_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.toml

      - name: Verify Development staging resource boundary
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          curl --retry 5 --retry-all-errors -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev-workers.json
          jq -e '.success==true' /tmp/dev-workers.json >/dev/null
          for s in ekodi-insurance-staging ekodi-insurance-api-staging; do
            jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/dev-workers.json >/dev/null
            echo "DEV_PRESENT=$s"
          done
          curl --retry 5 --retry-all-errors -fsS "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/ekodi-insurance-api-staging/settings" -o /tmp/api-settings.json
          jq -e '.success==true' /tmp/api-settings.json >/dev/null
          jq -e '[.result.bindings[]? | select(.name=="DB" and .type=="d1")] | length == 1' /tmp/api-settings.json >/dev/null
          for n in INSURANCE_DATA_KEY INSURANCE_INTERNAL_TOKEN RATE_LIMIT_SALT; do
            jq -e --arg n "$n" '[.result.bindings[]? | select(.name==$n and .type=="secret_text")] | length == 1' /tmp/api-settings.json >/dev/null
          done
          echo 'DEV_INSURANCE_STAGING_BOUNDARY_VERIFIED=1'

      - name: Remove superseded Insurance staging residues from Production
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          curl_json(){ curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -fsS "$@"; }
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          targets=(ekodi-insurance-api-staging ekodi-insurance-auth-staging ekodi-insurance-control-staging ekodi-insurance-staging)

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod.json
          curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev.json
          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains.json
          curl_json "${prod_auth[@]}" "$api/zones?account.id=$PROD_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          for f in /tmp/prod.json /tmp/dev.json /tmp/domains.json /tmp/zones.json; do jq -e '.success==true' "$f" >/dev/null; done

          # Active clean staging equivalents must exist before retiring all four old Production residues.
          jq -e '.result[]? | select(.id=="ekodi-insurance-staging")' /tmp/dev.json >/dev/null
          jq -e '.result[]? | select(.id=="ekodi-insurance-api-staging")' /tmp/dev.json >/dev/null

          mkdir -p /tmp/ps
          while IFS= read -r owner; do
            [[ -n "$owner" ]] || continue
            curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$owner/settings" -o "/tmp/ps/$owner.json"
          done < <(jq -r '.result[]?.id' /tmp/prod.json)

          : >/tmp/routes.ndjson
          while IFS=$'\t' read -r zid zname; do
            [[ -n "$zid" ]] || continue
            curl_json "${prod_auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/zr.json
            jq -e '.success==true' /tmp/zr.json >/dev/null
            jq -c --arg zone "$zname" '.result[]? | {zone:$zone,pattern:.pattern,script:.script}' /tmp/zr.json >>/tmp/routes.ndjson
          done < <(jq -r '.result[]? | [.id,.name] | @tsv' /tmp/zones.json)

          : >/tmp/safe.txt
          for s in "${targets[@]}"; do
            if ! jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/prod.json >/dev/null; then
              echo "SKIP=$s already absent"
              continue
            fi
            routes=$(jq -s --arg s "$s" '[.[] | select(.script==$s)] | length' /tmp/routes.ndjson 2>/dev/null || echo 0)
            inbound=0
            for f in /tmp/ps/*.json; do
              n=$(jq --arg s "$s" '[.result.bindings[]? | select(.type=="service" and ((.service // .service_name)==$s))] | length' "$f")
              inbound=$((inbound+n))
            done
            [[ "$routes" == 0 && "$inbound" == 0 ]] || { echo "HOLD=$s routes=$routes inbound=$inbound"; continue; }
            echo "$s" >>/tmp/safe.txt
          done

          for required in "${targets[@]}"; do
            grep -Fxq "$required" /tmp/safe.txt || { echo "::error::Not all Insurance Production staging residues are safe to retire: $required"; exit 1; }
          done

          while IFS= read -r s; do
            [[ -n "$s" ]] || continue
            while IFS=$'\t' read -r did host; do
              [[ -n "$did" ]] || continue
              echo "DETACH_PROD_STAGING_DOMAIN=$host"
              curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains/$did" -o /tmp/domain-delete.json
            done < <(jq -r --arg s "$s" '.result[]? | select((.service // .script // .service_name)==$s) | [.id,.hostname] | @tsv' /tmp/domains.json)
            echo "DELETE_PROD_STAGING=$s"
            curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$s" -o /tmp/delete.json
          done </tmp/safe.txt

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/after.json
          jq -e '.success==true' /tmp/after.json >/dev/null
          for s in "${targets[@]}"; do
            if jq -e --arg s "$s" '.result[]? | select(.id==$s)' /tmp/after.json >/dev/null; then
              echo "::error::$s remains in Production"
              exit 1
            fi
            echo "VERIFIED_REMOVED_FROM_PROD=$s"
          done
          remaining=$(jq -r '.result[]?.id | select(endswith("-staging") or contains("-staging-"))' /tmp/after.json | wc -l | tr -d ' ')
          echo "PRODUCTION_STAGING_REMAINING=$remaining"
