name: Provision Search Console Reader

# SEARCH-VISIBILITY-GSC-PROVISION-20261104 (owner request): connect the read-only Google Search
# Console reader of the Control API (/api/control/search-visibility?googleSiteUrl=…) to the
# service-account key that registered the EKODI properties (environment `search-registration`).
# Scope is webmasters.readonly only; no registration, sitemap submission or URL inspection.
# The key value is never printed. Re-running is idempotent (the same key is written again).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-search-console-reader.yml'
      - 'scripts/search-console-reader-readiness.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-search-console-reader-provision
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.127.1'

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: search-registration
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_SEARCH_SA_KEY_JSON: ${{ secrets.GOOGLE_SEARCH_SA_KEY_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Owner prerequisites (human gate)
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${GOOGLE_SEARCH_SA_KEY_JSON:-}" ] || missing+=('GOOGLE_SEARCH_SA_KEY_JSON')
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=('CLOUDFLARE_API_TOKEN')
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=('CLOUDFLARE_ACCOUNT_ID')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "HUMAN_GATE_REQUIRED: secrets missing for environment 'search-registration': ${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Prove read-only Search Console access (property names only)
        run: node scripts/search-console-reader-readiness.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Provision the Control API read-only reader secret
        shell: bash
        run: |
          set -euo pipefail
          # A guarded release that rolled back leaves an undeployed latest version; Cloudflare then
          # refuses in-place `secret put`. Stage on a new version instead, promoted by the next
          # guarded Control API release (same pattern as deploy-control-api.yml).
          if printf '%s' "$GOOGLE_SEARCH_SA_KEY_JSON" | npx --yes wrangler@${WRANGLER_VERSION} secret put GOOGLE_SEARCH_SA_KEY_JSON --config wrangler.api.toml >/dev/null 2>/tmp/gsc-secret.err; then
            echo 'GOOGLE_SEARCH_SA_KEY_JSON provisioned on the Control API Worker without printing its value.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'In-place secret edit refused; staging the reader key on a new Worker version.' >&2
            sed -E 's/[A-Za-z0-9_]{24,}/[redacted]/g' /tmp/gsc-secret.err >&2 || true
            printf '%s' "$GOOGLE_SEARCH_SA_KEY_JSON" | npx --yes wrangler@${WRANGLER_VERSION} versions secret put GOOGLE_SEARCH_SA_KEY_JSON --config wrangler.api.toml --message 'EKODI: stage read-only Search Console reader key' >/dev/null
            echo 'GOOGLE_SEARCH_SA_KEY_JSON staged on a new Control API Worker version; promoted by the next guarded release.' >> "$GITHUB_STEP_SUMMARY"
          fi
          names=$(npx --yes wrangler@${WRANGLER_VERSION} secret list --config wrangler.api.toml 2>/dev/null || true)
          if printf '%s' "$names" | grep -Fq 'GOOGLE_SEARCH_SA_KEY_JSON'; then
            echo 'Verified: GOOGLE_SEARCH_SA_KEY_JSON is present on the deployed Control API Worker.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GOOGLE_SEARCH_SA_KEY_JSON is staged but not yet on the deployed version (awaits guarded release).' >> "$GITHUB_STEP_SUMMARY"
          fi
