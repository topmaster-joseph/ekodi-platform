name: EKODI Technology Scout Check
on:
  pull_request:
    paths:
      - 'technology-scout-source-worker.js'
      - 'ekodi-technology-scout.js'
      - 'technology-scout-control.js'
      - 'test/technology-scout.test.mjs'
      - 'scripts/validate-technology-scout-policy.mjs'
      - 'TECHNOLOGY_SCOUT_POLICY.md'
      - '.github/workflows/technology-scout-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check technology-scout-source-worker.js
      - run: node --check technology-scout-control.js
      - run: node scripts/validate-technology-scout-policy.mjs
      - run: node --test test/technology-scout.test.mjs
