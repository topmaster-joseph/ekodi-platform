name: EKODI AI Orchestration Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ekodi-ai-orchestration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestration:
    name: EKODI AI Orchestration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce change branch identity
        if: github.event_name == 'pull_request'
        env:
          EKODI_CHANGE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EKODI_CHANGE_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const policy = JSON.parse(fs.readFileSync('config/ai-change-orchestration-policy.json', 'utf8'));
          const naming = policy.sourceControl?.branchNaming || {};
          const branch = String(process.env.EKODI_CHANGE_BRANCH || '').trim();
          const actor = String(process.env.EKODI_CHANGE_ACTOR || '').trim();
          const requiredPattern = new RegExp(naming.requiredPattern || '^$');
          const botAllowed = (naming.automatedBotExceptions || []).some(rule =>
            actor === String(rule.actor || '').trim()
            && branch.startsWith(String(rule.branchPrefix || '').trim())
          );

          if (!requiredPattern.test(branch) && !botAllowed) {
            console.error(`[EKODI][AI-BRANCH-001] branch must match ${naming.format || 'ai/<agent>/<task-id>'}: ${branch || 'missing'} (actor=${actor || 'missing'})`);
            process.exit(1);
          }

          console.log(`[EKODI][AI-BRANCH-001] branch identity verified: ${branch} (actor=${actor})`);
          NODE
      - name: Install rootless execution prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns fuse-overlayfs
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = 'true'
      - name: Enforce virtualized execution boundary
        shell: bash
        env:
          EKODI_PRODUCTION_SECRET_SENTINEL: must-not-enter-sandbox
        run: |
          set -euo pipefail
          podman pull --quiet docker.io/library/node:24-alpine >/dev/null
          podman run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=96 \
            --memory=384m \
            --cpus=1 \
            --userns=keep-id \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            docker.io/library/node:24-alpine \
            sh -eu -c '
              test "$(id -u)" -ne 0
              test -z "${EKODI_PRODUCTION_SECRET_SENTINEL:-}"
              node scripts/validate-virtualized-execution-policy.mjs
              node scripts/validate-deployment-credential-boundary.mjs
            '
          echo '[EKODI][EXEC-FABRIC-001] required virtualized execution boundary passed.'
          echo '[EKODI][EXEC-CRED-001] production credential exclusion passed inside the sandbox.'
      - name: Prove guarded rollback recovery
        env:
          EKODI_ROLLBACK_PROOF_OUTPUT: artifacts/guarded-release-rollback-proof.json
        run: |
          set -euo pipefail
          node --check scripts/validate-deployment-credential-boundary.mjs
          node --test test/guarded-worker-release-rollback.test.mjs
      - name: Enforce apex-path-only domain policy
        env:
          ZERO_SUBDOMAIN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --check scripts/zero-subdomain-guard.mjs
          node scripts/zero-subdomain-guard.mjs
      - name: Route change intent through EKODI AI
        id: ekodi_ai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-ekodi-ai-change-orchestration.mjs --ci
          node scripts/validate-workflow-orchestration-gates.mjs
      - name: Upload orchestration evidence
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-ai-orchestration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ekodi-ai-orchestration-attestation.json
            artifacts/guarded-release-rollback-proof.json
          if-no-files-found: error
          retention-days: 30
