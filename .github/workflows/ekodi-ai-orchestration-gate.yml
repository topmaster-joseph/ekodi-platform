name: EKODI AI Orchestration Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write

concurrency:
  group: ekodi-ai-orchestration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestration:
    name: EKODI AI Orchestration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enforce change branch identity
        if: github.event_name == 'pull_request'
        env:
          EKODI_CHANGE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EKODI_CHANGE_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const policy = JSON.parse(fs.readFileSync('config/ai-change-orchestration-policy.json', 'utf8'));
          const naming = policy.sourceControl?.branchNaming || {};
          const branch = String(process.env.EKODI_CHANGE_BRANCH || '').trim();
          const actor = String(process.env.EKODI_CHANGE_ACTOR || '').trim();
          const requiredPattern = new RegExp(naming.requiredPattern || '^$');
          const botAllowed = (naming.automatedBotExceptions || []).some(rule =>
            actor === String(rule.actor || '').trim()
            && branch.startsWith(String(rule.branchPrefix || '').trim())
          );

          if (!requiredPattern.test(branch) && !botAllowed) {
            console.error(`[EKODI][AI-BRANCH-001] branch must match ${naming.format || 'ai/<agent>/<task-id>'}: ${branch || 'missing'} (actor=${actor || 'missing'})`);
            process.exit(1);
          }

          console.log(`[EKODI][AI-BRANCH-001] branch identity verified: ${branch} (actor=${actor})`);
          NODE
      - name: Install rootless execution prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns fuse-overlayfs
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = 'true'
      - name: Enforce virtualized execution boundary
        shell: bash
        env:
          EKODI_PRODUCTION_SECRET_SENTINEL: must-not-enter-sandbox
        run: |
          set -euo pipefail
          podman pull --quiet docker.io/library/node:24-alpine >/dev/null
          podman run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=96 \
            --memory=384m \
            --cpus=1 \
            --userns=keep-id \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            docker.io/library/node:24-alpine \
            sh -eu -c '
              test "$(id -u)" -ne 0
              test -z "${EKODI_PRODUCTION_SECRET_SENTINEL:-}"
              node scripts/validate-virtualized-execution-policy.mjs
              node scripts/validate-deployment-credential-boundary.mjs
            '
          echo '[EKODI][EXEC-FABRIC-001] required virtualized execution boundary passed.'
          echo '[EKODI][EXEC-CRED-001] production credential exclusion passed inside the sandbox.'
      - name: Prove guarded rollback recovery
        env:
          EKODI_ROLLBACK_PROOF_OUTPUT: artifacts/guarded-release-rollback-proof.json
        run: |
          set -euo pipefail
          node --check scripts/validate-deployment-credential-boundary.mjs
          node --test test/guarded-worker-release-rollback.test.mjs
      - name: Enforce apex-path-only domain policy
        env:
          ZERO_SUBDOMAIN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          node --check scripts/zero-subdomain-guard.mjs
          node scripts/zero-subdomain-guard.mjs
      - name: Enforce recursive site and subsite execution policy
        run: |
          set -euo pipefail
          node --check scripts/validate-site-execution-enforcement.mjs
          npm run validate:site-execution
      - name: Enforce Social Hub governance
        run: |
          set -euo pipefail
          node --check scripts/validate-social-hub-enforcement.mjs
          npm run validate:social-governance
      - name: Enforce Generation 10 Evolution Kernel
        run: |
          set -euo pipefail
          node --check scripts/validate-evolution-kernel.mjs
          node scripts/validate-evolution-kernel.mjs
          node --test test/evolution-kernel-contract.test.mjs
      - name: Enforce free-tier quota guard
        run: |
          set -euo pipefail
          node --check free-tier-quota-guard.js
          node --check free-tier-resource-governor.js
          node --check adaptive-resource-orchestrator.js
          node --check cloudflare-account-pool.js
          node --check scripts/validate-cloudflare-account-pool.mjs
          node --check scripts/validate-adaptive-infrastructure.mjs
          node --check scripts/validate-free-tier-optimization.mjs
          node --check scripts/validate-concurrent-traffic-policy.mjs
          node --check scripts/validate-storage-ai-contracts.mjs
          node --check scripts/evaluate-free-tier-resource-proof.mjs
          node --check scripts/validate-supabase-free-project-capacity.mjs
          node --check deployment-layer-router.js
          node --check scripts/validate-deployment-four-layer.mjs
          node --check scripts/resolve-deployment-four-layer.mjs
          node scripts/validate-free-tier-optimization.mjs
          node scripts/validate-concurrent-traffic-policy.mjs
          node scripts/validate-storage-ai-contracts.mjs
          node scripts/validate-adaptive-infrastructure.mjs
          node scripts/validate-cloudflare-account-pool.mjs
          node scripts/validate-supabase-free-project-capacity.mjs
          node scripts/validate-deployment-four-layer.mjs
          node --test test/free-tier-quota-guard.test.mjs test/free-tier-resource-governor.test.mjs test/free-tier-resource-collector.test.mjs test/free-tier-resource-proof.test.mjs test/free-tier-supabase-oidc-contract.test.mjs test/supabase-free-project-capacity-guard.test.mjs test/deployment-four-layer.test.mjs test/deployment-four-layer-runtime.test.mjs test/cloudflare-account-pool.test.mjs test/adaptive-resource-orchestrator.test.mjs
      - name: Route change intent through EKODI AI
        id: ekodi_ai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-ekodi-ai-change-orchestration.mjs --ci
          node scripts/validate-workflow-orchestration-gates.mjs
      - name: Upload orchestration evidence
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-ai-orchestration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ekodi-ai-orchestration-attestation.json
            artifacts/guarded-release-rollback-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish required legacy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
          STATUS_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          merge_sha="$STATUS_MERGE_SHA"
          if [[ -n "$STATUS_PR_NUMBER" ]]; then
            live_merge_sha=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${STATUS_PR_NUMBER}" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('merge_commit_sha') or '')")
            [[ -n "$live_merge_sha" ]] && merge_sha="$live_merge_sha"
          fi
          published=''
          for sha in "$STATUS_HEAD_SHA" "$merge_sha"; do
            [[ -z "$sha" || "$published" == "$sha" ]] && continue
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -d "{\"state\":\"${STATUS_STATE}\",\"context\":\"EKODI AI Orchestration Gate\",\"description\":\"EKODI AI orchestration gate\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
            published="$sha"
          done
      # Required checks can turn green after convergence has already stopped
      # (a re-run on the same SHA pushes nothing). Required statuses are
      # produced by the task-branch PR run (bot-opened recovery PRs get no jobs),
      # so on success hand off to the orchestrator branch for this exact SHA:
      # the branch itself, or ai/<agent>/orch_recovery_<sha32> when it exists.
      # Convergence still verifies the receipt, both checks and the exact head.
      - name: Start convergence when this required check is green on an orchestrator branch
        if: success() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && startsWith(github.event.pull_request.head.ref || github.ref_name, 'ai/')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          api() { curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@" || echo 000; }
          if [[ "$HEAD_REF" == */orch_* ]]; then
            ORCH_REF="$HEAD_REF"
          else
            agent=$(cut -d/ -f2 <<<"$HEAD_REF")
            [[ "$agent" =~ ^[a-z0-9][a-z0-9._-]{0,31}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "no orchestrator branch for $HEAD_REF"; exit 0; }
            ORCH_REF="ai/${agent}/orch_recovery_${HEAD_SHA:0:32}"
            if [[ "$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${ORCH_REF}")" != "200" ]]; then
              echo "recovery branch $ORCH_REF not issued yet; release provenance recovery starts convergence itself"; exit 0
            fi
          fi
          code=$(api -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/converge-orchestrated-pr-merge.yml/dispatches" -d "$(jq -cn --arg ref "$ORCH_REF" '{ref:$ref}')")
          if [[ "$code" == "204" ]]; then echo "convergence dispatched for $ORCH_REF"; else echo "::warning title=Convergence hand-off::dispatch returned HTTP $code for $ORCH_REF; continuity watchdog remains the fallback"; fi
