name: Apply Community Canonical Cleanup

on:
  push:
    branches:
      - 'staging/community-canonical-cleanup-*'
    paths:
      - '.github/workflows/apply-community-canonical-cleanup.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact canonical cleanup
        run: node scripts/apply-community-canonical-cleanup.mjs
      - name: Validate exact changes
        run: |
          set -euo pipefail
          node --check compact-control-center.js
          node --check api-worker.js
          grep -Fq "label: '커뮤니티'" compact-control-center.js
          if grep -Fq "label: '선교회'" compact-control-center.js; then exit 1; fi
          if grep -Fq "id: 'mission'" api-worker.js; then exit 1; fi
          grep -Fq "id: 'community'" api-worker.js
          grep -Fq "id: 'social'" api-worker.js
          grep -Fq 'control-api Social registry' platform-boundaries.json
          grep -Fq 'social-registry-api.js' platform-boundaries.json
          grep -Fq 'social-admin*' platform-boundaries.json
      - name: Commit normalized staging source
        run: |
          set -euo pipefail
          git config user.name 'EKODI Automation'
          git config user.email 'automation@ekodi.kr'
          git add compact-control-center.js api-worker.js platform-boundaries.json
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: make Community the only canonical ministry organization'
          git push
