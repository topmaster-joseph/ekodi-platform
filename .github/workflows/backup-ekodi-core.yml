name: Backup EKODI Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/backup-ekodi-core.yml'
      - 'migrations/0031_core_backup_state.sql'
      - 'core-api.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-ekodi-core.yml'
      - 'migrations/0031_core_backup_state.sql'
      - 'core-api.js'
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

concurrency:
  group: ekodi-core-backup-${{ github.event_name }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  PRODUCTION_BACKUP_DATABASE: 'ekodi-auth'
  R2_BACKUP_BUCKET: 'ekodi-backups'

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Verify backup credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRODUCTION_BACKUP_DATABASE"
          test -n "$R2_BACKUP_BUCKET"

      - name: Prepare isolated backup source
        id: backup_source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "BACKUP_DATABASE=$PRODUCTION_BACKUP_DATABASE" >> "$GITHUB_ENV"
            echo "BACKUP_CONFIG=wrangler.api.toml" >> "$GITHUB_ENV"
            echo "temporary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX="ekodi-core-backup-pr-${{ github.event.pull_request.number }}-"
          DB_NAME="${PREFIX}${GITHUB_RUN_ATTEMPT}"
          echo "BACKUP_DATABASE=$DB_NAME" >> "$GITHUB_ENV"
          echo "BACKUP_CONFIG=wrangler.backup.pr.toml" >> "$GITHUB_ENV"
          echo "temporary=true" >> "$GITHUB_OUTPUT"
          npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);for(const x of a){if(String(x.name||'').startsWith(process.argv[1]))console.log(x.name)}})" "$PREFIX" | while read -r stale; do
            [ -n "$stale" ] && npx --yes wrangler@${WRANGLER_VERSION} d1 delete "$stale" --skip-confirmation
          done
          npx --yes wrangler@${WRANGLER_VERSION} d1 create "$DB_NAME" --location apac
          DB_ID=$(npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name===process.argv[1]);if(x)process.stdout.write(x.uuid||x.id||'')})" "$DB_NAME")
          test -n "$DB_ID"
          cat > wrangler.backup.pr.toml <<EOF
          name = "ekodi-core-backup-pr"
          main = "core-api.js"
          compatibility_date = "2026-08-12"
          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF

      - name: Apply migrations to isolated PR backup D1
        if: github.event_name == 'pull_request'
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config wrangler.backup.pr.toml

      - name: Export EKODI Core D1
        run: |
          set -euo pipefail
          mkdir -p backup
          npx --yes wrangler@${WRANGLER_VERSION} d1 export "$BACKUP_DATABASE" \
            --remote \
            --skip-confirmation \
            --output=backup/ekodi-auth.sql \
            --config "$BACKUP_CONFIG"
          test -s backup/ekodi-auth.sql

      - name: Restore export outside D1 and verify
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          rm -f backup/restored.sqlite
          sqlite3 backup/restored.sqlite < backup/ekodi-auth.sql
          INTEGRITY=$(sqlite3 backup/restored.sqlite 'PRAGMA integrity_check;')
          test "$INTEGRITY" = 'ok'
          REQUIRED=$(sqlite3 backup/restored.sqlite "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('customer_tenants','customer_users','customer_memberships','customer_access_grants','customer_sessions','customer_audit_logs');")
          test "$REQUIRED" = '6'
          CHECKSUM=$(sha256sum backup/ekodi-auth.sql | awk '{print $1}')
          BYTES=$(stat -c%s backup/ekodi-auth.sql)
          ARTIFACT="ekodi-core-${BACKUP_DATABASE}-$(date -u +%Y%m%dT%H%M%SZ)"
          printf 'integrity=%s\nrequired_tables=%s\nchecksum=%s\nbytes=%s\nartifact=%s\n' \
            "$INTEGRITY" "$REQUIRED" "$CHECKSUM" "$BYTES" "$ARTIFACT" >> "$GITHUB_OUTPUT"
          cat > backup/restore-report.txt <<EOF
          source=$BACKUP_DATABASE
          restore_engine=sqlite3
          integrity=$INTEGRITY
          required_tables=$REQUIRED
          sha256=$CHECKSUM
          bytes=$BYTES
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Ensure private R2 backup bucket
        id: r2_bucket
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@${WRANGLER_VERSION} r2 bucket info "$R2_BACKUP_BUCKET" >/dev/null 2>&1; then
            npx --yes wrangler@${WRANGLER_VERSION} r2 bucket create "$R2_BACKUP_BUCKET"
          fi

      - name: Persist verified backup to R2
        id: r2_persist
        if: github.event_name != 'pull_request' && steps.r2_bucket.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
          EXPECTED_CHECKSUM: ${{ steps.verify.outputs.checksum }}
        run: |
          set -euo pipefail
          PREFIX="core/${BACKUP_DATABASE}/${ARTIFACT}"
          npx --yes wrangler@${WRANGLER_VERSION} r2 object put "$R2_BACKUP_BUCKET/$PREFIX/ekodi-auth.sql" \
            --remote --force --file=backup/ekodi-auth.sql
          npx --yes wrangler@${WRANGLER_VERSION} r2 object put "$R2_BACKUP_BUCKET/$PREFIX/restore-report.txt" \
            --remote --force --file=backup/restore-report.txt
          rm -f backup/r2-verify.sql
          npx --yes wrangler@${WRANGLER_VERSION} r2 object get "$R2_BACKUP_BUCKET/$PREFIX/ekodi-auth.sql" \
            --remote --file=backup/r2-verify.sql
          ACTUAL_CHECKSUM=$(sha256sum backup/r2-verify.sql | awk '{print $1}')
          test "$ACTUAL_CHECKSUM" = "$EXPECTED_CHECKSUM"

      - name: Record successful recovery drill
        if: github.event_name != 'pull_request' && steps.verify.outcome == 'success'
        env:
          CHECKSUM: ${{ steps.verify.outputs.checksum }}
          BYTES: ${{ steps.verify.outputs.bytes }}
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
          REQUIRED: ${{ steps.verify.outputs.required_tables }}
          INTEGRITY: ${{ steps.verify.outputs.integrity }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="INSERT INTO core_backup_runs(source,status,artifact_name,checksum_sha256,export_bytes,restore_integrity,required_tables,created_at) VALUES('$BACKUP_DATABASE','verified','$ARTIFACT','$CHECKSUM',$BYTES,'$INTEGRITY',$REQUIRED,'$NOW');"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$BACKUP_DATABASE" \
            --remote --yes --config "$BACKUP_CONFIG" --command "$SQL"

      - name: Remove isolated PR backup database
        if: always() && github.event_name == 'pull_request' && steps.backup_source.outputs.temporary == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 delete "$BACKUP_DATABASE" --skip-confirmation
          if npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);process.exit(a.some(v=>v.name===process.argv[1])?0:1)})" "$BACKUP_DATABASE"; then
            echo "Temporary backup database still exists: $BACKUP_DATABASE" >&2
            exit 1
          fi

      - name: Upload independent backup artifact
        if: always() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.artifact }}
          path: |
            backup/ekodi-auth.sql
            backup/restore-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Backup summary
        if: always() && steps.verify.outcome == 'success'
        run: |
          echo '### EKODI Core backup verified' >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 source: $BACKUP_DATABASE" >> "$GITHUB_STEP_SUMMARY"
          echo '- Restore engine: SQLite outside D1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Integrity: ${{ steps.verify.outputs.integrity }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required Core tables: ${{ steps.verify.outputs.required_tables }}/6' >> "$GITHUB_STEP_SUMMARY"
          echo '- SHA-256: ${{ steps.verify.outputs.checksum }}' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo '- PR source: isolated temporary D1; production ekodi-auth data is not read' >> "$GITHUB_STEP_SUMMARY"
            echo '- R2: skipped on pull request' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.r2_persist.outcome }}" = "success" ]; then
            echo "- R2: verified private copy in $R2_BACKUP_BUCKET" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- R2: unavailable; GitHub Artifact fallback retained' >> "$GITHUB_STEP_SUMMARY"
          fi
