name: Deploy EKODI Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ekodi-service-manifest.js'
      - 'ekodi-shell-worker.js'
      - 'ekodi-shell-injector.js'
      - 'shell/**'
      - 'config/internal-ui-rollout.json'
      - 'config/seasonal-design-governance.json'
      - 'docs/ekodi-shell-contract.md'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'scripts/validate-internal-ui-rollout.mjs'
      - 'scripts/validate-seasonal-design-governance.mjs'
      - 'wrangler.shell.toml'
      - 'wrangler.shell.staging.toml'
      - 'test/ekodi-shell.test.mjs'
      - '.github/workflows/deploy-ekodi-shell.yml'
      - 'release/ekodi-shell-*.marker'
  push:
    branches: [main]
    paths:
      - 'ekodi-service-manifest.js'
      - 'ekodi-shell-worker.js'
      - 'ekodi-shell-injector.js'
      - 'shell/**'
      - 'config/internal-ui-rollout.json'
      - 'config/seasonal-design-governance.json'
      - 'docs/ekodi-shell-contract.md'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'scripts/validate-internal-ui-rollout.mjs'
      - 'scripts/validate-seasonal-design-governance.mjs'
      - 'wrangler.shell.toml'
      - 'wrangler.shell.staging.toml'
      - 'test/ekodi-shell.test.mjs'
      - '.github/workflows/deploy-ekodi-shell.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shell-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Shell contracts
        run: |
          set -euo pipefail
          node --check ekodi-shell-worker.js
          node --check ekodi-shell-injector.js
          node --check shell/shell.js
          node --test test/ekodi-shell.test.mjs
          node scripts/validate-ekodi-shell-adoption.mjs
          node scripts/validate-seasonal-design-governance.mjs
          node scripts/validate-internal-ui-rollout.mjs

  staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://ekodi-shell-staging.topmaster-joseph.workers.dev
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated Shell staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.staging.toml
      - name: Verify Shell staging
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -sS -o /tmp/shell-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            manifest=$(curl -sS -o /tmp/shell-manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/manifest.json" || true)
            script=$(curl -sS -o /tmp/shell.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/shell.js" || true)
            theme=$(curl -sS -o /tmp/theme.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/theme.json" || true)
            style=$(curl -sS -o /tmp/workspace.css -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/workspace.css" || true)
            if [[ "$health" == '200' && "$manifest" == '200' && "$script" == '200' && "$theme" == '200' && "$style" == '200' ]] \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/shell-health.json \
              && grep -Fq '"shellPolicy":"required-for-user-facing-services"' /tmp/shell-manifest.json \
              && grep -Fq '"defaultSurface":"workspace"' /tmp/shell-manifest.json \
              && grep -Fq '"defaultSurface":"public"' /tmp/shell-manifest.json \
              && ! grep -Fq '"shellIntegration":"pending"' /tmp/shell-manifest.json \
              && grep -Fq 'window.EKODIShell' /tmp/shell.js \
              && grep -Fq 'EKODI 서비스 전환' /tmp/shell.js \
              && grep -Fq 'ekodi:public-experience' /tmp/shell.js \
              && grep -Fq '"rotation":"weekly-deterministic"' /tmp/theme.json \
              && grep -Fq '"timezone":"Asia/Seoul"' /tmp/theme.json \
              && grep -Fq 'data-ekodi-shell-surface="workspace"' /tmp/workspace.css \
              && grep -Fq 'data-ekodi-document-surface' /tmp/workspace.css; then
              echo 'EKODI Shell staging verified with public service switching, weekly service identity rotation, and stable internal UI.'
              exit 0
            fi
            sleep 4
          done
          exit 1

  production:
    if: >-
      always() && needs.validate.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (startsWith(github.event.pull_request.head.ref, 'release/ekodi-shell-') && needs.staging.result == 'success'))
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Shell production
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.toml
      - name: Verify real Shell hostname
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -sS -o /tmp/shell-live-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/health' || true)
            manifest=$(curl -sS -o /tmp/shell-live-manifest.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/manifest.json' || true)
            script=$(curl -sS -o /tmp/shell-live.js -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/shell.js' || true)
            theme=$(curl -sS -o /tmp/shell-live-theme.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/theme.json' || true)
            style=$(curl -sS -o /tmp/shell-live-workspace.css -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://shell.ekodi.kr/workspace.css' || true)
            if [[ "$health" == '200' && "$manifest" == '200' && "$script" == '200' && "$theme" == '200' && "$style" == '200' ]] \
              && grep -Fq '"identityModel":"person-space-role"' /tmp/shell-live-health.json \
              && grep -Fq '"shellPolicy":"required-for-user-facing-services"' /tmp/shell-live-manifest.json \
              && grep -Fq '"defaultSurface":"workspace"' /tmp/shell-live-manifest.json \
              && grep -Fq '"defaultSurface":"public"' /tmp/shell-live-manifest.json \
              && ! grep -Fq '"shellIntegration":"pending"' /tmp/shell-live-manifest.json \
              && grep -Fq '공간 전환 · My EKODI' /tmp/shell-live.js \
              && grep -Fq 'EKODI 서비스 전환' /tmp/shell-live.js \
              && grep -Fq 'ekodi:public-experience' /tmp/shell-live.js \
              && grep -Fq '"rotation":"weekly-deterministic"' /tmp/shell-live-theme.json \
              && grep -Fq '"timezone":"Asia/Seoul"' /tmp/shell-live-theme.json \
              && grep -Fq 'data-ekodi-shell-surface="workspace"' /tmp/shell-live-workspace.css \
              && grep -Fq 'data-ekodi-document-surface' /tmp/shell-live-workspace.css; then
              echo 'EKODI Shell production verified with public service switching, weekly service identity rotation, and stable internal UI.'
              exit 0
            fi
            sleep 5
          done
          exit 1
