name: Deploy EKODI Shell

on:
  workflow_dispatch:
  pull_request:
    paths: &shell_paths
      - 'ekodi-service-manifest.js'
      - 'ekodi-shell-worker.js'
      - 'ekodi-shell-injector.js'
      - 'ekodi-message-ui.js'
      - 'admin-authenticated-shell.js'
      - 'shell/**'
      - 'config/ecosystem-services.json'
      - 'config/user-footer.js'
      - 'config/user-ui-shell.json'
      - 'config/illustration-system.json'
      - 'config/internal-ui-rollout.json'
      - 'config/seasonal-design-governance.json'
      - 'docs/ekodi-shell-contract.md'
      - 'docs/user-ui-module-principles.md'
      - 'docs/admin-ui-module-principles.md'
      - 'scripts/verify-ekodi-shell-live.mjs'
      - 'scripts/validate-user-ui-dna.mjs'
      - 'scripts/validate-ekodi-shell-adoption.mjs'
      - 'scripts/validate-internal-ui-rollout.mjs'
      - 'scripts/validate-seasonal-design-governance.mjs'
      - 'wrangler.shell.toml'
      - 'wrangler.shell.staging.toml'
      - 'test/ekodi-shell.test.mjs'
      - 'test/user-ui-header.test.mjs'
      - 'test/user-global-nav.test.mjs'
      - 'test/admin-ui-shell.test.mjs'
      - '.github/workflows/deploy-ekodi-shell.yml'
      - 'release/ekodi-shell-*.marker'
  push:
    branches: [main]
    paths: *shell_paths

permissions:
  contents: read

concurrency:
  group: ekodi-shell-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.127.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Shell contracts, user/admin UI, Message UI, illustrations and ecosystem links
        run: |
          set -euo pipefail
          node --check ekodi-shell-worker.js
          node --check ekodi-shell-injector.js
          node --check ekodi-message-ui.js
          node --check admin-authenticated-shell.js
          node --check config/user-footer.js
          node --check shell/shell.js
          node --check shell/user-ui-header.js
          node --check shell/user-ui-footer.js
          node --check shell/user-language.js
          node --check shell/user-character.js
          node --check shell/admin-ui-shell.js
          node --check shell/mobile-fixed-header.js
          node --check shell/illustration-system.js
          node --check shell/service-design-inheritance.js
          node --check shell/ecosystem-link-compat.js
          node --check scripts/verify-ekodi-shell-live.mjs
          test -f config/user-ui-shell.json
          test -f config/illustration-system.json
          test -f shell/user-ui-shell.css
          test -f shell/workspace.css
          test -f docs/user-ui-module-principles.md
          test -f docs/admin-ui-module-principles.md
          grep -Fq 'data-ekodi-shell-surface="workspace"' shell/workspace.css
          grep -Fq 'data-ekodi-document-surface' shell/workspace.css
          grep -Fq "userHeaderUrl.pathname='/user-ui-header.js'" ekodi-shell-worker.js
          grep -Fq "userFooterUrl.pathname='/user-ui-footer.js'" ekodi-shell-worker.js
          grep -Fq "userLanguageUrl.pathname='/user-language.js'" ekodi-shell-worker.js
          grep -Fq "userCharacterUrl.pathname='/user-character.js'" ekodi-shell-worker.js
          grep -Fq "url.pathname==='/user-footer.json'" ekodi-shell-worker.js
          grep -Fq "x-ekodi-user-ui-header" ekodi-shell-worker.js
          grep -Fq "x-ekodi-user-ui-footer" ekodi-shell-worker.js
          grep -Fq "x-ekodi-user-language" ekodi-shell-worker.js
          grep -Fq "x-ekodi-user-character" ekodi-shell-worker.js
          grep -Fq "adminShellUrl.pathname='/admin-ui-shell.js'" ekodi-shell-worker.js
          grep -Fq "x-ekodi-admin-ui-shell" ekodi-shell-worker.js
          grep -Fq "messageUrl.pathname='/message-ui.js'" ekodi-shell-worker.js
          grep -Fq "illustrationUrl.pathname='/illustration-system.js'" ekodi-shell-worker.js
          grep -Fq "x-ekodi-message-ui" ekodi-shell-worker.js
          grep -Fq "x-ekodi-illustration-system" ekodi-shell-worker.js
          grep -Fq "linkCompatUrl.pathname='/ecosystem-link-compat.js'" ekodi-shell-worker.js
          grep -Fq "x-ekodi-link-compat" ekodi-shell-worker.js
          grep -Fq 'window.EKODIMessage' ekodi-message-ui.js
          grep -Fq 'window.EKODIIllustration' shell/illustration-system.js
          grep -Fq 'window.EKODIUserUIHeader' shell/user-ui-header.js
          grep -Fq 'window.EKODIUserUIFooter' shell/user-ui-footer.js
          grep -Fq 'window.EKODIUserLanguage' shell/user-language.js
          grep -Fq 'window.EKODIUserCharacter' shell/user-character.js
          grep -Fq '__EKODI_USER_FOOTER_CONFIG__' shell/user-ui-footer.js
          grep -Fq 'window.EKODIAdminUIShell' shell/admin-ui-shell.js
          grep -Fq '.side-brand' shell/admin-ui-shell.js
          grep -Fq 'node.remove()' shell/admin-ui-shell.js
          grep -Fq 'cuteNotChildish' config/illustration-system.json
          grep -Fq 'aiAsCompanionNotRobotMascot' config/illustration-system.json
          grep -Fq 'config/user-footer.js' config/user-ui-shell.json
          grep -Fq '"alignment": "center"' config/user-ui-shell.json
          grep -Fq -- '--ekodi-user-footer-background' shell/user-ui-shell.css
          grep -Fq 'text-align: center' shell/user-ui-shell.css
          grep -Fq '.ekodi-user-language' shell/user-ui-shell.css
          grep -Fq "'ekodibiz.kr':'biz'" shell/ecosystem-link-compat.js
          grep -Fq 'run_worker_first = true' wrangler.shell.toml
          grep -Fq 'run_worker_first = true' wrangler.shell.staging.toml
          node --test test/ekodi-shell.test.mjs test/user-ui-header.test.mjs test/user-global-nav.test.mjs test/admin-ui-shell.test.mjs
          node scripts/validate-user-ui-dna.mjs
          node scripts/validate-ekodi-shell-adoption.mjs
          node scripts/validate-seasonal-design-governance.mjs
          node scripts/validate-internal-ui-rollout.mjs

  staging:
    environment: development
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      EKODI_SHELL_VERIFY_BASE: https://ekodi-shell-staging.ekodi-development.workers.dev
      EKODI_SHELL_ALLOW_ACCESS_GATE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development Cloudflare boundary
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Prepare shared Message UI asset
        run: cp ekodi-message-ui.js shell/message-ui.js
      - name: Deploy isolated Shell staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.staging.toml
      - name: Confirm Shell staging deployment exists
        run: npx --yes wrangler@${WRANGLER_VERSION} deployments status --config wrangler.shell.staging.toml --json > /tmp/shell-staging-deployments.json
      - name: Verify Shell staging with release cache busting
        run: node scripts/verify-ekodi-shell-live.mjs

  production:
    if: github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.staging.result == 'success'
    needs: [validate, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EKODI_SHELL_VERIFY_BASE: https://shell.ekodi.kr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Prepare shared Message UI asset
        run: cp ekodi-message-ui.js shell/message-ui.js
      - name: Deploy Shell production after Development success
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.shell.toml
      - name: Verify real Shell hostname with release cache busting
        run: node scripts/verify-ekodi-shell-live.mjs
