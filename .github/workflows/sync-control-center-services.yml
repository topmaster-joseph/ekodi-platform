name: Sync Control Center Service Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-control-center-services.yml'
      - 'admin-menu-registry.js'
      - 'admin-demand-loader.js'
      - 'admin-shell.html'
      - 'config/ecosystem-services.json'
      - 'scripts/audit-admin-menu-services.mjs'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical Admin and service registry
        run: node scripts/audit-admin-menu-services.mjs
      - name: Assert registry verification is read-only
        shell: bash
        run: git diff --exit-code
