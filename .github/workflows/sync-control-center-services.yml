name: Sync Control Center Service Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-control-center-services.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Marketing AI and CGMA to admin UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          mission_portal = '''        <a href="https://youtube.com/@ekodicommunity" target="_blank" rel="noopener"><span class="service-logo mission">S</span><strong>에코디선교회</strong><small>YouTube 채널</small><b>↗</b></a>'''
          portal_extra = '''\n        <a href="https://marketing.ekodi.kr" target="_blank" rel="noopener"><span class="service-logo biz">AI</span><strong>마케팅AI</strong><small>marketing.ekodi.kr</small><b>↗</b></a>\n        <a href="https://cgma.ekodi.kr" target="_blank" rel="noopener"><span class="service-logo mall">청</span><strong>청계상권</strong><small>cgma.ekodi.kr</small><b>↗</b></a>'''
          if 'marketing.ekodi.kr</small><b>↗</b>' not in s:
              assert mission_portal in s
              s = s.replace(mission_portal, mission_portal + portal_extra, 1)

          s = s.replace('<strong>6 <small>/ 6</small></strong>', '<strong>8 <small>/ 8</small></strong>', 1)
          s = s.replace('6개 EKODI 서비스 실측 현황', '8개 EKODI 서비스 실측 현황', 1)

          mission_row = '''              <a class="service-row searchable" data-domain="youtube.com/@ekodicommunity" href="https://youtube.com/@ekodicommunity" target="_blank" rel="noopener"><span class="service-logo mission">S</span><div class="service-name"><strong>에코디선교회</strong><small>youtube.com/@ekodicommunity</small></div><span class="health"><i></i>확인 중</span><div class="mini-metric"><small>응답 시간</small><strong>—</strong></div><div class="mini-metric"><small>HTTP</small><strong>—</strong></div><span class="open">↗</span></a>'''
          rows_extra = '''\n              <a class="service-row searchable" data-domain="marketing.ekodi.kr" href="https://marketing.ekodi.kr" target="_blank" rel="noopener"><span class="service-logo biz">AI</span><div class="service-name"><strong>마케팅AI</strong><small>marketing.ekodi.kr</small></div><span class="health"><i></i>확인 중</span><div class="mini-metric"><small>응답 시간</small><strong>—</strong></div><div class="mini-metric"><small>HTTP</small><strong>—</strong></div><span class="open">↗</span></a>\n              <a class="service-row searchable" data-domain="cgma.ekodi.kr" href="https://cgma.ekodi.kr" target="_blank" rel="noopener"><span class="service-logo mall">청</span><div class="service-name"><strong>청계상권</strong><small>cgma.ekodi.kr</small></div><span class="health"><i></i>확인 중</span><div class="mini-metric"><small>응답 시간</small><strong>—</strong></div><div class="mini-metric"><small>HTTP</small><strong>—</strong></div><span class="open">↗</span></a>'''
          if 'data-domain="marketing.ekodi.kr"' not in s:
              assert mission_row in s
              s = s.replace(mission_row, mission_row + rows_extra, 1)

          p.write_text(s, encoding='utf-8')
      - name: Verify admin registry
        run: |
          grep -Fq 'data-domain="marketing.ekodi.kr"' admin.html
          grep -Fq 'data-domain="cgma.ekodi.kr"' admin.html
          grep -Fq '<strong>8 <small>/ 8</small></strong>' admin.html
          grep -Fq '8개 EKODI 서비스 실측 현황' admin.html
      - name: Commit admin UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Marketing AI and CGMA to control center"
          git push
