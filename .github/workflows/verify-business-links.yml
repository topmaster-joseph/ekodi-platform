name: Verify Business OS Links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - 'business/**'
      - 'business-worker.js'
      - 'business-live-worker.js'
      - 'auth-site/index.html'
      - 'auth-site/auth-router.js'
      - 'auth-site/business-auth.js'
      - 'site-worker.js'
      - 'canonical-surface-router.js'
      - 'scripts/build.mjs'
      - 'wrangler.business.toml'
      - 'supabase/functions/business-handoff-api/**'
      - 'config/ecosystem-services.json'
      - 'service-registry.json'
      - '.github/workflows/verify-business-links.yml'

permissions:
  contents: read

concurrency:
  group: verify-business-links
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Business OS auth and link source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check business-worker.js
          node --check business-live-worker.js
          node --check business/app.js
          node --check auth-site/auth-router.js
          node --check auth-site/business-auth.js
          node --check site-worker.js

          grep -Fq 'https://ekodi.kr/auth/?site=business&amp;return_to=https%3A%2F%2Fekodi.kr%2Fbusiness%2F' business/index.html
          grep -Fq "const AUTH_FALLBACK='https://ekodi.kr/auth/'" business/app.js
          grep -Fq "target.searchParams.set('site','business')" business/app.js
          grep -Fq "target.searchParams.set('return_to',canonicalBusinessUrl())" business/app.js
          grep -Fq 'AUTH_URL = "https://ekodi.kr/auth/?site=business&return_to=https%3A%2F%2Fekodi.kr%2Fbusiness%2F"' wrangler.business.toml
          grep -Fq "business-auth.js?v=20260826-free-fallback-1" auth-site/auth-router.js
          grep -Fq "'/business-auth.js'" canonical-surface-router.js
          grep -Fq "'business-auth.js'" scripts/build.mjs
          grep -Fq 'functions/v1/business-handoff-api' auth-site/business-auth.js
          grep -Fq '/api/auth/exchange' business/app.js
          grep -Fq "history.replaceState(null,'',location.pathname+location.search)" business/app.js
          grep -Fq "sessionStorage.setItem(SESSION_KEY" business/app.js
          grep -Fq 'const RETURN_TO="https://ekodi.kr/business/"' supabase/functions/business-handoff-api/index.ts
          grep -Fq 'business_os_snapshot' supabase/functions/business-handoff-api/index.ts

          for url in \
            'https://ekodi.kr/ekodibiz' \
            'https://ekodi.kr/ekodibiz/marketing-ai' \
            'https://ekodi.kr/work' \
            'https://ekodi.kr/jadam/marketing'; do
            grep -Fq "$url" business-worker.js business/index.html business/app.js || { echo "Missing Business OS link contract: $url"; exit 1; }
          done

  live-core:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify central auth and Business OS core routes
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local name="$1" url="$2" expect="$3"
            local code attempt
            for attempt in 1 2 3 4; do
              code=$(curl -L -sS -D "/tmp/${name}.headers" -o "/tmp/${name}.body" -w '%{http_code}' --connect-timeout 6 --max-time 20 "$url" || true)
              if [[ "$code" == "$expect" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 4 && ( "$code" == "000" || "$code" == 5* ) ]]; then
                echo "$name transient HTTP $code on attempt $attempt; retrying"
                sleep $((attempt * 2))
                continue
              fi
              echo "$name expected HTTP $expect but got $code"
              return 1
            done
          }

          probe business 'https://ekodi.kr/business/' 200
          grep -Fq 'BUSINESS OS' /tmp/business.body
          probe business_config 'https://ekodi.kr/business/config.js' 200
          grep -Fq 'https://ekodi.kr/auth/?site=business&return_to=https%3A%2F%2Fekodi.kr%2Fbusiness%2F' /tmp/business_config.body
          probe business_workspaces 'https://ekodi.kr/business/api/workspaces' 200
          grep -Fq '"id":"ekodibiz"' /tmp/business_workspaces.body
          grep -Fq '"id":"jadam"' /tmp/business_workspaces.body

          probe auth_business 'https://ekodi.kr/auth/?site=business&return_to=https%3A%2F%2Fekodi.kr%2Fbusiness%2F' 200
          grep -Fq 'EKODI 로그인' /tmp/auth_business.body
          probe auth_router 'https://ekodi.kr/auth/auth-router.js?v=20260826-free-fallback-1' 200
          grep -Fq "site==='business'" /tmp/auth_router.body
          probe business_auth_asset 'https://ekodi.kr/auth/business-auth.js?v=20260826-free-fallback-1' 200
          grep -Fq 'functions/v1/business-handoff-api' /tmp/business_auth_asset.body
          grep -Fiq 'x-ekodi-route: central-auth-asset' /tmp/business_auth_asset.headers
          grep -Fiq 'cache-control: no-store' /tmp/business_auth_asset.headers

      - name: Verify active Business OS downstream services
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            'EKODIBIZ|https://ekodi.kr/ekodibiz' \
            'MarketingAI|https://ekodi.kr/ekodibiz/marketing-ai' \
            'Work|https://ekodi.kr/work/' \
            'JadamMarketingAI|https://ekodi.kr/jadam/marketing'; do
            name=${entry%%|*}
            url=${entry#*|}
            code=000
            for attempt in 1 2 3 4; do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 6 --max-time 20 "$url" || true)
              case "$code" in
                200|204) break ;;
                000|5??)
                  if [[ "$attempt" -lt 4 ]]; then
                    echo "$name transient HTTP $code on attempt $attempt; retrying"
                    sleep $((attempt * 2))
                    continue
                  fi
                  ;;
              esac
              break
            done
            case "$code" in
              200|204) echo "$name OK ($code)" ;;
              *) echo "$name unavailable or redirected to error ($code): $url"; exit 1 ;;
            esac
          done

      - name: Inspect auxiliary Business hubs without blocking core release
        shell: bash
        run: |
          set -u
          for entry in \
            'Pay|https://ekodi.kr/ekodibiz/pay/' \
            'Mail|https://ekodi.kr/ekodibiz/mail/' \
            'Trade|https://ekodi.kr/ekodibiz/trade/'; do
            name=${entry%%|*}
            url=${entry#*|}
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 6 --max-time 20 "$url" || true)
            case "$code" in
              200|204) echo "$name auxiliary hub OK ($code)" ;;
              *) echo "::warning::$name auxiliary hub returned HTTP $code: $url" ;;
            esac
          done
