name: Promote EKODI Biz Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-biz-domain.yml

permissions:
  contents: write

concurrency:
  group: ekodi-biz-domain-promotion
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require healthy biz.ekodi.kr edge
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://biz.ekodi.kr/" || true)
          echo "biz.ekodi.kr edge_http=$code"
          case "$code" in 2*|3*) ;; *) exit 1 ;; esac
      - name: Sync latest main and promote business URL
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'scripts/monitor-lib.mjs']:
              p = Path(name)
              s = p.read_text(encoding='utf-8').replace('ekodibiz.kr', 'biz.ekodi.kr')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify application
        run: |
          npm run check
          npm test
      - name: Commit and push business-domain promotion
        run: |
          git config user.name "EKODI Automation"
          git config user.email "automation@ekodi.kr"
          git add index.html scripts/monitor-lib.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Use biz.ekodi.kr as business service URL"
            git pull --rebase origin main
            git push
          fi
      - name: Deploy updated platform site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:site
