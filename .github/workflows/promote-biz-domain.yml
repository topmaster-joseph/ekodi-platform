name: Validate EKODI Biz Domain

on:
  workflow_dispatch:
  pull_request:
    paths: &biz_paths
      - 'index.html'
      - 'scripts/monitor-lib.mjs'
      - '.github/workflows/promote-biz-domain.yml'
  push:
    branches: [main]
    paths: *biz_paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify canonical Biz URL in source
        run: |
          set -euo pipefail
          if grep -Fq 'ekodibiz.kr' index.html scripts/monitor-lib.mjs; then
            echo 'Retired ekodibiz.kr URL remains in shared-site source.'
            exit 1
          fi
          grep -Fq 'biz.ekodi.kr' index.html scripts/monitor-lib.mjs
          npm run check
          npm test
      - name: Verify single production owner policy
        run: node scripts/validate-deployment-guardrails.mjs
