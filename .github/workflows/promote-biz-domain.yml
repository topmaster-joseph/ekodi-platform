name: Promote EKODI Biz Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-biz-domain.yml

permissions:
  contents: write

concurrency:
  group: ekodi-biz-domain-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require healthy biz.ekodi.kr before promotion
        run: |
          set -u
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://biz.ekodi.kr/" || true)
            case "$code" in 2*|3*) break ;; esac
            sleep 5
          done
          echo "biz.ekodi.kr http=$code"
          case "$code" in 2*|3*) ;; *) exit 1 ;; esac
      - name: Promote business service URL
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'scripts/monitor-lib.mjs']:
              p = Path(name)
              s = p.read_text(encoding='utf-8').replace('ekodibiz.kr', 'biz.ekodi.kr')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify application
        run: |
          npm run check
          npm test
      - name: Commit business-domain promotion
        run: |
          git config user.name "EKODI Automation"
          git config user.email "automation@ekodi.kr"
          git add index.html scripts/monitor-lib.mjs
          git diff --cached --quiet || git commit -m "Use biz.ekodi.kr as business service URL"
          git push
      - name: Deploy updated platform site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:site
