name: Verify Admin Authenticated Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-*.js'
      - 'marketing-funnel-admin.js'
      - 'scripts/admin-authenticated-e2e.mjs'
      - 'scripts/admin-authenticated-e2e-retry.mjs'
      - '.github/workflows/admin-authenticated-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-admin-authenticated-e2e
  cancel-in-progress: true

jobs:
  authenticated-admin-e2e:
    name: authenticated-admin-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Issue short-lived genuine super-admin session
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 --retry-delay 1 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }

          databases=$(curl -fsS --retry 2 --retry-delay 1 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$databases" | jq -e '.success == true' >/dev/null

          auth_db=''
          admin_id=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admins','sessions')" || true)
            if ! echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("admins") != null and index("sessions") != null)' >/dev/null 2>&1; then
              continue
            fi
            candidate=$(cf_query "$db" "SELECT id FROM admins WHERE role='super_admin' ORDER BY id LIMIT 1" || true)
            id=$(echo "$candidate" | jq -r '.result[]?.results[0]?.id // empty' | head -1)
            if [[ "$id" =~ ^[0-9]+$ ]]; then
              auth_db="$db"
              admin_id="$id"
              break
            fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')

          if [ -z "$auth_db" ] || [ -z "$admin_id" ]; then
            echo 'Could not locate the authorized EKODI auth D1 database with a super_admin account.'
            exit 1
          fi

          token=$(openssl rand -hex 32)
          token_hash=$(printf '%s' "$token" | sha256sum | awk '{print $1}')
          created=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          expires=$(date -u -d '+20 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')
          echo "::add-mask::$token"
          echo "::add-mask::$token_hash"

          insert="INSERT INTO sessions (token_hash, admin_id, expires_at, created_at) VALUES ('$token_hash', $admin_id, '$expires', '$created')"
          result=$(cf_query "$auth_db" "$insert")
          echo "$result" | jq -e '.success == true and ([.result[]?.success] | all)' >/dev/null

          session=$(curl -fsS --retry 3 --retry-delay 1 'https://api.ekodi.kr/api/session' -H "Authorization: Bearer $token")
          echo "$session" | jq -e '.role == "super_admin"' >/dev/null

          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_TOKEN_HASH=$token_hash" >> "$GITHUB_ENV"
          echo "E2E_AUTH_DB_ID=$auth_db" >> "$GITHUB_ENV"
          echo 'Short-lived production-authenticated E2E session issued and validated.'

      - name: Install Chromium browser harness
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Click and render every authenticated admin menu
        run: node scripts/admin-authenticated-e2e-retry.mjs

      - name: Publish E2E summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/admin-authenticated-e2e/report.json ]; then
            echo '## Authenticated admin browser E2E' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            jq -r '"- Passed: \(.passed)\n- Menus checked: \(.checkedMenuCount)/\(.expectedMenuCount)\n- Page errors: \(.diagnostics.pageErrors|length)\n- Admin asset failures: \(.diagnostics.failedAdminAssets|length)"' artifacts/admin-authenticated-e2e/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '| Menu | Group | Result | Duration |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---|---|---:|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.results[] | "| \(.id) | \(.group) | ✅ | \(.durationMs) ms |"' artifacts/admin-authenticated-e2e/report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Revoke short-lived E2E session
        if: always() && env.E2E_AUTH_DB_ID != '' && env.E2E_TOKEN_HASH != ''
        shell: bash
        run: |
          set -euo pipefail
          sql="DELETE FROM sessions WHERE token_hash = '$E2E_TOKEN_HASH'"
          curl -fsS --retry 2 --retry-delay 1 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_AUTH_DB_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" \
            | jq -e '.success == true' >/dev/null
          echo 'Short-lived E2E session revoked.'