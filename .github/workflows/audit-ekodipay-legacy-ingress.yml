name: EKODI Pay Legacy Ingress Audit
on:
  pull_request:
    paths:
      - 'scripts/audit-ekodipay-legacy-ingress.mjs'
      - 'test/ekodipay-legacy-ingress.test.mjs'
      - '.github/workflows/audit-ekodipay-legacy-ingress.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-ekodipay-legacy-ingress.mjs'
      - 'test/ekodipay-legacy-ingress.test.mjs'
      - '.github/workflows/audit-ekodipay-legacy-ingress.yml'
permissions:
  contents: read
concurrency:
  group: ekodipay-legacy-dns-audit
  cancel-in-progress: false
jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate exact-host read-only logic
        run: |
          node --check scripts/audit-ekodipay-legacy-ingress.mjs
          node --test test/ekodipay-legacy-ingress.test.mjs
          node scripts/audit-ekodipay-legacy-ingress.mjs --test-targets
          if grep -Eq 'method.*(POST|PUT|PATCH|DELETE)' scripts/audit-ekodipay-legacy-ingress.mjs; then
            echo 'Read-only Cloudflare audit cannot execute mutation verbs'
            exit 1
          fi
  collect-production-inventory:
    needs: verify-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify official release provenance before reading production secrets
        run: node scripts/validate-ekodi-ai-change-orchestration.mjs --release
      - name: Inspect only exact retired payment hosts
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/audit-ekodipay-legacy-ingress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekodipay-legacy-ingress-${{ github.run_id }}
          path: artifacts/ekodipay-legacy-ingress-audit.json
          retention-days: 14
          if-no-files-found: warn
