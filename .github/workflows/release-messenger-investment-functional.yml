name: Release EKODI Conversation Foundation API

on:
  pull_request:
    paths: &conversation_paths
      - 'migrations/*messenger*.sql'
      - 'migrations/*profile*.sql'
      - 'profile-evidence-runtime.js'
      - 'ekodi-principal.js'
      - 'messenger-triage.js'
      - 'messenger-outbox.js'
      - 'messenger-channel-adapters.js'
      - 'messenger-operator-control.js'
      - 'workspace-messenger-v2.js'
      - 'workspace-platform-entry-worker.js'
      - 'workspace-platform-api-worker.js'
      - 'mission-control-entry-worker.js'
      - 'wrangler.workspace-platform.toml'
      - 'deploy/manifests/workspace-platform.worker.json'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'test/workspace-platform.test.mjs'
      - 'test/conversation-foundation-release.test.mjs'
      - 'test/profile-evidence-contract.test.mjs'
      - '.github/workflows/release-messenger-investment-functional.yml'
  push:
    branches: [main]
    paths: *conversation_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Conversation, Operator, Investment and Profile boundaries
        run: |
          set -euo pipefail
          for file in ekodi-principal.js profile-evidence-runtime.js messenger-triage.js messenger-outbox.js messenger-channel-adapters.js messenger-operator-control.js workspace-messenger-v2.js workspace-platform-entry-worker.js workspace-platform-api-worker.js mission-control-entry-worker.js; do node --check "$file"; done
          node --test test/workspace-platform.test.mjs test/conversation-foundation-release.test.mjs test/profile-evidence-contract.test.mjs
          node scripts/validate-additive-migrations.mjs migrations
          bash -n scripts/apply-d1-migrations-with-retry.sh
          grep -Fq 'messenger_outbox' migrations/0030_messenger_event_outbox.sql
          grep -Fq 'ekodi_profile_evidence' migrations/0032_official_data_profile_evidence.sql
          grep -Fq 'conversationFoundation' workspace-platform-entry-worker.js
          grep -Fq 'profileEvidenceFoundation' workspace-platform-entry-worker.js
          grep -Fq '/api/control/messenger' mission-control-entry-worker.js
          grep -Fq 'analysis-and-connection-only' workspace-platform-api-worker.js
          ! grep -Eiq 'brokerage_order|securities_order|custody_balance|guaranteed_return' migrations/0028_messenger_investment_workspaces.sql
          npm run build
          node scripts/validate-deployment-guardrails.mjs

  production-workspace:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture D1 recovery bookmark
        run: npx --yes wrangler@4.119.0 d1 time-travel info ekodi-auth --config wrangler.workspace-platform.toml --json > /tmp/bookmark.json
      - name: Apply additive Workspace migrations
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.workspace-platform.toml 4.119.0
      - name: Guarded Workspace API release
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/workspace-platform.worker.json
      - name: Verify production Conversation foundation
        run: |
          curl -fsS 'https://workspace-api.ekodi.kr/health' > /tmp/live-health.json
          grep -Fq '"schemaReady":true' /tmp/live-health.json
          grep -Fq '"conversationFoundation":"v2"' /tmp/live-health.json
          grep -Fq '"profileEvidenceFoundation":"v1"' /tmp/live-health.json

# Messenger/Invest UI assets are shared-site artifacts and are promoted only by
# Deploy EKODI Shared Site Core. This workflow never writes the shared Worker.
