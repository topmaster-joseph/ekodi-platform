name: Release Messenger & Investment Functional MVP

on:
  pull_request:
    paths:
      - 'migrations/0028_messenger_investment_workspaces.sql'
      - 'migrations/0029_messenger_ai_operator_channels.sql'
      - 'migrations/0030_messenger_event_outbox.sql'
      - 'ekodi-principal.js'
      - 'messenger-triage.js'
      - 'messenger-outbox.js'
      - 'messenger-channel-adapters.js'
      - 'workspace-messenger-v2.js'
      - 'workspace-platform-entry-worker.js'
      - 'workspace-platform-api-worker.js'
      - 'wrangler.workspace-platform.toml'
      - 'wrangler.workspace-platform-staging.toml'
      - 'wrangler.workspace-platform-bootstrap.toml'
      - 'deploy/manifests/workspace-platform.worker.json'
      - 'platform-router-worker.js'
      - 'deploy/manifests/shared-site.worker.json'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'test/workspace-platform.test.mjs'
      - '.github/workflows/release-messenger-investment-functional.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/0028_messenger_investment_workspaces.sql'
      - 'migrations/0029_messenger_ai_operator_channels.sql'
      - 'migrations/0030_messenger_event_outbox.sql'
      - 'ekodi-principal.js'
      - 'messenger-triage.js'
      - 'messenger-outbox.js'
      - 'messenger-channel-adapters.js'
      - 'workspace-messenger-v2.js'
      - 'workspace-platform-entry-worker.js'
      - 'workspace-platform-api-worker.js'
      - 'wrangler.workspace-platform.toml'
      - 'wrangler.workspace-platform-staging.toml'
      - 'wrangler.workspace-platform-bootstrap.toml'
      - 'deploy/manifests/workspace-platform.worker.json'
      - 'platform-router-worker.js'
      - 'deploy/manifests/shared-site.worker.json'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'test/workspace-platform.test.mjs'
      - '.github/workflows/release-messenger-investment-functional.yml'

permissions:
  contents: read

# Shared with Deploy Control API. Both workflows touch ekodi-auth and versioned Workers.
# A single global lane prevents concurrent D1 registry writes and disappearing candidates.
concurrency:
  group: ekodi-shared-d1-worker-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  API_STAGING_URL: https://ekodi-workspace-platform-api-staging.topmaster-joseph.workers.dev
  SITE_STAGING_URL: https://ekodi-shared-site-staging.topmaster-joseph.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Conversation foundation and existing Investment contract
        run: |
          set -euo pipefail
          node --check ekodi-principal.js
          node --check messenger-triage.js
          node --check messenger-outbox.js
          node --check messenger-channel-adapters.js
          node --check workspace-messenger-v2.js
          node --check workspace-platform-entry-worker.js
          node --check workspace-platform-api-worker.js
          node --check platform-router-worker.js
          node --test test/workspace-platform.test.mjs
          node scripts/validate-additive-migrations.mjs migrations
          bash -n scripts/apply-d1-migrations-with-retry.sh
          grep -Fq 'messenger_outbox' migrations/0030_messenger_event_outbox.sql
          grep -Fq 'conversationFoundation' workspace-platform-entry-worker.js
          grep -Fq 'analysis-and-connection-only' workspace-platform-api-worker.js
          ! grep -Eiq 'brokerage_order|securities_order|custody_balance|guaranteed_return' migrations/0028_messenger_investment_workspaces.sql

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve isolated Workspace staging D1
        id: staging_d1
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.result||[]);const x=a.find(v=>v.name==='ekodi-workspace-staging');if(x)process.stdout.write(x.uuid||x.id||'')})"
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-workspace-staging --location apac
            DB_ID=$(list_db)
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build isolated Workspace staging config
        env:
          DB_ID: ${{ steps.staging_d1.outputs.database_id }}
        run: |
          cat > wrangler.workspace.runtime.toml <<EOF
          name = "ekodi-workspace-platform-api-staging"
          main = "workspace-platform-entry-worker.js"
          compatibility_date = "2026-08-18"
          workers_dev = true
          preview_urls = false
          [vars]
          ENVIRONMENT = "staging"
          ALLOW_MUTATIONS = "false"
          ALLOWED_ORIGINS = "https://messenger.ekodi.kr,https://invest.ekodi.kr,https://my.ekodi.kr"
          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-workspace-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
      - name: Apply all migrations to isolated Workspace staging
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config wrangler.workspace.runtime.toml
      - name: Deploy read-only isolated Workspace staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.workspace.runtime.toml
      - name: Verify Conversation schema and mutation isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$API_STAGING_URL/health" || true)
            if [[ "$code" == '200' ]] \
              && grep -Fq '"schemaReady":true' /tmp/health.json \
              && grep -Fq '"mutations":false' /tmp/health.json \
              && grep -Fq '"transactionExecution":false' /tmp/health.json \
              && grep -Fq '"conversationFoundation":"v2"' /tmp/health.json \
              && grep -Fq '"eventOutbox":true' /tmp/health.json \
              && grep -Fq '"conversationSchemaReady":true' /tmp/health.json; then
              exit 0
            fi
            sleep 4
          done
          cat /tmp/health.json || true
          exit 1
      - name: Cleanup runtime config
        if: always()
        run: rm -f wrangler.workspace.runtime.toml

  production-api:
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture D1 recovery bookmark
        id: d1_bookmark
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 time-travel info ekodi-auth --config wrangler.workspace-platform.toml --json > /tmp/bookmark.json
          BOOKMARK=$(node -e "const j=require('/tmp/bookmark.json');const walk=x=>{if(!x||typeof x!=='object')return '';if(typeof x.bookmark==='string')return x.bookmark;for(const v of Object.values(x)){const r=walk(v);if(r)return r}return ''};process.stdout.write(walk(j))")
          test -n "$BOOKMARK"
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"
      - name: Apply production migration after isolated staging success
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.workspace-platform.toml "$WRANGLER_VERSION"
      - name: Guarded 0-percent Workspace candidate then promote
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/workspace-platform.worker.json
      - name: Deploy cron trigger after healthy code promotion
        run: npx --yes wrangler@${WRANGLER_VERSION} triggers deploy --config wrangler.workspace-platform.toml
      - name: Verify production Conversation foundation
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/live-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://workspace-api.ekodi.kr/health')
          [[ "$code" == '200' ]]
          grep -Fq '"schemaReady":true' /tmp/live-health.json
          grep -Fq '"mutations":true' /tmp/live-health.json
          grep -Fq '"transactionExecution":false' /tmp/live-health.json
          grep -Fq '"conversationFoundation":"v2"' /tmp/live-health.json
          grep -Fq '"eventOutbox":true' /tmp/live-health.json
          grep -Fq '"conversationSchemaReady":true' /tmp/live-health.json
      - name: Record recovery point
        env:
          BOOKMARK: ${{ steps.d1_bookmark.outputs.bookmark }}
        run: |
          echo "D1 recovery bookmark before Conversation release: $BOOKMARK" >> "$GITHUB_STEP_SUMMARY"

  staging-ui:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and deploy shared site staging
        run: |
          npm run build
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.site-staging.toml
      - name: Verify Messenger and Investment shell assets
        run: |
          set -euo pipefail
          for host in messenger.ekodi.kr invest.ekodi.kr; do
            code=$(curl -sS -o /tmp/root.html -w '%{http_code}' -H "x-ekodi-staging-host: $host" "$SITE_STAGING_URL/" || true)
            [[ "$code" == '200' ]]
            grep -Fq 'FUNCTIONAL BETA' /tmp/root.html
          done

  production-ui:
    needs: [production-api, staging-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build shared site assets
        run: npm run build
      - name: Guarded shared-site candidate then promote
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json
      - name: Verify production Messenger surface
        run: |
          set -euo pipefail
          root=$(curl -sS -D /tmp/headers -o /tmp/root.html -w '%{http_code}' 'https://messenger.ekodi.kr/')
          app=$(curl -sS -o /tmp/app.js -w '%{http_code}' 'https://messenger.ekodi.kr/app.js')
          [[ "$root" == '200' && "$app" == '200' ]]
          grep -Fq 'EKODI Messenger' /tmp/root.html
          grep -Fq 'https://workspace-api.ekodi.kr' /tmp/app.js
          grep -Fiq 'x-ekodi-shell: v1' /tmp/headers
