name: Release EKODI Conversation Foundation APIs

on:
  pull_request:
    paths: &conversation_paths
      - 'migrations/*messenger*.sql'
      - 'migrations/*profile*.sql'
      - 'migrations/*design*.sql'
      - 'design-profile-runtime.js'
      - 'profile-evidence-runtime.js'
      - 'profile-official-data-adapter.js'
      - 'invest-personalization-runtime.js'
      - 'ekodi-principal.js'
      - 'messenger-triage.js'
      - 'messenger-outbox.js'
      - 'messenger-channel-adapters.js'
      - 'messenger-operator-control.js'
      - 'workspace-messenger-v2.js'
      - 'workspace-platform-entry-worker.js'
      - 'workspace-platform-api-worker.js'
      - 'mission-control-entry-worker.js'
      - 'wrangler.workspace-platform.toml'
      - 'wrangler.api.toml'
      - 'deploy/manifests/workspace-platform.worker.json'
      - 'deploy/manifests/control-api.worker.json'
      - 'scripts/apply-d1-migrations-with-retry.sh'
      - 'test/workspace-platform.test.mjs'
      - 'test/conversation-foundation-release.test.mjs'
      - 'test/profile-evidence-contract.test.mjs'
      - 'test/design-profile-contract.test.mjs'
      - 'test/invest-personalization-contract.test.mjs'
      - '.github/workflows/release-messenger-investment-functional.yml'
  push:
    branches: [main]
    paths: *conversation_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-conversation-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.119.0'
  WORKSPACE_STAGING_URL: https://ekodi-workspace-platform-api-staging.ekodi-development.workers.dev
  CONTROL_STAGING_URL: https://ekodi-conversation-control-staging.ekodi-development.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Conversation, Operator, Investment and Profile boundaries
        run: |
          set -euo pipefail
          for file in ekodi-principal.js profile-evidence-runtime.js profile-official-data-adapter.js invest-personalization-runtime.js design-profile-runtime.js messenger-triage.js messenger-outbox.js messenger-channel-adapters.js messenger-operator-control.js workspace-messenger-v2.js workspace-platform-entry-worker.js workspace-platform-api-worker.js mission-control-entry-worker.js; do node --check "$file"; done
          node --test test/workspace-platform.test.mjs test/profile-evidence-contract.test.mjs test/design-profile-contract.test.mjs test/invest-personalization-contract.test.mjs
          node scripts/validate-additive-migrations.mjs migrations
          bash -n scripts/apply-d1-migrations-with-retry.sh
          grep -Fq 'messenger_outbox' migrations/0030_messenger_event_outbox.sql
          grep -Fq 'ekodi_profile_evidence' migrations/0032_official_data_profile_evidence.sql
          grep -Fq 'site_design_profiles' migrations/0055_adaptive_design_profiles.sql
          grep -Fq 'conversationFoundation' workspace-platform-entry-worker.js
          grep -Fq 'profileEvidenceFoundation' workspace-platform-entry-worker.js
          grep -Fq "investPersonalization:'v1'" workspace-platform-entry-worker.js
          grep -Fq '/api/control/messenger' mission-control-entry-worker.js
          grep -Fq 'analysis-and-connection-only' workspace-platform-api-worker.js
          ! grep -Eiq 'brokerage_order|securities_order|custody_balance|guaranteed_return' migrations/0028_messenger_investment_workspaces.sql
          npm run build
          node scripts/validate-deployment-guardrails.mjs

  workspace-staging:
    needs: validate
    if: github.event_name != 'pull_request'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve isolated Workspace staging D1
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),a=Array.isArray(j)?j:(j.result||[]),x=a.find(v=>v.name==='ekodi-workspace-staging');process.stdout.write(x?.uuid||x?.id||'')})")
          if [ -z "$DB_ID" ]; then npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-workspace-staging --location apac; DB_ID=$(npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),a=Array.isArray(j)?j:(j.result||[]),x=a.find(v=>v.name==='ekodi-workspace-staging');process.stdout.write(x?.uuid||x?.id||'')})"); fi
          test -n "$DB_ID"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy isolated read-only Workspace staging
        env:
          DB_ID: ${{ steps.db.outputs.id }}
        run: |
          cat > .workspace-staging.toml <<EOF
          name = "ekodi-workspace-platform-api-staging"
          main = "workspace-platform-entry-worker.js"
          compatibility_date = "2026-08-18"
          workers_dev = true
          preview_urls = false
          [vars]
          ENVIRONMENT = "staging"
          ALLOW_MUTATIONS = "false"
          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-workspace-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config .workspace-staging.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config .workspace-staging.toml
      - name: Verify isolated Workspace staging
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' --connect-timeout 5 --max-time 15 "$WORKSPACE_STAGING_URL/health" || true)
            if [ "$code" = '200' ] \
              && grep -Fq '"mutations":false' /tmp/health \
              && grep -Fq '"conversationSchemaReady":true' /tmp/health \
              && grep -Fq '"designProfileSchemaReady":true' /tmp/health \
              && grep -Fq '"investPersonalization":"v1"' /tmp/health \
              && grep -Fq '"transactionExecution":false' /tmp/health; then
              exit 0
            fi
            echo "workspace staging health attempt=$attempt/18 http=$code body=$(cat /tmp/health 2>/dev/null || true)"
            sleep 4
          done
          exit 1

  control-staging:
    needs: workspace-staging
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve isolated Control staging D1
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB_ID=$(npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),a=Array.isArray(j)?j:(j.result||[]),x=a.find(v=>v.name==='ekodi-conversation-control-staging');process.stdout.write(x?.uuid||x?.id||'')})")
          if [ -z "$DB_ID" ]; then npx --yes wrangler@${WRANGLER_VERSION} d1 create ekodi-conversation-control-staging --location apac; DB_ID=$(npx --yes wrangler@${WRANGLER_VERSION} d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),a=Array.isArray(j)?j:(j.result||[]),x=a.find(v=>v.name==='ekodi-conversation-control-staging');process.stdout.write(x?.uuid||x?.id||'')})"); fi
          test -n "$DB_ID"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy isolated Control staging
        env:
          DB_ID: ${{ steps.db.outputs.id }}
        run: |
          cat > .control-staging.toml <<EOF
          name = "ekodi-conversation-control-staging"
          main = "mission-control-entry-worker.js"
          compatibility_date = "2026-08-12"
          workers_dev = true
          preview_urls = false
          [vars]
          ENVIRONMENT = "staging"
          [[d1_databases]]
          binding = "DB"
          database_name = "ekodi-conversation-control-staging"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config .control-staging.toml
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config .control-staging.toml
      - name: Verify Operator authentication boundary
        run: |
          for attempt in $(seq 1 18); do
            health=$(curl -sS -o /tmp/control-health -w '%{http_code}' "$CONTROL_STAGING_URL/health" || true)
            inbox=$(curl -sS -o /tmp/control-inbox -w '%{http_code}' "$CONTROL_STAGING_URL/api/control/messenger/inbox" || true)
            if [ "$health" = '200' ] && [ "$inbox" = '401' ]; then exit 0; fi
            sleep 4
          done
          exit 1

  production-workspace:
    needs: control-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture D1 recovery bookmark
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 time-travel info ekodi-auth --config wrangler.workspace-platform.toml --json > /tmp/bookmark.json
      - name: Apply production migration once after both staging gates
        run: bash scripts/apply-d1-migrations-with-retry.sh ekodi-auth wrangler.workspace-platform.toml "$WRANGLER_VERSION"
      - name: Guarded Workspace API release
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/workspace-platform.worker.json
      - name: Verify production Workspace foundation
        run: |
          curl -fsS 'https://workspace-api.ekodi.kr/health' > /tmp/live-health.json
          grep -Fq '"schemaReady":true' /tmp/live-health.json
          grep -Fq '"conversationSchemaReady":true' /tmp/live-health.json
          grep -Fq '"profileEvidenceFoundation":"v1"' /tmp/live-health.json
          grep -Fq '"adaptiveDesign":"v1"' /tmp/live-health.json
          grep -Fq '"designProfileSchemaReady":true' /tmp/live-health.json
          grep -Fq '"officialDataProvider":"embedded-v1"' /tmp/live-health.json
          grep -Fq '"investPersonalization":"v1"' /tmp/live-health.json

  production-control:
    needs: production-workspace
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Guarded Conversation Control API release
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/control-api.worker.json
      - name: Verify production Operator boundary
        run: |
          code=$(curl -sS -o /tmp/inbox -w '%{http_code}' https://api.ekodi.kr/api/control/messenger/inbox || true)
          test "$code" = '401'

# Shared Messenger/Invest UI is not owned here. Deploy EKODI Shared Site Core is
# the only workflow allowed to write deploy/manifests/shared-site.worker.json.
