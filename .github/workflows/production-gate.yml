name: Production Revenue Gate

on:
  workflow_run:
    workflows: ['Deploy EKODI Shared Site Core']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-post-deploy-canary
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID || '46aad4738793fbaca88574832a2ccc0f' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release

      - name: Read Production Cloudflare quota Source of Truth
        id: quota
        run: node scripts/cloudflare-production-budget.mjs --output=cloudflare-production-quota.json

      - name: Run one quota-aware post-deploy canary
        id: canary
        env:
          EKODI_CF_QUOTA_STATE: ${{ steps.quota.outputs.state }}
        run: node scripts/post-deploy-canary.mjs --scope=full --output=production-canary.json

      - name: Create production completion evidence
        if: success()
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          QUOTA_STATE: ${{ steps.quota.outputs.state }}
          QUOTA_REQUESTS: ${{ steps.quota.outputs.requests }}
          QUOTA_PERCENT: ${{ steps.quota.outputs.percent }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > artifacts/production-completion-evidence.json <<EOF
          {
            "schemaVersion": 2,
            "policyId": "AI-COMPLETE-001",
            "quotaPolicyId": "CF-QUOTA-001",
            "status": "production-verified-complete",
            "releaseSha": "${RELEASE_SHA}",
            "sourceDeploymentRunId": "${SOURCE_RUN_ID}",
            "productionHostname": "ekodi.kr ecosystem",
            "verificationMode": "single-post-deploy-canary",
            "quota": {
              "state": "${QUOTA_STATE}",
              "requests": ${QUOTA_REQUESTS},
              "percent": ${QUOTA_PERCENT}
            },
            "observabilityCheck": "Cloudflare Production Analytics + quota-aware canary",
            "verificationTimestamp": "${verified_at}"
          }
          EOF

      - name: Preserve quota, canary and completion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-post-deploy-canary-${{ github.run_id }}
          path: |
            cloudflare-production-quota.json
            production-canary.json
            artifacts/production-completion-evidence.json
          if-no-files-found: warn
          retention-days: 30
