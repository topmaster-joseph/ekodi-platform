name: Production Revenue Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-worker.js'
      - 'api-worker.js'
      - 'admin-shell.html'
      - 'admin-authenticated-shell.js'
      - 'admin-central-handoff.js'
      - 'test/**'
      - 'config/ai-development-completion-policy.json'
      - 'scripts/validate-ai-development-completion-policy.mjs'
      - '.github/workflows/production-gate.yml'
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: read

concurrency:
  group: production-revenue-gate
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Identify EKODI monitor traffic
        shell: bash
        run: |
          printf '%s\n' 'user-agent = "EKODI-github-monitor/1.0"' > "$HOME/.curlrc"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run business contract tests only when source changed or manually requested
        if: github.event_name != 'schedule'
        run: npm test
      - name: Verify revenue-critical production endpoints
        shell: bash
        run: |
          set -euo pipefail

          verify_html() {
            url="$1"
            needle="$2"
            label="$3"
            code=$(curl -sS --max-redirs 3 -D /tmp/headers -o /tmp/body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url")
            echo "$label | $url | HTTP $code"
            [ "$code" = '200' ]
            grep -Fq "$needle" /tmp/body
          }

          verify_admin() {
            url="$1"
            route="$2"
            code=$(curl -sS --max-redirs 0 -D /tmp/headers -o /tmp/body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url")
            echo "ADMIN | $url | HTTP $code"
            [ "$code" = '200' ]
            grep -Fiq "x-ekodi-route: $route" /tmp/headers
            ! grep -Fiq '^location:' /tmp/headers
            grep -Fq '<title>EKODI Admin</title>' /tmp/body
          }

          verify_redirect() {
            url="$1"
            target="$2"
            label="$3"
            code=$(curl -sS --max-redirs 0 -D /tmp/headers -o /tmp/body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url")
            echo "$label | $url | HTTP $code"
            [ "$code" = '308' ]
            grep -Fiq "location: $target" /tmp/headers
          }

          verify_admin 'https://ekodi.kr/admin/' 'admin-shell'
          verify_redirect 'https://ekodi.kr/admin' 'https://ekodi.kr/admin/' 'ADMIN CANONICAL SLASH'
          verify_redirect 'https://admin.ekodi.kr/' 'https://ekodi.kr/admin/?source=admin.ekodi.kr' 'ADMIN LEGACY ROOT'
          verify_redirect 'https://admin.ekodi.kr/admin' 'https://ekodi.kr/admin/?source=admin.ekodi.kr' 'ADMIN LEGACY PATH'
          verify_redirect 'https://admin.ekodi.kr/control-center.html' 'https://ekodi.kr/admin/?source=admin.ekodi.kr' 'ADMIN LEGACY RETIRED'
          verify_html 'https://ekodi.kr/cgma/' '청계면상인회' 'CLIENT cgma'
          verify_html 'https://jadam.ekodi.kr/' '자담치킨 목포대점' 'CLIENT jadam'
          verify_html 'https://pizzamaru.ekodi.kr/' '피자마루 목포대점' 'CLIENT pizzamaru'
          verify_html 'https://yogurt.ekodi.kr/' '요거트퍼플 목포대점' 'CLIENT yogurt'
          verify_html 'https://marketing.ekodi.kr/' '마케팅AI' 'PLATFORM marketing'

          api_code=$(curl -sS -o /tmp/api -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://api.ekodi.kr/health')
          echo "CONTROL API | https://api.ekodi.kr/health | HTTP $api_code"
          [ "$api_code" = '200' ]
      - name: Create production completion evidence
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > artifacts/production-completion-evidence.json <<EOF
          {
            "schemaVersion": 1,
            "policyId": "AI-COMPLETE-001",
            "status": "production-verified-complete",
            "releaseSha": "${RELEASE_SHA}",
            "workflowRunId": "${RUN_ID}",
            "workflowRunAttempt": "${RUN_ATTEMPT}",
            "productionHostname": "ekodi.kr ecosystem",
            "functionalChecks": [
              "canonical apex admin and legacy admin redirects",
              "cgma customer surface content",
              "jadam customer surface content",
              "pizzamaru customer surface content",
              "yogurt customer surface content",
              "marketing platform content",
              "control API health"
            ],
            "observabilityCheck": "workflow logs and endpoint responses captured by Production Revenue Gate",
            "verificationTimestamp": "${verified_at}"
          }
          EOF
      - name: Upload production completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-completion-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-completion-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Production completion summary
        run: |
          echo '### AI-COMPLETE-001' >> "$GITHUB_STEP_SUMMARY"
          echo '- Status: production-verified-complete' >> "$GITHUB_STEP_SUMMARY"
          echo '- Real production hostnames: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Functional production checks: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Completion evidence artifact: uploaded' >> "$GITHUB_STEP_SUMMARY"
