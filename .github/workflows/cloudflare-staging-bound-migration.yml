name: Cloudflare Staging Bound Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-staging-bound-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Verify Development equivalents, detach Production staging domains, remove residues
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_ACCOUNT_ID"
          test -n "$PROD_TOKEN"
          test -n "$DEV_TOKEN"
          test "$PROD_ACCOUNT_ID" != "$DEV_ACCOUNT_ID"

          api='https://api.cloudflare.com/client/v4'
          curl_json() {
            curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -fsS "$@"
          }
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')

          targets=(
            ekodi-auth-api-staging
            ekodi-conversation-control-staging
            ekodi-finance-api-staging
            ekodi-mall-api-staging
            ekodi-marketing-domain-api-staging
            ekodi-marketing-publishing-staging
            ekodi-workspace-platform-api-staging
          )

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod.json
          curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts" -o /tmp/dev.json
          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains.json
          curl_json "${prod_auth[@]}" "$api/zones?account.id=$PROD_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          for f in /tmp/prod.json /tmp/dev.json /tmp/domains.json /tmp/zones.json; do jq -e '.success == true' "$f" >/dev/null; done

          mkdir -p /tmp/prod-settings /tmp/dev-settings /tmp/prod-schedules /tmp/dev-schedules
          while IFS= read -r owner; do
            [[ -n "$owner" ]] || continue
            safe_name=$(printf '%s' "$owner" | tr '/:' '__')
            curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$owner/settings" -o "/tmp/prod-settings/$safe_name.json"
            jq -e '.success == true' "/tmp/prod-settings/$safe_name.json" >/dev/null
          done < <(jq -r '.result[]?.id' /tmp/prod.json)

          : > /tmp/routes.ndjson
          while IFS=$'\t' read -r zid zname; do
            [[ -n "$zid" ]] || continue
            curl_json "${prod_auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/zr.json
            jq -e '.success == true' /tmp/zr.json >/dev/null
            jq -c --arg zone "$zname" '.result[]? | {zone:$zone,pattern:.pattern,script:.script}' /tmp/zr.json >> /tmp/routes.ndjson
          done < <(jq -r '.result[]? | [.id,.name] | @tsv' /tmp/zones.json)

          : > /tmp/safe.txt
          for script in "${targets[@]}"; do
            if ! jq -e --arg s "$script" '.result[]? | select(.id==$s)' /tmp/prod.json >/dev/null; then
              echo "SKIP: $script already absent from Production"
              continue
            fi
            if ! jq -e --arg s "$script" '.result[]? | select(.id==$s)' /tmp/dev.json >/dev/null; then
              echo "HOLD: $script missing from Development"
              continue
            fi

            curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/$script/settings" -o "/tmp/dev-settings/$script.json"
            curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$script/schedules" -o "/tmp/prod-schedules/$script.json"
            curl_json "${dev_auth[@]}" "$api/accounts/$DEV_ACCOUNT_ID/workers/scripts/$script/schedules" -o "/tmp/dev-schedules/$script.json"
            jq -e '.success == true' "/tmp/dev-settings/$script.json" >/dev/null
            jq -e '.success == true' "/tmp/prod-schedules/$script.json" >/dev/null
            jq -e '.success == true' "/tmp/dev-schedules/$script.json" >/dev/null

            prod_sig=$(jq -r '[.result.bindings[]? | select(.type != "assets" and .type != "plain_text") | "\(.name):\(.type)"] | sort | join("|")' "/tmp/prod-settings/$script.json")
            dev_sig=$(jq -r '[.result.bindings[]? | select(.type != "assets" and .type != "plain_text") | "\(.name):\(.type)"] | sort | join("|")' "/tmp/dev-settings/$script.json")
            if [[ "$prod_sig" != "$dev_sig" ]]; then
              echo "HOLD: $script binding shape differs"
              echo "  PROD=$prod_sig"
              echo "  DEV =$dev_sig"
              continue
            fi

            prod_sched=$(jq -cS '.result' "/tmp/prod-schedules/$script.json")
            dev_sched=$(jq -cS '.result' "/tmp/dev-schedules/$script.json")
            if [[ "$prod_sched" != "$dev_sched" ]]; then
              echo "HOLD: $script schedule differs"
              continue
            fi

            routes=$(jq -s --arg s "$script" '[.[] | select(.script==$s)] | length' /tmp/routes.ndjson 2>/dev/null || echo 0)
            inbound=0
            for sf in /tmp/prod-settings/*.json; do
              n=$(jq --arg s "$script" '[.result.bindings[]? | select(.type=="service" and ((.service // .service_name)==$s))] | length' "$sf")
              inbound=$((inbound+n))
            done
            if [[ "$routes" != 0 || "$inbound" != 0 ]]; then
              echo "HOLD: $script routes=$routes inbound-service=$inbound"
              continue
            fi

            echo "$script" >> /tmp/safe.txt
            echo "SAFE_TO_MOVE=$script bindings=[$prod_sig]"
          done

          moved=0
          while IFS= read -r script; do
            [[ -n "$script" ]] || continue

            # Staging custom domains belong to the Production ekodi.kr zone.
            # Detach them; Development staging is intentionally served from the Access-protected workers.dev hostname.
            while IFS=$'\t' read -r domain_id hostname; do
              [[ -n "$domain_id" ]] || continue
              echo "Detaching Production staging domain $hostname from $script"
              curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains/$domain_id" -o /tmp/domain-delete.json
              if [[ -s /tmp/domain-delete.json ]]; then jq -e '.success == true' /tmp/domain-delete.json >/dev/null; fi
            done < <(jq -r --arg s "$script" '.result[]? | select((.service // .script // .service_name)==$s) | [.id,.hostname] | @tsv' /tmp/domains.json)

            echo "Deleting Production staging Worker $script"
            curl_json -X DELETE "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$script" -o /tmp/worker-delete.json
            if [[ -s /tmp/worker-delete.json ]]; then jq -e '.success == true' /tmp/worker-delete.json >/dev/null; fi
            moved=$((moved+1))
          done < /tmp/safe.txt

          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod-after.json
          curl_json "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/domains" -o /tmp/domains-after.json
          jq -e '.success == true' /tmp/prod-after.json >/dev/null
          jq -e '.success == true' /tmp/domains-after.json >/dev/null

          failed=0
          while IFS= read -r script; do
            [[ -n "$script" ]] || continue
            if jq -e --arg s "$script" '.result[]? | select(.id==$s)' /tmp/prod-after.json >/dev/null; then
              echo "::error::$script still exists in Production"
              failed=1
            fi
            if ! jq -e --arg s "$script" '.result[]? | select(.id==$s)' /tmp/dev.json >/dev/null; then
              echo "::error::$script missing in Development after migration"
              failed=1
            fi
            if jq -e --arg s "$script" '.result[]? | select((.service // .script // .service_name)==$s)' /tmp/domains-after.json >/dev/null; then
              echo "::error::Production custom domain still attached to $script"
              failed=1
            fi
            echo "VERIFIED_MOVED=$script"
          done < /tmp/safe.txt

          remain=$(jq -r '.result[]?.id | select(endswith("-staging") or contains("-staging-"))' /tmp/prod-after.json | wc -l | tr -d ' ')
          echo "MOVED_COUNT=$moved"
          echo "PRODUCTION_STAGING_REMAINING=$remain"
          exit "$failed"
