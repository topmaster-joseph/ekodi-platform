name: Deploy Admin & Auth Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'control-center.html'
      - 'control-center.js'
      - 'control-center-features.js'
      - 'control-center.css'
      - 'control-center-ops.css'
      - 'control-center-finance.css'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'admin-central-handoff.js'
      - 'client-access.js'
      - 'client-access.css'
      - 'finance-monitor.js'
      - 'marketing-funnel-admin.js'
      - 'marketing-funnel-admin.css'
      - 'books-admin.js'
      - 'books-admin.css'
      - 'books-finance-admin.js'
      - 'books-finance-admin.css'
      - 'google-admin-auth.js'
      - 'google-admin-auth.css'
      - 'auth-site/**'
      - '.github/workflows/deploy-admin-site.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate admin, auth and feature modules
        run: |
          node --check control-center.js
          node --check control-center-features.js
          node --check compact-control-center.js
          node --check admin-central-handoff.js
          node --check client-access.js
          node --check finance-monitor.js
          node --check marketing-funnel-admin.js
          node --check books-admin.js
          node --check books-finance-admin.js
          node --check google-admin-auth.js
          node --check auth-site/auth.js

      - name: Validate authentication and compact UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '[hidden]{display:none!important}' control-center.css
          grep -Fq 'id="loginScreen"' control-center.html
          grep -Fq 'id="app" hidden' control-center.html
          grep -Fq 'loginScreen.hidden = true' control-center.js
          grep -Fq 'app.hidden = false' control-center.js
          grep -Fq 'google-auth-enabled #loginForm' google-admin-auth.css
          grep -Fq '/api/google/config' google-admin-auth.js
          grep -Fq '/api/google/challenge' google-admin-auth.js
          grep -Fq '/api/google/login' google-admin-auth.js
          grep -Fq '/api/admin-access/google-accounts' google-admin-auth.js
          grep -Fq 'Policies' compact-control-center.js
          grep -Fq 'Domains & DNS' compact-control-center.js
          grep -Fq 'Activity Logs' compact-control-center.js
          grep -Fq '.policy-grid' compact-control-center.css
          grep -Fq 'compact-control-center.css' scripts/build.mjs
          grep -Fq 'compact-control-center.js' scripts/build.mjs
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq 'functions/v1/access-api' auth-site/auth.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy shared site Worker with admin/auth assets
        run: npm run deploy:site

      - name: Verify admin routes, compact UI, central auth and customer access assets
        shell: bash
        run: |
          set -euo pipefail
          verify_admin() {
            url="$1"
            code=$(curl -sS --max-redirs 0 -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
            echo "$url -> $code"
            [ "$code" = '200' ] || return 1
            grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-headers || return 1
            grep -Fiq 'cross-origin-opener-policy: same-origin-allow-popups' /tmp/admin-headers || return 1
            grep -Fq 'EKODI Control Center' /tmp/admin-body || return 1
            grep -Fq 'client-access.js' /tmp/admin-body || return 1
            grep -Fq 'google-admin-auth.js' /tmp/admin-body || return 1
            grep -Fq 'compact-control-center.js' /tmp/admin-body || return 1
            if grep -Fiq '^location:' /tmp/admin-headers; then return 1; fi
          }

          verify_asset() {
            path="$1"
            expected="$2"
            code=$(curl -sS -o /tmp/admin-asset -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/$path" || true)
            [ "$code" = '200' ] && grep -Fq "$expected" /tmp/admin-asset
          }

          verify_auth() {
            code=$(curl -sS -D /tmp/auth-headers -o /tmp/auth-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/' || true)
            [ "$code" = '200' ] \
              && grep -Fiq 'x-ekodi-route: central-auth' /tmp/auth-headers \
              && grep -Fq 'EKODI 인증센터' /tmp/auth-body
          }

          for attempt in $(seq 1 18); do
            if verify_admin 'https://admin.ekodi.kr/' \
              && verify_admin 'https://admin.ekodi.kr/control-center.html' \
              && verify_asset 'compact-control-center.js' 'Operating Policies' \
              && verify_asset 'client-access.js' '/api/customers/tenants' \
              && verify_asset 'google-admin-auth.js' '/api/google/login' \
              && verify_asset 'finance-monitor.js' 'finance-api.ekodi.kr' \
              && verify_auth; then
              echo 'Admin/Auth production boundary verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
