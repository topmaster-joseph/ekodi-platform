name: Deploy Auth Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-site.yml'
      - 'auth-site/**'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate central auth and current admin boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check auth-site/auth.js
          node --check auth-site/auth-router.js
          node --check auth-site/marketing-auth-hotfix.js
          node --check auth-site/client-auth.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check admin-menu-layout.js
          node --check site-worker.js
          node --check scripts/guarded-worker-release.mjs
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq '/auth-router.js?v=20260815-mall-seller-return-1' auth-site/index.html
          grep -Fq "'mall-seller':'mall'" auth-site/auth-router.js
          grep -Fq 'https://mall.ekodi.kr/seller/' auth-site/auth-router.js
          grep -Fq "await import('./marketing-auth-hotfix.js')" auth-site/auth-router.js
          grep -Fq "sb.auth.onAuthStateChange((event,s)=>" auth-site/marketing-auth-hotfix.js
          if grep -Fq 'onAuthStateChange(async' auth-site/marketing-auth-hotfix.js; then
            echo 'Async Marketing auth-state callback detected'; exit 1
          fi
          grep -Fq 'functions/v1/access-api' auth-site/auth.js
          grep -Fq 'ekodi_admin_token' admin-central-handoff.js
          grep -Fq "'compact-control-center.js'" admin-authenticated-shell.js
          grep -Fq "'admin-menu-layout.js'" admin-authenticated-shell.js
          grep -Fq "'admin-demand-loader.js'" admin-authenticated-shell.js
          ! grep -Fq "'control-center-features.js'" admin-authenticated-shell.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build shared site assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/auth-center.html
          test -f dist/auth-router.js
          test -f dist/admin-demand-loader.js
          grep -Fq 'EKODI 인증센터' dist/auth-center.html
          grep -Fq '/auth-router.js?v=20260815-mall-seller-return-1' dist/auth-center.html
          grep -Fq '20260819-e2e-perf-1' dist/control-center.html
          grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' dist/control-center.html
          ! grep -Fq '<script src="control-center.js"' dist/control-center.html
          ! grep -Fq 'control-center-ops.css' dist/control-center.html
          ! grep -Fq 'control-center-finance.css' dist/control-center.html

      - name: Candidate at 0%, verify shared routes, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify production auth and current admin contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            auth_code=$(curl -sS -D /tmp/auth-headers -o /tmp/auth-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/' || true)
            router_code=$(curl -sS -D /tmp/router-headers -o /tmp/router-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/auth-router.js' || true)
            admin_code=$(curl -sS -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true)
            demand_code=$(curl -sS -D /tmp/demand-headers -o /tmp/demand-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/admin-demand-loader.js' || true)
            if [[ "$auth_code" == '200' && "$router_code" == '200' && "$admin_code" == '200' && "$demand_code" == '200' ]] \
              && grep -Fiq 'x-ekodi-route: central-auth' /tmp/auth-headers \
              && grep -Fq 'EKODI 인증센터' /tmp/auth-body \
              && grep -Fq "'mall-seller':'mall'" /tmp/router-body \
              && grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-headers \
              && grep -Fq '20260819-e2e-perf-1' /tmp/admin-body \
              && grep -Fq 'data-ekodi-postauth="compact-control-center.js admin-menu-layout.js admin-demand-loader.js"' /tmp/admin-body \
              && ! grep -Fq '<script src="control-center.js"' /tmp/admin-body \
              && grep -Fq 'control-center-features.js' /tmp/demand-body; then
              echo 'Production auth verified without reverting current admin performance architecture.'
              exit 0
            fi
            echo "Auth production verification pending (attempt $attempt/18)."
            sleep 4
          done
          echo 'Auth production verification failed.'
          exit 1
