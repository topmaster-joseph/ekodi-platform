name: Legacy Admin & Auth Compatibility Check

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow is intentionally manual-only.
# Production admin deployment is owned by deploy-admin-true-lazy.yml.
# Shared root/auth deployment is owned by deploy-site-core.yml.
# Keeping the legacy entry as a manual compatibility check avoids duplicate
# deployments and false failures from the pre true-lazy admin architecture.

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate current admin and auth compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-demand-loader.js
          node --check auth-site/auth-router.js
          node --test test/admin-true-lazy.test.mjs test/admin-thin-shell.test.mjs test/admin-preauth-shell.test.mjs
          npm run build
          test -f dist/control-center.html
          test -f dist/control-center.css
          test -f dist/admin-demand-loader.js
          grep -Fq 'position:fixed!important' dist/control-center.css
          grep -Fq '.app>main{padding-top:calc(78px + env(safe-area-inset-top,0px))}' dist/control-center.css
          grep -Fq "styles: ['marketing-ai-admin.css']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['marketing-ai-admin.js']" dist/admin-demand-loader.js
          if grep -Fq '<script src="marketing-ai-admin.js"' dist/control-center.html; then
            echo 'Legacy eager MarketingAI loading returned to the admin first path.'
            exit 1
          fi
          echo 'Legacy compatibility check passed against the current true-lazy admin architecture.'
