name: Deploy Admin & Auth Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-site.yml'
      - 'admin.html'
      - 'control-center.html'
      - 'control-center.js'
      - 'control-center-features.js'
      - 'control-center.css'
      - 'control-center-ops.css'
      - 'control-center-finance.css'
      - 'compact-control-center.js'
      - 'compact-control-center.css'
      - 'admin-central-handoff.js'
      - 'client-access.js'
      - 'client-access.css'
      - 'finance-monitor.js'
      - 'marketing-funnel-admin.js'
      - 'marketing-funnel-admin.css'
      - 'books-admin.js'
      - 'books-admin.css'
      - 'books-finance-admin.js'
      - 'books-finance-admin.css'
      - 'google-admin-auth.js'
      - 'google-admin-auth.css'
      - 'domains-hub.js'
      - 'domains-hub.css'
      - 'auth-site/**'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate admin, auth and feature modules
        run: |
          node --check control-center.js
          node --check control-center-features.js
          node --check compact-control-center.js
          node --check admin-central-handoff.js
          node --check client-access.js
          node --check finance-monitor.js
          node --check marketing-funnel-admin.js
          node --check books-admin.js
          node --check books-finance-admin.js
          node --check google-admin-auth.js
          node --check domains-hub.js
          node --check auth-site/auth.js

      - name: Validate authentication and compact UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '[hidden]{display:none!important}' control-center.css
          grep -Fq 'id="loginScreen"' control-center.html
          grep -Fq 'id="app" hidden' control-center.html
          grep -Fq 'loginScreen.hidden = true' control-center.js
          grep -Fq 'app.hidden = false' control-center.js
          grep -Fq 'google-auth-enabled #loginForm' google-admin-auth.css
          grep -Fq '/api/google/config' google-admin-auth.js
          grep -Fq '/api/google/challenge' google-admin-auth.js
          grep -Fq '/api/google/login' google-admin-auth.js
          grep -Fq '/api/admin-access/google-accounts' google-admin-auth.js
          grep -Fq 'google-admin-toolbar' google-admin-auth.js
          grep -Fq 'google-admin-filters' google-admin-auth.js
          grep -Fq "placeholder('admins', '◈', 'Admin')" control-center-features.js
          grep -Fq "placeholder('domains', '◎', 'Domains')" control-center-features.js
          grep -Fq '/api/control/overview' domains-hub.js
          grep -Fq 'Services에서 관리' domains-hub.js
          grep -Fq 'EKODI Digital Campus' compact-control-center.js
          grep -Fq 'Policies' compact-control-center.js
          grep -Fq 'Domains & DNS' compact-control-center.js
          grep -Fq 'Activity Logs' compact-control-center.js
          grep -Fq '.campus-layout' compact-control-center.css
          grep -Fq '.policy-grid' compact-control-center.css
          grep -Fq 'compact-control-center.css' scripts/build.mjs
          grep -Fq 'compact-control-center.js' scripts/build.mjs
          grep -Fq 'control-center-features.js' scripts/build.mjs
          grep -Fq 'domains-hub.css' scripts/build.mjs
          grep -Fq 'domains-hub.js' scripts/build.mjs
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq 'functions/v1/access-api' auth-site/auth.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy shared site Worker with admin/auth assets
        run: npm run deploy:site

      - name: Verify admin routes, Campus shell, central auth and lazy feature assets
        shell: bash
        run: |
          set -euo pipefail

          need_header() {
            pattern="$1"
            label="$2"
            grep -Fiq "$pattern" /tmp/admin-headers || { echo "admin verify: missing $label"; return 1; }
          }

          need_body() {
            pattern="$1"
            label="$2"
            grep -Fq "$pattern" /tmp/admin-body || { echo "admin verify: missing $label"; return 1; }
          }

          verify_admin() {
            url="$1"
            code=$(curl -sS --max-redirs 0 -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$url" || true)
            echo "$url -> $code"
            [ "$code" = '200' ] || { echo 'admin verify: expected HTTP 200'; return 1; }
            need_header 'x-ekodi-route: admin-control-center' 'X-EKODI-Route=admin-control-center' || return 1
            need_header 'cross-origin-opener-policy: same-origin-allow-popups' 'Cross-Origin-Opener-Policy' || return 1
            need_body 'EKODI Control Center' 'Control Center title' || return 1
            need_body 'control-center-features.js' 'lazy feature loader' || return 1
            need_body 'compact-control-center.js' 'Campus UI loader' || return 1
            if grep -Fiq '^location:' /tmp/admin-headers; then
              echo 'admin verify: unexpected redirect header'
              return 1
            fi
          }

          verify_asset() {
            path="$1"
            expected="$2"
            code=$(curl -sS -o /tmp/admin-asset -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/$path" || true)
            if [ "$code" != '200' ]; then
              echo "asset verify: $path -> $code"
              return 1
            fi
            grep -Fq "$expected" /tmp/admin-asset || { echo "asset verify: $path missing expected marker"; return 1; }
          }

          verify_auth() {
            code=$(curl -sS -D /tmp/auth-headers -o /tmp/auth-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://auth.ekodi.kr/' || true)
            [ "$code" = '200' ] \
              && grep -Fiq 'x-ekodi-route: central-auth' /tmp/auth-headers \
              && grep -Fq 'EKODI 인증센터' /tmp/auth-body
          }

          for attempt in $(seq 1 18); do
            if verify_admin 'https://admin.ekodi.kr/' \
              && verify_admin 'https://admin.ekodi.kr/control-center.html' \
              && verify_asset 'compact-control-center.js' 'EKODI Digital Campus' \
              && verify_asset 'compact-control-center.css' '.campus-layout' \
              && verify_asset 'client-access.js' '/api/customers/tenants' \
              && verify_asset 'google-admin-auth.js' 'google-admin-toolbar' \
              && verify_asset 'domains-hub.js' '/api/control/overview' \
              && verify_asset 'domains-hub.css' '.domains-grid' \
              && verify_asset 'finance-monitor.js' 'finance-api.ekodi.kr' \
              && verify_auth; then
              echo 'Admin/Auth production boundary verified.'
              exit 0
            fi
            echo "Production verification pending (attempt $attempt/18)."
            sleep 4
          done
          exit 1
