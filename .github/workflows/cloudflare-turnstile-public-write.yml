name: Cloudflare Turnstile Public Write Guard

on:
  pull_request:
    paths:
      - 'turnstile-protection.js'
      - 'platform-security-policy.js'
      - 'platform-router-entry-worker.js'
      - 'sites/seonammedi/public/**'
      - '_headers'
      - 'scripts/provision-cloudflare-turnstile.mjs'
      - 'test/turnstile-protection.test.mjs'
      - 'test/cloudflare-turnstile-provisioning.test.mjs'
      - '.github/workflows/cloudflare-turnstile-public-write.yml'
      - '.github/workflows/deploy-site-core.yml'
  workflow_run:
    workflows: ['Deploy EKODI Shared Site Core']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-turnstile-public-write-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Turnstile contracts
        run: |
          set -euo pipefail
          node --check turnstile-protection.js
          node --check scripts/provision-cloudflare-turnstile.mjs
          node scripts/provision-cloudflare-turnstile.mjs --validate-only
          node --test test/turnstile-protection.test.mjs test/cloudflare-turnstile-provisioning.test.mjs
          grep -Fq 'https://challenges.cloudflare.com' _headers

  provision-production:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SECRETS_FILE: ${{ runner.temp }}/turnstile/worker-secrets.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Create or reconcile canonical Turnstile widget
        run: node scripts/provision-cloudflare-turnstile.mjs
      - name: Bind Turnstile credentials to Shared Site Worker
        shell: bash
        run: |
          set -euo pipefail
          test -s "$TURNSTILE_SECRETS_FILE"
          npx --yes wrangler@4.127.1 secret bulk "$TURNSTILE_SECRETS_FILE" --config wrangler.site.toml
          rm -f "$TURNSTILE_SECRETS_FILE"
      - name: Verify live Turnstile client configuration
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 5 --max-time 20 https://ekodi.kr/api/security/turnstile/config)
          printf '%s' "$body" | grep -Fq '"enabled":true'
          printf '%s' "$body" | grep -Eq '"sitekey":"[^"]+"'
          printf '%s' "$body" | grep -Fq '"appearance":"interaction-only"'
          printf '%s' "$body" | grep -Fq '"action":"public_write"'
          echo 'Live EKODI Turnstile public-write guard is configured.'
