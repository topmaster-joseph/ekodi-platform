name: Claude Code Install Proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/claude-code-install-proof.yml'

permissions:
  contents: read

jobs:
  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code using official native installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Claude Code installation
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          claude doctor || true

  install-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code using official PowerShell installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://claude.ai/install.ps1 | iex
          $claudeDir = Join-Path $env:USERPROFILE '.local\bin'
          $claudeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Claude Code installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $claudeDir = Join-Path $env:USERPROFILE '.local\bin'
          $env:PATH = "$claudeDir;$env:PATH"
          claude --version
          Get-Command claude
          claude doctor
      - name: Publish Windows installation proof
        if: always()
        shell: powershell
        run: |
          $claudeDir = Join-Path $env:USERPROFILE '.local\bin'
          $env:PATH = "$claudeDir;$env:PATH"
          "## Claude Code Windows installation proof" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Version: $(claude --version 2>$null)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
