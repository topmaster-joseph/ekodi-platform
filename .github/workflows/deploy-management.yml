name: Deploy Management Platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'management/**'
      - 'management-platform.js'
      - 'management-worker.js'
      - 'config/management-platform.json'
      - 'wrangler.management*.toml'
      - 'test/management-platform-foundation.test.mjs'
      - 'deploy/manifests/management.worker.json'
      - 'ekodi-service-manifest.js'
      - 'ekodi-shell-injector.js'
      - 'platform-boundaries.json'
      - '.github/workflows/deploy-management.yml'
  push:
    branches: [main]
    paths:
      - 'management/**'
      - 'management-platform.js'
      - 'management-worker.js'
      - 'config/management-platform.json'
      - 'wrangler.management*.toml'
      - 'test/management-platform-foundation.test.mjs'
      - 'deploy/manifests/management.worker.json'
      - 'ekodi-service-manifest.js'
      - 'ekodi-shell-injector.js'
      - 'platform-boundaries.json'
      - '.github/workflows/deploy-management.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate management source and EKODI invariants
        run: |
          set -euo pipefail
          node --check management-platform.js
          node --check management-worker.js
          node --check management/app.js
          node --test test/management-platform-foundation.test.mjs
          npm run validate:boundaries
          npm run validate:shell
          npm run validate:mission
          grep -Fq 'pattern = "management.ekodi.kr"' wrangler.management.toml
          grep -Fq 'INTEGRATIONS_ENABLED = "true"' wrangler.management.toml
          grep -Fq 'INTEGRATIONS_ENABLED = "false"' wrangler.management.staging.toml
          grep -Fq '"guestMode": "guide-only"' config/management-platform.json
          grep -Fq '"minimumTier": "free"' config/management-platform.json
          grep -Fq 'tier-and-modules-are-independent' config/management-platform.json
          test -f deploy/manifests/management.worker.json

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-management-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development staging boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test "$STAGING_URL" = 'https://ekodi-management-staging.ekodi-development.workers.dev'
      - name: Deploy isolated staging Worker
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.management.staging.toml
      - name: Verify guest-only staging and disabled integration
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -L -sS -o /tmp/management.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            config_code=$(curl -sS -o /tmp/management-config.js -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/config.js" || true)
            catalog_code=$(curl -sS -o /tmp/management-catalog.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/api/catalog" || true)
            auth_code=$(curl -sS -o /tmp/management-auth.json -w '%{http_code}' -H 'content-type: application/json' -d '{"tokenHash":"test","type":"email"}' --connect-timeout 5 --max-time 15 "$STAGING_URL/api/auth/exchange" || true)
            if [[ "$root_code" == "200" && "$config_code" == "200" && "$catalog_code" == "200" && "$auth_code" == "503" ]] \
              && grep -Fq '경영플랫폼' /tmp/management.html \
              && grep -Fq '로그인 전에는 서비스 안내만 제공합니다' /tmp/management.html \
              && grep -Fq '"mode":"isolated-staging"' /tmp/management-config.js \
              && grep -Fq '"executionEnabled":false' /tmp/management-config.js \
              && grep -Fq '"guestMode":"guide-only"' /tmp/management-catalog.json \
              && grep -Fq '"error":"identity_integration_disabled"' /tmp/management-auth.json; then
              echo 'Management staging verified in the Development account with identity integration and execution disabled.'
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Bootstrap only when worker does not exist
        shell: bash
        run: |
          set -euo pipefail
          set +e
          status_output=$(npx --yes wrangler@4.119.0 deployments status --config wrangler.management.toml --json 2>&1)
          status_code=$?
          set -e
          if [[ "$status_code" == "0" ]]; then exit 0; fi
          if ! grep -Fq 'does not exist' <<<"$status_output"; then printf '%s\n' "$status_output"; exit "$status_code"; fi
          npx --yes wrangler@4.119.0 deploy --config wrangler.management.toml
      - name: Guarded production promotion
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/management.worker.json
