name: Deploy Church History Staging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: church-history-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      STAGING_URL: https://ekodi-church-history-staging.ekodi-development.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI AI Orchestration Gate
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Validate isolated staging contract
        shell: bash
        run: |
          set -euo pipefail
          node --check church-history-staging-worker.js
          grep -Fq 'DATA_MODE = "isolated-staging"' wrangler.church-history.staging.toml
          ! grep -Fq '[[d1_databases]]' wrangler.church-history.staging.toml
          grep -Fq "x-ekodi-data-mode': 'isolated-staging'" church-history-staging-worker.js
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import worker from './church-history-staging-worker.js';
          const response = await worker.fetch(new Request('https://staging.invalid/api/church/admin/history'));
          if (response.status !== 401) throw new Error(`staging API must fail closed with 401, got ${response.status}`);
          const payload = await response.json();
          if (payload?.error !== 'staging_auth_required' || payload?.dataMode !== 'isolated-staging') {
            throw new Error('staging API fail-closed payload contract mismatch');
          }
          NODE
      - name: Deploy isolated Development staging Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.church-history.staging.toml
      - name: Verify isolated Development staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            public_code=$(curl -L -sS -D /tmp/history-stage.headers -o /tmp/history-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/ekodichurch/history" || true)
            admin_code=$(curl -L -sS -o /tmp/history-stage-admin.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/ekodichurch/admin/history" || true)
            api_code=$(curl -sS -D /tmp/history-stage-api.headers -o /tmp/history-stage-api.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/api/church/admin/history" || true)
            api_boundary=0
            if [[ "$api_code" == 401 ]] \
              && grep -Fq '"error":"staging_auth_required"' /tmp/history-stage-api.body \
              && grep -Fq '"dataMode":"isolated-staging"' /tmp/history-stage-api.body; then
              api_boundary=1
            elif [[ "$api_code" =~ ^(302|303|307|308|403)$ ]]; then
              api_boundary=1
            fi
            if [[ "$public_code" == 200 && "$admin_code" == 200 && "$api_boundary" == 1 ]] \
              && grep -iq '^x-ekodi-data-mode: isolated-staging' /tmp/history-stage.headers \
              && grep -Fq '지나온 길' /tmp/history-stage.html \
              && grep -Fq '2018년 3월 14일' /tmp/history-stage.html \
              && grep -Fq '2018년 8월 13일' /tmp/history-stage.html \
              && grep -Fq '운영 D1이나 실제 교회 개인정보를 읽지 않습니다' /tmp/history-stage.html \
              && grep -Fq '지나온 길 기록관리' /tmp/history-stage-admin.html \
              && ! grep -Fq 'source_ref' /tmp/history-stage.html \
              && ! grep -Fq 'verification_notes' /tmp/history-stage.html; then
              echo "Church history Development staging verified with production data isolation; remote API boundary=$api_code."
              exit 0
            fi
            sleep 3
          done
          echo "Staging verification failed: public=$public_code admin=$admin_code api=$api_code"
          echo '--- API headers ---'
          cat /tmp/history-stage-api.headers || true
          echo '--- API body (first 800 bytes) ---'
          head -c 800 /tmp/history-stage-api.body || true
          echo
          exit 1
