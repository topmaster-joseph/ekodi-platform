name: Route EKODI Tax Deployments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tax-invoice-worker.js'
      - 'tax-invoice-free-first-worker.js'
      - 'tax-service-worker.js'
      - 'tax-portal-worker.js'
      - 'tax-local-fallback.js'
      - 'platform-router-entry-worker.js'
      - 'finance-entry-worker.js'
      - 'finance-monitor.js'
      - 'admin-menu-registry.js'
      - 'admin-menu-runtime.js'
      - 'admin-demand-loader.js'
      - 'author-billing-admin.js'
      - 'auth-site/admin-auth.js'
      - 'wrangler.site.toml'
      - 'migrations/*finance_multi_tax_suppliers.sql'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/tax-local-fallback.test.mjs'
      - 'test/tax-finance-service-binding.test.mjs'
      - '.github/workflows/deploy-tax-invoice-routing.yml'
  push:
    branches: [main]
    paths:
      - 'tax-invoice-worker.js'
      - 'tax-invoice-free-first-worker.js'
      - 'tax-service-worker.js'
      - 'tax-portal-worker.js'
      - 'tax-local-fallback.js'
      - 'platform-router-entry-worker.js'
      - 'finance-entry-worker.js'
      - 'finance-monitor.js'
      - 'admin-menu-registry.js'
      - 'admin-menu-runtime.js'
      - 'admin-demand-loader.js'
      - 'author-billing-admin.js'
      - 'auth-site/admin-auth.js'
      - 'wrangler.site.toml'
      - 'migrations/*finance_multi_tax_suppliers.sql'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/tax-local-fallback.test.mjs'
      - 'test/tax-finance-service-binding.test.mjs'
      - '.github/workflows/deploy-tax-invoice-routing.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: ekodi-tax-routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate professional Tax boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check tax-invoice-worker.js
          node --check tax-invoice-free-first-worker.js
          node --check tax-service-worker.js
          node --check tax-portal-worker.js
          node --check tax-local-fallback.js
          node --check platform-router-entry-worker.js
          node --check finance-entry-worker.js
          node --check finance-monitor.js
          node --check admin-menu-registry.js
          node --check admin-menu-runtime.js
          node --check auth-site/admin-auth.js
          node --test test/tax-professional-service.test.mjs test/tax-local-fallback.test.mjs test/tax-finance-service-binding.test.mjs
          node scripts/validate-additive-migrations.mjs migrations
          grep -Fq 'TAX_INVOICE_AUTOMATION_ENABLED' tax-invoice-free-first-worker.js
          grep -Fq 'FREE_FIRST_AUTOMATION_DISABLED' tax-invoice-free-first-worker.js
          grep -Fq "defaultChannel: 'HOMETAX_MANUAL'" tax-invoice-free-first-worker.js
          grep -Fq 'multiSupplier:true' tax-service-worker.js
          grep -Fq 'EKODI Tax' tax-portal-worker.js
          grep -Fq 'ekodi-tax-local-suppliers-v1' tax-local-fallback.js
          grep -Fq 'syncLocalSuppliers' tax-local-fallback.js
          grep -Fq 'injectTaxLocalFallback' platform-router-entry-worker.js
          grep -Fq 'routeTaxFinance' platform-router-entry-worker.js
          grep -Fq 'finance-service-binding' platform-router-entry-worker.js
          grep -Fq 'binding = "FINANCE"' wrangler.site.toml
          grep -Fq 'service = "ekodi-finance-api"' wrangler.site.toml
          grep -Fq 'https://tax.ekodi.kr/' admin-menu-registry.js
          grep -Fq 'pattern = "tax.ekodi.kr"' wrangler.site.toml

  dispatch-and-verify:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch guarded Tax dependencies
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-finance.yml --ref main
          gh workflow run deploy-site-core.yml --ref main -f sync_domains=true
          gh workflow run deploy-admin-site.yml --ref main
          echo 'Guarded Finance, Shared Site and Admin releases dispatched for EKODI Tax.'

      - name: Verify production Tax service, D1 route, local fallback, Finance policy and Admin menu
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          finance_url='https://finance-api.ekodi.kr/api/finance/tax-health'
          tax_health_url='https://tax.ekodi.kr/api/finance/tax-health'
          tax_url='https://tax.ekodi.kr/'
          tax_js_url='https://tax.ekodi.kr/tax-portal.js'
          admin_menu_url='https://admin.ekodi.kr/admin-menu-registry.js'
          finance_json=''
          finance_ok=false
          tax_route_ok=false
          tax_ok=false
          menu_ok=false

          for attempt in $(seq 1 72); do
            finance_json=$(curl -fsS --connect-timeout 5 --max-time 12 "$finance_url" || true)
            if printf '%s' "$finance_json" | grep -Fq '"operationPolicy":"FREE_FIRST"' \
              && printf '%s' "$finance_json" | grep -Fq '"defaultChannel":"HOMETAX_MANUAL"' \
              && printf '%s' "$finance_json" | grep -Fq '"multiSupplier":true' \
              && printf '%s' "$finance_json" | grep -Fq '"service":"ekodi-tax"'; then finance_ok=true; fi

            rm -f /tmp/ekodi-tax-health-headers /tmp/ekodi-tax-health
            curl -fsS --connect-timeout 5 --max-time 15 -D /tmp/ekodi-tax-health-headers -o /tmp/ekodi-tax-health "$tax_health_url" || true
            tax_health=$(cat /tmp/ekodi-tax-health 2>/dev/null || true)
            tax_health_headers=$(tr -d '\r' < /tmp/ekodi-tax-health-headers 2>/dev/null || true)
            if printf '%s' "$tax_health" | grep -Fq '"service":"ekodi-tax"' \
              && printf '%s' "$tax_health" | grep -Fq '"multiSupplier":true' \
              && printf '%s' "$tax_health" | grep -Fq '"schemaVersion":3' \
              && printf '%s' "$tax_health_headers" | grep -Fiq 'x-ekodi-tax-data-route: finance-service-binding'; then tax_route_ok=true; fi

            tax_body=$(curl -fsS --connect-timeout 5 --max-time 15 "$tax_url" || true)
            rm -f /tmp/ekodi-tax-headers /tmp/ekodi-tax-js
            curl -fsS --connect-timeout 5 --max-time 15 -D /tmp/ekodi-tax-headers -o /tmp/ekodi-tax-js "$tax_js_url" || true
            tax_js=$(cat /tmp/ekodi-tax-js 2>/dev/null || true)
            tax_headers=$(tr -d '\r' < /tmp/ekodi-tax-headers 2>/dev/null || true)
            if printf '%s' "$tax_body" | grep -Fq 'EKODI Tax' \
              && printf '%s' "$tax_body" | grep -Fq 'FREE-FIRST' \
              && printf '%s' "$tax_js" | grep -Fq '/api/finance/tax-profiles' \
              && printf '%s' "$tax_js" | grep -Fq 'manual-issued' \
              && printf '%s' "$tax_js" | grep -Fq 'ekodi-tax-local-suppliers-v1' \
              && printf '%s' "$tax_js" | grep -Fq 'syncLocalSuppliers' \
              && printf '%s' "$tax_js" | grep -Fq '브라우저 임시저장' \
              && printf '%s' "$tax_headers" | grep -Fiq 'x-ekodi-tax-local-fallback: v1' \
              && printf '%s' "$tax_headers" | grep -Fiq 'cache-control: no-store'; then tax_ok=true; fi

            menu_body=$(curl -fsS --connect-timeout 5 --max-time 15 "$admin_menu_url" || true)
            if printf '%s' "$menu_body" | grep -Fq "id: 'tax'" \
              && printf '%s' "$menu_body" | grep -Fq 'https://tax.ekodi.kr/'; then menu_ok=true; fi

            if $finance_ok && $tax_route_ok && $tax_ok && $menu_ok; then break; fi
            sleep 5
          done

          $finance_ok || { echo 'EKODI Tax Finance production verification failed.'; exit 1; }
          $tax_route_ok || { echo 'tax.ekodi.kr Finance service binding / D1 route verification failed.'; exit 1; }
          $tax_ok || { echo 'tax.ekodi.kr local fallback production verification failed.'; exit 1; }
          $menu_ok || { echo 'Admin Tax menu production verification failed.'; exit 1; }
          paid_enabled=$(printf '%s' "$finance_json" | jq -r '.paidAutomationEnabled // false')
          echo "paid_enabled=$paid_enabled" >> "$GITHUB_OUTPUT"
          echo 'EKODI Tax production verification passed, including D1-backed Finance service binding and browser-local supplier fallback.'

      - name: Persist Tax production verification marker
        shell: bash
        env:
          PAID_ENABLED: ${{ steps.verify.outputs.paid_enabled }}
        run: |
          set -euo pipefail
          path='deploy-status/tax-invoice.json'
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg verifiedAt "$verified_at" \
            --arg commit "$GITHUB_SHA" \
            --arg financeUrl 'https://finance-api.ekodi.kr/api/finance/tax-health' \
            --arg taxUrl 'https://tax.ekodi.kr/' \
            --arg adminMenuUrl 'https://admin.ekodi.kr/admin-menu-registry.js' \
            --argjson paidAutomationEnabled "${PAID_ENABLED:-false}" \
            '{verifiedAt:$verifiedAt,commit:$commit,service:"EKODI Tax",operationPolicy:"FREE_FIRST",defaultChannel:"HOMETAX_MANUAL",multiSupplier:true,schemaVersion:3,financeServiceBinding:true,localSupplierFallback:true,paidAutomationEnabled:$paidAutomationEnabled,financeUrl:$financeUrl,taxUrl:$taxUrl,adminMenuUrl:$adminMenuUrl,status:"verified"}' \
            > /tmp/tax-status.json
          content=$(base64 -w0 /tmp/tax-status.json)
          current_sha=$(gh api "repos/$GH_REPO/contents/$path" --jq '.sha' 2>/dev/null || true)
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/$GH_REPO/contents/$path" -f message='chore: record EKODI Tax deployment [skip ci]' -f content="$content" -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/$GH_REPO/contents/$path" -f message='chore: record EKODI Tax deployment [skip ci]' -f content="$content" >/dev/null
          fi
          cat /tmp/tax-status.json
