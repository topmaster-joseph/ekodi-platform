name: Diagnose Health Graphics

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-health-graphics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify diagnostic credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Cloudflare diagnostic credentials are available.'

      - name: Inspect production aggregate rows read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.119.0 d1 execute ekodi-auth \
            --remote \
            --config wrangler.api.toml \
            --command "SELECT COUNT(*) AS row_count, MIN(day) AS first_day, MAX(day) AS last_day, COALESCE(SUM(requests),0) AS request_total, COALESCE(SUM(bandwidth_bytes),0) AS bandwidth_total FROM system_usage_daily WHERE source='cloudflare'; SELECT source,status,last_attempt_at,last_success_at,message FROM system_usage_state WHERE source='cloudflare' LIMIT 1;"

      - name: Dry-run current Cloudflare Analytics collector
        shell: bash
        run: |
          set -uo pipefail
          sql_file="$RUNNER_TEMP/health-dry-run.sql"
          node scripts/collect-system-health.mjs "$sql_file"
          status=$?
          echo "collector_exit=$status"
          test -s "$sql_file" && grep -E "(집계 완료|Analytics 수집용|VALUES \('cloudflare')" "$sql_file" | tail -5 || true
          exit 0
