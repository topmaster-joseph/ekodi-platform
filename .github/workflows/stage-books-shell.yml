name: Stage EKODI Books Shell

on:
  pull_request:
    paths:
      - 'books/**'
      - 'books-worker.js'
      - 'ekodi-shell-injector.js'
      - 'wrangler.books.staging.toml'
      - '.github/workflows/stage-books-shell.yml'

permissions:
  contents: read

concurrency:
  group: books-shell-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-books-staging.ekodi-development.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Books and Shell adapter
        run: |
          set -euo pipefail
          node --check books-worker.js
          node --check ekodi-shell-injector.js
          npm run validate:books
          grep -Fq "injectEkodiShell(await env.ASSETS.fetch(request), 'books')" books-worker.js
      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated Books staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.books.staging.toml
      - name: Verify Books staging boundary and Shell
        shell: bash
        run: |
          set -euo pipefail
          access_code=$(curl -sS -D /tmp/books-access.headers -o /tmp/books-access.body -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
          if [[ "$access_code" == '302' ]] && grep -Fiq '^www-authenticate: Cloudflare-Access' /tmp/books-access.headers; then
            echo "Books staging deployed and is correctly protected by Cloudflare Access at $STAGING_URL"
            exit 0
          fi
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -L -D /tmp/books-stage.headers -o /tmp/books-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            publishing_code=$(curl -sS -L -D /tmp/books-publishing-stage.headers -o /tmp/books-publishing-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/publishing/" || true)
            upaper_code=$(curl -sS -L -D /tmp/books-upaper-stage.headers -o /tmp/books-upaper-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/publishing/upaper/" || true)
            health_code=$(curl -sS -o /tmp/books-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            echo "Books staging: root=$root_code publishing=$publishing_code upaper=$upaper_code health=$health_code"
            if [[ "$root_code" == '200' && "$publishing_code" == '200' && "$upaper_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/books-stage.html \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/books-publishing-stage.html \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/books-upaper-stage.html \
              && grep -Fq 'UPAPER QUICK PUBLISH' /tmp/books-upaper-stage.html \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/books-stage.headers \
              && grep -Fq '"service":"ekodi-books"' /tmp/books-stage-health.json; then
              echo 'Books isolated staging, adaptive UPaper helper, and shared Shell verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
