name: Stage EKODI Books Shell

on:
  pull_request:
    paths:
      - 'books/**'
      - 'books-worker.js'
      - 'ekodi-shell-injector.js'
      - 'wrangler.books.staging.toml'
      - '.github/workflows/stage-books-shell.yml'

permissions:
  contents: read

concurrency:
  group: books-shell-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-books-staging.topmaster-joseph.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Books and Shell adapter
        run: |
          set -euo pipefail
          node --check books-worker.js
          node --check ekodi-shell-injector.js
          npm run validate:books
          grep -Fq "injectEkodiShell(await env.ASSETS.fetch(request), 'books')" books-worker.js
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated Books staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.books.staging.toml
      - name: Verify Books staging and Shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -D /tmp/books-stage.headers -o /tmp/books-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            publishing_code=$(curl -sS -D /tmp/books-publishing-stage.headers -o /tmp/books-publishing-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/publishing/" || true)
            health_code=$(curl -sS -o /tmp/books-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            if [[ "$root_code" =~ ^[23] ]] && [[ "$publishing_code" =~ ^[23] ]] && [[ "$health_code" == '200' ]] \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/books-stage.html \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/books-publishing-stage.html \
              && grep -Fiq 'x-ekodi-shell: v1' /tmp/books-stage.headers \
              && grep -Fq '"service":"ekodi-books"' /tmp/books-stage-health.json; then
              echo 'Books isolated staging and shared Shell verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
