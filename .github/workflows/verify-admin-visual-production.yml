name: Verify Admin Visual Production

on:
  workflow_run:
    workflows: ['Deploy EKODI Shared Site Core']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-admin-visual-production
  cancel-in-progress: true

jobs:
  visual-admin-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Detect Admin visual-contract changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "admin_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(admin-conversation-workbench\.css|admin-(assist|shell|authenticated-shell|design-engine|compact|menu|sidebar|lazy-features)|scripts/admin-(thin|performance|assist-canonical-e2e|authenticated-e2e-retry)|test/admin-(conversation-workbench|performance-hardening|assist-command-delivery))'; then
            echo "admin_visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin_visual=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue short-lived genuine super-admin session
        if: steps.changes.outputs.admin_visual == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          cf_query() {
            local db="$1" sql="$2"
            curl -fsS --retry 2 --retry-delay 1               -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/query"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'Content-Type: application/json'               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"
          }

          databases=$(curl -fsS --retry 2 --retry-delay 1             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$databases" | jq -e '.success == true' >/dev/null

          auth_db=''
          admin_id=''
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            schema=$(cf_query "$db" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admins','sessions')" || true)
            if ! echo "$schema" | jq -e '.success == true and ([.result[]?.results[]?.name] | index("admins") != null and index("sessions") != null)' >/dev/null 2>&1; then
              continue
            fi
            candidate=$(cf_query "$db" "SELECT id FROM admins WHERE role='super_admin' ORDER BY id LIMIT 1" || true)
            id=$(echo "$candidate" | jq -r '.result[]?.results[0]?.id // empty' | head -1)
            if [[ "$id" =~ ^[0-9]+$ ]]; then
              auth_db="$db"
              admin_id="$id"
              break
            fi
          done < <(echo "$databases" | jq -r '.result[]? | (.uuid // .id // empty)')

          test -n "$auth_db"
          test -n "$admin_id"

          token=$(openssl rand -hex 32)
          token_hash=$(printf '%s' "$token" | sha256sum | awk '{print $1}')
          created=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          expires=$(date -u -d '+15 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')
          echo "::add-mask::$token"
          echo "::add-mask::$token_hash"

          insert="INSERT INTO sessions (token_hash, admin_id, expires_at, created_at) VALUES ('$token_hash', $admin_id, '$expires', '$created')"
          result=$(cf_query "$auth_db" "$insert")
          echo "$result" | jq -e '.success == true and ([.result[]?.success] | all)' >/dev/null

          session=$(curl -fsS 'https://ekodi.kr/api/session' -H "Authorization: Bearer $token")
          echo "$session" | jq -e '.role == "super_admin"' >/dev/null

          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_TOKEN_HASH=$token_hash" >> "$GITHUB_ENV"
          echo "E2E_AUTH_DB_ID=$auth_db" >> "$GITHUB_ENV"

      - name: Install Chromium browser harness
        if: steps.changes.outputs.admin_visual == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify rendered Admin home and canonical Assist
        if: steps.changes.outputs.admin_visual == 'true'
        run: node scripts/admin-assist-canonical-e2e.mjs

      - name: Upload Admin visual evidence
        if: always() && steps.changes.outputs.admin_visual == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: admin-visual-production-${{ github.run_id }}
          path: |
            artifacts/admin-authenticated-e2e/assist-canonical.json
            artifacts/admin-authenticated-e2e/admin-home-visual.png
            artifacts/admin-authenticated-e2e/assist-canonical-failure.png
          if-no-files-found: warn
          retention-days: 30

      - name: Revoke short-lived E2E session
        if: always() && env.E2E_AUTH_DB_ID != '' && env.E2E_TOKEN_HASH != ''
        shell: bash
        run: |
          set -euo pipefail
          sql="DELETE FROM sessions WHERE token_hash = '$E2E_TOKEN_HASH'"
          curl -fsS --retry 2 --retry-delay 1             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_AUTH_DB_ID/query"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"             | jq -e '.success == true' >/dev/null
