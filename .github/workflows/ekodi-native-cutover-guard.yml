name: EKODI Native Automation Cutover Guard
on:
  pull_request:
    paths:
      - 'scripts/ekodi-native-cutover-gate.mjs'
      - 'test/ekodi-native-cutover-gate.test.mjs'
      - '.github/workflows/ekodi-native-cutover-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-native-cutover-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test task-specific native evidence admission and fail-closed cutover
        run: |
          node --check scripts/ekodi-native-cutover-gate.mjs
          node --test test/ekodi-native-cutover-gate.test.mjs
      - name: Reject workflow privileges or non-EKODI automation handoffs
        shell: bash
        run: |
          ! grep -Eq '^ *[a-z-]+: write' .github/workflows/ekodi-native-cutover-guard.yml
          ! grep -Eq 'api\.openai\.com|chatgpt\.com|\.signOut\(|updateAutomation' scripts/ekodi-native-cutover-gate.mjs
          echo 'Read-only cutover gate verified. The workflow cannot disable legacy tasks.'
