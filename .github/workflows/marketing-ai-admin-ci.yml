name: MarketingAI Admin CI

on:
  pull_request:
    paths:
      - 'marketing-ai-admin.js'
      - 'marketing-ai-admin.css'
      - 'marketing-ai-admin-live-ops.js'
      - 'marketing-ai-admin-live-ops.css'
      - 'marketing-admin-control.js'
      - 'admin-menu-registry.js'
      - 'admin-demand-loader.js'
      - 'mission-control-entry-worker.js'
      - 'test/marketing-ai-admin-layout.test.mjs'
      - 'test/marketing-ai-admin-live-ops.test.mjs'
      - 'test/marketing-admin-control-contract.test.mjs'
      - 'scripts/build.mjs'
      - 'site-worker.js'
      - '.github/workflows/marketing-ai-admin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'marketing-ai-admin.js'
      - 'marketing-ai-admin.css'
      - 'marketing-ai-admin-live-ops.js'
      - 'marketing-ai-admin-live-ops.css'
      - 'marketing-admin-control.js'
      - 'admin-menu-registry.js'
      - 'admin-demand-loader.js'
      - 'mission-control-entry-worker.js'
      - 'test/marketing-ai-admin-layout.test.mjs'
      - 'test/marketing-ai-admin-live-ops.test.mjs'
      - 'test/marketing-admin-control-contract.test.mjs'
      - 'scripts/build.mjs'
      - 'site-worker.js'
      - '.github/workflows/marketing-ai-admin-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Marketing operations modules
        run: |
          set -euo pipefail
          node --check marketing-ai-admin.js
          node --check marketing-ai-admin-live-ops.js
          node --check marketing-admin-control.js
          node --check admin-menu-registry.js
          node --check admin-demand-loader.js
          node --check mission-control-entry-worker.js
          node --check site-worker.js
          node --check scripts/build.mjs
          node --test test/marketing-ai-admin-layout.test.mjs test/marketing-ai-admin-live-ops.test.mjs test/marketing-admin-control-contract.test.mjs
          grep -Fq "button.dataset.section = 'marketing-ai'" marketing-ai-admin.js
          grep -Fq '/api/marketing/admin/overview' marketing-ai-admin.js
          grep -Fq "labels: { ko: '마케팅 운영', en: 'Marketing Operations' }" admin-menu-registry.js
          grep -Fq "['overview','개요']" marketing-ai-admin-live-ops.js
          grep -Fq "['content','콘텐츠']" marketing-ai-admin-live-ops.js
          grep -Fq "['channels','채널 연결']" marketing-ai-admin-live-ops.js
          grep -Fq "['publishing','예약·게시']" marketing-ai-admin-live-ops.js
          grep -Fq "['performance','성과']" marketing-ai-admin-live-ops.js
          grep -Fq "['improvement','AI 개선']" marketing-ai-admin-live-ops.js
          grep -Fq '/api/control/social/content/generate' marketing-ai-admin-live-ops.js
          grep -Fq '/api/control/social/oauth/' marketing-ai-admin-live-ops.js
          grep -Fq '/api/control/social/posts' marketing-ai-admin-live-ops.js
          grep -Fq '/api/control/social/performance' marketing-ai-admin-live-ops.js
          grep -Fq '/api/control/social/metrics/sync' marketing-ai-admin-live-ops.js
          ! grep -Fq 'META_APP_SECRET' marketing-ai-admin-live-ops.js
          ! grep -Fq 'GOOGLE_CLIENT_SECRET' marketing-ai-admin-live-ops.js
          ! grep -Fq 'SOCIAL_TOKEN_KEY' marketing-ai-admin-live-ops.js
          ! grep -Fq 'customer_key' marketing-ai-admin-live-ops.js
          ! grep -Fq 'marketingAiAdminFrame' marketing-ai-admin.js
          ! grep -Fq '<iframe' marketing-ai-admin.js
          grep -Fq '.marketing-ai-console-tabs' marketing-ai-admin.css
          grep -Fq '.marketing-ai-console-view' marketing-ai-admin.css
          grep -Fq 'service_subscriptions' marketing-admin-control.js
          grep -Fq 'billing_charge_events' marketing-admin-control.js
          grep -Fq 'marketing_store_workspaces' marketing-admin-control.js
          grep -Fq 'ai_agent_actions' marketing-admin-control.js
          grep -Fq 'social_registry_config' marketing-admin-control.js
          grep -Fq 'customerPiiIncluded:false' marketing-admin-control.js
          grep -Fq 'externalExecution:false' marketing-admin-control.js
          grep -Fq 'handleMarketingAdminControl' mission-control-entry-worker.js
          grep -Fq "'/api/marketing/admin/'" mission-control-entry-worker.js
          grep -Fq "'/marketing-ai-admin.js'" site-worker.js
          grep -Fq "scripts: ['marketing-ai-admin.js']" admin-demand-loader.js
          grep -Fq 'marketing-ai-admin-live-ops.css' scripts/build.mjs
          grep -Fq 'marketing-ai-admin-live-ops.js' scripts/build.mjs
      - name: Build and verify Control Center output
        run: |
          set -euo pipefail
          npm run build
          test -f dist/marketing-ai-admin.js
          test -f dist/marketing-ai-admin.css
          test -f dist/admin-demand-loader.js
          ! grep -Fq '<script src="marketing-ai-admin.js"' dist/control-center.html
          ! grep -Fq '<link rel="stylesheet" href="marketing-ai-admin.css"' dist/control-center.html
          grep -Fq "scripts: ['marketing-ai-admin.js']" dist/admin-demand-loader.js
          grep -Fq "styles: ['marketing-ai-admin.css']" dist/admin-demand-loader.js
          grep -Fq '마케팅 운영' dist/marketing-ai-admin.js
          grep -Fq '채널 연결' dist/marketing-ai-admin.js
          grep -Fq '예약·게시' dist/marketing-ai-admin.js
          grep -Fq 'AI 개선' dist/marketing-ai-admin.js
          grep -Fq '/api/control/social/posts' dist/marketing-ai-admin.js
          grep -Fq '/api/control/social/oauth/' dist/marketing-ai-admin.js
          ! grep -Fq 'marketingAiAdminFrame' dist/marketing-ai-admin.js
