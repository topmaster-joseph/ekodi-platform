name: EKODI Insurance Schema · Staging CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'staging/insurance-schema-*'
    paths:
      - 'sites/ekodi-insurance/sql/**'
      - '.github/workflows/insurance-schema-staging-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Supabase auth-role mocks
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to authenticated;
          SQL
      - name: Apply Insurance schema
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f sites/ekodi-insurance/sql/001_insurance_platform.sql
          psql -v ON_ERROR_STOP=1 -f sites/ekodi-insurance/sql/002_insurance_privileges.sql
      - name: Seed isolated test identities
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id) values
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');
          insert into public.insurance_staff(user_id,role) values
            ('33333333-3333-4333-8333-333333333333','admin');
          SQL
      - name: Verify owner policy access
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          insert into public.insurance_policies(user_id,company,product,monthly_premium)
          values ('11111111-1111-4111-8111-111111111111','TEST','OWNER POLICY',10000);
          do $$ begin
            if (select count(*) from public.insurance_policies) <> 1 then
              raise exception 'owner cannot read own policy';
            end if;
          end $$;
          reset role;
          SQL
      - name: Verify cross-user isolation
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',false);
          do $$ begin
            if (select count(*) from public.insurance_policies) <> 0 then
              raise exception 'cross-user policy leak';
            end if;
          end $$;
          reset role;
          SQL
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',false);
          insert into public.insurance_policies(user_id,company,product,monthly_premium)
          values ('11111111-1111-4111-8111-111111111111','TEST','FORGED',10000);
          SQL
          then
            echo 'Cross-user insert unexpectedly succeeded'
            exit 1
          else
            echo 'Cross-user insert correctly blocked.'
          fi
      - name: Verify staff cannot browse customer policy ledger
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','33333333-3333-4333-8333-333333333333',false);
          do $$ begin
            if (select count(*) from public.insurance_policies) <> 0 then
              raise exception 'staff gained policy-ledger access';
            end if;
          end $$;
          reset role;
          SQL
      - name: Verify handoff writes require service API
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.insurance_consultation_requests(
            user_id,contact_name,contact_ciphertext,contact_hint,ai_summary,status
          ) values (
            '11111111-1111-4111-8111-111111111111','Owner','ciphertext','••••1111','summary','new'
          );
          SQL
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          insert into public.insurance_consultation_requests(
            user_id,contact_name,contact_ciphertext,ai_summary,status
          ) values (
            '11111111-1111-4111-8111-111111111111','Bypass','plaintext','bypass','new'
          );
          SQL
          then
            echo 'Direct consultation insert unexpectedly succeeded'
            exit 1
          else
            echo 'Direct consultation insert correctly blocked.'
          fi
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','33333333-3333-4333-8333-333333333333',false);
          update public.insurance_consultation_requests set status='contacted';
          SQL
          then
            echo 'Direct staff consultation update unexpectedly succeeded'
            exit 1
          else
            echo 'Direct staff update correctly blocked; API audit path required.'
          fi
      - name: Verify consultation visibility boundary
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',false);
          do $$ begin
            if (select count(*) from public.insurance_consultation_requests) <> 0 then
              raise exception 'consultation leaked to unrelated user';
            end if;
          end $$;
          reset role;
          set role authenticated;
          select set_config('request.jwt.claim.sub','33333333-3333-4333-8333-333333333333',false);
          do $$ begin
            if (select count(*) from public.insurance_consultation_requests) <> 1 then
              raise exception 'authorized admin cannot see consultation queue';
            end if;
          end $$;
          reset role;
          SQL
      - name: Verify schema safety markers
        run: |
          set -euo pipefail
          grep -Fq 'contact_ciphertext' sites/ekodi-insurance/sql/001_insurance_platform.sql
          grep -Fq 'Intentionally absent:' sites/ekodi-insurance/sql/001_insurance_platform.sql
          grep -Fq 'grant select on public.insurance_consultation_requests' sites/ekodi-insurance/sql/002_insurance_privileges.sql
          ! grep -Fq 'grant insert on public.insurance_consultation_requests' sites/ekodi-insurance/sql/002_insurance_privileges.sql
