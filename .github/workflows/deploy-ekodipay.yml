name: Deploy EKODI Pay Canonical Entry
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ekodipay-worker.js'
      - 'wrangler.ekodipay.toml'
      - 'test/ekodipay-canonical.test.mjs'
      - '.github/workflows/deploy-ekodipay.yml'
  push:
    branches: [main]
    paths:
      - 'ekodipay-worker.js'
      - 'wrangler.ekodipay.toml'
      - 'test/ekodipay-canonical.test.mjs'
      - '.github/workflows/deploy-ekodipay.yml'
permissions:
  contents: read
concurrency:
  group: ekodipay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI orchestration and constitution release guard
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Test payment paths and denied money movement
        run: |
          node --check ekodipay-worker.js
          node --test test/ekodipay-canonical.test.mjs
          node scripts/constitution-check.mjs
      - name: Cloudflare bundle dry-run
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.ekodipay.toml --outdir /tmp/ekodipay-dry-run
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI orchestration release guard
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy canonical-only Worker
        run: npx --yes wrangler@4.127.1 deploy --config wrangler.ekodipay.toml
      - name: Verify real canonical path and fail-closed checkout
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/pay-index.html -w '%{http_code}' --max-time 15 https://ekodi.kr/ekodipay/ || true)
            health=$(curl -fsS --max-time 15 https://ekodi.kr/ekodipay/api/health || true)
            blocked=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/checkout?amount=1' || true)
            if [[ "$code" == "200" && "$blocked" == "400" ]] &&
               grep -Fq 'EKODI Pay' /tmp/pay-index.html &&
               grep -Fq '"realMoneyProcessing":"disabled-until-human-approved-pg-activation"' <<<"$health"; then
              echo 'EKODI Pay public path verified; money movement remains disabled.'
              exit 0
            fi
            sleep 5
          done
          exit 1
