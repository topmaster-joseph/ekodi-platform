name: Deploy EKODI Pay Canonical Entry
on:
  workflow_dispatch:
    inputs:
      release_branch_ref:
        description: EKODI Orchestrator-issued source branch
        required: true
        type: string
      release_task_id:
        description: EKODI Orchestrator receipt task ID
        required: true
        type: string
  pull_request:
    paths:
      - 'ekodipay-worker.js'
      - 'site-discovery-head.js'
      - 'ekodipay-preview.js'
      - 'test/ekodipay-preview.test.mjs'
      - 'wrangler.ekodipay.toml'
      - 'test/ekodipay-canonical.test.mjs'
      - 'test/ekodipay-demo-flow.test.mjs'
      - '.github/workflows/deploy-ekodipay.yml'
  push:
    branches: [main]
    paths:
      - 'ekodipay-worker.js'
      - 'site-discovery-head.js'
      - 'ekodipay-preview.js'
      - 'test/ekodipay-preview.test.mjs'
      - 'wrangler.ekodipay.toml'
      - 'test/ekodipay-canonical.test.mjs'
      - 'test/ekodipay-demo-flow.test.mjs'
      - '.github/workflows/deploy-ekodipay.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ekodipay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    env:
      GH_TOKEN: ${{ github.token }}
      EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
      EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI orchestration and constitution release guard
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Verify merged Pay change belongs to signed official dispatch
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/dispatch-ekodipay-postmerge.mjs --verify
      - name: Test payment paths and denied money movement
        run: |
          node --check ekodipay-worker.js
          node --check ekodipay-preview.js
          node --test test/ekodipay-canonical.test.mjs test/ekodipay-demo-flow.test.mjs test/ekodipay-preview.test.mjs
          node scripts/constitution-check.mjs
      - name: Cloudflare bundle dry-run
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config wrangler.ekodipay.toml --outdir /tmp/ekodipay-dry-run
  deploy-production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EKODI_RELEASE_BRANCH_REF: ${{ inputs.release_branch_ref || '' }}
      EKODI_RELEASE_TASK_ID: ${{ inputs.release_task_id || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: EKODI orchestration release guard
        run: node "$GITHUB_WORKSPACE/scripts/validate-ekodi-ai-change-orchestration.mjs" --release
      - name: Confirm official merged Pay PR before production mutation
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/dispatch-ekodipay-postmerge.mjs --verify
      - name: Verify credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy canonical-only Worker
        run: npx --yes wrangler@4.127.1 deploy --config wrangler.ekodipay.toml
      - name: Verify real canonical path and fail-closed checkout
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/pay-index.html -w '%{http_code}' --max-time 15 https://ekodi.kr/ekodipay/ || true)
            health=$(curl -fsS --max-time 15 https://ekodi.kr/ekodipay/api/health || true)
            blocked=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/checkout?amount=1' || true)
            preview=$(curl -sS -o /tmp/pay-preview.html -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/preview' || true)
            demo=$(curl -sS -o /tmp/pay-demo.html -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/demo?service=edu&step=review' || true)
            demo_result=$(curl -sS -o /tmp/pay-demo-result.html -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/demo?service=edu&step=result&method=card' || true)
            demo_denied=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://ekodi.kr/ekodipay/demo?service=edu&step=review&amount=1' || true)
            if [[ "$code" == "200" && "$blocked" == "400" && "$preview" == "200" && "$demo" == "200" && "$demo_result" == "200" && "$demo_denied" == "400" ]] &&
               grep -Fq 'EKODI Pay' /tmp/pay-index.html &&
               grep -Fq 'DESIGN PREVIEW' /tmp/pay-preview.html &&
               grep -Fq '가상 결제 정보 확인' /tmp/pay-demo.html &&
               grep -Fq '실제 결제는 실행되지 않았습니다' /tmp/pay-demo-result.html &&
               grep -Fq '"realMoneyProcessing":"disabled-until-human-approved-pg-activation"' <<<"$health" &&
               grep -Fq '"demoMode":"read-only-no-transactions"' <<<"$health"; then
              echo 'EKODI Pay public and simulated demo paths verified; no money movement.'
              exit 0
            fi
            sleep 5
          done
          exit 1
