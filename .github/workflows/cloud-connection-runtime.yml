name: Cloud connection runtime

on:
  pull_request:
    paths:
      - 'cloud-connection-runtime.js'
      - 'config/cloud-connection-policy.json'
      - 'test/cloud-connection-runtime.test.mjs'
      - 'CLOUD_CONNECTION_OPERATIONS.md'
      - '.github/workflows/cloud-connection-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'cloud-connection-runtime.js'
      - 'config/cloud-connection-policy.json'
      - 'test/cloud-connection-runtime.test.mjs'
      - 'CLOUD_CONNECTION_OPERATIONS.md'
      - '.github/workflows/cloud-connection-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test quota-aware failover
        run: node --test test/cloud-connection-runtime.test.mjs
