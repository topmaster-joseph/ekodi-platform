name: SeonamMedi One-Shot Shared Site Release Retry

on:
  push:
    branches:
      - 'ai/openai/orch_recovery_2283505cc9914f085d628fd256e099d'
    paths:
      - '.github/workflows/seonammedi-release-bridge-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: ai/openai/orch_recovery_2283505cc9914f085d628fd256e099d
      RELEASE_TASK: orch_recovery_2283505cc9914f085d628fd256e099d
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify authoritative EKODI release receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(curl -fsS --get 'https://ekodi.kr/api/orchestrator/release-receipt' \
            --data-urlencode "taskId=$RELEASE_TASK" \
            --data-urlencode "branchRef=$RELEASE_BRANCH")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.authorized!==true||x.authority!=="ekodi-orchestrator") process.exit(1)' "$receipt"
      - name: Dispatch guarded Shared Site release after Control asset contract repair
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-site-core.yml/dispatches"
          curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"$RELEASE_BRANCH\"}"
          echo 'Guarded Shared Site release retry dispatched.' >> "$GITHUB_STEP_SUMMARY"
