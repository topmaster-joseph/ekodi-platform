name: SeonamMedi One-Shot Guarded Release Bridge

on:
  push:
    branches:
      - 'ai/openai/orch_recovery_2283505cc9914f085d628fd256e099d'
    paths:
      - '.github/workflows/seonammedi-release-bridge-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: ai/openai/orch_recovery_2283505cc9914f085d628fd256e099d
      RELEASE_TASK: orch_recovery_2283505cc9914f085d628fd256e099d
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify authoritative EKODI release receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(curl -fsS --get 'https://ekodi.kr/api/orchestrator/release-receipt' \
            --data-urlencode "taskId=$RELEASE_TASK" \
            --data-urlencode "branchRef=$RELEASE_BRANCH")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.authorized!==true||x.authority!=="ekodi-orchestrator") process.exit(1)' "$receipt"
      - name: Verify dispatched workflow definitions match main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          for file in .github/workflows/deploy-control-api.yml .github/workflows/deploy-independent-board.yml .github/workflows/deploy-site-core.yml; do
            test "$(git rev-parse HEAD:"$file")" = "$(git rev-parse origin/main:"$file")"
          done
      - name: Dispatch existing guarded production workflows
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows"
          common=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS -X POST "${common[@]}" "$api/deploy-control-api.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"release_branch_ref\":\"$RELEASE_BRANCH\",\"release_task_id\":\"$RELEASE_TASK\"}}"
          curl -fsS -X POST "${common[@]}" "$api/deploy-independent-board.yml/dispatches" \
            -d "{\"ref\":\"$RELEASE_BRANCH\"}"
          curl -fsS -X POST "${common[@]}" "$api/deploy-site-core.yml/dispatches" \
            -d "{\"ref\":\"$RELEASE_BRANCH\"}"
          echo 'Guarded deployment workflows dispatched.' >> "$GITHUB_STEP_SUMMARY"
