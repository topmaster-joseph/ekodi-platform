name: Stage EKODI Social Shell

on:
  pull_request:
    paths:
      - 'social/**'
      - 'social-worker.js'
      - 'social-shell-worker.js'
      - 'ekodi-shell-injector.js'
      - 'wrangler.social-staging.toml'
      - '.github/workflows/stage-social-shell.yml'

permissions:
  contents: read

concurrency:
  group: social-shell-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.119.0'
  STAGING_URL: https://ekodi-social-staging.ekodi-development.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Social wrapper
        run: |
          set -euo pipefail
          node --check social-worker.js
          node --check social-shell-worker.js
          node --check ekodi-shell-injector.js
      - name: Enforce Development account boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = '46aad4738793fbaca88574832a2ccc0f'
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated Social staging
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config wrangler.social-staging.toml
      - name: Verify Social staging and Shell independently of external feed providers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root_code=$(curl -sS -L -D /tmp/social-stage.headers -o /tmp/social-stage.html -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/" || true)
            health_code=$(curl -sS -o /tmp/social-stage-health.json -w '%{http_code}' --connect-timeout 5 --max-time 15 "$STAGING_URL/health" || true)
            echo "Social staging: root=$root_code health=$health_code"
            if [[ "$root_code" == '200' && "$health_code" == '200' ]] \
              && grep -Fq 'EKODI Social' /tmp/social-stage.html \
              && grep -Fq 'https://shell.ekodi.kr/shell.js' /tmp/social-stage.html \
              && grep -Fiq 'x-ekodi-shell: v2' /tmp/social-stage.headers \
              && grep -Fq '"service":"ekodi-social"' /tmp/social-stage-health.json; then
              echo 'Social isolated staging and shared Shell v2 verified.'
              exit 0
            fi
            sleep 4
          done
          exit 1
