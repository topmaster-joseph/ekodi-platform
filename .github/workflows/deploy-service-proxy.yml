name: Deploy EKODI Service Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - service-proxy.js
      - wrangler.service-proxy.toml
      - .github/workflows/deploy-service-proxy.yml

permissions:
  contents: read

concurrency:
  group: ekodi-service-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Detach pending Pages domain associations
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4"
          for spec in "ekodi-church:church.ekodi.kr" "ekodilab:lab.ekodi.kr" "ekodi-mall:mall.ekodi.kr"; do
            project="${spec%%:*}"
            domain="${spec#*:}"
            code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "$api/accounts/$CF_ACCOUNT_ID/pages/projects/$project/domains/$domain" || true)
            echo "$domain detach_http=$code"
            if [ "$code" != "200" ] && [ "$code" != "204" ] && [ "$code" != "404" ]; then cat /tmp/delete.json || true; fi
          done
      - name: Deploy Worker custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.service-proxy.toml
      - name: Verify HTTPS service endpoints
        run: |
          set -u
          failed=0
          for domain in church.ekodi.kr live.church.ekodi.kr lab.ekodi.kr mall.ekodi.kr; do
            code=000
            for attempt in $(seq 1 12); do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$domain/" || true)
              case "$code" in
                2*|3*) break ;;
              esac
              sleep 5
            done
            echo "$domain http=$code"
            case "$code" in 2*|3*) ;; *) failed=1 ;; esac
          done
          exit "$failed"
