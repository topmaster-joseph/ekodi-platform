name: Verify EKODI Core Completion

on:
  workflow_dispatch:
  pull_request:
    paths: &core_paths
      - 'config/ekodi-core-contract.json'
      - 'config/ekodi-core-completion.json'
      - 'core-api.js'
      - 'core-ai-gateway.js'
      - 'core-client.js'
      - 'core-permission.js'
      - 'core-workflow.js'
      - 'core-evidence.js'
      - 'ekodi-principal.js'
      - 'ekodi-service-manifest.js'
      - 'scripts/validate-central-modules.mjs'
      - 'scripts/validate-ekodi-core-contract.mjs'
      - 'scripts/validate-ekodi-core-completion.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - '.github/workflows/verify-ekodi-core-completion.yml'
      - '.github/workflows/backup-ekodi-core.yml'
      - '.github/workflows/deploy-control-api.yml'
      - 'test/ekodi-core-validator.test.mjs'
      - 'test/core-*.test.mjs'
      - 'package.json'
  push:
    branches: [development]
    paths: *core_paths

permissions:
  contents: read

concurrency:
  group: ekodi-core-completion-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Assert development verification never targets production
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'https://([A-Za-z0-9-]+\.)?ekodi\.kr|ecosystem-load-test\.mjs|verify:core-production' .github/workflows/verify-ekodi-core-completion.yml; then
            echo 'ERROR: development Core verification contains a production target or production load/smoke command.'
            exit 1
          fi
          echo 'Development Core verification is production-free.'
      - name: Validate final Core completion contract
        run: npm run validate:core-completion
      - name: Verify central permission, workflow, evidence and AI contracts
        run: node scripts/validate-central-modules.mjs
      - name: Verify legacy Core contract validator stays aligned
        run: node scripts/validate-ekodi-core-contract.mjs
      - name: Verify security baseline
        run: npm run validate:security
      - name: Verify AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Run focused Core completion contracts
        run: |
          node --test \
            test/ekodi-core-validator.test.mjs \
            test/ekodi-core-contract.test.mjs \
            test/core-final-completion.test.mjs \
            test/core-api-contract.test.mjs \
            test/core-ai-gateway.test.mjs \
            test/core-data-boundary.test.mjs \
            test/core-recovery-contract.test.mjs
      - name: Development verification summary
        run: |
          echo '### EKODI development Core verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Core contracts: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security and AI resilience: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production hosts: not contacted' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production load/smoke commands: not executed' >> "$GITHUB_STEP_SUMMARY"
