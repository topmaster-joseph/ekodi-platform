name: Verify EKODI Core Completion

on:
  workflow_dispatch:
  pull_request:
    paths: &core_paths
      - 'config/ekodi-core-contract.json'
      - 'config/ekodi-core-completion.json'
      - 'core-api.js'
      - 'core-ai-gateway.js'
      - 'core-client.js'
      - 'core-permission.js'
      - 'core-workflow.js'
      - 'core-evidence.js'
      - 'ekodi-principal.js'
      - 'ekodi-service-manifest.js'
      - 'scripts/validate-central-modules.mjs'
      - 'scripts/validate-ekodi-core-contract.mjs'
      - 'scripts/validate-ekodi-core-completion.mjs'
      - 'scripts/verify-ekodi-core-production.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - '.github/workflows/verify-ekodi-core-completion.yml'
      - '.github/workflows/backup-ekodi-core.yml'
      - '.github/workflows/deploy-control-api.yml'
      - 'test/ekodi-core-validator.test.mjs'
      - 'test/core-*.test.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths: *core_paths

permissions:
  contents: read

concurrency:
  group: ekodi-core-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate final Core completion contract
        run: npm run validate:core-completion
      - name: Verify central permission, workflow, evidence and AI contracts
        run: node scripts/validate-central-modules.mjs
      - name: Verify legacy Core contract validator stays aligned
        run: node scripts/validate-ekodi-core-contract.mjs
      - name: Verify security baseline
        run: npm run validate:security
      - name: Verify AI provider independence
        run: npm run validate:ai-resilience
      - name: Verify no-provider survival
        env:
          AI_PROVIDER: NONE
        run: npm run test:ai-none
      - name: Run focused Core completion contracts
        run: |
          node --test \
            test/ekodi-core-validator.test.mjs \
            test/ekodi-core-contract.test.mjs \
            test/core-final-completion.test.mjs \
            test/core-api-contract.test.mjs \
            test/core-ai-gateway.test.mjs \
            test/core-data-boundary.test.mjs \
            test/core-recovery-contract.test.mjs

  production-readonly:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify live EKODI Core production contract
        run: npm run verify:core-production
      - name: Upload final completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: ekodi-core-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ekodi-core-production-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Completion summary
        run: |
          echo '### EKODI Core v1.0 completion verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Seven-stage completion contract: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Central permission/workflow/evidence contracts: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production Core API read-only smoke verification: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Protected routes fail closed without auth: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security headers: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- AI provider-independent survival: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Independent backup/restore contract: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic rollback contract: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production load testing is isolated to the dedicated manual capped workflow.' >> "$GITHUB_STEP_SUMMARY"
