name: Deploy EKODI History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'history.html'
      - 'homepage-ambient.js'
      - 'scripts/build.mjs'
      - 'test/history-page.test.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - '.github/workflows/deploy-history.yml'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy-history:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate History source and publishing contract
        run: |
          set -euo pipefail
          node --check homepage-ambient.js
          node --check scripts/build.mjs
          node --test test/history-page.test.mjs
          grep -Fq 'https://ekodi.kr/history' history.html
          grep -Fq 'EKODI HISTORY' history.html
          grep -Fq "'history.html'" scripts/build.mjs
          grep -Fq "href = '/history'" homepage-ambient.js

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Build and verify artifact
        run: |
          set -euo pipefail
          npm run build
          test -f dist/history.html
          grep -Fq 'https://ekodi.kr/history' dist/history.html
          grep -Fq 'EKODI HISTORY' dist/history.html
          grep -Fq 'Ecclesia' dist/history.html
          grep -Fq 'Jubilee' dist/history.html

      - name: Guarded shared-site release
        run: node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify live History page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -D /tmp/history-headers -o /tmp/history-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://ekodi.kr/history' || true)
            echo "History production verification attempt $attempt -> $code"
            if [ "$code" = '200' ] \
              && grep -Fq 'EKODI HISTORY' /tmp/history-body \
              && grep -Fq 'Ecclesia' /tmp/history-body \
              && grep -Fq 'Koinonia' /tmp/history-body \
              && grep -Fq 'Diaspora' /tmp/history-body \
              && grep -Fq 'Jubilee' /tmp/history-body \
              && grep -Fiq 'x-content-type-options: nosniff' /tmp/history-headers; then
              echo 'EKODI History is live and verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'EKODI History production verification failed.'
          exit 1
