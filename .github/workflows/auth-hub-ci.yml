name: Auth Hub CI
on:
  pull_request:
    paths:
      - 'auth-site/**'
      - 'supabase/functions/identity-api/**'
      - 'supabase/functions/access-api/**'
      - 'site-worker.js'
      - 'admin-central-handoff.js'
      - 'control-center.html'
      - 'customer-entry-worker.js'
      - 'customer-federated-auth.js'
      - 'api-worker.js'
      - 'test/marketing-auth-handoff.test.mjs'
      - 'docs/AUTH-CENTER.md'
      - '.github/workflows/auth-hub-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate hub scripts
        run: |
          set -euo pipefail
          node --check auth-site/auth.js
          node --check auth-site/auth-router.js
          node --check auth-site/marketing-auth-hotfix.js
          node --check auth-site/auth-workspace-target.js
          node --check auth-site/admin-auth.js
          node --check auth-site/client-auth.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check customer-entry-worker.js
          node --check customer-federated-auth.js
          node --check api-worker.js
          node --test test/marketing-auth-handoff.test.mjs
      - name: Verify central and Marketing auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq 'id="googleButtonHost"' auth-site/index.html
          grep -Fq "await import('./marketing-auth-hotfix.js')" auth-site/auth-router.js
          if grep -Fq "params.set('intent','pro')" auth-site/auth-router.js; then
            echo 'Marketing Pro must not be forced for normal login'; exit 1
          fi
          grep -Fq 'functions/v1/access-api' auth-site/marketing-auth-hotfix.js
          grep -Fq 'functions/v1/identity-api' auth-site/marketing-auth-hotfix.js
          grep -Fq 'verifyOtp({token_hash:proof.tokenHash' auth-site/marketing-auth-hotfix.js
          grep -Fq "const MARKETING_API='https://marketing-api.ekodi.kr'" auth-site/marketing-auth-hotfix.js
          grep -Fq '/api/marketing/handoff/start' auth-site/marketing-auth-hotfix.js
          grep -Fq "credentials:'include'" auth-site/marketing-auth-hotfix.js
          grep -Fq 'continueFreeWorkspace' auth-site/marketing-auth-hotfix.js
          grep -Fq 'handoffToService(item.workspace_key)' auth-site/marketing-auth-hotfix.js
          grep -Fq "['active','pre_registered','free']" auth-site/marketing-auth-hotfix.js
          if grep -Fq 'welcome=free' auth-site/marketing-auth-hotfix.js; then
            echo 'FREE may not bypass secure workspace handoff'; exit 1
          fi
          if grep -Fq 'ekodi_token' auth-site/marketing-auth-hotfix.js || grep -Fq 'target.hash=' auth-site/marketing-auth-hotfix.js; then
            echo 'Marketing auth must not expose handoff credentials in URL'; exit 1
          fi
          grep -Fq 'current_site_workspaces' supabase/functions/access-api/index.ts
          grep -Fq 'site==="marketing"?workspaces.find' supabase/functions/access-api/index.ts
          grep -Fq '["active","pre_registered","free"].includes(status)' supabase/functions/access-api/index.ts
          grep -Fq 'const handoffAllowed=site==="marketing"||selected?.requires_handoff===true' supabase/functions/access-api/index.ts
          grep -Fq 'generateLink({type:"magiclink",email})' supabase/functions/access-api/index.ts
          grep -Fq 'plan:selected.plan||"free"' supabase/functions/access-api/index.ts
          grep -Fq 'path==="/session/handoff"' supabase/functions/identity-api/index.ts
          grep -Fq 'link.user.id!==user.id' supabase/functions/identity-api/index.ts
          grep -Fq '/api/customer/federated-login' customer-federated-auth.js
          grep -Fq 'CENTRAL_CUSTOMER_LOGIN_REQUIRED' customer-entry-worker.js
          grep -Fq 'https://auth.ekodi.kr/?site=admin' admin-central-handoff.js
          grep -Fq 'functions/v1/access-api' auth-site/auth.js
          grep -Fq 'functions/v1/identity-api' auth-site/auth.js
          grep -Fq 'verifyOtp({token_hash:proof.tokenHash' auth-site/auth.js
          if grep -Fq 'signInWithOAuth' auth-site/auth.js || grep -Fq 'action_link' auth-site/auth.js; then
            echo 'Redirect-based central auth detected'; exit 1
          fi
          if grep -Fq 'yogurtpurple.ekodi.kr' api-worker.js; then
            echo 'Legacy yogurtpurple domain detected'; exit 1
          fi
      - name: Probe public central identity challenge
        shell: bash
        env:
          IDENTITY_URL: https://renzehysxirjilvdxacv.supabase.co/functions/v1/identity-api/challenge
          PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          good=$(curl -fsS -X POST "$IDENTITY_URL" -H 'Origin: https://auth.ekodi.kr' -H "apikey: $PUBLISHABLE_KEY")
          printf '%s' "$good" | grep -Fq '483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com'
          printf '%s' "$good" | grep -Eq '"nonce":"[a-f0-9]{48}"'
          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -X POST "$IDENTITY_URL" -H 'Origin: https://evil.example' -H "apikey: $PUBLISHABLE_KEY")
          test "$bad" = '403'
