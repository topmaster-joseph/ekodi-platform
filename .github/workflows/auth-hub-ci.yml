name: Auth Hub CI
on:
  pull_request:
    paths:
      - 'auth-site/**'
      - 'supabase/functions/identity-api/**'
      - 'supabase/functions/business-handoff-api/**'
      - 'site-worker.js'
      - 'scripts/build.mjs'
      - 'docs/AUTH-CENTER.md'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/admin-auth-cache-boundary.test.mjs'
      - '.github/workflows/auth-hub-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate central auth scripts
        run: |
          set -euo pipefail
          node --check auth-site/auth.js
          node --check auth-site/auth-router.js
          node --check auth-site/marketing-auth-hotfix.js
          node --check auth-site/auth-workspace-target.js
          node --check auth-site/admin-auth.js
          node --check auth-site/client-auth.js
          node --check auth-site/author-auth.js
          node --check auth-site/business-auth.js
          node --check site-worker.js
          node --test test/admin-auth-cache-boundary.test.mjs
      - name: Verify One Login and invisible auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-seamless-sso' auth-site/index.html
          grep -Fq '/auth-router.js?v=20260826-universal-sso-1' auth-site/index.html

          grep -Fq 'manifestService' auth-site/auth-router.js
          grep -Fq 'isRegistryUserService' auth-site/auth-router.js
          grep -Fq "site==='portal'||isRegistryUserService" auth-site/auth-router.js
          grep -Fq "business-auth.js?v=20260826-free-fallback-1" auth-site/auth-router.js
          grep -Fq "client-auth.js?v=20260826-universal-free-1" auth-site/auth-router.js
          grep -Fq 'targetableWorkspaceSites' auth-site/auth-router.js
          grep -Fq 'privateClientSites' auth-site/auth-router.js

          grep -Fq 'functions/v1/identity-api' auth-site/client-auth.js
          grep -Fq '/session/handoff' auth-site/client-auth.js
          grep -Fq 'sb.auth.getSession' auth-site/client-auth.js
          grep -Fq 'session_timeout' auth-site/client-auth.js
          grep -Fq 'google_library_timeout' auth-site/client-auth.js
          grep -Fq 'supabase_cdn_timeout' auth-site/client-auth.js
          grep -Fq 'supabase_fallback_timeout' auth-site/client-auth.js
          grep -Fq 'use_fedcm_for_button:true' auth-site/client-auth.js
          grep -Fq 'button_auto_select:false' auth-site/client-auth.js
          grep -Fq 'ekodi_token:proof.tokenHash' auth-site/client-auth.js
          if grep -Fq 'onAuthStateChange(async' auth-site/client-auth.js || grep -Fq 'use_fedcm_for_prompt' auth-site/client-auth.js; then
            echo 'Universal identity auth contains a known deadlock/deprecated pattern.'
            exit 1
          fi

          grep -Fq 'functions/v1/business-handoff-api' auth-site/business-auth.js
          grep -Fq 'functions/v1/identity-api' auth-site/business-auth.js
          grep -Fq '/session/handoff' auth-site/business-auth.js
          grep -Fq 'response.status===403' auth-site/business-auth.js
          grep -Fq 'session_timeout' auth-site/business-auth.js
          grep -Fq 'google_library_timeout' auth-site/business-auth.js
          if grep -Fq 'onAuthStateChange(async' auth-site/business-auth.js; then
            echo 'Business auth contains an async auth-state deadlock pattern.'
            exit 1
          fi

          grep -Fq 'path==="/session/handoff"' supabase/functions/identity-api/index.ts
          grep -Fq 'link.user.id!==user.id' supabase/functions/identity-api/index.ts
          grep -Fq 'business_os_snapshot' supabase/functions/business-handoff-api/index.ts
          grep -Fq 'admin.auth.admin.generateLink' supabase/functions/business-handoff-api/index.ts

          grep -Fq 'one-account-free-everywhere-pay-where-needed' docs/AUTH-CENTER.md
          grep -Fq 'config/ecosystem-services.json' docs/AUTH-CENTER.md
          grep -Fq 'lazy materialization' docs/AUTH-CENTER.md
      - name: Probe public central identity challenge
        shell: bash
        env:
          IDENTITY_URL: https://renzehysxirjilvdxacv.supabase.co/functions/v1/identity-api/challenge
          PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          good=$(curl -fsS -X POST "$IDENTITY_URL" -H 'Origin: https://auth.ekodi.kr' -H "apikey: $PUBLISHABLE_KEY")
          printf '%s' "$good" | grep -Fq '483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com'
          printf '%s' "$good" | grep -Eq '"nonce":"[a-f0-9]{48}"'
          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -X POST "$IDENTITY_URL" -H 'Origin: https://evil.example' -H "apikey: $PUBLISHABLE_KEY")
          test "$bad" = '403'
