name: Auth Hub CI
on:
  pull_request:
    paths:
      - 'auth-site/**'
      - 'api-worker.js'
      - 'docs/AUTH-CENTER.md'
      - '.github/workflows/auth-hub-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate hub script
        run: |
          node --check auth-site/auth.js
          node --check api-worker.js
      - name: Verify central auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq 'id="googleButtonHost"' auth-site/index.html
          grep -Fq 'functions/v1/access-api' auth-site/auth.js
          grep -Fq 'functions/v1/identity-api' auth-site/auth.js
          grep -Fq 'accounts.google.com/gsi/client' auth-site/auth.js
          grep -Fq 'verifyOtp({token_hash:proof.tokenHash' auth-site/auth.js
          grep -Fq "api('/handoff'" auth-site/auth.js
          grep -Fq 'ekodi_token:d.tokenHash' auth-site/auth.js
          if grep -Fq 'signInWithOAuth' auth-site/auth.js || grep -Fq 'action_link' auth-site/auth.js; then
            echo 'Redirect-based central auth detected'
            exit 1
          fi
          for site in cgma marketing biz trade mall pay books church lab mission community edu media admin portal; do
            grep -Fq "${site}:{" auth-site/auth.js || { echo "Missing central auth service: $site"; exit 1; }
          done
          grep -Fq 'yogurtpurple.ekodi.kr' auth-site/auth.js
          grep -Fq 'yogurtpurple.ekodi.kr' api-worker.js
          if grep -Fq 'yogurt.ekodi.kr' api-worker.js; then
            echo 'Legacy yogurt domain detected'
            exit 1
          fi
          if grep -Eq 'localStorage.*access_token|innerHTML.*access_token' auth-site/auth.js; then
            echo 'Token exposure pattern detected'
            exit 1
          fi
      - name: Probe public central identity challenge
        shell: bash
        env:
          IDENTITY_URL: https://renzehysxirjilvdxacv.supabase.co/functions/v1/identity-api/challenge
          PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          good=$(curl -fsS -X POST "$IDENTITY_URL" -H 'Origin: https://auth.ekodi.kr' -H "apikey: $PUBLISHABLE_KEY")
          printf '%s' "$good" | grep -Fq '483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com'
          printf '%s' "$good" | grep -Eq '"nonce":"[a-f0-9]{48}"'
          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -X POST "$IDENTITY_URL" -H 'Origin: https://evil.example' -H "apikey: $PUBLISHABLE_KEY")
          test "$bad" = '403'
