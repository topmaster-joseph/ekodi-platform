name: Auth Hub CI
on:
  pull_request:
    paths:
      - 'auth-site/**'
      - 'site-worker.js'
      - 'admin-central-handoff.js'
      - 'control-center.html'
      - 'customer-entry-worker.js'
      - 'customer-federated-auth.js'
      - 'api-worker.js'
      - 'docs/AUTH-CENTER.md'
      - '.github/workflows/auth-hub-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate hub scripts
        run: |
          node --check auth-site/auth.js
          node --check auth-site/auth-router.js
          node --check auth-site/marketing-auth-hotfix.js
          node --check auth-site/auth-workspace-target.js
          node --check auth-site/admin-auth.js
          node --check auth-site/client-auth.js
          node --check site-worker.js
          node --check admin-central-handoff.js
          node --check customer-entry-worker.js
          node --check customer-federated-auth.js
          node --check api-worker.js
      - name: Verify central auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'EKODI 인증센터' auth-site/index.html
          grep -Fq 'id="googleButtonHost"' auth-site/index.html
          grep -Fq '/auth-router.js?v=20260815-mall-seller-return-1' auth-site/index.html
          grep -Fq "'mall-seller':'mall'" auth-site/auth-router.js
          grep -Fq "https://mall.ekodi.kr/seller/" auth-site/auth-router.js
          grep -Fq "site==='admin'" auth-site/auth-router.js
          grep -Fq "site==='cgma-client'" auth-site/auth-router.js
          grep -Fq 'targetedWorkspace' auth-site/auth-router.js
          grep -Fq "await import('./auth-workspace-target.js')" auth-site/auth-router.js
          grep -Fq "await import('./marketing-auth-hotfix.js')" auth-site/auth-router.js
          if grep -Fq "params.set('intent','pro')" auth-site/auth-router.js; then
            echo 'Marketing Pro mode must not be forced for normal login'
            exit 1
          fi
          grep -Fq "site!=='marketing'" auth-site/auth-workspace-target.js
          grep -Fq 'workspace_key===requested' auth-site/auth-workspace-target.js
          grep -Fq 'requires_handoff===true' auth-site/auth-workspace-target.js
          grep -Fq "api('/handoff'" auth-site/auth.js
          grep -Fq 'functions/v1/access-api' auth-site/marketing-auth-hotfix.js
          grep -Fq 'functions/v1/identity-api' auth-site/marketing-auth-hotfix.js
          grep -Fq 'verifyOtp({token_hash:proof.tokenHash' auth-site/marketing-auth-hotfix.js
          grep -Fq 'ekodi_token:d.tokenHash' auth-site/marketing-auth-hotfix.js
          grep -Fq "sb.auth.onAuthStateChange((event,s)=>" auth-site/marketing-auth-hotfix.js
          grep -Fq 'setTimeout(()=>{' auth-site/marketing-auth-hotfix.js
          grep -Fq 'supabase_cdn_timeout' auth-site/marketing-auth-hotfix.js
          grep -Fq 'supabase_fallback_timeout' auth-site/marketing-auth-hotfix.js
          if grep -Fq 'onAuthStateChange(async' auth-site/marketing-auth-hotfix.js; then
            echo 'Async Supabase auth-state callback can deadlock'
            exit 1
          fi
          grep -Fq "'/marketing-auth-hotfix.js'" site-worker.js
          grep -Fq 'https://esm.sh' site-worker.js
          grep -Fq '청계상권 고객관리' auth-site/client-auth.js
          grep -Fq 'functions/v1/identity-api' auth-site/client-auth.js
          grep -Fq 'ekodi_token:proof.tokenHash' auth-site/client-auth.js
          grep -Fq '/api/customer/federated-login' customer-federated-auth.js
          grep -Fq '/api/customer/accept-central-invite' customer-federated-auth.js
          grep -Fq 'CENTRAL_CUSTOMER_LOGIN_REQUIRED' customer-entry-worker.js
          grep -Fq '/api/google/config' auth-site/admin-auth.js
          grep -Fq '/api/google/challenge' auth-site/admin-auth.js
          grep -Fq '/api/google/login' auth-site/admin-auth.js
          grep -Fq 'ekodi_admin_token:result.token' auth-site/admin-auth.js
          grep -Fq "hash.get('ekodi_admin_token')" admin-central-handoff.js
          grep -Fq "sessionStorage.setItem('ekodi-auth-token'" admin-central-handoff.js
          grep -Fq 'https://auth.ekodi.kr/?site=admin' admin-central-handoff.js
          grep -Fq 'admin-central-handoff.js' control-center.html
          grep -Fq "connect-src 'self' https://api.ekodi.kr https://renzehysxirjilvdxacv.supabase.co" site-worker.js
          grep -Fq '/auth-workspace-target.js' site-worker.js
          grep -Fq 'functions/v1/access-api' auth-site/auth.js
          grep -Fq 'functions/v1/identity-api' auth-site/auth.js
          grep -Fq 'verifyOtp({token_hash:proof.tokenHash' auth-site/auth.js
          grep -Fq 'ekodi_token:d.tokenHash' auth-site/auth.js
          if grep -Fq 'signInWithOAuth' auth-site/auth.js || grep -Fq 'action_link' auth-site/auth.js; then
            echo 'Redirect-based central auth detected'
            exit 1
          fi
          for site in cgma marketing biz trade mall pay books church lab mission community edu media admin portal; do
            grep -Fq "${site}:{" auth-site/auth.js || { echo "Missing central auth service: $site"; exit 1; }
          done
          grep -Fq 'yogurt.ekodi.kr' auth-site/auth.js
          grep -Fq 'yogurt.ekodi.kr' api-worker.js
          if grep -Fq 'yogurtpurple.ekodi.kr' api-worker.js; then
            echo 'Legacy yogurtpurple domain detected'
            exit 1
          fi
      - name: Probe public central identity challenge
        shell: bash
        env:
          IDENTITY_URL: https://renzehysxirjilvdxacv.supabase.co/functions/v1/identity-api/challenge
          PUBLISHABLE_KEY: sb_publishable_0QjB0WzZbjrd-FJ5D5cR7A_xUkXyOY_
        run: |
          set -euo pipefail
          good=$(curl -fsS -X POST "$IDENTITY_URL" -H 'Origin: https://auth.ekodi.kr' -H "apikey: $PUBLISHABLE_KEY")
          printf '%s' "$good" | grep -Fq '483044030492-4e6231l5glchhtniroinvuq3ev6n5mv5.apps.googleusercontent.com'
          printf '%s' "$good" | grep -Eq '"nonce":"[a-f0-9]{48}"'
          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' -X POST "$IDENTITY_URL" -H 'Origin: https://evil.example' -H "apikey: $PUBLISHABLE_KEY")
          test "$bad" = '403'