name: Cloudflare Account Pool Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/cloudflare-account-pool.json'
      - 'cloudflare-account-pool.js'
      - 'scripts/validate-cloudflare-account-pool.mjs'
      - 'scripts/cloudflare-production-budget.mjs'
      - '.github/workflows/cloudflare-account-pool-health.yml'
  schedule:
    - cron: '35 0 * * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-account-pool-health
  cancel-in-progress: true

jobs:
  health:
    name: Primary + Auxiliary read-only health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUXILIARY_API_TOKEN: ${{ secrets.CLOUDFLARE_AUXILIARY_API_TOKEN || secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_AUXILIARY_ACCOUNT_ID: ${{ vars.CLOUDFLARE_AUXILIARY_ACCOUNT_ID || vars.CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID || '46aad4738793fbaca88574832a2ccc0f' }}
      CLOUDFLARE_DEVELOPMENT_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEVELOPMENT_ACCOUNT_ID || '46aad4738793fbaca88574832a2ccc0f' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce account pool policy
        run: |
          set -euo pipefail
          node --check cloudflare-account-pool.js
          node --check scripts/validate-cloudflare-account-pool.mjs
          node scripts/validate-cloudflare-account-pool.mjs
          node --test test/cloudflare-account-pool.test.mjs

      - name: Verify account credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AUXILIARY_API_TOKEN"
          test -n "$CLOUDFLARE_AUXILIARY_ACCOUNT_ID"
          test "$CLOUDFLARE_ACCOUNT_ID" != "$CLOUDFLARE_AUXILIARY_ACCOUNT_ID"

      - name: Verify read-only Worker access on both accounts
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          check_account() {
            local label="$1" account="$2" token="$3"
            local body
            body=$(curl -fsS --connect-timeout 5 --max-time 20               "$api/accounts/$account/workers/scripts?per_page=1"               -H "Authorization: Bearer $token"               -H 'Accept: application/json')
            echo "$body" | jq -e '.success == true' >/dev/null
            count=$(echo "$body" | jq -r '.result_info.total_count // (.result|length) // 0')
            printf -- '- %s: Worker API readable; visible scripts=%s\n' "$label" "$count" >> "$GITHUB_STEP_SUMMARY"
          }
          echo '### Cloudflare Account Pool Health' >> "$GITHUB_STEP_SUMMARY"
          check_account PRIMARY "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN"
          check_account AUXILIARY "$CLOUDFLARE_AUXILIARY_ACCOUNT_ID" "$CLOUDFLARE_AUXILIARY_API_TOKEN"

      - name: Verify primary plan-aware quota model
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-production-budget.mjs --output="$RUNNER_TEMP/cloudflare-primary-budget.json"
          jq -e '.account == "PROD"' "$RUNNER_TEMP/cloudflare-primary-budget.json" >/dev/null
          jq -r '"- Primary plan signal: " + .plan.workers + " via " + .plan.source' "$RUNNER_TEMP/cloudflare-primary-budget.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Primary quota window: " + .periodKind' "$RUNNER_TEMP/cloudflare-primary-budget.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve health evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-account-pool-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-primary-budget.json
          if-no-files-found: warn
          retention-days: 14
