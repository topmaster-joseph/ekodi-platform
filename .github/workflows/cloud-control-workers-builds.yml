name: EKODI Cloud Control - Workers Builds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read-only, apply = disconnect allowlisted Builds trigger'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      target:
        description: 'Allowlisted Cloudflare Worker'
        required: true
        type: choice
        default: ekodi-platform
        options:
          - ekodi-platform
      confirmation:
        description: 'For apply only: DISCONNECT_EKODI_PLATFORM_BUILDS'
        required: false
        type: string
      reason:
        description: 'Audit reason for this Cloud Control invocation'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/cloud-control/requests/workers-builds.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-cloud-control-workers-builds
  cancel-in-progress: false

jobs:
  control:
    if: github.actor == 'topmaster-joseph'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ekodi-cloud-control
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BUILDS_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Cloud Control contract
        run: |
          set -euo pipefail
          node --check scripts/cloud-control-workers-builds.mjs
          node --check scripts/resolve-cloud-control-request.mjs
          node --test test/cloud-control-workers-builds-contract.test.mjs test/cloud-control-gitops-request-contract.test.mjs

      - name: Resolve authorized request
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request='.github/cloud-control/requests/workers-builds.json'
            test -f "$request"
            node scripts/resolve-cloud-control-request.mjs "$request" >> "$GITHUB_ENV"
          else
            [[ -n "$DISPATCH_MODE" ]]
            [[ "$DISPATCH_TARGET" == 'ekodi-platform' ]]
            [[ -n "$DISPATCH_REASON" ]]
            [[ "$DISPATCH_REASON" != *$'\n'* ]]
            printf 'CONTROL_MODE=%s\n' "$DISPATCH_MODE" >> "$GITHUB_ENV"
            printf 'CONTROL_TARGET=%s\n' "$DISPATCH_TARGET" >> "$GITHUB_ENV"
            printf 'CONTROL_CONFIRMATION=%s\n' "$DISPATCH_CONFIRMATION" >> "$GITHUB_ENV"
            printf 'CONTROL_REASON=%s\n' "$DISPATCH_REASON" >> "$GITHUB_ENV"
            printf 'CONTROL_REQUEST_ID=manual-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
            printf 'CONTROL_EXPIRES_AT=workflow-dispatch\n' >> "$GITHUB_ENV"
          fi

      - name: Verify scoped credentials exist
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_BUILDS_ADMIN_TOKEN"

      - name: Enforce break-glass confirmation
        run: |
          set -euo pipefail
          test "$CONTROL_TARGET" = 'ekodi-platform'
          case "$CONTROL_MODE" in
            plan)
              test -z "$CONTROL_CONFIRMATION"
              ;;
            apply)
              test "$CONTROL_CONFIRMATION" = 'DISCONNECT_EKODI_PLATFORM_BUILDS'
              ;;
            *)
              echo "Unsupported control mode: $CONTROL_MODE" >&2
              exit 1
              ;;
          esac

      - name: Execute allowlisted Cloud Control operation
        run: |
          set -euo pipefail
          node scripts/cloud-control-workers-builds.mjs \
            --target "$CONTROL_TARGET" \
            --mode "$CONTROL_MODE" \
            --confirm "$CONTROL_CONFIRMATION"

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo '## EKODI Cloud Control'
            echo "- Actor: ${GITHUB_ACTOR}"
            echo "- Mode: ${CONTROL_MODE:-unresolved}"
            echo "- Target: ${CONTROL_TARGET:-unresolved}"
            echo "- Request: ${CONTROL_REQUEST_ID:-unresolved}"
            echo "- Expires: ${CONTROL_EXPIRES_AT:-unresolved}"
            echo "- Reason: ${CONTROL_REASON:-unresolved}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -f cloud-control-audit.json ]]; then
              echo '- Result:'
              echo '```json'
              cat cloud-control-audit.json
              echo '```'
            else
              echo '- Result: operation did not reach audited completion; inspect the run log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record operation on issue 406
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          audit='No audit file was produced.'
          if [[ -f cloud-control-audit.json ]]; then
            audit=$(cat cloud-control-audit.json)
          fi
          body=$(cat <<EOF
          Cloud Control run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          - actor: ${GITHUB_ACTOR}
          - mode: ${CONTROL_MODE:-unresolved}
          - target: ${CONTROL_TARGET:-unresolved}
          - request: ${CONTROL_REQUEST_ID:-unresolved}
          - reason: ${CONTROL_REASON:-unresolved}
          - job status: ${JOB_STATUS}

          \`\`\`json
          ${audit}
          \`\`\`
          EOF
          )
          gh issue comment 406 --repo "$GITHUB_REPOSITORY" --body "$body"
