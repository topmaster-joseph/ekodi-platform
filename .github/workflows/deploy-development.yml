name: Deploy EKODI Development

# Development-only deployment. Production is never a target of this workflow.
on:
  push:
    branches: [development]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekodi-development
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
    steps:
      - name: Enforce development boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/development" || {
            echo "::error::Development deployment is allowed only from the development branch."
            exit 1
          }
          test "$CLOUDFLARE_ACCOUNT_ID" = "46aad4738793fbaca88574832a2ccc0f" || {
            echo "::error::Cloudflare account boundary mismatch."
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate development deployment sources
        run: |
          node --check platform-router-entry-worker.js
          node --check scripts/monitor-lib.mjs
          node --check scripts/monitor.mjs
          node --test test/monitor.test.mjs
      - name: Build development assets
        run: npm run build
      - name: Verify development Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_DEVELOPMENT_API_TOKEN is not configured in the development environment."
            exit 1
          }
      - name: Deploy only to EKODI Development
        run: npx --yes wrangler@4.127.0 deploy --config wrangler.development.jsonc --experimental-provision=false

  verify-development:
    needs: validate-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_URL: https://ekodi-platform-development.ekodi-development.workers.dev
    steps:
      - name: Verify isolated development endpoint
        shell: bash
        run: |
          set -euo pipefail
          case "$DEV_URL" in
            *ekodi-development.workers.dev*) ;;
            *) echo '::error::Verification endpoint escaped the development account boundary.'; exit 1 ;;
          esac
          body="$(curl --fail --silent --show-error --location --max-time 20 "$DEV_URL/")"
          test -n "$body"
          printf '%s' "$body" | grep -qi '<html'
          headers="$(curl --fail --silent --show-error --head --max-time 20 "$DEV_URL/")"
          printf '%s' "$headers" | grep -qi '^HTTP/.* 200'
          echo "Development endpoint verification passed."
