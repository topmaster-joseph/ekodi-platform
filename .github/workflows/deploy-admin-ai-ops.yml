name: Deploy Admin AI Ops

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-ai-ops.yml'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'user-ai-tier-panel.js'
      - 'admin-demand-loader.js'
      - 'admin-lazy-features.js'
      - 'admin-readable-command.js'
      - 'admin-readable-command.css'
      - 'admin-central-handoff.js'
      - 'admin-authenticated-shell.js'
      - 'admin-perf-diagnostics.js'
      - 'compact-control-center.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'site-worker.js'
      - 'package.json'
      - 'scripts/build.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/admin-performance-postbuild.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/admin-readable-command.test.mjs'
      - 'test/admin-true-lazy.test.mjs'
      - 'test/admin-health-menu.test.mjs'
      - 'test/admin-deploy-report.test.mjs'
      - 'test/admin-ai-membership-menu.test.mjs'
  workflow_run:
    workflows: ['Deploy Admin True Lazy Gate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ekodi-admin-production-verification
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      asset_version: ${{ steps.build_contract.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate flat AI Ops, standalone Health and production verification contracts
        run: |
          set -euo pipefail
          node --check admin-demand-loader.js
          node --check admin-lazy-features.js
          node --check admin-readable-command.js
          node --check admin-central-handoff.js
          node --check admin-authenticated-shell.js
          node --check admin-perf-diagnostics.js
          node --check ai-ops-admin.js
          node --check user-ai-tier-panel.js
          node --check release-control-admin.js
          node --check system-health-admin.js
          node --test test/admin-readable-command.test.mjs test/admin-true-lazy.test.mjs test/admin-health-menu.test.mjs test/admin-deploy-report.test.mjs test/admin-ai-membership-menu.test.mjs
          npm run check

      - name: Build fingerprinted Admin contract
        id: build_contract
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          for asset in ai-ops-admin.js ai-ops-admin.css admin-demand-loader.js admin-lazy-features.js compact-control-center.css admin-perf-diagnostics.js system-health-admin.js system-health-admin.css; do
            test -f "dist/$asset"
          done
          version=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' dist/control-center.html | head -1 | sed 's/.*?v=//')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -Fq "control-center.css?v=$version" dist/control-center.html
          grep -Fq "admin-central-handoff.js?v=$version" dist/control-center.html
          grep -Fq "secondaryScripts: ['admin-lazy-features.js']" dist/admin-demand-loader.js
          grep -Fq 'health:' dist/admin-demand-loader.js
          grep -Fq "styles: ['system-health-admin.css']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['system-health-admin.js']" dist/admin-demand-loader.js
          grep -Fq "hashes: ['#health']" dist/admin-demand-loader.js
          ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq 'aimembers:' dist/admin-demand-loader.js
          grep -Fq "label: 'AI 회원운영'" dist/admin-demand-loader.js
          grep -Fq "hashes: ['#ai-membership']" dist/admin-demand-loader.js
          grep -Fq 'AI 회원운영' dist/ai-ops-admin.js
          grep -Fq '개인 API 여부' dist/ai-ops-admin.js
          grep -Fq "scripts: ['release-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-lazy-features.js
          grep -Fq '재구성' dist/admin-lazy-features.js
          grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' dist/admin-lazy-features.js
          grep -Fq 'admin-readable-command.css' dist/ai-ops-admin.css
          grep -Fq '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' dist/ai-ops-admin.css
          grep -Fq '#aiOpsPanel .ai-ops-side' dist/ai-ops-admin.css
          ! grep -Fq 'admin-readable-command.css' dist/compact-control-center.css
          grep -Fq 'PerformanceObserver' dist/admin-perf-diagnostics.js
          ! grep -Fq 'PerformanceObserver' dist/admin-central-handoff.js
          grep -Fq "navLabel.textContent = 'Health'" dist/system-health-admin.js
          grep -Fq "pageTitle.textContent = 'System Health'" dist/system-health-admin.js
          grep -Fq '.system-health-overall' dist/system-health-admin.css
          echo "Admin production verification contract ready: version=$version"

  verify_production:
    needs: validate
    if: ${{ always() && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: ${{ needs.validate.outputs.asset_version }}
    steps:
      - name: Verify production fingerprinted thin shell and flat AI Ops
        id: production_verify
        if: ${{ needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
        shell: bash
        run: |
          set -euo pipefail

          verify_root() {
            code=$(curl -sS --max-redirs 0 -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true)
            echo "admin root -> $code"
            [ "$code" = '200' ] || return 1
            grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-headers || return 1
            grep -Fiq 'cache-control: no-store' /tmp/admin-headers || return 1
            if grep -Fiq '^location:' /tmp/admin-headers; then return 1; fi
            LIVE_VERSION=$(grep -oE 'admin-authenticated-shell\.js\?v=[a-f0-9]{16}' /tmp/admin-body | head -1 | sed 's/.*?v=//')
            [ -n "$LIVE_VERSION" ] || return 1
            [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ] || return 1
            grep -Fq "control-center.css?v=$LIVE_VERSION" /tmp/admin-body || return 1
            grep -Fq "admin-central-handoff.js?v=$LIVE_VERSION" /tmp/admin-body || return 1
            ! grep -Fq '<script src="control-center.js"' /tmp/admin-body || return 1
            ! grep -Fq 'control-center-ops.css' /tmp/admin-body || return 1
            ! grep -Fq 'control-center-finance.css' /tmp/admin-body || return 1
          }

          verify_asset() {
            asset="$1"
            expected="$2"
            code=$(curl -sS -D /tmp/asset-headers -o /tmp/admin-asset -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/${asset}?v=$LIVE_VERSION" || true)
            echo "$asset?v=$LIVE_VERSION -> $code"
            [ "$code" = '200' ] || return 1
            grep -Fiq 'x-ekodi-route: admin-asset' /tmp/asset-headers || return 1
            grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/asset-headers || return 1
            grep -Fq "$expected" /tmp/admin-asset || return 1
          }

          verify_compact_without_readable_css() {
            code=$(curl -sS -D /tmp/compact-headers -o /tmp/compact-css -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/compact-control-center.css?v=$LIVE_VERSION" || true)
            [ "$code" = '200' ] || return 1
            grep -Fiq 'cache-control: public, max-age=31536000, immutable' /tmp/compact-headers || return 1
            ! grep -Fq 'admin-readable-command.css' /tmp/compact-css || return 1
          }

          for attempt in $(seq 1 24); do
            LIVE_VERSION=''
            if verify_root \
              && verify_asset 'admin-demand-loader.js' "secondaryScripts: ['admin-lazy-features.js']" \
              && verify_asset 'admin-demand-loader.js' "scripts: ['system-health-admin.js']" \
              && verify_asset 'admin-demand-loader.js' "label: 'AI 회원운영'" \
              && verify_asset 'admin-demand-loader.js' "hashes: ['#ai-membership']" \
              && verify_asset 'ai-ops-admin.js' 'AI 회원운영' \
              && verify_asset 'ai-ops-admin.js' '개인 API 여부' \
              && verify_asset 'system-health-admin.js' "navLabel.textContent = 'Health'" \
              && verify_asset 'system-health-admin.js' "pageTitle.textContent = 'System Health'" \
              && verify_asset 'system-health-admin.css' '.system-health-overall' \
              && verify_asset 'admin-lazy-features.js' "actionType:'ui.change_request'" \
              && verify_asset 'admin-lazy-features.js' '전문 기능 선택을 관리자에게 넘기지 않습니다' \
              && verify_asset 'ai-ops-admin.css' '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' \
              && verify_asset 'ai-ops-admin.css' '#aiOpsPanel .ai-ops-side' \
              && verify_asset 'admin-perf-diagnostics.js' 'PerformanceObserver' \
              && verify_compact_without_readable_css; then
              echo "Production Admin verified: version=$LIVE_VERSION, AI membership operations, fingerprinted immutable assets, standalone Health and thin shell."
              exit 0
            fi
            echo "Admin production verification pending (attempt $attempt/24, expected=$EXPECTED_VERSION, live=${LIVE_VERSION:-none})."
            sleep 4
          done
          exit 1

      - name: Publish Admin deployment verification checkpoint
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.production_verify.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          UPSTREAM_OUTCOME: ${{ github.event.workflow_run.conclusion || 'manual' }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url || 'manual verification' }}
        run: |
          set -euo pipefail
          outcome="${VERIFY_OUTCOME:-skipped}"
          if [ "$outcome" = 'success' ]; then icon='✅'; summary='PRODUCTION VERIFIED'; else icon='❌'; summary='PRODUCTION NOT VERIFIED'; fi
          body=$(cat <<EOF
          $icon **$summary**

          - commit: \`$COMMIT_SHA\`
          - production check: \`$outcome\`
          - upstream true-lazy gate: \`$UPSTREAM_OUTCOME\`
          - canonical: https://admin.ekodi.kr/
          - contract: fingerprinted thin shell · immutable assets · standalone Health · flat AI Ops · internal specialist routing · AI 회원운영
          - verification workflow: $RUN_URL
          - upstream workflow: $UPSTREAM_RUN_URL
          - checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          )
          gh issue comment 333 --repo "$GITHUB_REPOSITORY" --body "$body"