name: Deploy Admin AI Ops

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-ai-ops.yml'
      - 'ai-ops-admin.js'
      - 'ai-ops-admin.css'
      - 'admin-demand-loader.js'
      - 'admin-lazy-features.js'
      - 'admin-readable-command.js'
      - 'admin-readable-command.css'
      - 'system-health-admin.js'
      - 'system-health-admin.css'
      - 'release-control-admin.js'
      - 'release-control-admin.css'
      - 'site-worker.js'
      - 'package.json'
      - 'scripts/build.mjs'
      - 'scripts/admin-readable-command-postbuild.mjs'
      - 'scripts/guarded-worker-release.mjs'
      - 'deploy/manifests/shared-site.worker.json'
      - 'test/admin-readable-command.test.mjs'
      - 'test/admin-true-lazy.test.mjs'

permissions:
  contents: read

concurrency:
  group: ekodi-shared-site-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate flat AI Ops and orchestration contracts
        run: |
          set -euo pipefail
          node --check admin-demand-loader.js
          node --check admin-lazy-features.js
          node --check admin-readable-command.js
          node --check ai-ops-admin.js
          node --check release-control-admin.js
          node --check system-health-admin.js
          node --test test/admin-readable-command.test.mjs
          node --test test/admin-true-lazy.test.mjs
          npm run check

      - name: Build shared admin assets
        run: |
          set -euo pipefail
          npm run build
          test -f dist/ai-ops-admin.js
          test -f dist/ai-ops-admin.css
          test -f dist/admin-demand-loader.js
          test -f dist/admin-lazy-features.js
          test -f dist/compact-control-center.css
          grep -Fq "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" dist/admin-demand-loader.js
          ! grep -Fq "secondaryScripts: ['mission-control-admin.js'" dist/admin-demand-loader.js
          grep -Fq 'deployments:' dist/admin-demand-loader.js
          grep -Fq "scripts: ['release-control-admin.js']" dist/admin-demand-loader.js
          grep -Fq "actionType:'ui.change_request'" dist/admin-lazy-features.js
          grep -Fq '재구성' dist/admin-lazy-features.js
          grep -Fq '전문 기능 선택을 관리자에게 넘기지 않습니다' dist/admin-lazy-features.js
          grep -Fq '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' dist/compact-control-center.css
          grep -Fq '#aiOpsPanel .ai-ops-side' dist/compact-control-center.css

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Candidate at 0%, verify shared routes, promote and auto-rollback on failure
        run: |
          set -euo pipefail
          node scripts/guarded-worker-release.mjs --manifest deploy/manifests/shared-site.worker.json

      - name: Verify production flat Admin AI Ops
        shell: bash
        run: |
          set -euo pipefail

          verify_admin() {
            code=$(curl -sS --max-redirs 0 -D /tmp/admin-headers -o /tmp/admin-body -w '%{http_code}' --connect-timeout 5 --max-time 15 'https://admin.ekodi.kr/' || true)
            echo "admin root -> $code"
            [ "$code" = '200' ] || return 1
            grep -Fiq 'x-ekodi-route: admin-control-center' /tmp/admin-headers || return 1
            grep -Fiq 'cache-control: no-store' /tmp/admin-headers || return 1
            if grep -Fiq '^location:' /tmp/admin-headers; then return 1; fi
          }

          verify_asset() {
            path="$1"
            expected="$2"
            code=$(curl -sS -D /tmp/asset-headers -o /tmp/admin-asset -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://admin.ekodi.kr/$path" || true)
            echo "$path -> $code"
            [ "$code" = '200' ] || return 1
            grep -Fiq 'x-ekodi-route: admin-asset' /tmp/asset-headers || return 1
            grep -Fq "$expected" /tmp/admin-asset || return 1
          }

          for attempt in $(seq 1 18); do
            if verify_admin \
              && verify_asset 'admin-demand-loader.js' "secondaryScripts: ['admin-lazy-features.js', 'system-health-admin.js']" \
              && verify_asset 'admin-lazy-features.js' "actionType:'ui.change_request'" \
              && verify_asset 'admin-lazy-features.js' '재구성' \
              && verify_asset 'compact-control-center.css' '#aiOpsPanel .ai-chief-chat{order:1!important;position:static!important' \
              && verify_asset 'compact-control-center.css' '#aiOpsPanel .ai-ops-side'; then
              echo 'Production Admin verified: flat AI Ops, internal specialist routing, action-first Chief AI and guarded release.'
              exit 0
            fi
            echo "Admin flat AI Ops production verification pending (attempt $attempt/18)."
            sleep 4
          done
          exit 1
