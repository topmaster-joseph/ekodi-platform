name: Validate EKODI Invest Personalization

on:
  pull_request:
    paths: &invest_paths
      - 'profile-official-data-adapter.js'
      - 'invest-personalization-runtime.js'
      - 'invest-market-core.js'
      - 'invest-automation-runtime.js'
      - 'invest-lifecycle-runtime.js'
      - 'invest-site-system.js'
      - 'invest-personal-control.js'
      - 'invest-user-page.js'
      - 'invest-subject-ui.js'
      - 'invest-admin.js'
      - 'invest-admin.css'
      - 'migrations/0086_invest_autonomous_loop.sql'
      - 'migrations/0100_invest_lifecycle_management.sql'
      - 'workspace-platform-entry-worker.js'
      - 'platform-router-entry-worker.js'
      - 'platform-router-worker.js'
      - 'my/user-ai-ui.js'
      - 'test/invest-personalization-contract.test.mjs'
      - 'test/invest-market-core.test.mjs'
      - 'test/invest-site-system.test.mjs'
      - 'test/invest-lifecycle-runtime.test.mjs'
      - '.github/workflows/release-invest-personalization.yml'
  push:
    branches: [main]
    paths: *invest_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate personalized Invest contracts
        run: |
          set -euo pipefail
          for file in profile-official-data-adapter.js invest-personalization-runtime.js invest-market-core.js invest-automation-runtime.js invest-lifecycle-runtime.js invest-site-system.js invest-personal-control.js invest-user-page.js invest-subject-ui.js invest-admin.js workspace-platform-entry-worker.js platform-router-entry-worker.js platform-router-worker.js my/user-ai-ui.js; do node --check "$file"; done
          node --test test/invest-personalization-contract.test.mjs test/invest-market-core.test.mjs test/invest-site-system.test.mjs test/invest-lifecycle-runtime.test.mjs
          node scripts/validate-additive-migrations.mjs migrations
          npm run build
          node scripts/validate-deployment-guardrails.mjs

# Workspace API staging and production are deliberately NOT deployed here.
# Release EKODI Conversation Foundation APIs is the single owner of
# deploy/manifests/workspace-platform.worker.json and its staging Worker/D1.
# Invest source changes are included in that canonical workflow's path filters,
# so a validated Invest change is promoted through the shared Workspace gates.
