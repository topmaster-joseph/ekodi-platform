name: Device Control Windows CI

on:
  pull_request:
    paths:
      - 'device-control.js'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'remote-power-admin.js'
      - 'remote-power-admin.css'
      - 'admin-demand-loader.js'
      - 'ekodi-device-bootstrap.cmd'
      - 'scripts/build.mjs'
      - 'tools/ekodi-device-agent/windows/**'
      - 'migrations/0021_device_control.sql'
      - 'migrations/0022_device_ai_ops.sql'
      - 'test/device-control-contract.test.mjs'
      - 'test/non-disruptive-device-agent-contract.test.mjs'
      - 'test/background-browser-canary-contract.test.mjs'
      - '.github/workflows/device-control-windows.yml'
  push:
    branches: [main]
    paths:
      - 'device-control.js'
      - 'device-control-admin.js'
      - 'device-control-admin.css'
      - 'remote-power-admin.js'
      - 'remote-power-admin.css'
      - 'admin-demand-loader.js'
      - 'ekodi-device-bootstrap.cmd'
      - 'scripts/build.mjs'
      - 'tools/ekodi-device-agent/windows/**'
      - 'migrations/0021_device_control.sql'
      - 'migrations/0022_device_ai_ops.sql'
      - 'test/device-control-contract.test.mjs'
      - 'test/non-disruptive-device-agent-contract.test.mjs'
      - 'test/background-browser-canary-contract.test.mjs'
      - '.github/workflows/device-control-windows.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Device Control JavaScript and contract
        run: |
          node --check device-control.js
          node --check device-control-admin.js
          node --check remote-power-admin.js
          node --check admin-demand-loader.js
          node --test test/device-control-contract.test.mjs test/non-disruptive-device-agent-contract.test.mjs test/background-browser-canary-contract.test.mjs
      - name: Build authenticated true-lazy Admin with Device AI
        run: |
          set -euo pipefail
          npm run build
          test -f dist/device-control-admin.js
          test -f dist/device-control-admin.css
          test -f dist/remote-power-admin.js
          test -f dist/remote-power-admin.css
          test -f dist/admin-demand-loader.js
          test -f dist/ekodi-device-bootstrap.cmd
          grep -Fq '운영 제안' dist/device-control-admin.js
          grep -Fq '.device-health' dist/device-control-admin.css
          grep -Fq "styles: ['device-control-admin.css', 'remote-power-admin.css']" dist/admin-demand-loader.js
          grep -Fq "scripts: ['device-control-admin.js', 'remote-power-admin.js']" dist/admin-demand-loader.js
          grep -Fq 'RegisterProtocol' dist/ekodi-device-bootstrap.cmd
          grep -Fq 'EKB-130' dist/ekodi-device-bootstrap.cmd
          if grep -Fq 'ekodi-device-startup-bootstrap.ps1' dist/ekodi-device-bootstrap.cmd; then
            echo 'Agent bootstrap must not install Boot/WOL automatically.'
            exit 1
          fi
          if grep -Fq '<script src="device-control-admin.js"' dist/control-center.html; then
            echo 'Device Control must remain demand-loaded after authentication.'
            exit 1
          fi
          if grep -Fq '<link rel="stylesheet" href="device-control-admin.css"' dist/control-center.html; then
            echo 'Device Control CSS must remain out of the pre-auth path.'
            exit 1
          fi

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows Agent and Boot/WOL scripts without executing them
        shell: pwsh
        run: |
          foreach ($relative in @(
            'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1',
            'tools/ekodi-device-agent/windows/ekodi-device-startup.ps1',
            'tools/ekodi-device-agent/windows/background-browser-canary.ps1',
            'tools/ekodi-device-agent/windows/ekodi-isolated-guest-agent.ps1',
            'tools/ekodi-device-agent/windows/install-isolated-guest-agent.ps1',
            'tools/ekodi-device-agent/windows/transactional-upgrade.test.ps1'
          )) {
            $path = Join-Path $PWD $relative
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell parse OK: $path"
          }
      - name: Verify remote execution and privacy boundary
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          $content = Get-Content $path -Raw
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'Agent AST parse failed.' }
          $forbiddenNames = @(('Invoke-' + 'Expression'), ('i' + 'ex'))
          $actualCommands = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ })
          foreach ($forbidden in $forbiddenNames) {
            if ($actualCommands -contains $forbidden) { throw "Forbidden executable command found: $forbidden" }
          }
          $commands = @(
            'power.always_on','power.presentation','power.normal','power.restore','lock.resume_off','lock.resume_on','autologon.open',
            'diagnostics.collect','network.diagnose','printers.diagnose','startup.scan','startup.disable','startup.restore',
            'maintenance.temp_cleanup','updates.scan','updates.install','profile.workstation.apply','profile.workstation.restore','agent.self_update','computer.browser.canary','computer.browser.execute','computer.desktop.probe','computer.desktop.canary','computer.desktop.guest.canary','computer.desktop.ui.canary',
            'remote_desktop.recovery.enable','remote_desktop.recovery.disable','remote_desktop.recovery.run'
          )
          foreach ($command in $commands) {
            if (-not $content.Contains("'$command'")) { throw "Missing allowlisted command: $command" }
          }
          foreach ($guard in @('arbitraryShell = $false','screenCapture = $false','credentialCollection = $false','backgroundBrowser = [bool](Get-BackgroundBrowserCanaryState).verified','isolatedDesktopProbe = $true','isolatedDesktopCanary = [bool](Get-IsolatedDesktopCanaryState).verified','isolatedDesktopGuestCanary = [bool](Get-IsolatedDesktopGuestCanaryState).verified','isolatedDesktopUiCanary = [bool](Get-IsolatedDesktopUiCanaryState).verified','isolatedDesktop = $false')) {
            if (-not $content.Contains($guard)) { throw "Missing privacy guard: $guard" }
          }
          if ($content -match '(?i)Restart-Computer|GetAsyncKeyState|SetWindowsHookEx|CopyFromScreen|GetClipboard') { throw 'Forbidden remote-control behavior found.' }
          foreach ($nativeBrowserGuard in @('background_browser_canary_required','--blink-settings=scriptEnabled=false',"mutationMode = 'read-only-static-surface'",'activeUserProfileReused = $false')) {
            if (-not $content.Contains($nativeBrowserGuard)) { throw "Missing native browser safety guard: $nativeBrowserGuard" }
          }
          Write-Host 'Windows agent command and privacy boundary OK.'
      - name: Run native Background Browser Worker on Windows runner
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          . $path
          $canary = Invoke-BackgroundBrowserCanary
          if (-not $canary.browserCanary.ok) { throw 'Native browser canary did not pass.' }
          $worker = Invoke-BackgroundBrowserWorker ([pscustomobject]@{ path = '/'; deviceProfile = 'desktop' })
          $proof = $worker.browserWorker
          if (-not $proof.ok) { throw 'Native browser worker did not return ok.' }
          if ($proof.virtualizationProvider -ne 'ekodi-native-remote-computer') { throw 'Unexpected native virtualization provider.' }
          if ($proof.routingPolicy -ne 'EKODI-VIRTUALIZATION-ROUTING-001') { throw 'Virtualization routing policy evidence missing.' }
          if ($proof.mode -ne 'background-browser-worker') { throw 'Unexpected browser worker mode.' }
          if ($proof.url -ne 'https://ekodi.kr/') { throw 'Native browser worker escaped canonical EKODI target.' }
          if ($proof.deviceProfile -ne 'desktop' -or $proof.viewportWidth -ne 1440 -or $proof.viewportHeight -ne 900) { throw 'Desktop viewport proof mismatch.' }
          if ($proof.contentBytes -le 0 -or $proof.screenshotBytes -le 0) { throw 'DOM or screenshot evidence missing.' }
          if ($proof.contentSha256.Length -ne 64 -or $proof.contentSha256 -match '[^a-f0-9]' -or $proof.screenshotSha256.Length -ne 64 -or $proof.screenshotSha256 -match '[^a-f0-9]') { throw 'Runtime evidence hashes are invalid.' }
          if (-not $proof.dedicatedAutomationProfile -or -not $proof.ephemeralProfile -or -not $proof.profileRemoved) { throw 'Browser profile isolation proof failed.' }
          if ($proof.activeUserProfileReused -or -not $proof.focusIsolated -or $proof.clipboardShared -or $proof.userInputInjection) { throw 'Foreground privacy isolation proof failed.' }
          if ($proof.javascriptEnabled -or $proof.mutationMode -ne 'read-only-static-surface') { throw 'Initial Windows native browser lane must remain read-only.' }
          @(
            '## EKODI Windows Native Browser Runtime',
            '',
            ('- Provider: ' + $proof.virtualizationProvider),
            ('- Mode: ' + $proof.mode),
            ('- Browser: ' + $proof.browser),
            ('- Target: ' + $proof.url),
            ('- Viewport: ' + $proof.viewportWidth + 'x' + $proof.viewportHeight),
            ('- DOM bytes: ' + $proof.contentBytes),
            ('- Screenshot bytes: ' + $proof.screenshotBytes),
            ('- Ephemeral profile removed: ' + $proof.profileRemoved),
            ('- Foreground isolated: ' + $proof.focusIsolated),
            ('- Clipboard shared: ' + $proof.clipboardShared),
            ('- User input injection: ' + $proof.userInputInjection),
            ('- Mutation mode: ' + $proof.mutationMode)
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Probe EKODI isolated desktop backend without activation
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          . $path
          $probe = Get-IsolatedDesktopBackendProbe
          if (-not $probe.ok) { throw 'Isolated desktop backend probe failed.' }
          if ($probe.mode -ne 'isolated-desktop-backend-probe') { throw 'Unexpected desktop probe mode.' }
          if ($probe.provider -ne 'ekodi-native-remote-computer') { throw 'Desktop probe provider must remain EKODI-native.' }
          if ($probe.routingPolicy -ne 'EKODI-VIRTUALIZATION-ROUTING-001') { throw 'Desktop probe routing policy evidence missing.' }
          if ($probe.backendPolicy -ne 'EKODI-ISOLATED-DESKTOP-BACKEND-001') { throw 'Desktop backend policy evidence missing.' }
          if ($probe.windowsSandboxAcceptedForActivation) { throw 'Foreground Windows Sandbox must not activate non-disruptive desktop execution.' }
          if ($probe.sharedInteractiveDesktop -or $probe.userInputInjection -or $probe.clipboardShared -or $probe.credentialCollection) { throw 'Desktop probe weakened foreground privacy boundary.' }
          if ($probe.headlessBackendReady -and $probe.recommendedBackend -ne 'hyper-v-ekodi-base') { throw 'A ready headless backend must resolve to the EKODI Hyper-V base.' }
          if (-not $probe.headlessBackendReady -and $probe.gapReason -notin @('native-capability-unavailable','native-capability-not-production-ready','required-capability-not-yet-implemented','native-capacity-or-runtime-failure')) { throw 'Missing allowed native capability gap classification.' }
          Write-Host "Isolated desktop probe OK: backend=$($probe.recommendedBackend) ready=$($probe.headlessBackendReady) gap=$($probe.gapReason)"
      - name: Verify Hyper-V canary remains fail-closed until a real backend is ready
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          $content = Get-Content $path -Raw
          foreach ($required in @(
            'function Invoke-IsolatedDesktopHyperVCanary',
            'New-VHD -Path $sessionDisk -ParentPath $baseDiskPath -Differencing',
            'New-VM -Name $sessionName',
            'Remove-VMNetworkAdapter',
            'Start-VM -Name $sessionName',
            'Stop-VM -Name $sessionName -TurnOff -Force',
            'Remove-VM -Name $sessionName -Force',
            'sessionVmRemoved = -not [bool](Get-VM',
            'sessionDiskRemoved = -not (Test-Path -LiteralPath $sessionDisk)',
            'isolatedDesktop = $false'
          )) {
            if (-not $content.Contains($required)) { throw "Missing isolated desktop canary guard: $required" }
          }
          Write-Host 'Hyper-V canary contract is present and isolated desktop execution remains disabled.'
      - name: Verify isolated Guest Agent offline task/receipt boundary
        shell: pwsh
        run: |
          $hostPath = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          $guestPath = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-isolated-guest-agent.ps1'
          $installerPath = Join-Path $PWD 'tools/ekodi-device-agent/windows/install-isolated-guest-agent.ps1'
          $hostContent = Get-Content $hostPath -Raw
          $guestContent = Get-Content $guestPath -Raw
          $installerContent = Get-Content $installerPath -Raw
          foreach ($required in @(
            'function Invoke-IsolatedDesktopGuestRuntimeCanary',
            'Write-EkodiGuestRuntimeTask',
            'Read-EkodiGuestRuntimeReceipt',
            "type = 'guest.runtime.probe'",
            "networkPolicy = 'none'",
            'Get-VMIntegrationService -VMName $sessionName -Name ''Heartbeat''',
            'isolatedDesktopGuestCanary = [bool](Get-IsolatedDesktopGuestCanaryState).verified',
            'isolatedDesktop = $false'
          )) {
            if (-not $hostContent.Contains($required)) { throw "Missing host guest-canary guard: $required" }
          }
          foreach ($required in @(
            "GuestAgentVersion = '1.0.0'",
            "guest.runtime.probe",
            "guest_task_network_policy_invalid",
            'executedAsSystem',
            'noNetworkAdapter',
            'noActiveNetwork',
            'interactiveDesktopUsed = $false',
            'clipboardShared = $false',
            'userInputInjection = $false',
            'credentialCollection = $false',
            "mutationScope = 'ephemeral-guest-only'",
            "New-ScheduledTaskPrincipal -UserId 'SYSTEM'"
          )) {
            if (-not $guestContent.Contains($required)) { throw "Missing isolated Guest Agent guard: $required" }
          }
          if ($guestContent -match '(?i)Invoke-WebRequest|Invoke-RestMethod|New-PSSession|Enter-PSSession|Invoke-Expression|\biex\b') {
            throw 'Guest Agent must remain networkless and must not expose arbitrary execution.'
          }
          if (-not $installerContent.Contains('EKODI Isolated Guest Agent')) { throw 'Guest Agent installer contract missing.' }
          Write-Host 'Isolated Guest Agent offline task/receipt contract is fail-closed and credentialless.'
      - name: Verify semantic isolated Guest UI canary boundary
        shell: pwsh
        run: |
          $hostPath = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          $guestPath = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-isolated-guest-agent.ps1'
          $hostContent = Get-Content $hostPath -Raw
          $guestContent = Get-Content $guestPath -Raw
          foreach ($required in @(
            'function Invoke-IsolatedDesktopGuestUiCanary',
            "type = 'guest.ui.probe'",
            'isolated_guest_runtime_canary_required',
            'semanticUiAutomation',
            'lowLevelInputInjection',
            'hostInteractiveDesktopUsed',
            'syntheticUiOnly',
            'isolatedDesktopUiCanary = [bool](Get-IsolatedDesktopUiCanaryState).verified',
            'isolatedDesktop = $false'
          )) {
            if (-not $hostContent.Contains($required)) { throw "Missing semantic UI host guard: $required" }
          }
          foreach ($required in @(
            'function Invoke-GuestUiProbe',
            "guest.ui.probe",
            'System.Windows.Automation.AutomationElement',
            'System.Windows.Automation.InvokePattern',
            'semanticUiAutomation = $true',
            'lowLevelInputInjection = $false',
            'hostInteractiveDesktopUsed = $false',
            'syntheticUiOnly = $true',
            "mutationScope = 'ephemeral-guest-ui-only'"
          )) {
            if (-not $guestContent.Contains($required)) { throw "Missing semantic Guest UI guard: $required" }
          }
          if ($guestContent -match '(?i)SendKeys|mouse_event|keybd_event|SendInput|GetClipboard|SetClipboard') {
            throw 'Semantic Guest UI canary must not use low-level input or clipboard APIs.'
          }
          Write-Host 'Semantic isolated Guest UI canary contract is present and host desktop remains protected.'
      - name: Verify power and lock command mapping without changing runner settings
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          . $path
          function Save-PowerBackup { }
          function Get-AgentSettings { return @{} }
          function Restore-PowerBackup { return '11111111-1111-1111-1111-111111111111' }
          function Open-AutologonManager { return 'local-only' }
          function Assert-ContainsCall([string[]]$Calls, [string]$Expected) {
            if ($Calls -notcontains $Expected) { throw "Expected powercfg mapping missing: $Expected`nActual: $($Calls -join '; ')" }
          }
          $script:PowerCalls = @()
          function Invoke-PowerCfg([string[]]$Arguments) { $script:PowerCalls += ($Arguments -join ' '); return '' }
          [void](Invoke-DeviceCommand ([pscustomobject]@{ type = 'power.always_on' }))
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-ac 0'
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-dc 0'
          Assert-ContainsCall $script:PowerCalls '/change hibernate-timeout-ac 0'
          Assert-ContainsCall $script:PowerCalls '/change hibernate-timeout-dc 0'
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-ac 30'
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-dc 15'
          $script:PowerCalls = @()
          [void](Invoke-DeviceCommand ([pscustomobject]@{ type = 'power.presentation' }))
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-ac 0'
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-dc 0'
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-ac 0'
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-dc 0'
          $script:PowerCalls = @()
          [void](Invoke-DeviceCommand ([pscustomobject]@{ type = 'power.normal' }))
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-ac 15'
          Assert-ContainsCall $script:PowerCalls '/change monitor-timeout-dc 5'
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-ac 30'
          Assert-ContainsCall $script:PowerCalls '/change standby-timeout-dc 15'
          $script:PowerCalls = @()
          [void](Invoke-DeviceCommand ([pscustomobject]@{ type = 'lock.resume_off' }))
          Assert-ContainsCall $script:PowerCalls '/SETACVALUEINDEX SCHEME_CURRENT SUB_NONE CONSOLELOCK 0'
          Assert-ContainsCall $script:PowerCalls '/SETDCVALUEINDEX SCHEME_CURRENT SUB_NONE CONSOLELOCK 0'
          Assert-ContainsCall $script:PowerCalls '/SETACTIVE SCHEME_CURRENT'
          $script:PowerCalls = @()
          [void](Invoke-DeviceCommand ([pscustomobject]@{ type = 'lock.resume_on' }))
          Assert-ContainsCall $script:PowerCalls '/SETACVALUEINDEX SCHEME_CURRENT SUB_NONE CONSOLELOCK 1'
          Assert-ContainsCall $script:PowerCalls '/SETDCVALUEINDEX SCHEME_CURRENT SUB_NONE CONSOLELOCK 1'
          $restore = Invoke-DeviceCommand ([pscustomobject]@{ type = 'power.restore' })
          if ($restore.restoredScheme -ne '11111111-1111-1111-1111-111111111111') { throw 'Restore mapping did not call Restore-PowerBackup.' }
          $autologon = Invoke-DeviceCommand ([pscustomobject]@{ type = 'autologon.open' })
          if ($autologon.message -ne 'local-only') { throw 'AutoLogon mapping did not remain local-only.' }
          Write-Host 'Windows Device Control power/lock mapping OK.'
      - name: Verify protocol parser cannot redirect enrollment to another API
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tools/ekodi-device-agent/windows/ekodi-device-agent.ps1'
          . $path
          $parsed = Parse-ProtocolEnrollment 'ekodi-device://enroll?code=EKD-0123456789ABCDEF0123&api=https%3A%2F%2Fevil.example'
          if ($parsed.apiBase -ne 'https://ekodi.kr') { throw 'Protocol parser accepted an untrusted API base.' }
          if ($parsed.enrollmentCode -ne 'EKD-0123456789ABCDEF0123') { throw 'Protocol parser changed the enrollment code.' }
          $failed = $false
          try { [void](Parse-ProtocolEnrollment 'ekodi-device://shell?code=EKD-0123456789ABCDEF0123') } catch { $failed = $true }
          if (-not $failed) { throw 'Protocol parser accepted a non-enrollment action.' }
          Write-Host 'EKODI protocol boundary OK.'
      - name: Verify transactional upgrade, injected failure rollback, and re-upgrade
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tools/ekodi-device-agent/windows/transactional-upgrade.test.ps1')
      - name: Verify bootstrap separates Agent install from Boot WOL and avoids duplicate elevation
        shell: pwsh
        run: |
          $bootstrap = Get-Content (Join-Path $PWD 'ekodi-device-bootstrap.cmd') -Raw
          if ($bootstrap -notmatch '\$isAdmin=') { throw 'Bootstrap does not detect the current administrator token.' }
          if ($bootstrap -notmatch 'if\(\$isAdmin\)') { throw 'Bootstrap does not bypass duplicate RunAs when already elevated.' }
          if ($bootstrap -match 'ekodi-device-startup-bootstrap\.ps1') { throw 'Bootstrap still couples Boot/WOL setup to Agent installation.' }
          if ($bootstrap -match "'-Install','-RunNow'") { throw 'Bootstrap still auto-installs the Boot/WOL task.' }
          if ($bootstrap -notmatch 'EKB-130') { throw 'Bootstrap does not expose structured install error codes.' }
          Write-Host 'Bootstrap elevation and Agent/Boot separation OK.'
