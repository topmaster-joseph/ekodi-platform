name: Cloudflare Staging Account Scope Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-staging-account-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      DEV_ACCOUNT_ID: 46aad4738793fbaca88574832a2ccc0f
      DEV_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
      PROD_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only inventory and D1 reference classification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEV_TOKEN"
          test -n "$PROD_TOKEN"
          test "$DEV_ACCOUNT_ID" != "$PROD_ACCOUNT_ID"
          api='https://api.cloudflare.com/client/v4'
          dev_auth=(-H "Authorization: Bearer $DEV_TOKEN" -H 'Content-Type: application/json')
          prod_auth=(-H "Authorization: Bearer $PROD_TOKEN" -H 'Content-Type: application/json')

          probe() {
            label="$1"; account="$2"; token="$3"; path="$4"; extractor="$5"
            out="/tmp/${label}.json"
            code=$(curl -sS -o "$out" -w '%{http_code}' --connect-timeout 8 --max-time 30 \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "$api/accounts/$account/$path" || true)
            success=$(jq -r '.success // false' "$out" 2>/dev/null || echo false)
            echo "$label HTTP=$code success=$success"
            if [[ "$code" == 200 && "$success" == true ]]; then
              jq -r "$extractor" "$out" | sort -u | sed "s/^/$label ITEM=/"
            else
              jq -c '{errors:(.errors // []),messages:(.messages // [])}' "$out" 2>/dev/null || true
            fi
          }

          probe DEV_PAGES "$DEV_ACCOUNT_ID" "$DEV_TOKEN" 'pages/projects' '.result[]?.name // empty'
          probe PROD_PAGES "$PROD_ACCOUNT_ID" "$PROD_TOKEN" 'pages/projects' '.result[]?.name // empty'
          probe DEV_D1 "$DEV_ACCOUNT_ID" "$DEV_TOKEN" 'd1/database' '.result[]? | [.name,.uuid,(.num_tables//0),(.file_size//0),(.created_at//"")] | @tsv'
          probe PROD_D1 "$PROD_ACCOUNT_ID" "$PROD_TOKEN" 'd1/database' '.result[]? | [.name,.uuid,(.num_tables//0),(.file_size//0),(.created_at//"")] | @tsv'
          probe DEV_KV "$DEV_ACCOUNT_ID" "$DEV_TOKEN" 'storage/kv/namespaces' '.result[]?.title // empty'
          probe PROD_KV "$PROD_ACCOUNT_ID" "$PROD_TOKEN" 'storage/kv/namespaces' '.result[]?.title // empty'
          probe DEV_R2 "$DEV_ACCOUNT_ID" "$DEV_TOKEN" 'r2/buckets' '.result.buckets[]?.name // .result[]?.name // empty'
          probe PROD_R2 "$PROD_ACCOUNT_ID" "$PROD_TOKEN" 'r2/buckets' '.result.buckets[]?.name // .result[]?.name // empty'

          # Fetch all Production Worker settings and identify any D1 binding still targeting a staging-named database.
          curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts" -o /tmp/prod-workers.json
          jq -e '.success==true' /tmp/prod-workers.json >/dev/null
          mkdir -p /tmp/prod-settings
          while IFS= read -r worker; do
            [[ -n "$worker" ]] || continue
            curl -fsS "${prod_auth[@]}" "$api/accounts/$PROD_ACCOUNT_ID/workers/scripts/$worker/settings" -o "/tmp/prod-settings/$worker.json"
          done < <(jq -r '.result[]?.id' /tmp/prod-workers.json)

          python3 - <<'PY'
          import glob,json
          prod=json.load(open('/tmp/PROD_D1.json',encoding='utf-8')).get('result') or []
          staging={d.get('uuid'):d.get('name') for d in prod if 'staging' in (d.get('name') or '').lower()}
          refs=[]
          for path in glob.glob('/tmp/prod-settings/*.json'):
              worker=path.rsplit('/',1)[-1][:-5]
              data=json.load(open(path,encoding='utf-8')).get('result') or {}
              for b in data.get('bindings') or []:
                  if b.get('type')!='d1':
                      continue
                  dbid=b.get('id') or b.get('database_id') or b.get('database_id_ref')
                  name=staging.get(dbid)
                  if name:
                      refs.append((worker,b.get('name'),name,dbid))
          print('PROD_STAGING_D1_REFERENCE_COUNT='+str(len(refs)))
          for row in refs:
              print('PROD_STAGING_D1_REFERENCE='+' | '.join(str(x or '') for x in row))
          if not refs:
              print('PROD_STAGING_D1_REFERENCE=NONE')
          PY
