name = "ekodi-bible-conversation-staging"
main = "bible-worker.js"
compatibility_date = "2026-08-26"
workers_dev = true
preview_urls = false

[vars]
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=bible"
TENANT_SLUG = "ekodi-church"
AI_PROVIDER = "none"

[assets]
directory = "./bible"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
