<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>농가 수요조사 · 시연 | EKODI</title><style>body{font:16px/1.6 system-ui,sans-serif;color:#172d27;background:#f5f7f5;margin:0}main{max-width:750px;margin:35px auto;padding:25px;background:white;border:1px solid #ddd;border-radius:12px}h1{font-size:28px}label{display:block;margin:18px 0 5px;font-weight:650}input,select{width:100%;padding:12px;border:1px solid #9aa9a1;border-radius:6px;font:inherit;box-sizing:border-box}button{background:#145941;color:white;border:0;padding:12px 18px;border-radius:6px;font:inherit;margin-top:20px;cursor:pointer}.note{padding:15px;background:#edf4ee;border-left:4px solid #18754d}output{display:block;white-space:pre-wrap;margin-top:20px}a{color:#145941}@media print{button,.note,a{display:none}main{border:0;margin:0}}</style></head><body><main><a href="./index.html">← 사업 소개</a><h1>농가 인력 수요조사 · 시연 양식</h1><p class="note">이 화면은 기능 시연용입니다. 서버로 전송되지 않으며 저장되지 않습니다. 농가명, 성명, 연락처, 주소 등 개인정보는 입력하지 마십시오. 실제 신청·접수가 아닙니다.</p><form id="survey"><label for="crop">작목</label><select id="crop" required><option value="">선택</option><option>양파</option><option>마늘</option><option>고구마</option><option>시설원예</option><option>기타</option></select><label for="workers">필요 인원(명)</label><input id="workers" type="number" min="1" max="1000" step="1" required><label for="start">희망 시작월</label><input id="start" type="month" required><label for="months">희망 근무기간(개월)</label><select id="months" required><option value="">선택</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select><label for="housing">숙소 준비 상태</label><select id="housing" required><option value="">선택</option><option>준비 완료</option><option>준비 중</option><option>추가 지원 필요</option></select><button type="submit">시연 결과 보기</button> <button type="button" id="print" disabled>결과 인쇄</button></form><output id="result" aria-live="polite"></output></main><script>const form=document.getElementById('survey'),result=document.getElementById('result'),print=document.getElementById('print');form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const workers=Number(document.getElementById('workers').value),months=Number(document.getElementById('months').value);if(!Number.isSafeInteger(workers)||workers<1||workers>1000)return;result.textContent='[시연 결과 · 공식 접수 아님]\n작목: '+document.getElementById('crop').value+'\n필요 인원: '+workers+'명\n희망 시작월: '+document.getElementById('start').value+'\n희망 기간: '+months+'개월\n숙소: '+document.getElementById('housing').value+'\n예상 인력 수요: '+(workers*months)+'인·개월\n\n※ 인력 배정이나 체류기간 승인을 의미하지 않습니다.';print.disabled=false});print.addEventListener('click',()=>window.print());</script></body></html>
