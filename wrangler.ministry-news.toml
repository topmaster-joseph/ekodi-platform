name = "ekodi-ministry-news"
main = "ministry-news-worker.js"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

# 사역소식 통합 발행 허브. Gmail secrets (GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN)
# are set out of band; until they exist the hub records, approves and exports but does not send mail.
[vars]
ENVIRONMENT = "production"
OPERATOR_EMAILS = "topmaster.joseph@gmail.com,joseph@ekodi.kr"

[[routes]]
pattern = "ekodi.kr/sosik*"
zone_name = "ekodi.kr"

[[routes]]
pattern = "ekodi.kr/api/sosik*"
zone_name = "ekodi.kr"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
