<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="EKODI Education Learner Lab — 강사가 지정한 실습 미션을 단계별로 따라 하고, AI 결과를 원문과 바로 점검합니다">
  <meta name="ekodi-ui-type" content="USER">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1930">
  <title>수강생 실습실 · EKODI Education</title>
  <link rel="stylesheet" href="../../../fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="../live.css">
</head>
<body class="lv" data-ekodi-ui="USER" data-live-surface="learner">
<a class="skip" href="#labMain">본문으로 건너뛰기</a>
<header class="lv-top" id="labTop" data-ekodi-fixed-header aria-label="실습실 상단">
  <a class="lv-brand" id="labHome" href="../../../factchat/"><span class="lv-brand-mark" aria-hidden="true">E</span><span><strong id="topTitle">FactChat 실무 캠프</strong><small id="topSub">수강생 실습실</small></span></a>
  <span class="grow"></span>
  <span class="timer-pill" id="topTimer" role="timer" hidden></span>
  <a class="btn btn-primary btn-small" id="topFactchat" target="_blank" rel="noopener noreferrer" data-open-tool="factchat">FactChat ↗</a>
</header>
<main class="lab" id="labMain" tabindex="-1">
  <section class="lab-head" aria-labelledby="labTitle">
    <p class="eyebrow" id="labOrg">EKODI EDUCATION · LEARNER LAB</p>
    <h1 id="labTitle">수강생 실습실</h1>
    <p class="meta" id="labSub">실습 자료를 불러오는 중입니다.</p>
  </section>
  <div class="lab-bar" aria-label="실습 설정">
    <label class="field">회차<select id="labSession"></select></label>
    <label class="field">내 직무<select id="labTrack"></select></label>
    <label class="field">난이도<select id="labLevel"></select></label>
    <div><p class="meta" id="labTimerLabel">실습 타이머</p><p class="lab-timer" id="labTimer" role="timer">--:--</p></div>
    <button type="button" class="btn btn-small" id="labTimerBtn">타이머 시작</button>
  </div>
  <div class="tabs-wrap"><nav class="tabs" id="labTabs" aria-label="실습 메뉴"></nav></div>
  <div id="labView" aria-live="polite"></div>
  <section class="panel" aria-labelledby="privacyTitle">
    <h2 id="privacyTitle" class="sr-only">개인정보와 저장 안내</h2>
    <p class="meta" id="labSafety"></p>
    <p class="meta">이 화면의 체크·메모·붙여 넣은 결과는 <b>이 기기의 브라우저에만</b> 저장되며 서버로 전송되지 않습니다. 연결이 끊기거나 새로고침해도 이어서 할 수 있습니다.</p>
    <div class="btn-row"><button type="button" class="btn btn-small btn-danger" id="labClear">내 기록 삭제</button></div>
  </section>
</main>
<div class="dock" id="labDock" role="region" aria-label="실습 진행 도구">
  <div class="dock-in">
    <button type="button" class="btn btn-small" id="dockPrev" aria-label="이전 단계">←</button>
    <div class="dock-label" id="dockLabel"><b>오늘 순서</b><span>실습을 선택하세요</span></div>
    <button type="button" class="btn btn-primary" id="dockAction">실습 열기</button>
    <button type="button" class="btn btn-small" id="dockNext" aria-label="다음 단계">→</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
<script type="module" src="../lab.js"></script>
</body>
</html>
