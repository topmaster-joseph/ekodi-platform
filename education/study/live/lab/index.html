<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="EKODI Education Learner Lab — 강사가 지정한 실습 미션을 단계별로 따라 하고, AI 결과를 원문과 바로 점검합니다">
  <meta name="ekodi-ui-type" content="USER">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1930">
  <title>수강생 실습실 · EKODI Education</title>
  <link rel="stylesheet" href="../../../fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="../live.css">
</head>
<body class="lv" data-ekodi-ui="USER" data-live-surface="learner">
<a class="skip" href="#labMain">본문으로 건너뛰기</a>
<header class="lv-top" id="labTop" data-ekodi-fixed-header aria-label="실습실 상단">
  <a class="lv-brand" id="labHome" href="../../../factchat/"><span class="lv-brand-mark" aria-hidden="true">E</span><span><strong id="topTitle">FactChat 실무 캠프</strong><small id="topSub">수강생 실습실</small></span></a>
  <span class="grow"></span>
  <span class="timer-pill" id="topTimer" role="timer" hidden></span>
  <a class="btn btn-small" id="topHandout" href="../handout/" target="_blank" rel="noopener" title="강의 슬라이드 인쇄·PDF">강의자료</a>
  <a class="btn btn-primary btn-small" id="topFactchat" target="_blank" rel="noopener noreferrer" data-open-tool="factchat">FactChat ↗</a>
</header>
<main class="lab" id="labMain" tabindex="-1">
  <section class="lab-head" aria-labelledby="labTitle">
    <p class="eyebrow sr-only" id="labOrg">EKODI EDUCATION · LEARNER LAB</p>
    <h1 id="labTitle">수강생 실습실</h1>
    <p class="meta" id="labSub">실습 자료를 불러오는 중입니다.</p>
  </section>
  <section class="lab-control" aria-label="실습 설정">
    <details class="lab-settings" id="labSettings">
      <summary><span class="set-sum" id="setSummary">설정</span><span class="set-edit">변경</span></summary>
      <div class="lab-bar">
        <label class="field">회차<select id="labSession"></select></label>
        <label class="field">업무 분야<select id="labTrack"></select></label>
        <label class="field">세부 직무<select id="labRole"></select></label>
        <label class="field">난이도<select id="labLevel"></select></label>
        <button type="button" class="btn btn-small" id="textSize" aria-pressed="false" aria-label="글자 크게 보기">가 +</button>
      </div>
      <p class="lab-handout"><a id="labHandout" href="../handout/" target="_blank" rel="noopener">강의 슬라이드 인쇄·PDF →</a></p>
    </details>
    <div class="lab-timer-row" aria-label="실습 타이머">
      <span class="meta" id="labTimerLabel">실습 타이머</span>
      <span class="lab-timer" id="labTimer" role="timer">--:--</span>
      <span class="timer-ctl">
        <button type="button" class="btn btn-small" data-timer-add="-60000" aria-label="1분 줄이기">-1분</button>
        <button type="button" class="btn btn-small" data-timer-add="60000" aria-label="1분 늘리기">+1분</button>
        <button type="button" class="btn btn-small btn-primary" id="labTimerBtn">시작</button>
      </span>
    </div>
  </section>
  <div class="tabs-wrap" id="labTabsWrap"><nav class="tabs" id="labTabs" aria-label="실습 메뉴"></nav><nav class="subnav" id="labSubnav" aria-label="세부 진행 순서" hidden></nav></div>
  <div id="labView" aria-live="polite"></div>
  <details class="panel lab-privacy" id="labPrivacy">
    <summary><span>개인정보·비공개 자료는 입력하지 마세요 · 기록은 이 기기에만 저장</span></summary>
    <p class="meta" id="labSafety"></p>
    <p class="meta">체크·메모·붙여 넣은 결과는 이 기기의 브라우저에만 저장되고 서버로 보내지 않습니다.</p>
    <div class="btn-row"><button type="button" class="btn btn-small btn-danger" id="labClear">내 기록 삭제</button></div>
  </details>
</main>
<div class="dock" id="labDock" role="region" aria-label="실습 진행 도구">
  <div class="dock-in">
    <button type="button" class="btn btn-small" id="dockPrev" aria-label="이전 단계">←</button>
    <div class="dock-label" id="dockLabel"><b>오늘 순서</b><span>실습을 선택하세요</span></div>
    <button type="button" class="btn btn-primary" id="dockAction">실습 열기</button>
    <button type="button" class="btn btn-small" id="dockNext" aria-label="다음 단계">→</button>
  </div>
</div>
<div class="sheet" id="matSheet" role="dialog" aria-modal="true" aria-labelledby="matTitle" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b id="matTitle">실습 원문</b><button type="button" class="btn btn-small" data-sheet-close="1" aria-label="닫기">닫기</button></div>
    <pre class="sheet-text" id="matText" tabindex="0"></pre>
    <div class="sheet-actions">
      <button type="button" class="btn btn-primary" data-sheet-copy-open="1">복사하고 FactChat 열기 ↗</button>
      <button type="button" class="btn" data-sheet-copy="1">복사</button>
      <button type="button" class="btn btn-ghost hide-sm" data-sheet-save="1">파일로 저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
<script type="module" src="../lab.js"></script>
</body>
</html>
