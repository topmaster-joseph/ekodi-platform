<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="EKODI Education Premium Studio 발표 화면 — 강의·실습실 화면 전환, 발표자 노트, 다음 슬라이드, 실습 타이머, QR 접속 안내">
  <meta name="ekodi-ui-type" content="USER">
  <meta name="robots" content="noindex">
  <title>발표 화면 · EKODI Education Premium Studio</title>
  <link rel="stylesheet" href="../../../fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="../live.css">
</head>
<body class="lv pres-body" data-ekodi-ui="USER" data-live-surface="presenter">
<header class="lv-top" id="presTop" data-ekodi-fixed-header aria-label="발표 제어">
  <a class="lv-brand" id="backStudio" href="../"><span class="lv-brand-mark" aria-hidden="true">E</span><span><strong>발표 화면</strong><small id="presSession">Premium Studio</small></span></a>
  <span class="pill"><span class="sr-only">강의 경과</span><span class="lv-clock" id="presLecture">00:00</span></span>
  <span class="pill pres-timer" id="presTimerWrap"><span>실습</span><span class="lv-clock" id="presTimer" role="timer">--:--</span><small class="pres-timer-info" id="presTimerInfo">대기 중</small></span>
  <span class="pres-timer-ctl" role="group" aria-label="실습 타이머 조작"><button type="button" class="btn btn-small" id="pPause">일시정지</button><button type="button" class="btn btn-small" data-add="60000">+1분</button><button type="button" class="btn btn-small" id="pStop">실습 종료</button></span>
  <span class="grow"></span>
  <span class="kbd hide-sm" id="presCounter">- / -</span>
  <button type="button" class="btn" id="pPrev" aria-label="이전 슬라이드">←</button>
  <button type="button" class="btn" id="pNext" aria-label="다음 슬라이드">→</button>
  <button type="button" class="btn btn-primary" id="pPractice">실습 시작</button>
  <button type="button" class="btn" id="pBlack" aria-pressed="false">가리기</button>
  <button type="button" class="btn hide-sm" id="pFull">전체화면</button>
</header>
<main class="pres" id="presMain">
  <section class="stage" aria-label="현재 화면">
    <div class="stage-bar" id="stageBar" role="toolbar" aria-label="화면 전환 (청중 화면도 함께 바뀝니다)">
      <div class="seg" role="group" aria-label="무대 화면">
        <button type="button" class="seg-btn" data-stage-mode="slide" aria-pressed="true"><span class="kbd-hint">1</span>강의</button>
        <button type="button" class="seg-btn" data-stage-mode="lab" aria-pressed="false"><span class="kbd-hint">2</span>실습실</button>
        <button type="button" class="seg-btn" data-stage-mode="split" aria-pressed="false"><span class="kbd-hint">3</span>나란히</button>
        <button type="button" class="seg-btn" data-stage-mode="ai" aria-pressed="false"><span class="kbd-hint">4</span>AI 결과</button>
      </div>
      <button type="button" class="btn btn-small" id="pFactchat" title="공식 FactChat 사이트를 별도 탭으로 열거나 앞으로 가져옵니다 (G)">FactChat 화면 ↗</button>
      <span class="grow"></span>
      <span class="kbd hide-sm" id="stageHint">강의 슬라이드</span>
    </div>
    <div class="stage-frame" id="stage" aria-live="polite"></div>
  </section>
  <aside class="pres-side" id="presSide" aria-label="발표자 전용 정보 (청중 화면에는 표시되지 않음)">
    <section class="pres-card ai-card" id="aiCard"><h3>AI 시연 · FactChat 기관계정</h3>
      <p class="kbd" id="aiAuth">확인 중</p>
      <div class="pres-controls"><label class="sr-only" for="aiTrack">시연 분야</label><select id="aiTrack" class="ai-select"></select><button type="button" class="btn btn-small" id="aiLoad">현재 단계 프롬프트</button></div>
      <label class="sr-only" for="aiInput">실행할 프롬프트</label><textarea id="aiInput" class="ai-input" maxlength="8000" placeholder="프롬프트를 입력하거나 「현재 단계 프롬프트」를 누르세요."></textarea>
      <div class="pres-controls"><button type="button" class="btn btn-small btn-primary" id="aiRun">실행</button><button type="button" class="btn btn-small" id="aiShow">무대에 띄우기</button><a class="btn btn-small" id="aiLogin" hidden>최고관리자 로그인</a></div>
      <p class="kbd" id="aiStatus" role="status"></p>
    </section>
    <section class="pres-card"><h3>발표자 노트 · 수강생 비공개</h3><div id="presNotes"></div></section>
    <section class="pres-card"><h3>다음 슬라이드</h3><div class="next-frame" id="nextSlide"></div></section>
    <section class="pres-card"><h3>두 번째 화면 · 출력</h3>
      <div class="pres-controls">
        <button type="button" class="btn btn-small" id="pAudience">청중 화면 창 열기</button>
        <button type="button" class="btn btn-small" id="pNotes" aria-pressed="true">노트 숨기기</button>
        <button type="button" class="btn btn-small" id="pPrint">인쇄·PDF</button>
        <button type="button" class="btn btn-small" id="pSync">수동 동기화</button>
      </div>
      <p class="kbd">→/Space/PageDown 다음 · ←/PageUp 이전 · 1 강의 · 2 실습실 · 3 나란히 · 4 AI 결과 · G FactChat · B 가리기 · F 전체화면 · N 노트 · Home/End</p>
      <p class="kbd" id="presSync"></p>
    </section>
  </aside>
</main>
<div class="print-deck" id="printDeck" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
<script type="module" src="../present.js"></script>
</body>
</html>
