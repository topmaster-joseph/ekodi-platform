name = "ekodi-biz-legacy-redirect"
main = "biz-legacy-redirect.js"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false

# EKODIBIZ external legacy host topology:
# Existing A/AAAA/CNAME web DNS records remain owned by the Cloudflare zone;
# Worker Routes must be deployed with orange-cloud proxy on BOTH hosts.
# Public DNS-only answers were observed with TTL=300 seconds on 2026-10-24.
# Guarded deploy-biz-legacy workflow retries the live HTTPS 301 through that
# cache expiration window and rolls back only newly enabled proxy flags on failure.
# Do not replace these with custom_domain=true; that conflicts with existing
# DNS (Cloudflare API 100117). Never remove MX/TXT or web records as a shortcut.
[[routes]]
pattern = "ekodibiz.kr/*"
zone_name = "ekodibiz.kr"

[[routes]]
pattern = "www.ekodibiz.kr/*"
zone_name = "ekodibiz.kr"
