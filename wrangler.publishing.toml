name = "ekodi-publishing"
main = "publishing-worker.js"
compatibility_date = "2026-08-24"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "publishing.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[[services]]
binding = "BOOKS"
service = "ekodi-books"

[assets]
directory = "./publishing"
binding = "ASSETS"
run_worker_first = true

# 예약 준비 크론은 PUBLISH_DB 바인딩이 생긴 뒤 EKODI Orchestrator 승인 스케줄러로 연결한다(바인딩 없이 15분마다 빈 호출을 만들지 않음).
