name = "ekodi-publishing"
main = "publishing-worker.js"
compatibility_date = "2026-08-24"
workers_dev = true
preview_urls = false

# PUBLISHING-AI-WEEKLY-001: 출판 워커의 유일한 예약 작업(매일 03:37 KST). 원고 초안은 무료 한도 안에서만.
[triggers]
crons = ["37 18 * * *", "10 14 4 11 *"]

[ai]
binding = "AI"

[[routes]]
pattern = "publishing.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[[services]]
binding = "BOOKS"
service = "ekodi-books"

[assets]
directory = "./publishing"
binding = "ASSETS"
run_worker_first = true

# PUBLISH-PIPELINE-001: 출판 전용 원고·승인 원장(서점·결제 DB와 분리). 2026-10-31 사용자 승인으로 생성.
[[d1_databases]]
binding = "PUBLISH_DB"
database_name = "ekodi-publishing"
database_id = "658ba024-d5fa-4568-8679-07bf3f3b90ac"

# 예약 준비는 크론을 새로 만들지 않고 EKODI Orchestrator 승인 스케줄러가 맡는다(§13 중복 스케줄러 금지).

[vars]
PUBLISHING_AI_FACTORY_ENABLED = "true"
