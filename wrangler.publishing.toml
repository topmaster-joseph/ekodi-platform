name = "ekodi-publishing"
main = "publishing-worker.js"
compatibility_date = "2026-08-24"
workers_dev = true
preview_urls = false

# PUBLISHING-AI-WEEKLY-001: 출판 워커의 유일한 예약 작업(매일 09:40 KST, 무료 한도 초기화 직후). 원고 초안은 무료 한도 안에서만.
[triggers]
crons = ["40 0 * * *"]

[ai]
binding = "AI"

[[routes]]
pattern = "publishing.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true

[[services]]
binding = "BOOKS"
service = "ekodi-books"

# PUBLISHING-AI-RELEASE-001: 최종 검수 확인 시 출간본 EPUB을 서점 파일 저장소에 보관(서점 직접 판매가 읽는 곳).
[[r2_buckets]]
binding = "BOOK_FILES"
bucket_name = "ekodi-book-files"

# PUBLISHING-AI-VIA-CONTROL-001: AI 관리 장치의 출판 전용 진입점(무료 AI만, 하루 호출 상한). 공개 경로·비밀키 없음.
[[services]]
binding = "AI_CONTROL"
service = "ekodi-ai-control"
entrypoint = "PublishingWriter"

[assets]
directory = "./publishing"
binding = "ASSETS"
run_worker_first = true

# PUBLISH-PIPELINE-001: 출판 전용 원고·승인 원장(서점·결제 DB와 분리). 2026-10-31 사용자 승인으로 생성.
[[d1_databases]]
binding = "PUBLISH_DB"
database_name = "ekodi-publishing"
database_id = "658ba024-d5fa-4568-8679-07bf3f3b90ac"

# EKODI-WORKERS-AI-POOL-001: Workers AI 무료 한도 공용 장부(ai_provider_daily_budget 한 행)만 읽고 쓴다.
[[d1_databases]]
binding = "AI_LEDGER_DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"

# 예약 준비는 크론을 새로 만들지 않고 EKODI Orchestrator 승인 스케줄러가 맡는다(§13 중복 스케줄러 금지).

[vars]
PUBLISHING_AI_FACTORY_ENABLED = "true"
