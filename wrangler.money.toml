name = "ekodi-money"
main = "money-worker.js"
compatibility_date = "2026-08-24"
workers_dev = true
preview_urls = false


[vars]
DATA_MODE = "production"
AUTH_URL = "https://ekodi.kr/auth/?site=money&return_to=https%3A%2F%2Fekodi.kr%2Fmoney%2F"
ACCOUNTINFO_URL = "https://www.payinfo.or.kr/main/main.do"
KFTC_OPENBANKING_REDIRECT_URI = "https://ekodi.kr/money/oauth/kftc/callback"
KFTC_OPENBANKING_ADAPTER_READY = "false"

[[services]]
binding = "FINANCE"
service = "ekodi-finance-api"

[[services]]
binding = "KFTC_OPENBANKING_ADAPTER"
service = "ekodi-kftc-openbanking-adapter"

[assets]
directory = "./money"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
