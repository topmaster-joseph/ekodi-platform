services:
  browser-worker:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      EKODI_BROWSER_WORKER_TOKEN: ${EKODI_BROWSER_WORKER_TOKEN:?required}
      EKODI_BROWSER_ALLOWED_HOSTS: ${EKODI_BROWSER_ALLOWED_HOSTS:?required}
      EKODI_BROWSER_DATA_DIR: /data
    volumes:
      - browser-worker-data:/data
    shm_size: "1gb"

volumes:
  browser-worker-data:
