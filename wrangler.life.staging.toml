name = "ekodi-life-ai-staging"
main = "life-worker.js"
compatibility_date = "2026-08-26"
workers_dev = true
preview_urls = false

[vars]
DATA_ENABLED = "false"
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=life"
CORE_API_URL = "https://api.ekodi.kr"

[assets]
directory = "./life"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
