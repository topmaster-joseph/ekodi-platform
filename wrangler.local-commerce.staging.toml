name = "ekodi-local-commerce-staging"
main = "local-commerce-worker.js"
compatibility_date = "2026-09-11"
workers_dev = true
preview_urls = false

[vars]
DATA_MODE = "isolated-staging"
AUTH_URL = "https://auth.ekodi.kr/?site=local-commerce"
API_BASE = "https://api.ekodi.kr/api/local-commerce"

[assets]
directory = "./local-commerce"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
