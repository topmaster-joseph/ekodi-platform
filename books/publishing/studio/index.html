<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에코디출판 스튜디오</title><meta name="description" content="누구나 책을 만들고 자기 온라인 서점을 운영하는 에코디출판 스튜디오"><link rel="stylesheet" href="/publishing/studio/styles.css"></head><body><header class="top"><a href="/publishing/" class="brand">에코디출판</a><nav><a href="/publishing/">출판</a><a href="/publishing/upaper/">UPaper</a><a href="/">에코디서점</a></nav></header><main><section class="hero"><p class="eyebrow">에코디출판</p><h1>책을 만들고,<br>나의 서점을 엽니다.</h1><p>원고와 저작권은 창작자에게 남습니다. AI는 선택 가능한 도구이고, 출판 기록과 서점은 AI 없이도 계속 작동합니다.</p><div id="sessionState" class="notice">EKODI 계정을 확인하고 있습니다.</div></section><section id="workspace" hidden><div class="grid"><article class="panel"><h2>새 서점</h2><form id="storeForm"><label>서점 이름<input name="name" required maxlength="120" placeholder="나의 작은 서점"></label><label>주소 슬러그<input name="slug" maxlength="80" placeholder="my-books"></label><label>소개<textarea name="description" rows="3" maxlength="1200"></textarea></label><button>서점 만들기</button></form></article><article class="panel"><h2>새 책</h2><form id="bookForm"><label>제목<input name="title" required maxlength="200"></label><label>저자명<input name="author" required maxlength="160"></label><label>서점<select name="storeId" id="storeSelect"><option value="">나중에 선택</option></select></label><label>책 소개<textarea name="description" rows="3" maxlength="4000"></textarea></label><label>표지 이미지 URL<input name="coverImage" type="url"></label><label>판매가<input name="priceKrw" type="number" min="0" step="100" value="0"></label><label>판매 링크<input name="buyUrl" type="url" placeholder="외부 유통처 또는 결제 링크"></label><div class="actions"><button value="DRAFT">초안 저장</button><button value="SUBMITTED" class="primary">출간 검토 요청</button></div></form></article></div><section class="panel"><div class="section-head"><div><p class="eyebrow">DISTRIBUTION</p><h2>외부 유통</h2></div><a class="ghost" href="/publishing/upaper/">유페이퍼 빠른등록</a></div><p>기기 환경을 자동 감지해 PC에서는 자동입력 흐름을, Android 등 모바일에서는 복사·공유 중심 빠른입력을 제공합니다.</p></section><section class="panel"><div class="section-head"><div><p class="eyebrow">MY NETWORK</p><h2>내 서점과 책</h2></div><button id="refreshButton" type="button" class="ghost">새로고침</button></div><div id="storeList" class="cards"></div><div id="bookList" class="cards"></div></section></section></main><footer>EKODIBIZ · 에코디출판 · 에코디서점</footer><script type="module" src="/publishing/studio/app.js"></script></body></html>
