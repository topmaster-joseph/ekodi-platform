name = "ekodi-ops-api"
main = "ops-worker.js"
compatibility_date = "2026-08-12"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "ops-api.ekodi.kr"
custom_domain = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://admin.ekodi.kr,https://admin.biz.ekodi.kr,https://admin.church.ekodi.kr,https://admin.lab.ekodi.kr,https://admin.trade.ekodi.kr"

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"
