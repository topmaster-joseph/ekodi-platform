name = "ekodi-seonammedi-domain-redirect"
main = "seonammedi-domain-gateway.js"
compatibility_date = "2026-08-11"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "seonammedi.kr"
zone_name = "seonammedi.kr"
custom_domain = true

[[routes]]
pattern = "xn--3e0b8b58jw4co4mnpll3k.kr"
zone_name = "xn--3e0b8b58jw4co4mnpll3k.kr"
custom_domain = true

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
