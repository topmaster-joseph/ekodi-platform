name = "ekodi-service-proxy"
main = "service-proxy.js"
compatibility_date = "2026-08-11"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Direct service only. Redirect-only subdomain routes are forbidden.
[[routes]]
pattern = "biz.ekodi.kr"
zone_name = "ekodi.kr"
custom_domain = true
