name = "ekodi-church-history"
main = "church-history-worker.js"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://ekodi.kr"

[[routes]]
pattern = "ekodi.kr/ekodichurch/history*"
zone_name = "ekodi.kr"

[[routes]]
pattern = "ekodi.kr/ekodichurch/admin/history*"
zone_name = "ekodi.kr"

[[routes]]
pattern = "ekodi.kr/api/church/admin/history*"
zone_name = "ekodi.kr"

[[d1_databases]]
binding = "DB"
database_name = "ekodi-auth"
database_id = "e38778f1-b059-4fe7-8816-300f3eec6e19"
migrations_dir = "migrations"

# EKODI-EDGE-TRAFFIC-SHIELD-001 — same namespaces as the Shared Site, so a client's
# budget is counted once across ekodi.kr no matter which Worker answers the route.
[[ratelimits]]
name = "PLATFORM_PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "3902"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "PLATFORM_SENSITIVE_RATE_LIMITER"
namespace_id = "3903"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "TRAFFIC_CLIENT_RATE_LIMITER"
namespace_id = "3913"
[ratelimits.simple]
limit = 600
period = 10

[[ratelimits]]
name = "TRAFFIC_NETWORK_RATE_LIMITER"
namespace_id = "3914"
[ratelimits.simple]
limit = 2000
period = 10
